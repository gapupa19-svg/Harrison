a superiores a 2 ng/ml orientan a un origen bacteriano.","Valores de ácido láctico elevados indican mal pronóstico.","No se deben monitorizar los niveles de ácido láctico a las 2-4 horas para guiar la reanimación."],"c":"D","e":"Las guías de la Surviving Sepsis Campaign recomiendan justo lo contrario: remedir el lactato a las 2-4 horas cuando el valor inicial está elevado, ya que su aclaramiento es un objetivo terapéutico que ayuda a guiar la reanimación hemodinámica."},{"q":"Mujer de 73 años con escalofríos y tos productiva purulenta de 2 días. Somnolienta pero reactiva; TA 84/50, FC 118, FR 22, SatO2 93%; crepitantes en base derecha. Señale la respuesta VERDADERA:","o":["La administración precoz de fluidos intravenosos es esencial, siendo la meta mantener una PAM \\>65 mmHg.","Con un lactato de 5,6 mmol/l, mientras mantenga estabilidad hemodinámica no debemos preocuparnos.","La ausencia de fiebre descarta el diagnóstico de sepsis.","La antibioticoterapia de amplio espectro en la primera hora no se ha relacionado con disminución de la mortalidad."],"c":"A","e":"La reanimación precoz con fluidos, con el objetivo de PAM ≥65 mmHg, es un pilar fundamental del manejo inicial del shock séptico. Un lactato de 5,6 mmol/l es una hiperlactacidemia grave que exige actuación inmediata pese a la estabilidad hemodinámica aparente; la ausencia de fiebre no descarta sepsis (puede haber normotermia o incluso hipotermia); y cada hora de retraso en el inicio de antibioterapia adecuada se ha asociado a mayor mortalidad."},{"q":"Señale la FALSA en relación con la espondilodiscitis infecciosa:","o":["La prueba diagnóstica de elección es la RMN.","El aislamiento en hemocultivos de un microorganismo compatible se asume como diagnóstico microbiológico.","Ante clínica y RMN compatibles, sin datos de sepsis y con hemocultivos negativos, es fundamental establecer el diagnóstico microbiológico con biopsia guiada por imagen antes de iniciar antibioterapia.","Los bacilos gramnegativos han superado en frecuencia etiológica a los cocos grampositivos."],"c":"D","e":"Staphylococcus aureus y otros cocos grampositivos siguen siendo, con diferencia, los microorganismos más frecuentes en la espondilodiscitis piógena; los bacilos gramnegativos no los han superado en frecuencia global, aunque son relevantes en contextos concretos (ITU complicada, ancianos, inmunodeprimidos)."},{"q":"En relación a la procalcitonina, ¿cuál de las siguientes afirmaciones es FALSA?","o":["Es un péptido precursor de la calcitonina secretado por las células claras del «páncreas».","Comienza a elevarse a las 2-4 horas del inicio del cuadro séptico, con pico máximo a las 24 horas.","Tiene mayor sensibilidad y especificidad que la PCR en el diagnóstico de sepsis.","Se puede elevar en otras situaciones como traumatismo, cirugía, quemaduras o golpe de calor."],"c":"A","e":"La procalcitonina es secretada por las células C (parafoliculares) de la glándula TIROIDES, no del páncreas; el resto de afirmaciones sobre su cinética, su mejor rendimiento frente a la PCR y sus causas de elevación no infecciosa son correctas."},{"q":"Con respecto al síndrome de TRALI (lesión pulmonar aguda relacionada con la transfusión), indique la respuesta FALSA:","o":["Se debe a anticuerpos antineutrófilos presentes en el producto hemoderivado.","Se manifiesta con disnea súbita, hipoxemia e infiltrados pulmonares durante la transfusión o en las 6 horas siguientes.","Debe distinguirse de la sobrecarga volumétrica asociada a la transfusión.","El tratamiento consiste en la administración de corticoides."],"c":"D","e":"El TRALI se maneja fundamentalmente con medidas de SOPORTE respiratorio (oxigenoterapia, ventilación mecánica si precisa) y suspensión de la transfusión; los corticoides no han demostrado un beneficio establecido y no constituyen el tratamiento del cuadro."},{"q":"En relación con la herramienta NEWS2, señale la CIERTA:","o":["La temperatura mayor de 39ºC y menor de 35ºC puntúan igual.","Una puntuación de 3 sugiere un riesgo moderado de muerte por sepsis.","La taquicardia está incluida en el score, pero no así la bradicardia.","Una puntuación de 3 en cualquier parámetro individual («red flag») puede indicar mayor riesgo de deterioro clínico."],"c":"D","e":"El diseño de NEWS2 incluye la posibilidad de que un único parámetro muy alterado («red score» de 3 puntos en un solo ítem) dispare una alerta de mayor riesgo de deterioro, aunque la puntuación total agregada sea baja, precisamente para no infravalorar alteraciones aisladas graves."},{"q":"Mujer de 80 años ingresada por sepsis urinaria en la que la escala CAM resulta positiva. Señale la afirmación correcta:","o":["El delirium es frecuente en servicios médicos, pero no en los quirúrgicos.","Su prevalencia está infraestimada, sobre todo en sus formas hipoactivas.","Su presencia se asocia a menor riesgo de mortalidad durante el ingreso.","No existen medidas preventivas eficaces, por lo que el tratamiento es lo determinante."],"c":"B","e":"El delirium hipoactivo (el más frecuente en ancianos) se infradetecta sistemáticamente porque no genera agitación llamativa; el delirium es frecuente tanto en servicios médicos como quirúrgicos, se asocia a MAYOR mortalidad y morbilidad, y sí existen medidas preventivas no farmacológicas eficaces (reorientación, movilización precoz, evitar polifarmacia, higiene del sueño)."},{"q":"Varón de 65 años con adenocarcinoma de pulmón en quimioterapia, consulta por malestar y disnea. Tª 36ºC, TA 80/40, FC 110, SatO2 85%; infiltrado basal derecho. Señale la correcta:","o":["El tratamiento empírico debe tener el espectro más limitado posible para evitar resistencias.","No se trata de una sepsis ya que el paciente está afebril.","Hay que iniciar tratamiento con vasopresores de forma inmediata, sin más medidas.","Hay que iniciar reanimación con 500 ml de cristaloides en 15 minutos."],"c":"D","e":"Este paciente presenta un shock séptico (hipotensión, taquicardia, hipoxemia con infiltrado) pese a estar afebril, lo que no descarta la sepsis, especialmente en pacientes oncológicos. El primer paso es la reanimación precoz con cristaloides en bolo, y el tratamiento antibiótico empírico debe ser de amplio espectro dado el riesgo vital."},{"q":"En relación a las recomendaciones sobre el tiempo de administración de antibióticos en la sepsis, según el riesgo estimado por la escala NEWS2, señale la correcta:","o":["Para las personas con alto riesgo, deben administrarse en las dos primeras horas.","Para las personas de riesgo moderado, deben administrarse en las dos primeras horas.","Para las personas con bajo riesgo, deben administrarse en las seis primeras horas de forma sistemática.","Con independencia del nivel de riesgo, deben administrarse en las dos primeras horas."],"c":"A","e":"Los protocolos de sepsis basados en NEWS2 (p. ej. UK Sepsis Trust) establecen una actuación escalonada según el riesgo: en los pacientes de alto riesgo («red flag sepsis») la antibioterapia debe administrarse de forma inmediata y, en cualquier caso, dentro de las primeras horas tras la identificación; el riesgo moderado y bajo permiten un margen de valoración clínica más amplio antes de decidir el tratamiento."},{"q":"Señale aquello que NO es típico en la sepsis:","o":["Hipoxemia, infiltrados pulmonares bilaterales y elevación de la presión capilar pulmonar de enclavamiento.","Oliguria.","Delirio.","Íleo paralítico."],"c":"A","e":"Esta combinación describe un edema pulmonar CARDIOGÉNICO; en el SDRA asociado a sepsis la presión capilar pulmonar de enclavamiento es típicamente normal o baja (edema de origen no hidrostático), lo que la distingue del edema cardiogénico. Oliguria, delirio e íleo paralítico sí son manifestaciones típicas de la disfunción orgánica séptica."},{"q":"En relación con las infecciones de piel y partes blandas, señale la respuesta FALSA:","o":["Ante infección de una herida con shock séptico y hemólisis intravascular intensa hay que pensar en Clostridium perfringens.","Ante una celulitis de la mano tras mordedura de gato siempre hay que cubrir S. aureus, Streptococcus pyogenes y Pasteurella multocida.","Una linfangitis nodular en un jardinero sugiere la posibilidad de Sporothrix schenckii.","En un paciente cirrótico que desarrolla sepsis tras una mordedura de perro hay que sospechar Streptobacillus moniliformis."],"c":"D","e":"El microorganismo clásicamente asociado a sepsis fulminante tras mordedura de perro en pacientes cirróticos o asplénicos es Capnocytophaga canimorsus, no Streptobacillus moniliformis (que se relaciona con la fiebre por mordedura de rata). El resto de asociaciones (C. perfringens en mionecrosis con hemólisis, cobertura tras mordedura de gato, esporotricosis del jardinero) son correctas."},{"q":"Señale lo cierto en cuanto a la sepsis:","o":["Las infecciones abdominales son la causa más frecuente.","Los hemocultivos son positivos en más del 75% de los casos.","Staphylococcus aureus y Streptococcus pneumoniae son los aislados grampositivos más comunes.","Las enfermedades crónicas no son determinantes en la evolución de la sepsis."],"c":"C","e":"Entre los microorganismos grampositivos aislados en la sepsis, S. aureus y S. pneumoniae figuran entre los más frecuentes. El foco respiratorio (no el abdominal) es globalmente el más frecuente en la sepsis comunitaria, los hemocultivos son positivos solo en un 30-50% de los episodios, y la comorbilidad crónica es un factor pronóstico determinante en la evolución."},{"q":"Señale la respuesta CORRECTA respecto al diagnóstico de la bacteriemia relacionada con catéter:","o":["El exudado del punto de inserción junto con un hemocultivo positivo son diagnósticos por sí solos de bacteriemia de catéter.","Los estafilococos coagulasa negativos y otros colonizadores ambientales pueden no tener significación pese a que el hemocultivo sea positivo.","Se recomienda cultivar la parte proximal del catéter por su mayor rentabilidad diagnóstica.","Un tiempo de crecimiento 1,5 horas más rápido en el hemocultivo del catéter respecto al de venopunción es diagnóstico de bacteriemia de catéter."],"c":"B","e":"Los estafilococos coagulasa negativos son contaminantes muy frecuentes de los hemocultivos, por lo que su aislamiento aislado (sobre todo en una sola muestra) puede no tener significación clínica real. El segmento que se cultiva con mayor rentabilidad es la PUNTA (distal) del catéter, no la proximal, y el criterio de tiempo diferencial de positividad (DTP) diagnóstico de bacteriemia relacionada con catéter es ≥2 horas, no 1,5 horas."},{"q":"¿Cuáles son los criterios diagnósticos de la sepsis según la definición actual (Sepsis-3)?","o":["Presencia de fiebre y aumento del recuento de glóbulos blancos.","Hemocultivo positivo que detecte una infección bacteriana.","Evidencia de disfunción orgánica (aumento del SOFA) junto con infección sospechada o confirmada.","Niveles elevados de marcadores proinflamatorios como la proteína C reactiva."],"c":"C","e":"La definición Sepsis-3 (2016) abandona los antiguos criterios SIRS y define la sepsis como una disfunción orgánica potencialmente mortal (objetivada por un incremento ≥2 puntos en la escala SOFA) causada por una respuesta desregulada del huésped a una infección sospechada o confirmada; ni la fiebre ni un hemocultivo positivo aislado son, por sí solos, criterios diagnósticos."},{"q":"En el manejo inicial de un paciente con shock séptico en urgencias, señale la afirmación INCORRECTA:","o":["Se debe determinar el lactato sérico como marcador de hipoperfusión tisular.","Se debe realizar toma precoz (1ª hora) de muestras para cultivo e inicio de antibioterapia de amplio espectro.","La reposición de volumen se debe realizar con cristaloides dentro de las 3 primeras horas.","Se recomienda la dopamina como vasopresor de primera elección."],"c":"D","e":"Las guías actuales (Surviving Sepsis Campaign) recomiendan la NOREPINEFRINA como vasopresor de primera elección en el shock séptico, no la dopamina, que se asocia a mayor riesgo de arritmias y no ha demostrado ventajas de supervivencia."},{"q":"En un paciente en shock séptico con un foco infeccioso abordable, ¿cuál de los siguientes enunciados es cierto?","o":["El control del foco solo se intentará una vez que el paciente haya alcanzado la estabilidad hemodinámica.","El control del foco se realizará tras al menos la administración de dos dosis de antibiótico.","El control del foco se realizará tan pronto como sea posible.","Si el shock séptico lleva más de 12 horas de evolución, el control del foco ya no será beneficioso."],"c":"C","e":"El control precoz del foco infeccioso (drenaje de absceso, retirada de dispositivo infectado, desbridamiento quirúrgico, etc.) es un pilar fundamental del manejo del shock séptico y debe realizarse tan pronto como sea posible, en paralelo a la reanimación hemodinámica y la antibioterapia, sin esperar a la estabilización completa ni a un número determinado de dosis de antibiótico."},{"q":"Hombre de 60 años con bacteriemia relacionada con catéter venoso central. Todos los frascos de hemocultivos muestran cocos grampositivos en racimos; la PCR directa detecta ADN de S. aureus y positividad del gen mecA. ¿Cuál es la interpretación correcta?","o":["Se trata de un microorganismo productor de betalactamasa, por lo que se puede iniciar tratamiento con cualquier betalactámico excepto penicilina/amoxicilina.","Hay que asumir resistencia a todos los betalactámicos y carbapenémicos, con excepción de ceftarolina y ceftobiprol.","El tratamiento con amoxicilina-ácido clavulánico intravenoso es la opción más recomendable.","Se puede iniciar tratamiento con un antibiótico de amplio espectro como meropenem."],"c":"B","e":"La positividad del gen mecA identifica a Staphylococcus aureus resistente a meticilina (SARM), lo que implica resistencia a todos los betalactámicos habituales (penicilinas, cefalosporinas y carbapenémicos), con la excepción de las cefalosporinas anti-SARM de quinta generación (ceftarolina, ceftobiprol); el tratamiento de elección será, por tanto, vancomicina, daptomicina u otro antiestafilocócico anti-SARM, no un betalactámico convencional."},{"q":"Varón de 62 años con fiebre, escalofríos, taquicardia, taquipnea, TA 90/60, leucocitosis con desviación izquierda, sin soplos ni neumonía en la Rx. Antecedente de ITU de repetición y tratamiento reciente con cefuroxima. Hemocultivos y orina positivos para cocos grampositivos en cadenas. ¿Qué recomendaría a la espera del resultado definitivo?","o":["Continuar con cefuroxima a la espera del resultado definitivo.","Cambiar a ertapenem, pensando en microorganismos multirresistentes.","Cambiar a un tratamiento antimicrobiano de amplio espectro que cubra Enterococcus spp.","Asociar gentamicina, al presentar el paciente datos de sepsis."],"c":"C","e":"Los cocos grampositivos en cadenas, en un paciente con infecciones urinarias de repetición y fracaso con cefuroxima (fármaco sin actividad frente a Enterococcus, que es intrínsecamente resistente a las cefalosporinas), orientan fuertemente a Enterococcus spp. como agente causal, por lo que debe ampliarse la cobertura antimicrobiana para cubrir este microorganismo."},{"q":"¿Cuál de los siguientes criterios NO es indicación de ingreso en UCI en un paciente con neumonía extrahospitalaria?","o":["Frecuencia respiratoria superior a 30 respiraciones/minuto.","PaO2 arterial superior a 50 mmHg respirando aire ambiente.","Shock séptico.","Alteración de la conciencia con dificultad para la expectoración."],"c":"B","e":"Una PaO2 SUPERIOR a 50 mmHg no indica hipoxemia grave; el criterio de gravedad clásico (criterios ATS) es una PaO2 inferior a 60 mmHg respirando aire ambiente, y especialmente una PaO2 \\<50 mmHg reflejaría insuficiencia respiratoria grave que sí sería indicación de UCI. Taquipnea \\>30 rpm, shock séptico y alteración de conciencia con incapacidad para manejar secreciones sí son criterios de ingreso en UCI."},{"q":"¿Cuál de los siguientes es un criterio incluido en la escala SOFA (Sequential Organ Failure Assessment) para valorar el fracaso orgánico en la sepsis?","o":["Saturación periférica de oxígeno.","Niveles séricos de procalcitonina.","Recuento de plaquetas.","Recuento de leucocitos."],"c":"C","e":"El recuento de plaquetas es uno de los seis componentes del SOFA (junto con PaO2/FiO2, bilirrubina, presión arterial/necesidad de vasopresores, escala de Glasgow y creatinina/diuresis), reflejando la disfunción de la coagulación; ni la SatO2 periférica aislada, ni la procalcitonina, ni el recuento de leucocitos forman parte de esta escala."},{"q":"Señale la respuesta FALSA respecto a la escala quick SOFA (qSOFA):","o":["Es una herramienta sencilla para detectar pacientes con sospecha de infección y alto riesgo de malos resultados fuera de la UCI.","Incluye criterios clínicos y analíticos.","La presencia de 2 o más puntos tiene un valor predictivo similar al de la escala SOFA para detectar pacientes con probabilidad de evolución desfavorable.","La medición del lactato no aumenta su validez predictiva, pero podría ayudar a identificar a pacientes con riesgo intermedio."],"c":"B","e":"El qSOFA se diseñó deliberadamente para incluir SOLO tres criterios clínicos, sin necesidad de pruebas de laboratorio: frecuencia respiratoria ≥22 rpm, alteración del nivel de consciencia y presión arterial sistólica ≤100 mmHg; esa es precisamente su ventaja práctica (aplicable «a pie de cama», fuera de UCI, sin esperar analítica)."},{"q":"En cuanto a la bacteriemia nosocomial, señale la opción CORRECTA:","o":["La mortalidad suele ser baja (\\<5%), independientemente del germen y la situación del paciente.","Las bacteriemias primarias (sin foco establecido o de origen en catéter vascular) suponen menos del 10% de las bacteriemias nosocomiales.","Los estafilococos coagulasa negativos son más frecuentes que Staphylococcus aureus.","Los principales agentes de las bacteriemias primarias son los bacilos gramnegativos."],"c":"C","e":"Los estafilococos coagulasa negativos (fundamentalmente relacionados con catéteres) son, de forma consistente, el grupo microbiológico más frecuentemente aislado en la bacteriemia nosocomial, por delante de S. aureus. Las bacteriemias primarias/relacionadas con catéter suponen una proporción sustancial (bastante superior al 10%) del total, la mortalidad de la bacteriemia nosocomial es significativamente mayor al 5% descrito, y su etiología predominante es GRAMPOSITIVA (estafilococos), no bacilos gramnegativos."}]},"8":{"title":"Síndromes infecciosos adquiridos en la comunidad. Diarrea aguda infecciosa. Enfermedades de transmisión sexual.","questions":[{"q":"En relación con el tratamiento antibiótico en la diarrea aguda infecciosa, señale la opción FALSA:","o":["No se recomienda de forma rutinaria la antibioticoterapia empírica, ya que la mayoría de las diarreas comunitarias son de origen viral.","Se debe considerar tratamiento antibiótico empírico en la diarrea entero-invasiva con criterios de gravedad.","Si se sospecha infección por E. coli enterohemorrágica, el tratamiento antibiótico debe iniciarse precozmente.","El tratamiento antibiótico empírico puede realizarse con una quinolona."],"c":"C","e":"En la infección por E. coli enterohemorrágica (productora de toxina Shiga) el tratamiento antibiótico está generalmente CONTRAINDICADO o debe evitarse, ya que puede aumentar la liberación de toxina bacteriana y el riesgo de síndrome hemolítico-urémico; el resto de afirmaciones sobre el manejo antibiótico de la diarrea aguda son correctas."},{"q":"En relación con el diagnóstico serológico de la sífilis, es FALSO que:","o":["Las pruebas no treponémicas son indicador de actividad de la enfermedad.","Las pruebas treponémicas son más específicas y precoces que las no treponémicas.","Las pruebas no treponémicas permiten hacer seguimiento de la respuesta al tratamiento.","Las pruebas no treponémicas permanecen positivas de por vida."],"c":"D","e":"Son, en realidad, las pruebas TREPONÉMICAS (FTA-ABS, TPHA/TPPA) las que suelen permanecer positivas de por vida (fenómeno de «cicatriz serológica») incluso tras el tratamiento curativo; las pruebas no treponémicas (RPR/VDRL), en cambio, descienden en título y a menudo se negativizan tras un tratamiento eficaz, por lo que son las que se emplean para el seguimiento de la respuesta terapéutica."},{"q":"Marinero de 37 años con úlcera de 1 cm en el prepucio, muy dolorosa, de bordes irregulares y fondo con exudado necrótico, junto con adenopatía inguinal izquierda inflamatoria y dolorosa. Contactos sexuales con prostitutas en Jamaica hace una semana. Señale la opción CORRECTA:","o":["Se trata de una sífilis primaria; administraría penicilina G benzatina 2,4 MU im en dosis única.","Se trata de un chancroide (chancro blando); administraría azitromicina 1 g vía oral en dosis única.","Se trata de una donovanosis; administraría azitromicina 1 g vía oral semanal durante 3 semanas.","Se trata de un linfogranuloma venéreo; administraría doxiciclina 100 mg vía oral cada 12 horas durante 21 días."],"c":"B","e":"Una úlcera genital DOLOROSA, de bordes irregulares y fondo necrótico-purulento, acompañada de adenopatía inguinal inflamatoria dolorosa (bubón), es la presentación clásica del chancroide por Haemophilus ducreyi; a diferencia de la sífilis primaria, cuyo chancro es típicamente INDOLORO y de bordes limpios. El tratamiento de elección del chancroide es la azitromicina en dosis única."},{"q":"Pueden producir úlceras genitales:","o":["Sífilis (Treponema pallidum).","Haemophilus ducreyi (chancroide).","Klebsiella granulomatis (donovanosis).","Todos los anteriores."],"c":"D","e":"Las tres entidades citadas ---sífilis, chancroide y donovanosis (granuloma inguinal)--- son causas clásicas de úlcera genital de transmisión sexual, cada una con características clínicas distintivas (indolora en sífilis, dolorosa con bubón en chancroide, progresiva y sangrante en donovanosis)."},{"q":"En la fase secundaria de la sífilis, ¿cuál de las siguientes manifestaciones clínicas es característica?","o":["Condiloma acuminado.","Aortitis.","Alopecia difusa («en claros»).","Gomas hepáticos."],"c":"C","e":"La alopecia difusa o «apolillada» es una manifestación característica de la sífilis secundaria. El condiloma acuminado se debe al VPH (no a la sífilis, cuya lesión análoga es el condiloma plano); la aortitis y los gomas son manifestaciones de la sífilis terciaria, no de la secundaria."},{"q":"Las uretritis no gonocócicas se producen con mayor frecuencia por:","o":["Bacilos gramnegativos.","Estafilococos.","Chlamydia y Mycoplasma.","Trichomonas."],"c":"C","e":"Chlamydia trachomatis y Mycoplasma genitalium son las causas más frecuentes de uretritis no gonocócica, por delante de Trichomonas vaginalis, que también puede causarla pero con menor frecuencia."},{"q":"Ante una pupila pequeña (1-2 mm), irregular, que no responde a la luz pero conserva el reflejo de acomodación, ¿en qué entidad pensaría?","o":["Sífilis (pupila de Argyll-Robertson).","Intoxicación por opiáceos.","Intoxicación etílica aguda.","Meningitis tuberculosa."],"c":"A","e":"La pupila de Argyll-Robertson (miótica, irregular, con disociación luz-cerca: no reacciona a la luz pero sí a la acomodación/convergencia) es un signo clásico de la neurosífilis terciaria (tabes dorsal), por afectación de las vías pupilares mesencefálicas."},{"q":"¿Cuál de las siguientes afecciones es una causa común de diarrea aguda?","o":["Síndrome del intestino irritable.","Úlcera péptica.","Diverticulitis.","Gastroenteritis vírica."],"c":"D","e":"La gastroenteritis vírica (rotavirus, norovirus, adenovirus, entre otros) es, con diferencia, la causa más frecuente de diarrea aguda en la comunidad, muy por delante de otras entidades no infecciosas que no cursan típicamente con diarrea aguda."},{"q":"¿Cuál de las siguientes enfermedades se transmite principalmente a través de la orina y heces de animales infectados?","o":["Sífilis.","Leptospirosis.","Borreliosis.","Infecciones por Rickettsias."],"c":"B","e":"La leptospirosis se transmite por contacto directo o indirecto (agua, suelo contaminados) con orina de animales infectados, especialmente roedores; es la zoonosis descrita cuya vía de transmisión coincide exactamente con la excreta animal."},{"q":"¿Cuál de las siguientes enfermedades puede causar fiebre, dolor muscular intenso y conjuntivitis?","o":["Sífilis.","Leptospirosis.","Borreliosis.","Infecciones por Rickettsias."],"c":"B","e":"La tríada de fiebre, mialgias intensas (característicamente en pantorrillas) e inyección/hiperemia conjuntival es muy característica de la leptospirosis, especialmente en sus formas más graves como el síndrome de Weil."},{"q":"¿Cuál de las siguientes bacterias NO está relacionada con una enfermedad de transmisión sexual?","o":["Chlamydia pneumoniae.","Treponema pallidum.","Neisseria gonorrhoeae.","Haemophilus ducreyi."],"c":"A","e":"Chlamydia pneumoniae es un patógeno respiratorio (causa de neumonía atípica), no de transmisión sexual, a diferencia de Chlamydia trachomatis (que sí lo es); T. pallidum, N. gonorrhoeae y H. ducreyi son agentes clásicos de infecciones de transmisión sexual."},{"q":"¿Cuál de las siguientes opciones es un síntoma común de la sífilis primaria?","o":["Úlcera genital indolora (chancro duro).","Erupción cutánea en palmas de las manos.","Fiebre y dolor de cabeza.","Disuria."],"c":"A","e":"La lesión característica de la sífilis primaria es el chancro: una úlcera genital única, de bordes indurados, indolora y de base limpia; la erupción palmoplantar es propia de la sífilis SECUNDARIA, no de la primaria."}]},"9":{"title":"Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.","questions":[{"q":"¿Cuál de estas afirmaciones es CORRECTA en el diagnóstico de la neumonía adquirida en la comunidad (NAC)?","o":["La presencia de infiltrado radiológico en un paciente con clínica compatible no es necesaria para su diagnóstico.","En pacientes con factores de riesgo se debe realizar despistaje de colonización nasal por SARM mediante PCR nasal; su alto valor predictivo negativo permite la desescalada antibiótica con seguridad.","Hay que realizar siempre un estudio etiológico completo.","Los hemocultivos tienen una alta tasa de positividad en la NAC."],"c":"B","e":"La PCR nasal de despistaje de SARM tiene un elevado valor predictivo negativo, por lo que su negatividad permite desescalar con seguridad la cobertura empírica anti-SARM en la NAC; no se requiere estudio etiológico completo en todos los casos (solo en NAC grave o con factores de riesgo específicos), y los hemocultivos son positivos en apenas un 5-14% de los casos de NAC."},{"q":"¿Qué microorganismo considera más probable en un paciente de medio rural, con endocarditis mitral, sin tratamiento antibiótico previo, en el que los hemocultivos son repetidamente negativos?","o":["Staphylococcus aureus.","Escherichia coli.","Coxiella burnetii.","Candida albicans."],"c":"C","e":"Coxiella burnetii, agente de la fiebre Q, es una causa clásica de endocarditis con hemocultivos negativos (microorganismo intracelular estricto, no cultivable por métodos convencionales), especialmente relevante en pacientes de medio rural con contacto con ganado; el diagnóstico se basa en serología o PCR."},{"q":"Celadora de planta que ingresa por fiebre con tiritona, náuseas y dolor en hipocondrio derecho de 2 semanas de evolución, con episodio de dolor hipogástrico autolimitado con diarrea hace un mes. TAC: trombosis portal aguda derecha y lesiones focales hepáticas hipocaptantes, junto con divertículos en sigma con signos inflamatorios discretos. Señale la afirmación más probable:","o":["Se trata de una colecistitis aguda; se avisa a cirugía general.","Se trata de una pileflebitis secundaria a diverticulitis aguda; se inicia antibioticoterapia.","Se trata de una trombosis portal en el contexto de una cirrosis hepática; se anticoagula.","Se trata de un síndrome de Budd-Chiari; se solicita estudio de trombofilia."],"c":"B","e":"El antecedente de diverticulitis reciente, junto con trombosis portal derecha y abscesos hepáticos (lesiones hipocaptantes), configura el cuadro clásico de pileflebitis (tromboflebitis séptica de la vena porta) secundaria a un foco infeccioso intraabdominal de drenaje portal, que requiere antibioterapia de amplio espectro."},{"q":"En relación a las infecciones urinarias (ITU) asociadas a cuidados sanitarios, señale la afirmación FALSA:","o":["Uno de los principales factores de riesgo es la presencia de un catéter urinario.","Aunque pueden aparecer en ambos sexos, predomina en las mujeres.","Generalmente, las bacterias implicadas presentan la misma virulencia que en las ITU no asociadas a cuidados sanitarios.","Es frecuente la presencia de BLEE y resistencia a fluoroquinolonas."],"c":"C","e":"Las bacterias implicadas en las ITU asociadas a cuidados sanitarios suelen presentar mayor resistencia y perfiles de virulencia distintos (multirresistencia, productoras de BLEE) respecto a las ITU comunitarias no complicadas, precisamente por la presión selectiva de antibióticos previos y el contacto con el entorno sanitario."},{"q":"¿Cuál de las siguientes pruebas, por sí sola, NO es diagnóstica de certeza de una endocarditis por Coxiella burnetii?","o":["PCR positiva en sangre.","PCR positiva en válvula cardíaca.","Cultivo positivo en válvula.","Inmunohistoquímica positiva en tejido valvular."],"c":"A","e":"Una PCR positiva en SANGRE solo confirma bacteriemia/infección aguda por C. burnetii, pero no localiza la infección a nivel valvular; en cambio, la positividad de PCR, cultivo o inmunohistoquímica directamente en el TEJIDO VALVULAR sí constituyen criterios diagnósticos de certeza de endocarditis."},{"q":"Los bacilos gramnegativos se implican con mayor frecuencia que los cocos grampositivos en:","o":["Artritis séptica.","Neumonía nosocomial.","Meningitis extrahospitalaria.","Endocarditis sobre válvula protésica."],"c":"B","e":"En la neumonía nosocomial predominan los bacilos gramnegativos (Pseudomonas aeruginosa, enterobacterias), a diferencia de la artritis séptica, la meningitis extrahospitalaria y la endocarditis (incluida la de válvula protésica), donde los cocos grampositivos son, en conjunto, más frecuentes."},{"q":"¿Cuál es el antimicrobiano más activo en la endocarditis por Staphylococcus aureus resistente a oxacilina?","o":["Imipenem.","Cefazolina.","Vancomicina.","Daptomicina."],"c":"C","e":"La vancomicina ha sido clásicamente el tratamiento de elección de la endocarditis por SARM; la daptomicina constituye una alternativa eficaz (especialmente ante fracaso o toxicidad de vancomicina), mientras que betalactámicos como imipenem o cefazolina carecen de actividad frente a cepas resistentes a meticilina."},{"q":"Señale cuál de los siguientes patógenos NO es causa de endocarditis con hemocultivos negativos:","o":["Candida albicans.","Aspergillus spp.","Coxiella burnetii.","Mycobacterium chimaera."],"c":"A","e":"Candida albicans suele crecer adecuadamente en los medios de hemocultivo convencionales, a diferencia de Coxiella burnetii (intracelular obligado), Aspergillus (de difícil recuperación en hemocultivo) y Mycobacterium chimaera (crecimiento muy lento, causa de endocarditis asociada a dispositivos de cirugía cardiaca), que son causas clásicas de endocarditis con hemocultivos negativos."},{"q":"¿Cuál de los siguientes pacientes debe recibir profilaxis antibiótica para endocarditis infecciosa antes de un procedimiento dental?","o":["Mujer de 23 años con prolapso de válvula mitral a la que se le repara una caries dental.","Mujer de 24 años con defecto del tabique interauricular corregido hace 22 años que se somete a cistoscopia electiva.","Varón de 30 años con antecedente de consumo de drogas intravenosas y endocarditis previa que se somete a cirugía gingival.","Mujer de 63 años con prótesis valvular aórtica de dos años de evolución que se somete a colonoscopia de cribado."],"c":"C","e":"La profilaxis antibiótica de endocarditis se reserva actualmente para pacientes de ALTO riesgo (válvula protésica, endocarditis previa, cardiopatía congénita cianótica no reparada) sometidos a procedimientos DENTALES con manipulación de la mucosa gingival o periapical; el antecedente de endocarditis previa en un paciente que se somete a cirugía gingival cumple ambos criterios. El prolapso mitral aislado, un defecto septal ya reparado y los procedimientos urológicos/digestivos electivos no rutinarios no son indicación de profilaxis."},{"q":"Mujer de 75 años ingresada por colecistitis aguda que en tratamiento con piperacilina-tazobactam desarrolla diarrea y fiebre al quinto día, con toxina de C. difficile positiva. Creatinina 1,9 mg/dl (previa 0,8), 19.580 leucocitos, lactato normal, TA normal. Señale lo correcto:","o":["Fiebre, leucocitosis \\>15.000 y aumento de creatinina \\>50% del basal definen el caso como fulminante.","La edad no es un factor de riesgo de infección grave.","La paciente presenta factores de riesgo de recurrencia, por lo que debe considerarse fidaxomicina.","Deben administrarse metronidazol intravenoso y probióticos si no puede suspenderse el antibiótico pautado."],"c":"C","e":"La edad avanzada y la comorbilidad son factores de riesgo reconocidos de recurrencia de la infección por C. difficile, lo que justifica considerar fidaxomicina, que reduce las tasas de recidiva frente a vancomicina/metronidazol; el cuadro descrito (sin shock, íleo ni megacolon) cumple criterios de infección GRAVE, no «fulminante»."},{"q":"Respecto a la actualización de los criterios diagnósticos de Duke de 2023 para endocarditis infecciosa, señale la respuesta correcta sobre los criterios mayores microbiológicos:","o":["Se mantiene el criterio de hemocultivos separados en el tiempo únicamente para Enterococcus faecalis.","Se incorporan como microorganismos típicos Staphylococcus lugdunensis, Streptococcus pneumoniae y Streptococcus pyogenes.","En material protésico explantado se consideran típicos Corynebacterium striatum, Cutibacterium acnes, Serratia marcescens y micobacterias no tuberculosas, pero no en hemocultivos.","Se incorpora como criterio la detección de anticuerpos frente a especies de Bartonella a título IgG \\>1:800."],"c":"B","e":"La actualización 2023 de los criterios de Duke amplió la lista de microorganismos considerados «típicos» de endocarditis (que constituyen criterio mayor con un solo hemocultivo positivo en ciertas condiciones) incorporando, entre otros, S. lugdunensis, S. pneumoniae y S. pyogenes, dado su reconocido potencial de producir endocarditis agresiva."},{"q":"Señale la respuesta correcta sobre la resistencia a fluoroquinolonas:","o":["Característicamente, la adquisición de resistencias a fluoroquinolonas se produce por acumulación progresiva de mutaciones en los genes de las topoisomerasas.","La selección de mutantes resistentes espontáneas es tanto más probable cuanto menor sea el inóculo bacteriano.","En nuestro medio, ciprofloxacino es el tratamiento de elección de la pielonefritis o cistitis aguda sin comorbilidad.","Delafloxacino aporta como ventaja su actividad frente a Enterococcus faecium."],"c":"A","e":"La resistencia a fluoroquinolonas se desarrolla típicamente de forma escalonada, por acumulación sucesiva de mutaciones en los genes que codifican la ADN girasa y la topoisomerasa IV, lo que explica la aparición gradual de resistencia con el uso repetido; la probabilidad de seleccionar mutantes resistentes es MAYOR cuanto mayor es el inóculo bacteriano (no menor), y las altas tasas de resistencia de E. coli a quinolonas en España desaconsejan su uso empírico de primera línea en la ITU no complicada."},{"q":"En el tratamiento de la infección por Candida spp, señale la respuesta correcta:","o":["En la candidemia asociada a catéter en paciente no neutropénico, puede ser suficiente con la retirada del catéter en casos seleccionados poco complicados.","En la pielonefritis ascendente por Candida spp resistente a fluconazol, el tratamiento preferido es la anfotericina B desoxicolato.","La duración del tratamiento de la candidemia debe ser de 14 días desde el inicio del antifúngico, con independencia de la evolución.","Las equinocandinas son la opción preferente para tratar todas las manifestaciones clínicas de la infección invasiva por Candida spp, incluida la meningitis."],"c":"A","e":"En candidemias asociadas a catéter, no complicadas y en pacientes no neutropénicos, la retirada del catéter junto con un tratamiento antifúngico limitado puede ser suficiente; el resto de opciones son imprecisas: en pielonefritis por Candida resistente a fluconazol se prefiere una formulación lipídica de anfotericina B (no el desoxicolato, más nefrotóxico), la duración estándar se cuenta desde el primer hemocultivo NEGATIVO (no desde el inicio del fármaco), y las equinocandinas no penetran bien en SNC ni en tracto urinario, por lo que no son de elección en meningitis o ITU por Candida."},{"q":"Todas las infecciones señaladas pueden complicarse con endocarditis, EXCEPTO:","o":["Bartonelosis.","Fiebre Q.","Borreliosis (enfermedad de Lyme).","Brucelosis."],"c":"C","e":"Bartonella spp., Coxiella burnetii (fiebre Q) y Brucella spp. son causas reconocidas de endocarditis con hemocultivo negativo; la enfermedad de Lyme (Borrelia burgdorferi), en cambio, no se ha descrito clásicamente como causa de endocarditis infecciosa."},{"q":"¿Cuál de las siguientes afirmaciones es FALSA en relación a la estenosis mitral?","o":["Algunos pacientes presentan dolor torácico.","La hemoptisis puede aparecer por rotura de venas pulmonares o bronquiales.","El intervalo libre entre el episodio de carditis reumática y el inicio de los síntomas es de unos 40 años.","La endocarditis bacteriana es rara en la estenosis mitral pura."],"c":"C","e":"El intervalo libre entre la carditis reumática y la aparición de síntomas de estenosis mitral se sitúa clásicamente en torno a los 20 años, no 40; el resto de afirmaciones (dolor torácico ocasional, hemoptisis por rotura venosa, baja incidencia de endocarditis en la estenosis mitral pura por el bajo flujo/turbulencia) son correctas."},{"q":"¿Cuál de las siguientes representa una indicación urgente (el mismo día) de cirugía cardiaca en un paciente con endocarditis infecciosa?","o":["Endocarditis fúngica probada por cultivos.","Embolismos pulmonares sépticos por un organismo resistente, probados por cultivos.","Endocarditis de válvula protésica, 4 meses después de la cirugía.","Absceso del seno de Valsalva roto hacia el corazón derecho."],"c":"D","e":"La rotura de un absceso perianular/del seno de Valsalva hacia una cavidad cardiaca constituye una complicación mecánica grave con riesgo vital inminente (fístula, insuficiencia cardiaca aguda), lo que obliga a cirugía cardiaca emergente/el mismo día; las otras situaciones, aunque graves, habitualmente permiten una cirugía urgente pero no necesariamente el mismo día."},{"q":"Las manchas de Janeway:","o":["Son máculas eritematosas.","Suelen aparecer en la endocarditis por S. aureus.","Aparecen en los pulpejos de los dedos.","Las afirmaciones «a» y «b» son ciertas."],"c":"D","e":"Las manchas de Janeway son máculas eritematosas, indoloras, localizadas típicamente en palmas y plantas, y se asocian con frecuencia a la endocarditis aguda por S. aureus; se distinguen de los nódulos de Osler, que sí son dolorosos y se localizan en los pulpejos de los dedos."},{"q":"Varón de 65 años con cardiopatía isquémica y estenosis aórtica reumática, en tratamiento con betabloqueantes, antiagregantes y estatinas, que desarrolla fiebre y cambio en las cualidades del soplo aórtico. Hemocultivos con SARM. En analítica de control destaca elevación importante de CPK. ¿Con qué antibiótico se ha tratado probablemente?","o":["Daptomicina.","Dalfopristina.","Linezolid.","Cloxacilina."],"c":"A","e":"La miopatía con elevación de CPK es un efecto adverso característico y dosis-dependiente de la daptomicina, por lo que debe monitorizarse la CPK durante su uso; este dato clínico apunta a este fármaco como el más probablemente empleado en el tratamiento de la endocarditis por SARM en este paciente."},{"q":"Paciente oncológico con sonda vesical y sospecha de ITU complicada en tratamiento empírico con cefotaxima intravenosa. Crece Pseudomonas aeruginosa en hemocultivos, pendiente de antibiograma. ¿Qué respuesta es correcta?","o":["Mantener el tratamiento con cefotaxima a la espera de confirmar sensibilidad.","Retirar la cefotaxima e iniciar tratamiento con ertapenem.","Cambiar el tratamiento a ceftazidima.","Añadir trimetoprim-sulfametoxazol para conseguir sinergia y mayor cobertura."],"c":"C","e":"La cefotaxima carece de actividad útil frente a Pseudomonas aeruginosa, por lo que debe cambiarse a un antibiótico con actividad antipseudomónica, como la ceftazidima; el ertapenem, a diferencia de otros carbapenémicos, tampoco cubre Pseudomonas, por lo que no sería una alternativa adecuada."}]},"10":{"title":"Síndromes infecciosos adquiridos en la comunidad. Infecciones del sistema nerviosos central. Meningitis. Encefalitis.","questions":[{"q":"Varón de 58 años con alcoholismo crónico y diabetes mal controlada, que ingresa por fiebre, cefalea y deterioro del nivel de consciencia; TAC craneal normal, LCR turbio con 850 leucocitos (70% PMN), glucosa 17 mg/dl y proteínas 115 mg/dl. Señale la opción CORRECTA:","o":["S. pneumoniae, L. monocytogenes y N. meningitidis son los agentes etiológicos más frecuentes a considerar en este caso.","Se trata de una meningoencefalitis herpética; iniciaría tratamiento con aciclovir intravenoso.","Se trata de una meningitis bacteriana; iniciaría tratamiento empírico con ceftriaxona en monoterapia.","El paciente no requiere aislamiento respiratorio tipo gotas."],"c":"A","e":"El perfil de LCR (pleocitosis neutrofílica marcada, hipoglucorraquia intensa e hiperproteinorraquia) es típico de meningitis bacteriana; en un paciente alcohólico y diabético (con mayor riesgo de Listeria), los patógenos a cubrir empíricamente son S. pneumoniae, N. meningitidis y L. monocytogenes, lo que exige asociar ampicilina a la cefalosporina de tercera generación (la ceftriaxona en monoterapia no cubre Listeria) y mantener aislamiento de gotas hasta descartar meningococo."},{"q":"Señale la FALSA en relación con las meningitis víricas:","o":["Producen síndrome meníngeo sin signos de disfunción neurológica, con pleocitosis linfocitaria en LCR.","El agente etiológico más frecuente de la meningitis vírica es el virus varicela-zóster.","La meningitis de Mollaret es una forma benigna de meningitis linfocitaria recurrente cuyo agente más frecuente es el VHS-2.","Un deterioro progresivo del nivel de consciencia o crisis epiléptica indicarían meningoencefalitis."],"c":"B","e":"Los ENTEROVIRUS son, con diferencia, la causa más frecuente de meningitis vírica (aséptica), no el virus varicela-zóster; el resto de afirmaciones sobre la clínica, la meningitis de Mollaret y los signos de alarma que sugieren afectación encefálica son correctas."},{"q":"¿Cuál de los siguientes enunciados NO es propio de la meningitis tuberculosa?","o":["Afectación de los pares craneales III, IV y VI.","La neuroimagen muestra captación meníngea en la base del cráneo con hidrocefalia.","Es la causa principal de meningitis crónica en países de alta prevalencia.","La PCR de M. tuberculosis en LCR tiene sensibilidad similar a la del cultivo, y una PCR negativa excluye el diagnóstico aunque la sospecha clínica sea alta."],"c":"D","e":"La PCR de M. tuberculosis en LCR tiene una sensibilidad inferior a la del cultivo (en torno al 50-70%), por lo que una PCR negativa NO excluye el diagnóstico si la sospecha clínica sigue siendo alta, debiendo mantenerse el tratamiento empírico y repetir estudios; el resto de datos (afectación de pares craneales, captación basal con hidrocefalia, ser la causa principal de meningitis crónica en zonas de alta prevalencia) sí son característicos."},{"q":"Señale la afirmación CORRECTA con respecto al tratamiento de la tuberculosis:","o":["En la tuberculosis multirresistente (TB-MDR) no se deben priorizar los regímenes basados en bedaquilina.","El tratamiento adyuvante con glucocorticoides está indicado en la meningitis y la pericarditis tuberculosa.","La isoniacida constituye la piedra angular del tratamiento por su poder bacteriostático.","Es rara la resistencia exclusivamente a rifampicina; en tal caso, podemos seguir usando isoniacida."],"c":"B","e":"Los glucocorticoides adyuvantes han demostrado reducir la mortalidad y las secuelas en la meningitis tuberculosa, y también están indicados en la pericarditis tuberculosa con derrame significativo, para reducir el riesgo de pericarditis constrictiva; la bedaquilina SÍ se prioriza actualmente en la TB-MDR, y la isoniacida es bactericida (no bacteriostática), siendo la piedra angular precisamente por ese motivo."},{"q":"Varón de 45 años, HSH, VIH de reciente diagnóstico, carga viral 5,6 log10 y CD4 de 38/mm³, con fiebre y cefalea pertinaz progresiva en la última semana, sin déficits focales, Quantiferón negativo y TAC craneal normal. Señale la respuesta INCORRECTA sobre el diagnóstico y manejo:","o":["El LCR mostrará presión elevada, pleocitosis linfocitaria, hiperproteinorraquia y consumo de glucosa.","Iniciaría tratamiento con anfotericina B y flucitosina.","Iniciaría tratamiento antirretroviral (TAR) junto con el tratamiento antifúngico, sin demora.","Un 25% de estos pacientes va a presentar un síndrome de reconstitución inmune tras el inicio del TAR."],"c":"C","e":"En la meningitis criptocócica del paciente con VIH avanzado, el inicio del TAR debe RETRASARSE (típicamente 4-6 semanas tras iniciar el tratamiento antifúngico), ya que un inicio precoz aumenta significativamente el riesgo de síndrome de reconstitución inmune (IRIS) con edema cerebral potencialmente fatal; el resto de afirmaciones sobre el LCR, el tratamiento de inducción (anfotericina B + flucitosina) y la incidencia del IRIS son correctas."},{"q":"Varón de 35 años, trasplantado renal 7 meses antes con inmunosupresión, que ingresa por cefalea, fiebre y confusión. LCR con 56 células/mm³ (96% PMN), glucosa 40 mg/dl, proteínas 172 mg/dl. Gram del LCR negativo, pero crecen cocobacilos grampositivos en hemocultivos y en el cultivo de LCR. ¿Cuál es la causa más probable?","o":["Neisseria meningitidis.","Streptococcus pneumoniae.","Streptococcus agalactiae.","Listeria monocytogenes."],"c":"D","e":"Listeria monocytogenes es un cocobacilo grampositivo que, característicamente, puede dar una tinción de Gram del LCR NEGATIVA a pesar de un cultivo positivo, y es un patógeno típico de la meningitis en pacientes inmunodeprimidos (trasplantados, tratamiento inmunosupresor), ancianos y gestantes."},{"q":"Las complicaciones asociadas a la infección por gripe, aunque poco frecuentes, incluyen:","o":["Neumonía vírica.","Neumonía por sobreinfección bacteriana.","Afectación neurológica: encefalitis, mielitis transversa, meningitis aséptica o síndrome de Guillain-Barré.","Todas las anteriores."],"c":"D","e":"La gripe puede complicarse tanto con afectación pulmonar directa (neumonía vírica primaria) como con sobreinfección bacteriana secundaria, y también, aunque con menor frecuencia, con complicaciones neurológicas diversas (encefalitis, mielitis transversa, meningitis aséptica, Guillain-Barré), por lo que la respuesta que las engloba todas es correcta."},{"q":"En determinadas entidades infecciosas de gravedad se recomienda utilizar esteroides, EXCEPTO en:","o":["Fiebre tifoidea en sus formas graves.","Tuberculosis que cursa con meningitis o pericarditis con derrame importante.","Fiebre de Katayama.","Síndrome de hiperinfestación por Strongyloides spp."],"c":"D","e":"En el síndrome de hiperinfestación por Strongyloides, los corticoides están CONTRAINDICADOS (son, de hecho, uno de los principales factores de riesgo que precipitan la hiperinfestación en pacientes previamente colonizados), a diferencia de la fiebre tifoidea grave, la meningitis/pericarditis tuberculosa y la fiebre de Katayama, donde sí se recomienda su uso adyuvante."},{"q":"Paciente portador de catéter lumbar para analgesia que ingresa con cuadro meníngeo, con crecimiento de Candida spp. en el LCR. ¿Cuáles son las especies de Candida más resistentes a los azoles, en espera del «fungigrama»?","o":["C. albicans y C. tropicalis.","C. krusei y C. auris.","C. dubliniensis y C. lusitaniae.","C. parapsilosis y C. orthopsilosis."],"c":"B","e":"Candida krusei presenta resistencia intrínseca a fluconazol, y Candida auris es una especie emergente multirresistente con frecuente resistencia a azoles (y en ocasiones también a equinocandinas o anfotericina B), por lo que ambas obligan a extremar la cautela terapéutica hasta disponer del antifungigrama."},{"q":"Señale la afirmación INCORRECTA sobre los abscesos cerebrales:","o":["Ante abscesos cerebrales múltiples hay que pensar en propagación hematógena.","Los abscesos cerebrales múltiples a menudo son de etiología monomicrobiana.","En un paciente diabético o inmunodeprimido con una lesión ocupante de espacio sugestiva de absceso se recomienda una Rx de tórax, que podría orientar a Nocardia spp.","En un paciente con rombencefalitis y absceso cerebral subcortical, Listeria spp. no debe considerarse en pacientes que no sean inmunodeprimidos o gestantes."],"c":"B","e":"Los abscesos cerebrales múltiples, especialmente los de origen hematógeno, son con frecuencia POLIMICROBIANOS (varios gérmenes simultáneamente), no monomicrobianos; el resto de afirmaciones sobre la propagación hematógena, la búsqueda de un foco pulmonar por Nocardia y la especial relevancia de Listeria en rombencefalitis de inmunodeprimidos/gestantes son correctas."},{"q":"¿Cuál es la etiología más frecuente de la meningitis aguda purulenta en adultos inmunocompetentes?","o":["Streptococcus pneumoniae y Neisseria meningitidis.","Haemophilus influenzae.","Neisseria meningitidis y Haemophilus influenzae.","Bacilos gramnegativos, Streptococcus agalactiae y Listeria monocytogenes."],"c":"A","e":"S. pneumoniae y N. meningitidis son, con diferencia, los agentes causales más frecuentes de meningitis bacteriana aguda en el adulto inmunocompetente; H. influenzae ha reducido drásticamente su incidencia tras la vacunación sistemática, y los bacilos gramnegativos, S. agalactiae y Listeria son más propios de neonatos, ancianos o inmunodeprimidos."},{"q":"Hombre de 30 años exadicto a drogas por vía parenteral, con deterioro cognitivo progresivo y subagudo, y lesiones multifocales en sustancia blanca frontal izquierda, periventricular derecha y occipital derecha, no captantes de contraste. Indique la afirmación correcta:","o":["Debe realizarse EEG y determinación de proteína 14-3-3 en LCR para descartar enfermedad de Creutzfeldt-Jakob.","Estaría indicada punción lumbar con serología en LCR para toxoplasma.","Debe realizarse serología VIH y punción lumbar con PCR para virus JC (papovavirus).","Es poco probable que se trate de una leucoencefalopatía multifocal progresiva al no captar contraste las lesiones."],"c":"C","e":"Lesiones multifocales de sustancia blanca, no captantes de contraste (característica que la distingue del linfoma o la toxoplasmosis, típicamente captantes), en un paciente con factores de riesgo de infección por VIH (uso de drogas por vía parenteral), es muy sugestivo de leucoencefalopatía multifocal progresiva por reactivación del virus JC; debe confirmarse la infección por VIH y realizar PCR de virus JC en LCR."},{"q":"Paciente VIH de 40 años, sin tratamiento antirretroviral desde hace 10 años, con candidiasis esofágica y cuadro de 10 días de cefalea, fiebre, vómitos y disminución del nivel de conciencia en las últimas 24h. TAC craneal normal; LCR con presión de apertura elevada, sin células, proteínas 300 mg/dl. El cuadro es compatible con:","o":["Meningitis tuberculosa.","Meningitis criptocócica.","Toxoplasmosis cerebral.","Hidrocefalia."],"c":"B","e":"La meningitis criptocócica es característicamente PAUCICELULAR (escasas o ninguna célula en LCR pese a la infección activa) pero con presión de apertura muy elevada e hiperproteinorraquia moderada, en el contexto de inmunodepresión avanzada (VIH sin tratamiento, candidiasis esofágica marcadora de sida); este perfil de LCR es muy característico de esta entidad, a diferencia de la meningitis tuberculosa (que suele cursar con pleocitosis linfocitaria) o la toxoplasmosis (lesión ocupante, no meningitis pura)."},{"q":"Varón de 45 años con hiporexia, astenia leve, sensación distérmica y cefalea holocraneal de 2 días, sin náuseas ni vómitos, que acude por inestabilidad en la marcha. Otorrea fluctuante en oído izquierdo desde la infancia. Exploración: pares craneales normales, lateropulsión izquierda, dismetría dedo-nariz izquierda, Glasgow 15. Otoscopia: otorrea purulenta y perforación timpánica atical. TC craneal: lesión hipodensa con anillo completo. ¿Cuál es el diagnóstico más probable?","o":["Vértigo periférico por laberintitis difusa purulenta.","Meningitis otógena izquierda.","Síndrome cerebeloso por absceso intraparenquimatoso otógeno izquierdo.","Trombosis de seno lateral por otitis media crónica colesteatomatosa izquierda."],"c":"C","e":"La otitis media crónica con colesteatoma (otorrea fluctuante desde la infancia, perforación atical) es una vía de propagación clásica de infección al SNC; la clínica cerebelosa (lateropulsión, dismetría) con una lesión hipodensa de anillo completo en el TC (imagen típica de absceso) es compatible con un absceso cerebeloso otógeno."},{"q":"Varón de 34 años con otitis media diagnosticada 5 días antes, que presenta fiebre de 39ºC, cefalea y rigidez de nuca. Punción lumbar sugerente de meningitis bacteriana. ¿Cuál sería el mejor tratamiento empírico?","o":["Ceftriaxona más vancomicina.","Cefotaxima más ampicilina.","Moxifloxacino más vancomicina.","Meropenem más ampicilina."],"c":"A","e":"La combinación de una cefalosporina de tercera generación (ceftriaxona) con vancomicina es el tratamiento empírico estándar de la meningitis bacteriana del adulto, para cubrir tanto los patógenos habituales como la posibilidad de neumococo con sensibilidad disminuida a betalactámicos; no es necesario añadir ampicilina en este caso al no tratarse de un paciente con especial riesgo de Listeria (edad, inmunosupresión, gestación, alcoholismo)."},{"q":"Con respecto a la meningitis bacteriana grave por Streptococcus pneumoniae, ¿cuál de las siguientes es FALSA?","o":["En nuestro medio, más del 50% de los S. pneumoniae causantes de meningitis son resistentes a penicilina.","La mortalidad de la meningitis por S. pneumoniae que requiere ingreso en UCI supera el 30%.","La precocidad en el inicio del tratamiento es básica para el buen pronóstico.","El uso de dexametasona mejora el pronóstico funcional y vital."],"c":"A","e":"En España, la proporción de S. pneumoniae con resistencia relevante a penicilina en meningitis está, en la actualidad, muy por debajo del 50%; el resto de afirmaciones (mortalidad elevada en casos graves con ingreso en UCI, importancia de la precocidad terapéutica y beneficio de la dexametasona adyuvante) son correctas."},{"q":"Respecto a la puerta de entrada en las meningitis piógenas, señale la respuesta FALSA:","o":["La existencia de odinofagia orienta hacia una meningitis meningocócica.","Ante una otitis media aguda, el neumococo es el germen más frecuente.","Ante una rinorrea de LCR, el germen más frecuente causante de la meningitis es el estafilococo.","La asociación a neumonía orienta al S. pneumoniae."],"c":"C","e":"Ante una fístula de LCR (rinorrea), el germen más frecuentemente implicado en la meningitis secundaria es el NEUMOCOCO (por su colonización habitual de la nasofaringe con acceso directo al espacio subaracnoideo), no el estafilococo; el resto de asociaciones son correctas."},{"q":"Indique la aseveración FALSA en relación al LCR de una meningitis piógena:","o":["La pleocitosis está constituida fundamentalmente por neutrófilos.","La ausencia de hipoglucorraquia excluye el diagnóstico.","Un porcentaje elevado de mononucleares es frecuente en la listeriosis.","La tinción de Gram es positiva en aproximadamente el 85% de las neumocócicas."],"c":"B","e":"La ausencia de hipoglucorraquia NO excluye una meningitis bacteriana: hasta en un porcentaje relevante de casos (especialmente si el estudio se realiza muy precozmente) la glucosa puede ser normal, por lo que el diagnóstico se basa en el conjunto de datos clínicos y del LCR, no en un único parámetro."},{"q":"Respecto al pronóstico de las meningitis bacterianas, señale la proposición FALSA:","o":["La mortalidad se deriva de las complicaciones de la sepsis.","La mortalidad de causa neurológica es baja en la meningitis neumocócica.","Entre un 5-20% de los pacientes presentan secuelas neurológicas.","El tratamiento adyuvante (dexametasona) disminuye las secuelas neurológicas."],"c":"B","e":"En la meningitis neumocócica, la mortalidad de causa NEUROLÓGICA (edema cerebral, hipertensión intracraneal, complicaciones vasculares) es relativamente ALTA, no baja, siendo una de las meningitis bacterianas con peor pronóstico; el resto de afirmaciones sobre la contribución de la sepsis a la mortalidad, la frecuencia de secuelas y el beneficio de la dexametasona son correctas."},{"q":"Una de las siguientes proposiciones en relación con las meningitis bacterianas es FALSA. Señálela:","o":["Los bacilos gramnegativos y estafilococos suelen ser la causa de meningitis nosocomial.","La única vía de penetración es la hematógena.","En la anatomía patológica el infiltrado de las leptomeninges es de polimorfonucleares.","La fiebre es el signo más frecuente."],"c":"B","e":"La vía de penetración NO es exclusivamente hematógena: también puede producirse por contigüidad (otitis, sinusitis, mastoiditis), por fractura de la base del cráneo con fístula de LCR, o de forma iatrogénica (punción lumbar, neurocirugía, derivaciones)."},{"q":"¿En qué situación está indicado realizar una TAC craneal antes de la punción lumbar en un paciente con sospecha de meningitis?","o":["En todas las meningitis agudas está indicado.","Si el paciente con meningitis aguda presenta convulsiones o datos de focalidad/hipertensión intracraneal.","Si existe un foco de supuración dentaria.","Si existe una otitis aguda no complicada."],"c":"B","e":"La TAC craneal previa a la punción lumbar solo está indicada en presencia de datos que sugieran riesgo de herniación (focalidad neurológica, crisis comiciales, alteración importante del nivel de consciencia, inmunodepresión, papiledema), no de forma sistemática en toda sospecha de meningitis, para evitar retrasar innecesariamente el inicio del tratamiento."},{"q":"Hombre de 60 años con demencia rápidamente progresiva, rigidez, ataxia y mioclonías que persisten durante el sueño, con descargas de alto voltaje en el EEG. ¿Qué alteración podremos encontrar en el LCR?","o":["Hipoglucorraquia.","Bandas oligoclonales positivas.","Aumento del índice de IgG.","Proteína 14-3-3 positiva."],"c":"D","e":"El cuadro clínico (demencia rápidamente progresiva, mioclonías, ataxia, complejos periódicos en el EEG) es característico de la enfermedad de Creutzfeldt-Jakob; la determinación de proteína 14-3-3 en LCR es un marcador de apoyo diagnóstico útil en esta entidad, mientras que la glucorraquia suele ser normal."},{"q":"Paciente sin antecedentes neurológicos previos derivado a Urgencias por crisis convulsiva de novo. ¿Cuál es la etiología MENOS probable de las siguientes?","o":["Leucoencefalopatía multifocal progresiva.","Meningitis criptocócica.","Encefalopatía por VIH.","Linfoma primario del sistema nervioso central."],"c":"D","e":"En el contexto de infección por VIH avanzada, las crisis convulsivas de novo se asocian más frecuentemente a lesiones/infecciones oportunistas del SNC (LMP, criptococosis, encefalopatía VIH) que al linfoma primario del SNC, que aunque posible es relativamente menos frecuente como causa de debut convulsivo entre estas opciones."},{"q":"Paciente de 48 años con fiebre, cefalea frontal intensa y náuseas de 48 horas de evolución, buen estado general, sin lesiones cutáneas, con rigidez de nuca discreta y Kernig positivo. Punción lumbar: líquido claro, proteínas 170 mg/dl, glucosa 54 mg/dl (glucosa plasmática 98 mg/dl), 280 células (89% linfocitos), ADA 4 UI/l. ¿Cuál es la causa más probable de la meningitis?","o":["Neisseria meningitidis.","Mycobacterium tuberculosis.","Streptococcus pneumoniae.","Enterovirus."],"c":"D","e":"Un LCR con pleocitosis linfocitaria, glucosa moderadamente descendida (pero con cociente LCR/plasma no extremadamente bajo) y ADA bajo (que hace poco probable la etiología tuberculosa) en un paciente con buen estado general y curso agudo de menos de 48 horas es más compatible con una meningitis vírica por enterovirus que con las causas bacterianas o tuberculosa."},{"q":"Indique la causa más frecuente de encefalitis aguda no endémica del adulto:","o":["Virus varicela-zóster.","Arbovirus.","Virus herpes simple tipo 1.","Virus herpes simple tipo 2."],"c":"C","e":"El virus herpes simple tipo 1 (VHS-1) es, con diferencia, la causa más frecuente de encefalitis esporádica (no epidémica ni estacional) en el adulto, con afectación característica de los lóbulos temporales y frontales basales."},{"q":"Indique la respuesta FALSA referente a la encefalitis herpética:","o":["Causa lesiones predominantemente en la región basal de los lóbulos frontales y temporales.","El diagnóstico definitivo actual se realiza por cultivo del LCR.","La hipoglucorraquia es excepcional en el LCR.","El aciclovir es el tratamiento de elección."],"c":"B","e":"El diagnóstico de la encefalitis herpética se realiza actualmente mediante PCR de VHS en LCR (técnica rápida y de alta sensibilidad/especificidad), no por cultivo, que es lento y de baja sensibilidad para este virus; el resto de afirmaciones (localización típica, hipoglucorraquia excepcional, aciclovir como tratamiento de elección) son correctas."},{"q":"Sobre Listeria monocytogenes, señale la afirmación INCORRECTA:","o":["Es un bacilo grampositivo, catalasa positivo.","Está ampliamente distribuida en el suelo, aguas residuales y vegetación en descomposición.","El hombre y los animales pueden ser portadores asintomáticos.","El tratamiento de elección de la meningitis por L. monocytogenes es una cefalosporina."],"c":"D","e":"Listeria monocytogenes es intrínsecamente RESISTENTE a las cefalosporinas; el tratamiento de elección de la meningitis por Listeria es la AMPICILINA (habitualmente asociada a un aminoglucósido para sinergia), no una cefalosporina."},{"q":"En la tinción de Gram del LCR de un paciente inmunodeprimido con sospecha de meningitis se observan abundantes polimorfonucleares y escasos bacilos grampositivos de pequeño tamaño. ¿Qué microorganismo es el responsable más probable?","o":["Neisseria meningitidis.","Haemophilus influenzae.","Streptococcus agalactiae.","Listeria monocytogenes."],"c":"D","e":"La descripción de bacilos grampositivos pequeños, escasos (baja carga bacteriana visible pese a la pleocitosis), en un paciente inmunodeprimido, es muy característica de Listeria monocytogenes, patógeno típico de este perfil de paciente."},{"q":"¿Cuál de los siguientes virus causa el herpes genital y la meningitis herpética aguda («meningitis de Mollaret»)?","o":["Virus de la varicela-zóster.","Virus del herpes simple tipo 1.","Virus del herpes simple tipo 2.","Virus de Epstein-Barr."],"c":"C","e":"El virus herpes simple tipo 2 (VHS-2), agente principal del herpes genital, es también el que con mayor frecuencia se asocia a la meningitis herpética aguda y a sus formas recurrentes (meningitis de Mollaret)."},{"q":"¿Cuál de los siguientes resultados del análisis de LCR es más sugestivo de encefalitis, en un paciente con glucemia simultánea de 110 mg/dl?","o":["Presión de apertura 200 mmHg, leucocitos 300/mm³ (80% linfocitos), glucosa 80 mg/dl, proteínas 80 mg/dl.","Presión de apertura 150 mmHg, leucocitos 4/mm³ (80% linfocitos), glucosa 70 mg/dl, proteínas 45 mg/dl.","Presión de apertura 250 mmHg, leucocitos 400/mm³ (80% polinucleares), glucosa 40 mg/dl, proteínas 450 mg/dl.","Presión de apertura 180 mmHg, leucocitos 10/mm³ (80% linfocitos), glucosa 75 mg/dl, proteínas 40 mg/dl."],"c":"A","e":"Un LCR con pleocitosis linfocitaria moderada-alta, glucosa conservada (relación LCR/plasma normal) y proteínas discretamente elevadas es el patrón típico de una infección vírica del SNC (meningoencefalitis); el patrón con hipoglucorraquia marcada y predominio de polinucleares (opción C) es más propio de infección bacteriana, y las opciones B y D son prácticamente normales."}]},"11":{"title":"Síndromes infecciosos adquiridos en la comunidad. Infecciones osteoarticulares. Infecciones de partes blandas.","questions":[{"q":"¿Cuál es la vía de infección más frecuente de la artritis séptica aguda?","o":["Extensión de una articulación vecina.","Inoculación externa directa.","Infiltración intraarticular.","Hematógena."],"c":"D","e":"La diseminación hematógena, a partir de un foco bacteriémico a distancia, es la vía de infección más frecuente de la artritis séptica aguda, por delante de la inoculación directa (traumatismo, cirugía, infiltración) o la extensión por contigüidad desde una osteomielitis vecina."},{"q":"Señale la afirmación FALSA:","o":["En la osteomielitis vertebral piógena, el microorganismo que predomina es S. aureus (aproximadamente el 50%).","En mayores de 50 años, la vía hematógena es la más frecuente en la espondilodiscitis, aunque también puede ser postquirúrgica o por contigüidad.","En ocasiones, la osteomielitis vertebral piógena se relaciona con usuarios de drogas por vía parenteral.","La causa más frecuente de osteomielitis vertebral NO piógena actualmente es Brucella spp., por consumo de lácteos no controlados."],"c":"D","e":"La causa más frecuente de espondilodiscitis no piógena (granulomatosa) sigue siendo, con diferencia, Mycobacterium tuberculosis (mal de Pott), no Brucella, que es una causa menos frecuente en nuestro medio aunque relevante en determinadas áreas geográficas o tras exposición a productos lácteos no pasteurizados."},{"q":"En relación con las infecciones de piel y partes blandas, señale la respuesta FALSA:","o":["Ante infección de herida con shock séptico y hemólisis intravascular intensa hay que pensar en Clostridium perfringens.","Ante una celulitis de la mano tras mordedura de gato siempre hay que cubrir S. aureus, S. pyogenes y Pasteurella multocida.","Una linfangitis nodular en un jardinero sugiere la posibilidad de Sporothrix schenckii.","En un paciente cirrótico que desarrolla sepsis tras mordedura de perro hay que sospechar Streptobacillus moniliformis."],"c":"D","e":"Ante una sepsis fulminante tras mordedura de perro en un paciente cirrótico o asplénico, el microorganismo clásico a sospechar es Capnocytophaga canimorsus, no Streptobacillus moniliformis (asociado a la fiebre por mordedura de rata)."},{"q":"Para el tratamiento antibiótico empírico de una artritis séptica de rodilla tras cirugía de menisco, ¿cuál es la opción más correcta?","o":["Piperacilina/tazobactam.","Vancomicina + cefepime.","Daptomicina + linezolid.","Meropenem + cloxacilina."],"c":"B","e":"En una artritis séptica postquirúrgica (nosocomial), la cobertura empírica debe incluir actividad frente a SARM (vancomicina) y frente a bacilos gramnegativos nosocomiales, incluida Pseudomonas (cefepime), combinación adecuada para este contexto de riesgo."},{"q":"La artritis séptica de los usuarios de heroína está producida mayoritariamente por:","o":["Pseudomonas aeruginosa.","Candida albicans.","Staphylococcus aureus.","Neisseria gonorrhoeae."],"c":"C","e":"Aunque en los usuarios de drogas por vía parenteral existe una mayor proporción relativa de infecciones por Pseudomonas aeruginosa (y afectación de articulaciones atípicas como esternoclaviculares o sacroilíacas) respecto a la población general, Staphylococcus aureus sigue siendo, globalmente, el microorganismo más frecuente en la artritis séptica de este grupo de pacientes."},{"q":"Varón de 72 años, exfumador, hipertenso y diabético, con extracción dental un año antes, que ingresa por fiebre y tumoración recidivante en el ángulo mandibular que mejoraba parcialmente con ciclos de amoxicilina y reaparecía después. ¿Qué etiología sugiere el cuadro?","o":["Osteomielitis mandibular por Candida.","Tuberculosis ósea.","Actinomicosis.","Celulitis facial simple."],"c":"C","e":"La tumefacción indurada, recurrente, con fístulas y respuesta parcial e incompleta a ciclos cortos de amoxicilina (que solo suprime transitoriamente la infección sin curarla) tras manipulación dental, es muy característica de la actinomicosis cervicofacial, que requiere tratamiento antibiótico prolongado (semanas-meses) para su curación."},{"q":"¿Cuál es la etiología más frecuente de la artritis séptica en la población general?","o":["Staphylococcus aureus.","Pseudomonas aeruginosa.","Chlamydia trachomatis.","Neisseria gonorrhoeae."],"c":"A","e":"Staphylococcus aureus es, con diferencia, el microorganismo más frecuentemente aislado en la artritis séptica del adulto en la población general, salvo en el subgrupo específico de adultos jóvenes sexualmente activos, donde N. gonorrhoeae cobra especial relevancia."},{"q":"En una paciente con pie diabético que presenta úlcera con eritema, dolor y secreción purulenta, con celulitis ≤2 cm del margen de la úlcera e infección limitada a piel o tejidos subcutáneos, sin otras complicaciones locales o sistémicas, el tratamiento de elección será:","o":["Amoxicilina-clavulánico.","Imipenem o meropenem.","Piperacilina-tazobactam.","Linezolid."],"c":"A","e":"En la infección leve del pie diabético (celulitis ≤2 cm, sin datos de complicación local o sistémica), el tratamiento antibiótico oral con un espectro moderado ---como amoxicilina-clavulánico--- es suficiente y de elección; los antibióticos de amplio espectro intravenosos (carbapenémicos, piperacilina-tazobactam) se reservan para infecciones moderadas-graves o con factores de riesgo de multirresistencia."}]},"12":{"title":"Zoonosis prevalentes en nuestro medio. Brucelosis. Rickettsiosis. Fiebre Q. Hidatidosis. Otras infecciones emergentes.","questions":[{"q":"Adolescente de 16 años con fiebre e inflamación del pabellón auricular derecho de 4 días de evolución, tras excursión al campo en junio, con extracción de una garrapata en dicho pabellón que dejó una lesión necrótica. Ingresa por exantema generalizado maculopapular que afecta a palmas y plantas. ¿Cuál es el diagnóstico más probable?","o":["Enfermedad de Lyme.","Tifus exantemático epidémico.","Fiebre botonosa mediterránea.","Fiebre Q."],"c":"C","e":"La combinación de picadura de garrapata con lesión necrótica («mancha negra»/tache noire) y exantema maculopapular generalizado con afectación de palmas y plantas, en verano y tras excursión al campo, es el cuadro clásico de la fiebre botonosa mediterránea por Rickettsia conorii, transmitida por la garrapata del perro (Rhipicephalus sanguineus)."},{"q":"¿Cuál de los siguientes enunciados NO es propio de la fiebre Q?","o":["Es una zoonosis de distribución mundial que se transmite principalmente al inhalar aerosoles contaminados por Coxiella burnetii.","La hepatitis es muy característica, con hepatomegalia y elevación moderada de transaminasas.","La base del diagnóstico es serológico; en la infección aguda se elevan los anticuerpos frente a antígenos de fase II.","El tratamiento de elección es levofloxacino 500 mg al día durante 7 días."],"c":"D","e":"El tratamiento de elección de la fiebre Q aguda es la DOXICICLINA (100 mg/12h durante 14-21 días), no levofloxacino en monoterapia durante solo 7 días; el resto de afirmaciones sobre la transmisión, la hepatitis característica y el patrón serológico (anticuerpos de fase II en la infección aguda, de fase I en la crónica) son correctas."},{"q":"Varón de 40 años con fiebre, cefalea, mialgias, náuseas, vómitos, dolor abdominal, ictericia e inyección conjuntival, dos semanas después de una regata de agua dulce en Costa Rica. ¿Cuál es el diagnóstico más probable?","o":["Malaria.","Esquistosomiasis.","Leptospirosis.","Rabia."],"c":"C","e":"La exposición a agua dulce (posiblemente contaminada por orina de roedores u otros animales) junto con fiebre, mialgias, ictericia e inyección conjuntival, es el cuadro clásico de la leptospirosis, especialmente en su forma más grave (síndrome de Weil, con afectación hepática y renal)."},{"q":"¿Cuál de las siguientes relaciones entre microorganismo y enfermedad es INCORRECTA?","o":["Arbovirus - dengue.","Rickettsia - tifus.","Protozoos - esquistosomiasis.","Hongos - histoplasmosis."],"c":"C","e":"La esquistosomiasis está producida por TREMATODOS (gusanos platelmintos del género Schistosoma), no por protozoos; el resto de asociaciones (arbovirus-dengue, Rickettsia-tifus, hongos-histoplasmosis) son correctas."},{"q":"Con respecto al tratamiento de la brucelosis, señale la respuesta FALSA:","o":["El tratamiento de elección en la enfermedad aguda no focal es la asociación de estreptomicina y doxiciclina.","El tratamiento en monoterapia con estreptomicina es una alternativa eficaz en pacientes con intolerancia a doxiciclina.","Las quinolonas muestran una buena actividad in vitro, pero no in vivo.","El tratamiento alternativo de la enfermedad aguda no focal es la asociación de rifampicina y doxiciclina."],"c":"C","e":"Las quinolonas sí muestran buena actividad tanto in vitro como in vivo frente a Brucella spp., aunque no se recomiendan como monoterapia debido a las elevadas tasas de recidiva; el resto de afirmaciones sobre los regímenes de tratamiento de elección y alternativos de la brucelosis aguda no focal son correctas."},{"q":"Respecto a las infecciones por hantavirus, señale la respuesta INCORRECTA:","o":["La transmisión persona a persona es excepcional para la mayoría de las especies.","A diferencia del dengue, el periodo de incubación es de 2-3 semanas, aunque puede ser más largo.","La distribución geográfica incluye Asia, América del Sur, América del Norte, África y Europa.","En el síndrome cardiopulmonar, típico del hantavirus del Viejo Mundo, la proteinuria es frecuente y aparecen infiltrados pulmonares que responden a tecovirimat."],"c":"D","e":"El síndrome cardiopulmonar por hantavirus es característico de las especies del NUEVO MUNDO (América), no del Viejo Mundo (que produce típicamente fiebre hemorrágica con síndrome renal); además, no existe un tratamiento específico eficaz con tecovirimat aprobado para esta entidad, siendo el manejo fundamentalmente de soporte."},{"q":"Empleado murciano que trabaja en la construcción de naves en África Occidental, preocupado por la presencia de ratas en el poblado. ¿Cuál de estas infecciones nada tiene que ver con estos roedores?","o":["Fiebre de Lassa.","Hantavirus.","Leptospirosis.","Tifus epidémico."],"c":"D","e":"El tifus epidémico (Rickettsia prowazekii) se transmite por PIOJOS del cuerpo humano, no por roedores; en cambio, la fiebre de Lassa, las infecciones por hantavirus y la leptospirosis sí están clásicamente relacionadas con la exposición a roedores o sus excretas."},{"q":"Señale la respuesta correcta:","o":["La infección por Yersinia pestis (peste) es exclusivamente de transmisión vectorial por pulgas de las ratas, y la máscara facial de los grabados históricos refleja una interpretación errónea de la vía de transmisión.","El tifus epidémico está producido por Rickettsia prowazekii, transmitido por los piojos, y también se conoce como «fiebre de las trincheras».","Bartonella henselae es responsable de la verruga peruana o fiebre de Oroya.","Orientia tsutsugamushi (antes Rickettsia tsutsugamushi) se transmite por ácaros (tifus de los matorrales)."],"c":"D","e":"Orientia tsutsugamushi, agente del tifus de los matorrales (scrub typhus), se transmite por la picadura de ácaros trombicúlidos («chiggers»); la peste puede transmitirse también por vía respiratoria (forma neumónica) y no solo vectorial, el tifus epidémico se debe a R. prowazekii pero la «fiebre de las trincheras» es en realidad producida por Bartonella quintana, y la verruga peruana/fiebre de Oroya se debe a Bartonella bacilliformis, no a B. henselae (que causa la enfermedad por arañazo de gato)."},{"q":"¿Cuál de las siguientes enfermedades es transmitida principalmente a través de la orina y heces de animales infectados?","o":["Sífilis.","Leptospirosis.","Borreliosis.","Infecciones por Rickettsias."],"c":"B","e":"La leptospirosis se transmite por contacto con agua o suelo contaminados por la orina de animales infectados (roedores, ganado), lo que la distingue del resto de zoonosis, transmitidas por vectores artrópodos (garrapatas, piojos)."},{"q":"¿Cuál de las siguientes enfermedades puede causar fiebre, dolor muscular y conjuntivitis?","o":["Sífilis.","Leptospirosis.","Borreliosis.","Infecciones por Rickettsias."],"c":"B","e":"La tríada de fiebre, mialgias intensas e inyección conjuntival es característica de la leptospirosis."},{"q":"¿Cuál de las siguientes enfermedades NO es causada por Rickettsias?","o":["Fiebre Q.","Tifus epidémico.","Enfermedad de Lyme.","Fiebre manchada de las Montañas Rocosas."],"c":"C","e":"La enfermedad de Lyme está producida por Borrelia burgdorferi, una espiroqueta, no por una Rickettsia; la fiebre Q (Coxiella burnetii, filogenéticamente relacionada), el tifus epidémico y la fiebre manchada de las Montañas Rocosas sí pertenecen al grupo de las rickettsiosis."},{"q":"El tratamiento de elección de las infecciones por Rickettsias es:","o":["Azitromicina.","Levofloxacino + doxiciclina.","Doxiciclina.","Hidroxicloroquina."],"c":"C","e":"La doxiciclina es el tratamiento de elección de prácticamente todas las rickettsiosis (fiebre Q, fiebre botonosa mediterránea, tifus, fiebre manchada de las Montañas Rocosas), incluso en cursos cortos, por su rápida eficacia y buen perfil de seguridad."},{"q":"Todas las infecciones señaladas pueden complicarse con endocarditis, EXCEPTO:","o":["Bartonelosis.","Fiebre Q.","Borreliosis.","Brucelosis."],"c":"C","e":"Bartonella spp., Coxiella burnetii (fiebre Q) y Brucella spp. son causas reconocidas de endocarditis con hemocultivo negativo; la enfermedad de Lyme (Borrelia burgdorferi) no se ha descrito clásicamente como causa de endocarditis."},{"q":"Es característica la aparición de exantema conjuntival en todas estas entidades, EXCEPTO:","o":["Sarampión.","Leptospirosis.","Fase hemorrágica de la fiebre de Crimea-Congo.","Edema de Kalabar (filariasis por Loa loa)."],"c":"D","e":"El edema de Kalabar, manifestación cutánea migratoria de la infección por Loa loa, no cursa característicamente con exantema conjuntival, a diferencia del sarampión, la leptospirosis y la fase hemorrágica de la fiebre de Crimea-Congo."},{"q":"La tríada de trombosis venosa portal, hemólisis y pancitopenia sugiere, ¿cuál de los siguientes diagnósticos?","o":["Leucemia promielocítica aguda.","Síndrome hemolítico urémico.","Hemoglobinuria paroxística nocturna.","Leptospirosis."],"c":"D","e":"En su forma grave (síndrome de Weil), la leptospirosis puede cursar con afectación hepática (ictericia), hemólisis, trombopenia/pancitopenia y fenómenos trombóticos, incluyendo trombosis de la vena porta en presentaciones graves."},{"q":"Varón de 22 años, practicante de deportes de aventura, con parálisis facial bilateral. Meses antes presentó, durante unas 4 semanas, debilidad generalizada, fiebre, cefalea intensa y artromialgias, con cefalea y dolor articular fluctuantes persistentes. Exploración cardiorrespiratoria, abdominal y neurológica normales. Rx de tórax normal. ¿Cuál es la causa más probable?","o":["Síndrome de Guillain-Barré.","Leptospirosis.","Sarcoidosis.","Enfermedad de Lyme."],"c":"D","e":"La parálisis facial bilateral (muy sugestiva de enfermedad de Lyme diseminada precoz) precedida de un
