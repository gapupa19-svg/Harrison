/* ---------- persistence (window.storage, with graceful fallback) ---------- */
let storageOK = (typeof window.storage !== 'undefined');
let PROGRESS = {}; // { "temaNum": { "qIndex": "ok"|"bad" } }
let progressLoaded = false;

async function loadProgress(){
  if(!storageOK){ progressLoaded = true; renderCurrentView(); return; }
  try{
    const res = await window.storage.get('harrison_progress_v1', false);
    if(res && res.value){ PROGRESS = JSON.parse(res.value); }
  }catch(e){ /* key doesn't exist yet, or storage unavailable */ }
  progressLoaded = true;
  renderCurrentView();
}
let saveTimer = null;
function saveProgress(){
  if(!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set('harrison_progress_v1', JSON.stringify(PROGRESS), false); }
    catch(e){ storageOK = false; }
  }, 400);
}
function markResult(tema, qIndex, ok){
  const t = String(tema);
  if(!PROGRESS[t]) PROGRESS[t] = {};
  PROGRESS[t][qIndex] = ok ? 'ok' : 'bad';
  saveProgress();
}
function temaMastery(tema){
  const t = String(tema);
  const total = (DATA[t] && DATA[t].questions.length) || 0;
  if(total===0) return {pct:0,total:0,done:0,ok:0};
  const p = PROGRESS[t] || {};
  const keys = Object.keys(p);
  const ok = keys.filter(k=>p[k]==='ok').length;
  return {pct: Math.round((ok/total)*100), total, done: keys.length, ok};
}
function specMastery(spec){
  let total=0, ok=0;
  spec.temas.forEach(t=>{
    const m = temaMastery(t);
    total += m.total; ok += m.ok;
  });
  if(total===0) return {pct:0,total:0};
  return {pct: Math.round((ok/total)*100), total};
}

/* ---------- state / routing ---------- */
let view = 'home'; // home | specialty | quiz | summary
let currentSpec = null;
let currentTemaSet = []; // list of tema nums included in the active quiz
let session = null; // {questions:[{tema,idx,...}], pos, correct, streak, wrong:[]}

function goHome(){ view='home'; currentSpec=null; session=null; render(); }
function openSpecialty(id){ currentSpec = SPECIALTIES.find(s=>s.id===id); view='specialty'; render(); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildSession(temaNums){
  let pool = [];
  temaNums.forEach(t=>{
    const qs = (DATA[String(t)] && DATA[String(t)].questions) || [];
    qs.forEach((q,idx)=> pool.push({tema:t, idx, q}));
  });
  pool = shuffle(pool);
  session = { list: pool, pos:0, correct:0, streak:0, bestStreak:0, wrong:[], answered:false, selected:null };
  view = 'quiz';
  render();
}

function startTema(temaNum){ buildSession([temaNum]); }
function startSpecialtyReview(spec){ buildSession(spec.temas); }
function retryWrong(){
  const wrongItems = session.wrong.slice();
  session = { list: shuffle(wrongItems), pos:0, correct:0, streak:0, bestStreak:0, wrong:[], answered:false, selected:null };
  view='quiz'; render();
}

/* ---------- rendering ---------- */
const app = document.getElementById('app');
const crumbEl = document.getElementById('crumb');

function renderCurrentView(){ render(); }

function render(){
  if(!progressLoaded){ app.innerHTML = ''; return; }
  crumbEl.innerHTML = '';
  if(view==='specialty' && currentSpec){
    const b = document.createElement('button');
    b.textContent = '← Especialidades';
    b.onclick = goHome;
    crumbEl.appendChild(b);
  } else if(view==='quiz' || view==='summary'){
    const b = document.createElement('button');
    b.textContent = currentSpec ? ('← ' + currentSpec.label) : '← Inicio';
    b.onclick = ()=>{ if(currentSpec){ view='specialty'; render(); } else { goHome(); } };
    crumbEl.appendChild(b);
  }

  if(view==='home') return renderHome();
  if(view==='specialty') return renderSpecialty();
  if(view==='quiz') return renderQuiz();
  if(view==='summary') return renderSummary();
}

function renderHome(){
  const totalQ = Object.values(DATA).reduce((s,t)=>s+t.questions.length,0);
  let masteredTotal=0, attemptedTotal=0;
  Object.keys(DATA).forEach(t=>{
    const m = temaMastery(t);
    masteredTotal += m.ok;
  });

  let html = `
  <div class="hero">
    <h1 class="serif">Repasa medicina interna, tema a tema.</h1>
    <p>Banco de ${totalQ} preguntas tipo test del temario de la oposición, organizado por especialidad. Elige un bloque y empieza a practicar.</p>
    <div class="stats-row">
      <div class="stat-pill"><span class="num">${totalQ}</span><span class="lbl">preguntas</span></div>
      <div class="stat-pill"><span class="num">${SPECIALTIES.length}</span><span class="lbl">especialidades</span></div>
      <div class="stat-pill"><span class="num">${masteredTotal}</span><span class="lbl">dominadas</span></div>
    </div>
  </div>
  <div class="grid-spec">`;

  SPECIALTIES.forEach(s=>{
    const m = specMastery(s);
    const disabled = m.total===0;
    html += `
    <div class="spec-card ${disabled?'disabled':''}" ${disabled?'':`onclick="openSpecialty('${s.id}')"`}>
      <div class="spec-band" style="background:${s.bg}; color:${s.ink}">
        ${iconSvg(s.icon,30)}
      </div>
      <div class="spec-body">
        <div class="spec-title">${s.label}</div>
        ${disabled
          ? `<div class="spec-soon">Próximamente</div>`
          : `<div class="spec-meta">${m.total} preguntas · ${m.pct}% dominado</div>
             <div class="spec-progress-track"><div class="spec-progress-fill" style="width:${m.pct}%; background:${s.band}"></div></div>`}
      </div>
    </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
}

function renderSpecialty(){
  const s = currentSpec;
  const m = specMastery(s);
  let html = `
  <div class="spec-header">
    <div class="icon-wrap" style="background:${s.bg};color:${s.ink}">${iconSvg(s.icon,26)}</div>
    <div>
      <h2 class="serif">${s.label}</h2>
      <div class="sub">${m.total} preguntas en ${s.temas.length} tema${s.temas.length>1?'s':''} · ${m.pct}% dominado</div>
    </div>
  </div>`;

  if(m.total>0){
    html += `
    <div class="review-all" onclick="startSpecialtyReview(SPECIALTIES.find(x=>x.id==='${s.id}'))">
      <div>
        <div class="t">Repasar toda la especialidad</div>
        <div class="d">Preguntas mezcladas de los ${s.temas.length} temas</div>
      </div>
      <button style="background:${s.ink}">Empezar</button>
    </div>`;
  }

  html += `<div class="tema-list">`;
  s.temas.forEach(t=>{
    const td = DATA[String(t)];
    const count = td ? td.questions.length : 0;
    const mt = temaMastery(t);
    const ring = ringSvg(mt.pct, 30, 3, s.band);
    if(count===0){
      html += `
      <div class="tema-row empty">
        <div class="tema-num" style="background:${s.bg};color:${s.ink}">${t}</div>
        <div class="tema-info">
          <div class="tt">${td ? td.title : ''}</div>
          <div class="tm">Próximamente</div>
        </div>
      </div>`;
    } else {
      html += `
      <div class="tema-row" onclick="startTema(${t})">
        <div class="tema-num" style="background:${s.bg};color:${s.ink}">${t===990?'+':t}</div>
        <div class="tema-info">
          <div class="tt">${td.title}</div>
          <div class="tm">${count} preguntas${mt.done>0 ? ' · ' + mt.pct + '% dominado' : ''}</div>
        </div>
        <div class="tema-ring">${ring}</div>
        <div class="tema-arrow">${chevron()}</div>
      </div>`;
    }
  });
  html += `</div>`;

  if(m.total===0){
    html += `<div class="empty-state"><div class="big">🧬</div>Todavía no hay preguntas cargadas para esta especialidad.<br>Vuelve pronto.</div>`;
  }

  app.innerHTML = html;
}

function ringSvg(pct, size, stroke, color){
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const off = c * (1 - pct/100);
  return `<svg viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#E7ECF0" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}
function chevron(){
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
}

function currentSpecOfTema(t){
  return SPECIALTIES.find(s=>s.temas.includes(Number(t))) || {bg:'#eee',ink:'#333',band:'#999'};
}

function renderQuiz(){
  if(!session || session.pos >= session.list.length){ return renderSummary(); }
  const item = session.list[session.pos];
  const s = currentSpecOfTema(item.tema);
  const q = item.q;
  const total = session.list.length;

  let html = `<div class="quiz-wrap">
    <div class="progress-row">
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${(session.pos/total)*100}%"></div></div>
      <div class="progress-txt">${session.pos+1} / ${total}</div>
      <div class="streak">🔥 ${session.streak}</div>
    </div>
    <div class="q-tag" style="background:${s.bg};color:${s.ink}">TEMA ${item.tema} · ${(DATA[String(item.tema)]||{}).title || ''}</div>
    <div class="q-text serif">${q.q}</div>
    <div class="opt-list" id="opt-list">`;

  const letters = q.letters || ['A','B','C','D'];
  letters.forEach((L,i)=>{
    html += `<button class="opt" data-letter="${L}" onclick="selectOption('${L}')">
      <span class="letter">${L}</span><span>${q.o[i]}</span>
    </button>`;
  });
  html += `</div>`;

  html += `<div id="feedback-zone"></div>`;
  html += `<div class="quiz-footer"><button class="btn-primary" id="next-btn" disabled onclick="nextQuestion()">Responde para continuar</button></div>`;
  html += `</div>`;

  app.innerHTML = html;
  session.answered = false;
  session.selected = null;
}

function selectOption(letter){
  if(session.answered) return;
  session.answered = true;
  session.selected = letter;
  const item = session.list[session.pos];
  const q = item.q;
  const correct = q.c;
  const isOk = (letter === correct);

  document.querySelectorAll('.opt').forEach(btn=>{
    const L = btn.getAttribute('data-letter');
    btn.classList.add('locked');
    if(L === correct) btn.classList.add('correct');
    else if(L === letter) btn.classList.add('incorrect');
    else btn.classList.add('dim');
  });

  if(isOk){ session.correct++; session.streak++; session.bestStreak = Math.max(session.bestStreak, session.streak); }
  else { session.streak = 0; session.wrong.push(item); }

  markResult(item.tema, item.idx, isOk);

  const fz = document.getElementById('feedback-zone');
  fz.innerHTML = `
    <div class="feedback-banner ${isOk?'ok':'bad'}">
      <div class="fb-icon">${isOk ? '✓' : '✕'}</div>
      <div>
        <div class="fb-title">${isOk ? '¡Correcto!' : 'Respuesta incorrecta'}</div>
        <div class="fb-body">${q.e || ''}</div>
      </div>
    </div>`;

  const nb = document.getElementById('next-btn');
  nb.disabled = false;
  nb.classList.add(isOk ? 'go' : 'retry');
  nb.textContent = (session.pos+1 < session.list.length) ? 'Siguiente' : 'Ver resultados';
}

function nextQuestion(){
  session.pos++;
  render();
}

function renderSummary(){
  view='summary';
  const total = session.list.length;
  const pct = total ? Math.round((session.correct/total)*100) : 0;
  let color = '#3FAE7A';
  if(pct < 50) color = '#E4607A';
  else if(pct < 75) color = '#F4B078';

  let msg = '¡Sigue así!';
  if(pct===100) msg = 'Dominio completo. Impecable.';
  else if(pct>=85) msg = 'Muy sólido. Casi perfecto.';
  else if(pct>=60) msg = 'Buen nivel, hay margen de mejora.';
  else msg = 'Toca repasar a fondo este bloque.';

  const r = 65, stroke=10, c = 2*Math.PI*r, off = c*(1-pct/100);

  let html = `<div class="summary-wrap">
    <div class="summary-ring">
      <svg viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="${r}" stroke="#E7ECF0" stroke-width="${stroke}"/>
        <circle cx="75" cy="75" r="${r}" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
      </svg>
      <div class="summary-pct">${pct}%</div>
    </div>
    <h2 class="serif">${msg}</h2>
    <div class="msg">${session.correct} de ${total} respuestas correctas</div>
    <div class="summary-stats">
      <div><div class="n">${session.correct}</div><div class="l">correctas</div></div>
      <div><div class="n">${session.wrong.length}</div><div class="l">falladas</div></div>
      <div><div class="n">${session.bestStreak}</div><div class="l">racha máxima</div></div>
    </div>
    <div class="summary-actions">
      ${session.wrong.length>0 ? `<button class="btn-primary retry" onclick="retryWrong()">Repasar falladas (${session.wrong.length})</button>` : ''}
      <button class="btn-secondary" onclick="restartSameSet()">Repetir este bloque</button>
      <button class="btn-secondary" onclick="${currentSpec ? `(function(){view='specialty';render();})()` : 'goHome()'}">${currentSpec ? 'Volver a ' + currentSpec.label : 'Volver al inicio'}</button>
    </div>`;

  if(session.wrong.length>0){
    html += `<div class="fail-list"><h3>Preguntas para repasar</h3>`;
    session.wrong.forEach(w=>{
      const letters = w.q.letters || ['A','B','C','D'];
      const correctIdx = letters.indexOf(w.q.c);
      html += `<div class="fail-item"><div class="fq">${w.q.q}</div><div class="fa">Correcta: ${w.q.c}) ${w.q.o[correctIdx]}</div></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
}

let lastSet = null;
function buildSessionTracked(temaNums){ lastSet = temaNums.slice(); buildSession(temaNums); }
function startTemaTracked(t){ buildSessionTracked([t]); }
function restartSameSet(){ if(lastSet){ buildSession(lastSet); } else { goHome(); } }

// wrap original entry points to track last set for "repeat"
const _startTema = startTema, _startSpecialtyReview = startSpecialtyReview;
startTema = function(t){ lastSet=[t]; _startTema(t); };
startSpecialtyReview = function(spec){ lastSet=spec.temas.slice(); _startSpecialtyReview(spec); };

loadProgress();

</script>
