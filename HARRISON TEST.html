inición, de un proceso inflamatorio agudo y potencialmente reversible, no crónico."},{"q":"¿Cuál de los siguientes factores de riesgo está asociado con un mayor riesgo de desarrollar pancreatitis crónica?","o":["Consumo excesivo de alcohol.","Tabaquismo.","Diabetes mellitus tipo 2.","Antecedentes familiares de pancreatitis."],"c":"A","e":"El consumo crónico y mantenido de alcohol es el principal factor de riesgo modificable de pancreatitis crónica; el tabaco actúa como cofactor que acelera la progresión pero es de menor peso etiológico global que el alcohol."},{"q":"¿Qué prueba de imagen se utiliza con mayor frecuencia para evaluar la pancreatitis aguda (gravedad, complicaciones locales)?","o":["Tomografía computarizada (TC) abdominal con contraste.","Ecografía abdominal.","Resonancia magnética del páncreas.","Endoscopia digestiva alta."],"c":"A","e":"Aunque el diagnóstico inicial es clínico-analítico, la TC abdominal con contraste (idealmente a partir de las 72 horas si se sospechan complicaciones) es la técnica de imagen más utilizada para valorar la extensión de la necrosis, la gravedad y las complicaciones locales de la pancreatitis aguda."},{"q":"Paciente de 71 años con ictericia, bilirrubina total 6 mg/dl (directa 4 mg/dl), transaminasas normales, GGT y fosfatasa alcalina elevadas, dilatación de la vía biliar intra y extrahepática en ecografía, sin dolor, con pérdida de 5 kg de peso. En la CPRE se aprecia estenosis abrupta del colédoco distal. ¿Cuál es la primera sospecha diagnóstica?","o":["Colangitis esclerosante primaria.","Coledocolitiasis.","Cáncer de páncreas.","Hepatitis aguda."],"c":"C","e":"La tríada de ictericia indolora, colestasis progresiva, pérdida de peso y estenosis abrupta (no cálculo) del colédoco distal en un paciente de edad avanzada es muy sugestiva de neoplasia de la cabeza del páncreas comprimiendo la vía biliar."}]},"37":{"title":"Hepatitis virales agudas y crónicas.","questions":[{"q":"Señale la asociación FALSA respecto a la interpretación serológica de la hepatitis por virus A y B:","o":["IgM anti-VHA: indica vacunación frente al VHA.","AgHBs positivo, IgM anti-HBc positivo y anti-HBs negativo: infección aguda por VHB.","AgHBs negativo, anti-HBc positivo y ADN-VHB detectable en sangre: infección oculta por VHB.","AgHBe positivo: mayor riesgo de exacerbaciones de la hepatitis B."],"c":"A","e":"La IgM anti-VHA indica infección AGUDA reciente por el virus de la hepatitis A, no vacunación (que induce IgG anti-VHA sin IgM); el resto de patrones descritos (infección aguda VHB, infección oculta VHB, y mayor riesgo asociado a AgHBe positivo por alta replicación viral) son correctos."},{"q":"Un paciente oncológico que precisa tratamiento con rituximab presenta serología con HBsAg negativo y anti-HBc positivo. Señale la opción INCORRECTA:","o":["Precisa profilaxis frente a la reactivación del VHB.","El rituximab se asocia a un riesgo alto de reactivación en este perfil serológico.","Debe iniciarse la pauta antiviral al menos 2 semanas antes del tratamiento con rituximab.","El tratamiento antiviral se mantendrá únicamente hasta el cese del tratamiento con rituximab."],"c":"D","e":"Debido al efecto prolongado de depleción de linfocitos B del rituximab, la profilaxis antiviral debe mantenerse entre 12 y 18 meses DESPUÉS de finalizar el tratamiento (no solo hasta su cese), para cubrir el periodo de reconstitución inmunológica en que persiste el riesgo de reactivación."},{"q":"Respecto a la interpretación serológica del virus de la hepatitis B, ¿cuál de las siguientes es correcta?","o":["AgHBs positivo, AntiHBs negativo, AntiHBc IgG positivo, AgHBe positivo, AntiHBe negativo: hepatitis B crónica con baja infectividad.","AgHBs negativo, AntiHBs positivo, AntiHBc negativo: estado postvacunación.","AgHBs positivo, AntiHBc positivo, AgHBe negativo, ADN \\<2000 UI/ml, transaminasas normales e histología normal: «infección oculta».","Todas las anteriores son falsas."],"c":"B","e":"El patrón AgHBs negativo con AntiHBs positivo y AntiHBc negativo es característico del estado post-vacunal (anticuerpo protector aislado sin haber pasado la infección natural). El patrón de la opción A con AgHBe positivo indica en realidad ALTA replicación/infectividad, y el descrito en la opción C corresponde a un «portador inactivo» con AgHBs positivo, no a una infección oculta (que por definición cursa con AgHBs NEGATIVO)."},{"q":"De las siguientes afirmaciones sobre la infección crónica por el virus C de la hepatitis, ¿cuál es correcta?","o":["Se define por la persistencia de ARN-VHC detectable durante más de 6 meses.","En ausencia de tratamiento, la evolución a cirrosis ocurre en el 60% de los casos.","Existen marcadores serológicos específicos que diferencian la infección aguda de la crónica.","Actualmente es infrecuente la necesidad de biopsia hepática para el manejo clínico."],"c":"A","e":"La cronicidad se define por la persistencia del ARN-VHC más allá de 6 meses tras la infección; la progresión a cirrosis en ausencia de tratamiento ocurre en aproximadamente el 15-30% de los casos a los 20-30 años (no el 60%), no existen marcadores serológicos que distingan por sí solos infección aguda de crónica (se requiere el contexto clínico-temporal), y aunque hoy es cierto que se recurre poco a la biopsia gracias a métodos no invasivos, esto no constituye la característica definitoria de la infección crónica que pregunta el enunciado."},{"q":"Indique, de entre los siguientes antivirales de acción directa frente al VHC, cuál NO se considera un fármaco pangenotípico:","o":["Simeprevir.","Velpatasvir.","Grazoprevir.","Pibrentasvir."],"c":"A","e":"Simeprevir, un inhibidor de proteasa de primera generación, carece de actividad adecuada frente a varios genotipos (especialmente el 1a con mutación Q80K y el genotipo 3), por lo que no se considera pangenotípico, a diferencia de velpatasvir y pibrentasvir (y, con matices, grazoprevir en combinación) que forman parte de regímenes de amplio espectro genotípico."},{"q":"¿Cuál de las siguientes combinaciones de antivirales de acción directa frente al VHC no debe utilizarse en el genotipo 3, según ficha técnica?","o":["Grazoprevir-Elbasvir.","Sofosbuvir-Velpatasvir.","Glecaprevir-Pibrentasvir.","Sofosbuvir-Velpatasvir-Voxilaprevir."],"c":"A","e":"Grazoprevir-Elbasvir no está indicado en el genotipo 3 (actividad insuficiente frente a este genotipo según ficha técnica), mientras que las combinaciones basadas en sofosbuvir/velpatasvir o glecaprevir/pibrentasvir sí son pangenotípicas y cubren adecuadamente el genotipo 3."},{"q":"El riesgo de reactivación del VHB es alto en:","o":["Pacientes en tratamiento con rituximab o alemtuzumab, con AgHBs positivo (o AgHBs negativo y anti-HBc positivo).","Pacientes en tratamiento con infliximab y AgHBs positivo (o AgHBs negativo y anti-HBc positivo).","Pacientes en tratamiento con metotrexato en monoterapia y AgHBs positivo.","Todos los anteriores presentan idéntico riesgo alto de reactivación."],"c":"A","e":"Los fármacos que producen depleción profunda de linfocitos B (rituximab, alemtuzumab) constituyen el grupo de mayor riesgo de reactivación del VHB, independientemente del estado de AgHBs; los anti-TNF como infliximab confieren un riesgo intermedio-alto en portadores de AgHBs, y el metotrexato en monoterapia se clasifica habitualmente como de riesgo bajo-moderado, por lo que no todos los fármacos comparten el mismo nivel de riesgo."},{"q":"Respecto al VHC, señale la respuesta correcta:","o":["La principal vía de transmisión es la parenteral, incluyendo utensilios de higiene personal contaminados con sangre (cepillos de dientes, maquinillas de afeitar).","La transmisión por vía sexual es, en general, altamente frecuente.","La transmisión vertical es muy frecuente, superando el 20-30% en madres infectadas.","La infección deja inmunidad protectora que impide la reinfección tras un tratamiento curativo."],"c":"A","e":"La vía parenteral (incluida la exposición indirecta a sangre a través de objetos de higiene personal compartidos) es la principal vía de transmisión del VHC. La transmisión sexual es relativamente poco eficiente en parejas heterosexuales estables, la transmisión vertical se sitúa en torno al 5-6% (mayor si coinfección VIH), y la curación no confiere inmunidad protectora, siendo posible la reinfección tras nueva exposición de riesgo."},{"q":"¿Cuál de los siguientes virus de la hepatitis contiene ADN en su genoma?","o":["VHA.","VHB.","VHC.","VHD."],"c":"B","e":"El virus de la hepatitis B (familia Hepadnaviridae) es el único de los virus hepatotropos principales cuyo genoma es ADN (parcialmente bicatenario); VHA, VHC y VHD son virus ARN."},{"q":"Respecto al virus de la hepatitis D (delta), señale la respuesta INCORRECTA:","o":["Es endémico en países mediterráneos.","El principal reservorio son los seres humanos.","La transmisión vertical es muy frecuente.","El periodo medio de incubación es de 2-3 meses."],"c":"C","e":"A diferencia del VHB, la transmisión vertical del VHD es poco frecuente; requiere coinfección o sobreinfección con VHB (es un virus defectivo que necesita el AgHBs para su ensamblaje), siendo la vía parenteral y sexual las predominantes."},{"q":"Hombre de 28 años, deportista de gimnasio (halterofilia), sin antecedentes patológicos, que consulta por malestar general, ictericia, coluria y prurito discreto. Analítica: bilirrubina directa 5,6 mg/dl, bilirrubina total 5,8 mg/dl, ALT 80 U/l, AST 75 U/l, fosfatasa alcalina 180 U/l y GGT 79 U/l (patrón predominantemente colestásico con transaminasas discretamente elevadas). ¿Cuál es el diagnóstico más probable?","o":["Enfermedad de Gilbert.","Hepatitis aguda viral.","Colelitiasis.","Toxicidad hepática por anabolizantes esteroideos."],"c":"D","e":"El patrón predominantemente colestásico (elevación proporcionalmente mayor de bilirrubina, FA y GGT que de transaminasas) en un varón joven practicante de musculación es muy característico de hepatotoxicidad por esteroides anabolizantes androgénicos, un antecedente que debe indagarse activamente en este perfil de paciente."},{"q":"Paciente senegalés de 45 años, asintomático, remitido por infección conocida por virus de la hepatitis B, exploración física normal. ¿Qué prueba solicitaría para determinar si tiene infección activa o inactiva?","o":["La presencia de anti-HBc.","La presencia de anti-HBe.","El nivel sérico de ADN del VHB.","La presencia de HBsAg."],"c":"C","e":"El AgHBs solo confirma la infección crónica por VHB, pero para distinguir entre fase de infección activa (replicación viral significativa, con o sin daño hepático) y portador inactivo, el parámetro clave es la carga viral (ADN-VHB) junto con las transaminasas, no la mera positividad de anti-HBc o anti-HBe."},{"q":"Paciente diagnosticado de Porfiria Cutánea Tarda remitido por elevación de transaminasas al doble de sus valores basales. ¿Qué prueba solicitaría?","o":["IgM anti-VHA.","HBsAg.","Anticuerpos anti-VHC.","Anticuerpos frente al virus de la hepatitis E."],"c":"C","e":"La porfiria cutánea tarda tiene una asociación epidemiológica muy bien establecida con la infección crónica por el virus de la hepatitis C, que puede además desencadenar o agravar los brotes de porfiria, por lo que ante esta asociación debe descartarse activamente el VHC."},{"q":"¿Cuál de los siguientes marcadores serológicos es específico de la infección activa por el virus de la hepatitis B?","o":["Antígeno de superficie (HBsAg).","Anticuerpo contra el antígeno de superficie (Anti-HBs).","Anticuerpo contra el antígeno del core (Anti-HBc).","Antígeno «e» del virus de la hepatitis B (HBeAg)."],"c":"A","e":"El HBsAg es el marcador serológico que define la presencia de infección activa (aguda o crónica) por VHB; su positividad mantenida más de 6 meses define cronicidad. Anti-HBs indica inmunidad (por infección resuelta o vacunación), y anti-HBc y HBeAg aportan información complementaria pero no confirman por sí solos infección activa."},{"q":"¿Cuál de los siguientes virus de la hepatitis es la causa más frecuente de hepatitis crónica a nivel mundial?","o":["Virus de la hepatitis A.","Virus de la hepatitis B.","Virus de la hepatitis C.","Virus de la hepatitis E."],"c":"B","e":"Según estimaciones de la OMS, el número global de personas con infección crónica por VHB (en torno a 250-300 millones) supera ampliamente al de infección crónica por VHC (unos 58 millones), por lo que el VHB es la causa más frecuente de hepatitis crónica en el mundo; el VHA y el VHE, salvo en inmunodeprimidos (VHE), no cronifican."}]},"38":{"title":"Cirrosis hepáticas e hipertensión portal. Encefalopatía hepática. Descompensación hidrópica. Insuficiencia hepática aguda grave.","questions":[{"q":"Celadora de planta que ingresa por fiebre con tiritona, náuseas y dolor en hipocondrio derecho de 2 semanas de evolución, con antecedente de dolor hipogástrico autolimitado con diarrea hace un mes. TC de abdomen: trombosis portal aguda derecha, lesiones focales hepáticas hipocaptantes y divertículos en sigma con signos inflamatorios discretos. Señale la afirmación más probable:","o":["Se trata de una colecistitis aguda; se avisa a cirugía general.","Se trata de una pileflebitis secundaria a diverticulitis aguda; se inicia antibioticoterapia.","Se trata de una trombosis portal en el contexto de una cirrosis hepática; se anticoagula.","Se trata de un síndrome de Budd-Chiari; se solicita estudio de trombofilia."],"c":"B","e":"El antecedente de diverticulitis reciente, junto con trombosis portal derecha y abscesos hepáticos (lesiones hipocaptantes) es el cuadro clásico de pileflebitis (tromboflebitis séptica de la vena porta) secundaria a un foco infeccioso intraabdominal de drenaje portal, que requiere antibioterapia de amplio espectro (y valorar anticoagulación); no hay datos de cirrosis previa ni de trombosis de venas suprahepáticas propia del Budd-Chiari."},{"q":"Señale la afirmación INCORRECTA en relación con las complicaciones de la cirrosis hepática:","o":["La ascitis es la complicación más frecuente de la cirrosis hepática.","La fiebre es la manifestación clínica más frecuente de la peritonitis bacteriana espontánea.","La hiponatremia inferior a 130 mEq/l es un factor de mal pronóstico.","El hidrotórax hepático muestra un líquido con características de exudado."],"c":"D","e":"El hidrotórax hepático se produce por el paso de líquido ascítico a través de defectos diafragmáticos, por lo que comparte el mecanismo fisiopatológico de la ascitis y es típicamente un TRASUDADO (bajo contenido proteico), no un exudado."},{"q":"Son criterios diagnósticos del síndrome hepatorrenal tipo 1 (SHR-AKI):","o":["Ausencia de shock.","Incremento de creatinina superior a 0,3 mg/dl en 48 horas (criterios de fracaso renal agudo).","Ausencia de proteinuria significativa (\\>500 mg/día) u otros datos de nefropatía orgánica.","Todas las anteriores son correctas."],"c":"D","e":"Los criterios actuales del Club Internacional de Ascitis para el síndrome hepatorrenal-fracaso renal agudo exigen: cirrosis con ascitis, criterios de AKI (incremento de creatinina), ausencia de shock, ausencia de mejoría tras 48h de expansión con albúmina y retirada de diuréticos, ausencia de nefrotoxicidad y ausencia de signos de nefropatía estructural (proteinuria, hematuria, ecografía patológica), por lo que las tres afirmaciones son correctas."},{"q":"Ante un primer episodio de encefalopatía hepática se recomienda:","o":["Tratamiento con laxantes osmóticos (lactulosa), manteniéndolos al alta como profilaxis secundaria.","Rifaximina de entrada, manteniéndola al alta como única profilaxis de nuevos episodios.","Restricción estricta de proteínas en la dieta de forma mantenida.","Las afirmaciones a y b son ciertas."],"c":"A","e":"La lactulosa es el tratamiento de elección del episodio agudo y se recomienda mantenerla como profilaxis secundaria tras el primer episodio; la rifaximina se añade típicamente cuando hay recidivas a pesar de la lactulosa (profilaxis de segunda línea), y la restricción proteica mantenida no se recomienda actualmente por el riesgo de empeorar el estado nutricional del paciente cirrótico, prefiriéndose un aporte proteico adecuado con proteínas de origen vegetal/lácteo cuando sea posible."},{"q":"Respecto al edema cerebral como complicación de la insuficiencia hepática aguda grave (fallo hepático fulminante), marque la respuesta CORRECTA:","o":["El mecanismo de producción es fundamentalmente vasogénico.","Es frecuente en los grados I y II de encefalopatía.","Es menos frecuente en pacientes con curso agudo o hiperagudo.","Es la causa principal de muerte y se debe a hipertensión intracraneal."],"c":"D","e":"El edema cerebral (de mecanismo predominantemente citotóxico, por acumulo de glutamina astrocitaria derivada del amonio, y no vasogénico) es una de las principales causas de muerte en el fallo hepático fulminante, por el desarrollo de hipertensión intracraneal y herniación; es más frecuente en encefalopatía de grados avanzados (III-IV) y en los cursos hiperagudos/agudos (menor tiempo de adaptación cerebral), no en los subagudos."},{"q":"En pacientes con cirrosis hepática en situación de descompensación hidrópica, están formalmente contraindicados los siguientes fármacos, EXCEPTO:","o":["Antiinflamatorios no esteroideos.","Inhibidores de la enzima convertidora de angiotensina (IECA).","Antagonistas de los receptores de angiotensina II (ARA-II).","Betabloqueantes."],"c":"D","e":"Los AINE (por nefrotoxicidad e interferencia con prostaglandinas renales), los IECA y los ARA-II (por el riesgo de hipotensión y deterioro de la perfusión renal en un paciente con vasodilatación esplácnica) están formalmente contraindicados en la ascitis cirrótica; los betabloqueantes, en cambio, se mantienen habitualmente (e incluso se indican) para la profilaxis del sangrado variceal, aunque requieren ajuste o suspensión transitoria en caso de hipotensión grave, shock, síndrome hepatorrenal o PBE refractaria («ventana de betabloqueantes»)."},{"q":"Sobre la hipertensión portal como mecanismo fundamental de la ascitis en la cirrosis hepática, indique la respuesta INCORRECTA:","o":["Desencadena la liberación de óxido nítrico esplácnico.","Se produce una reducción secundaria de la resistencia vascular sistémica.","Se inhibe el sistema nervioso simpático.","Se estimula la secreción de hormona antidiurética (ADH)."],"c":"C","e":"La vasodilatación esplácnica mediada por óxido nítrico reduce la resistencia vascular sistémica y el volumen arterial efectivo, lo que ACTIVA (no inhibe) los sistemas neurohormonales vasoconstrictores y retenedores de sodio y agua: sistema renina-angiotensina-aldosterona, sistema nervioso simpático y hormona antidiurética, en un intento de mantener la presión arterial."},{"q":"Paciente de 65 años con hipertensión arterial y cirrosis hepática en tratamiento con enalapril y espironolactona, que acude por astenia y debilidad muscular severa, con presión arterial 100/57 mmHg. En el ECG destacan ondas T picudas, extrasístoles ventriculares y QT corto. ¿Cuál es el diagnóstico más probable?","o":["Hipernatremia.","Hipocalcemia.","Hiperpotasemia.","Hipomagnesemia."],"c":"C","e":"La combinación de un IECA con un diurético ahorrador de potasio (espironolactona) es una causa clásica de hiperpotasemia, cuyos signos electrocardiográficos característicos son precisamente las ondas T picudas y el acortamiento del intervalo QT, junto con arritmias ventriculares en casos graves."},{"q":"Cirrótico de 68 años con hipertensión portal, ascitis franca de 10 días de evolución. Paracentesis: albúmina 4 g/dl, leucocitos 500/mm³ (85% PMN), eritrocitos 1100/mm³, Gram con cocos en cadena, cultivo positivo para neumococo. Señale la respuesta ERRÓNEA:","o":["En la bacteriascitis (cultivo positivo, PMN \\<250/mm³) sin signos de infección no deben administrarse antibióticos, aunque se recomienda repetir la paracentesis para vigilar la progresión a PBE.","En este paciente, la profilaxis antibiótica futura solo estará indicada si además presenta una hemorragia digestiva alta por rotura de varices.","La profilaxis antibiótica de la PBE con rifaximina en pacientes cirróticos ofrece la ventaja adicional de prevenir la encefalopatía hepática.","El uso de inhibidores de la bomba de protones en pacientes cirróticos se ha asociado a un aumento de la incidencia de PBE y de infección por Clostridioides difficile."],"c":"B","e":"Este paciente ya ha presentado un episodio de peritonitis bacteriana espontánea (PMN \\>250/mm³ con cultivo positivo), lo que por sí solo constituye indicación de profilaxis antibiótica secundaria continuada (norfloxacino o ciprofloxacino), independientemente de que presente o no en el futuro una hemorragia digestiva por varices, que sería una indicación adicional de profilaxis PRIMARIA en otro contexto distinto."},{"q":"Las siguientes son causas potenciales de LDL elevado, EXCEPTO:","o":["Cirrosis hepática.","Hipotiroidismo.","Síndrome nefrótico.","Diuréticos tiazídicos."],"c":"A","e":"En la cirrosis avanzada, el fallo de síntesis hepática condiciona típicamente una disminución del colesterol total y del LDL (a diferencia del hipotiroidismo, el síndrome nefrótico o los diuréticos tiazídicos, que sí elevan el LDL), por lo que es la opción que no encaja como causa de hipercolesterolemia."},{"q":"¿Qué actitud tomaría en un paciente cirrótico con ascitis cuya excreción de sodio urinario es mayor de 100 mEq/día?","o":["Tratamiento con espironolactona 100 mg/día.","Dieta sin sal (restricción de sodio), sin necesidad de escalar diuréticos.","Tratamiento con espironolactona 25 mg al día.","Tratamiento combinado con espironolactona y furosemida."],"c":"B","e":"Una natriuresis urinaria elevada (\\>100 mEq/día) indica que el paciente ya está eliminando sodio de forma eficaz, por lo que basta con reforzar la restricción dietética de sodio, sin necesidad de iniciar o intensificar el tratamiento diurético en ese momento."},{"q":"Hombre de 68 años con cirrosis crónica por VHC y alcohol, sin antecedentes de hemorragia digestiva alta, presenta varices esofágicas grandes en la endoscopia de control. ¿Qué fármaco sería de elección para la prevención primaria del sangrado?","o":["Metoprolol.","Propranolol.","Atenolol.","Nitratos."],"c":"B","e":"Los betabloqueantes no cardioselectivos (propranolol, nadolol, carvedilol) son de elección en la profilaxis primaria del sangrado por varices esofágicas grandes, al reducir el flujo esplácnico y la presión portal; los betabloqueantes cardioselectivos no han demostrado este beneficio."},{"q":"¿Cuál de las siguientes complicaciones NO se asocia con la cirrosis hepática?","o":["Ascitis.","Encefalopatía hepática.","Hipertensión portal.","Pancreatitis aguda."],"c":"D","e":"Ascitis, encefalopatía hepática e hipertensión portal son complicaciones directas y características de la cirrosis hepática por el fallo de función y la distorsión arquitectural del hígado; la pancreatitis aguda no es una complicación propia de la cirrosis (aunque ambas puedan compartir un factor causal común, como el alcohol)."},{"q":"¿Cuál de las siguientes afecciones se caracteriza por la inflamación crónica de los conductos biliares con obstrucción del flujo biliar?","o":["Colangitis (esclerosante).","Cirrosis hepática.","Hepatitis viral.","Enfermedad de Caroli."],"c":"A","e":"La colangitis (en su forma esclerosante, crónica) se define precisamente por la inflamación y fibrosis progresiva de los conductos biliares intra y/o extrahepáticos, con estenosis y obstrucción del flujo biliar, pudiendo evolucionar secundariamente a cirrosis biliar."},{"q":"Señale la opción correcta en cuanto a la causa más frecuente de los derrames pleurales de tipo trasudado:","o":["Cáncer.","Insuficiencia cardíaca.","Tuberculosis.","Cirrosis hepática."],"c":"B","e":"La insuficiencia cardíaca congestiva es la causa más frecuente de trasudado pleural a nivel global, seguida de la cirrosis hepática con ascitis (hidrotórax hepático) y el síndrome nefrótico; cáncer y tuberculosis son causas típicas de exudado, no de trasudado."},{"q":"¿Cuál de las siguientes afecciones es una causa común de ictericia?","o":["Colecistitis aguda.","Enfermedad de Crohn.","Cirrosis hepática.","Sepsis."],"c":"C","e":"La cirrosis hepática, por el fallo de la función excretora y de conjugación hepatocelular junto con la posible hipertensión portal asociada, es una causa frecuente y característica de ictericia crónica, a diferencia de las otras opciones, en las que la ictericia no es una manifestación habitual o predominante."},{"q":"¿Cuál de las siguientes opciones puede ser causa de ascitis?","o":["Pancreatitis aguda.","Insuficiencia cardíaca congestiva.","Enfermedad de Crohn.","Hipertiroidismo."],"c":"B","e":"La insuficiencia cardíaca congestiva, por elevación de la presión venosa sistémica y congestión hepática, es una causa reconocida de ascitis (trasudado con gradiente de albúmina suero-ascitis elevado), al igual que la cirrosis; aunque la pancreatitis aguda grave también puede excepcionalmente producir ascitis pancreática, la insuficiencia cardíaca es la causa clásicamente preguntada en este contexto."}]},"39":{"title":"Artritis reumatoide y enfermedad de Still del adulto. Espondiloartritis.","questions":[{"q":"¿Cuál de las siguientes es la manifestación extraarticular más común de la espondilitis anquilosante?","o":["Uveítis anterior","Insuficiencia aórtica","Enfermedad intestinal inflamatoria","Fibrosis pulmonar","Bloqueo cardiaco de tercer grado"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) Aunque la complicación espinal más grave de la espondilitis anquilosante es la fractura, existen varias manifestaciones extraarticulares importantes. La uveítis anterior es la más frecuente y se presenta en 40% de los pacientes con espondilitis anquilosante. Se ha notificado que con frecuencia está presente la enfermedad intestinal inflamatoria. Las complicaciones menos frecuentes incluyen insuficiencia aórtica, bloqueo cardiaco de tercer grado, nódulos pulmonares y fibrosis del lóbulo superior, disfunción cardiaca, fibrosis retroperitoneal, prostatitis y amiloidosis.","letters":["A","B","C","D","E"]},{"q":"Un varón de 57 años acudió a la clínica por dolor de inicio reciente en el codo derecho. Trabaja para una corporación internacional y por esa razón viaja con frecuencia. Este viaje le obliga a llevar maletas al aeropuerto en sus viajes semanales fuera de la ciudad. Señala que el dolor empeora cuando da la mano en las reuniones de negocios. En la exploración física, no se observa hinchazón en el codo ni en otras articulaciones. El dolor es reproducible por palpación en la región lateral del codo. ¿Cuál de las siguientes opciones es una opción para el tratamiento de su afección musculoesquelética?","o":["Adalimumab","Inyección de corticosteroides en el epicóndilo lateral","Metotrexato","Fármacos antiinflamatorios no esteroideos y reposo","B y D"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 375) La epicondilitis lateral, también conocida como codo de tenista, es una afección dolorosa de los tejidos blandos sobre la cara externa del codo. El dolor se origina en o cerca del sitio de unión de los extensores comunes del epicóndilo externo y puede irradiarse hacia el antebrazo y el dorso de la muñeca. El dolor suele aparecer después del trabajo o de actividades recreativas que implican movimientos repetidos de extensión de muñeca y supinación contra resistencia. La mayoría de los pacientes con este trastorno se lesionan en actividades distintas al tenis, como cortar maleza, cargar maletas o maletines o usar un destornillador. La lesión en el tenis suele ocurrir al golpear un revés con el codo en flexión. Saludar con la mano y abrir puertas puede reproducir el dolor. Golpear la región externa del codo contra un objeto sólido también puede provocar dolor. El tratamiento suele consistir en reposo junto con la administración de fármacos antiinflamatorios no esteroideos. El ultrasonido, el hielo y el masaje con fricción también pueden ayudar a aliviar el dolor. Cuando el dolor es intenso, se coloca el codo en un cabestrillo o férula con 90° de flexión. Cuando el dolor es agudo y está bien localizado, la inyección de un glucocorticoide con una aguja de pequeño calibre puede ser eficaz. Después de la inyección, se debe aconsejar al paciente que mantenga en reposo el brazo durante al menos un mes y evitar actividades que puedan agravar el dolor. Una vez que los síntomas han desaparecido, el paciente debe comenzar la rehabilitación para fortalecer y aumentar la flexibilidad de los músculos extensores antes de reanudar la actividad física que involucra el brazo. Se coloca un cabestrillo 2.5 a 5, cm por debajo del codo para ayudar a reducir la tensión en los músculos extensores en su unión con el epicóndilo lateral. Se debe aconsejar al paciente que restrinja las actividades que requieran extensión forzada y supinación de la muñeca. La mejora puede tardar varios meses. El paciente puede continuar experimentando dolor leve, pero con los cuidados, por lo general puede evitar la recidiva del dolor debilitante. En ocasiones, puede ser necesaria la liberación quirúrgica de la aponeurosis extensora. El metotrexato y el adalimumab se usan para tratar diversas enfermedades autoinmunitarias, como la artritis reumatoide. Estos fármacos no son el tratamiento adecuado para la epicondilitis lateral.","letters":["A","B","C","D","E"]},{"q":"En comparación con pacientes con artritis reumatoide (RA, rheumatoid arthritis) que no tienen anticuerpos contra péptidos cíclicos citrulinados (CCP, cyclic citrullinated protein), los pacientes con artritis reumatoide que tienen anticuerpos contra CCP:","o":["Son menos propensos a desarrollar manifestaciones extraarticulares de artritis reumatoide (p. ej., vasculitis)","Tienen menos probabilidades de tener antecedentes de tabaquismo","Desarrollan menos erosiones óseas subcondrales en los estudios de imagen a lo largo de la evolución de la enfermedad","Tienen una mayor prevalencia de tener alelos de epítopos de riesgo compartido (HLA-DRB1)","Tienen puntuaciones más bajas para incapacidad física"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 358) Los anticuerpos séricos contra péptidos cíclicos citrulinados (anti-CCP) se incluyen sistemáticamente, junto con el factor reumatoide en la valoración diagnóstica de los pacientes con sospecha de artritis reumatoide (AR) y sirven como biomarcadores de importancia pronóstica. Los anticuerpos contra péptidos cíclicos citrulinados se asocian con una mayor probabilidad de enfermedad grave, incluidas erosiones óseas e incapacidad física. Las manifestaciones extraarticulares pueden desarrollarse durante la evolución de la artritis reumatoide hasta en 40% de los pacientes, incluso antes de la aparición de artritis. Los pacientes con mayor probabilidad de desarrollar enfermedad extraarticular tienen antecedentes de tabaquismo, incapacidad física significativa de inicio temprano y resultados positivos en la prueba de detección del factor reumatoide (RF, rheumatoid factor) sérico o anticuerpos contra péptidos cíclicos citrulinados. La vasculitis reumatoide se presenta típicamente en pacientes con enfermedad de larga evolución, una prueba positiva para anticuerpos contra factor reumatoide o anticuerpos contra péptidos cíclicos citrulinados séricos e hipocomplementemia. Los alelos que se sabe que confieren el mayor riesgo de artritis reumatoide se encuentran dentro del complejo mayor de histocompatibilidad (MHC). Se ha estimado casi 13% del riesgo genético de artritis reumatoide reside en este locus. La mayor parte de este riesgo, aunque probablemente no todo, se asocia con la variación alélica del gen HLA-DRB1, que codifica la molécula de la cadena β del MHC II. Los alelos HLA-DRB1 asociados con la enfermedad comparten una secuencia de aminoácidos en las posiciones 70--74 de la tercera región hipervariable de la cadena β HLA-DR, denominada epítopo compartido. El estado de portador de los alelos epítopos compartidos se asocia con la producción de anticuerpos contra péptidos cíclicos citrulinados y con peores resultados patológicos. Algunos de estos alelos HLA-DRB1 presentan un alto riesgo de enfermedad (\\*0401), mientras que otros confieren un riesgo más moderado (\\*0101, \\*0404, \\*1001 y\\*0901). Además de la predisposición genética, una serie de factores ambientales han sido implicados en la patogénesis de la artritis reumatoide. El más reproducible de estos vínculos ambientales es el tabaquismo. Numerosos estudios de cohorte y de casos y testigos han demostrado que fumar confiere un riesgo relativo para desarrollar artritis reumatoide de 1.5 a 3.5. El riesgo del tabaquismo está relacionado casi exclusivamente con el factor reumatoide y la enfermedad positiva para anticuerpos contra péptidos cíclicos citrulinados.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 42 años fue valorada en el consultorio de su médico familiar por dolor difuso y fatiga. Tiene dificultades para localizar el dolor en cualquier articulación o ubicación en particular, pero informa que afecta a sus extremidades superiores e inferiores, cuello y cadera. El dolor se describe con una intensidad 10/10. Percibe rigidez articular, pero no ha notado que empeore por la mañana. El dolor ha estado presente durante los últimos seis meses y se ha incrementado en intensidad. Ha probado ibuprofeno de venta sin receta y paracetamol sin alivio significativo. La paciente siente como si el dolor estuviera interfiriendo con su capacidad de tener un sueño reparador y tiene dificultad para concentrarse. Ha faltado varios días al trabajo como camarera y teme perder su empleo. La paciente tiene antecedentes de depresión y obesidad. Está tomando 150 mg diarios de venlafaxina de liberación sostenida. Tiene antecedentes familiares de artritis reumatoide en su madre. Fuma un paquete de cigarrillos al día. En la exploración física, los signos vitales son normales. Su índice de masa corporal es de 36 kg/m2. La exploración de las articulaciones no muestra eritema, hinchazón ni derrames. Hay dolor difuso a la palpación en los puntos de inserción de los músculos suboccipitales, en el punto medio del borde superior del músculo trapecio, a lo largo de la segunda articulación costocondral, en los epicóndilos laterales y a lo largo de la almohadilla grasa medial de las rodillas. Todas las siguientes afirmaciones sobre la causa del síndrome de dolor difuso de este paciente son ciertas EXCEPTO:","o":["La disfunción cognitiva, los trastornos del sueño, la ansiedad y la depresión son afecciones neuropsicológicas comórbidas comunes.","El dolor en este síndrome se asocia con una mayor sensibilidad al dolor evocado.","El dolor en este síndrome a menudo se localiza en articulaciones específicas.","Este síndrome está presente en 2% a 5% de la población general, pero su prevalencia aumenta 20% o más en pacientes con trastornos reumáticos degenerativos o inflamatorios.","Las mujeres tienen nueve veces más probabilidades que los hombres de verse afectadas por este síndrome."],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 373) Este paciente presenta antecedentes característicos de fibromialgia, un síndrome de dolor difuso relacionado con una mayor sensibilidad al dolor evocado. Se considera que la fisiopatología subyacente del dolor en la fibromialgia está relacionada con la alteración del procesamiento del dolor en el sistema nervioso central. Desde el punto de vista epidemiológico, las mujeres se ven afectadas nueve veces más que los varones. La prevalencia mundial de fibromialgia es de 2% a 3%, pero en la práctica, en la atención del médico familiar, alcanza 5% a 10%. El trastorno es aún más frecuente en pacientes con enfermedades reumáticas degenerativas o inflamatorias, con una prevalencia de 20% o más. El síntoma de presentación más común es el dolor difuso difícil de localizar. El dolor se encuentra por arriba y por debajo de la cintura y afecta tanto a las extremidades como al esqueleto axial. Sin embargo, no se localiza en una articulación específica. Se observa que el dolor es intenso y difícil de ignorar e interfiere con las actividades cotidianas. Aunque este paciente presenta dolor en varios puntos dolorosos, el American College of Rheumatology ya no incluye la valoración de puntos dolorosos en los criterios diagnósticos de fibromialgia. Los nuevos criterios se centran en los síntomas clínicos de dolor generalizado y síntomas neuropsicológicos que han estado presentes durante al menos tres meses. Algunas de las enfermedades neuropsicológicas que se observan con frecuencia en la fibromialgia incluyen trastornos del sueño, deterioro del funcionamiento cognitivo, fatiga, rigidez, ansiedad y depresión. La prevalencia a lo largo de la vida de los trastornos del estado de ánimo en pacientes con fibromialgia es de 80%. Los trastornos del sueño pueden incluir dificultad para conciliar el sueño, dificultad para permanecer dormido o sueño no reparador, entre otros.","letters":["A","B","C","D","E"]},{"q":"Todos los fármacos siguientes son eficaces para la artritis psoriásica y para la psoriasis de la piel EXCEPTO:","o":["Adalimumab","Infliximab","Rituximab","Secukinumab","Ustekinumab"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) Idealmente, el tratamiento coordinado se dirige tanto a la piel como a las articulaciones en la artritis psoriásica (PsA, psoriatic arthritis). El uso de fármacos antagonistas de factor de necrosis tumoral α ha revolucionado el tratamiento de la artritis psoriásica. Se ha observado una resolución rápida y espectacular tanto de la artritis como de las lesiones cutáneas en estudios clínicos con asignación al azar y grupo testigo grandes. Muchos de los pacientes que presentaron respuesta tenían enfermedad de larga evolución que era resistente a todos los tratamientos previos, así como enfermedades cutáneas extensas. El secukinumab es un anticuerpo monoclonal contra IL--17A que es eficaz en el tratamiento de la psoriasis y de la artritis psoriásica. El ixekizumab, otro antagonista de IL--17, ha recibido aprobación para el tratamiento de la psoriasis y la artritis psoriásica. El ustekinumab, un anticuerpo monoclonal contra la subunidad compartida de IL--23/IL--12p40, es un tratamiento eficaz para la psoriasis y tiene cierta eficacia para la artritis psoriásica. Otro tratamiento para la artritis psoriásica se ha basado en fármacos que tienen eficacia en la artritis reumatoide, en la psoriasis o en ambas. El metotrexato en dosis de 15 a 25 mg/semana tiene una eficacia moderada para la psoriasis, pero su eficacia para la artritis psoriásica es limitada. La sulfasalazina (por lo general administrada en dosis de 2 a 3 g por día) puede no ser eficaz para ninguno de los dos y ninguno de los dos regímenes detiene la progresión de la enfermedad articular erosiva. Otros fármacos con eficacia en la psoriasis que se ha informado que son beneficiosos para la artritis psoriásica son la ciclosporina, los derivados del ácido retinoico y los psoralenos más la luz UVA. El inhibidor de la pirimidina sintetasa leflunomida ha demostrado ser beneficioso en la artritis psoriásica, con un beneficio modesto para la psoriasis. El rituximab ha recibido aprobación de la U.S. Food and Drug Administration para pacientes con AR, pero no ha demostrado eficacia en la psoriasis ni en la artritis psoriásica. El rituximab es más eficaz en pacientes con artritis reumatoide y autoanticuerpos (factor reumatoide y anticuerpos contra péptidos cíclicos citrulinados), algo que no se observa en la mayor parte de los pacientes con artritis psoriásica.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 36 años se presenta a consulta con dolor difuso en todo el cuerpo asociado con fatiga, insomnio y dificultad para concentrarse. La paciente refiere que es un dolor mal localizado, con intensidad de 7 a 8 sobre 10 y no se alivia con fármacos antiinflamatorios no esteroideos. Tiene antecedentes de trastorno de ansiedad generalizada de larga evolución y recibe tratamiento con 100 mg al día de sertralina, así como con clonazepam 1 mg cada 12 h. En la exploración física, tiene dolor a la palpación en varios sitios del aparato musculoesquelético. Sus datos de laboratorio reportaron biometría hemática completa, química sanguínea, tasa de eritrosedimentación y factor reumatoide, todos normales. Se estableció el diagnóstico de fibromialgia. Se recomiendan todos los siguientes tratamientos como parte del plan terapéutico de la fibromialgia, EXCEPTO:","o":["Un programa de ejercicios que incluye entrenamiento de fuerza, ejercicios aeróbicos y yoga","Terapia cognitivo-conductual para el insomnio","Milnaciprán","Oxicodona","Pregabalina"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 373) La fibromialgia es un trastorno común que afecta a 2% a 5% de la población. Se presenta como un síndrome de dolor difuso con síntomas neuropsicológicos asociados que incluyen depresión, ansiedad, fatiga, disfunción cognitiva y trastornos del sueño. El tratamiento de la fibromialgia debe incluir una combinación de medidas farmacológicas y no farmacológicas. La enseñanza al paciente sobre la enfermedad es importante para que comprenda los síntomas. El tratamiento no debe centrarse en eliminar el dolor sino en mejorar la función y la calidad de vida. El acondicionamiento físico es una parte importante de la mejora de la función y debe incluir un programa de ejercicios multifacético con ejercicio aeróbico, entrenamiento de fuerza y ejercicios que incorporen técnicas de relajación como yoga o tai chi. La terapia cognitivo-conductual puede ser útil para mejorar los trastornos del sueño y también para disminuir las conductas patógenas. El tratamiento farmacológico en la fibromialgia está dirigido a las vías del dolor aferente y eferente. Las dos categorías más comunes de fármacos para la fibromialgia son los antidepresivos y los anticonvulsivos. La amitriptilina, duloxetina y milnacipran se han usado con cierta eficacia en la fibromialgia. La U.S. Food and Drug Administration (FDA) aprueba la duloxetina y el milnacipran para el tratamiento de la fibromialgia. Los anticonvulsivos que se utilizan predominantemente en la fibromialgia son los ligandos de la subunidad α-2-δ de los conductos de calcio dependientes de voltaje. Estos incluyen gabapentina y pregabalina, que también están aprobados por la FDA para el tratamiento de la fibromialgia. Los fármacos antiinflamatorios y los glucocorticoides no son eficaces en la fibromialgia. Sin embargo, si existe una afección desencadenante simultánea, como la artritis reumatoide, el tratamiento adecuado dirigido al trastorno subyacente es fundamental para controlar los síntomas de la fibromialgia. Deben evitarse los analgésicos opioides como la oxicodona. No tienen eficacia en el tratamiento de la fibromialgia y pueden inducir hiperalgesia que puede empeorar el dolor y la función.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes enfermedades tiene una fuerte asociación genética con un alelo particular del complejo mayor de histocompatibilidad de clase I?","o":["Espondilitis anquilosante","Enfermedad celíaca","Enfermedad de Huntington","Artritis reumatoide","Diabetes tipo 1"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 1 El sistema inmunitario en la salud y la enfermedad, Sección 2 Enfermedades mediadas por el sistema inmunitario, caps. 360 y 362) Aunque las asociaciones de la enfermedad humana con alelos o haplotipos específicos del antígeno leucocítico humano (HLA) afectan principalmente a la región de clase II, también hay varias asociaciones patógenas prominentes con los alelos de clase I. La espondilitis anquilosante tiene una fuerte asociación con HLA-B27, una molécula del complejo mayor de histocompatibilidad (MHC) de clase I. La enfermedad celíaca, la artritis reumatoide y la diabetes tipo 1 se asocian con alelos HLA-DQ o HLA-DR específicos, que son alelos del MHC de clase II. La enfermedad de Huntington tiene herencia mendeliana autosómica dominante.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 30 años acudió a una clínica de medicina interna por dolor articular e hinchazón de dos años de evolución acompañado de rigidez matutina. La paciente niega dolor de espalda o de cuello. Los síntomas han afectado principalmente a las extremidades inferiores. Refirió hinchazón intermitente en los tendones de Aquiles, tobillos y rodillas. Niega psoriasis o antecedentes familiares de enfermedades de la piel. Niega síntomas gastrointestinales o episodios previos de infección. En la exploración física se encontró entesitis del tendón de Aquiles del lado derecho, sinovitis del tobillo izquierdo y dactilitis del tercer y cuarto dedos de la mano derecha. Los estudios de imagen de las articulaciones sacroiliacas con resonancia magnética no muestran erosiones ni edema de la médula ósea. Los exámenes de laboratorio muestran elevación de proteína C reactiva, factor reumatoide negativo y anticuerpos negativos contra péptidos cíclicos citrulinados. ¿Cuál de los siguientes diagnósticos es el más probable?","o":["Espondilitis anquilosante","Espondiloartritis periférica","Artritis psoriásica","Artritis reactiva","Artritis reumatoide"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) Muchos pacientes presentan algunas características de una o más de las espondiloartrítides. Hasta hace poco, se decía que estos pacientes tenían espondiloartritis indiferenciada (SpA, spondyloarthritis) o simplemente espondiloartritis, según lo definido por los criterios del 1991 European Spondyloarthropathy Study Group. Por ejemplo, un paciente puede presentar sinovitis inflamatoria de una rodilla, tendinitis del tendón de Aquiles y dactilitis. Algunos de estos pacientes pueden tener artritis reactiva en la que la infección desencadenante permanece clínicamente asintomática. En algunos otros casos, el paciente desarrolla enfermedad intestinal inflamatoria o psoriasis. El diagnóstico de espondiloartritis indiferenciada también se aplicó comúnmente a pacientes con dolor de espalda inflamatorio que cumplían los criterios modificados de Nueva York para la espondilitis anquilosante. Comparables con los criterios de clasificación de los síntomas axiales, los grupos de consenso han formulado criterios para la espondiloartritis periférica (cuadro VIII--41). Con ello se pretende excluir a los pacientes con síntomas axiales y dividir así el universo de pacientes con espondiloartritis en subgrupos predominantemente axiales y predominantemente periféricos. Esta paciente es seronegativa para el factor reumatoide y espondiloartrítides por anticuerpos contra péptidos cíclicos citrulinados, además de tener dactilitis y entesitis, lo que disminuye las posibilidades de artritis reumatoide. No hay antecedentes personales o familiares de psoriasis que sugieran artritis psoriásica. Ella niega el dolor de espalda inflamatorio y tiene una resonancia magnética sacroiliaca normal lo que disminuye las posibilidades de espondilitis anquilosante. CUADRO VIII--41Valoración de los criterios de la Spondyloarthritis International Society (ASAS) para la espondiloartritis periféricaa ----------------------------------------------------------------------- **Artritisb, entesitis o dactilitis** ----------------------------------------------------------------------- ADEMÁS DE Una o varias de las siguientes características de espondiloartritis: Psoriasis Enfermedad de Crohn o colitis ulcerosa Infección previa Uveítis HLA-B27. Sacroileitis en los estudios de imagen (radiografías o resonancia magnética) O dos o más de las siguientes características de espondiloartritis: Artritis Entesitis Dactilitis Dorsalgia inflamatoria Antecedentes de espondiloartritis ----------------------------------------------------------------------- aSensibilidad 78%, especificidad 82%. bArtritis periférica, por lo general con predominio en los miembros inferiores, asimétrica o ambos. Las diversas características de la espondiloartritis (SpA) se definen en el cuadro 355--1 de la HPIM 20. La infección precedente se refiere al antecedente de infección urogenital o del tubo digestivo. Datos tomados de Rudwaleit M et al: The Assessment of Spondyloarthritis International Society classification criteria for peripheral spondyloarthritis and for spondyloarthritis in general. Ann Rheum Dis 70:25, 2011.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de los siguientes hallazgos se observa típicamente en pacientes con fibromialgia?","o":["Incremento de proteína C reactiva","Incremento de hormona estimulante de la tiroides","Erosiones de las articulaciones metacarpofalángicas en las radiografías","Anticuerpos antinucleares positivos","Dolor a la compresión de un pliegue cutáneo detectado en la exploración física"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 373) El dolor de la fibromialgia (FM) se asocia con dolor a la palpación y aumento de la sensibilidad al dolor evocado. En la práctica clínica, esta sensibilidad elevada puede identificarse por el dolor inducido por la presión de un manguito de presión arterial o por el dolor al presionar un pliegue cutáneo. Más formalmente, un examinador puede completar un examen de puntos dolorosos en el que el examinador utiliza el pulgar para ejercer una presión cercana a 4 kg/m2 (o la cantidad de presión que ocasione palidez de la punta de la uña) en sitios musculotendinosos bien definidos. Las pruebas radiográficas y de laboratorio de rutina arrojan resultados normales en pacientes con fibromialgia; por lo tanto, las pruebas diagnósticas se centran en la exclusión de otros diagnósticos y en la valoración de los generadores de dolor o enfermedades asociadas (cuadro VIII--84). Debe valorarse a la mayor parte de los pacientes con dolor crónico generalizado de aparición reciente para determinar las causas más frecuentes en el diagnóstico diferencial. Las pruebas radiográficas deben utilizarse con moderación y solo para el diagnóstico de la artritis inflamatoria. Una vez que se valora el paciente minuciosamente, se desaconseja repetir las pruebas a menos que cambie el complejo sintomático. Se desaconseja en particular la resonancia magnética de la columna vertebral a menos que haya características que sugieran enfermedad inflamatoria de la columna vertebral o síntomas neurológicos. CUADRO VIII--84Pruebas radiográficas y de laboratorio en pacientes con síntomas de fibromialgia ----------------------------------------------------------------------- **Exámenes de rutina** ----------------------------------------------------------------------- Tasa de eritrosedimentación o proteína C reactiva Biometría hemática completa Hormona estimulante de la tiroides Guiado por la anamnesis y la exploración física Panel metabólico completo Anticuerpos antinucleares Anti-SSA y anti-SSB Factor reumatoide y anticuerpos contra péptido cíclico citrulinado Creatinfosfocinasa Estudios serológicos virales (p. Ej., hepatitis C, VIH) y bacteriano (p. ej. enfermedad de Lyme) Radiografías de columna y articulaciones ----------------------------------------------------------------------- Abreviaturas: Anti-SSA, anti-Sjögren A; anti-SSB, anti-Sjögren B. Fuente Datos tomados de Arnold LM et al: J Women's Health 21:231, 2012; Fitzcharles MA et al: J Rheumatol 40:1388, 2013.","letters":["A","B","C","D","E"]},{"q":"Los pacientes con artritis reumatoide tienen un mayor riesgo de padecer todas las siguientes afecciones en comparación con la población general EXCEPTO:","o":["Cáncer colorrectal","Arteriopatía coronaria","Hipoandrogenismo","Linfoma","Osteoporosis"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 358) Los pacientes con artritis reumatoide deben ser vigilados para detectar enfermedades asociadas específicas de las que tienen un mayor riesgo. La causa más frecuente de muerte en los pacientes con artritis reumatoide es la enfermedad cardiovascular. La incidencia de arteriopatía coronaria y aterosclerosis carotídea es más elevada en los pacientes con artritis reumatoide que en la población general, incluso cuando se controlan los factores de riesgo cardiaco tradicionales, como hipertensión, obesidad, hipercolesterolemia, diabetes y tabaquismo. Grandes estudios de cohorte han mostrado un aumento de dos a cuatro veces en el riesgo de linfoma en los pacientes con artritis reumatoide en comparación con la población general. El tipo de linfoma histopatológico más común es el linfoma difuso de linfocitos B grandes. La artritis reumatoide no se ha relacionado con un aumento de las tasas de cáncer colorrectal ni de otros tumores sólidos, a excepción del cáncer de pulmón, que es ligeramente más elevado. La osteoporosis es más frecuente en los pacientes con artritis reumatoide que en una población similar en cuanto a edad y sexo, con tasas de prevalencia de 20% a 30%. El medio inflamatorio de la articulación probablemente se extiende al resto del cuerpo y favorece la pérdida ósea generalizada mediante la activación de los osteoclastos. El uso crónico de glucocorticoides y la inmovilidad relacionada con la incapacidad también contribuyen a la osteoporosis. Los varones y mujeres posmenopáusicas con artritis reumatoide tienen niveles medios de testosterona sérica, hormona luteinizante y dehidroepiandrosterona más bajos que las poblaciones testigo. Por lo tanto, se ha planteado la hipótesis de que el hipoandrogenismo puede participar en la patogenia de la artritis reumatoide o surgir como consecuencia de la respuesta inflamatoria crónica.","letters":["A","B","C","D","E"]},{"q":"¿En qué porcentaje de pacientes estadounidenses con espondilitis anquilosante está presente el antígeno leucocítico humano B27?","o":["10%","30%","50%","80%","100%"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) La espondilitis anquilosante está estrechamente relacionada con la presencia del antígeno de histocompatibilidad HLA-B27. En los estadounidenses caucásicos, la prevalencia de B27 es de 7%, pero en pacientes con espondilitis anquilosante es de 75% a 90%. No todas las personas con B27 desarrollan espondilitis anquilosante; la enfermedad solo está presente en el 1% a 6% de los individuos positivos para B27.","letters":["A","B","C","D","E"]},{"q":"Todo lo siguiente ayuda a distinguir la artritis psoriásica de otros trastornos articulares EXCEPTO:","o":["Dactilitis","Entesitis","Formación de hoyuelos en las uñas","Presencia de diarrea","Acortamiento de los dedos"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) Los cambios en las uñas de los dedos de las manos o de los pies se producen en hasta 90% de los pacientes con artritis psoriásica, en comparación con 40% de los pacientes con psoriasis sin artritis y se dice que la psoriasis pustulosa se asocia con artritis más grave. Varias características articulares diferencian a la artritis psoriásica de otros trastornos articulares; tales características distintivas incluyen dactilitis y entesitis. La dactilitis se presenta en \\> 30%; la entesitis y la tenosinovitis también son frecuentes y probablemente estén presentes en la mayor parte de los pacientes, aunque a menudo no se aprecian en la exploración física. El acortamiento de los dedos a causa de la osteólisis subyacente es característica de la artritis psoriásica y existe una tendencia mucho mayor que en la artritis reumatoide a la anquilosis fibrosa y ósea de las articulaciones pequeñas. Es frecuente la anquilosis rápida de una o más articulaciones interfalángicas proximales (PIP, proximal interphalangeal) en las primeras etapas de la enfermedad. El dolor y la rigidez de espalda y cuello también son comunes en la artritis psoriásica. La diarrea no es una característica de la artritis psoriásica.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de los siguientes es el sitio más frecuente de afectación articular en la artritis reumatoide establecida?","o":["Articulación interfalángica distal","Cadera","Rodilla","Columna vertebral","Muñeca"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 358) Una vez establecido el proceso patológico de la artritis reumatoide, las articulaciones afectadas más a menudo incluyen las muñecas, las articulaciones metacarpofalángicas y las articulaciones interfalángicas proximales. La afectación de las articulaciones interfalángicas distales rara vez se debe a la artritis reumatoide y, con mayor frecuencia, a la osteoartrosis coexistente.","letters":["A","B","C","D","E"]},{"q":"En pacientes con artritis reumatoide establecida, todos los siguientes hallazgos radiográficos pulmonares pueden explicarse por su enfermedad reumatológica EXCEPTO:","o":["Infiltrados intersticiales bilaterales","Bronquiectasias","Infiltrado lobular","Nódulo pulmonar solitario","Derrame pleural unilateral"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 358) Existe una posible afectación de varios aparatos y sistemas en la artritis reumatoide. La complicación pulmonar más frecuente es el derrame pleural que suele ser exudativo y se manifiesta con dolor torácico y disnea. La artritis reumatoide se relaciona con una forma de enfermedad pulmonar intersticial difusa que puede presentarse con disnea e infiltrados intersticiales bilaterales que pueden ser tan extensos que se presenta como un patrón en panal de abeja. Los nódulos pulmonares asociados con la artritis reumatoide pueden ser solitarios o múltiples. A menudo se producen junto con nódulos cutáneos. Las bronquiectasias y la bronquiolitis también pueden deberse a artritis reumatoide. Muchas de estas manifestaciones responden al tratamiento. No se ha descrito que el infiltrado lobular sea causado por la artritis reumatoide y es causado más a menudo por una causa infecciosa aguda, a menudo como complicación del tratamiento inmunodepresor de la artritis reumatoide.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes definiciones se ajusta mejor al término entesitis?","o":["Sensación vibratoria o crepitante palpable provocada por el movimiento articular","Alteración de la alineación de las articulaciones para que las superficies articulares se aproximen incompletamente entre sí","Inflamación en el sitio de inserción tendinosa o ligamentosa en el hueso","Inflamación de la membrana periarticular que recubre la cápsula articular","Inflamación de una cavidad cerca de una articulación que disminuye la fricción"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) Entesopatía o entesitis es el término utilizado para describir la inflamación en el sitio de inserción tendinosa o ligamentosa en el hueso. Este tipo de inflamación se observa con mayor frecuencia en pacientes con espondiloartropatías seronegativas y diversas infecciones, en especial infecciones virales. Las demás definiciones se aplican a otros términos utilizados en la exploración ortopédica y reumatológica. La subluxación es la alteración de la alineación de las articulaciones de manera que las superficies articuladas se aproximan incompletamente entre sí. El término sinovitis hace referencia a la inflamación en el sitio de inserción tendinosa o ligamentosa en el hueso. La definición de bursitis consiste en la inflamación de una cavidad sacular cerca de una articulación que disminuye la fricción. Por último, la crepitación es una sensación vibratoria o crepitante palpable provocada por el movimiento articular.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes manifestaciones clínicas se puede observar en el síndrome de sinovitis, acné, pustulosis, hiperostosis y osteítis?","o":["Acromegalia","Hidradenitis supurativa","Psoriasis en placas","Osteomielitis esternoclavicular","B y D"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) El síndrome de sinovitis, acné, pustulosis, hiperostosis y osteítis (SAPHO) se caracteriza por diversas manifestaciones cutáneas y musculoesqueléticas. Las manifestaciones dermatológicas incluyen pustulosis palmoplantar, acné conglobado, acné fulminante e hidradenitis supurativa. La psoriasis en placas no suele relacionarse con el síndrome SAPHO, pero puede presentarse con frecuencia en la artritis psoriásica. Los principales hallazgos musculoesqueléticos son la hiperostosis esternoclavicular y espinal, focos recurrentes crónicos de osteomielitis estéril y artritis axial o periférica. Probablemente la regla sean los casos con una o pocas manifestaciones. La tasa de eritrosedimentación, la proteína C reactiva o ambas suelen presentar elevaciones leves a moderadas, en ocasiones espectaculares. En algunos casos, las bacterias, en la mayor parte los casos Propionibacterium acnes, se han cultivado a partir de muestras de biopsia ósea y en ocasiones de otros sitios. La enfermedad inflamatoria intestinal coexistía en el 8% de los pacientes de una serie grande. No hay asociación con HLA-B27. La gammagrafía ósea o la tomografía computarizada son útiles para el diagnóstico. La resonancia magnética describió erosiones corticales características en los cuerpos vertebrales en 12 pacientes (100%).","letters":["A","B","C","D","E"]},{"q":"¿Cuál de los siguientes es el hallazgo más temprano en las radiografías simples en casos de artritis reumatoide?","o":["Osteopenia yuxtaarticular","Sin anomalías","Hinchazón de tejidos blandos","Erosiones subcondrales","Pérdida simétrica de espacio articular"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 358) Las imágenes articulares son una herramienta fundamental para el diagnóstico y para la vigilancia del estado de la enfermedad en la artritis reumatoide. Las radiografías simples se solicitan con mayor frecuencia, a causa de su disponibilidad inmediata y la facilidad de comparación de las imágenes. El signo clínico más temprano de la artritis reumatoide es la osteopenia yuxtaarticular, aunque esto puede ser difícil de apreciar en radiografías digitalizadas más nuevas. Otros hallazgos incluyen hinchazón de los tejidos blandos, pérdida simétrica de espacio articular y erosiones subcondrales con mayor frecuencia en las muñecas, articulaciones metacarpofalángicas e interfalángicas proximales y articulaciones metatarsofalángicas.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 32 años acudió a la clínica con dolor en el pulgar derecho y la muñeca que ha empeorado a lo largo de varias semanas. Le duele cuando presiona el pulgar contra los otros dedos. Entre sus antecedentes de importancia, tuvo un hijo ocho semanas antes. En la exploración física, tiene una leve hinchazón y dolor a la palpación sobre la apófisis estiloides del radio y se produce dolor cuando coloca el pulgar en la palma de la mano y lo sujeta con los dedos. La maniobra de Phalen es negativa. ¿Cuál es la enfermedad más probable?","o":["Síndrome del túnel del carpo","Tenosinovitis de De Quervain","Artritis gotosa de la primera articulación metacarpofalángica","Fascitis palmar","Artritis reumatoide"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 375 La inflamación del abductor largo del pulgar y del extensor corto del pulgar en la vaina tendinosa de la apófisis estiloides del radio se conoce como tenosinovitis de De Quervain. La torsión repetitiva de la muñeca puede provocar esta afección. El dolor se produce al sujetar con el pulgar y puede extenderse en dirección radial a lo largo de la muñeca hasta la apófisis estiloides del radio. Las madres a menudo desarrollan esta tenosinovitis al sostener a sus bebés con el pulgar en extensión. El signo de Finkelstein es positivo en la tenosinovitis de De Quervain. Es positivo si el paciente desarrolla dolor al colocar el pulgar en la palma de la mano, cerrando los dedos alrededor del pulgar y desviando la muñeca en dirección cubital. El tratamiento de la tenosinovitis de De Quervain incluye NSAID y férulas. Las inyecciones de glucocorticoides pueden ser eficaces. La maniobra de Phalen se utiliza para diagnosticar el síndrome del túnel carpiano y no provoca dolor. Las muñecas se flexionan durante 60 s para comprimir el nervio mediano y provocar parestesias o dolor urente. La artritis gotosa se presenta con una articulación aguda inflamada con líquido rico en cristales. La artritis reumatoide es una enfermedad sistémica con sinovitis articular y alteraciones radiográficas.","letters":["A","B","C","D","E"]},{"q":"Todos los siguientes factores pueden causar bursitis EXCEPTO:","o":["Infección bacteriana","Fibromialgia","Gota","Artritis reumatoide","Uso excesivo"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 375) La bursitis es la inflamación de una bolsa, que es un saco de paredes delgadas recubierto de tejido sinovial. La función de la bolsa es facilitar el movimiento de tendones y músculos sobre las prominencias óseas. Las fuerzas de fricción excesivas por el uso excesivo, traumatismos, enfermedades sistémicas (p. ej., artritis reumatoide, gota) o infecciones pueden causar bursitis. La bursitis subacromial (bursitis subdeltoidea) es la forma más común de bursitis. Otras formas de bursitis incluyen bursitis trocantérica, bursitis del olécranon, bursitis del tendón de Aquiles y bursitis retrocalcánea. Por lo general, la bursitis se diagnostica mediante la anamnesis y la exploración física, pero la ecografía puede ser de utilidad en casos selectos para el diagnóstico y la administración de glucocorticoides bajo guía ecográfica. El tratamiento de la bursitis consiste en la prevención de cualquier situación agravante, el resto de la parte afectada, la administración de fármacos antiinflamatorios no esteroideos cuando sea apropiado para un paciente individual o la inyección local de glucocorticoides. La fibromialgia es un síndrome de dolor crónico. No causa inflamación de las articulaciones ni de las estructuras relacionadas, como las bolsas, por lo que no sería causa de bursitis.","letters":["A","B","C","D","E"]},{"q":"¿Qué valvulopatía cardiaca es más frecuente en los pacientes con espondilitis anquilosante?","o":["Insuficiencia aórtica","Insuficiencia mitral","Estenosis mitral","Estenosis pulmonar","Insuficiencia tricuspídea"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) La insuficiencia aórtica, que a veces conduce a insuficiencia cardiaca congestiva, se presenta en un pequeño porcentaje de pacientes, ocasionalmente en forma temprana. Puede ocurrir bloqueo cardiaco de tercer grado solo o en combinación con insuficiencia aórtica. Las lesiones pulmonares subclínicas y la disfunción cardiaca pueden ser relativamente frecuentes.","letters":["A","B","C","D","E"]},{"q":"La fiebre reumática se desarrolla a causa de un proceso autoinmunitario. ¿Cuál de los siguientes mecanismos de autoinmunidad es la principal causa del desarrollo de fiebre reumática?","o":["Anomalías endocrinas","Incremento de la función de los linfocitos B","Desequilibrio intrínseco de citocinas","Aumento de los linfocitos T cooperadores por estimulación de citocinas","Mimetismo molecular"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 355) Las alteraciones de los procesos normales pueden predisponer al desarrollo de autoinmunidad (cuadro VIII--14). En general, estas respuestas anormales requieren un desencadenante exógeno, como una infección (bacteriana o viral) o fumar cigarrillos y la presencia de anomalías endógenas en las células del sistema inmunitario. Uno de los mejores ejemplos de autorreactividad y enfermedad autoinmunitaria derivada del mimetismo molecular es la fiebre reumática, en la que los anticuerpos contra la proteína M de los estreptococos reaccionan de forma cruzada con la miosina, la laminina y otras proteínas de la matriz, así como con antígenos neuronales. El depósito de estos autoanticuerpos en el corazón inicia una respuesta inflamatoria, mientras que su penetración en el cerebro puede dar lugar a la corea de Sydenham. Se ha descrito mimetismo molecular entre las proteínas microbianas y los tejidos del hospedador en la diabetes mellitus tipo 1, la artritis reumatoide, la enfermedad celíaca y la esclerosis múltiple. CUADRO VIII--14Mecanismos autoinmunitarios ----------------------------------------------------------------------- **Exógenos Mimetismo molecular Estimulación superantigénica Respuesta adyuvante asociada con daño a microorganismos y tejidos Endógenos Alteración de la presentación de antígenos Pérdida del privilegio inmunitario Presentación de epítopos novedosos o crípticos (diseminación de epítopos) Alteración de autoantígenos Incremento de la función de las células presentadoras de antígenos Expresión de moléculas coestimuladoras Producción de citocinas Aumento de linfocitos T cooperadores Producción de citocinas Moléculas coestimuladoras Incremento de la función de los linfocitos B Factor activador de linfocitos B Moléculas coestimuladoras Defectos de la apoptosis o defectos en la eliminación del material de la apoptosis Desequilibrio de citocinas Alteración de la inmunorregulación** ----------------------------------------------------------------------- -----------------------------------------------------------------------","letters":["A","B","C","D","E"]},{"q":"Una mujer de 65 años con 10 años de evolución con artritis reumatoide no tratada se presentó a la clínica con deterioro, malestar general y dolor articular durante los últimos seis meses. En la exploración de sus articulaciones, se encontraron deformidades en el cuello de cisne y desviación cubital. La exploración cutánea muestra nódulos reumatoides bilaterales en la bolsa del olécranon. En la exploración del abdomen, se encontró esplenomegalia. Los estudios de laboratorio reportaron neutropenia, elevación de proteína C reactiva y anemia. Se le diagnosticó síndrome de Felty. ¿Qué tipo de neoplasia hematológica maligna o linfoproliferativa puede presentarse de forma similar al síndrome de Felty en pacientes con artritis reumatoide?","o":["Leucemia mieloide aguda","Leucemia linfocítica crónica","Trombocitosis idiopática","Policitemia vera","Leucemia de linfocitos T granulosos grandes"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 358) El síndrome de Felty se define por la tríada clínica de neutropenia, esplenomegalia y artritis reumatoide nodular y se observa en \\< 1% de los pacientes, aunque su incidencia parece estar disminuyendo ante un tratamiento más agresivo de la enfermedad articular. Por lo general, se presenta en las últimas etapas de la artritis reumatoide grave y es más común en pacientes caucásicos que en otros grupos étnicos. La leucemia de linfocitos T granulosos grandes (T-LGL) puede tener una presentación clínica similar y, a menudo, se presenta en asociación con artritis reumatoide. La T-LGL se caracteriza por un crecimiento clonal crónico y lento de linfocitos granulosos grandes, que produce neutropenia y esplenomegalia. A diferencia del síndrome de Felty, la T-LGL puede desarrollarse al principio de la evolución de la artritis reumatoide. La leucopenia aparte de estos trastornos es poco frecuente y, con mayor frecuencia, es un efecto secundario del tratamiento farmacológico. La leucemia mieloide aguda, la leucemia linfocítica crónica, la trombocitosis esencial y la policitemia vera no se observan con mayor frecuencia en pacientes con artritis reumatoide. El linfoma aumenta en los pacientes con artritis reumatoide, pero no suele ser similar al síndrome de Felty en la presentación clínica. El tipo más frecuente de linfoma diagnosticado en pacientes con artritis reumatoide es el linfoma difuso de linfocitos B grandes.","letters":["A","B","C","D","E"]},{"q":"Se ha demostrado que los siguientes fármacos tienen eficacia como antirreumáticos modificadores de la enfermedad en pacientes con artritis reumatoide EXCEPTO:","o":["Infliximab","Leflunomida","Metotrexato","Naproxeno","Rituximab"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 358) El tratamiento de la artritis reumatoide ha cambiado drásticamente en las dos últimas décadas con el desarrollo de fármacos que modifican la evolución de la artritis reumatoide. El metotrexato es el fármaco antirreumático modificador de la enfermedad (DMARD, disease-modifying antirheumatic drug) de primera elección para el tratamiento temprano de la artritis reumatoide. Otros DMARD convencionales incluyen hidroxicloroquina, sulfasalazina y leflunomida. La leflunomida, un inhibidor de la síntesis de pirimidina es eficaz como único fármaco o en combinación con metotrexato. La hidroxicloroquina y la sulfasalazina suelen reservarse para enfermedades leves. Los DMARD biológicos han mejorado de forma espectacular el tratamiento de la artritis reumatoide en la última década. A la fecha hay cinco fármacos antagonistas del factor de necrosis tumoral, incluido infliximab, aprobados para su uso en pacientes con artritis reumatoide. El rituximab, un anticuerpo anti-CD20, está aprobado para la artritis reumatoide resistente al tratamiento en combinación con metotrexato. Es más eficaz en pacientes seropositivos que en seronegativos. Otros fármacos biológicos aprobados para su uso en la artritis reumatoide incluyen anakinra (antagonista de los receptores de interleucina \\[IL\\] -1), abatacept (antagonista CD28/CD80/86) y tocilizumab (antagonista de IL--6). Los fármacos antiinflamatorios no esteroideos, incluido el naproxeno, se utilizaban anteriormente como base del tratamiento de la artritis reumatoide. Sin embargo, ahora se utilizan como tratamiento complementario para el tratamiento de los síntomas. No se consideran DMARD.","letters":["A","B","C","D","E"]},{"q":"Se valora a una mujer de 42 años que refiere dolor en la parte inferior de su talón derecho que es insoportable por la mañana cuando camina por primera vez de la cama al baño. El dolor mejora un poco durante la mañana, pero vuelve a empeorar al mediodía, en especial al subir escaleras. Tiene antecedentes de hipertensión, fuma un paquete de cigarrillos por día y trabaja como mesera en un restaurante. Sus fármacos incluyen hidroclorotiazida y anticonceptivos orales. La exploración física es normal con la excepción de pies planos y dolor focal en la parte inferior del talón derecho. No hay dolor en el tobillo ni en la pantorrilla y los diámetros de la parte inferior de las piernas son similares. La radiografía del talón y el tobillo derecho solo muestra espolones en el talón. Todas las siguientes afirmaciones con respecto a su enfermedad son ciertas EXCEPTO:","o":["Los espolones calcáneos no son diagnósticos","La inyección local de glucocorticoides conlleva un riesgo de rotura de la aponeurosis plantar.","Los anticonceptivos orales y el tabaquismo son factores de riesgo.","Los implantes ortopédicos de calzado pueden ser beneficiosos.","El pronóstico es bueno."],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 375) El paciente tiene fascitis plantar, un diagnóstico que a menudo se puede hacer con base en las manifestaciones clínicas. Es una causa frecuente de dolor de pies en adultos y la incidencia máxima se produce en personas de 40 a 60 años. El dolor se origina en o cerca del sitio de la fijación de la aponeurosis plantar a la tuberosidad medial del calcáneo. Varios factores que aumentan el riesgo de desarrollar fascitis plantar incluyen la obesidad, el pie plano (ausencia del arco plantar al permanecer de pie), pie cavo (pie con arco alto), flexión dorsal limitada del tobillo, el permanecer de pie por periodos prolongados, caminar sobre superficies duras y utilizar zapatos defectuosos. En los corredores, correr excesivamente y cambiar a una superficie de carrera más dura pueden precipitar la fascitis plantar. El tabaquismo y los anticonceptivos orales son factores de riesgo inespecíficos. Los pacientes experimentan dolor intenso con los primeros pasos al levantarse por la mañana o después de la inactividad durante el día. El dolor por lo general disminuye con la actividad de apoyo de peso durante el día, solo para empeorar con la actividad continua. El dolor empeora al caminar descalzo o al subir escaleras. En la exploración física, se produce dolor máximo a la palpación sobre el talón en la cara inferior, correspondiente al sitio de fijación de la aponeurosis plantar. Los estudios de imagen pueden estar indicados cuando el diagnóstico no es claro. Las radiografías simples pueden mostrar espolones en el talón, que tienen poca importancia para el diagnóstico. La ecografía en la fascitis plantar puede demostrar engrosamiento de la aponeurosis e hipoecogenicidad difusa, lo que indica edema en la unión de la aponeurosis plantar al calcáneo. La resonancia magnética es un método sensible para detectar la fascitis plantar, pero por lo general no es necesaria para establecer el diagnóstico. El diagnóstico diferencial del dolor en la cara inferior del talón incluye fracturas del calcáneo por sobrecarga, espondiloartrítides, artritis reumatoide, gota, neoplasias óseas, enfermedades óseas infiltrativas y
