<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>HARRISON ⚡️TEST</title>
<style>
:root{
  --bg:#FAFBFC;
  --ink:#243447;
  --ink-soft:#5B6B7C;
  --card:#FFFFFF;
  --line:#E7ECF0;
  --green:#3FAE7A;
  --green-bg:#E4F5EC;
  --red:#E4607A;
  --red-bg:#FCE8EC;
  --shadow:0 1px 2px rgba(36,52,71,.04), 0 6px 16px rgba(36,52,71,.06);
  --shadow-lg:0 10px 30px rgba(36,52,71,.10);
  --radius:20px;
  --radius-sm:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Fraunces', 'Iowan Old Style', ui-serif, Georgia, serif, 'Inter', -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body, .sans{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.serif{font-family:'Fraunces','Iowan Old Style',ui-serif,Georgia,serif;}

#app{max-width:960px;margin:0 auto;padding:0 20px 64px;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(250,251,252,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:960px;margin:0 auto;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:baseline;gap:8px;cursor:pointer;user-select:none;}
.brand .bolt{font-size:20px;}
.brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-0.01em;color:var(--ink);}
.brand-name .test{color:#65B9EB;}
.crumb{font-size:14px;color:var(--ink-soft);font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px;}
.crumb button{
  background:none;border:none;color:var(--ink-soft);font-size:14px;cursor:pointer;
  font-family:'Inter',sans-serif;padding:6px 10px;border-radius:8px;
}
.crumb button:hover{background:var(--line);color:var(--ink);}

/* ---------- Home ---------- */
.hero{padding:36px 0 20px;}
.hero h1{font-family:'Fraunces',serif;font-size:34px;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em;line-height:1.1;}
.hero p{font-family:'Inter',sans-serif;color:var(--ink-soft);font-size:15.5px;margin:0;max-width:520px;line-height:1.5;}

.stats-row{display:flex;gap:12px;margin:22px 0 8px;flex-wrap:wrap;}
.stat-pill{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px 16px;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:8px;
  box-shadow:var(--shadow);
}
.stat-pill .num{font-weight:700;font-size:17px;color:var(--ink);}
.stat-pill .lbl{font-size:12.5px;color:var(--ink-soft);}

.grid-spec{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:14px;margin-top:22px;
}
.spec-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;text-align:left;padding:0;
  box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease;
  display:flex;flex-direction:column;
}
.spec-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.spec-card.disabled{cursor:default;opacity:.55;}
.spec-card.disabled:hover{transform:none;box-shadow:var(--shadow);}
.spec-band{height:64px;position:relative;display:flex;align-items:center;padding:0 16px;}
.spec-band svg{width:30px;height:30px;}
.spec-body{padding:14px 16px 16px;font-family:'Inter',sans-serif;flex:1;display:flex;flex-direction:column;gap:8px;}
.spec-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--ink);letter-spacing:-0.01em;}
.spec-meta{font-size:12.5px;color:var(--ink-soft);}
.spec-progress-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:auto;}
.spec-progress-fill{height:100%;border-radius:4px;}
.spec-soon{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}

/* ---------- Specialty view ---------- */
.spec-header{padding:28px 0 6px;display:flex;align-items:center;gap:14px;}
.spec-header .icon-wrap{
  width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.spec-header .icon-wrap svg{width:28px;height:28px;}
.spec-header h2{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0;letter-spacing:-0.01em;}
.spec-header .sub{font-family:'Inter',sans-serif;color:var(--ink-soft);font-size:14px;margin-top:2px;}

.review-all{
  margin:18px 0 24px;padding:16px 18px;border-radius:16px;border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:'Inter',sans-serif;background:var(--card);cursor:pointer;
}
.review-all:hover{border-color:#c7d2da;}
.review-all .t{font-weight:600;font-size:14.5px;color:var(--ink);}
.review-all .d{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.review-all button{
  background:var(--ink);color:#fff;border:none;border-radius:10px;padding:9px 16px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
}

.tema-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.tema-row{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:border-color .15s;
}
.tema-row:hover{border-color:#c7d2da;}
.tema-row.empty{cursor:default;opacity:.5;}
.tema-num{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:600;font-size:14px;
}
.tema-info{flex:1;min-width:0;}
.tema-info .tt{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;color:var(--ink);line-height:1.35;}
.tema-info .tm{font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-soft);margin-top:3px;}
.tema-ring{position:relative;width:30px;height:30px;flex-shrink:0;}
.tema-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.tema-ring circle{fill:none;stroke-width:3;}
.tema-arrow{color:var(--ink-soft);flex-shrink:0;}

/* ---------- Quiz view ---------- */
.quiz-wrap{max-width:640px;margin:0 auto;padding-top:18px;}
.progress-bar-track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;}
.progress-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#79C6B7,#65B9EB);transition:width .3s ease;}
.progress-row{display:flex;align-items:center;gap:12px;margin:6px 0 26px;}
.progress-txt{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink-soft);white-space:nowrap;}
.streak{display:flex;align-items:center;gap:4px;font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;color:#F4B078;white-space:nowrap;}

.q-tag{
  display:inline-block;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;
  letter-spacing:.03em;padding:4px 10px;border-radius:8px;margin-bottom:14px;
}
.q-text{font-family:'Fraunces',serif;font-size:21px;line-height:1.42;font-weight:500;color:var(--ink);margin:0 0 24px;letter-spacing:-0.005em;}

.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:13px 15px;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;
  font-size:15px;line-height:1.45;color:var(--ink);transition:border-color .12s, background .12s;
}
.opt:hover{border-color:#B9C4CE;}
.opt .letter{
  width:26px;height:26px;border-radius:8px;background:#F1F4F6;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-top:1px;
}
.opt.selected{border-color:#65B9EB;background:#F0F8FE;}
.opt.selected .letter{background:#65B9EB;color:#fff;}
.opt.correct{border-color:var(--green);background:var(--green-bg);}
.opt.correct .letter{background:var(--green);color:#fff;}
.opt.incorrect{border-color:var(--red);background:var(--red-bg);}
.opt.incorrect .letter{background:var(--red);color:#fff;}
.opt.dim{opacity:.55;}
.opt:disabled, .opt.locked{cursor:default;}

.feedback-banner{
  margin-top:18px;border-radius:16px;padding:16px 18px;font-family:'Inter',sans-serif;
  display:flex;gap:12px;align-items:flex-start;
}
.feedback-banner.ok{background:var(--green-bg);}
.feedback-banner.bad{background:var(--red-bg);}
.feedback-banner .fb-icon{font-size:20px;line-height:1;margin-top:1px;}
.feedback-banner .fb-title{font-weight:700;font-size:15px;margin-bottom:4px;}
.feedback-banner.ok .fb-title{color:#1F7A50;}
.feedback-banner.bad .fb-title{color:#B93A55;}
.feedback-banner .fb-body{font-size:14px;line-height:1.55;color:var(--ink);}
.pearl{
  margin-top:12px;padding:10px 12px;border-radius:10px;background:#FFF8E4;
  border:1px solid #F3E3AE;font-size:13px;line-height:1.5;color:#7A5F14;display:none;
}
.pearl.show{display:block;}
.pearl b{color:#5C4610;}

.quiz-footer{
  position:sticky;bottom:0;background:linear-gradient(180deg, rgba(250,251,252,0) 0%, var(--bg) 30%);
  padding:22px 0 12px;margin-top:8px;
}
.btn-primary{
  width:100%;background:var(--ink);color:#fff;border:none;border-radius:14px;
  padding:15px;font-family:'Inter',sans-serif;font-weight:700;font-size:15.5px;cursor:pointer;
  transition:opacity .15s;
}
.btn-primary:disabled{opacity:.35;cursor:default;}
.btn-primary.go{background:#3FAE7A;}
.btn-primary.retry{background:#65B9EB;}

/* ---------- Summary ---------- */
.summary-wrap{max-width:520px;margin:40px auto 0;text-align:center;}
.summary-ring{width:150px;height:150px;margin:0 auto 22px;position:relative;}
.summary-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.summary-ring circle{fill:none;stroke-width:10;}
.summary-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--ink);}
.summary-wrap h2{font-family:'Fraunces',serif;font-size:24px;margin:0 0 6px;}
.summary-wrap .msg{font-family:'Inter',sans-serif;color:var(--ink-soft);font-size:14.5px;margin-bottom:24px;}
.summary-stats{display:flex;justify-content:center;gap:28px;margin-bottom:30px;}
.summary-stats div{font-family:'Inter',sans-serif;}
.summary-stats .n{font-size:22px;font-weight:700;color:var(--ink);}
.summary-stats .l{font-size:12px;color:var(--ink-soft);}
.summary-actions{display:flex;flex-direction:column;gap:10px;}
.btn-secondary{
  background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:14px;
  padding:14px;font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;
}
.btn-secondary:hover{border-color:#c7d2da;}

.fail-list{text-align:left;margin-top:28px;}
.fail-list h3{font-family:'Inter',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:10px;}
.fail-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-family:'Inter',sans-serif;font-size:13.5px;}
.fail-item .fq{color:var(--ink);margin-bottom:4px;}
.fail-item .fa{color:#1F7A50;font-weight:600;}

.empty-state{
  text-align:center;padding:60px 20px;font-family:'Inter',sans-serif;color:var(--ink-soft);
}
.empty-state .big{font-size:36px;margin-bottom:10px;}

@media (max-width:520px){
  .hero h1{font-size:27px;}
  .q-text{font-size:19px;}
  .grid-spec{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .brand-name{font-size:18px;white-space:nowrap;}
  .topbar-inner{padding:14px 16px;}
}
</style>
</head>

</div>

<script id="data-blob" type="application/json">{"3":{"title":"Medicina geriátrica y cuidados paliativos.","questions":[{"q":"Señale la afirmación CORRECTA con respecto a la fragilidad:","o":["Fragilidad es equivalente a discapacidad.","Fragilidad es equivalente a dependencia.","Fragilidad es equivalente a vulnerabilidad.","Todas son falsas."],"c":"C","e":"La fragilidad se define como un estado de mayor VULNERABILIDAD frente a factores estresantes, por la pérdida de reserva fisiológica multisistémica; es un concepto distinto de la discapacidad (limitación ya establecida en actividades) y de la dependencia (necesidad de ayuda de terceros), aunque los tres conceptos se relacionan y pueden coexistir, la fragilidad es potencialmente reversible si se detecta precozmente, a diferencia de la discapacidad ya instaurada."},{"q":"Es FALSO con respecto al tratamiento del delirium en el paciente en situación paliativa:","o":["Quetiapina está contraindicada en pacientes con parkinsonismo.","Levomepromazina es muy sedante, de acción rápida, aunque de corta duración.","Las benzodiacepinas pueden aumentar el riesgo de confusión.","El haloperidol es menos efectivo que los neurolépticos atípicos."],"c":"D","e":"El haloperidol es considerado, en general, igual de eficaz que los antipsicóticos atípicos para el control del delirium, siendo un fármaco de referencia clásica en este contexto; la quetiapina (no contraindicada de forma absoluta en parkinsonismo, pero preferible sobre haloperidol en este perfil por su menor bloqueo dopaminérgico), la levomepromazina y el riesgo de las benzodiacepinas de empeorar la confusión son afirmaciones correctas."},{"q":"Señale la opción FALSA con relación a la sedación paliativa:","o":["Se debe obtener y quedar reflejado en la historia el consentimiento del paciente o cuidadores.","La dosis de inducción será la dosis de rescate.","Los fármacos más utilizados son morfina y haloperidol.","Evaluaremos el nivel de sedación del paciente mediante la escala de Ramsay."],"c":"C","e":"Los fármacos de primera elección en la sedación paliativa son las BENZODIACEPINAS (fundamentalmente midazolam), no la morfina (que se emplea para el control del dolor y la disnea, no como sedante primario) ni el haloperidol (que se reserva para el delirium refractario o como coadyuvante); el resto de afirmaciones (consentimiento informado documentado, dosis de rescate igual a la de inducción, monitorización con escala de Ramsay) son correctas."},{"q":"Es un criterio START, según la 3ª versión española de los criterios STOPP/START:","o":["Tratamiento con betabloqueantes en pacientes mayores con fibrilación auricular crónica y mal control de la frecuencia.","Tratamiento con digoxina como fármaco de primera línea para el control de la frecuencia cardiaca a largo plazo en pacientes mayores con FA.","Tratamiento con iSGLT2 en la insuficiencia cardiaca sintomática, con fracción de eyección reducida o preservada, exclusivamente en pacientes mayores diabéticos.","Tratamiento con estatinas en pacientes mayores con fragilidad grave y antecedente bien documentado de enfermedad vascular coronaria, cerebral o periférica."],"c":"D","e":"Las estatinas en prevención secundaria bien documentada, incluso en pacientes con fragilidad, siguen aportando beneficio y constituyen un criterio START reconocido; las otras opciones describen prácticas poco recomendadas (digoxina como primera línea) o restringen erróneamente los iSGLT2 solo a diabéticos, cuando su indicación en IC es independiente de la diabetes."},{"q":"Señale la definición CORRECTA:","o":["Polimedicación en paciente crónico complejo: prescripción de 5 fármacos de alto riesgo.","Deprescripción: cese de un tratamiento de larga duración por inadecuación, efectos secundarios o inadecuada relación beneficio-riesgo.","Conciliación de la medicación: proceso formal de comparar la medicación habitual con la prescrita tras una transición asistencial.","«b» y «c» son correctas."],"c":"D","e":"La deprescripción se define, efectivamente, como la retirada planificada y supervisada de un tratamiento cuando su relación beneficio-riesgo ya no es favorable, y la conciliación de la medicación es el proceso formal de contrastar y reconciliar los tratamientos del paciente en los puntos de transición asistencial (ingreso, alta, cambio de nivel asistencial), por lo que ambas definiciones son correctas."},{"q":"Señale la afirmación FALSA en relación al concepto de fragilidad:","o":["Es un síndrome médico caracterizado por pérdida de fuerza y resistencia, y disminución de la función fisiológica que aumenta la vulnerabilidad para desarrollar dependencia o fallecer.","La velocidad de la marcha, la movilidad, la actividad física y la valoración de los estados mental y nutricional pueden ser útiles para el diagnóstico.","La actividad física constituye un tratamiento.","Es equiparable a dependencia y multimorbilidad."],"c":"D","e":"La fragilidad NO es equiparable a dependencia ni a multimorbilidad: son conceptos relacionados pero distintos (un paciente frágil puede ser independiente, y la multimorbilidad es un factor de riesgo de fragilidad pero no sinónimo de ella); precisamente el interés clínico de la fragilidad radica en que es un estado potencialmente REVERSIBLE si se detecta antes de la dependencia establecida."},{"q":"En relación al concepto de sarcopenia, indique la afirmación FALSA:","o":["La técnica diagnóstica más utilizada en la práctica clínica para su evaluación es la resonancia magnética muscular.","Consiste en una reducción de la masa muscular con limitación de la movilidad.","Los métodos para evaluar la función y fuerza muscular son la fuerza de presión, el SPPB, la velocidad de la marcha y el test Timed Up and Go.","La estrategia terapéutica clave comprende la actividad física en combinación con intervención nutricional."],"c":"A","e":"En la práctica clínica habitual, la técnica más utilizada para evaluar la masa muscular es la BIOIMPEDANCIA o la DEXA (densitometría de doble energía), no la resonancia magnética, que aunque es una técnica de referencia, tiene un uso muy limitado en la práctica asistencial rutinaria por su coste y disponibilidad."},{"q":"Varón de 60 años, EPOC reagudizador, que refiere dos caídas en los últimos tres meses. Señale lo correcto:","o":["La sarcopenia se asocia al envejecimiento, por lo que no debemos sospecharla en este paciente.","Si la dinamometría es patológica, se confirma el diagnóstico de sarcopenia.","Para iniciar el tratamiento de la sarcopenia es imprescindible realizar antes una DEXA.","Si la velocidad de la marcha está alterada, probablemente se trate de una sarcopenia severa."],"c":"D","e":"Según el algoritmo EWGSOP2, una velocidad de la marcha reducida (junto con baja fuerza y masa muscular) define la sarcopenia como severa; la dinamometría patológica solo indica sospecha (fuerza reducida), no confirma el diagnóstico (que exige además confirmar baja masa muscular), y la DEXA no es un requisito imprescindible para iniciar el tratamiento (ejercicio y nutrición) ante la sospecha clínica."},{"q":"Varón de 70 años con HTA, DM tipo 2, SCACEST revascularizado hace 5 años, asintomático desde entonces, FA permanente con FEVI normal. Tratamiento: bisoprolol, amlodipino, insulina glargina, metformina, AAS, acenocumarol, paracetamol y vitamina B12. En relación con la revisión farmacológica, señale lo correcto:","o":["No se trata de un paciente con polifarmacia ya que toma menos de 10 fármacos.","La prescripción de vitamina B12 puede ser una prescripción en cascada, relacionada con un efecto secundario de la metformina.","La asociación de acenocumarol más AAS es en este caso una prescripción adecuada.","Replantear la indicación de un iSGLT2 no es una opción, ya que el objetivo es disminuir el número de fármacos."],"c":"B","e":"La metformina puede reducir la absorción de vitamina B12 a largo plazo, produciendo un déficit que, si no se reconoce como efecto adverso del fármaco, puede tratarse añadiendo B12 sin cuestionar la causa (prescripción en cascada); la asociación de anticoagulante oral más antiagregante sin indicación clara añade riesgo hemorrágico sin claro beneficio adicional en la mayoría de los casos."},{"q":"En relación al tratamiento de la enfermedad de Alzheimer, señale la INCORRECTA:","o":["Los IACE (donepezilo, galantamina, rivastigmina) están indicados en la EA leve-moderada.","Tanto los IACE como la memantina han demostrado mejoría modesta en cognición, actividades de vida diaria y síntomas psicológicos y conductuales.","La memantina puede favorecer bradicardias, bloqueos auriculoventriculares y síncopes, por lo que se recomienda ECG en pacientes de riesgo.","En demencia avanzada hay que valorar la deprescripción de IACE y memantina cuando se estime que ya no ofrecen beneficio."],"c":"C","e":"El riesgo de bradicardia, bloqueo auriculoventricular y síncope se asocia a los INHIBIDORES DE LA COLINESTERASA (por su efecto colinérgico vagotónico), no a la memantina, que actúa por antagonismo NMDA sin ese perfil de cardiotoxicidad."},{"q":"Paciente de 86 años con pérdida de peso de hasta 5 kg en 3 meses, debilidad de cinturas y marcado deterioro funcional. Hb 9,5 g/dl, VCM 88 fl, VSG 70 mm/h. En los últimos días, alteraciones visuales; su médico decide derivación preferente. ¿Cuál sería la actitud más adecuada?","o":["Solicitar biopsia de arteria temporal y, con el resultado, valorar iniciar tratamiento.","Solicitar serologías de fiebre Q, enfermedad de Lyme y micoplasma, e iniciar azitromicina 500 mg 3 días.","Solicitar TC de cuerpo entero y valorar biopsia de médula ósea o hepática según resultados.","Iniciar tratamiento precoz con glucocorticoides y, en paralelo, solicitar estudios para confirmar la sospecha diagnóstica."],"c":"D","e":"Ante una sospecha fundada de arteritis de células gigantes con síntomas visuales (riesgo inminente de ceguera irreversible por neuropatía óptica isquémica), el tratamiento con glucocorticoides a dosis altas debe iniciarse de inmediato sin esperar la confirmación histológica (biopsia de arteria temporal), que se solicita en paralelo."},{"q":"Mujer de 86 años con IC NYHA III y anemia por sangrado digestivo crónico (Hb basal \\~9,5 g/dl). Barthel 55, Pfeiffer 1. Vive con su hermana desde que enviudó. Ingresa por descompensación de IC, desarrollando un síndrome confusional hipoactivo. En relación al pronóstico, señale la correcta:","o":["Tiene un índice PROFUND bajo, con probabilidad de fallecimiento menor del 14% al año.","Tiene un índice PROFUND bajo-intermedio, con probabilidad de fallecimiento del 30% al año.","Tiene un índice PROFUND intermedio-alto, con probabilidad de fallecimiento del 50% al año.","Tiene un índice PROFUND alto, con probabilidad de fallecimiento del 60% al año."],"c":"C","e":"La combinación de dependencia funcional moderada (Barthel 55), deterioro cognitivo leve (Pfeiffer 1, aunque el delirium actual añade complejidad), insuficiencia cardiaca avanzada (NYHA III), anemia crónica y ausencia de cuidador principal estable en el domicilio (convive con una hermana, no con cónyuge/hijos) suma una puntuación compatible con un índice PROFUND intermedio-alto, categoría asociada a una probabilidad de mortenimiento al año en torno al 50%."},{"q":"Mujer de 79 años que ingresa por fractura osteoporótica de cadera. Respecto a la prevención secundaria de fracturas por fragilidad, señale la respuesta INCORRECTA:","o":["La baja adherencia al tratamiento se asocia a un incremento del riesgo de fractura.","Los marcadores de remodelado óseo pueden ser útiles para monitorizar de forma precoz la respuesta al tratamiento.","La vitamina D en monoterapia es eficaz en la reducción de dichas fracturas en personas mayores no institucionalizadas.","El aumento de calcio dietético o la toma aislada de suplementos de calcio no protegen frente a la aparición de fracturas."],"c":"C","e":"La vitamina D en MONOTERAPIA (sin calcio ni tratamiento antirresortivo/anabólico asociado) no ha demostrado ser eficaz para reducir el riesgo de fracturas en personas mayores no institucionalizadas; su beneficio se ha demostrado sobre todo asociada a calcio, especialmente en personas institucionalizadas con déficit franco."},{"q":"Respecto al tratamiento de la diabetes mellitus, señale la afirmación INCORRECTA según las recomendaciones de la SEMI:","o":["Se recomienda plantear tratamiento combinado de inicio.","Se debe priorizar arGLP-1 y/o iSGLT2 independientemente del objetivo de HbA1c y del uso de metformina, si hay riesgo cardiovascular alto o muy alto.","En mayores de 75 años, el tratamiento debe considerarse con independencia de la presencia de fragilidad.","En sobrepeso u obesidad, tiene especial relevancia utilizar fármacos asociados a reducción de peso, como semaglutida o tirzepatida."],"c":"C","e":"En pacientes mayores de 75 años, la fragilidad SÍ debe tenerse en cuenta para individualizar los objetivos de control y la selección terapéutica (simplificando el tratamiento y evitando la hipoglucemia en pacientes frágiles), no debiendo tratarse «con independencia» de esta condición."},{"q":"Ante un paciente anciano con trastornos de la deglución que sufre un cuadro febril con escalofríos, diagnosticado tras radiografía de tórax de neumonía, ¿qué tratamiento antimicrobiano NO prescribiría en monoterapia?","o":["Amoxicilina-clavulánico.","Piperacilina-tazobactam.","Ciprofloxacino.","Ertapenem."],"c":"C","e":"El ciprofloxacino tiene una actividad limitada frente a los anaerobios y frente a Streptococcus pneumoniae, gérmenes clave en la neumonía aspirativa del anciano con disfagia (donde predomina flora mixta orofaríngea, incluidos anaerobios), por lo que no sería una opción adecuada en monoterapia para este cuadro, a diferencia de amoxicilina-clavulánico, piperacilina-tazobactam o ertapenem, que sí cubren adecuadamente este espectro."},{"q":"Indique cuál de los siguientes NO es un ítem del índice de Barthel:","o":["Independencia para subir y bajar escaleras.","Capacidad para la deambulación.","Independencia para ir al aseo.","Capacidad para usar el dinero."],"c":"D","e":"La capacidad para el manejo del dinero es un ítem de la escala de Lawton-Brody (actividades instrumentales de la vida diaria), no del índice de Barthel, que evalúa actividades BÁSICAS de la vida diaria (alimentación, baño, vestido, aseo personal, deposición, micción, uso del retrete, traslados, deambulación y subir/bajar escaleras)."},{"q":"Mujer de 82 años cuya hija refiere que en los últimos 3 meses come mucho menos, ha perdido interés en la comida y ha adelgazado considerablemente. Se realiza cribado nutricional con MNA-SF, obteniendo 10 puntos. ¿Qué indica este resultado?","o":["La paciente se encuentra en riesgo de malnutrición.","La paciente tiene un estado nutricional satisfactorio.","Ninguna de las anteriores es correcta.","La paciente se encuentra malnutrida."],"c":"A","e":"En el Mini Nutritional Assessment-Short Form (MNA-SF, puntuación máxima 14), una puntuación de 8-11 puntos indica riesgo de malnutrición, mientras que una puntuación de 0-7 indicaría malnutrición establecida y ≥12 un estado nutricional normal; con 10 puntos, la paciente se encuentra en la categoría de riesgo de malnutrición, que requiere intervención nutricional precoz para evitar su progresión."}]},"4":{"title":"Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.","questions":[{"q":"En relación con los programas de cribado (screening), señale la CORRECTA:","o":["Se aplican a poblaciones de individuos enfermos.","La enfermedad objeto del programa de cribado debe tener una medida de prevención o un tratamiento efectivo.","El cribado del cáncer de mama en mujeres mayores de 50 años no tiene buena relación coste/efectividad.","El cribado poblacional del cáncer de próstata ha demostrado su efectividad."],"c":"B","e":"Un requisito fundamental de todo programa de cribado poblacional (criterios de Wilson y Jungner) es que la enfermedad detectada precozmente disponga de un tratamiento o medida preventiva eficaz que mejore el pronóstico; el cribado se aplica a población APARENTEMENTE SANA (no enferma), el de mama en mayores de 50 años sí tiene buena relación coste-efectividad, y el cribado poblacional sistemático de cáncer de próstata con PSA NO ha demostrado un beneficio neto claro y no se recomienda de forma generalizada."},{"q":"¿Cuál de los siguientes factores está epidemiológicamente más asociado a un aumento del riesgo de cáncer colorrectal?","o":["Dieta rica en fibra insoluble y antioxidantes.","Ingesta frecuente de carnes rojas y procesadas.","Consumo regular de lácteos fermentados.","Ejercicio físico de intensidad moderada."],"c":"B","e":"El consumo elevado y frecuente de carnes rojas y, especialmente, carnes procesadas es un factor de riesgo bien establecido de cáncer colorrectal (clasificado como carcinógeno del grupo 1 por la IARC en el caso de las procesadas), mientras que la fibra, los lácteos fermentados y el ejercicio físico se han asociado, por el contrario, a un efecto protector."},{"q":"Respecto al tratamiento de la obesidad y la farmacoterapia aprobada en España, señale la opción FALSA:","o":["Los agonistas del receptor de GLP-1 están contraindicados si hay antecedentes personales o familiares de carcinoma medular de tiroides.","Tirzepatida está contraindicada en mujeres en edad fértil que no tomen anticonceptivos.","El único fármaco de administración oral disponible es el orlistat.","Los efectos secundarios digestivos son comunes a todos los fármacos."],"c":"B","e":"La contraindicación en mujeres en edad fértil sin anticoncepción es característica de fármacos con riesgo teratógeno demostrado (como algunos retinoides), no de la tirzepatida por sí misma; de hecho, la tirzepatida puede REDUCIR la eficacia de los anticonceptivos orales (por el enlentecimiento del vaciamiento gástrico), lo que motiva recomendar un método anticonceptivo adicional o de barrera, pero no una contraindicación absoluta de uso en mujeres fértiles sin anticoncepción per se."},{"q":"Señale la opción CORRECTA en relación con la fiebre de origen desconocido (FOD):","o":["Se define como un cuadro febril de más de 38,3ºC, en al menos tres ocasiones, de duración inferior a tres semanas.","Las neoplasias suponen la causa más frecuente, mientras que las infecciones ocupan el segundo lugar.","Entre las infecciones, la tuberculosis en sus formas extrapulmonares y diseminadas es la causa más importante.","La proporción de casos no diagnosticados es muy escasa."],"c":"C","e":"Dentro de las causas infecciosas de FOD, la tuberculosis (sobre todo en sus formas extrapulmonares y diseminadas) es clásicamente la causa infecciosa más importante; la definición exige fiebre de más de TRES SEMANAS (no menos), las infecciones (no las neoplasias) siguen siendo globalmente la causa más frecuente de FOD, y hasta un 20-30% de los casos permanecen sin diagnóstico."},{"q":"Un paciente oncológico que precisa tratamiento con rituximab presenta serología con HBsAg negativo y anti-HBc positivo. Señale la opción INCORRECTA:","o":["Precisa profilaxis frente a la reactivación del VHB.","El rituximab se asocia a un riesgo alto de reactivación en este perfil serológico.","Debe iniciarse la pauta antiviral al menos 2 semanas antes del tratamiento con rituximab.","El tratamiento antiviral se mantendrá únicamente hasta el cese del tratamiento con rituximab."],"c":"D","e":"Debido al efecto prolongado de depleción de linfocitos B del rituximab, la profilaxis antiviral debe mantenerse entre 12 y 18 meses DESPUÉS de finalizar el tratamiento, no solo hasta su cese, para cubrir el periodo de reconstitución inmunológica en que persiste el riesgo de reactivación."},{"q":"Señale la respuesta FALSA en relación con los nódulos pulmonares incidentales:","o":["La mayoría de los nódulos pulmonares incidentales son benignos.","Los granulomas infecciosos y los hamartomas son las causas más frecuentes de nódulos benignos.","Las causas más comunes de nódulos malignos son el cáncer de pulmón primario, las metástasis pulmonares y los tumores carcinoides.","Sugiere benignidad si el nódulo tiene bordes irregulares/espiculados o cavitación de pared gruesa."],"c":"D","e":"Justo lo contrario: los bordes irregulares o espiculados y la cavitación de pared gruesa son signos radiológicos que sugieren MALIGNIDAD; los nódulos benignos suelen tener bordes lisos, bien definidos, y si cavitan, presentan pared fina."},{"q":"Señale la respuesta FALSA con respecto al cáncer de pulmón:","o":["Se recomienda no realizar cribado de cáncer de pulmón con radiografía de tórax.","El abandono del hábito tabáquico en fumadores no reduce el riesgo de padecer cáncer de pulmón.","Existe asociación entre EPOC y cáncer de pulmón, con mayor incidencia en el fenotipo enfisematoso.","Además del tabaco, la exposición a asbesto, radón y humo de leña se asocian a mayor incidencia de cáncer de pulmón."],"c":"B","e":"Dejar de fumar sí reduce de forma progresiva el riesgo de cáncer de pulmón con los años de abstinencia, aunque nunca llega a igualar por completo al de quien nunca fumó."},{"q":"Sobre los programas de cribado para el diagnóstico precoz del cáncer de mama, señale la respuesta INCORRECTA:","o":["El programa de cribado se realiza habitualmente mediante mamografías cada 2 años.","No han demostrado beneficio las campañas por encima de los 69 años ni por debajo de los 45 años.","La autoexploración mamaria ha demostrado disminuir la mortalidad.","La mamografía es menos sensible en portadoras de mutaciones BRCA1 y BRCA2."],"c":"C","e":"La autoexploración mamaria NO ha demostrado reducir la mortalidad por cáncer de mama en los estudios controlados, aunque puede aumentar la conciencia corporal de la paciente; en portadoras de mutaciones BRCA (con tejido mamario más denso y tumores de crecimiento más rápido), la mamografía tiene menor sensibilidad, por lo que se complementa con RM mamaria en el cribado de este grupo de alto riesgo."},{"q":"En un centro oncológico hay preocupación por la presencia de un brote de casos de aspergilosis invasiva en pacientes receptores de trasplante de médula ósea. ¿Cuál es la fuente más probable de infección?","o":["Fuente de aire contaminada.","Fuente de agua contaminada.","Diseminación de profesional a paciente por mala técnica de lavado de manos.","Diseminación de profesional a paciente por uso deficiente de desinfectante con alcohol."],"c":"A","e":"Aspergillus es un hongo de distribución ambiental que se transmite fundamentalmente por vía AÉREA mediante inhalación de esporas; los brotes hospitalarios en pacientes neutropénicos suelen relacionarse con obras de construcción cercanas o sistemas de ventilación/filtros HEPA defectuosos."},{"q":"En el diagnóstico del cáncer, señale la respuesta CORRECTA:","o":["El estudio histológico precisa técnicas inmunohistoquímicas y de detección de alteraciones moleculares para su diagnóstico definitivo.","La PAAF tiene una incidencia de falsos negativos del 15-18%.","La obtención de dos PAAF negativas descarta el cáncer.","La determinación de anormalidades genéticas asociadas a mutaciones del ADN permite la selección de tratamientos individualizados."],"c":"D","e":"La caracterización molecular del tumor (mutaciones driver, biomarcadores) permite seleccionar terapias dirigidas específicas (medicina de precisión oncológica), siendo esta la afirmación más precisa; aunque la inmunohistoquímica y los estudios moleculares SÍ son relevantes, no siempre son imprescindibles para el diagnóstico histológico definitivo de todos los tumores, y ni una ni dos PAAF negativas descartan por completo el cáncer, dada la posibilidad de falsos negativos por muestreo inadecuado."},{"q":"Varón de 30 años con aumento de ambas mamas en los últimos meses y disminución de la libido. Ginecomastia bilateral en la exploración; ecografía testicular con masa en testículo derecho. Se sospecha tumor testicular con síndrome paraneoplásico. ¿Qué hormona es la causa más común de la ginecomastia en tumores testiculares?","o":["hCG (gonadotropina coriónica humana).","FSH.","Testosterona.","LH."],"c":"A","e":"La secreción ectópica de hCG por tumores testiculares de células germinales (especialmente coriocarcinoma) es la causa más frecuente de ginecomastia paraneoplásica en este contexto, ya que la hCG tiene actividad estructural similar a la LH y estimula la producción de estrógenos por las células de Leydig/aromatización periférica."},{"q":"Las siguientes asociaciones relacionan manifestaciones dermatológicas paraneoplásicas con su neoplasia más frecuente. Indique cuál NO es correcta:","o":["Pénfigo paraneoplásico → linfoma no Hodgkin/leucemia linfática crónica.","Eritema gyratum repens → carcinoma bronquial.","Eritema necrolítico migratorio → tumor pancreático de células alfa (glucagonoma).","Acroqueratosis paraneoplásica de Bazex → carcinoma de mama."],"c":"D","e":"El síndrome de Bazex (acroqueratosis paraneoplásica) se asocia clásicamente a carcinomas EPIDERMOIDES del tracto aerodigestivo superior (orofaringe, laringe, esófago) y de pulmón, no al carcinoma de mama; el resto de asociaciones (pénfigo paraneoplásico con neoplasias linfoides, eritema gyratum repens con carcinoma bronquial, eritema necrolítico migratorio con glucagonoma) son correctas."},{"q":"En un paciente neutropénico con manifestaciones clínicas respiratorias, el radiólogo informa en la TC torácica un «signo del halo». ¿Cuál sería el tratamiento inicial?","o":["Anfotericina B.","Caspofungina.","Fluconazol.","Voriconazol."],"c":"D","e":"El signo del halo (área de vidrio deslustrado rodeando un nódulo, por hemorragia perilesional) en un paciente neutropénico es muy sugestivo de aspergilosis pulmonar invasiva; el voriconazol es el tratamiento de primera línea actual de esta entidad, con mejor perfil de eficacia y supervivencia demostrado frente a la anfotericina B en ensayos comparativos."},{"q":"¿Cuál de las siguientes NO es una característica histopatológica frecuente del cáncer de mama asociado a mutación en el gen BRCA1?","o":["Alto grado histológico.","Receptor de estrógenos negativo.","Perfil genético tipo basal-like.","Sobreexpresión de c-erbB2 (HER2) positiva."],"c":"D","e":"Los tumores asociados a mutación de BRCA1 son característicamente HER2 NEGATIVOS, con un perfil predominantemente triple negativo (RE-, RP-, HER2-) y de tipo basal-like, alto grado histológico y elevado índice proliferativo, siendo la sobreexpresión de HER2 una característica infrecuente en este subgrupo."},{"q":"Las metástasis cerebrales son la causa más frecuente de hipertensión intracraneal; algunas tienen más predisposición a sangrar. ¿Cuál de estos tumores primarios tiene MENOR riesgo relativo de provocar hemorragia cerebral secundaria a metástasis?","o":["Cáncer de pulmón.","Coriocarcinoma.","Cáncer de células renales.","Cáncer papilar de tiroides."],"c":"D","e":"El carcinoma papilar de tiroides tiene un riesgo hemorrágico intrínsecamente bajo comparado con los tumores clásicamente asociados a metástasis cerebrales hemorrágicas y muy vascularizadas: coriocarcinoma, melanoma y carcinoma renal de células claras."},{"q":"En relación con la fiebre de origen desconocido, todas son verdaderas EXCEPTO:","o":["La tuberculosis es la infección que con más frecuencia produce FOD en los ancianos.","En ancianos, el cáncer de colon es una causa frecuente de FOD.","Ante FOD debe comenzarse cuanto antes tratamiento antibiótico empírico.","Ante un paciente con FOD y hepatitis granulomatosa se debe valorar tratamiento con tuberculostáticos."],"c":"C","e":"El tratamiento antibiótico empírico NO debe iniciarse de forma precoz y sistemática en la FOD (salvo inestabilidad/sepsis), ya que puede enmascarar el cuadro, retrasar el diagnóstico microbiológico y no ha demostrado mejorar el pronóstico; el pilar del manejo es un estudio escalonado y dirigido."},{"q":"¿Cuál es la enfermedad endocrina más frecuente en la neoplasia endocrina múltiple tipo 1 (MEN1)?","o":["Carcinoma medular de tiroides.","Tumor endocrino del páncreas.","Hiperparatiroidismo primario.","Feocromocitoma."],"c":"C","e":"El hiperparatiroidismo primario (por hiperplasia de las cuatro glándulas) es la manifestación más frecuente y habitualmente la primera en aparecer en el síndrome MEN1, presente en la práctica totalidad de los pacientes; el carcinoma medular de tiroides y el feocromocitoma son propios del MEN2, no del MEN1."},{"q":"En un paciente oncológico portador de un catéter central de larga duración se detecta candidemia. Además de retirar el catéter (si es posible) e iniciar tratamiento antifúngico, ¿cuál de las siguientes pruebas diagnósticas le parece más importante?","o":["Urinocultivo.","Punción lumbar.","Fondo de ojo.","Ninguna de las anteriores."],"c":"C","e":"El examen de fondo de ojo es fundamental en todo paciente con candidemia, para descartar endoftalmitis por Candida (complicación grave que puede comprometer la visión y modificar la duración/vía del tratamiento antifúngico), siendo una prueba de cribado sistemático recomendada en las guías."},{"q":"De los siguientes planteamientos ante la sospecha de cáncer encefálico, ¿cuál es verdadero?","o":["Hay mayor probabilidad de que el glioma de baja malignidad se manifieste inicialmente por una convulsión, que el glioma de alta malignidad.","Aproximadamente la mitad de las lesiones malignas encefálicas son metástasis y la otra mitad tumores primarios.","El estudio radiológico preferido ante sospecha de tumor intracraneal es la TC con contraste intravenoso.","La cefalea aparece en el cuadro inicial en más del 75% de los pacientes con tumores cerebrales."],"c":"A","e":"Los gliomas de bajo grado, de crecimiento lento, se manifiestan con mayor frecuencia como primera manifestación con una convulsión, mientras que los de alto grado debutan más a menudo con déficits focales rápidamente progresivos; las metástasis son considerablemente MÁS frecuentes que los tumores primarios como causa de lesión maligna encefálica, la RM (no la TC) es la prueba preferida, y la cefalea es el síntoma inicial en una minoría de los casos."},{"q":"Indique el tumor que más frecuentemente causa metástasis cerebrales:","o":["Cáncer de pulmón.","Cáncer de páncreas.","Cáncer de estómago.","Cáncer de próstata."],"c":"A","e":"El cáncer de pulmón es, con diferencia, la causa más frecuente de metástasis cerebrales, seguido del cáncer de mama y el melanoma."},{"q":"Las siguientes son causas potenciales de LDL elevado, EXCEPTO:","o":["Cirrosis hepática.","Hipotiroidismo.","Síndrome nefrótico.","Diuréticos tiazídicos."],"c":"A","e":"En la cirrosis avanzada el fallo de síntesis hepática condiciona típicamente una DISMINUCIÓN del colesterol total y LDL, no una elevación, a diferencia del hipotiroidismo, el síndrome nefrótico o los diuréticos tiazídicos."},{"q":"La causa más común de estenosis esofágica es:","o":["Cáncer de esófago.","Enfermedad por reflujo gastroesofágico (ERGE).","Esófago de Barrett.","Esclerosis sistémica."],"c":"B","e":"La estenosis péptica secundaria a esofagitis crónica por ERGE es, con diferencia, la causa más frecuente de estenosis esofágica benigna en la práctica clínica."},{"q":"La disfagia progresiva, la pérdida de peso y el dolor retroesternal son síntomas característicos de:","o":["Cáncer de esófago.","Esofagitis por reflujo.","Acalasia esofágica.","Divertículo de Zenker."],"c":"A","e":"La tríada de disfagia progresiva, pérdida de peso significativa y dolor retroesternal en un paciente de edad media-avanzada es la presentación clásica del carcinoma esofágico."},{"q":"¿Cuál de los siguientes factores NO está asociado con un mayor riesgo de desarrollar cáncer gástrico?","o":["Tabaquismo.","Consumo de alimentos ahumados o muy salados.","Ingesta alta de frutas y verduras.","Infección por Helicobacter pylori."],"c":"C","e":"El consumo elevado de frutas y verduras se asocia a un efecto protector frente al cáncer gástrico, al contrario que el tabaco, los alimentos ahumados/salados y la infección crónica por H. pylori."},{"q":"El principal factor de riesgo para el desarrollo de cáncer colorrectal es:","o":["Edad avanzada.","Historia familiar de cáncer colorrectal.","Consumo excesivo de fibra dietética.","Uso ocasional de AINE."],"c":"B","e":"La historia familiar de cáncer colorrectal (especialmente en familiares de primer grado) es el factor de riesgo individual más determinante, por delante de la edad avanzada (también relevante pero de menor peso relativo entre las opciones), mientras que la fibra dietética y el uso de AINE se asocian, por el contrario, a un efecto protector."},{"q":"Paciente de 71 años con ictericia, bilirrubina total 6 mg/dl (directa 4 mg/dl), transaminasas normales, GGT y fosfatasa alcalina elevadas, dilatación de la vía biliar intra y extrahepática. Sin dolor, pérdida de peso de 5 kg en el último mes. CPRE con estenosis abrupta del colédoco distal. ¿Cuál es su primera sospecha diagnóstica?","o":["Colangitis esclerosante primaria.","Coledocolitiasis.","Cáncer de páncreas.","Hepatitis aguda."],"c":"C","e":"La tríada de ictericia indolora, colestasis progresiva, pérdida de peso y estenosis abrupta (no cálculo) del colédoco distal en un paciente de edad avanzada es muy sugestiva de neoplasia de la cabeza del páncreas comprimiendo la vía biliar."},{"q":"Todos los siguientes cribados, EXCEPTO uno, han demostrado ser efectivos en estudios epidemiológicos:","o":["Cribado del cáncer de mama en mujeres mayores de 50 años.","Cribado del cáncer de pulmón mediante radiografía de tórax simple.","Cribado de la hipertensión arterial.","Cribado del colesterol."],"c":"B","e":"El cribado del cáncer de pulmón con radiografía de tórax convencional NO ha demostrado reducir la mortalidad y no se recomienda; el cribado que sí ha mostrado beneficio en población de alto riesgo es el TC de baja dosis."},{"q":"¿Cuál de las siguientes opciones es una medida de prevención primaria del cáncer?","o":["Mamografía de detección.","Quimioterapia adyuvante.","Vacunación contra el virus del papiloma humano (VPH).","Terapia dirigida."],"c":"C","e":"La vacunación frente al VPH es una medida de PREVENCIÓN PRIMARIA (evita la infección causal antes de que la enfermedad se desarrolle), a diferencia de la mamografía (prevención secundaria/detección precoz) y la quimioterapia/terapia dirigida (tratamiento de la enfermedad ya establecida)."},{"q":"¿Qué tipo de cáncer es más probable que esté relacionado con una predisposición genética hereditaria?","o":["Cáncer de pulmón.","Cáncer de mama.","Cáncer de colon.","Cáncer de páncreas."],"c":"B","e":"El cáncer de mama tiene una de las asociaciones genéticas hereditarias mejor caracterizadas (mutaciones BRCA1/BRCA2), con implicaciones directas en cribado y manejo; el cáncer de pulmón, en cambio, está dominado abrumadoramente por factores ambientales."},{"q":"¿Cuál de las siguientes opciones describe mejor un cáncer metastásico sin primario conocido (carcinoma de origen desconocido)?","o":["Un cáncer que se origina en múltiples órganos al mismo tiempo.","Un cáncer cuyo origen primario no se puede identificar tras la evaluación médica.","Un cáncer que se propaga por el sistema linfático pero no afecta a otros órganos.","Un cáncer que se desarrolla en el lugar de origen y no se propaga."],"c":"B","e":"El carcinoma de origen desconocido se define precisamente por la presencia de metástasis confirmadas histológicamente cuyo tumor primario, pese a un estudio diagnóstico exhaustivo (incluida inmunohistoquímica), no puede ser identificado."},{"q":"¿Qué son los síndromes paraneoplásicos en relación con el cáncer?","o":["Síntomas psicológicos relacionados con el diagnóstico de cáncer.","Síntomas causados por la invasión local del tumor.","Síntomas debidos a la liberación de sustancias por el tumor.","Síntomas relacionados con la toxicidad de los tratamientos contra el cáncer."],"c":"C","e":"Los síndromes paraneoplásicos se definen por manifestaciones clínicas a distancia causadas por sustancias biológicamente activas (hormonas ectópicas, anticuerpos, citocinas) liberadas por el tumor o por la respuesta inmune frente a él, no por invasión local directa ni por toxicidad del tratamiento."},{"q":"¿Cuál de las siguientes opciones describe mejor la genética del cáncer?","o":["El cáncer no tiene relación con los factores genéticos.","Solo los factores genéticos determinan el desarrollo del cáncer.","Los factores genéticos y ambientales pueden influir en el desarrollo del cáncer.","Los factores genéticos son responsables del 100% de los casos de cáncer."],"c":"C","e":"El desarrollo del cáncer es un proceso multifactorial en el que interactúan factores genéticos (predisposición hereditaria, mutaciones somáticas adquiridas) y factores ambientales/de estilo de vida (tabaco, dieta, infecciones, radiación), sin que ninguno de los dos sea exclusivamente responsable en la mayoría de los casos."},{"q":"¿Cuál de las siguientes opciones NO es una urgencia oncológica?","o":["Síndrome de vena cava superior.","Pericarditis constrictiva.","Síndrome de lisis tumoral.","Anemia ferropénica."],"c":"D","e":"La anemia ferropénica no constituye, por sí sola, una urgencia oncológica; el síndrome de vena cava superior y el síndrome de lisis tumoral sí son urgencias oncológicas clásicas."},{"q":"¿Cuál de las siguientes opciones NO es una estrategia en la detección precoz del cáncer?","o":["Mamografía.","Prueba de Papanicolaou.","Biopsia.","Colonoscopia."],"c":"C","e":"La biopsia es una prueba DIAGNÓSTICA/confirmatoria (se realiza ante una sospecha ya generada, habitualmente por una prueba de cribado o síntomas), no una estrategia de detección precoz poblacional como la mamografía, el Papanicolaou o la colonoscopia."},{"q":"Los pacientes oncológicos pueden presentar síndrome de vena cava superior. ¿En cuál de las siguientes neoplasias es más frecuente esta complicación?","o":["Linfoma.","Cáncer de mama.","Cáncer de pulmón.","Metástasis ganglionares mediastínicas de otros orígenes."],"c":"C","e":"El cáncer de pulmón es la causa más frecuente de síndrome de vena cava superior maligno, responsable de aproximadamente el 75-85% de los casos de origen tumoral."},{"q":"El herpesvirus humano tipo 8 se relaciona con las siguientes neoplasias, EXCEPTO con:","o":["Sarcoma de Kaposi.","Linfoma primario de cavidades.","Enfermedad de Castleman multicéntrica.","Linfoma cerebral primario."],"c":"D","e":"El linfoma primario del sistema nervioso central en el contexto de inmunosupresión se asocia clásicamente al virus de Epstein-Barr, no al VHH-8; el sarcoma de Kaposi, el linfoma primario de cavidades y la enfermedad de Castleman multicéntrica sí están causalmente relacionados con el VHH-8."},{"q":"Con respecto al uso de la morfina para tratar el dolor en el cáncer avanzado, señale la respuesta FALSA:","o":["Produce como efecto secundario confusión con obnubilación, sobre todo al comienzo del tratamiento.","La morfina tiene techo analgésico.","Se emplea para aliviar la disnea.","Tiene una vida media de 2 a 4 horas."],"c":"B","e":"La morfina, como el resto de opioides potentes puros, NO tiene techo analgésico: su dosis puede aumentarse progresivamente para conseguir el efecto deseado, limitada solo por la aparición de efectos adversos (a diferencia de los AINE u opioides débiles, que sí tienen techo analgésico)."},{"q":"Varón de 74 años que ingresa por TVP femoro-poplítea izquierda sin factores provocadores conocidos, con antecedentes de HTA, DM, cardiopatía isquémica estable y anemia ferropénica leve por pérdidas digestivas. Colonoscopia hace 6 meses con pólipo adenomatoso de bajo grado y angiodisplasias tratadas. Hb 10 g/dl, dímero D 5700 ng/ml, aclaramiento 60 ml/min. Respecto al estudio de neoplasia oculta, ¿qué opción le parece más adecuada?","o":["Recomendaría estudio de neoplasia oculta basado en historia clínica y body-TAC.","Recomendaría estudio de neoplasia oculta basado en historia clínica y PET-TAC.","No existe suficiente evidencia sobre la efectividad de la búsqueda exhaustiva de neoplasia oculta.","En este paciente sí lo recomendaría por la edad y por tratarse de una TVP de origen no provocado."],"c":"C","e":"La evidencia actual no respalda un cribado exhaustivo y sistemático de neoplasia oculta (con TC de cuerpo completo o PET-TC) en pacientes con TVP no provocada, ya que estas estrategias no han demostrado mejorar la supervivencia frente a un cribado básico dirigido por la clínica y la edad del paciente."},{"q":"Respecto a las neoplasias endocrinas múltiples tipo 1 (MEN1), es FALSO que:","o":["Pueden afectar a cualquier grupo de edad, entre los 5 y los 81 años.","Se describen formas familiares con herencia autosómica dominante, pero también formas esporádicas.","Las manifestaciones clínicas se desarrollan sobre todo en la 2ª-3ª década de la vida.","La causa más frecuente de muerte es por tumores malignos, sobre todo neuroendocrinos de páncreas o carcinoide intestinal."],"c":"C","e":"Las manifestaciones clínicas del MEN1 suelen desarrollarse más tardíamente, típicamente entre la 4ª y 5ª década de la vida (aunque con un rango amplio de edades de presentación posible), no predominantemente en la 2ª-3ª década como afirma esta opción."},{"q":"En relación con el síndrome de vena cava superior, señale la respuesta FALSA:","o":["El cáncer de pulmón es responsable de aproximadamente el 85% de los casos.","Las causas benignas están aumentando actualmente con el incremento del uso de dispositivos intravasculares.","Las manifestaciones clínicas más frecuentes son edema facial/cervical, disnea y tos.","Está contraindicada la colocación de un stent endovascular."],"c":"D","e":"La colocación de un stent endovascular no está contraindicada; al contrario, es una opción terapéutica eficaz y de alivio sintomático rápido en el síndrome de vena cava superior."},{"q":"¿Cuál de los siguientes programas de cribado de neoplasias es ampliamente recomendado en población general?","o":["Detección de cáncer de próstata a partir de los 45 años con PSA y tacto rectal anual.","Detección de cáncer colorrectal en mayores de 50 años con test de sangre oculta en heces o colonoscopia.","Detección del cáncer de mama con mamografía anual a partir de los 55 años.","Prueba de Papanicolaou anual para cáncer de cuello uterino a partir de los 20 años."],"c":"B","e":"El cribado del cáncer colorrectal en población de riesgo medio a partir de los 50 años, mediante test de sangre oculta en heces periódico o colonoscopia, es el programa con mayor evidencia y recomendación amplia en población general; el cribado sistemático de próstata con PSA no está recomendado de forma generalizada, el de mama habitualmente se inicia antes de los 55 años (45-50 según el programa) con periodicidad bienal (no anual), y el cribado de cérvix no se recomienda con periodicidad anual sino cada 3-5 años según la prueba utilizada."},{"q":"Señale cuál de los siguientes criterios NO está incluido en la escala CISNE (Índice Clínico de riesgo en Neutropenia Febril Estable):","o":["Neutrófilos \\>200/µl.","Hiperglucemia inducida por estrés.","EPOC.","Grado de mucositis ≥2."],"c":"A","e":"La escala CISNE valora factores como el estado funcional (ECOG), la presencia de EPOC, la cardiopatía crónica, la mucositis grado ≥2, la monocitosis \\<200/µl y la hiperglucemia de estrés, entre otros; la cifra absoluta de neutrófilos \\>200/µl no es un ítem explícitamente incluido en esta escala."},{"q":"Las infecciones son responsables de muchos ingresos, morbilidad y mortalidad en pacientes oncológicos. Señale la respuesta correcta:","o":["La escala MASCC mide el riesgo de complicaciones relacionadas con procesos infecciosos en pacientes oncológicos en general.","En la escala MASCC, a mayor puntuación mayor probabilidad estimada de fallecimiento.","Una de las limitaciones de la escala MASCC es que no tiene en cuenta la edad.","No padecer EPOC supone una puntuación de 4 puntos en la escala MASCC."],"c":"D","e":"En la escala MASCC (diseñada específicamente para estratificar el riesgo en la NEUTROPENIA FEBRIL, no en pacientes oncológicos en general), la ausencia de EPOC contribuye con 4 puntos a la puntuación total, que en este caso funciona de forma inversa: a MAYOR puntuación, MENOR riesgo de complicaciones (a diferencia de lo que sugiere la opción B); la escala sí incluye la edad como uno de sus ítems."},{"q":"En cuanto al tratamiento antibiótico en pacientes oncológicos, señale la respuesta correcta:","o":["En un paciente con neutropenia y tiflitis, alérgico a betalactámicos, el tratamiento de elección es vancomicina en combinación con amikacina.","El uso de la escala CISNE implica comprobar que el paciente es mayor de 18 años de edad.","La presencia de catéteres venosos centrales es factor de riesgo de infección por Enterococcus spp., primando por tanto meropenem como betalactámico empírico.","Ceftazidima es la cefalosporina de elección en caso de infección neumocócica."],"c":"B","e":"La escala CISNE está validada y diseñada específicamente para pacientes ADULTOS (≥18 años) con neutropenia febril de apariencia clínicamente estable, por lo que su aplicación exige comprobar este criterio de edad; la ceftazidima tiene actividad limitada frente a neumococo (no es de elección para esta infección), y los catéteres venosos centrales se asocian más a estafilococos coagulasa negativos que a Enterococcus."},{"q":"Un adolescente presenta tras el ejercicio disnea sibilante progresiva con tos seca, con episodios previos similares de menor intensidad. ¿Cuál es el diagnóstico más probable?","o":["Asma (inducido por ejercicio).","Bronquitis crónica.","Neoplasia pulmonar.","Nocardiosis pulmonar."],"c":"A","e":"La disnea sibilante inducida por el ejercicio, con tos seca y episodios recurrentes similares previos en un adolescente, es el cuadro clásico de broncoconstricción inducida por el ejercicio, una manifestación frecuente del asma bronquial."},{"q":"Paciente oncológico portador de sonda vesical con sospecha de ITU complicada, en tratamiento empírico con cefotaxima intravenosa. Hemocultivos con crecimiento de Pseudomonas aeruginosa, pendiente de antibiograma. ¿Qué respuesta es correcta?","o":["Mantener el tratamiento con cefotaxima a la espera de confirmar sensibilidad.","Retirar la cefotaxima e iniciar tratamiento con ertapenem.","Cambiar el tratamiento a ceftazidima.","Añadir trimetoprim-sulfametoxazol para conseguir sinergia y mayor cobertura."],"c":"C","e":"La cefotaxima carece de actividad útil frente a Pseudomonas aeruginosa, por lo que debe cambiarse a un antibiótico con actividad antipseudomónica, como la ceftazidima; el ertapenem, a diferencia de otros carbapenémicos, tampoco cubre Pseudomonas."}]},"5":{"title":"Conceptos generales en nutrición. Requerimientos y evaluación nutricional. Nutrición enteral y parenteral. Obesidad y trastornos alimentarios.","questions":[{"q":"Respecto al tratamiento de la obesidad y la farmacoterapia aprobada en España, señale la opción FALSA:","o":["Los agonistas del receptor de GLP-1 están contraindicados si hay antecedentes personales o familiares de carcinoma medular de tiroides.","Tirzepatida está contraindicada en mujeres en edad fértil que no tomen anticonceptivos.","El único fármaco de administración oral disponible es el orlistat.","Los efectos secundarios digestivos son comunes a todos los fármacos."],"c":"B","e":"No existe una contraindicación absoluta de la tirzepatida en mujeres fértiles sin anticoncepción; lo que sí se recomienda es un método anticonceptivo adicional o de barrera durante las primeras semanas de tratamiento, por la posible reducción de eficacia de los anticonceptivos orales debida al enlentecimiento del vaciamiento gástrico, pero esto no equivale a una contraindicación de uso."},{"q":"Con respecto al tratamiento farmacológico en pacientes obesos, ¿cuál es la respuesta INCORRECTA?","o":["El tratamiento farmacológico está indicado en pacientes con IMC\\>30, o con sobrepeso (IMC 27-29,9) y comorbilidad asociada.","El uso de semaglutida 2,4 mg subcutánea semanal se asocia a mayores pérdidas de peso globales que el uso de liraglutida 3 mg subcutánea diaria.","Se consideran fármacos de primera línea los agonistas de GLP-1 (semaglutida, liraglutida) y el agonista dual GLP-1/GIP tirzepatida.","Se ha demostrado que tanto semaglutida 2,4 mg semanal como liraglutida 3 mg diaria reducen de forma significativa el riesgo de eventos cardiovasculares en adultos no diabéticos con enfermedad cardiovascular establecida."],"c":"D","e":"Únicamente semaglutida 2,4 mg (ensayo SELECT) ha demostrado reducir de forma significativa los eventos cardiovasculares en adultos con sobrepeso/obesidad y enfermedad cardiovascular establecida sin diabetes; no existe evidencia equivalente de ensayos de resultados cardiovasculares para liraglutida 3 mg en esta misma población no diabética."},{"q":"Varón con bypass entérico por obesidad mórbida que presenta diarrea crónica, con déficit de vitamina B12 pero niveles elevados de ácido fólico. ¿Qué entidad consideraría más probable?","o":["Enfermedad celíaca.","Intolerancia a la lactosa.","Sobrecrecimiento bacteriano intestinal.","Anemia perniciosa."],"c":"C","e":"En el sobrecrecimiento bacteriano de intestino delgado (favorecido por asas ciegas tras cirugía bariátrica), las bacterias colónicas consumen la vitamina B12 disponible pero sintetizan folato, generando el patrón característico de B12 baja con folato normal o elevado."},{"q":"Señale qué entidad de las siguientes NO es causa de obesidad secundaria:","o":["Síndrome de Cushing.","Diabetes mellitus tipo 2.","Síndrome de ovario poliquístico.","Hipotiroidismo."],"c":"B","e":"La diabetes mellitus tipo 2 es, en la mayoría de los casos, una CONSECUENCIA de la obesidad (por la resistencia a la insulina asociada), no una causa reconocida de obesidad secundaria; el síndrome de Cushing, el síndrome de ovario poliquístico y el hipotiroidismo sí son causas endocrinas clásicas de obesidad secundaria."},{"q":"Mujer de 35 años con IMC de 40, en tratamiento con anticonceptivos orales, con cefalea intensa de nueva aparición que empeora con Valsalva, y vómitos. TAC basal normal. Ante la sospecha de trombosis venosa cerebral, señale la correcta:","o":["Un nivel elevado de dímero D respalda el diagnóstico.","Un dímero D normal excluye el diagnóstico.","La punción lumbar está contraindicada.","La presencia de un infarto hemorrágico contraindica el tratamiento anticoagulante."],"c":"A","e":"Un dímero D elevado apoya la sospecha de trombosis venosa cerebral en un contexto clínico compatible (obesidad, anticonceptivos, cefalea con hipertensión intracraneal); sin embargo, el dímero D puede ser normal hasta en un porcentaje relevante de casos confirmados, por lo que un resultado normal NO la excluye, la punción lumbar no está contraindicada de entrada, y la anticoagulación sigue siendo el tratamiento de elección incluso con infarto hemorrágico asociado."},{"q":"Varón de 55 años sometido a bypass gastroyeyunal por obesidad mórbida hace año y medio, con episodios recurrentes de dolor en hipocondrio derecho, diagnosticado de colelitiasis. ¿Cuál es el mecanismo principal en el desarrollo de colelitiasis tras la cirugía bariátrica?","o":["Incremento en la secreción de ácido gástrico.","Aumento en la concentración de colesterol biliar asociado a la pérdida rápida de peso.","Alteraciones en la motilidad biliar como único mecanismo relevante.","Disminución en el tamaño de la vesícula biliar."],"c":"B","e":"La pérdida rápida y sustancial de peso tras la cirugía bariátrica moviliza grandes cantidades de colesterol desde los depósitos grasos hacia la bilis, aumentando su saturación y favoreciendo la formación de cálculos de colesterol, siendo este el mecanismo principal reconocido de la colelitiasis post-bariátrica."},{"q":"Con respecto al tratamiento farmacológico en pacientes obesos, ¿cuál es la respuesta INCORRECTA?","o":["El tratamiento farmacológico está indicado en obesos con IMC\\>30 o en sobrepeso (IMC 27-29,9) con comorbilidad asociada.","El uso de semaglutida 4 mg subcutánea semanal se asocia a mayores pérdidas globales de peso que el uso de liraglutida 3 mg subcutánea diaria.","Se consideran fármacos de primera línea los análogos de GLP-1 semaglutida y liraglutida, y el agonista dual GLP-1/GIP tirzepatida.","Se ha demostrado que tanto semaglutida 2,4 mg semanal como liraglutida 3 mg diaria reducen el riesgo de eventos cardiovasculares de forma significativa en adultos no diabéticos con ECV establecida."],"c":"B","e":"La dosis aprobada de semaglutida para obesidad es de 2,4 mg semanales (no 4 mg, que excede la dosis máxima autorizada); con la dosis correcta de 2,4 mg, sí se ha demostrado una mayor pérdida de peso frente a liraglutida 3 mg diaria, pero la cifra de «4 mg» en el enunciado es incorrecta."},{"q":"Mujer de 63 años con DM2 de 7 años de evolución, en tratamiento con metformina, HbA1c 7,6%, IMC 41,3 kg/m². Para el tratamiento de la obesidad en esta paciente, ¿cuál es la mejor opción?","o":["Pioglitazona.","Empagliflozina.","Semaglutida.","Alogliptina."],"c":"C","e":"En una paciente con diabetes tipo 2 y obesidad grave, los agonistas del receptor de GLP-1 como la semaglutida ofrecen el mayor beneficio combinado sobre el control glucémico y la pérdida de peso significativa, siendo de elección frente a fármacos neutros (gliptinas) o de menor impacto ponderal (iSGLT2), e incluso frente a la pioglitazona, que favorece la ganancia de peso."},{"q":"¿Cuál de los siguientes trastornos causará un aumento de la capacidad funcional residual?","o":["Enfisema.","Miastenia grave.","Obesidad.","Fibrosis pulmonar."],"c":"A","e":"La pérdida de retracción elástica pulmonar y el atrapamiento aéreo característicos del enfisema aumentan el volumen residual y la capacidad funcional residual; la obesidad, la miastenia y la fibrosis pulmonar, en cambio, cursan con patrón restrictivo y reducción de los volúmenes pulmonares, incluida la CFR."},{"q":"Un varón de 21 años presenta fatiga de varios años de evolución y calambres en los pies. Exploración normal, incluida la presión arterial. Na 138, K 2,8, Cl 90, bicarbonato 30. Magnesio normal. Detección de diuréticos en orina negativa; cloruro urinario elevado. ¿Cuál es el diagnóstico más probable?","o":["Bulimia nerviosa.","Abuso de diuréticos.","Síndrome de Gitelman.","Síndrome de Liddle."],"c":"C","e":"La combinación de hipopotasemia, alcalosis metabólica, presión arterial NORMAL, magnesio normal (aunque en Gitelman suele haber hipomagnesemia, aquí se indica normal), cloruro urinario ELEVADO (indicando pérdida renal, no digestiva) y despistaje de diuréticos negativo es más compatible con una tubulopatía renal congénita como el síndrome de Gitelman que con la bulimia (donde el cloruro urinario estaría BAJO, por pérdidas digestivas/vómitos, no renales) o el abuso de diuréticos (que se ha descartado analíticamente) o el síndrome de Liddle (que cursa característicamente con HIPERtensión arterial, ausente en este paciente)."},{"q":"A la hora de evaluar el estado nutricional de un paciente adulto, es FALSO que:","o":["La albúmina o la prealbúmina sérica tienen alta sensibilidad y especificidad como indicadores del estado nutricional.","El índice de masa corporal (IMC) proporciona una medida indirecta sencilla de la grasa corporal.","Según el IMC, se considera \\<18,5 bajo peso, 18,5-24,9 peso deseable, 25,0-29,9 sobrepeso y ≥30 obesidad.","Para medir con precisión la composición corporal, lo mejor es realizar técnicas de imagen (DEXA, TC, RM)."],"c":"A","e":"La albúmina y la prealbúmina son reactantes de fase aguda NEGATIVOS cuyos niveles se ven influidos por múltiples factores no nutricionales (inflamación, infección, función hepática, estado de hidratación), por lo que tienen una sensibilidad y especificidad LIMITADAS como marcadores aislados del estado nutricional, siendo necesario interpretarlos siempre en el contexto clínico global del paciente, no como indicadores de alta precisión por sí solos."},{"q":"¿Cuál de los siguientes factores de riesgo se asocia principalmente con la formación de cálculos biliares?","o":["Consumo excesivo de alcohol.","Diabetes tipo 1.","Obesidad.","Hipertensión arterial."],"c":"C","e":"La obesidad, al aumentar la secreción biliar de colesterol y favorecer la sobresaturación de la bilis, es un factor de riesgo clásico y bien establecido para la formación de cálculos biliares de colesterol."},{"q":"Todos los siguientes son factores que se han asociado a gravedad y peor pronóstico de la COVID-19, EXCEPTO:","o":["IMC \\>30.","Diabetes mellitus.","Inmunodepresión.","Niveles de linfocitos elevados."],"c":"D","e":"Es precisamente la LINFOPENIA (no la linfocitosis) el hallazgo analítico clásicamente asociado a mayor gravedad y peor pronóstico en la COVID-19, junto con la obesidad, la diabetes y la inmunodepresión."},{"q":"Varón de 71 años, jubilado, que consulta por ronquidos nocturnos. IMC 31,5 kg/m², ligera somnolencia diurna postprandial sin otros síntomas relevantes. IAH en polisomnografía de 18. ¿Cuál es la medida más adecuada?","o":["Medidas higiénico-dietéticas y control evolutivo.","CPAP (presión positiva continua en la vía aérea).","Ventilación mecánica no invasiva.","Oxigenoterapia nocturna."],"c":"B","e":"Un IAH ≥15 (SAHS moderado) acompañado de síntomas es indicación de tratamiento con CPAP según las guías de las sociedades de neumología."},{"q":"¿Cuál de los siguientes fármacos emplearía en primer lugar al establecer el diagnóstico de diabetes mellitus tipo 2 en un paciente con antecedentes de hipertensión arterial, obesidad e insuficiencia cardíaca?","o":["Sulfonilureas.","Metformina.","Repaglinida.","Vildagliptina."],"c":"B","e":"La metformina sigue siendo el fármaco de primera línea al diagnóstico de la diabetes tipo 2 en la mayoría de los perfiles de pacientes (salvo contraindicación específica), siendo neutra respecto al peso y con un perfil de seguridad adecuado en presencia de HTA/obesidad/IC leve-moderada, sin el riesgo de hipoglucemia de sulfonilureas/glinidas."},{"q":"La OMS definió inicialmente el síndrome metabólico como una entidad caracterizada por obesidad central, hipertrigliceridemia, HDL bajo, hiperglucemia e hipertensión. ¿Cuál de las siguientes afirmaciones sobre su epidemiología es verdadera?","o":["Después de los 60 años, los varones tienen más probabilidad de desarrollar síndrome metabólico que las mujeres.","Entre los pacientes con diabetes mellitus, la presencia de síndrome metabólico confiere un mayor riesgo de enfermedades cardiovasculares.","El IMC es el mejor factor pronóstico de resistencia a la insulina y diabetes en el síndrome metabólico.","La prevalencia de síndrome metabólico es independiente de la edad."],"c":"B","e":"En pacientes diabéticos, la coexistencia de síndrome metabólico confiere un riesgo cardiovascular adicional al ya elevado de la diabetes por sí sola, siendo este exceso de riesgo un hallazgo consistente en los estudios epidemiológicos."},{"q":"¿Cuál de las siguientes afirmaciones es cierta acerca de la pancreatitis aguda?","o":["Es una enfermedad crónica y progresiva.","Puede ser causada por el consumo excesivo de alcohol.","Su causa más común es la obesidad.","Se caracteriza por una inflamación crónica del páncreas."],"c":"B","e":"Junto a la litiasis biliar, el consumo excesivo de alcohol es una de las dos causas más frecuentes de pancreatitis aguda; se trata, por definición, de un proceso inflamatorio agudo, no crónico."},{"q":"Señale la afirmación incorrecta en relación a la insuficiencia cardiaca (IC):","o":["La aparición de edemas no se aprecia hasta que se han acumulado más de 4-5 litros en el espacio intersticial.","Aunque el déficit de vitamina D es muy frecuente en pacientes con IC y se asocia a peor pronóstico, su administración no ha mostrado beneficio y no se recomienda de forma rutinaria.","La desnutrición en pacientes con IC es muy frecuente, infradiagnosticada y se asocia a mal pronóstico.","En la práctica clínica no se realiza habitualmente un cribado nutricional en los pacientes con IC porque no se recomienda por distintas sociedades científicas."],"c":"D","e":"El cribado nutricional SÍ está recomendado por diversas sociedades científicas en el manejo integral de la insuficiencia cardiaca, dada la elevada prevalencia e impacto pronóstico de la desnutrición en estos pacientes; que no se realice sistemáticamente en la práctica clínica real se debe a limitaciones organizativas, no a una falta de recomendación."},{"q":"¿Cuál de las siguientes opciones respecto al cuidado hospitalario de pacientes diabéticos es verdadera?","o":["La anestesia general induce sensibilización a la insulina e incrementa el riesgo de hipoglucemia.","Un mayor grado de hiperglucemia durante la hospitalización no se ha vinculado con mayor incidencia de infecciones.","En ensayos clínicos, el control estricto de la glucemia (objetivo 81-108 mg/dl) es mejor que el control moderado (objetivo 140 mg/dl).","El inicio de nutrición parenteral total se relaciona con mayores requerimientos de insulina."],"c":"D","e":"El aporte calórico concentrado de la nutrición parenteral total (con alto contenido en glucosa) incrementa de forma característica las necesidades de insulina; la anestesia general suele inducir RESISTENCIA a la insulina (no sensibilización), la hiperglucemia hospitalaria SÍ se asocia a mayor riesgo de infecciones, y los grandes ensayos (NICE-SUGAR) mostraron que el control glucémico MUY estricto se asocia a más hipoglucemias graves sin mejorar el pronóstico frente a un control moderado."},{"q":"Varón de 47 años con HTA, obesidad y vida sedentaria. TA 148/92, IMC 32, cintura 94 cm. Glucemia 98 mg/dl, colesterol total 220 mg/dl con LDL 103, HDL 28, triglicéridos 178 mg/dl. Es cierto que:","o":["Tiene síndrome metabólico, pues cumple 3 de 5 criterios: HTA, elevación de triglicéridos e IMC \\>30.","Tiene síndrome metabólico, pues cumple 3 de 5 criterios: elevación de triglicéridos, HDL bajo e IMC \\>30.","El diagnóstico de síndrome metabólico precisa más de una evaluación en un plazo de 3-6 meses.","Las principales características del síndrome metabólico son obesidad central, hipertrigliceridemia, HDL bajo, hiperglucemia e hipertensión arterial."],"c":"D","e":"Los cinco componentes clásicos del síndrome metabólico son la obesidad central, la hipertrigliceridemia, el colesterol HDL bajo, la hiperglucemia/resistencia a la insulina y la hipertensión arterial; el diagnóstico se establece con una única evaluación que cumpla al menos tres de estos cinco criterios, sin necesidad de confirmación diferida en el tiempo, y el IMC (medida global de adiposidad) no es, estrictamente, uno de los 5 criterios diagnósticos formales (que usan el perímetro de cintura como medida de obesidad central, no el IMC)."},{"q":"¿En cuál de las siguientes situaciones de insuficiencia respiratoria aguda es MENOS probable que la VMNI sea beneficiosa?","o":["Agudización de EPOC con acidemia (pH \\<7,35) de causa respiratoria.","Paciente con IMC 48, encefalopatía no grave y PaCO2 85 mmHg.","Paciente con escoliosis grave, taquipnea, disbalance toracoabdominal y acidosis respiratoria.","Paciente con agudización de fibrosis pulmonar idiopática, taquipnea 45 rpm e insuficiencia respiratoria hipoxémica grave."],"c":"D","e":"La VMNI tiene indicación bien establecida y buena respuesta en la agudización de EPOC, el síndrome de hipoventilación-obesidad y las enfermedades restrictivas de la caja torácica. En cambio, en la insuficiencia respiratoria hipoxémica grave por agudización de fibrosis pulmonar idiopática, la evidencia muestra escaso beneficio."},{"q":"¿Cuál de las siguientes opciones es un factor de riesgo para desarrollar mucormicosis?","o":["Diabetes mellitus descompensada (cetoacidosis).","Tabaquismo.","Hipertensión arterial.","Obesidad."],"c":"A","e":"La cetoacidosis diabética es el factor de riesgo clásico de la mucormicosis rinocerebral, ya que el medio ácido y la hiperglucemia favorecen el crecimiento fúngico y alteran la función fagocítica."}]},"6":{"title":"Fiebre de origen desconocido.","questions":[{"q":"Señale la opción CORRECTA en relación con la Fiebre de Origen Desconocido (FOD):","o":["Se define como un cuadro febril de más de 38,3ºC, al menos en tres ocasiones, de duración inferior a tres semanas.","Las neoplasias suponen la causa más frecuente, mientras que las infecciones ocupan el segundo lugar.","Entre las infecciones, la tuberculosis en sus formas extrapulmonares y diseminadas es la causa más importante.","La proporción de casos no diagnosticados es muy escasa."],"c":"C","e":"Dentro de las causas infecciosas de FOD, la tuberculosis (sobre todo en sus formas extrapulmonares y diseminadas, de diagnóstico más difícil) es clásicamente la causa infecciosa más importante. La definición exige fiebre \\>38,3ºC de más de TRES SEMANAS de duración (no menos), las infecciones ---no las neoplasias--- siguen siendo globalmente la causa más frecuente de FOD, y hasta un 20-30% de los casos permanecen sin diagnóstico etiológico pese a un estudio exhaustivo."},{"q":"La fiebre de origen desconocido se define actualmente como:","o":["Fiebre sin foco mayor de 38,3ºC de más de tres semanas a pesar de una valoración intrahospitalaria.","Fiebre sin foco mayor de 38,3ºC en al menos dos ocasiones, de más de tres semanas, sin compromiso inmunitario conocido.","Fiebre sin foco mayor de 38,3ºC en al menos dos ocasiones, de más de tres semanas, a pesar de una valoración intrahospitalaria adecuada.","Fiebre mayor de 38,3ºC al menos en dos ocasiones, de más de tres semanas, y diagnóstico incierto a pesar de una semana de valoración intrahospitalaria."],"c":"C","e":"La definición clásica (Petersdorf y Beeson, actualizada por Durack y Street) exige fiebre documentada \\>38,3ºC en varias determinaciones, una duración superior a tres semanas y ausencia de diagnóstico pese a un estudio adecuado (clásicamente hospitalario, aunque las versiones actualizadas admiten también un estudio ambulatorio estructurado equivalente)."},{"q":"En relación con la fiebre de origen desconocido (FOD) en el anciano, todas son verdaderas EXCEPTO:","o":["La tuberculosis es la infección que con más frecuencia produce FOD en los ancianos.","En ancianos, el cáncer de colon es una causa frecuente de FOD.","Ante FOD debe comenzarse cuanto antes tratamiento antibiótico empírico.","Ante un paciente con FOD y hepatitis granulomatosa se debe valorar tratamiento con tuberculostáticos."],"c":"C","e":"El tratamiento antibiótico empírico NO debe iniciarse de forma precoz y sistemática en la FOD (salvo inestabilidad/sepsis), ya que puede enmascarar el cuadro, retrasar el diagnóstico microbiológico y no ha demostrado mejorar el pronóstico; el pilar del manejo es un estudio escalonado y dirigido antes de cualquier tratamiento empírico."},{"q":"¿Cuál de las siguientes afirmaciones sobre la fiebre de origen desconocido (FOD) es correcta?","o":["La FOD siempre se debe a una infección grave.","La FOD solo afecta a los niños.","La FOD se diagnostica fácilmente en la mayoría de los casos.","La FOD se caracteriza por una fiebre persistente sin causa identificable pese al estudio inicial."],"c":"D","e":"Por definición, la FOD es un síndrome de fiebre prolongada cuya causa no se identifica tras una evaluación diagnóstica inicial adecuada; no se debe siempre a infección (las causas incluyen también neoplasias, enfermedades autoinmunes/inflamatorias y causas misceláneas), no es exclusiva de la infancia y, de hecho, su diagnóstico suele ser complejo y laborioso."}]},"7":{"title":"Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.","questions":[{"q":"De las siguientes afirmaciones sobre los biomarcadores en el diagnóstico y monitorización de la sepsis, señale la opción FALSA:","o":["La procalcitonina presenta mayor sensibilidad y especificidad que la proteína C reactiva.","Niveles de procalcitonin
