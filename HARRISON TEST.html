 cuadro febril con artromialgias y cefalea de varias semanas, en un practicante de actividades al aire libre (exposición potencial a garrapatas), es el cuadro clásico de la borreliosis de Lyme en su fase diseminada."}]},"13":{"title":"Tuberculosis e infecciones por micobacterias no tuberculosas.","questions":[{"q":"¿Cuál es el «gold standard» para el diagnóstico de enfermedad tuberculosa activa?","o":["Una prueba de tuberculina positiva.","Cultivo de Mycobacterium tuberculosis positivo.","IGRA (Interferon Gamma Release Assay) positivo.","Baciloscopia positiva."],"c":"B","e":"El cultivo microbiológico de M. tuberculosis sigue siendo el patrón oro para el diagnóstico de enfermedad activa, ya que además permite el estudio de sensibilidad a fármacos; el Mantoux y el IGRA solo diagnostican infección (no necesariamente enfermedad activa), y la baciloscopia, aunque rápida, tiene menor sensibilidad que el cultivo."},{"q":"Todas las afirmaciones sobre las pruebas de liberación de interferón gamma (IGRA) para el diagnóstico de la tuberculosis latente son verdaderas, EXCEPTO:","o":["No hay un fenómeno de refuerzo («booster») con pruebas repetidas.","Son pruebas más específicas que la prueba cutánea de tuberculina.","Tienen mayor sensibilidad que la prueba cutánea de tuberculina en zonas con alta prevalencia de VIH.","Tienen menor reactividad cruzada con BCG y micobacterias no tuberculosas que la prueba cutánea de tuberculina."],"c":"C","e":"En contextos de alta prevalencia de VIH/inmunosupresión, la sensibilidad de los IGRA puede ser SIMILAR O INCLUSO MENOR que la del Mantoux (ambas pruebas dependen de una respuesta inmune celular conservada), no mayor; el resto de ventajas de los IGRA (ausencia de fenómeno booster, mayor especificidad y menor reactividad cruzada con BCG) sí son correctas."},{"q":"Todas las afirmaciones sobre los fármacos antituberculosos son verdaderas, EXCEPTO:","o":["En EEUU, la resistencia de M. tuberculosis a isoniacida se mantiene por debajo del 10%.","La neuritis óptica es el efecto adverso más grave del etambutol.","La pirazinamida tiene utilidad en el tratamiento de infecciones por complejo M. avium y M. kansasii.","Debe usarse rifabutina en lugar de rifampicina en pacientes que reciben tratamiento concurrente con inhibidores de la proteasa o nevirapina."],"c":"C","e":"La pirazinamida carece de actividad útil frente a las micobacterias no tuberculosas, incluidos el complejo M. avium y M. kansasii (que son intrínsecamente resistentes), por lo que no forma parte de los regímenes terapéuticos frente a estos microorganismos."},{"q":"La enfermedad de Poncet es producida por:","o":["Staphylococcus aureus.","Mycobacterium tuberculosis.","Campylobacter jejuni.","Treponema pallidum."],"c":"B","e":"La enfermedad (o reumatismo) de Poncet es una poliartritis reactiva estéril asociada a la infección tuberculosa activa, sin invasión articular directa por el bacilo, que mejora con el tratamiento antituberculoso."},{"q":"Paciente procedente de Bolivia con cuadro de convulsiones generalizadas; TAC craneal con gran número de calcificaciones nodulares. ¿Cuál es el diagnóstico más probable?","o":["Toxoplasmosis cerebral.","Tuberculosis.","Neurocisticercosis.","Amebiasis diseminada."],"c":"C","e":"Las calcificaciones nodulares múltiples cerebrales en un paciente procedente de un área endémica de Latinoamérica, con crisis convulsivas, son muy características de la neurocisticercosis por Taenia solium, causa infecciosa más frecuente de epilepsia adquirida en zonas endémicas."},{"q":"En relación con la prueba de la tuberculina (Mantoux), señale lo CORRECTO:","o":["La mayor parte de las pruebas de tuberculina empleadas en España no contienen antígenos de BCG.","Una induración menor de 10 mm en nuestro país nunca debe considerarse positiva.","Un inmigrante procedente de Marruecos con una induración de 10 mm debe considerarse positivo.","Una induración mayor de 15 mm debe considerarse positiva excepto en vacunados con BCG en los 10 años previos."],"c":"C","e":"En personas procedentes de países de alta prevalencia de tuberculosis (como Marruecos), el punto de corte para considerar el Mantoux positivo se reduce a ≥10 mm (incluso ≥5 mm en algunos protocolos de alto riesgo), dado el mayor riesgo epidemiológico de infección latente en este grupo."},{"q":"Indique la pauta de tratamiento más adecuada en la quimioprofilaxis primaria/tratamiento de la infección tuberculosa latente:","o":["Isoniazida diaria durante 4 meses.","Isoniazida + rifapentina semanal durante 3 meses.","Rifampicina diaria durante 1 mes.","Isoniazida + rifampicina diaria durante 6 meses."],"c":"B","e":"La pauta de isoniazida más rifapentina, administrada semanalmente durante 3 meses (12 dosis), se considera actualmente el régimen prioritario para el tratamiento de la infección tuberculosa latente, por su menor duración y mejor adherencia, con eficacia comparable a pautas más largas."},{"q":"Con respecto al diagnóstico de la tuberculosis, señale la opción CIERTA:","o":["Un Mantoux negativo descarta la infección tuberculosa.","La presencia de un Mantoux positivo (≥5 mm) indica iniciar en todos los casos tratamiento con isoniacida.","El efecto booster («empuje») se encuentra típicamente en sujetos ancianos y en pacientes vacunados con BCG.","El Mantoux permite diferenciar mejor que el Quantiferón la infección tuberculosa latente en pacientes vacunados de BCG."],"c":"C","e":"El efecto booster (positivización de un segundo Mantoux tras un primero falsamente negativo, por reactivación de la memoria inmunológica) es típico de personas ancianas o con vacunación BCG antigua; el Mantoux puede dar falsos negativos (no lo descarta con certeza), no todo Mantoux positivo implica tratamiento sistemático (depende del riesgo individual), y es precisamente el QUANTIFERÓN (IGRA) el que discrimina mejor la infección latente en vacunados de BCG, al no tener reactividad cruzada con la vacuna."},{"q":"Señale la respuesta FALSA en cuanto a la tuberculosis primaria:","o":["En áreas con altas tasas de transmisión de TB, esta forma de enfermedad suele observarse en niños.","En la mayor parte de los casos, la lesión cura espontáneamente y se manifiesta solo como un pequeño nódulo calcificado.","La reacción de la pleura que cubre a un foco subpleural es un hecho infrecuente.","El engrosamiento y linfadenopatía regional es conocido como complejo de Ghon."],"c":"C","e":"La reacción pleural sobre un foco subpleural es, en realidad, un hallazgo relativamente FRECUENTE en la tuberculosis primaria, no infrecuente; el resto de afirmaciones (curación espontánea con calcificación residual, presentación en niños en zonas de alta transmisión, complejo de Ghon) son correctas."},{"q":"¿Cuáles de las siguientes situaciones NO es una indicación de quimioprofilaxis de la tuberculosis?","o":["Menores de 35 años con prueba de tuberculina negativa y contacto con paciente bacilífero.","Menores de 35 años con prueba de tuberculina positiva y contacto con paciente bacilífero.","Pacientes que van a recibir tratamiento con anticuerpos monoclonales anti-TNF-alfa y prueba de tuberculina negativa.","Pacientes inmunodeprimidos de cualquier edad con prueba de tuberculina negativa y contacto con un paciente bacilífero."],"c":"A","e":"En menores de 35 años con Mantoux inicialmente negativo y contacto estrecho con un caso bacilífero, la conducta habitual es la profilaxis en «ventana» (mientras se descarta la conversión tuberculínica en las semanas siguientes) más que una quimioprofilaxis sistemática indefinida sin conversión documentada; en cambio, con Mantoux ya positivo, en candidatos a anti-TNF con Mantoux negativo (por el elevado riesgo de reactivación) y en inmunodeprimidos con contacto bacilífero, sí está claramente indicada la profilaxis."},{"q":"¿Qué tipo de paciente tiene MENOR riesgo de desarrollar tuberculosis activa?","o":["Varón de 40 años con infección por VIH y CD4 del 1%.","Mujer de 65 años con artritis reumatoide en tratamiento con fármacos anti-TNF.","Mujer de 50 años con trasplante renal.","Varón de 45 años, no vacunado de BCG, con un Mantoux de 12 mm al comenzar un nuevo trabajo."],"c":"D","e":"Un Mantoux positivo aislado en un paciente inmunocompetente, sin otros factores de inmunosupresión, conlleva un riesgo de progresión a enfermedad activa muy inferior al de los pacientes con inmunosupresión grave (VIH avanzado, tratamiento anti-TNF, trasplante de órgano sólido), en quienes el riesgo de reactivación de una infección latente es considerablemente mayor."},{"q":"Está evaluando una prueba diagnóstica de tuberculosis. Al aplicarla a 100 pacientes con TBC conocida, es negativa en 3 de ellos y positiva en 97. Puede decir que:","o":["Su valor predictivo negativo es de 0,97.","La especificidad de la prueba es de 0,97.","La sensibilidad de la prueba es de 0,97.","Tiene un 3% de falsos positivos."],"c":"C","e":"Al aplicarse únicamente a pacientes con TBC ya CONOCIDA (enfermos verdaderos), la proporción de resultados positivos (97/100) corresponde por definición a la SENSIBILIDAD de la prueba (capacidad de detectar correctamente a los verdaderos enfermos); no se puede calcular especificidad, VPN ni tasa de falsos positivos sin incluir también a pacientes sin la enfermedad."},{"q":"¿Cuál de estas micobacterias NO pertenece al complejo Mycobacterium tuberculosis?","o":["Mycobacterium bovis.","Mycobacterium kansasii.","Mycobacterium africanum.","Bacilo de Calmette-Guérin (BCG)."],"c":"B","e":"Mycobacterium kansasii es una micobacteria NO tuberculosa (atípica), causa de enfermedad pulmonar similar a la TB pero de tratamiento distinto; M. bovis, M. africanum y la cepa atenuada BCG (derivada de M. bovis) sí pertenecen al complejo Mycobacterium tuberculosis."},{"q":"¿Cuál de las siguientes constituye una ventaja de los ensayos IGRA frente a la prueba cutánea de tuberculina en el diagnóstico de infección tuberculosa latente?","o":["Evita los falsos positivos por vacunación previa con BCG.","Tiene mayor capacidad para predecir las tuberculosis de reactivación.","Tiene mayor capacidad de predecir la eficacia de la profilaxis con isoniacida.","Evita los falsos negativos por anergia en pacientes muy inmunosuprimidos."],"c":"A","e":"Los antígenos utilizados en los IGRA (ESAT-6, CFP-10) no están presentes en la cepa BCG ni en la mayoría de micobacterias no tuberculosas, por lo que evitan los falsos positivos por vacunación previa, a diferencia de la tuberculina, que sí puede dar falsos positivos por reactividad cruzada con BCG."},{"q":"Joven de 26 años, natural de Guayaquil (Ecuador), residente en España desde hace 10 años, con psoriasis grave refractaria en la que se decide iniciar infliximab. Prueba de tuberculina con induración de 16 mm; radiografía de tórax normal. ¿Cuál es el manejo más adecuado?","o":["Iniciar tratamiento con isoniacida durante 9 meses.","Iniciar tratamiento con isoniacida, rifampicina, pirazinamida y etambutol.","Remitir de nuevo a Dermatología por bajo riesgo de desarrollo de enfermedad tuberculosa.","Realizar TC de tórax y, posteriormente, fibrobroncoscopia para obtención de muestras microbiológicas."],"c":"A","e":"Un Mantoux positivo con radiografía de tórax normal indica infección tuberculosa LATENTE (no enfermedad activa, que requeriría un régimen de 4 fármacos), por lo que, antes de iniciar el tratamiento biológico anti-TNF (que aumenta considerablemente el riesgo de reactivación), debe completarse profilaxis con isoniacida (9 meses) o una pauta corta alternativa."},{"q":"Varón de 32 años, adicto a drogas por vía parenteral, recién salido de la cárcel, con prueba de tuberculina (PPD) de 10 mm de induración, siendo el PPD del año previo negativo. Asintomático, serología VIH negativa, radiografía de tórax normal. ¿Qué actitud es más adecuada?","o":["No realizar tratamiento y control anual con radiografía de tórax.","Cultivos de esputo inducidos para micobacterias, tratando solo si son positivos.","Isoniazida diaria durante 9 meses.","Tratamiento con 4 fármacos durante 4 meses."],"c":"C","e":"La conversión tuberculínica documentada (de negativo a positivo en el último año) indica infección tuberculosa latente reciente, situación con mayor riesgo de progresión a enfermedad activa, lo que justifica el tratamiento de la ITL con isoniacida durante 9 meses, especialmente en un paciente con factores de riesgo adicionales (antecedente penitenciario, uso de drogas)."},{"q":"Paciente con insuficiencia renal moderada (FG 55 ml/min) diagnosticado de tuberculosis pulmonar. ¿Cuál es la actitud correcta respecto a la dosis de rifampicina?","o":["No es preciso modificar la dosis habitual.","Debe reducirse la dosis al 50% de la habitual.","El intervalo entre dosis debe duplicarse.","Está contraindicada su utilización."],"c":"A","e":"La rifampicina se elimina fundamentalmente por vía biliar/hepática, con escasa dependencia de la función renal, por lo que no precisa ajuste de dosis en la insuficiencia renal, a diferencia de otros fármacos de eliminación predominantemente renal como el etambutol."},{"q":"La localización más frecuente de la tuberculosis osteoarticular es:","o":["La rodilla.","La cadera.","La columna vertebral.","El tobillo."],"c":"C","e":"La columna vertebral (mal de Pott) es, con diferencia, la localización más frecuente de la tuberculosis osteoarticular, por diseminación hematógena a los cuerpos vertebrales, típicamente afectando a más de un cuerpo vertebral con destrucción del disco intervertebral."}]},"14":{"title":"Infecciones micóticas.","questions":[{"q":"Varón de 31 años, HSH, acude por fiebre, tos y disnea de dos semanas de instauración progresiva. Dos días antes se confirma serología VIH positiva. LDH tres veces el límite superior normal, PaO2 basal 67 mmHg. PCR SARS-CoV-2 y antígenos de neumococo/Legionella en orina negativos. ¿Cuál es el diagnóstico más probable?","o":["Neumonía por Pneumocystis jirovecii.","Nocardiosis.","Coccidioidomicosis.","Isosporiasis."],"c":"A","e":"La combinación de neumonía subaguda de instauración progresiva, hipoxemia significativa y elevación marcada de LDH, en un paciente recién diagnosticado de VIH, es muy característica de la neumonía por Pneumocystis jirovecii, infección oportunista definitoria de sida frecuentemente reveladora del diagnóstico de VIH."},{"q":"Señale la FALSA en relación con las candidemias:","o":["Se recomienda estudio de fondo de ojo en pacientes con candidemia (según indicación clínica).","El tratamiento empírico de elección son los azoles.","La duración del tratamiento debe ser de al menos dos semanas tras que los hemocultivos de control sean negativos.","Candida krusei tiene resistencia primaria a fluconazol."],"c":"B","e":"El tratamiento empírico de elección actual de la candidemia son las EQUINOCANDINAS (no los azoles), por su mayor actividad frente a especies de Candida no albicans y menor toxicidad; el resto de afirmaciones (duración mínima tras hemocultivos negativos, resistencia intrínseca de C. krusei a fluconazol, valoración de fondo de ojo) son correctas."},{"q":"En cuanto a las infecciones por hongos filamentosos, señale la opción INCORRECTA:","o":["Scedosporium se considera un patógeno emergente oportunista, con tendencia a la invasión del sistema nervioso central.","Fusarium se aísla en sangre hasta en el 50% de los pacientes con fusariosis diseminada.","Son exclusivas de pacientes inmunodeprimidos.","La mucormicosis rinocerebral se observa en pacientes con cetoacidosis diabética."],"c":"C","e":"Las infecciones por hongos filamentosos NO son exclusivas de inmunodeprimidos: pueden ocurrir en inmunocompetentes tras inoculación traumática directa (heridas contaminadas con tierra), aunque predominan claramente en pacientes con inmunosupresión, especialmente neutropenia prolongada."},{"q":"Aspergillus fumigatus puede estar implicado en una amplia variedad de cuadros clínicos. ¿Cuál de las siguientes NO es una manifestación clínica habitualmente causada por este microorganismo?","o":["Neumonía en pacientes granulopénicos.","Salpingitis.","Otitis aspergilar de colonización.","Colonización de cavernas tuberculosas (aspergiloma)."],"c":"B","e":"La salpingitis no es una manifestación reconocida de la infección por Aspergillus fumigatus, que afecta característicamente al aparato respiratorio (neumonía invasiva en granulocitopénicos, colonización de cavidades pulmonares preexistentes formando aspergilomas) y, con menor frecuencia, al oído externo."},{"q":"En un centro oncológico hay preocupación por un brote de casos de aspergilosis invasiva en pacientes con trasplante de médula ósea. ¿Cuál es la fuente más probable de infección?","o":["Fuente de aire contaminada.","Fuente de agua contaminada.","Diseminación de profesional a paciente por mala técnica de lavado de manos.","Diseminación de profesional a paciente por uso deficiente de desinfectante de alcohol."],"c":"A","e":"Aspergillus es un hongo de distribución ambiental que se transmite fundamentalmente por vía AÉREA mediante inhalación de esporas; los brotes hospitalarios en pacientes neutropénicos suelen relacionarse con obras de construcción cercanas, sistemas de ventilación o filtros HEPA defectuosos que permiten la entrada de esporas contaminadas en el aire."},{"q":"En cuanto a la candidemia, señale la respuesta INCORRECTA:","o":["Son factores de riesgo la neutropenia, la cirugía abdominal reciente, la nutrición enteral y el tratamiento con antibióticos de amplio espectro.","La candidiasis oral y esofágica NO son factor de riesgo para candidemia.","Fluconazol es el tratamiento empírico de elección de la candidemia en todos los casos.","En todos los pacientes candidémicos deben realizarse hemocultivos de control."],"c":"B","e":"La candidiasis oral o esofágica SÍ constituye un marcador de riesgo de candidemia diseminada, especialmente en pacientes inmunodeprimidos, por representar una carga fúngica elevada con potencial de translocación; el resto de afirmaciones (factores de riesgo clásicos, necesidad de hemocultivos de control) son correctas, si bien el tratamiento empírico de elección actual son las equinocandinas, no fluconazol de forma sistemática."},{"q":"¿Cuál de los siguientes factores condiciona un mayor riesgo de infección fúngica invasora por hongos filamentosos?","o":["Recibir tratamiento que produzca neutropenia profunda (\\<100 células/mm³) durante más de 7 días.","Recibir tratamiento con timoglobulina.","Recibir tratamiento con rituximab.","Recibir esteroides a dosis superiores a 25 mg/día de prednisona (o equivalente) durante más de 3 semanas."],"c":"A","e":"La neutropenia profunda y prolongada (\\<100 neutrófilos/mm³ durante más de 7 días) es el factor de riesgo clásico más determinante de infección fúngica invasora por hongos filamentosos (Aspergillus, mucorales), por encima de otros factores como la corticoterapia prolongada, la timoglobulina o el rituximab, aunque estos también incrementan el riesgo."},{"q":"¿Cuál de las siguientes opciones es la respuesta correcta en la aspergilosis pulmonar invasiva en pacientes inmunocomprometidos?","o":["La aspergilosis pulmonar invasiva está causada exclusivamente por Aspergillus fumigatus.","El aislamiento de Aspergillus spp. en lavado broncoalveolar siempre es indicativo de infección.","El signo de media luna de aire en la TC es patognomónico de la aspergilosis pulmonar invasiva.","En biopsia de tejido pulmonar esperaríamos encontrar hifas septadas con ramificaciones en ángulo de 45º."],"c":"D","e":"La demostración histológica de hifas septadas con ramificación dicotómica en ángulo agudo (\\~45º) es el hallazgo característico de Aspergillus en tejido, lo que la distingue de los mucorales (hifas no septadas, ramificación en ángulo de 90º); no está causada exclusivamente por A. fumigatus (también A. flavus, A. niger, etc.), el aislamiento en lavado broncoalveolar puede representar colonización, y el signo de media luna de aire no es patognomónico (puede verse en otras entidades)."},{"q":"¿Cuál de las siguientes especies de Candida suele ser resistente o tener sensibilidad disminuida a fluconazol?","o":["Candida albicans.","Candida parapsilosis.","Candida krusei.","Candida guilliermondii."],"c":"C","e":"Candida krusei presenta resistencia intrínseca a fluconazol, siendo una de las especies de Candida no albicans con peor perfil de sensibilidad a los azoles de primera generación."},{"q":"Con respecto a la candidemia, ¿cuál de las siguientes afirmaciones NO es correcta?","o":["El aislamiento de Candida spp. en hemocultivos en un paciente afebril puede considerarse colonización sin necesidad de tratamiento.","Se recomienda examen oftalmológico ante candidemia, aunque hay discrepancias entre sociedades científicas sobre su realización sistemática.","No se recomienda realizar ecocardiografía de rutina a todos los pacientes con candidemia.","Los abscesos hepatoesplénicos son una complicación poco frecuente en pacientes no neutropénicos."],"c":"A","e":"Cualquier hemocultivo positivo para Candida spp. debe considerarse clínicamente significativo (representa candidemia verdadera, no colonización) y obliga a iniciar tratamiento antifúngico y a buscar el foco/posibles complicaciones, independientemente de la presencia o no de fiebre."},{"q":"Un paciente afecto de sida, tras iniciar tratamiento con ketoconazol por micosis sistémica, consulta por dolor abdominal e hipotensión, con hiponatremia franca e hiperpotasemia. ¿Qué entidad se debe sospechar?","o":["Shock anafiláctico.","Shock séptico.","Hiperaldosteronismo.","Insuficiencia suprarrenal."],"c":"D","e":"El ketoconazol inhibe la síntesis de esteroides suprarrenales y puede precipitar una insuficiencia suprarrenal aguda, especialmente en pacientes con reserva glandular ya comprometida, presentándose con hipotensión, dolor abdominal, hiponatremia e hiperpotasemia."},{"q":"¿Qué microorganismo se ha implicado en la formación de los cálculos de estruvita (fosfato amónico-magnésico)?","o":["Enterococcus faecalis.","Proteus mirabilis.","Staphylococcus saprophyticus.","Candida albicans."],"c":"B","e":"Proteus mirabilis (y otros microorganismos productores de ureasa como Klebsiella o Providencia) alcaliniza la orina al desdoblar la urea, favoreciendo la precipitación de fosfato amónico-magnésico y la formación de cálculos coraliformes de estruvita."},{"q":"¿Cuál es el principal agente causal de las neumonías intrahospitalarias?","o":["Neumococo.","Enterococo.","Bacilos gramnegativos aerobios.","Candida albicans."],"c":"C","e":"Los bacilos gramnegativos aerobios (Pseudomonas aeruginosa, enterobacterias como Klebsiella o E. coli) son, en conjunto, los agentes etiológicos más frecuentes de la neumonía nosocomial, especialmente en pacientes ventilados mecánicamente."},{"q":"Varón de 38 años con infección VIH, mala adherencia al TAR, que acude por odinofagia progresiva de 6 semanas. Exploración: caquexia y candidiasis bucal, sin adenopatías. ¿Cuál sería el siguiente paso?","o":["Endoscopia digestiva alta.","Tratamiento empírico con fluconazol.","Iniciar de forma empírica tratamiento con IBP.","Realizar estudio gastroduodenal con contraste."],"c":"B","e":"En un paciente VIH con inmunosupresión avanzada, candidiasis oral y odinofagia progresiva, la sospecha clínica de candidiasis esofágica es muy alta, por lo que se recomienda iniciar tratamiento antifúngico empírico (fluconazol) y reservar la endoscopia para los casos que no respondan al tratamiento empírico en el plazo esperado."},{"q":"La infección por Cryptococcus neoformans afecta principalmente a:","o":["Sistema respiratorio.","Sistema nervioso central.","Tracto gastrointestinal.","Piel y anexos."],"c":"B","e":"Aunque la puerta de entrada es respiratoria (inhalación de esporas), la manifestación clínica más relevante y característica de Cryptococcus neoformans es la meningoencefalitis, especialmente en pacientes con inmunosupresión celular avanzada (VIH con CD4 muy bajos)."},{"q":"La criptococosis pulmonar se adquiere principalmente a través de:","o":["Inhalación de esporas.","Ingestión de alimentos contaminados.","Contacto directo con la piel.","Aerosoles procedentes de otro paciente."],"c":"A","e":"La infección por Cryptococcus se adquiere por inhalación de esporas presentes en el ambiente (especialmente asociadas a excrementos de aves, sobre todo palomas), no por transmisión persona a persona ni por vía digestiva o cutánea."},{"q":"¿Cuál de las siguientes opciones es un factor de riesgo para desarrollar mucormicosis?","o":["Diabetes mellitus descompensada (cetoacidosis).","Tabaquismo.","Hipertensión arterial.","Obesidad."],"c":"A","e":"La cetoacidosis diabética es el factor de riesgo clásico de la mucormicosis rinocerebral, ya que el medio ácido y la hiperglucemia favorecen el crecimiento fúngico y alteran la función fagocítica; los mucorales tienen especial afinidad por invadir vasos sanguíneos en este contexto metabólico."}]},"15":{"title":"Infecciones por virus DNA y RNA más prevalentes.","questions":[{"q":"¿Cuál de estas opciones es FALSA en la diferente presentación de un síndrome mononucleósico por citomegalovirus (CMV) frente al virus de Epstein-Barr (VEB)?","o":["Se presenta en edades mayores en el producido por CMV.","Es más frecuente la esplenomegalia en el producido por el VEB.","El producido por CMV causa faringoamigdalitis exudativa con más frecuencia que el VEB.","Son más frecuentes las adenopatías cervicales en el producido por VEB."],"c":"C","e":"La faringoamigdalitis exudativa es una manifestación característica y mucho más frecuente en la mononucleosis por VEB; la mononucleosis por CMV suele cursar con un cuadro más inespecífico, menos exudativo, con menos adenopatías y esplenomegalia que la producida por VEB."},{"q":"Paciente trasplantado renal 4 meses antes, con serología positiva para CMV, que realizó profilaxis con valganciclovir hasta el día +90. Presenta fiebre sin foco y linfopenia, buen estado general. ¿Qué afirmación sobre el manejo NO le parece correcta?","o":["Solicitaría carga viral de CMV en sangre.","Iniciaría tratamiento empírico con ganciclovir sin esperar la confirmación diagnóstica.","Solicitaría estudio de resistencias de CMV basal, previo al inicio de ganciclovir.","Plantearía el diagnóstico diferencial con otros oportunistas, el rechazo agudo y la toxicidad farmacológica."],"c":"B","e":"Antes de iniciar tratamiento antiviral específico, debe confirmarse la reactivación de CMV mediante la determinación de carga viral y, cuando sea posible, un estudio de resistencias basal, ya que el ganciclovir tiene toxicidad relevante (mielosupresión) y el cuadro clínico (fiebre y linfopenia) es inespecífico y podría deberse a otras causas (rechazo, otros oportunistas, toxicidad farmacológica) que deben considerarse en el diagnóstico diferencial antes de tratar empíricamente."},{"q":"Respecto a la vacuna del virus varicela-zóster, es FALSO que:","o":["En adultos sanos sin evidencia de inmunidad deberían recibir 2 dosis de 0,5 ml por vía subcutánea, separadas al menos 8 semanas.","Se encuentra incluida en el calendario vacunal infantil.","Está contraindicada en pacientes en tratamiento prolongado con esteroides a dosis elevadas.","En adultos reduce la incidencia de neuralgia postherpética."],"c":"D","e":"La reducción de la incidencia de neuralgia postherpética es un beneficio propio de la vacuna específica frente al HERPES ZÓSTER (vacuna recombinante para adultos mayores), no de la vacuna de la varicela dirigida a prevenir la primoinfección en niños/adultos susceptibles."},{"q":"En los síndromes periódicos asociados a criopirina (CAPS) es típico:","o":["Afectación pulmonar intersticial.","Urticaria inducida por el frío.","Panuveítis granulomatosa.","Parotiditis bilateral."],"c":"B","e":"Los CAPS son enfermedades autoinflamatorias monogénicas por mutaciones en el gen NLRP3, cuya manifestación característica es la urticaria inducida por el frío, junto con fiebre recurrente y afectación articular/ocular en las formas más graves."},{"q":"¿Cuál de las siguientes manifestaciones de infección por CMV es MENOS probable tras un trasplante pulmonar?","o":["Esofagitis.","Neumonitis.","Retinitis.","Síndrome mononucleósico."],"c":"C","e":"La retinitis por CMV es mucho más característica de la inmunosupresión celular profunda del VIH avanzado (CD4 muy bajos) que del trasplantado de órgano sólido, en quienes predominan la neumonitis (especialmente relevante tras trasplante pulmonar), la esofagitis y el síndrome mononucleósico."},{"q":"Varón de 19 años con febrícula, mialgias y odinofagia, junto con máculas cutáneas generalizadas no pruriginosas de 7 días de evolución. Refiere una úlcera anal dolorosa a la defecación el mes anterior, que desapareció progresivamente sin tratamiento. ¿Cuál es el germen causante más probable?","o":["Treponema pallidum.","Gonococo.","Virus herpes simple tipo 2.","Chlamydia trachomatis."],"c":"A","e":"La secuencia de una úlcera anal indolora/poco dolorosa autolimitada (chancro primario) seguida semanas después de fiebre, mialgias, odinofagia y exantema maculoso generalizado no pruriginoso es la presentación clásica de la sífilis secundaria tras un chancro primario anal no diagnosticado."},{"q":"¿Cuál de las siguientes afirmaciones respecto a la vacuna frente al virus de la gripe es CORRECTA?","o":["La vacunación antigripal ha demostrado disminuir la mortalidad de los pacientes con gripe, especialmente en grupos de riesgo.","La vacunación frente a la gripe ha demostrado disminuir hospitalizaciones y visitas médicas, pero no la mortalidad.","No es posible administrar simultáneamente la vacuna de la gripe y la del virus respiratorio sincitial (VRS).","En vacunados mayores de 65 años, el oseltamivir no mejora el pronóstico."],"c":"A","e":"Diversos estudios y metaanálisis han mostrado que la vacunación antigripal reduce hospitalizaciones, complicaciones y también la mortalidad, especialmente en poblaciones de riesgo (ancianos, comorbilidad); la coadministración con la vacuna del VRS es posible, y el oseltamivir sí puede aportar beneficio clínico en ancianos con gripe confirmada, incluso vacunados."},{"q":"El agente etiológico más frecuente de la úlcera genital a nivel mundial es actualmente:","o":["Treponema pallidum.","Haemophilus ducreyi.","Virus herpes simple.","Chlamydia trachomatis."],"c":"C","e":"El virus del herpes simple (fundamentalmente VHS-2) es en la actualidad la causa más frecuente de úlcera genital a nivel mundial, por delante de la sífilis y el chancroide, cuya incidencia ha disminuido notablemente en muchos países."},{"q":"Mujer de 45 años, VIH positivo con CD4 de 30 células/µl, con pérdida de peso, fiebre nocturna y diarrea de varias semanas. Colonoscopia: múltiples úlceras profundas en colon; biopsia con inclusiones intranucleares y citoplasmáticas. ¿Cuál es el agente causal más probable?","o":["Citomegalovirus.","Herpes simple.","Cryptosporidium.","Toxoplasma gondii."],"c":"A","e":"Las úlceras colónicas profundas con inclusiones intranucleares y citoplasmáticas características («ojo de búho») en un paciente con inmunosupresión avanzada por VIH son el hallazgo histológico clásico de la colitis por citomegalovirus."},{"q":"Relativo a los virus herpes simple 1 y 2, ¿cuál de las siguientes afirmaciones es FALSA?","o":["Las células en las que establecen la latencia son las neuronas de los ganglios de las raíces posteriores.","Durante la reactivación, la migración vírica produce la lisis de la neurona afectada.","La manifestación más frecuente de la reactivación del VHS-1 facial es la lesión del borde labial («calentura»).","Una reactivación que afecte a la tercera rama trigeminal pone en riesgo la integridad de la córnea."],"c":"B","e":"Durante la reactivación, el virus migra por vía axonal hacia la periferia SIN lisar la neurona ganglionar, que sobrevive y permite reactivaciones recurrentes a lo largo de la vida; si la neurona muriera con cada reactivación, no serían posibles los episodios repetidos característicos de la infección por VHS."},{"q":"La causa más frecuente de parálisis del IV par craneal es:","o":["Traumatismos.","Diabetes mellitus.","Herpes zóster.","Síndrome del seno cavernoso."],"c":"B","e":"La diabetes mellitus, por microangiopatía/mononeuropatía isquémica de los pares craneales oculomotores, es una causa frecuente de parálisis aislada del IV par (y también del III y VI), especialmente en pacientes de edad media-avanzada con mal control metabólico."},{"q":"Indique la causa más frecuente de encefalitis aguda no endémica del adulto:","o":["Virus varicela-zóster.","Arbovirus.","Virus herpes simple tipo 1.","Virus herpes simple tipo 2."],"c":"C","e":"El VHS-1 es, con diferencia, la causa más frecuente de encefalitis esporádica del adulto en nuestro medio."},{"q":"El agente etiológico más frecuente en las neumonías extrahospitalarias en adultos sanos es:","o":["Streptococcus pneumoniae.","Legionella pneumophila.","Haemophilus influenzae.","Klebsiella pneumoniae."],"c":"A","e":"Streptococcus pneumoniae sigue siendo, con diferencia, el agente etiológico más frecuentemente identificado en la neumonía adquirida en la comunidad en adultos, incluidos los sanos sin comorbilidad relevante."},{"q":"Mujer de 17 años con fiebre alta de 5 días, odinofagia, cefalea, dolor abdominal y astenia intensa. Amígdalas rojas con membrana exudativa maloliente; adenopatías cervicales anteriores, posteriores, occipitales y epitrocleares; hepatomegalia leve y esplenomegalia (bazo a 3 cm). ¿Qué estudio serológico pediría?","o":["Sarampión.","Rubéola.","Epstein-Barr.","Parvovirus B19."],"c":"C","e":"La faringoamigdalitis exudativa, las adenopatías generalizadas (incluidas las epitrocleares, muy sugestivas de mononucleosis) y la hepatoesplenomegalia son el cuadro clásico de mononucleosis infecciosa por virus de Epstein-Barr."},{"q":"¿Cuál de los siguientes virus se asocia principalmente con infección en pacientes inmunocomprometidos?","o":["Citomegalovirus.","Herpesvirus humano tipo 7.","Virus de la influenza.","Virus del sarampión."],"c":"A","e":"El citomegalovirus es el virus del listado con mayor relevancia clínica específica en el paciente inmunocomprometido (trasplantados, VIH avanzado), donde puede producir enfermedad invasiva grave por reactivación de una infección latente."},{"q":"El herpesvirus humano tipo 8 se relaciona con las siguientes neoplasias, EXCEPTO:","o":["Sarcoma de Kaposi.","Linfoma primario de cavidades.","Enfermedad de Castleman multicéntrica.","Linfoma cerebral primario."],"c":"D","e":"El linfoma primario del sistema nervioso central en el contexto del VIH se asocia clásicamente al virus de Epstein-Barr, no al VHH-8; el sarcoma de Kaposi, el linfoma primario de cavidades y la enfermedad de Castleman multicéntrica sí están causalmente relacionados con el VHH-8."},{"q":"¿Cuál de los siguientes hallazgos semiológicos en un paciente con herpes zóster NO indica una especial gravedad?","o":["Presencia de vesículas en el conducto auditivo externo (síndrome de Ramsay Hunt).","Afectación multimetamérica.","Afectación del ala nasal (signo de Hutchinson).","Lesiones cutáneas en distintas fases evolutivas."],"c":"D","e":"Que las lesiones estén en distintas fases evolutivas (vesículas, costras) es habitual en la evolución normal del herpes zóster y no constituye per se un signo de gravedad; en cambio, la afectación del CAE (Ramsay Hunt, riesgo de parálisis facial), la diseminación multimetamérica (sugestiva de inmunosupresión) y la afectación del ala nasal (signo de Hutchinson, riesgo de afectación ocular grave) sí son signos de alarma."},{"q":"¿Cuál de los siguientes virus está asociado a la enfermedad conocida como exantema súbito o «sexta enfermedad» en niños?","o":["Herpesvirus humano tipo 6.","Herpesvirus humano tipo 7.","Herpesvirus humano tipo 8.","Virus del sarampión."],"c":"A","e":"El herpesvirus humano tipo 6 (VHH-6) es el agente causal clásico del exantema súbito (roséola infantil o sexta enfermedad), caracterizado por fiebre alta de varios días seguida de un exantema que aparece al ceder la fiebre."},{"q":"¿Cuál de los siguientes virus causa infección congénita en recién nacidos y puede producir secuelas a largo plazo?","o":["Virus herpes simple.","Virus varicela-zóster.","Virus de Epstein-Barr.","Citomegalovirus."],"c":"D","e":"El citomegalovirus es la causa más frecuente de infección congénita viral, pudiendo producir secuelas neurológicas y sensoriales a largo plazo (sordera neurosensorial, discapacidad intelectual), especialmente si la primoinfección materna ocurre durante el embarazo."},{"q":"El virus de la influenza pertenece a la familia de los:","o":["Herpesvirus.","Papillomavirus.","Orthomyxovirus.","Picornavirus."],"c":"C","e":"El virus de la gripe (influenza) pertenece a la familia Orthomyxoviridae, virus ARN segmentado con envoltura, cuya variabilidad antigénica (deriva y cambio antigénico) explica la necesidad de actualizar la vacuna anualmente."}]},"16":{"title":"Infección causada por el virus de la inmunodeficiencia humana.","questions":[{"q":"En relación con el tratamiento de la infección tuberculosa latente, señale la INCORRECTA:","o":["El régimen de isoniacida diaria durante 6 meses se considera actualmente un régimen alternativo.","La rifampicina diaria durante 4 meses presenta similar eficacia que el régimen prioritario y es menos tóxica; su eficacia no está probada en pacientes VIH.","La pauta de isoniacida + rifampicina diaria durante 3 meses se considera el régimen prioritario y está aceptada en pacientes VIH.","La pauta de 9 meses de administración semanal de isoniacida + rifapentina se considera actualmente el régimen prioritario."],"c":"D","e":"La pauta de isoniacida más rifapentina semanal prioritaria dura habitualmente 3 MESES (12 dosis semanales), no 9; los 9 meses corresponden a la pauta clásica de isoniacida diaria en monoterapia, considerada actualmente régimen alternativo, no prioritario."},{"q":"¿Cuál es el subtipo de VIH-1 responsable de la mayoría de las infecciones por VIH a nivel mundial?","o":["Subtipo B.","Subtipo C.","Subtipo A.","CRF02_AG."],"c":"B","e":"El subtipo C es el responsable de la mayoría de las infecciones por VIH-1 a nivel mundial, predominando especialmente en África subsahariana y en amplias zonas de Asia; el subtipo B, aunque más estudiado históricamente, predomina en Europa occidental y Norteamérica pero representa una minoría a nivel global."},{"q":"¿Qué afirmación es cierta respecto a la relación entre carga viral indetectable y transmisión del VIH?","o":["No existe relación entre carga viral y transmisión.","La transmisión es probable incluso con carga viral indetectable.","La carga viral indetectable reduce la transmisión, pero no la elimina.","Carga viral indetectable significa que no hay riesgo de transmisión sexual (U=U)."],"c":"D","e":"El principio «indetectable = intransmisible» (U=U), avalado por múltiples estudios prospectivos con miles de parejas serodiscordantes, establece que una persona con carga viral plasmática indetectable mantenida no transmite el VIH por vía sexual, un mensaje clave en salud pública y para reducir el estigma asociado a la infección."},{"q":"¿Cuándo se recomienda iniciar el tratamiento antirretroviral en pacientes con infección por VIH?","o":["Solo cuando el recuento de CD4+ cae por debajo de 200 células/µl.","Inmediatamente después del diagnóstico, independientemente del recuento de CD4+.","Cuando aparecen síntomas clínicos de sida.","Después de una infección oportunista."],"c":"B","e":"La recomendación actual (estrategia «test and treat») es iniciar el tratamiento antirretroviral tan pronto como sea posible tras el diagnóstico, independientemente de la cifra de CD4, dado que reduce la morbimortalidad, previene el desarrollo de infecciones oportunistas y disminuye la transmisión."},{"q":"En un paciente con resistencia farmacológica comprobada a varios antirretrovirales, ¿cuál es la estrategia recomendada?","o":["Monoterapia con un fármaco nuevo.","Combinación de al menos dos fármacos activos, preferiblemente nuevos.","Suspender el tratamiento temporalmente.","Cambiar solo uno de los fármacos del régimen actual."],"c":"B","e":"Ante fracaso virológico con resistencia documentada, la estrategia recomendada es construir un nuevo régimen con al menos dos (idealmente más) fármacos con actividad demostrada, nunca monoterapia funcional ni el cambio aislado de un único fármaco, para evitar seleccionar resistencias adicionales."},{"q":"Respecto a la primoinfección por VIH, indique la opción CORRECTA:","o":["Los síntomas pueden aparecer años después de un contacto directo.","La leche materna no transmite la enfermedad de madre a hijo.","Los síntomas aparecen aproximadamente dos semanas tras el contagio y se manifiestan como un cuadro viral agudo o mononucleósico.","Durante la primoinfección aún no se producen alteraciones de la inmunidad celular propias de la fase crónica."],"c":"C","e":"El síndrome retroviral agudo se manifiesta típicamente entre 2 y 4 semanas tras el contagio, como un cuadro pseudogripal o mononucleósico (fiebre, faringitis, adenopatías, exantema); la leche materna SÍ es una vía de transmisión reconocida de madre a hijo, y durante la primoinfección ya se producen alteraciones inmunológicas significativas (depleción de linfocitos CD4 de memoria en tejido linfoide intestinal, entre otras)."},{"q":"Varón de 28 años diagnosticado de infección por VIH, asintomático, con recuento de CD4 de 150/µl. Todos los siguientes son regímenes aprobados para la profilaxis primaria frente a P. jirovecii, EXCEPTO:","o":["Pentamidina en aerosol 300 mg cada mes.","Trimetoprim-sulfametoxazol, 1 comprimido vía oral.","Clindamicina 900 mg vía oral más primaquina 30 mg vía oral al día.","Dapsona 100 mg al día."],"c":"C","e":"La combinación de clindamicina más primaquina es una pauta de tratamiento (o profilaxis secundaria en casos concretos), no un régimen aprobado como profilaxis PRIMARIA estándar de la neumonía por P. jirovecii; trimetoprim-sulfametoxazol es el fármaco de elección, con dapsona y pentamidina en aerosol como alternativas reconocidas."},{"q":"En cuanto al tratamiento de la infección por VIH, ¿cuál de las siguientes afirmaciones es FALSA?","o":["El objetivo del tratamiento es la supresión máxima de la replicación viral.","Las mujeres deben recibir tratamiento óptimo sin importar su estado de gestación.","Una vez que se alcanza la supresión virológica, se puede suspender el tratamiento.","El tratamiento antirretroviral se usa también en profilaxis postexposición."],"c":"C","e":"El tratamiento antirretroviral debe mantenerse de por vida una vez iniciado: la supresión virológica no equivale a curación, y la suspensión del tratamiento conlleva un rebote virológico prácticamente constante con el consiguiente riesgo inmunológico y de transmisión."},{"q":"Respecto a Mycobacterium avium complex, NO es cierto que:","o":["El organismo produce enfermedad diseminada principalmente con CD4 \\<100 células/mm³.","El organismo es transmisible de humano a humano.","Puede causar linfadenitis en niños de 1 a 5 años.","Algunas colonias pueden presentar un pigmento amarillento con el tiempo."],"c":"B","e":"Mycobacterium avium complex se adquiere del ambiente (agua, suelo, alimentos), no se transmite de persona a persona, a diferencia de M. tuberculosis; el resto de afirmaciones (enfermedad diseminada en inmunosupresión avanzada, linfadenitis infantil, pigmentación variable de las colonias) son correctas."},{"q":"¿Qué es incorrecto en relación a la neumonía por Pneumocystis jirovecii en pacientes con infección por VIH?","o":["Los síntomas más frecuentes son tos no productiva, disnea y fiebre.","La radiografía de tórax puede ser inicialmente normal.","La prueba diagnóstica más rentable es el lavado broncoalveolar mediante broncoscopia.","No deben usarse esteroides en casos graves por el riesgo de agravar la inmunosupresión."],"c":"D","e":"En la neumonía por P. jirovecii con criterios de gravedad (PaO2 \\<70 mmHg o gradiente alveoloarterial \\>35 mmHg respirando aire ambiente), los corticoides adyuvantes SÍ están indicados y han demostrado reducir la mortalidad y el deterioro respiratorio precoz asociado al inicio del tratamiento antimicrobiano, al atenuar la respuesta inflamatoria."},{"q":"¿Cuál de las siguientes vías de transmisión del VIH es la más común a nivel mundial?","o":["Contacto sexual sin protección.","Transfusión sanguínea.","Uso compartido de agujas contaminadas.","Transmisión vertical."],"c":"A","e":"El contacto sexual sin protección es, con diferencia, la vía de transmisión más frecuente del VIH a nivel mundial, muy por delante de la transmisión parenteral (agujas compartidas), la transfusional (prácticamente eliminada con el cribado sistemático) o la vertical."},{"q":"¿Cuál de los siguientes síntomas es característico de la etapa temprana (primoinfección) de la infección por VIH?","o":["Fiebre persistente.","Pérdida de peso inexplicada.","Fatiga crónica.","Todos los anteriores."],"c":"D","e":"El síndrome retroviral agudo puede cursar con un espectro amplio e inespecífico de síntomas ---fiebre, astenia/fatiga, pérdida de peso, adenopatías, exantema, faringitis---, por lo que la respuesta que engloba todos ellos es la más completa."},{"q":"¿Cuál de las siguientes opciones NO es una forma de prevenir la transmisión del VIH?","o":["Uso de preservativos durante las relaciones sexuales.","Profilaxis preexposición (PrEP).","Vacunación.","Uso de agujas y jeringas estériles."],"c":"C","e":"Actualmente no existe una vacuna eficaz aprobada frente al VIH, a diferencia del resto de medidas (preservativo, PrEP, material de inyección estéril), que sí son estrategias de prevención validadas y ampliamente utilizadas."},{"q":"Mujer que consulta por haber sufrido una agresión sexual hace 3 horas. En cuanto a la profilaxis postexposición al VIH, señale la respuesta INCORRECTA:","o":["La duración debe ser de 28 días.","Debe hacerse serología frente al VIH al inicio y al terminar la profilaxis.","La evidencia de la utilidad de este tratamiento no está basada en ensayos clínicos aleatorizados.","El tratamiento consiste únicamente en tenofovir y emtricitabina."],"c":"D","e":"La pauta actual de profilaxis postexposición al VIH consiste en TRIPLE terapia (tenofovir/emtricitabina asociados a un tercer fármaco, habitualmente un inhibidor de la integrasa como dolutegravir), no en la doble combinación de tenofovir y emtricitabina en monoterapia dual, que sería insuficiente."},{"q":"La profilaxis primaria para la infección por Pneumocystis jirovecii se recomienda en pacientes con:","o":["VIH con recuento de CD4 inferior a 200 células/mm³.","VIH con recuento de CD4 inferior a 300 células/mm³.","Aplasia medular tras quimioterapia por adenocarcinoma de pulmón.","Enfermedad renal crónica en hemodiálisis."],"c":"A","e":"El umbral clásico para iniciar profilaxis primaria de la neumonía por Pneumocystis jirovecii en pacientes con VIH es un recuento de CD4 inferior a 200 células/mm³, momento a partir del cual el riesgo de esta infección oportunista aumenta significativamente."}]},"17":{"title":"Infecciones parasitarias prevalentes. Leishmaniasis. Infecciones importadas.","questions":[{"q":"En la tríada del síndrome esplenohepatoganglionar de la leishmaniasis visceral (kala-azar), NO se incluye:","o":["Bicitopenia, anemia y leucopenia que evoluciona a pancitopenia.","Fiebre elevada y anárquica, con varios picos febriles en el mismo día.","Eritema migratorio.","Esplenomegalia."],"c":"C","e":"El eritema migratorio (o eritema crónico migrans) es la lesión cutánea característica de la fase precoz de la enfermedad de Lyme, no de la leishmaniasis visceral, que se caracteriza por fiebre irregular, pancitopenia progresiva y hepatoesplenomegalia marcada."},{"q":"Varón de 17 años, natural de Mali, residente en España 6 meses, con hematuria terminal de un mes, disuria y polaquiuria. Sistemático de orina: hematuria intensa, leucocituria, ligera proteinuria y presencia de parásitos. Señale la opción CORRECTA:","o":["Esquistosomiasis - praziquantel.","Fasciolasis - triclabendazol.","Oncocercosis - ivermectina.","Ascaridiasis - albendazol."],"c":"A","e":"La hematuria terminal en un paciente joven procedente de África subsahariana es muy característica de la esquistosomiasis urinaria por Schistosoma haematobium; el tratamiento de elección es el praziquantel."},{"q":"En cuanto a la clínica de la enfermedad de Chagas, señale la respuesta VERDADERA:","o":["El chagoma es típico de la fase indeterminada.","El signo de Romaña es típico de la fase crónica.","El tratamiento revierte las lesiones establecidas en fase crónica, especialmente las cardiacas y digestivas.","Es posible el contagio congénito de la enfermedad de Chagas en hijos de madres infectadas residentes fuera de zona endémica, sin viaje personal a América Latina."],"c":"D","e":"La transmisión vertical (congénita) de la enfermedad de Chagas es posible en cualquier lugar del mundo si la madre está infectada, independientemente de que el hijo nunca haya viajado a zona endémica, por lo que debe cribarse a los hijos de madres seropositivas nacidas fuera de dicha zona. El chagoma y el signo de Romaña son manifestaciones de la fase AGUDA (no indeterminada ni crónica), y el tratamiento tripanocida en fase crónica establecida no revierte las lesiones orgánicas ya instauradas, solo puede frenar la progresión."},{"q":"Un paciente de 40 años diagnosticado de infección por VIH hace 10 años, sin tratamiento antirretroviral, con candidiasis esofágica y cuadro de 10 días de cefalea, fiebre, vómitos y disminución del nivel de conciencia en las últimas 24h. TAC craneal normal; LCR con presión de apertura elevada, sin células, proteínas 300 mg/dl. El cuadro es compatible con:","o":["Meningitis tuberculosa.","Meningitis criptocócica.","Toxoplasmosis cerebral.","Hidrocefalia."],"c":"B","e":"El patrón de LCR paucicelular con presión de apertura muy elevada e hiperproteinorraquia, en un paciente con inmunosupresión avanzada por VIH, es muy característico de la meningitis criptocócica, a diferencia de la toxoplasmosis cerebral (que cursa con lesiones ocupantes focales, no meningitis pura) o la meningitis tuberculosa (habitualmente con pleocitosis linfocitaria)."},{"q":"¿Cuál es la enfermedad transmitida por la picadura del mosquito Anopheles?","o":["Amebiasis.","Paludismo (malaria).","Leishmaniasis.","Toxoplasmosis."],"c":"B","e":"El mosquito Anopheles hembra es el vector del paludismo, al transmitir los esporozoítos de Plasmodium spp. durante la picadura."},{"q":"La leishmaniasis es transmitida por:","o":["Flebotomos (mosquitos de la familia Phlebotomidae).","Garrapatas.","Pulgas.","Moscas comunes."],"c":"A","e":"La leishmaniasis se transmite por la picadura de flebotomos (mosquitos pequeños de la familia Phlebotomidae, géneros Phlebotomus en el Viejo Mundo y Lutzomyia en el Nuevo Mundo), que actúan como vector del parásito Leishmania."},{"q":"La filariasis linfática es transmitida por la picadura de:","o":["Mosquitos del género Anopheles.","Mosquitos del género Aedes (entre otros culícidos).","Garrapatas.","Flebotomos."],"c":"B","e":"La filariasis linfática (por Wuchereria bancrofti, entre otras especies) se transmite por la picadura de diversos mosquitos culícidos, incluidos géneros como Aedes, Culex y Anopheles según la región geográfica."},{"q":"La esquistosomiasis es transmitida por:","o":["Mosquitos del género Anopheles.","Mosquitos del género Aedes.","Garrapatas.","Caracoles de agua dulce."],"c":"D","e":"Los caracoles de agua dulce actúan como hospedador intermediario obligado del ciclo vital de Schistosoma spp., liberando las cercarias infectantes al agua, que penetran directamente a través de la piel humana al contacto con aguas contaminadas."},{"q":"¿Cuál de los siguientes protozoos es el agente causante de la enfermedad de Chagas?","o":["Trypanosoma brucei.","Trypanosoma cruzi.","Leishmania spp.","Plasmodium spp."],"c":"B","e":"Trypanosoma cruzi es el protozoo causante de la enfermedad de Chagas (tripanosomiasis americana), transmitido clásicamente por triatominos («vinchucas») en zonas endémicas de Latinoamérica, y también por vía congénita, transfusional o trasplante."},{"q":"¿Cuál de las siguientes infecciones protozoarias se caracteriza por la presencia de quistes en heces y puede transmitirse a través de agua contaminada?","o":["Malaria.","Amebiasis.","Giardiasis.","Leishmaniasis."],"c":"C","e":"Giardia lamblia se transmite por la ingesta de quistes presentes en agua o alimentos contaminados, siendo una de las causas más frecuentes de diarrea parasitaria de transmisión hídrica en todo el mundo, incluidos viajeros a zonas de saneamiento deficiente."}]},"18":{"title":"Infecciones en el paciente inmunodeprimido.","questions":[{"q":"Señale cuál de los siguientes criterios NO está incluido en la escala CISNE (Índice Clínico de riesgo en Neutropenia Febril Estable):","o":["Neutrófilos \\>200/µl.","Hiperglucemia inducida por estrés.","EPOC.","Grado de mucositis ≥2."],"c":"A","e":"La escala CISNE valora factores como el estado funcional (ECOG), la presencia de EPOC, la cardiopatía crónica, la mucositis grado ≥2, la monocitosis \\<200/µl y la hiperglucemia de estrés, entre otros, para estratificar el riesgo de complicaciones en la neutropenia febril de apariencia estable; la cifra absoluta de neutrófilos (\\>200/µl) no es un ítem explícitamente incluido en esta escala."},{"q":"Señale la afirmación INCORRECTA sobre los abscesos cerebrales en pacientes inmunodeprimidos:","o":["Ante abscesos cerebrales múltiples hay que pensar en propagación hematógena.","Los abscesos cerebrales múltiples a menudo son de etiología monomicrobiana.","En un paciente diabético o inmunodeprimido con lesión ocupante de espacio sugestiva de absceso se recomienda una Rx de tórax, cuyos hallazgos podrían orientar a Nocardia spp.","En rombencefalitis con absceso cerebral subcortical, Listeria spp. no debe considerarse en pacientes inmunocompetentes no gestantes."],"c":"B","e":"Los abscesos cerebrales múltiples, especialmente los de origen hematógeno, son con frecuencia POLIMICROBIANOS, no monomicrobianos; el resto de afirmaciones sobre la propagación hematógena, la búsqueda de un foco pulmonar por Nocardia y la relevancia de Listeria en gestantes/inmunodeprimidos son correctas."},{"q":"¿Cuáles de las siguientes situaciones NO es una indicación de quimioprofilaxis de la tuberculosis en un contacto de caso bacilífero?","o":["Menores de 35 años con prueba de tuberculina negativa y contacto reciente con bacilífero.","Menores de 35 años con prueba de tuberculina positiva y contacto con bacilífero.","Candidatos a tratamiento con anticuerpos monoclonales anti-TNF-alfa con tuberculina negativa.","Pacientes inmunodeprimidos de cualquier edad con tuberculina negativa y contacto con bacilífero."],"c":"A","e":"Ante un contacto reciente con un caso bacilífero y Mantoux inicialmente negativo en un paciente joven sin inmunosupresión, la actitud habitual es la profilaxis «en ventana» temporal hasta repetir la prueba semanas después (y no una quimioprofilaxis definitiva sin conversión confirmada), lo que la distingue de las otras situaciones (Mantoux ya positivo, candidatos a anti-TNF, o inmunodeprimidos de cualquier edad con contacto), donde la indicación de profilaxis es más clara e inmediata dado el mayor riesgo de progresión."},{"q":"En la tinción de Gram del LCR de un paciente inmunodeprimido con sospecha de meningitis, se observan abundantes polimorfonucleares y escasos bacilos grampositivos de pequeño tamaño. ¿Qué microorganismo es el responsable más probable?","o":["Neisseria meningitidis.","Haemophilus influenzae.","Streptococcus agalactiae.","Listeria monocytogenes."],"c":"D","e":"La descripción de bacilos grampositivos pequeños y escasos en el LCR de un paciente inmunodeprimido es muy característica de Listeria monocytogenes, un patógeno típico de este grupo de pacientes junto con ancianos y gestantes."}]},"19":{"title":"Infecciones nosocomiales.","questions":[{"q":"Señale la respuesta CORRECTA respecto al diagnóstico de la bacteriemia relacionada con catéter:","o":["El exudado del punto de inserción junto con un hemocultivo positivo son por sí solos diagnósticos de bacteriemia de catéter.","Los estafilococos coagulasa negativos y otros colonizadores ambientales pueden no tener significación clínica pese a un hemocultivo positivo.","Se recomienda cultivar la parte proximal del catéter por su mayor rentabilidad diagnóstica.","Un tiempo de crecimiento 1,5 horas más rápido en el hemocultivo del catéter respecto al de venopunción es diagnóstico de bacteriemia de catéter."],"c":"B","e":"Los estafilococos coagulasa negativos son contaminantes muy frecuentes de los hemocultivos, por lo que su aislamiento, sobre todo en una única muestra, puede no tener significación clínica real y requiere valoración conjunta con el contexto clínico; el segmento con mayor rentabilidad diagnóstica es la PUNTA (distal) del catéter, no la proximal, y el criterio del tiempo diferencial de positividad (DTP) diagnóstico es de al menos 2 horas, no 1,5."},{"q":"Una de las siguientes proposiciones en relación con las meningitis bacterianas es FALSA. Señálela:","o":["Los bacilos gramnegativos y estafilococos suelen ser la causa de la meningitis nosocomial.","La única vía de penetración de las meningitis bacterianas es la hematógena.","En la anatomía patológica, el infiltrado de las leptomeninges es de polimorfonucleares.","La fiebre es el signo más frecuente."],"c":"B","e":"La vía de penetración NO es exclusivamente hematógena: en el contexto nosocomial son especialmente relevantes la vía iatrogénica (tras neurocirugía, colocación de derivaciones de LCR, punción lumbar) y la propagación por contigüidad, además de la hematógena."},{"q":"Acinetobacter baumannii, microorganismo asociado a infección nosocomial, se caracteriza por:","o":["Ser un parásito obligado de células renales humanas.","Su facilidad para adquirir resistencia a los antibióticos, unida a su capacidad de generar infecciones en pacientes inmunocomprometidos.","Su facilidad para diseminarse en el hospital exclusivamente a través de las conducciones de aire.","Ser sensible a todos los antibióticos betalactámicos."],"c":"B","e":"Acinetobacter baumannii es un bacilo gramnegativo ambiental con una notable capacidad para persistir en superficies hospitalarias y adquirir multirresistencia antibiótica (incluidos carbapenémicos en muchas cepas), lo que lo convierte en un patógeno nosocomial problemático, especialmente en pacientes críticos e inmunodeprimidos; su transmisión es fundamentalmente por contacto (superficies, manos del personal), no exclusivamente aérea."},{"q":"En cuanto a la bacteriemia nosocomial, señale la opción CORRECTA:","o":["La mortalidad suele ser baja (\\<5%), con independencia del germen y la situación del paciente.","Las bacteriemias primarias (sin foco establecido o de origen en catéter vascular) suponen menos del 10% de las bacteriemias nosocomiales.","Los estafilococos coagulasa negativos son más frecuentes que Staphylococcus aureus.","Los principales agentes de las bacteriemias primarias son los bacilos gramnegativos."],"c":"C","e":"Los estafilococos coagulasa negativos (relacionados fundamentalmente con catéteres vasculares) son, de forma consistente, el grupo microbiológico más frecuentemente aislado en la bacteriemia nosocomial, por delante de S. aureus; las bacteriemias primarias/relacionadas con catéter suponen una proporción sustancial (mayor al 10%) y su etiología predominante es grampositiva, no gramnegativa."}]},"20":{"title":"Fisiopatología, diagnóstico y tratamiento del paciente con insuficiencia cardiaca.","questions":[{"q":"Es un criterio START, según la 3ª versión española de los criterios STOPP/START:","o":["Tratamiento con betabloqueantes en pacientes mayores con fibrilación auricular crónica y mal control de la frecuencia.","Tratamiento con digoxina como fármaco de primera línea para el control de la frecuencia cardiaca a largo plazo en pacientes mayores con FA.","Tratamiento con iSGLT2 en la insuficiencia cardiaca sintomática, con fracción de eyección reducida o preservada, exclusivamente en pacientes mayores diabéticos.","Tratamiento con estatinas en pacientes mayores con fragilidad grave y antecedente bien documentado de enfermedad vascular coronaria, cerebral o periférica."],"c":"D","e":"Los criterios START señalan tratamientos que deberían iniciarse si están indicados; las estatinas en prevención secundaria bien documentada, incluso en pacientes con fragilidad, siguen aportando beneficio y constituyen un criterio START reconocido, mientras que las otras opciones describen prácticas poco recomendadas (digoxina como primera línea) o restringen erróneamente los iSGLT2 solo a diabéticos en IC, cuando su indicación actual es independiente de la presencia de diabetes."},{"q":"Según las guías de la Sociedad Europea de Cardiología de 2021 de insuficiencia cardiaca, ¿cuál de las siguientes intervenciones tiene indicación de clase I en el tratamiento de la IC con fracción de eyección reducida?","o":["Uso de diuréticos si hay congestión.","Ivabradina en pacientes en ritmo sinusal y FC \\>70 lpm pese a dosis máxima de betabloqueantes.","Vericiguat para pacientes NYHA II-IV que empeoran a pesar de IECA, betabloqueante y ARM.","Implante de desfibrilador como prevención primaria en miocardiopatía dilatada no isquémica, clase funcional III."],"c":"A","e":"El uso de diuréticos para aliviar la congestión es una recomendación de clase I universal en la IC-FEr sintomática; la ivabradina y el vericiguat tienen recomendación de clase IIa (no clase I) en sus indicaciones específicas, y el implante de DAI en miocardiopatía no isquémica tiene también una recomendación de clase IIa según las guías de 2021, tras los resultados del estudio DANISH que cuestionaron el beneficio en mortalidad total en este subgrupo."},{"q":"Respecto a la constricción pericárdica, señale la FALSA:","o":["Las formas leves de constricción no se benefician de pericardiectomía.","El pericardio rígido y no distensible provoca aumento de la precarga.","El principal diagnóstico diferencial es con la miocardiopatía restrictiva.","La clínica suele ser larvada, con signos y síntomas de insuficiencia cardiaca derecha."],"c":"B","e":"El pericardio rígido y no distensible limita el llenado ventricular, lo que produce una restricción al llenado (aumento de las presiones de llenado) pero no un aumento de la precarga efectiva, ya que precisamente impide que el corazón se llene adecuadamente; el resto de afirmaciones (manejo conservador en formas leves, diagnóstico diferencial con la miocardiopatía restrictiva, clínica de fallo derecho) son correctas."},{"q":"¿Cuál de las siguientes es indicación de oxigenoterapia crónica domiciliaria?","o":["Paciente EPOC y FA con PaO2 de 58 mmHg.","Paciente EPOC con PaO2 de 65 mmHg tras una neumonía grave.","Paciente EPOC sin otros antecedentes, con PaO2 al alta de 59 mmHg.","Paciente con 5 ingresos en el último año por insuficiencia cardiaca descompensada y PaO2 de 66 mmHg al alta."],"c":"A","e":"La OCD está indicada con PaO2 ≤55 mmHg en situación estable, o entre 56-59 mmHg si coexiste poliglobulia, cor pulmonale o arritmias como la fibrilación auricular; en el resto de opciones no se cumplen estos criterios (PaO2 \\>59 sin comorbilidad asociada, o determinaciones no realizadas en situación clínica estable)."},{"q":"Según la última actualización de la SEMI para el tratamiento de la diabetes mellitus tipo 2, indique la CORRECTA:","o":["En pacientes con insuficiencia cardiaca, tanto con fracción de eyección preservada como reducida, se debe priorizar el uso de empagliflozina o dapagliflozina.","En pacientes con muy alto riesgo cardiovascular, se debe priorizar el uso de insulina basal-bolo.","En mayores de 75 años con fragilidad, se debe priorizar el uso de insulina ultralenta.","En la insuficiencia renal crónica, los iSGLT2 se deben iniciar independientemente del FGe, ya que son nefroprotectores."],"c":"A","e":"Los iSGLT2 con evidencia específica en insuficiencia cardiaca (empagliflozina, dapagliflozina) han demostrado beneficio tanto en IC con fracción de eyección reducida como preservada, por lo que se priorizan en este perfil de paciente diabético; el resto de opciones son incorrectas (la insulina no es de primera elección en muy alto riesgo CV, la fragilidad exige individualizar, y los iSGLT2 sí tienen un límite de FGe por debajo del cual no se recomienda iniciarlos)."},{"q":"Varón de 64 años con IC-FEr (FEVI 30%), NYHA II, tratado con betabloqueante, sacubitrilo/valsartán y espironolactona a dosis óptimas. Ritmo sinusal a 76 lpm, FG 42 ml/min/1,73m². Según las guías de la SEC, ¿cuál sería la opción terapéutica adicional más adecuada para reducir mortalidad y hospitalizaciones?","o":["Iniciar digoxina para control de síntomas.","Añadir ivabradina para disminuir la frecuencia cardiaca.","Añadir un inhibidor del cotransportador sodio-glucosa tipo 2 (iSGLT2).","Iniciar hierro intravenoso para mejorar la clase funcional."],"c":"C","e":"Los iSGLT2 constituyen el cuarto pilar del tratamiento de la IC-FEr (junto con IECA/ARNI, betabloqueante y ARM), con reducción demostrada de mortalidad cardiovascular y hospitalizaciones, independientemente de la presencia de diabetes; la ivabradina solo aporta beneficio en pacientes con FC ≥70 lpm pese a betabloqueante óptimo (no es el caso, 76 lpm con betabloqueante ya optimizado sería límite, pero el iSGLT2 tiene mayor evidencia de reducción de mortalidad), y la digoxina/hierro IV tienen un papel más limitado o dirigido a mejorar síntomas, no mortalidad."},{"q":"Mujer de 87 años con HTA, ingresada hace 48 horas por IAMCEST anterior. Presenta disnea; en la exploración destaca soplo sistólico con frémito irradiado al borde esternal derecho, no presente al ingreso. ¿Qué complicación sospecharía?","o":["Rotura del tabique interventricular.","Insuficiencia cardiaca por necrosis extensa.","Aneurisma anterior.","Rotura de la pared libre del ventrículo izquierdo."],"c":"A","e":"La aparición de un soplo sistólico nuevo con frémito, irradiado hacia el lado derecho del esternón (característico de un cortocircuito izquierda-derecha), en los primeros días tras un IAM anterior, es muy sugestiva de una comunicación interventricular por rotura del septo, una complicación mecánica grave típica de esta fase evolutiva del infarto."},{"q":"Señale cuál de los siguientes signos o síntomas NO es considerado criterio clínico mayor de Framingham para el diagnóstico de insuficiencia cardiaca:","o":["Disnea paroxística nocturna.","Presión venosa yugular elevada.","Cansancio.","Tercer ruido cardiaco."],"c":"C","e":"El cansancio (astenia) es un criterio MENOR de Framingham, no mayor, dada su baja especificidad; la disnea paroxística nocturna, la ingurgitación yugular y el tercer ruido cardiaco sí son criterios mayores, más específicos de insuficiencia cardiaca."},{"q":"Señale la respuesta FALSA en relación con el diagnóstico de insuficiencia cardiaca:","o":["La historia clínica y la exploración física son los pilares del diagnóstico de la IC.","Se recomienda la determinación de BNP o NT-proBNP en pacientes con sospecha de IC en quienes el diagnóstico es incierto.","La ecocardiografía es importante para evaluar estructura y función cardiaca e identificar causas de IC.","Una radiografía de tórax no es una prueba diagnóstica inicial útil para la evaluación de pacientes con disnea."],"c":"D","e":"La radiografía de tórax sí es una prueba inicial útil en la evaluación de la disnea, al aportar información sobre cardiomegalia, redistribución vascular, edema intersticial/alveolar y ayudar a descartar otras causas pulmonares de disnea, complementando la historia clínica, la exploración, los péptidos natriuréticos y la ecocardiografía."},{"q":"Señale la respuesta CORRECTA en relación con el tratamiento diurético en pacientes con insuficiencia cardiaca:","o":["La combinación de furosemida con acetazolamida intravenosa ha demostrado disminuir las rehospitalizaciones por IC frente a furosemida sola.","La combinación de furosemida con hidroclorotiazida ha demostrado disminuir las rehospitalizaciones por IC frente a furosemida sola.","Se puede plantear la interrupción del tratamiento diurético en pacientes ambulatorios estables, sin signos de congestión y con tratamiento optimizado.","La administración de furosemida en perfusión continua es más efectiva que en bolos para el control sintomático de la IC."],"c":"C","e":"En pacientes ambulatorios estables, euvolémicos y con el resto del tratamiento modificador de la enfermedad ya optimizado, puede considerarse la retirada del diurético de asa bajo estrecha vigilancia clínica; ni la combinación con acetazolamida ni con hidroclorotiazida han demostrado reducir específicamente las rehospitalizaciones frente a furosemida sola (aunque la acetazolamida sí mejora la descongestión aguda según el estudio ADVOR), y los estudios comparativos entre perfusión continua y bolos de furosemida no han mostrado diferencias claras en eficacia."},{"q":"Mujer de 70 años ingresada por neumonía en tratamiento con penicilinas, además de varios fármacos para insuficiencia cardiaca, que a los 7 días presenta malestar, náuseas y deterioro de función renal con proteinuria leve y hematuria. Señale la respuesta INCORRECTA:","o":["Probablemente sea secundario a las penicilinas, de los pocos fármacos que pueden ocasionar esta enfermedad.","El tratamiento consistiría en suspender el fármaco causante y, si procede, corticoides.","En la analítica probablemente encontremos eosinofilia.","En la biopsia renal se observaría infiltrado y edema intersticial."],"c":"A","e":"Aunque las penicilinas son causa reconocida de nefritis intersticial alérgica, son solo una entre un número muy amplio de fármacos implicados (AINE, IBP, alopurinol, otros antibióticos, diuréticos), por lo que afirmar que son «de los pocos fármacos» causantes es incorrecto."},{"q":"Varón de 75 años recién diagnosticado de cáncer de pulmón, con sodio de 124 mEq/l. ¿Qué NO le puede decir a su paciente al respecto?","o":["Que puede tener hiponatremia por SIADH o por péptido natriurético auricular ectópico.","Que tardará entre 1 y 4 semanas en resolverse una vez iniciada la quimioterapia.","Que es probable que se necesiten fármacos como demeclociclina o tolvaptán mientras hace efecto la quimioterapia.","Que no es necesario medir de entrada los niveles de péptido natriurético auricular."],"c":"D","e":"En el estudio de la hiponatremia paraneoplásica del cáncer de pulmón es razonable medir el péptido natriurético auricular, ya que en ocasiones el mecanismo no es un SIADH clásico sino una secreción ectópica de este péptido, lo que puede modificar el enfoque terapéutico; afirmar que no es necesario medirlo de entrada es, por tanto, incorrecto."},{"q":"Señale la respuesta incorrecta en cuanto a la apnea obstructiva del sueño:","o":["Los trastornos del ritmo más habituales son: bloqueo auriculoventricular, pausas sinusales y extrasístoles auriculares y ventriculares.","La hipertensión pulmonar es una enfermedad prevalente en la AOS pero generalmente es leve.","La prevalencia de insuficiencia cardiaca en la AOS es el doble que en controles sanos y es mayor en la IC con fracción de eyección reducida.","La prevalencia de síndrome metabólico en pacientes con AOS es 6-9 veces más frecuente que en la población general."],"c":"D","e":"Aunque el síndrome metabólico es efectivamente muy prevalente en la AOS, la magnitud de «6-9 veces más frecuente» constituye una sobreestimación no respaldada por la evidencia epidemiológica, siendo esta la afirmación incorrecta entre las cuatro; el resto de datos (arritmias asociadas, HTP generalmente leve, mayor prevalencia de IC especialmente con FE reducida) son correctos."},{"q":"En la hipertensión pulmonar asociada a cardiopatía izquierda (grupo 2), indique la afirmación INCORRECTA:","o":["Condiciona una hipertensión pulmonar precapilar con presión arterial media \\>20 mmHg y presión de enclavamiento \\<15 mmHg.","La cardiopatía izquierda es la causa del 65-80% de los casos de hipertensión pulmonar.","El aumento de la presión arterial pulmonar y de la resistencia vascular pulmonar se relaciona con peor pronóstico.","Incluye pacientes con IC con fracción de eyección deprimida, media y conservada, valvulopatías izquierdas, y cardiopatías congénitas o adquiridas."],"c":"A","e":"La hipertensión pulmonar del grupo 2 (por cardiopatía izquierda) es, por definición, POSTcapilar (presión de enclavamiento pulmonar \\>15 mmHg, reflejo de la elevación retrógrada de presiones desde el corazón izquierdo), no precapilar (que se define, por el contrario, con presión de enclavamiento ≤15 mmHg y es característica de la hipertensión arterial pulmonar del grupo 1)."},{"q":"En el tratamiento de la insuficiencia cardiaca con FEVI reducida, ¿qué afirmación es VERDADERA?","o":["El verapamilo y el diltiazem pueden administrarse con precaución.","La ivabradina está recomendada en pacientes sintomáticos con FC en reposo ≥70 lpm pese a tratamiento óptimo, reduciendo el riesgo de hospitalización por IC pero no la mortalidad cardiovascular.","Se puede considerar hidralazina más dinitrato de isosorbida en todos los pacientes con FEVI reducida y dilatación del VI sintomáticos, para reducir hospitalización y muerte.","La digoxina puede considerarse en pacientes sintomáticos en ritmo sinusal para reducir el riesgo de hospitalización, con efecto neutro sobre la mortalidad."],"c":"B","e":"El estudio SHIFT demostró que la ivabradina reduce las hospitalizaciones por IC en pacientes con FC ≥70 lpm en ritmo sinusal pese a tratamiento óptimo, sin un efecto significativo sobre la mortalidad cardiovascular; los antagonistas del calcio no dihidropiridínicos (verapamilo, diltiazem) están contraindicados en la IC-FEr por su efecto inotrópico negativo, y la combinación hidralazina-nitrato tiene evidencia específica sobre todo en pacientes de raza afroamericana, no en todos los pacientes de forma indiscriminada."},{"q":"En cuanto al diagnóstico de insuficiencia cardiaca, ¿qué enunciado es FALSO?","o":["Los péptidos natriuréticos tienen alto valor predictivo negativo; un NT-proBNP \\<125 pg/ml hace poco probable el diagnóstico de IC.","La RM cardiaca está recomendada para caracterizar el tejido miocárdico en sospecha de enfermedad infiltrativa, miocarditis, VI no compactado, amiloidosis, sobrecarga de hierro o hemocromatosis.","Se recomienda coronariografía invasiva frente a angio-TC para descartar enfermedad coronaria en pacientes con probabilidad pretest baja-intermedia o pruebas de estrés no concluyentes.","Se debe considerar cateterismo derecho en IC que se sospeche causada por pericarditis constrictiva, miocardiopatía restrictiva, cardiopatía congénita o estado de gasto elevado."],"c":"C","e":"En pacientes con probabilidad pretest baja-intermedia de enfermedad coronaria, se recomienda precisamente la angio-TC coronaria (no invasiva) COMO PRIMERA OPCIÓN frente a la coronariografía invasiva, reservando esta última para cuando la angio-TC no sea concluyente o la probabilidad pretest sea alta."},{"q":"Varón de 54 años con DM2 y miocardiopatía no isquémica (FEVI 30%) con congestión, que en revisión presenta FA de nuevo diagnóstico. Sin antecedente hemorrágico, función renal y hepática normales. Vive en zona rural con difícil acceso a analíticas. ¿Cuál es el mejor tratamiento siguiente?","o":["Cardioversión eléctrica urgente.","Iniciar tratamiento con dronedarona.","Iniciar tratamiento con apixabán.","Iniciar tratamiento con warfarina."],"c":"C","e":"Los anticoagulantes de acción directa como el apixabán no requieren monitorización rutinaria de laboratorio, lo que los hace especialmente adecuados en un paciente con difícil acceso a controles analíticos; además, la dronedarona está contraindicada en pacientes con IC sintomática y FEVI reducida, y no hay indicación de cardioversión eléctrica urgente sin inestabilidad hemodinámica."},{"q":"¿Qué inhibidor de la DPP-4 NO está recomendado en pacientes con insuficiencia cardiaca?","o":["Linagliptina.","Saxagliptina.","Vildagliptina.","Sitagliptina."],"c":"B","e":"La saxagliptina se ha asociado a un aumento del riesgo de hospitalización por insuficiencia cardiaca (estudio SAVOR-TIMI 53), por lo que no está recomendada en pacientes con IC, a diferencia del resto de gliptinas, que no han mostrado esta señal de alarma."},{"q":"Respecto al tratamiento de la hiponatremia, ¿cuál de las siguientes afirmaciones es FALSA?","o":["En la hiponatremia por insuficiencia cardiaca congestiva, el tratamiento inicial sería restricción de líquidos y diuréticos tiazídicos.","El objetivo en la hiponatremia aguda grave sintomática (Na \\<120 mEq/l) es un incremento de 4-6 mEq en pocas horas.","El tratamiento de elección de la hiponatremia aguda grave sintomática es la solución salina hipertónica al 3%.","En la hiponatremia leve-moderada euvolémica, un índice de Furst \\>1 predice falta de eficacia de la restricción hídrica."],"c":"A","e":"En la hiponatremia por insuficiencia cardiaca congestiva se emplean diuréticos de ASA (no tiazídicos, que pueden empeorar la hiponatremia al alterar la capacidad de dilución del túbulo distal), junto con restricción hídrica; el resto de afirmaciones sobre el manejo de la hiponatremia aguda grave y el índice de Furst son correctas."},{"q":"Indique qué entidad NO produce una insuficiencia cardiaca de alto gasto:","o":["Fístula arteriovenosa.","Tirotoxicosis.","Amiloidosis.","Beriberi."],"c":"C","e":"La amiloidosis cardiaca produce una insuficiencia cardiaca de BAJO gasto, por infiltración restrictiva del miocardio que limita el llenado ventricular, a diferencia de la fístula arteriovenosa, la tirotoxicosis y el beriberi, causas clásicas de IC de ALTO gasto."},{"q":"En un paciente con IC por cardiopatía isquémica crónica postinfarto y disfunción sistólica, ¿cuál de las siguientes NO considera una contraindicación absoluta para introducir betabloqueantes?","o":["Insuficiencia cardiaca inestable.","Enfermedad pulmonar crónica.","Bloqueo AV avanzado.","Bradicardia sintomática."],"c":"B","e":"La enfermedad pulmonar crónica (como el asma leve-moderada controlada o la EPOC) NO es una contraindicación absoluta para los betabloqueantes cardioselectivos, que pueden utilizarse con precaución y monitorización; la IC inestable, el bloqueo AV avanzado sin marcapasos y la bradicardia sintomática sí son contraindicaciones absolutas para iniciar betabloqueantes."},{"q":"En relación a la insuficiencia cardiaca, señale la afirmación INCORRECTA:","o":["Se asocia a una elevada mortalidad, habiéndose descrito que es más letal que el cáncer en algunas series.","Constituye la primera causa de ingreso hospitalario en el mundo occidental.","Para su diagnóstico no existe un criterio único, siendo necesaria la presencia de síntomas y signos.","Se debe realizar una analítica, teniendo alto valor predictivo negativo una troponina normal."],"c":"D","e":"Es el péptido natriurético (BNP/NT-proBNP), no la troponina, el biomarcador con alto valor predictivo negativo utilizado para descartar insuficiencia cardiaca ante sospecha clínica; la troponina puede estar elevada en la IC pero no es la prueba de referencia para su diagnóstico o exclusión."},{"q":"El diagnóstico de déficit funcional de hierro en la insuficiencia cardiaca se establece en una de las siguientes circunstancias:","o":["Ferritina entre 100-300 ng/ml e índice de saturación de transferrina \\<20%.","Ferritina entre 100-300 ng/ml e índice de saturación de transferrina \\>20%.","Ferritina entre 100 y 200 ng/ml e índice de saturación de transferrina \\<20%.","Ferritina entre 100 y 200 ng/ml e índice de saturación de transferrina \\>20%."],"c":"A","e":"El déficit funcional de hierro en la IC (hierro insuficiente para las necesidades pese a depósitos aparentemente normales o límite) se define por una ferritina entre 100-300
