ndencia hemorrágica que a hipercoagulabilidad)."},{"q":"Un paciente con insuficiencia renal moderada presenta una hiperpotasemia desmedida respecto al grado de disfunción renal. ¿A qué será debido probablemente?","o":["Hiperreninismo con hiperaldosteronismo.","Hiporreninismo con hipoaldosteronismo.","Hiporreninismo con hiperaldosteronismo.","Hiperreninismo con hipoaldosteronismo."],"c":"B","e":"El síndrome de hiporreninismo-hipoaldosteronismo (acidosis tubular renal tipo IV), típico de la nefropatía diabética y de la nefroesclerosis, produce una hiperpotasemia desproporcionada al grado de insuficiencia renal, por el déficit relativo de aldosterona que limita la excreción distal de potasio."}]},"31":{"title":"Alteraciones del metabolismo del sodio y potasio.","questions":[{"q":"La asociación de alteraciones metabólicas más característica en la insuficiencia renal crónica en estadios avanzados es:","o":["Hiperpotasemia, hipofosforemia, hipercalcemia y acidosis metabólica.","Hipopotasemia, hipofosforemia, hipocalcemia y acidosis metabólica.","Hiperpotasemia, hiperfosforemia, hipocalcemia y acidosis metabólica.","Hiperpotasemia, hiperfosforemia, hipocalcemia y alcalosis metabólica."],"c":"C","e":"En la ERC avanzada, la reducción del filtrado glomerular condiciona retención de potasio y fósforo (hiperpotasemia, hiperfosforemia), junto con hipocalcemia (por déficit de vitamina D activa y quelación por el fósforo elevado) y acidosis metabólica (por menor excreción de ácidos y menor síntesis de amonio), el patrón clásico de la uremia crónica."},{"q":"Señale cuál de las siguientes afirmaciones referentes al síndrome de secreción inadecuada de ADH (SIADH) es FALSA:","o":["La paroxetina y la sertralina deben usarse con precaución por ser causantes de SIADH.","La restricción hídrica es el pilar del tratamiento.","La causa más frecuente es la hereditaria, por mutaciones en el receptor V2 de vasopresina.","Los vaptanes se usan en el SIADH refractario."],"c":"C","e":"Las formas hereditarias por mutación del receptor V2 (SIADH nefrogénico congénito) son excepcionalmente raras; las causas más frecuentes del SIADH en la práctica clínica son los tumores (especialmente el carcinoma microcítico de pulmón), las enfermedades del sistema nervioso central, las patologías pulmonares y los fármacos (entre ellos, los ISRS como paroxetina y sertralina)."},{"q":"Con respecto a la insuficiencia suprarrenal crónica primaria (enfermedad de Addison), señale la FALSA:","o":["Los procesos más frecuentes que la causan son los autoinmunitarios y la tuberculosis.","Es característico encontrar astenia, hipotensión, hiperpigmentación cutánea, hipernatremia e hipopotasemia.","La determinación de ACTH y cortisol a primera hora de la mañana permite el diagnóstico en la mayoría de los pacientes.","El tratamiento debe iniciarse con hidrocortisona."],"c":"B","e":"El patrón característico de la enfermedad de Addison es justo el contrario al descrito: HIPOnatremia (no hipernatremia) e HIPERpotasemia, por el déficit combinado de cortisol y aldosterona; la hiperpigmentación, la astenia y la hipotensión sí son manifestaciones típicas."},{"q":"Indique qué entidad clínica de las siguientes se manifiesta con hiponatremia:","o":["Enfermedad de Addison.","Síndrome de Sheehan (panhipopituitarismo posparto).","Ingesta crónica y elevada de cerveza («potomanía de cerveza»).","Todas son ciertas."],"c":"D","e":"Las tres entidades pueden cursar con hiponatremia por mecanismos distintos: la enfermedad de Addison por déficit de aldosterona y cortisol, el síndrome de Sheehan por hipocortisolismo secundario (con capacidad de dilución renal alterada), y la potomanía de cerveza por baja ingesta de solutos junto con sobrecarga hídrica que supera la capacidad excretora renal de agua libre."},{"q":"Marque el hallazgo de laboratorio más frecuente en la insuficiencia suprarrenal:","o":["Hiperpotasemia.","Hipoglucemia.","Hiponatremia.","Anemia."],"c":"C","e":"La hiponatremia es la alteración analítica más frecuente en la insuficiencia suprarrenal (tanto primaria como secundaria), presente en la gran mayoría de los pacientes, por delante de la hiperpotasemia (que solo aparece en la insuficiencia suprarrenal primaria, por el déficit de aldosterona) y de la hipoglucemia."},{"q":"En la nefritis intersticial crónica, señale cuál de estas alteraciones metabólicas NO suele ser causa de esta enfermedad:","o":["Hipercalcemia crónica.","Hiperpotasemia crónica.","Hiperuricemia crónica.","Hiperoxaluria primaria y secundaria."],"c":"B","e":"La hipercalcemia crónica, la hiperuricemia crónica (nefropatía gotosa) y la hiperoxaluria son causas metabólicas bien reconocidas de nefritis tubulointersticial crónica; la hiperpotasemia crónica, en cambio, no se describe como causa de esta entidad (más bien puede ser una consecuencia de la afectación tubular avanzada)."},{"q":"Varón de 65 años con cirrosis hepática, en tratamiento con enalapril y espironolactona, que presenta astenia y debilidad muscular severa, TA 100/57. ECG con ondas T picudas, extrasístoles ventriculares y QT corto. ¿Cuál es el diagnóstico más probable?","o":["Hipernatremia.","Hipocalcemia.","Hiperpotasemia.","Hipomagnesemia."],"c":"C","e":"La combinación de un IECA con un diurético ahorrador de potasio (espironolactona) es una causa clásica de hiperpotasemia, cuyos signos electrocardiográficos característicos son precisamente las ondas T picudas y el acortamiento del QT, con riesgo de arritmias ventriculares graves."},{"q":"La hiponatremia es la alteración hidroelectrolítica más frecuente en la práctica clínica. ¿Cuál de las siguientes NO es causa de hiponatremia con HIPOVOLEMIA?","o":["Tratamiento diurético.","Secreción inadecuada de ADH (SIADH).","Insuficiencia mineralcorticoide.","Pérdidas digestivas/pancreatitis (tercer espacio)."],"c":"B","e":"El SIADH es la causa por excelencia de hiponatremia EUVOLÉMICA (no hipovolémica), ya que el exceso de ADH retiene agua libre sin producir depleción de volumen extracelular clínicamente evidente; el tratamiento diurético, la insuficiencia mineralcorticoide (Addison) y las pérdidas digestivas/tercer espacio (como en la pancreatitis) sí son causas típicas de hiponatremia hipovolémica."},{"q":"Respecto al tratamiento de la hiponatremia, ¿cuál de las siguientes afirmaciones es FALSA?","o":["En la hiponatremia por insuficiencia cardiaca congestiva, el tratamiento inicial sería restricción de líquidos y diuréticos tiazídicos.","El objetivo en la hiponatremia aguda grave sintomática es un incremento de sodio de 4-6 mEq en pocas horas.","El tratamiento de elección de la hiponatremia aguda grave sintomática es la solución salina hipertónica al 3%.","En la hiponatremia leve-moderada euvolémica, un índice de Furst \\>1 predice falta de eficacia de la restricción hídrica."],"c":"A","e":"En la hiponatremia por insuficiencia cardiaca congestiva se emplean diuréticos de ASA (no tiazídicos, que pueden empeorar la hiponatremia al alterar la capacidad de dilución del túbulo distal), junto con restricción hídrica; el resto de afirmaciones sobre el manejo de la hiponatremia aguda grave y el índice de Furst son correctas."},{"q":"El poliestireno sulfonato cálcico (Resincalcio) se usa para el tratamiento de la hiperpotasemia. ¿Cuál de los siguientes NO se encuentra entre sus posibles efectos secundarios?","o":["Estreñimiento.","Hipocalcemia.","Hipopotasemia (por sobrecorrección).","Isquemia y necrosis intestinal."],"c":"B","e":"La formulación CÁLCICA de esta resina de intercambio catiónico libera calcio al intercambiarlo por potasio, por lo que su efecto adverso relacionado con el calcio esperable sería hipercalcemia, no hipocalcemia (que sí puede verse con la formulación sódica, que además puede unir calcio); estreñimiento, hipopotasemia por exceso de efecto e isquemia/necrosis intestinal (efecto adverso grave, aunque infrecuente) sí son riesgos reconocidos."},{"q":"Señale la respuesta FALSA en la insuficiencia suprarrenal:","o":["La hiponatremia es una característica bioquímica identificada con elevada frecuencia.","La insuficiencia suprarrenal aguda puede imitar un abdomen agudo (dolor, náuseas, vómitos, fiebre).","La prueba corta de cosintropina (ACTH) es segura y fiable, con buen valor predictivo.","Es imprescindible añadir DHEA en todos los casos, junto con la hidrocortisona."],"c":"D","e":"El tratamiento sustitutivo con DHEA es opcional e individualizado (se valora sobre todo en mujeres con síntomas de déficit androgénico persistentes pese al tratamiento glucocorticoide/mineralocorticoide adecuado), no un componente obligatorio del tratamiento estándar de la insuficiencia suprarrenal en todos los pacientes."},{"q":"Indique la complicación neurológica que puede suceder tras la corrección demasiado rápida de una hiponatremia:","o":["Hemorragia intraventricular.","Hemorragia subdural.","Mielinólisis pontina (síndrome de desmielinización osmótica).","Hemorragia intraparenquimatosa."],"c":"C","e":"La corrección excesivamente rápida de la hiponatremia crónica (más de 8-10 mEq/l en 24 horas) puede desencadenar un síndrome de desmielinización osmótica, clásicamente centrado en la protuberancia (mielinólisis pontina), con clínica neurológica grave y potencialmente irreversible, lo que obliga a corregir la natremia de forma controlada y gradual."},{"q":"¿Cuál de estos enunciados es FALSO respecto a la encefalopatía por hiponatremia?","o":["El grado (la cifra) de hiponatremia es el factor más importante en el desarrollo de la encefalopatía.","La clínica se debe al desarrollo de edema cerebral.","La corrección demasiado rápida de la hiponatremia puede ocasionar mielinólisis central pontina.","Puede aparecer delirio, estupor, coma y convulsiones."],"c":"A","e":"Más determinante que la cifra absoluta de sodio es la VELOCIDAD de instauración: una hiponatremia aguda, aunque no sea extrema, puede producir encefalopatía grave por edema cerebral citotóxico (al no dar tiempo a la adaptación osmótica), mientras que una hiponatremia crónica muy adaptada puede cursar con cifras similares y ser prácticamente asintomática."},{"q":"Paciente con SIDA que, tras iniciar ketoconazol por una micosis sistémica, presenta dolor abdominal e hipotensión, con hiponatremia franca e hiperpotasemia. ¿Qué entidad se debe sospechar?","o":["Shock anafiláctico.","Shock séptico.","Hiperaldosteronismo.","Insuficiencia suprarrenal."],"c":"D","e":"El ketoconazol inhibe la síntesis de esteroides suprarrenales (bloquea varias enzimas del citocromo P450 esteroidogénico) y puede precipitar o desenmascarar una insuficiencia suprarrenal aguda, especialmente en pacientes con reserva suprarrenal ya comprometida (como ocurre con frecuencia en el VIH avanzado), presentándose con hipotensión, dolor abdominal, hiponatremia e hiperpotasemia."},{"q":"Las siguientes son características del síndrome de Conn (hiperaldosteronismo primario), EXCEPTO:","o":["Alcalosis metabólica.","Hiperpotasemia.","Calambres musculares.","Hipertensión arterial sistémica, a veces grave."],"c":"B","e":"El exceso de aldosterona provoca pérdida renal de potasio, produciendo característicamente HIPOpotasemia (no hiperpotasemia), junto con alcalosis metabólica (por el intercambio de potasio por hidrogeniones), calambres musculares por la hipopotasemia e hipertensión arterial, a veces grave y resistente al tratamiento."},{"q":"Mujer de 65 años con hipotiroidismo primario que, pocos días después de iniciar levotiroxina 150 mcg/día, presenta hipotensión, náuseas, vómitos, hiponatremia e hiperpotasemia. ¿Qué ha podido suceder?","o":["Coma mixedematoso.","Shock anafiláctico.","Secreción inadecuada de ADH secundaria al tratamiento.","Insuficiencia suprarrenal desenmascarada por el tratamiento con levotiroxina."],"c":"D","e":"La levotiroxina acelera el metabolismo y aclaramiento del cortisol; en un paciente con insuficiencia suprarrenal subclínica no diagnosticada (p. ej. en el contexto de una poliendocrinopatía autoinmune), iniciar levotiroxina sin cobertura glucocorticoidea previa puede precipitar una crisis addisoniana, con hipotensión, hiponatremia e hiperpotasemia como en este caso; por ello, ante sospecha de panhipopituitarismo o insuficiencia suprarrenal concomitante, siempre debe descartarse y tratarse esta última ANTES de iniciar la hormona tiroidea."}]},"32":{"title":"Enfermedad glomerular y síndrome nefrótico. Enfermedad tubular renal.","questions":[{"q":"Varón de 17 años, natural de Mali, con hematuria terminal de un mes, disuria y polaquiuria; sistemático de orina con hematuria intensa, leucocituria, ligera proteinuria y parásitos. Señale la opción CORRECTA:","o":["Esquistosomiasis - Praziquantel.","Fasciolasis - Triclabendazol.","Oncocercosis - Ivermectina.","Ascaridiasis - Albendazol."],"c":"A","e":"La hematuria terminal en un paciente joven procedente de África subsahariana es muy característica de la esquistosomiasis urinaria por Schistosoma haematobium, cuya afectación vesical produce cistitis hematúrica crónica; el tratamiento de elección es el praziquantel."},{"q":"¿Cuál de los siguientes NO espera encontrar en un paciente con síndrome nefrótico?","o":["Hipoproteinemia e hipoalbuminemia.","Proteinuria \\>3,5 g/día.","Las trombosis arteriales predominan sobre las venosas como complicación.","Hiperlipemia."],"c":"C","e":"En el síndrome nefrótico, el estado de hipercoagulabilidad (por pérdida urinaria de anticoagulantes naturales como la antitrombina III, junto con otros factores) favorece predominantemente las trombosis VENOSAS (especialmente la trombosis de la vena renal), no las arteriales, al contrario de lo que propone esta opción."},{"q":"Con respecto a las glomerulonefritis (GMN), señale la opción FALSA:","o":["La GMN segmentaria y focal puede ser secundaria a la obesidad.","La GMN por lesiones mínimas es la causa más frecuente de síndrome nefrótico en la infancia.","La GMN aguda postinfecciosa es la causa más frecuente de síndrome nefrótico en adultos.","La GMN por depósito de IgA suele darse en adolescentes y jóvenes, con hematuria tras 24-48h de una infección respiratoria alta."],"c":"C","e":"La glomerulonefritis aguda postinfecciosa produce típicamente un síndrome NEFRÍTICO (hematuria, HTA, edemas, oliguria), no nefrótico; además, en adultos la causa más frecuente de síndrome nefrótico primario suele ser la nefropatía membranosa o la glomeruloesclerosis focal y segmentaria, no la GN postinfecciosa."},{"q":"Indique qué determinación analítica NO realizaría ante un paciente con sospecha de glomerulonefritis:","o":["Anticuerpos anticardiolipina.","Niveles de complemento C3 y C4.","Serología de hepatitis B, hepatitis C y VIH.","Anticuerpos antinucleares."],"c":"A","e":"Los anticuerpos anticardiolipina no forman parte del estudio etiológico habitual de una glomerulonefritis (se piden ante sospecha de síndrome antifosfolípido); en cambio, el estudio de complemento, la serología viral (por su asociación con glomerulopatías secundarias, como la crioglobulinemia por VHC o la nefropatía por VIH) y los ANA sí son pruebas de primera línea en este contexto."},{"q":"En un paciente con lupus eritematoso sistémico con síndrome nefrótico y SIN alteraciones del sedimento urinario ni de la creatinina plasmática, podríamos sospechar:","o":["Glomerulonefritis membranosa.","Glomerulonefritis mesangial.","Glomerulonefritis membranoproliferativa con nefritis intersticial.","Glomeruloesclerosis."],"c":"A","e":"La nefropatía lúpica membranosa (clase V) se caracteriza por presentarse como un síndrome nefrótico «puro», con proteinuria masiva pero sin el sedimento urinario activo (hematuria con cilindros) ni el deterioro de función renal que sí acompañan a las formas proliferativas (clases III/IV) del lupus renal."},{"q":"Marque la afirmación FALSA con respecto a la nefropatía membranosa:","o":["Es la causa más frecuente de síndrome nefrótico idiopático en adultos caucásicos no diabéticos.","A pesar de tratamiento adecuado, el 50% de los pacientes progresa a enfermedad renal terminal a los 10 años.","Aproximadamente el 80% de los casos están limitados al riñón y el 20% se asocia a otras enfermedades sistémicas, infecciones, neoplasias o fármacos.","En la mayoría de los pacientes se detectan anticuerpos IgG4 circulantes frente al receptor de la fosfolipasa A2 (PLA2R) de la membrana podocitaria."],"c":"B","e":"Con tratamiento adecuado, la progresión a enfermedad renal terminal a los 10 años ocurre en una minoría de los pacientes (aproximadamente 15-20%, no el 50%); la evolución clásica de la nefropatía membranosa sigue aproximadamente la «regla del tercio»: un tercio remite espontáneamente, un tercio persiste con proteinuria estable y un tercio progresa a insuficiencia renal."},{"q":"En un paciente con diabetes mellitus tipo 2 que presenta alteraciones renales, ¿cuál de las siguientes NO es una clave diagnóstica de enfermedad glomerular NO diabética?","o":["Curso agudo de la enfermedad renal.","Presencia de sedimento urinario activo.","Ausencia de retinopatía diabética.","Reducción del FG \\>30% en los 2-3 meses tras iniciar IECA o ARA-II."],"c":"D","e":"Una reducción del filtrado glomerular de hasta un 30% en las primeras semanas tras iniciar un IECA/ARA-II es un efecto hemodinámico ESPERADO y aceptable de estos fármacos (por la reducción de la presión intraglomerular), no un dato que sugiera una nefropatía distinta de la diabética; en cambio, el curso agudo, el sedimento activo y la ausencia de retinopatía sí son datos de alarma que orientan a buscar otra causa glomerular."},{"q":"Mujer de 70 años ingresada por neumonía en tratamiento con penicilinas y varios fármacos para insuficiencia cardiaca, que a los 7 días presenta malestar, náuseas y deterioro de función renal con proteinuria leve y hematuria. Señale la respuesta INCORRECTA:","o":["Probablemente sea secundario a las penicilinas, de los pocos fármacos que pueden ocasionar esta enfermedad.","El tratamiento consistiría en suspender el fármaco causante y, si procede, corticoides.","En la analítica probablemente encontremos eosinofilia.","En la biopsia renal se observaría infiltrado y edema intersticial."],"c":"A","e":"Aunque las penicilinas son una causa clásica de nefritis intersticial alérgica, son solo una entre un número muy amplio de fármacos implicados (AINE, inhibidores de la bomba de protones, alopurinol, otros antibióticos, diuréticos, etc.), por lo que la afirmación de que son «de los pocos fármacos» causantes es incorrecta."},{"q":"Señale la VERDADERA en relación con la glomerulonefritis membranosa:","o":["En la inmunofluorescencia se objetivan depósitos LINEALES de IgG y C4.","La trombosis de la vena renal es INFRECUENTE en esta entidad.","El antígeno podocitario relacionado con el receptor de la fosfolipasa A2 (con dominios tipo trombospondina) está implicado en la mayoría de los casos primarios.","La incidencia de insuficiencia renal terminal es del 35% a los 10 años en todos los casos."],"c":"C","e":"El receptor de la fosfolipasa A2 (PLA2R), diana antigénica identificada en la mayoría de las nefropatías membranosas primarias, contiene dominios estructurales de tipo trombospondina; en la inmunofluorescencia los depósitos son GRANULARES (no lineales, que son propios del síndrome de Goodpasture), y la trombosis de vena renal es relativamente FRECUENTE (no infrecuente) en esta entidad, siendo una de las glomerulopatías con mayor riesgo trombótico."},{"q":"¿En cuál de las siguientes entidades se puede desarrollar una insuficiencia renal rápidamente progresiva?","o":["Glomerulonefritis membranoproliferativa.","Glomeruloesclerosis focal y segmentaria.","Glomerulonefritis endocapilar.","Glomerulonefritis extracapilar (con semilunas)."],"c":"D","e":"La glomerulonefritis extracapilar, caracterizada histológicamente por la formación de semilunas (proliferación extracapilar), es la causa histológica clásica del síndrome clínico de glomerulonefritis rápidamente progresiva, con deterioro grave y acelerado de la función renal en días o semanas."},{"q":"¿Cuál de las siguientes entidades NO se considera una glomerulonefritis proliferativa?","o":["Glomerulonefritis membranosa.","Glomerulonefritis mesangial.","Glomerulonefritis postestreptocócica.","Glomerulonefritis membranoproliferativa."],"c":"A","e":"La nefropatía membranosa es una glomerulopatía por depósito, con engrosamiento de la membrana basal glomerular pero sin proliferación celular significativa, a diferencia de las formas mesangial, postestreptocócica (endocapilar) y membranoproliferativa, que sí cursan con proliferación celular glomerular."},{"q":"En relación con el sedimento urinario, ¿cuál de las siguientes afirmaciones es VERDADERA?","o":["La presencia de leucocituria es sinónimo de infección del tracto urinario.","La eosinofiluria es un hallazgo característico de la nefropatía diabética.","Los cilindros hialinos son específicos de las infecciones de la vía urinaria.","Los cristales de cistina son hexagonales."],"c":"D","e":"Los cristales de cistina, hallazgo patognomónico de la cistinuria, tienen una morfología hexagonal característica en el sedimento urinario. La leucocituria puede tener múltiples causas no infecciosas (nefritis intersticial, entre otras), la eosinofiluria se asocia clásicamente a nefritis intersticial alérgica (no a nefropatía diabética), y los cilindros hialinos son inespecíficos, pudiendo verse incluso en orina concentrada normal."},{"q":"Señale la afirmación correcta en relación a un paciente que presenta en orina de 24 horas una proteinuria de 350 mg:","o":["Presenta proteinuria en rango normal.","Presenta proteinuria patológica.","Presenta proteinuria en rango nefrótico.","Presenta microalbuminuria."],"c":"B","e":"El límite superior normal de proteinuria en 24 horas se sitúa en torno a 150 mg; por tanto, 350 mg/24h ya constituye una proteinuria patológica, aunque muy alejada del rango nefrótico (\\>3,5 g/24h). El término «microalbuminuria» se refiere específicamente a la excreción de albúmina (no de proteína total) en un rango concreto, por lo que no es aplicable directamente a este dato."},{"q":"De las siguientes características, señale la que NO corresponde a un síndrome nefrótico:","o":["Proteinuria mayor de 3,5 g en 24 horas.","Hipoalbuminemia.","Hiperlipemia.","Hipocoagulabilidad."],"c":"D","e":"El síndrome nefrótico se asocia a un estado de HIPERcoagulabilidad (con mayor riesgo de trombosis venosas, especialmente de la vena renal), por la pérdida urinaria de proteínas anticoagulantes como la antitrombina III, no a hipocoagulabilidad."},{"q":"En el síndrome nefrótico es FALSO que:","o":["Aumenta la síntesis hepática de albúmina (mecanismo compensador, insuficiente).","Aumenta la eliminación urinaria de antitrombina III.","Aumenta la eliminación urinaria de IgG.","Su causa más frecuente es «la glomerulonefritis», sin más especificación."],"c":"D","e":"La causa más frecuente de síndrome nefrótico varía según la edad y las series (enfermedad de cambios mínimos en niños, nefropatía membranosa o glomeruloesclerosis focal y segmentaria en adultos, nefropatía diabética como causa secundaria más frecuente en general), por lo que una respuesta genérica e inespecífica como «la glomerulonefritis» no resulta correcta como causa única y bien definida."},{"q":"¿Cuál de las siguientes asociaciones NO le parece correcta?","o":["Glomerulonefritis postestreptocócica --- síndrome nefrítico.","Glomerulonefritis membranosa --- síndrome nefrótico.","Enfermedad de cambios mínimos --- hematuria macroscópica y síndrome nefrítico agudo.","Nefropatía por IgA (enfermedad de Berger) --- glomerulonefritis proliferativa mesangial."],"c":"C","e":"La enfermedad de cambios mínimos se presenta característicamente como un síndrome nefrótico «puro» (proteinuria masiva selectiva, sin hematuria macroscópica ni datos de síndrome nefrítico), siendo la causa más frecuente de síndrome nefrótico en la infancia; la asociación con hematuria macroscópica y síndrome nefrítico agudo no es propia de esta entidad."},{"q":"¿Cuál de los siguientes cuadros renales se detecta con más frecuencia en pacientes con amiloidosis?","o":["Síndrome nefrítico.","Síndrome nefrótico.","Tubulopatía aislada.","Infartos renales por infiltración microvascular."],"c":"B","e":"La afectación renal de la amiloidosis (tanto AL como AA) se manifiesta característicamente como un síndrome nefrótico, por depósito de sustancia amiloide en el glomérulo con proteinuria masiva, hipoalbuminemia e hiperlipemia secundarias."},{"q":"La gran mayoría de los casos de necrosis cortical renal se deben a:","o":["Glomerulonefritis agudas.","Complicaciones del embarazo (desprendimiento de placenta, sepsis puerperal).","Vasculitis sistémicas.","Fármacos."],"c":"B","e":"Las complicaciones obstétricas graves (desprendimiento prematuro de placenta, sepsis puerperal, preeclampsia grave) son la causa clásica y más frecuente de necrosis cortical renal bilateral, por vasoespasmo intenso e isquemia cortical prolongada."},{"q":"La fase preclínica de la nefropatía diabética se caracteriza por todo lo siguiente, EXCEPTO:","o":["Ausencia de proteinuria manifiesta.","Microalbuminuria.","Hiperfiltración glomerular.","Disminución del grosor de la membrana basal glomerular."],"c":"D","e":"En las fases iniciales de la nefropatía diabética se produce, en realidad, un ENGROSAMIENTO progresivo de la membrana basal glomerular (junto con hipertrofia glomerular e hiperfiltración), no una disminución de su grosor."},{"q":"Respecto a las complicaciones renales de la diabetes mellitus, señale la INCORRECTA:","o":["La albuminuria en pacientes con DM se asocia a mayor riesgo de enfermedad cardiovascular.","Los pacientes con nefropatía diabética, por lo general, padecen retinopatía diabética asociada.","Durante los primeros cinco años de evolución de la DM, la membrana basal glomerular se adelgaza y ocurre atrofia glomerular.","La monitorización de microalbuminuria debe realizarse en DM tipo 1 de más de 5 años, en DM tipo 2 y durante el embarazo."],"c":"C","e":"En los primeros años de evolución de la diabetes ocurre justamente lo contrario: engrosamiento de la membrana basal glomerular e hipertrofia glomerular (con hiperfiltración), no adelgazamiento ni atrofia, que son hallazgos tardíos de la nefropatía diabética evolucionada."},{"q":"¿Cuál es la tríada básica de la nefroangiosclerosis maligna?","o":["Hipertensión grave, edemas y hematuria macroscópica.","Presión diastólica \\>140 mmHg, encefalopatía hipertensiva y proteinuria.","Presión diastólica \\>130 mmHg, fondo de ojo grado III-IV (retinopatía hipertensiva grave) e insuficiencia renal.","Hipertensión grave, edema de papila y hematuria."],"c":"C","e":"La nefroangiosclerosis maligna se define clásicamente por hipertensión muy grave (presión diastólica habitualmente \\>130 mmHg), retinopatía hipertensiva avanzada (grado III con hemorragias/exudados, o grado IV con edema de papila) e insuficiencia renal, constituyendo una urgencia hipertensiva con lesión de órgano diana."},{"q":"¿Cuál es el tipo histológico de peor pronóstico en la nefropatía lúpica?","o":["Glomerulonefritis proliferativa focal (clase III).","Glomerulonefritis mesangial (clase II).","Glomerulonefritis proliferativa difusa (clase IV).","Glomerulonefritis membranosa (clase V)."],"c":"C","e":"La nefritis lúpica proliferativa difusa (clase IV de la clasificación ISN/RPS) es la forma histológica más agresiva y de peor pronóstico renal, con mayor riesgo de progresión a enfermedad renal terminal si no se trata de forma intensiva y precoz."},{"q":"En un paciente con amiloidosis sistémica es CIERTO que:","o":["La biopsia de grasa abdominal es diagnóstica en menos del 40% de los pacientes.","El órgano que se afecta con más frecuencia es el corazón, en el 70-80% de los casos.","La principal causa de muerte es la afectación renal.","La afectación renal se manifiesta generalmente con proteinuria, a menudo en rango nefrótico, con hipoalbuminemia, hipercolesterolemia e hipertrigliceridemia secundarias."],"c":"D","e":"La afectación renal amiloide se manifiesta típicamente como un síndrome nefrótico completo (proteinuria masiva con hipoalbuminemia e hiperlipemia secundaria); la biopsia de grasa abdominal tiene, de hecho, buena rentabilidad diagnóstica (sensibilidad bastante superior al 40% descrito), y aunque el corazón se afecta con frecuencia (sobre todo en la amiloidosis AL), la principal causa de muerte suele ser la afectación cardiaca (arritmias, insuficiencia cardiaca), no la renal."}]},"33":{"title":"Aproximación al paciente con enfermedad esófagogástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.","questions":[{"q":"Señale la afirmación INCORRECTA en relación con la Esofagitis Eosinofílica:","o":["Es la primera causa de disfagia e impactación alimentaria en el adulto joven.","Es típica la asociación con patologías alérgicas.","Para el diagnóstico es necesario la presencia de más de 10 eosinófilos por campo de gran aumento en la biopsia esofágica.","Disponemos de varias opciones terapéuticas: dieta restrictiva, IBP, corticoides tópicos."],"c":"C","e":"El criterio histológico aceptado es ≥15 eosinófilos por campo de gran aumento, no \\>10. El resto de afirmaciones son correctas: es la causa más frecuente de disfagia/impactación en adultos jóvenes, se asocia a atopia y responde a dieta, IBP o corticoides tópicos deglutidos."},{"q":"En cuanto a la infección por Helicobacter pylori, señale la opción FALSA:","o":["La prueba de aliento con urea marcada con C13 es el método diagnóstico no invasivo de elección.","El tratamiento de elección es la terapia cuádruple clásica en cápsula única (Pylera).","El tratamiento de segunda línea más efectivo tras fracaso incluye levofloxacino + amoxicilina ± bismuto.","La serología es un buen método para confirmar la erradicación de la infección."],"c":"D","e":"La serología detecta anticuerpos IgG que persisten meses o años tras la curación, por lo que NO sirve para confirmar erradicación; para ello se usan el test del aliento o el antígeno en heces, siempre tras 4 semanas sin antibióticos y 2 semanas sin IBP."},{"q":"Con respecto a los efectos del consumo crónico de alcohol sobre órganos y sistemas, ¿cuál es la respuesta FALSA?","o":["Un consumo de 4 bebidas alcohólicas al día aumenta unas tres veces el riesgo de neoplasias malignas de boca y esófago.","La frecuencia de pancreatitis aguda es casi siete veces mayor en alcohólicos que en la población general.","El alcohol es una de las causas más frecuentes de gastritis hemorrágica aguda.","Las personas con consumo excesivo de alcohol tienen un aumento significativo del riesgo de arteriopatía coronaria."],"c":"D","e":"El alcohol se asocia claramente a mayor riesgo de cáncer orofaríngeo/esofágico, pancreatitis y gastritis erosiva-hemorrágica, pero no existe una asociación consistente con un aumento del riesgo coronario (de hecho el consumo moderado se ha relacionado en estudios epidemiológicos con un patrón en J); el daño cardiovascular del alcohol excesivo se manifiesta sobre todo como miocardiopatía dilatada, arritmias e hipertensión."},{"q":"Un paciente es diagnosticado de esofagitis péptica grado C (clasificación de Los Ángeles), sin esófago de Barrett. ¿Cuál de los siguientes tratamientos debería recomendarse como primera opción?","o":["Funduplicatura endoscópica.","Restricción de grasa en la dieta.","Funduplicatura laparoscópica.","Esomeprazol 40 mg/12 horas."],"c":"D","e":"La esofagitis erosiva grave (grados C-D de Los Ángeles) se trata inicialmente con IBP a dosis altas; la cirugía antirreflujo se reserva para el fallo del tratamiento médico, la recidiva tras suspenderlo o el rechazo del paciente al tratamiento crónico."},{"q":"Los siguientes factores se asocian al desarrollo de cáncer esofágico, EXCEPTO:","o":["Esofagitis cáustica.","Tabaquismo.","Fístulas traqueoesofágicas.","Síndrome de Plummer-Vinson."],"c":"C","e":"Las fístulas traqueoesofágicas son una complicación (a veces del propio cáncer esofágico avanzado o de la esofagitis cáustica), no un factor de riesgo causal. Cáusticos, tabaco y el síndrome de Plummer-Vinson (membranas esofágicas + ferropenia) sí son factores de riesgo reconocidos, sobre todo de carcinoma escamoso."},{"q":"¿Cuál de las siguientes condiciones se considera que tiene una asociación establecida con el reflujo gastroesofágico?","o":["Laringitis posterior.","Sinusitis crónica.","Neumonía recurrente por aspiración.","Cualquiera de las anteriores."],"c":"D","e":"El ERGE tiene manifestaciones extraesofágicas bien establecidas: laringitis posterior, tos crónica, asma, erosiones dentales, sinusitis crónica y neumonía aspirativa recurrente, por lo que la respuesta que engloba todas ellas es la correcta."},{"q":"Se incluyen dentro de las medidas terapéuticas antirreflujo (marque la respuesta correcta):","o":["Dormir del lado derecho y con la cabecera incorporada.","Los antiácidos aumentan transitoriamente el pH intraluminal y alivian síntomas, pero no curan la esofagitis.","El baclofeno es útil en el ERGE refractario porque reduce las relajaciones transitorias del esfínter esofágico inferior.","Todas son medidas antirreflujo correctas."],"c":"B","e":"Dormir en decúbito LATERAL IZQUIERDO (no derecho) reduce el reflujo. El baclofeno sí reduce las relajaciones transitorias del EEI (ese es precisamente su mecanismo de acción como coadyuvante en ERGE refractario), por lo que la opción C es errónea tal y como está formulada. Los antiácidos tamponan el ácido pero no modifican la historia natural de la esofagitis, lo que hace correcta la opción B."},{"q":"¿Cuál de estas entidades se asocia más claramente al reflujo gastroesofágico?","o":["Sinusitis crónica.","Erosiones dentales.","Fibrosis pulmonar idiopática.","Neumonía broncoaspirativa recurrente."],"c":"B","e":"Las erosiones del esmalte dental (afectando típicamente a las caras palatinas de los incisivos superiores) constituyen una manifestación extraesofágica clásica y bien demostrada del ERGE por exposición ácida directa de la cavidad oral."},{"q":"Respecto a la infección por Helicobacter pylori, señale la respuesta INCORRECTA:","o":["En adultos con púrpura trombocitopénica idiopática, la erradicación de H. pylori tiende a aumentar el número total de plaquetas.","En pacientes con dicha infección, la incidencia de enfermedad por reflujo gastroesofágico es menor.","La infección crónica aumenta la respuesta a la inmunoterapia frente al cáncer.","La detección de antígeno en heces mediante ELISA con anticuerpos monoclonales tiene sensibilidad y especificidad superiores al 90%."],"c":"C","e":"No existe evidencia sólida de que la infección crónica por H. pylori mejore la respuesta a la inmunoterapia oncológica; si acaso, algunos estudios sugieren el efecto contrario a través de alteraciones del microbioma. Las otras afirmaciones (relación con PTI, menor incidencia de ERGE en infectados y alto rendimiento del antígeno en heces) están bien establecidas."},{"q":"¿Cuál de las siguientes afirmaciones es cierta acerca de la infección por Helicobacter pylori?","o":["La necesidad de tratamiento depende exclusivamente de la edad del paciente.","El empleo concomitante de probióticos (lactobacilos, Saccharomyces boulardii) se asocia a menor tasa de efectos adversos y mejor tasa de erradicación.","El consumo regular de probióticos ha demostrado ser una medida preventiva eficaz de la infección.","Si el primer tratamiento fracasa, se recomienda endoscopia digestiva alta sistemática antes del segundo ciclo."],"c":"B","e":"Varios ensayos y metaanálisis avalan que añadir probióticos concretos al tratamiento erradicador reduce la diarrea y otros efectos adversos, mejorando la adherencia y, en consecuencia, la tasa de erradicación; no hay evidencia de que prevengan la adquisición de la infección, y la endoscopia no es necesaria de rutina tras un primer fracaso sin datos de alarma."},{"q":"En el linfoma gástrico, ¿cuál de las siguientes NO es cierta?","o":["Es el segundo tumor maligno más frecuente del estómago (tras el adenocarcinoma).","Su pronóstico es mejor que el del adenocarcinoma gástrico.","Es sensible a la quimioterapia y a la radioterapia.","Generalmente se trata de un linfoma de Hodgkin."],"c":"D","e":"El linfoma gástrico primario es en la inmensa mayoría de los casos un linfoma B no Hodgkin (frecuentemente tipo MALT asociado a H. pylori, o difuso de célula grande B), nunca un linfoma de Hodgkin."},{"q":"¿Cuál es el tumor benigno más frecuente del esófago?","o":["Hemangioma.","Leiomioma.","Lipoma.","Linfangioma."],"c":"B","e":"El leiomioma, tumor de origen en el músculo liso de la pared esofágica, es el tumor benigno esofágico más frecuente, seguido a mucha distancia por los pólipos fibrovasculares y otras lesiones."},{"q":"Mujer de 38 años con disfagia retroesternal baja de intensidad variable desde hace 4 años, dolor torácico opresivo que ha disminuido mientras la disfagia empeoraba, regurgitaciones no ácidas con el decúbito, neumonía aspirativa hace 2 meses y pérdida de 4 kg. ¿Cuál es el diagnóstico más probable?","o":["Estenosis esofágica péptica.","Cáncer de esófago.","Membrana esofágica asociada a ferropenia (síndrome de Plummer-Vinson).","Acalasia."],"c":"D","e":"La evolución de años, la disfagia tanto a sólidos como líquidos, las regurgitaciones de material no digerido (no ácido) y la neumonía aspirativa son típicas de acalasia, un trastorno motor por pérdida de neuronas inhibitorias del plexo mientérico; la larga evolución sin progresión rápida hace poco probable el cáncer, y la ausencia de mención a ferropenia descarta el Plummer-Vinson."},{"q":"La causa más común de estenosis esofágica benigna es:","o":["Cáncer de esófago.","Enfermedad por reflujo gastroesofágico (ERGE).","Esófago de Barrett.","Esclerosis sistémica."],"c":"B","e":"La estenosis péptica secundaria a esofagitis crónica por ERGE es, con diferencia, la causa más frecuente de estenosis esofágica benigna en la práctica clínica."},{"q":"¿Cuál de las siguientes enfermedades es una inflamación crónica del esófago causada por un proceso autoinmune?","o":["Esofagitis eosinofílica.","Enfermedad de Chagas.","Esófago de Barrett.","Esclerosis sistémica."],"c":"D","e":"La esclerosis sistémica es una enfermedad autoinmune del tejido conectivo que produce fibrosis progresiva de la pared esofágica con hipomotilidad y esofagitis crónica secundaria; la esofagitis eosinofílica es de mecanismo alérgico (no autoinmune), Chagas es infecciosa y Barrett es metaplasia por ERGE."},{"q":"La disfagia progresiva, la pérdida de peso y el dolor retroesternal son síntomas característicos de:","o":["Cáncer de esófago.","Esofagitis por reflujo.","Acalasia esofágica.","Divertículo de Zenker."],"c":"A","e":"La tríada de disfagia progresiva (primero a sólidos, luego a líquidos), pérdida de peso significativa y dolor retroesternal en un paciente de edad media-avanzada es la presentación clásica del carcinoma esofágico, que debe hacer descartar neoplasia mediante endoscopia urgente."},{"q":"El divertículo de Zenker se localiza en:","o":["La parte superior del esófago (a nivel del músculo cricofaríngeo).","La parte media del esófago.","La parte inferior del esófago.","El estómago."],"c":"A","e":"Es un divertículo de pulsión por hipertonía del esfínter esofágico superior/cricofaríngeo, que se forma en la zona de debilidad de Killian, en la unión faringoesofágica (esófago cervical superior)."},{"q":"La principal causa de la esofagitis eosinofílica es:","o":["Infección viral.","Ingestión de medicamentos.","Alergias alimentarias.","Consumo excesivo de alcohol."],"c":"C","e":"Es una enfermedad inmunomediada (Th2) desencadenada típicamente por antígenos alimentarios (leche, huevo, trigo, soja, frutos secos, pescado/marisco), de ahí que la dieta de eliminación sea una de las estrategias terapéuticas de primera línea."},{"q":"El tratamiento de primera línea para el esófago de Barrett (sin displasia) es:","o":["Inhibidores de la bomba de protones.","Antibióticos.","Corticosteroides inhalados.","Cirugía de resección del esófago."],"c":"A","e":"En el Barrett sin displasia el pilar del manejo es el control sintomático del reflujo con IBP y la vigilancia endoscópica periódica; la ablación endoscópica o la esofaguectomía se reservan para displasia de alto grado o adenocarcinoma."},{"q":"La principal causa de la úlcera péptica es:","o":["Infección por Helicobacter pylori.","Consumo excesivo de alcohol.","Uso prolongado de antiinflamatorios no esteroideos (AINE).","Estrés emocional."],"c":"A","e":"H. pylori sigue siendo la causa más frecuente de úlcera péptica a nivel mundial, seguida por el consumo de AINE; ambas causas explican la gran mayoría de los casos, quedando el estrés y otras causas como mucho más minoritarias."},{"q":"¿Cuál es la complicación más frecuente de la úlcera péptica?","o":["Hemorragia digestiva.","Perforación.","Estenosis pilórica.","Penetración."],"c":"A","e":"La hemorragia digestiva (por erosión de un vaso en el lecho ulceroso) es, con diferencia, la complicación más frecuente de la úlcera péptica, muy por delante de la perforación, la penetración o la estenosis cicatricial."},{"q":"El principal objetivo del tratamiento farmacológico de la úlcera péptica es:","o":["Erradicar la infección por Helicobacter pylori en todos los casos.","Reducir la producción de ácido gástrico.","Aliviar el dolor abdominal.","Mejorar la motilidad intestinal."],"c":"B","e":"El pilar farmacológico es la supresión ácida (IBP) para favorecer la cicatrización de la úlcera; la erradicación de H. pylori se añade cuando está presente, pero el objetivo fisiopatológico central del tratamiento antisecretor es reducir la agresión ácida sobre la mucosa."},{"q":"El tratamiento de primera línea para la úlcera péptica asociada a Helicobacter pylori es:","o":["Inhibidores de la bomba de protones (IBP) más dos antibióticos.","Antiácidos.","Dieta restrictiva.","Cirugía de resección gástrica."],"c":"A","e":"La terapia erradicadora combina un IBP con dos (terapia triple) o más antibióticos (terapia cuádruple, de elección en España por las altas tasas de resistencia a claritromicina), lo que además de curar la úlcera reduce drásticamente el riesgo de recidiva."},{"q":"¿Cuál de los siguientes factores NO está asociado con un mayor riesgo de desarrollar cáncer gástrico?","o":["Tabaquismo.","Consumo de alimentos ahumados o muy salados.","Ingesta alta de frutas y verduras.","Infección por Helicobacter pylori."],"c":"C","e":"El consumo elevado de frutas y verduras (ricas en antioxidantes, vitamina C) se asocia a un efecto protector frente al cáncer gástrico, al contrario que el tabaco, los alimentos ahumados/salados (ricos en nitrosaminas) y la infección crónica por H. pylori."},{"q":"¿Cuál de los siguientes síntomas es más característico de la úlcera péptica?","o":["Dolor abdominal que aparece o empeora tras las comidas (o que alivia con la ingesta, según localización).","Dolor torácico retroesternal.","Diarrea crónica.","Vómitos persistentes."],"c":"A","e":"El dolor epigástrico relacionado temporalmente con la ingesta (típicamente calma con la comida en la úlcera duodenal y empeora en la gástrica) es el síntoma cardinal de la enfermedad ulcerosa péptica."},{"q":"¿Cuál es la etiología de la disfagia lusoria?","o":["Idiopática.","Psicosomática.","Compresión esofágica por una arteria subclavia derecha aberrante que nace en el lado izquierdo del arco aórtico.","Síndrome de vena cava superior."],"c":"C","e":"La disfagia lusoria se debe a la compresión extrínseca del esófago por una arteria subclavia derecha aberrante (arteria lusoria), una anomalía congénita del arco aórtico que discurre por detrás del esófago."},{"q":"La coexistencia de gastritis atrófica y anemia macrocítica por malabsorción de vitamina B12 debida a falta de secreción de factor intrínseco se denomina:","o":["Gastritis anemizante.","Síndrome de malabsorción de B12.","Anemia hemolítica.","Anemia perniciosa."],"c":"D","e":"La anemia perniciosa es la anemia megaloblástica causada por gastritis atrófica autoinmune con destrucción de células parietales, pérdida de secreción de factor intrínseco y consiguiente malabsorción de vitamina B12 en íleon terminal."},{"q":"Respecto al diagnóstico de la infección por Helicobacter pylori, ¿cuál de las siguientes afirmaciones es VERDADERA?","o":["Sólo es posible el diagnóstico mediante estudio anatomopatológico de la mucosa gástrica-duodenal.","La determinación de antígeno en heces tiene una sensibilidad claramente inferior a cualquier otro método diagnóstico.","La determinación de anticuerpos por ELISA presenta sensibilidad y especificidad significativamente superiores al test del aliento.","El test del aliento puede dar falsos negativos con el uso reciente de antibióticos e inhibidores de la bomba de protones."],"c":"D","e":"Tanto los antibióticos (suspender ≥4 semanas antes) como los IBP (suspender ≥2 semanas antes) reducen transitoriamente la carga bacteriana y pueden producir falsos negativos en el test del aliento y en el antígeno en heces; la serología, en cambio, no sirve para diagnóstico de infección activa con la fiabilidad de estas pruebas."},{"q":"Indique la respuesta INCORRECTA en la enfermedad por reflujo gastroesofágico:","o":["El ensayo terapéutico con IBP se considera una prueba diagnóstica válida en atención primaria.","Si la endoscopia es normal, se excluye la existencia de enfermedad por reflujo gastroesofágico.","Cuando hay síntomas de alarma hay que realizar una endoscopia digestiva alta.","La estenosis péptica y la úlcera esofágica son complicaciones del ERGE."],"c":"B","e":"Una endoscopia normal NO descarta ERGE: hasta dos tercios de los pacientes con síntomas típicos tienen la llamada enfermedad por reflujo no erosiva (ERNE), con mucosa macroscópicamente normal pero clínica y pHmetría compatibles con reflujo patológico."},{"q":"Indique la respuesta INCORRECTA con respecto a Helicobacter pylori:","o":["El empleo de antibióticos o IBP en los días previos a la prueba del aliento con urea marcada no influye en el resultado.","El cultivo no es un método diagnóstico de rutina.","El cultivo permite determinar la sensibilidad del microorganismo a los antibacterianos.","La prueba del aliento con urea marcada es la técnica de elección para confirmar la erradicación en la úlcera duodenal."],"c":"A","e":"Justo lo contrario es cierto: los antibióticos recientes y los IBP SÍ alteran el resultado del test del aliento, produciendo falsos negativos, por lo que debe repetirse tras el periodo de lavado adecuado (4 semanas sin antibióticos, 2 semanas sin IBP)."}]},"34":{"title":"Hemorragia digestiva alta y baja.","questions":[{"q":"En la transfusión de concentrado de hematíes en pacientes con hemorragia digestiva, indique la respuesta INCORRECTA:","o":["En hemorragia masiva y shock se recomienda administrar concentrado de hematíes y cristaloides conjuntamente.","En pacientes estables se recomienda transfundir con niveles de hemoglobina inferiores a 8 g/dl.","En pacientes estables con patología cardiovascular o respiratoria se recomienda transfundir con niveles de hemoglobina menores de 9 g/dl.","Los valores iniciales de hemoglobina pueden no reflejar adecuadamente la intensidad de la pérdida hemática."],"c":"B","e":"La estrategia transfusional restrictiva actualmente recomendada (avalada por el ensayo de Villanueva y las guías internacionales) fija el umbral en Hb \\<7 g/dl en pacientes estables sin comorbilidad cardiovascular significativa, no \\<8 g/dl; en cardiópatas o pacientes con patología respiratoria se admite un umbral algo más alto (en torno a 8-9 g/dl)."},{"q":"Paciente con melenas de repetición, endoscopia esófagogastroduodenal sin alteraciones y colonoscopia hasta ciego normal. ¿Qué procedimiento diagnóstico solicitaría a continuación?","o":["Gammagrafía con Tecnecio-99m.","Arteriografía mesentérica.","Cápsula video-endoscópica intestinal.","Yeyunoscopia."],"c":"C","e":"Tras un estudio negativo de tramo alto (EGD) y bajo (colonoscopia), la sospecha se centra en el intestino delgado; la cápsula endoscópica es la prueba de primera elección para el estudio del sangrado de origen oscuro/intestino delgado, reservando la enteroscopia (yeyunoscopia) o la angiografía para confirmar y tratar lesiones ya localizadas, o en sangrado activo grave."},{"q":"La causa más frecuente de hemorragia de origen en el intestino delgado es:","o":["Cáncer en el divertículo de Meckel.","Angiodisplasia.","Fístula bilioentérica.","Diverticulosis."],"c":"B","e":"Las angiodisplasias (malformaciones vasculares adquiridas, más frecuentes en ancianos y en insuficiencia renal crónica o estenosis aórtica -síndrome de Heyde-) son la causa más habitual de sangrado de origen en intestino delgado, por delante del divertículo de Meckel (más típico en jóvenes)."},{"q":"Paciente con insuficiencia renal crónica avanzada que acude por hemorragia digestiva alta. ¿Cuál es la etiología más probable del sangrado en este paciente?","o":["Úlcera duodenal.","Cáncer gástrico.","Cáncer duodenal.","Angiodisplasia."],"c":"D","e":"La uremia crónica se asocia a disfunción plaquetaria y a mayor prevalencia de angiodisplasias digestivas, que constituyen una causa característica y frecuente de HDA en pacientes con enfermedad renal crónica avanzada."},{"q":"¿Cuál es la complicación más frecuente de la úlcera péptica?","o":["Hemorragia digestiva.","Perforación.","Estenosis pilórica.","Penetración."],"c":"A","e":"La hemorragia digestiva por erosión vascular en la base de la úlcera es la complicación más frecuente de la enfermedad ulcerosa péptica, muy por encima de la perforación libre o la estenosis cicatricial."},{"q":"Hombre de 68 años con cirrosis crónica por VHC y alcohol, sin antecedentes de HDA, presenta varices esofágicas grandes en la endoscopia de control. ¿Qué fármaco sería de elección para la prevención primaria de HDA por varices?","o":["Metoprolol.","Propranolol.","Atenolol.","Nitratos."],"c":"B","e":"Los betabloqueantes no cardioselectivos (propranolol, nadolol o carvedilol) reducen el flujo esplácnico y la presión portal, y son el fármaco de elección para la profilaxis primaria del sangrado por varices esofágicas grandes; los betabloqueantes cardioselectivos (metoprolol, atenolol) no tienen este efecto beneficioso demostrado."},{"q":"En relación con la estenosis aórtica, señale lo correcto:","o":["La silueta cardíaca no suele alterarse de forma apreciable.","Prácticamente nunca se observa calcificación valvular.","Se asocia a la presencia de sangrado digestivo por angiodisplasias (síndrome de Heyde).","El desdoblamiento invertido del segundo ruido no se relaciona con la gravedad."],"c":"C","e":"El síndrome de Heyde describe la asociación de estenosis aórtica calcificada grave con sangrado digestivo por angiodisplasias, favorecido por un síndrome de von Willebrand adquirido secundario al estrés de cizallamiento del flujo a través de la válvula estenótica; el sangrado y la anemia pueden mejorar tras el recambio valvular."},{"q":"La causa más frecuente de hemorragia digestiva baja en la población adulta es:","o":["Pólipos y poliposis.","Neoplasias.","Diverticulosis.","Angiodisplasias."],"c":"C","e":"La diverticulosis colónica es la causa más frecuente de hemorragia digestiva baja en el adulto, especialmente en mayores de 60 años; el sangrado se origina por rotura de un vaso en el cuello o base del divertículo y suele ser autolimitado."},{"q":"Respecto al tratamiento de pacientes con hemorragia digestiva alta aguda no varicosa de alto riesgo, señale la respuesta CORRECTA:","o":["Se recomienda mantener tratamiento con IBP a dosis altas en perfusión continua durante los tres primeros días tras el tratamiento endoscópico.","Los antagonistas H2 intravenosos son tan eficaces como los IBP para prevenir la recidiva hemorrágica, la cirugía o la mortalidad.","La somatostatina y sus análogos han demostrado mejorar la supervivencia en la HDA no varicosa.","La conducta restrictiva en la transfusión de hematíes en pacientes con Hb entre 8 y 10 g/dl se asocia a peor pronóstico y mayor recidiva hemorrágica."],"c":"A","e":"Tras la hemostasia endoscópica de una lesión de alto riesgo (Forrest Ia-IIb), las guías recomiendan IBP intravenoso a dosis altas (bolo seguido de perfusión continua, o dosis intermitentes altas) durante 72 horas, periodo de mayor riesgo de resangrado. Los anti-H2 son inferiores a los IBP, la somatostatina no ha demostrado beneficio en supervivencia en el sangrado no varicoso, y la estrategia transfusional restrictiva (no liberal) es la que se asocia a mejor pronóstico según el ensayo de Villanueva et al."},{"q":"En el tratamiento de la hemorragia digestiva alta por hipertensión portal, indique la respuesta INCORRECTA:","o":["La reposición de la volemia ha de ser cautelosa, evitando la sobreexpansión.","No se recomienda el tratamiento antibiótico profiláctico.","La terlipresina reduce la presión portal.","El tratamiento endoscópico de elección en las varices esofágicas es la ligadura con bandas elásticas."],"c":"B","e":"Justo lo contrario: la profilaxis antibiótica (habitualmente ceftriaxona) está indicada de forma sistemática en todo paciente cirrótico con hemorragia digestiva, varicosa o no, ya que reduce la tasa de infecciones bacterianas, el resangrado precoz y la mortalidad. La reposición cautelosa de volemia (evitar sobretransfundir, que eleva la presión portal), la terlipresina y la ligadura con bandas sí son correctas."}]},"35":{"title":"Síndrome diarreico crónico y síndrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.","questions":[{"q":"Señale la asociación radiológica CORRECTA:","o":["Síndrome de Ogilvie: dilatación de todo el intestino delgado y grueso sin stop intestinal.","Vólvulo de sigma: imagen en grano de café con la punta hacia el hipocondrio izquierdo.","Vólvulo cecal: imagen en grano de café con la punta hacia el hipocondrio derecho.","Obstrucción intestinal mecánica de intestino delgado: imagen en pilas de monedas, con asas centrales, niveles hidroaéreos y ausencia de gas distal a la obstrucción."],"c":"D","e":"La imagen en «pilas de monedas» (pliegues circulares completos del yeyuno proximal) con asas centrales dilatadas, niveles hidroaéreos y ausencia de gas distal es la descripción radiológica clásica de la obstrucción mecánica de intestino delgado. El síndrome de Ogilvie afecta predominantemente al colon (no a todo el intestino delgado y grueso), y las puntas del «grano de café» en los vólvulos de sigma y ciego están invertidas respecto a lo que proponen las opciones B y C."},{"q":"Varón con bypass entérico por obesidad mórbida que presenta diarrea crónica con déficit de vitamina B12 pero niveles elevados de ácido fólico. ¿Qué entidad es más probable?","o":["Enfermedad celíaca.","Intolerancia a la lactosa.","Sobrecrecimiento bacteriano intestinal.","Anemia perniciosa."],"c":"C","e":"En el sobrecrecimiento bacteriano de intestino delgado (favorecido por asas ciegas o alteraciones anatómicas tras cirugía bariátrica), las bacterias colónicas consumen la vitamina B12 disponible pero sintetizan folato, generando el patrón característico de B12 baja con folato normal o elevado."},{"q":"En relación al diagnóstico de la enfermedad celíaca, señale la opción FALSA:","o":["En pacientes con déficit selectivo de IgA debe solicitarse anticuerpo antiendomisio o antitransglutaminasa de isotipo IgG.","En pacientes con serología negativa y sospecha razonable debe solicitarse estudio genético HLA-DQ2/DQ8.","En pacientes con estudio genético positivo debe solicitarse endoscopia oral con biopsia duodenal de forma sistemática.","En familiares de primer grado, si el estudio genético es negativo, puede descartarse razonablemente el diagnóstico de celiaquía."],"c":"C","e":"El HLA-DQ2/DQ8 tiene un elevado valor predictivo NEGATIVO (si es negativo, la celiaquía es muy improbable) pero escaso valor predictivo positivo, ya que está presente en el 30-40% de la población general sin enfermedad celíaca; por tanto, un genotipo positivo por sí solo no justifica realizar una biopsia si no hay clínica ni serología sugestivas."},{"q":"Señale la afirmación INCORRECTA con respecto a la enfermedad de Crohn:","o":["Los síntomas más frecuentes son la diarrea crónica y el dolor abdominal.","Las fisuras anales son la manifestación perianal más frecuente.","Se distinguen tres fenotipos: inflamatorio, estenosante y fistulizante.","Es frecuente la positividad de los p-ANCA."],"c":"D","e":"Los p-ANCA son más característicos de la colitis ulcerosa (positivos en 50-70% de los casos); en la enfermedad de Crohn es más típica la positividad de los ASCA (anticuerpos anti-Saccharomyces cerevisiae)."},{"q":"Señale la afirmación CORRECTA en cuanto al tratamiento de la enfermedad inflamatoria intestinal:","o":["La mesalazina tópica es el tratamiento de elección inicial de la proctitis ulcerosa.","La mesalazina tópica y oral combinadas son el tratamiento de elección inicial de la colitis ulcerosa izquierda.","El tratamiento de mantenimiento de la remisión en la enfermedad de Crohn es la budesonida.","Las afirmaciones a y b son correctas."],"c":"D","e":"En la proctitis ulcerosa, la mesalazina tópica (supositorios) es de elección; en la colitis izquierda, la combinación de mesalazina oral y tópica es superior a cualquiera de las dos por separado. La budesonida, en cambio, no es eficaz como tratamiento de mantenimiento a largo plazo en la enfermedad de Crohn (solo para inducción de brotes leves-moderados ileocecales), lo que hace incorrecta la opción C."},{"q":"Mujer de 18 años con acné y tumefacción inguinal dolorosa sin orificio de drenaje que le impide deambular, con algún episodio de diarrea sanguinolenta. Ante la sospecha de hidrosadenitis supurativa, señale lo que NO es cierto:","o":["Respecto a una posible EII asociada, se ha encontrado relación con la enfermedad de Crohn pero no con la colitis ulcerosa.","Está descrita como parte del síndrome autoinflamatorio PAPASH.","En el tratamiento, además de antibióticos orales y AINE, están indicados los corticoides intralesionales.","El estadio III de Hurley se caracteriza por trayectos fistulosos y lesiones cicatriciales."],"c":"A","e":"La hidrosadenitis supurativa se ha asociado tanto a la enfermedad de Crohn como, con menor frecuencia, a la colitis ulcerosa, por lo que limitar la asociación únicamente al Crohn es incorrecto."},{"q":"Señale la respuesta INCORRECTA en relación a la infección por Strongyloides stercoralis:","o":["Se relaciona con el consumo de carne de cerdo poco cocinada.","La serología tiene valor en el seguimiento tras el tratamiento.","Se recomienda tratar los casos asintomáticos (por riesgo de hiperinfestación).","Puede simular una enfermedad inflamatoria intestinal."],"c":"A","e":"Strongyloides stercoralis se transmite por penetración cutánea de larvas filariformes desde el suelo contaminado, no por ingestión de carne de cerdo poco cocinada (esa vía es propia de Taenia solium o Trichinella spiralis)."},{"q":"La prueba del hidrógeno espirado en el síndrome diarreico crónico se utiliza para la evaluación de los siguientes cuadros, EXCEPTO:","o":["Intolerancia a la lactosa.","Intolerancia a la fructosa.","Intolerancia al gluten (enfermedad celíaca).","Sobrecrecimiento bacteriano intestinal."],"c":"C","e":"La enfermedad celíaca se diagnostica mediante serología (antitransglutaminasa/antiendomisio) y biopsia duodenal, no mediante el test del hidrógeno espirado, que sí es útil para intolerancias a hidratos de carbono (lactosa, fructosa) y para el sobrecrecimiento bacteriano."},{"q":"Un paciente con colitis ulcerosa presenta un brote de proctitis leve-moderada. ¿Cuál es el tratamiento de elección?","o":["Mesalazina rectal (supositorios o enemas).","5-aminosalicilatos orales.","Corticoides rectales.","Infliximab durante tres meses."],"c":"A","e":"En la proctitis ulcerosa leve-moderada la mesalazina tópica (rectal) es más eficaz que la vía oral sola para inducir la remisión, reservándose los corticoides rectales para casos que no responden y los biológicos para enfermedad refractaria o extensa."},{"q":"En un paciente con enfermedad celíaca es cierto que:","o":["Existe linfocitosis intraepitelial en la biopsia intestinal.","Cursa con hiperplasia (no atrofia) de las criptas.","Se asocia frecuentemente a HLA-B27 positivo.","Se asocia con frecuencia a diabetes mellitus tipo 2."],"c":"A","e":"El hallazgo histológico característico de la celiaquía es la atrofia vellositaria con hiperplasia críptica (no atrofia de criptas) y aumento de linfocitos intraepiteliales; se asocia a HLA-DQ2/DQ8 (no B27) y a diabetes mellitus tipo 1 (autoinmune), no tipo 2."},{"q":"Las siguientes entidades se asocian de manera característica con la colitis ulcerosa, EXCEPTO:","o":["Colangitis esclerosante primaria.","Eritema nodoso.","Colelitiasis.","Uveítis."],"c":"C","e":"La colelitiasis (por malabsorción de sales biliares) es una asociación característica de la enfermedad de Crohn ileal, no de la colitis ulcerosa; la colangitis esclerosante primaria, el eritema nodoso y la uveítis sí son manifestaciones extraintestinales típicas de la colitis ulcerosa."},{"q":"Mujer de 35 años con colitis ulcerosa reciente que presenta fiebre, distensión abdominal dolorosa, diarrea con múltiples deposiciones y deshidratación, con leucocitosis y anemia. ¿Qué prueba diagnóstica realizaría en primer lugar?","o":["Colonoscopia completa.","Radiografía simple de abdomen.","ANCA-PR3 urgentes.","Ecografía abdominal."],"c":"B","e":"Ante la sospecha de un brote grave con posible megacolon tóxico, la radiografía simple de abdomen es la prueba inicial (rápida, disponible y sin riesgo) para valorar dilatación colónica; la colonoscopia completa está contraindicada en esta fase por el riesgo de perforación."},{"q":"En todos los siguientes procesos, EXCEPTO uno, hay sobrecrecimiento bacteriano intestinal. Señálelo:","o":["Estenosis intestinales múltiples por bridas.","Fístula gastrointestinal.","Hipertiroidismo con diarrea motora.","Divertículos múltiples en intestino delgado."],"c":"C","e":"La diarrea del hipertiroidismo es de causa motora (tránsito acelerado), no por sobrecrecimiento bacteriano; en cambio, cualquier situación que genere estasis intestinal (asas ciegas, estenosis, divertículos, fístulas) predispone al sobrecrecimiento bacteriano."},{"q":"Indique qué enfermedad NUNCA es causa de una seudoobstrucción intestinal:","o":["Esclerodermia.","Cáncer de colon.","Diabetes mellitus (neuropatía autonómica).","Hipotiroidismo."],"c":"B","e":"El cáncer de colon produce obstrucción intestinal MECÁNICA verdadera (por oclusión de la luz), no una seudoobstrucción (que por definición cursa sin causa mecánica y se debe a alteraciones de la motilidad, como en la esclerodermia, la diabetes o el hipotiroidismo)."},{"q":"La colangitis esclerosante primaria puede asociarse con:","o":["Hepatitis crónica autoinmune de forma casi constante.","Enfermedad de Crohn.","Colitis ulcerosa.","Síndrome de inmunodeficiencia adquirida."],"c":"C","e":"Hasta el 70-80% de los pacientes con colangitis esclerosante primaria tienen una colitis ulcerosa asociada (con mucha menor frecuencia, Crohn cólico), relación bien establecida que justifica la vigilancia endoscópica de estos pacientes."},{"q":"¿Cuál de las siguientes afecciones produce típicamente malabsorción de lípidos?","o":["Enfermedad de Crohn.","Enfermedad celíaca.","Síndrome del intestino irritable.","Pancreatitis crónica."],"c":"D","e":"La insuficiencia pancreática exocrina de la pancreatitis crónica (déficit de lipasa) es la causa por excelencia de malabsorción de grasas con esteatorrea; en la celiaquía y el Crohn puede haber malabsorción global, pero el mecanismo predominante no es la falta de lipasa."},{"q":"¿Cuál de los siguientes síntomas es más común en la enfermedad de Crohn en comparación con la colitis ulcerosa?","o":["Diarrea crónica.","Sangrado rectal.","Dolor abdominal tipo cólico.","Pérdida de peso significativa."],"c":"C","e":"El dolor abdominal cólico es más característico del Crohn por su afectación transmural, con tendencia a la formación de estenosis y suboclusiones; el sangrado rectal franco es, en cambio, más típico de la colitis ulcerosa por afectación mucosa continua del recto."},{"q":"La enfermedad de Crohn se caracteriza por:","o":["Afectación transmural del tracto gastrointestinal.","Inflamación limitada al colon.","Presencia de úlceras exclusivamente superficiales en la mucosa.","Presencia constante de pólipos en el intestino delgado."],"c":"A","e":"A diferencia de la colitis ulcerosa (limitada a la mucosa del colon de forma continua), el Crohn afecta transmuralmente cualquier segmento del tubo digestivo (de la boca al ano) de forma segmentaria («en empedrado»), lo que explica su tendencia a fístulas y estenosis."},{"q":"¿Cuál de las siguientes enfermedades está asociada con un mayor riesgo de obstrucción intestinal por adherencias?","o":["Enfermedad inflamatoria intestinal.","Colitis ulcerosa.","Diverticulosis.","Apendicitis aguda."],"c":"A","e":"Los pacientes con enfermedad inflamatoria intestinal (particularmente Crohn) presentan un riesgo elevado de adherencias por la inflamación transmural recurrente y la mayor probabilidad de someterse a múltiples cirugías abdominales a lo largo de su evolución."},{"q":"Mujer de 49 años con diarrea ocasional y distensión abdominal de años de evolución, anemia con ferropenia y déficit de vitamina B12 y fólico, antecedentes familiares similares. Empeoramiento en 6 meses con pérdida de 8 kg. Antiendomisio IgA y antitransglutaminasa tisular 2 IgA positivos. El diagnóstico más probable es enfermedad celíaca. En relación al diagnóstico, señale la respuesta FALSA:","o":["El anticuerpo antiendomisio tiene alta sensibilidad y especificidad.","Todos los pacientes con enfermedad celíaca expresan el alelo HLA-DQ2 o HLA-DQ8.","Se requiere biopsia de intestino delgado para establecer el diagnóstico definitivo.","Los hallazgos anatomopatológicos de la biopsia son patognomónicos y exclusivos de la enfermedad celíaca."],"c":"D","e":"La atrofia vellositaria con hiperplasia críptica no es exclusiva de la celiaquía: puede verse también en el esprúe tropical, el sobrecrecimiento bacteriano, la alergia a proteínas alimentarias o la inmunodeficiencia común variable, entre otras entidades, por lo que la histología debe interpretarse siempre junto con la serología y la clínica."},{"q":"En la misma paciente, con biopsia duodenal concordante con enfermedad celíaca, respecto a la evolución clínica e histológica es FALSO que:","o":["La dieta sin gluten mejorará la clínica y revertirá las alteraciones histológicas.","La causa más frecuente de persistencia de la clínica pese a la restricción de gluten es que la dieta no sea estricta.","La complicación más grave es el desarrollo de un linfoma T asociado a enteropatía.","Algunos pacientes pueden mejorar temporalmente con restricción de lactosa y grasas mientras se espera el efecto completo de la dieta sin gluten."],"c":"C","e":"La complicación más temida de la celiaquía no controlada (sobre todo en formas de diagnóstico tardío o mal cumplimiento) es el linfoma T asociado a enteropatía (EATL) y, en menor medida, el adenocarcinoma de intestino delgado, no la «enteritis eosinofílica», que no es la complicación característicamente descrita en este contexto."}]},"36":{"title":"Pancreatitis aguda y crónica.","questions":[{"q":"Señale la afirmación INCORRECTA en relación con la pancreatitis aguda:","o":["El valor de amilasa sérica se correlaciona con la gravedad y el pronóstico del cuadro.","El valor de amilasa sérica puede ser normal en la pancreatitis alcohólica.","El valor de lipasa sérica es más específico que la hiperamilasemia.","El valor de lipasa sérica es útil en la pancreatitis evolucionada (permanece elevada más tiempo)."],"c":"A","e":"La magnitud de la elevación de amilasa NO se correlaciona con la gravedad ni el pronóstico de la pancreatitis aguda; de hecho, en la pancreatitis alcohólica o en brotes sobre pancreatitis crónica puede ser normal a pesar de un cuadro grave, siendo la lipasa más sensible y específica."},{"q":"Sobre el tratamiento de la necrosis pancreática infectada, señale la afirmación CORRECTA:","o":["Se debe sospechar ante la ausencia de mejoría clínica acompañada de fiebre y colecciones con presencia de gas.","Los microorganismos más frecuentemente implicados son Pseudomonas aeruginosa y grampositivos.","Está indicada la realización de PAAF guiada por TC para tinción de Gram y cultivo.","El desbridamiento quirúrgico se prefiere frente al abordaje percutáneo/endoscópico."],"c":"A","e":"La presencia de gas en las colecciones necróticas en un contexto de fiebre y deterioro clínico es muy sugestiva de infección por gérmenes formadores de gas y debe hacer sospechar necrosis infectada. Los gérmenes más frecuentes son de origen entérico (E. coli, enterobacterias, anaerobios), y el abordaje actual «step-up» prioriza el drenaje percutáneo o endoscópico mínimamente invasivo sobre la cirugía abierta como primera opción."},{"q":"¿Cuál NO es una complicación de la pancreatitis crónica?","o":["Diabetes mellitus.","Malabsorción de vitaminas hidrosolubles.","Pseudoquistes.","Esteatorrea."],"c":"B","e":"En la insuficiencia pancreática exocrina de la pancreatitis crónica la malabsorción afecta característicamente a las vitaminas LIPOsolubles (A, D, E, K), no a las hidrosolubles, por déficit de lipasa y sales biliares para la digestión de grasas."},{"q":"En la pancreatitis post-CPRE (colangiopancreatografía retrógrada endoscópica), señale la respuesta CORRECTA:","o":["Supone la quinta causa de pancreatitis aguda en frecuencia global.","Es más frecuente en varones con dilatación de la vía biliar.","La edad por debajo de 60 años y el sexo femenino son factores predisponentes.","La realización de esfinterotomía no influye en su incidencia."],"c":"C","e":"Son factores de riesgo reconocidos de pancreatitis post-CPRE: sexo femenino, edad joven, disfunción del esfínter de Oddi, canulación difícil/repetida, esfinterotomía pancreática y ausencia de dilatación de la vía biliar; el sexo masculino y la dilatación biliar, en cambio, se asocian a menor riesgo."},{"q":"En la pancreatitis crónica, señale la respuesta INCORRECTA:","o":["La colangiopancreatorresonancia (CPRM) es la mejor técnica para detectar y localizar calcificaciones pancreáticas.","La tomografía computarizada (TC) es útil en estadios avanzados.","La ecografía abdominal convencional solo detecta estadios muy avanzados.","La ultrasonografía endoscópica es la técnica más sensible para el diagnóstico."],"c":"A","e":"La TC sin contraste es la técnica de elección para detectar calcificaciones pancreáticas (muy sensible a las calcificaciones), mientras que la RM/CPRM, al basarse en la señal de fluidos, es poco sensible para visualizar calcio; la ecoendoscopia sigue siendo la prueba más sensible para el diagnóstico global de la pancreatitis crónica."},{"q":"Paciente de 52 años con dolor abdominal, leucocitosis, lipasa y PCR elevadas, y colelitiasis de 4 mm en la ecografía; se diagnostica pancreatitis aguda. ¿Cuáles son las medidas más adecuadas en el manejo inicial?","o":["Dieta absoluta y 3000 ml de Ringer lactato en 24 horas con omeprazol intravenoso.","Ayuno, bolo de Ringer lactato de 15-20 ml/kg seguido de 2-3 ml/kg/hora, y analgesia adecuada.","Dieta absoluta, sueroterapia a 25-30 ml/kg/hora en las primeras 24 horas y analgesia.","Estrategia de reanimación particularizada con determinación seriada de amilasa y BUN cada 8-12 horas."],"c":"B","e":"Las guías actuales (IAP/APA, ACG) recomiendan fluidoterapia guiada con cristaloides (preferiblemente Ringer lactato), iniciando con un bolo de 15-20 ml/kg seguido de un mantenimiento de 2-3 ml/kg/h, ajustando según parámetros de perfusión (diuresis, hematocrito, urea), junto con analgesia adecuada; los regímenes de fluidoterapia muy agresiva (25-30 ml/kg/h) se han abandonado por asociarse a mayor morbilidad."},{"q":"En el diagnóstico de la pancreatitis aguda, señale la respuesta CORRECTA:","o":["El diagnóstico bioquímico requiere una elevación de amilasa y/o lipasa séricas de al menos tres veces el límite superior de la normalidad, en el contexto clínico adecuado.","Existe correlación directa entre la intensidad de la pancreatitis y el grado de elevación de amilasa y lipasa.","Las concentraciones de amilasa pancreática permanecen elevadas durante 7-14 días.","La lipasa sérica puede estar muy reducida cuando existe hipertrigliceridemia grave."],"c":"A","e":"El criterio bioquímico clásico (uno de los tres necesarios junto a la clínica y/o la imagen, según los criterios de Atlanta revisados) es una elevación de amilasa y/o lipasa ≥3 veces el límite superior normal; la magnitud de la elevación NO se correlaciona con la gravedad, la amilasa se normaliza en pocos días (no en 7-14), y en la hipertrigliceridemia grave puede haber falsos NEGATIVOS de amilasa (no de lipasa) por interferencia analítica."},{"q":"Respecto al tratamiento de las complicaciones de la pancreatitis aguda, señale la respuesta CORRECTA:","o":["La antibioticoterapia profiláctica sistemática mejora la supervivencia en la pancreatitis grave.","Los pacientes con triglicéridos séricos superiores a 1000 mg/dl deben manejarse precozmente con plasmaféresis o insulina/heparina.","La aspiración percutánea con aguja fina (PAAF) de la zona necrótica con tinción de Gram y cultivo es útil ante sospecha de infección pancreática.","Los pacientes con colangitis ascendente deben someterse a CPRE tras 7 días de tratamiento antibiótico."],"c":"C","e":"La PAAF guiada por imagen sigue siendo útil para confirmar microbiológicamente la sospecha de necrosis infectada. La profilaxis antibiótica sistemática NO ha demostrado mejorar la supervivencia y no se recomienda de rutina; la hipertrigliceridemia grave se trata de forma precoz (no diferida) con insulina y, si procede, plasmaféresis; y la colangitis aguda asociada requiere CPRE urgente/precoz, no diferida una semana."},{"q":"En cuanto a la pancreatitis aguda, señale la respuesta FALSA:","o":["El riesgo de pancreatitis aguda en personas con cálculos vesiculares menores de 5 mm es unas cuatro veces mayor que con cálculos de mayor tamaño.","La pancreatitis aguda aparece en el 15-20% de los pacientes tras una CPRE.","El uso de un AINE rectal (p. ej. indometacina) reduce la frecuencia de pancreatitis tras CPRE.","La hipertrigliceridemia es causa de pancreatitis aguda en el 1-4% de los casos, con cifras de triglicéridos habitualmente superiores a 1000 mg/dl."],"c":"B","e":"La incidencia real de pancreatitis post-CPRE se sitúa en torno al 3-10% (5% de media) en la mayoría de series, muy por debajo del 15-20% que propone la opción B; el resto de afirmaciones (microlitiasis como factor de riesgo, efecto protector de los AINE rectales, e hipertrigliceridemia como causa poco frecuente pero con cifras muy elevadas) son correctas."},{"q":"Señale la respuesta INCORRECTA sobre la regulación de la secreción pancreática:","o":["El sistema nervioso parasimpático, a través del nervio vago, ejerce un control significativo sobre la secreción pancreática.","Las secreciones del páncreas ENDOCRINO están reguladas en fases (cefálica, gástrica e intestinal) por el sistema neurohormonal.","El bicarbonato es el ion de mayor importancia fisiológica en la secreción pancreática ductal.","El bicarbonato ductal neutraliza el ácido gástrico, favorece la solubilidad de ácidos grasos y biliares y mantiene el pH óptimo para las enzimas pancreáticas."],"c":"B","e":"La regulación neurohormonal en fases cefálica, gástrica e intestinal es característica de la secreción EXOCRINA del páncreas (enzimas digestivas y bicarbonato), no de la secreción endocrina (insulina, glucagón), que se regula fundamentalmente por la glucemia y otros estímulos metabólicos."},{"q":"Señale la respuesta CORRECTA sobre la pancreatitis aguda y su manejo:","o":["La amilasemia no es un factor incluido en los criterios pronósticos de Ranson.","Los pacientes con pancreatitis de causa litiásica precisan sistemáticamente tratamiento antibiótico.","La presencia de pseudoquistes en el contexto de una pancreatitis aguda es indicación de tratamiento antibiótico y drenaje quirúrgico sistemático.","En la pancreatitis crónica evolucionada, la amilasa y la lipasa suelen estar habitualmente elevadas."],"c":"A","e":"Los criterios de Ranson emplean edad, leucocitos, glucemia, LDH y AST al ingreso (y otros parámetros a las 48h), pero NO incluyen la amilasa. Ni la litiasis biliar por sí sola exige antibioterapia sistemática, ni todo pseudoquiste requiere drenaje (la mayoría se vigilan si son asintomáticos), y en la pancreatitis crónica avanzada la destrucción del parénquima acinar hace que amilasa y lipasa puedan ser normales o incluso bajas."},{"q":"Paciente de 62 años con etilismo crónico ingresado por pancreatitis aguda con buena evolución. A las 3 semanas se objetiva en ecografía una colección quística de 3 cm en contacto con la pared posterior gástrica, asintomática. ¿Cuál es la actitud inmediata más correcta?","o":["Drenaje percutáneo de la colección.","Tratamiento quirúrgico del pseudoquiste.","Drenaje endoscópico de la colección.","Seguimiento con ecografías seriadas."],"c":"D","e":"Los pseudoquistes pancreáticos asintomáticos, especialmente los de pequeño tamaño (\\<4-6 cm) y de aparición relativamente precoz, tienen una alta probabilidad de resolución espontánea, por lo que la actitud recomendada es la observación con controles de imagen seriados; el drenaje (percutáneo, endoscópico o quirúrgico) se reserva para pseudoquistes sintomáticos, complicados o en crecimiento progresivo."},{"q":"¿Cuál de las siguientes NO es una complicación secundaria de la pancreatitis crónica?","o":["Dolores óseos (por necrosis grasa de la médula ósea).","Ictericia (por compresión de la vía biliar intrapancreática).","Eritema nodoso.","Retinopatía carencial (por déficit de vitamina A)."],"c":"C","e":"El eritema nodoso no forma parte de las complicaciones reconocidas de la pancreatitis crónica (se relaciona más con sarcoidosis, EII o infecciones estreptocócicas); en cambio, sí son complicaciones descritas la paniculitis/necrosis grasa con dolor óseo, la ictericia obstructiva por compresión biliar y la retinopatía por malabsorción de vitaminas liposolubles."},{"q":"¿Cuál de las siguientes afirmaciones sobre la pancreatitis crónica es correcta?","o":["Es una enfermedad de inicio agudo y corta duración.","Es causada principalmente por el consumo excesivo de alcohol.","Es reversible con el tratamiento adecuado.","No se asocia con complicaciones a largo plazo."],"c":"B","e":"El alcohol es la causa más frecuente de pancreatitis crónica en el mundo occidental, seguido a mayor distancia por causas genéticas, autoinmunes, obstructivas e idiopáticas; a diferencia de la pancreatitis aguda, es un proceso irreversible con fibrosis progresiva y complicaciones a largo plazo (diabetes, insuficiencia exocrina, dolor crónico)."},{"q":"¿Cuál de las siguientes complicaciones es más común en la pancreatitis aguda grave?","o":["Ascitis pancreática.","Colelitiasis.","Trombosis venosa profunda.","Absceso o colección necrótica infectada."],"c":"D","e":"La sobreinfección de las colecciones necróticas peripancreáticas es la complicación local más temida y relativamente frecuente de la pancreatitis aguda grave, asociándose a un incremento sustancial de la mortalidad si no se trata adecuadamente (drenaje/desbridamiento y antibioterapia dirigida)."},{"q":"¿Cuál de las siguientes afirmaciones es cierta acerca de la pancreatitis aguda?","o":["Es una enfermedad crónica y progresiva.","Puede ser causada por el consumo excesivo de alcohol.","Su causa más común es la obesidad.","Se caracteriza por una inflamación crónica del páncreas."],"c":"B","e":"Junto a la litiasis biliar, el consumo excesivo de alcohol es una de las dos causas más frecuentes de pancreatitis aguda; se trata, por def
