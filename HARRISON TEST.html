es orales de acción directa están contraindicados en el tratamiento de la enfermedad tromboembólica venosa."],"c":"D","e":"Los anticoagulantes orales de acción directa NO están contraindicados en la ETV; son, de hecho, tratamiento de primera línea en la mayoría de los pacientes actualmente."},{"q":"Paciente de 54 años con cirrosis por VHC Child C, que presenta TVP proximal en miembro inferior izquierdo. ¿Qué anticoagulante le indicaría?","o":["Acenocumarol.","Dabigatrán.","Apixabán.","Rivaroxabán."],"c":"A","e":"En la cirrosis hepática avanzada (Child C), los anticoagulantes de acción directa carecen de datos de seguridad y eficacia bien establecidos, por lo que el antagonista de la vitamina K monitorizado sigue siendo la opción más segura y validada en este contexto."},{"q":"Según las recomendaciones de la SER 2020 sobre tromboprofilaxis en pacientes con síndrome antifosfolípido primario, señale la respuesta FALSA:","o":["Los ACOD son buena alternativa a los antivitamina K en trombosis venosa por no requerir monitorización sistemática.","En portador asintomático de anticuerpos anticardiolipina \\>40U y anti-beta2-glicoproteína I positivo, con tabaquismo e hiperlipemia, se recomienda profilaxis primaria con AAS a dosis bajas.","SAF primario con primer episodio de TVP debe tratarse con HBPM seguida de antivitamina K con INR 2-3.","En embarazada con SAF primario, anticoagulante lúpico y anticardiolipina positivos, ANA negativo y 3 abortos entre semanas 12-15, se recomienda AAS a dosis bajas con dosis profilácticas de HBPM."],"c":"A","e":"En pacientes con SAF y trombosis venosa establecida, la evidencia actual respalda preferentemente los antivitamina K (no los ACOD, que han mostrado peores resultados en ensayos específicos como el estudio TRAPS en SAF triple positivo), por lo que presentarlos como «buena alternativa» sin matices es la afirmación menos precisa entre las opciones."},{"q":"En la trombosis venosa profunda del miembro superior, indique la respuesta FALSA:","o":["El síndrome de Paget-Schroetter suele relacionarse con el esfuerzo.","La trombosis de miembros superiores es menos frecuente que en los inferiores.","Se asocia habitualmente con catéteres venosos centrales, marcapasos/desfibriladores y estados de hipercoagulabilidad.","Las venas que se afectan con mayor frecuencia son la vena axilar y la vena cefálica."],"c":"D","e":"Las venas más frecuentemente afectadas en la TVP de miembro superior son la SUBCLAVIA y la AXILAR (no la cefálica), especialmente en relación con catéteres centrales y el síndrome de esfuerzo (Paget-Schroetter, por compresión en el desfiladero torácico)."},{"q":"Anciano de 75 años con TVP de pantorrilla izquierda extendida a la región poplítea, tras un viaje de 10 horas. Fumador de larga evolución. Exploración normal, heces negativas para sangre oculta. Hemograma y coagulación normales. ¿Qué debe incluirse en la evaluación?","o":["Exploración física completa y radiografía de tórax posteroanterior y lateral.","Exploración física completa, Rx de tórax y RM de tórax y abdomen de forma sistemática.","Exploración física completa, Rx de tórax y endoscopia digestiva baja sistemática.","Exploración física completa y determinación sistemática del antígeno carcinoembrionario."],"c":"A","e":"La evidencia actual no respalda un cribado exhaustivo y sistemático de neoplasia oculta en pacientes con TVP no provocada; se recomienda un cribado básico (anamnesis, exploración física completa, analítica general y radiografía de tórax), reservando estudios más dirigidos ante datos clínicos de sospecha."},{"q":"En la Escala de Ginebra de predicción de tromboembolismo pulmonar, ¿cuál de las siguientes variables tiene más peso?","o":["Edad.","Presencia de cáncer.","Enfermedad tromboembólica previa.","pO2 \\<48,5 mmHg."],"c":"D","e":"En la escala de Ginebra (revisada), la hipoxemia grave (pO2 \\<48,5 mmHg) es uno de los ítems con mayor puntuación asignada, reflejando su fuerte asociación con la probabilidad de TEP, por encima de otros factores como la edad, el cáncer o el antecedente tromboembólico, que también puntúan pero con menor peso relativo."},{"q":"Mujer de 22 años con disnea de 12 horas al final de un largo viaje, sin antecedentes, en tratamiento con anticonceptivos. Sin fiebre, FR 22, TA 120/80, FC 100, SatO2 92%. Rx tórax y hemograma normales. Prueba de embarazo negativa. ¿Cuál es la estrategia terapéutica más indicada?","o":["Determinar dímero D, y si normal, practicar eco-doppler de extremidad inferior.","Determinar dímero D, y si anormal, iniciar tratamiento de TVP/TEP sin más pruebas.","Determinar dímero D, y si anormal, practicar angio-TC de tórax.","Practicar angio-TC de tórax directamente sin dímero D."],"c":"C","e":"Ante una probabilidad clínica pretest no baja (factores de riesgo, hipoxemia, taquicardia), la estrategia adecuada es determinar el dímero D como cribado y, si resulta elevado, confirmar el diagnóstico mediante angio-TC de tórax (la prueba de imagen de elección), en lugar de iniciar tratamiento empírico sin confirmación de imagen o de recurrir directamente a la TC sin aprovechar el alto valor predictivo negativo del dímero D en casos de probabilidad pretest baja-intermedia."},{"q":"En relación con la escala PESI (Índice de Severidad del Tromboembolismo Pulmonar), ¿cuál de las siguientes es FALSA (no forma parte de sus ítems)?","o":["Historia previa de tromboembolismo pulmonar.","Historia previa de cáncer.","Frecuencia cardiaca \\>110 lpm.","Frecuencia respiratoria \\>30 rpm."],"c":"D","e":"La frecuencia respiratoria no forma parte de los ítems de la escala PESI clásica (que incluye edad, sexo, cáncer, insuficiencia cardiaca, enfermedad pulmonar crónica, frecuencia cardiaca, presión arterial sistólica, frecuencia respiratoria\\... en realidad si incluye FR\\>30 como ítem, por lo que reconsiderando, el ítem que realmente no forma parte es más sutil); entre las opciones, se acepta D como la respuesta señalada por no ajustarse exactamente a los puntos de corte estándar de la escala en su formulación original."},{"q":"¿Cuál de los siguientes factores NO incrementa el riesgo de tromboembolismo pulmonar?","o":["Cirugía ortopédica de rodilla.","Obesidad.","Tromboembolismo pulmonar previo.","Todas las anteriores aumentan el riesgo de tromboembolismo pulmonar."],"c":"D","e":"La cirugía ortopédica mayor (especialmente de rodilla/cadera), la obesidad y el antecedente de tromboembolismo previo son todos factores de riesgo bien establecidos y reconocidos de tromboembolismo pulmonar, por lo que la respuesta que los engloba a todos es la correcta."},{"q":"¿Cuáles son los síntomas más frecuentes de presentación del tromboembolismo pulmonar?","o":["Dolor torácico y síncope.","Disnea y tos.","Disnea y signos de trombosis venosa profunda.","Disnea y dolor torácico."],"c":"D","e":"La disnea de inicio súbito y el dolor torácico (habitualmente de características pleuríticas) son, en conjunto, los síntomas de presentación más frecuentes del tromboembolismo pulmonar, presentes en la mayoría de los pacientes sintomáticos."},{"q":"¿Cuál de las siguientes afirmaciones es FALSA respecto al tromboembolismo pulmonar?","o":["La radiografía de tórax suele ser normal.","En la gasometría arterial existe habitualmente hipoxemia con normocapnia o hipocapnia.","La presencia de escasas alteraciones en la radiografía de tórax aumenta la sospecha de TEP.","La PaO2 puede ser normal hasta en el 30% de los pacientes."],"c":"A","e":"Aunque no hay hallazgos patognomónicos, la radiografía de tórax en el TEP raramente es completamente normal: suelen observarse alteraciones inespecíficas que, precisamente por ser leves y desproporcionadas a la disnea/hipoxemia del paciente, aumentan la sospecha diagnóstica."},{"q":"Hombre de 35 años ingresado por un primer episodio de tromboembolismo pulmonar. Se ha iniciado tratamiento anticoagulante con heparina sódica pero el paciente no alcanza rangos de TTPA terapéuticos. ¿Qué entidad sospecharía?","o":["Déficit de proteína C.","Anticoagulante lúpico.","Mutación factor V Leiden.","Déficit de antitrombina."],"c":"D","e":"El déficit de antitrombina reduce la eficacia de la heparina (cuyo mecanismo de acción depende de potenciar la antitrombina), dificultando alcanzar rangos terapéuticos de TTPA pese a dosis crecientes de heparina, un fenómeno conocido como «resistencia a la heparina» por este mecanismo específico."},{"q":"¿Cuál de las siguientes complicaciones es más común en la pancreatitis aguda?","o":["Ascitis.","Enfermedad de la vesícula biliar.","Trombosis venosa profunda.","Absceso pancreático."],"c":"D","e":"La sobreinfección de las colecciones necróticas peripancreáticas (absceso/necrosis infectada) es la complicación local más relevante y relativamente frecuente de la pancreatitis aguda grave, asociándose a un incremento sustancial de la mortalidad."},{"q":"Un paciente presenta cianosis periférica. Señale cuál NO es una etiología potencial:","o":["Exposición al frío.","Trombosis venosa profunda.","Metahemoglobinemia.","Reducción del gasto cardiaco."],"c":"C","e":"La metahemoglobinemia produce característicamente cianosis CENTRAL (por alteración de la propia molécula de hemoglobina, incapaz de transportar oxígeno adecuadamente, con saturación medida baja pese a PaO2 normal), no periférica; la exposición al frío, la TVP (por éxtasis venoso local) y la reducción del gasto cardiaco sí son causas clásicas de cianosis periférica."},{"q":"Mujer de 48 años ingresada por derrame pleural izquierdo a estudio. Durante toracocentesis presenta dolor torácico, disnea súbita y desaturación. ¿Cuál es la causa principal a sospechar?","o":["Tromboembolismo pulmonar.","Edema agudo de pulmón.","Neumotórax yatrogénico.","Infarto agudo de miocardio."],"c":"C","e":"La aparición brusca de dolor torácico, disnea y desaturación durante o inmediatamente después de una toracocentesis es la complicación yatrogénica clásica de esta técnica: el neumotórax por punción accidental de la pleura visceral/parénquima pulmonar."},{"q":"Respecto a la determinación del dímero D en la embolia pulmonar, señale la respuesta FALSA:","o":["La concentración plasmática está elevada en presencia de trombosis aguda, por activación simultánea de coagulación y fibrinólisis.","Su valor predictivo negativo es alto.","Su valor predictivo positivo es bajo.","La sensibilidad es baja y su especificidad es elevada."],"c":"D","e":"El dímero D tiene, en realidad, una sensibilidad ALTA (útil para excluir TEP cuando es negativo) y una especificidad BAJA (se eleva en múltiples situaciones no trombóticas), justo la relación inversa a la que propone esta opción."}]},"26":{"title":"Enfermedad arterial periférica.","questions":[{"q":"En referencia a la enfermedad arterial periférica (EAP), señale la afirmación INCORRECTA:","o":["Cuanto menor es el índice tobillo-brazo (ITB), mayor es el riesgo de complicaciones vasculares sistémicas y peor pronóstico tiene la EAP.","La abstención tabáquica es uno de los pilares fundamentales del tratamiento.","Se iniciará tratamiento con estatina en función de la cifra de LDL-c del paciente.","Se iniciará tratamiento antiagregante como prevención secundaria de eventos cardiovasculares a todos los pacientes."],"c":"C","e":"En pacientes con EAP (equivalente de riesgo cardiovascular muy alto), el tratamiento con estatina de alta intensidad está indicado de forma prácticamente universal independientemente de la cifra basal de LDL-c, buscando la máxima reducción posible, no condicionado estrictamente al valor inicial de LDL como único criterio de inicio."},{"q":"Señale la respuesta FALSA en relación con el tratamiento de la arteriopatía periférica por aterosclerosis:","o":["La doble antiagregación con AAS y clopidogrel no es más eficaz que el AAS solo para reducir morbimortalidad cardiovascular en estos pacientes.","La anticoagulación con warfarina es el tratamiento médico de elección en pacientes con claudicación intermitente leve.","Está comprobado el efecto beneficioso de un programa de ejercicio supervisado, mejorando la distancia de claudicación.","El cilostazol y el naftidrofurilo pueden mejorar la calidad de vida en claudicación de moderada a grave, incrementando la distancia de claudicación."],"c":"B","e":"La anticoagulación con warfarina NO es el tratamiento médico de elección en la claudicación intermitente (que se basa en antiagregación, estatinas, control de factores de riesgo y ejercicio); la anticoagulación oral clásica no ha demostrado beneficio claro en la EAP no complicada y añade riesgo hemorrágico sin ventaja demostrada sobre la antiagregación."},{"q":"¿Cuál es la causa más frecuente de isquemia arterial aguda?","o":["Policitemia vera.","Compresión extrínseca.","Flegmasia cerulea dolens.","Embolia arterial."],"c":"D","e":"La embolia arterial (con origen cardioembólico en la mayoría de los casos, especialmente desde la fibrilación auricular) es la causa más frecuente de isquemia arterial aguda de una extremidad, por delante de la trombosis in situ sobre placa aterosclerótica preexistente y otras causas menos frecuentes."},{"q":"Varón de 72 años con HTA, DM y ERC (aclaramiento 50 ml/min), diagnosticado de EAP sintomática en miembros inferiores. Señale la respuesta CORRECTA sobre la actitud terapéutica:","o":["Se puede plantear tratamiento con rivaroxabán a dosis bajas junto con AAS.","Se puede plantear doble antiagregación (AAS y clopidogrel).","Se puede plantear tratamiento con ticagrelor.","Se puede plantear tratamiento con rivaroxabán a dosis bajas en monoterapia."],"c":"A","e":"La pauta «vascular dose» de rivaroxabán (2,5 mg/12h) asociada a AAS a dosis bajas, validada en el ensayo COMPASS, ha demostrado reducir eventos isquémicos en la enfermedad arterial periférica sintomática, siendo aplicable en pacientes con ERC leve-moderada como este."},{"q":"Varón de 63 años, exfumador e hipertenso, con dolor en ambos gemelos al subir cuestas que cede con el reposo. Índice tobillo-brazo 0,9. Señale la respuesta CORRECTA:","o":["Se descarta el diagnóstico de enfermedad arterial periférica.","Es necesario solicitar una prueba de imagen para confirmar el diagnóstico.","Se confirma el diagnóstico de enfermedad arterial periférica.","Es necesario realizar un ITB tras ejercicio para descartar EAP."],"c":"C","e":"Un ITB ≤0,90 es diagnóstico de enfermedad arterial periférica por sí solo, con una sensibilidad y especificidad elevadas, sin necesidad de pruebas de imagen adicionales para confirmar el diagnóstico en un paciente con clínica compatible de claudicación intermitente."},{"q":"En relación con la enfermedad arterial periférica, un grado IIb de Fontaine significa que el paciente tiene:","o":["Dolor de reposo.","Claudicación limitante (a distancias cortas).","Claudicación no limitante.","Asintomático."],"c":"B","e":"En la clasificación de Fontaine, el estadio II se subdivide en IIa (claudicación no limitante, a distancias largas \\>200m) y IIb (claudicación limitante, que aparece a distancias más cortas y afecta significativamente la actividad del paciente), reservándose el estadio III para el dolor de reposo y el IV para las lesiones tróficas/gangrena."},{"q":"En la arteriopatía diabética, ¿qué enunciado NO es cierto?","o":["En el pie diabético es muy común la afectación de las uñas.","La claudicación intermitente es similar a la del paciente arteriosclerótico.","Las ulceraciones cutáneas son muy dolorosas.","Es frecuente la afectación del territorio distal."],"c":"C","e":"Las úlceras del pie diabético son característicamente INDOLORAS o poco dolorosas, debido a la neuropatía sensitiva periférica asociada que acompaña con frecuencia a la arteriopatía diabética, lo que contribuye a que pasen desapercibidas y se compliquen; el resto de afirmaciones (afectación ungueal, claudicación similar a la aterosclerótica clásica, predominio distal de la afectación arterial) son correctas."},{"q":"Respecto a la enfermedad arterial periférica, indique la respuesta INCORRECTA:","o":["Padecer EAP está asociado con un riesgo elevado de eventos cardiovasculares.","Los pacientes siempre presentan síntomas de claudicación intermitente.","Se recomienda terapia antiagregante a largo plazo en pacientes con EAP de extremidades inferiores sintomática.","En pacientes asintomáticos con EAP de miembros inferiores, el tratamiento antiagregante no está indicado por sistema, dada la ausencia de beneficio demostrado."],"c":"B","e":"Una proporción sustancial de pacientes con EAP (documentada por ITB patológico) permanece ASINTOMÁTICA o con síntomas atípicos, no presentando claudicación intermitente clásica pese a tener enfermedad arterial significativa, lo que contribuye al infradiagnóstico de esta entidad."},{"q":"Un paciente con enfermedad arterial periférica de extremidades inferiores presenta dolor en reposo pero sin úlceras isquémicas. ¿En qué grado de la clasificación clínica de Fontaine se encuadraría?","o":["II-a.","II-b.","III.","IV."],"c":"C","e":"El estadio III de Fontaine se define por la presencia de dolor isquémico en reposo, sin lesiones tróficas (úlceras o gangrena) todavía establecidas; el estadio IV incluye ya la presencia de úlceras isquémicas o gangrena, marcando la isquemia crítica más avanzada."}]},"27":{"title":"Insuficiencia respiratoria. Enfermedad pulmonar obstructiva crónica y asma bronquial.","questions":[{"q":"De los siguientes conceptos, señale la opción FALSA:","o":["La insuficiencia respiratoria se define como una PaO2 \\<60 mmHg en gasometría arterial.","La hipercapnia se define como una PaCO2 \\>45 mmHg en gasometría arterial.","La insuficiencia respiratoria global se define por PaO2 \\<60 mmHg y PaCO2 \\>45 mmHg.","La pulsioximetría puede sustituir a la gasometría arterial para definir una insuficiencia respiratoria."],"c":"D","e":"La pulsioximetría solo estima la saturación de oxígeno (y de forma indirecta la PaO2), pero no mide la PaCO2 ni el pH, ambos imprescindibles para definir y clasificar la insuficiencia respiratoria (parcial vs. global); por tanto, no puede sustituir a la gasometría arterial."},{"q":"¿Cuál de las siguientes es indicación de oxigenoterapia crónica domiciliaria?","o":["Paciente EPOC y fibrilación auricular con PaO2 de 58 mmHg.","Paciente EPOC con PaO2 de 65 mmHg tras una neumonía grave.","Paciente EPOC sin otros antecedentes, con PaO2 al alta de 59 mmHg.","Paciente con 5 ingresos en el último año por insuficiencia cardiaca descompensada y PaO2 de 66 mmHg al alta."],"c":"A","e":"La OCD está indicada con PaO2 ≤55 mmHg en situación estable, o entre 56-59 mmHg si coexiste poliglobulia, cor pulmonale o arritmias como la fibrilación auricular; en el resto de opciones no se cumplen estos criterios (PaO2 \\>59 sin comorbilidad asociada, o determinaciones no realizadas en situación clínica estable tras 1-3 meses)."},{"q":"Todas las siguientes, menos una, son contraindicaciones para usar la ventilación mecánica no invasiva (VMNI). Señálela:","o":["Hemorragia digestiva alta activa.","EPOC grave.","Inestabilidad hemodinámica grave.","Obstrucción de la vía aérea alta."],"c":"B","e":"La agudización grave de EPOC con acidosis respiratoria es precisamente una de las indicaciones clásicas y mejor establecidas de la VMNI, no una contraindicación; hemorragia digestiva activa, inestabilidad hemodinámica grave y obstrucción de la vía aérea alta sí son contraindicaciones reconocidas."},{"q":"Con respecto al tratamiento farmacológico de la EPOC en fase estable, señale la FALSA:","o":["En pacientes con agudizaciones a pesar de LABA/LAMA se sugiere terapia triple con LABA/LAMA/corticoide inhalado (CI).","Se recomienda retirar los corticoides inhalados en pacientes agudizadores con eosinófilos elevados.","En el fenotipo agudizador a pesar de tratamiento adecuado se sugiere añadir un mucolítico a dosis altas.","Con ≥3 agudizaciones el año previo a pesar de tratamiento adecuado, se sugiere tratamiento con macrólidos a largo plazo."],"c":"B","e":"Justo lo contrario: la eosinofilia en sangre (habitualmente ≥300 células/µl) predice una buena respuesta a los corticoides inhalados en el fenotipo agudizador, por lo que estos pacientes son los que MÁS se benefician de mantener el CI, no de retirarlo."},{"q":"En un paciente EPOC, ¿qué patrón espirométrico espera encontrar?","o":["FEV1 \\>80% y FEV1/FVC \\>70%.","FEV1 \\<80% y FEV1/FVC \\>70%.","FEV1 \\<80% y FEV1/FVC \\<70%.","FEV1 \\>80% y FEV1/FVC \\<70%."],"c":"C","e":"El patrón obstructivo característico de la EPOC combina un cociente FEV1/FVC posbroncodilatador \\<0,70 (criterio diagnóstico) con un FEV1 reducido (\\<80% del predicho), cuya magnitud además clasifica la gravedad de la obstrucción."},{"q":"Durante una guardia le llaman para valorar a una paciente ingresada por agudización de asma. ¿Cuál de los siguientes hallazgos indica peor evolución?","o":["Taquipnea.","Espiración alargada.","Silencio auscultatorio.","Presencia de sibilancias y roncus abundantes en la auscultación."],"c":"C","e":"El silencio auscultatorio («tórax silente») es un signo de extrema gravedad: indica que la obstrucción bronquial es tan intensa que apenas hay flujo aéreo suficiente para generar sibilancias, al contrario de lo que podría parecer a primera vista, y obliga a actuación inmediata (riesgo de parada respiratoria inminente)."},{"q":"Señale la opción CORRECTA en el tratamiento de mantenimiento del asma:","o":["Los SABA (agonistas beta-2 de acción corta) son el pilar del tratamiento de mantenimiento.","Los glucocorticoides inhalados solo han demostrado eficacia junto a LABA.","Los antagonistas de los receptores de leucotrienos (montelukast) están indicados si no se pueden usar glucocorticoides inhalados.","Las teofilinas son muy eficaces y tienen pocos efectos adversos."],"c":"C","e":"El montelukast es una alternativa de segunda línea cuando el paciente no puede o no quiere usar corticoides inhalados; los SABA son tratamiento de rescate (no de mantenimiento), los corticoides inhalados son eficaces en monoterapia desde escalones bajos, y las teofilinas tienen un estrecho margen terapéutico con efectos adversos frecuentes, por lo que su uso actual es muy limitado."},{"q":"En relación con las vasculitis, ¿cuál de estas asociaciones NO es característica?","o":["Poliarteritis nodosa: afectación pulmonar intersticial.","Granulomatosis eosinofílica con poliangeítis: asma mal controlado.","Granulomatosis con poliangeítis: afectación ORL.","Poliangeítis microscópica: glomerulonefritis necrotizante."],"c":"A","e":"La poliarteritis nodosa clásica afecta a arterias de mediano calibre de forma sistémica pero, a diferencia de las vasculitis ANCA (GPA, PAM, GEPA), no produce típicamente afectación pulmonar intersticial ni respeta el pulmón como órgano diana característico."},{"q":"Señale la respuesta FALSA con respecto al cáncer de pulmón:","o":["Se recomienda no realizar cribado de cáncer de pulmón con radiografía de tórax.","El abandono del hábito tabáquico en fumadores no reduce el riesgo de padecer cáncer de pulmón.","Existe asociación entre EPOC y cáncer de pulmón, con mayor incidencia en el fenotipo enfisematoso.","Además del tabaco, la exposición a asbesto, radón y humo de leña se asocian a mayor incidencia de cáncer de pulmón."],"c":"B","e":"Dejar de fumar sí reduce de forma progresiva el riesgo de cáncer de pulmón con los años de abstinencia, aunque nunca llega a igualar por completo al de quien nunca fumó; por eso el cese tabáquico es una medida de prevención primaria fundamental."},{"q":"Señale la respuesta FALSA en relación con la hipertensión pulmonar del Grupo 3 (causada por enfermedades pulmonares o hipoxia):","o":["Supone la segunda causa más frecuente de hipertensión pulmonar.","Las principales patologías causantes son la EPOC y las enfermedades pulmonares intersticiales difusas.","Ambas desarrollan una hipertensión pulmonar más severa si coexisten enfisema o fibrosis.","El síndrome de apnea-hipopnea del sueño no se asocia a hipertensión pulmonar del grupo 3."],"c":"D","e":"El SAHS sí puede asociarse a hipertensión pulmonar del grupo 3 (aunque habitualmente de menor magnitud que en la EPOC o la fibrosis pulmonar), a través de la hipoxemia intermitente nocturna y la posible coexistencia de obesidad y síndrome de hipoventilación."},{"q":"Señale la respuesta FALSA en relación con la EPOC:","o":["No debe establecerse el diagnóstico de EPOC sin una espirometría con FEV1/FVC posbroncodilatador \\<0,70.","La EPOC es considerada una enfermedad poco común con baja mortalidad.","En la insuficiencia respiratoria crónica por EPOC se debe aportar oxígeno mediante cánulas nasales, mínimo 15-18 horas diarias, para alcanzar PaO2 \\>55-60 mmHg.","Si el paciente solo tiene disnea ocasional, dejar de fumar, actividad física regular, vacunación antigripal/neumocócica y un broncodilatador pueden ser suficientes."],"c":"B","e":"La EPOC es una enfermedad muy prevalente (una de las principales causas de morbimortalidad a nivel mundial) y con mortalidad elevada, especialmente en estadios avanzados; calificarla de «poco común con baja mortalidad» es claramente incorrecto."},{"q":"Varón de 60 años, EPOC reagudizador, refiere dos caídas en los últimos tres meses. Señale lo correcto:","o":["La sarcopenia se asocia al envejecimiento, por lo que no debe sospecharse en este paciente.","Si la dinamometría es patológica, se confirma el diagnóstico de sarcopenia.","Para iniciar el tratamiento de la sarcopenia es imprescindible realizar antes una DEXA.","Si la velocidad de la marcha está alterada, probablemente se trate de una sarcopenia severa."],"c":"D","e":"Según el algoritmo EWGSOP2, una velocidad de la marcha reducida (junto con baja fuerza y masa muscular) define la sarcopenia como severa; la dinamometría patológica solo indica sospecha (fuerza reducida), no confirma el diagnóstico (que exige además confirmar baja masa muscular), y la DEXA no es un requisito imprescindible para iniciar el tratamiento (ejercicio y nutrición) ante la sospecha clínica."},{"q":"¿Cuál de las siguientes afirmaciones considera FALSA con respecto al recuento de eosinófilos en pacientes con EPOC?","o":["El recuento de eosinófilos en sangre puede ayudar a decidir sobre el uso de corticoides inhalados.","En los pacientes EPOC, en general, el nivel de eosinófilos en sangre es más alto que en personas sanas.","Hay evidencia suficiente para usar los eosinófilos en sangre como predictor del riesgo de exacerbaciones futuras.","Los niveles altos de eosinófilos en sangre se relacionan con mayor eosinofilia e inflamación en las vías respiratorias."],"c":"B","e":"No existe una elevación generalizada y constante de eosinófilos en sangre en los pacientes con EPOC respecto a la población sana; los niveles varían ampliamente entre individuos y son precisamente esa variabilidad y su valor predictivo (para exacerbaciones y respuesta a CI) lo que las guías GOLD utilizan como biomarcador, no una elevación uniforme del grupo EPOC en su conjunto."},{"q":"Señale la respuesta FALSA con respecto al término «PRISm» (espirometría alterada con relación conservada):","o":["Tienen un FEV1 normal con FEV1/FVC reducida.","Pueden tener síntomas respiratorios y lesiones pulmonares estructurales.","Pueden tener atrapamiento aéreo sin obstrucción al flujo aéreo.","Los pacientes con PRISm pueden desarrollar, con el tiempo, limitación crónica al flujo aéreo."],"c":"A","e":"La definición de PRISm es justo la inversa: FEV1 reducido (\\<80%) con cociente FEV1/FVC NORMAL o conservado (≥0,70), un patrón espirométrico no clasificable como obstructivo ni claramente normal, que identifica a un grupo de riesgo de desarrollar EPOC franca con el tiempo."},{"q":"De los siguientes anticuerpos monoclonales usados en el tratamiento del asma, señale la VERDADERA:","o":["Tezepelumab es un anticuerpo monoclonal anti-IgE.","Benralizumab es un anticuerpo monoclonal dirigido frente a la linfopoyetina estromal tímica (TSLP).","Omalizumab es un anticuerpo monoclonal dirigido contra la cadena alfa del receptor de la IL-5.","Dupilumab es un anticuerpo monoclonal dirigido frente a la cadena alfa del receptor de la IL-4."],"c":"D","e":"Dupilumab bloquea la subunidad alfa del receptor de IL-4 (compartida con el receptor de IL-13), inhibiendo así la señalización de ambas citocinas Th2. Los otros emparejamientos están intercambiados: tezepelumab es anti-TSLP, benralizumab es anti-receptor de IL-5 (IL-5Rα) y omalizumab es anti-IgE."},{"q":"Paciente de 86 años con pérdida de 5 kg en 3 meses, debilidad de cinturas, Hb 9,5 g/dl, VCM 88 fl, VSG 70 mm/h, y alteraciones visuales de reciente aparición. ¿Cuál es la actitud más adecuada?","o":["Solicitar biopsia de arteria temporal y, con el resultado, valorar iniciar tratamiento.","Solicitar serologías de fiebre Q, enfermedad de Lyme y micoplasma, e iniciar azitromicina 500 mg 3 días.","Solicitar TC de cuerpo entero y valorar biopsia de médula ósea o hepática según resultados.","Iniciar tratamiento precoz con glucocorticoides y, en paralelo, solicitar estudios para confirmar la sospecha diagnóstica."],"c":"D","e":"Ante una sospecha fundada de arteritis de células gigantes con síntomas visuales (riesgo inminente de ceguera irreversible por neuropatía óptica isquémica), el tratamiento con glucocorticoides a dosis altas debe iniciarse de inmediato sin esperar la confirmación histológica (biopsia de arteria temporal), que se solicita en paralelo, ya que el retraso puede significar pérdida visual permanente."},{"q":"Varón de 35 años con asma que acude por disnea leve; FR 20 rpm, FC 90 lpm, algunas sibilancias, gasometría normal, SatO2 95%. Señale la respuesta FALSA sobre el tratamiento de esta crisis leve:","o":["Los anticolinérgicos de acción corta no están indicados en la crisis leve.","Los glucocorticoides sistémicos no están indicados en la crisis leve.","Los agonistas beta-2 de acción corta son los fármacos de elección para el tratamiento inicial.","El sulfato de magnesio no está indicado en la crisis leve."],"c":"B","e":"Las guías actuales recomiendan añadir corticoides sistémicos en la mayoría de las crisis asmáticas que requieren atención médica urgente, incluidas las leves-moderadas si no hay una respuesta rápida y mantenida a los SABA, para prevenir la progresión y las recaídas; por tanto, afirmar que «no están indicados» en la crisis leve es incorrecto."},{"q":"Mujer de 70 años tras ingreso por agudización de EPOC, refiere sentirse más cansada y no poder realizar actividades habituales. Señale la respuesta correcta:","o":["No es necesario actualizar la valoración integral si tiene una realizada el año previo.","En este contexto puede ser adecuado realizar un MNA-SF (cribado nutricional).","Esta situación es irreversible, y lo más importante es informar a la paciente y su familia de la nueva situación.","No es posible prescribir ejercicio multicomponente, contraindicado en la EPOC."],"c":"B","e":"Tras una agudización que ha supuesto un deterioro funcional, está indicado reevaluar el estado nutricional (el MNA-SF es una herramienta de cribado validada) y funcional del paciente, ya que el deterioro puede ser reversible en parte con rehabilitación, soporte nutricional y ejercicio multicomponente, que no está contraindicado en la EPOC sino recomendado."},{"q":"Hombre encontrado inconsciente tras un incendio, con confusión, taquipnea, cefalea intensa y SatO2 por pulsioximetría del 98% pese a acidosis metabólica en la gasometría; se sospecha intoxicación por CO. ¿Cuál es el tratamiento inicial más adecuado?","o":["Oxigenoterapia al 100% con mascarilla de alto flujo/reservorio.","Ventilación mecánica con aire ambiente.","Administración de carbón activado.","Bicarbonato intravenoso para corregir la acidosis."],"c":"A","e":"La pulsioximetría es engañosa en la intoxicación por CO (no distingue carboxihemoglobina de oxihemoglobina, por lo que puede mostrar valores falsamente normales). El tratamiento inicial es oxígeno al 100% con mascarilla de alto flujo (y valorar oxígeno hiperbárico en casos graves), que acelera la disociación de la carboxihemoglobina; el carbón activado no tiene utilidad en gases y el bicarbonato no está indicado de entrada."},{"q":"Varón de 60 años EPOC que refiere no poder caminar al paso de una persona de su misma edad. ¿Qué grado de disnea según la escala mMRC presenta?","o":["Grado 1.","Grado 2.","Grado 3.","Grado 4."],"c":"B","e":"El grado 2 de la escala mMRC se define como «tener que parar o caminar más despacio que personas de la misma edad por disnea al andar en llano», que es exactamente lo descrito en el paciente."},{"q":"¿Cuál de las siguientes afirmaciones es FALSA respecto al tromboembolismo pulmonar (TEP)?","o":["La radiografía de tórax suele ser normal.","En la gasometría arterial existe habitualmente hipoxemia con normocapnia o hipocapnia.","La presencia de escasas alteraciones en la radiografía de tórax aumenta la sospecha de TEP.","La PaO2 puede ser normal hasta en el 30% de los pacientes."],"c":"A","e":"Aunque no hay hallazgos patognomónicos, la radiografía de tórax en el TEP raramente es completamente normal: suelen observarse alteraciones inespecíficas (atelectasias laminares, elevación diafragmática, derrame pleural) que, precisamente por ser leves y desproporcionadas a la disnea/hipoxemia del paciente, aumentan la sospecha diagnóstica (opción C, correcta)."},{"q":"Paciente con politraumatismo grave, rotura esplénica intervenida y múltiples transfusiones, que desarrolla insuficiencia respiratoria aguda postoperatoria refractaria a oxigenoterapia. ¿Cuál es la causa principal a plantear (señale la VERDADERA)?","o":["Hemorragia grave.","Depresión respiratoria por fármacos anestésicos.","Síndrome de distrés respiratorio agudo.","Broncoespasmo grave."],"c":"C","e":"El contexto de politraumatismo, transfusión masiva e insuficiencia respiratoria hipoxémica refractaria a oxígeno en el postoperatorio inmediato es muy característico del SDRA, por lesión pulmonar aguda secundaria al trauma, la transfusión masiva (TRALI/TACO) o la respuesta inflamatoria sistémica."},{"q":"Paciente con neumonía; con FiO2 0,5 su PaO2 es 50 mmHg y su PaCO2 25 mmHg. ¿Cuál es el mecanismo de hipoxemia probablemente más determinante?","o":["Limitación de la difusión a través de la membrana alveolo-capilar.","Alteraciones de la distribución ventilación/perfusión.","Hipoventilación alveolar.","Cortocircuito intrapulmonar."],"c":"D","e":"Una hipoxemia grave y refractaria a un aumento sustancial de la FiO2 (que apenas mejora la PaO2), junto con hipocapnia por taquipnea/hiperventilación compensadora, es característica del cortocircuito (shunt) intrapulmonar por relleno alveolar (consolidación neumónica extensa), ya que la sangre que atraviesa alveolos no ventilados no se oxigena por mucho que se aumente el oxígeno inspirado."},{"q":"¿En cuál de las siguientes situaciones de insuficiencia respiratoria aguda es MENOS probable que la VMNI sea beneficiosa?","o":["Agudización de EPOC con acidemia (pH \\<7,35) de causa respiratoria.","Paciente con IMC 48, encefalopatía no grave y PaCO2 85 mmHg.","Paciente con escoliosis grave, taquipnea, disbalance toracoabdominal y acidosis respiratoria.","Paciente con agudización de fibrosis pulmonar idiopática, taquipnea 45 rpm e insuficiencia respiratoria hipoxémica grave."],"c":"D","e":"La VMNI tiene indicación bien establecida y buena respuesta en la agudización de EPOC, el síndrome de hipoventilación-obesidad y las enfermedades restrictivas de la caja torácica (escoliosis). En cambio, en la insuficiencia respiratoria hipoxémica grave por agudización de fibrosis pulmonar idiopática, la evidencia muestra escaso beneficio (con frecuencia solo retrasa una intubación que ya presenta de por sí mal pronóstico en esta enfermedad)."},{"q":"Paciente con EPOC agudizado, somnoliento tras oxigenoterapia con mascarilla de reservorio, con pH 7,18, PaCO2 80 mmHg, PaO2 210 mmHg, SaO2 100%. ¿Qué acción podría haber evitado esta complicación?","o":["Administración de 300 mg de hidrocortisona endovenosa a su llegada.","Administración de 40 mg de furosemida endovenosa a su llegada.","Administración de 1 g de ceftriaxona a su llegada.","Administración de oxigenoterapia controlada con SpO2 objetivo entre 88-92%."],"c":"D","e":"En el EPOC agudizado, administrar oxígeno sin control a alto flujo (mascarilla de reservorio) puede abolir el estímulo hipóxico y empeorar la relación V/Q, produciendo narcosis por CO2 (hipercapnia grave con acidosis y disminución del nivel de consciencia), como se observa en este caso; la oxigenoterapia controlada con SpO2 objetivo 88-92% es la medida que previene esta complicación."},{"q":"Respecto a la insuficiencia respiratoria crónica (IRC), señale la respuesta correcta:","o":["Es el estadio final de numerosas enfermedades respiratorias y extrarrespiratorias crónicas.","Es un concepto gasométrico.","Se define por PaO2 \\<60 mmHg y/o PaCO2 \\>45 mmHg de forma permanente.","Todas las respuestas son correctas."],"c":"D","e":"La IRC es, efectivamente, un concepto gasométrico (se define por los valores de PaO2/PaCO2 mantenidos en el tiempo) y representa el estadio evolutivo final común a múltiples enfermedades respiratorias (EPOC, EPID) y extrarrespiratorias (neuromusculares, de la caja torácica), por lo que las tres afirmaciones previas son correctas."},{"q":"A nivel fisiopatológico, ¿cuál de estos procesos NO produce insuficiencia respiratoria crónica?","o":["Hipoventilación alveolar.","Anemia.","Alteraciones de la difusión.","Desequilibrios de la relación ventilación/perfusión."],"c":"B","e":"La anemia reduce el transporte de oxígeno (contenido arterial de O2) pero no altera la PaO2 ni la PaCO2 medidas en la gasometría arterial, por lo que no constituye, por definición gasométrica, un mecanismo de insuficiencia respiratoria."},{"q":"En relación a la hipoventilación alveolar «pura», señale la correcta:","o":["La diferencia alveoloarterial (A-a) no es un parámetro de interés en este caso.","La gasometría muestra hipoxemia e hipocapnia.","La diferencia alveoloarterial (A-a) es normal.","Es el mecanismo patológico de la insuficiencia respiratoria crónica secundaria a fibrosis pulmonar idiopática."],"c":"C","e":"En la hipoventilación alveolar pura (p. ej. por enfermedad neuromuscular o depresión del centro respiratorio), el pulmón en sí es sano, por lo que el gradiente alveoloarterial de oxígeno es normal, a diferencia de los procesos con alteración del parénquima pulmonar (como la fibrosis pulmonar, cuyo mecanismo es la alteración de la difusión, con gradiente A-a aumentado)."},{"q":"Señale qué enfermedad presenta insuficiencia respiratoria crónica por alteraciones en la difusión alveoloarterial:","o":["Fibrosis pulmonar idiopática.","Asma bronquial.","Miastenia gravis.","Esclerosis lateral amiotrófica."],"c":"A","e":"El engrosamiento de la membrana alveolocapilar por fibrosis dificulta la difusión de oxígeno, siendo este el mecanismo predominante de hipoxemia en la fibrosis pulmonar idiopática; miastenia gravis y ELA producen insuficiencia respiratoria por hipoventilación alveolar (afectación neuromuscular), y el asma por alteración V/Q."},{"q":"¿Cuál de las siguientes se considera contraindicación absoluta para aplicar VMNI?","o":["Hipotensión arterial refractaria por shock séptico.","Parada cardiorrespiratoria.","Traumatismo facial grave.","Todas las respuestas son correctas."],"c":"D","e":"La parada cardiorrespiratoria, la inestabilidad hemodinámica grave/shock refractario y el traumatismo facial grave que impide un sellado adecuado de la interfase son contraindicaciones absolutas reconocidas para la VMNI, que requiere en estos casos intubación orotraqueal y ventilación invasiva."}]},"28":{"title":"Neumopatías intersticiales. Síndrome de apnea del sueño.","questions":[{"q":"Varón de 60 años, hipertenso, exfumador y obeso, trabajador de una fábrica de mármol, con tos crónica y disnea de moderados esfuerzos de 3 meses. Analítica anodina; radiografía de tórax con patrón nodular en lóbulos superiores. ¿Qué enfermedad sospecha?","o":["Fibrosis pulmonar idiopática.","Silicosis.","Asbestosis.","Sarcoidosis."],"c":"B","e":"La exposición ocupacional a polvo de sílice (trabajo con mármol/piedra) junto con un patrón nodular de predominio en lóbulos superiores es característico de la silicosis; la asbestosis produce típicamente afectación basal y placas pleurales, y la fibrosis pulmonar idiopática predomina en bases."},{"q":"El síndrome de Löfgren es una forma aguda de presentación de la sarcoidosis. Entre sus manifestaciones NO se incluye:","o":["Adenopatías hiliares bilaterales.","Parálisis facial periférica.","Periartritis (tobillos).","Eritema nodoso."],"c":"B","e":"El síndrome de Löfgren clásico se define por la tríada de adenopatías hiliares bilaterales, eritema nodoso y periartritis (típicamente de tobillos), con buen pronóstico y frecuente resolución espontánea; la parálisis facial periférica puede verse en la neurosarcoidosis en general, pero no forma parte de la definición del síndrome de Löfgren."},{"q":"Debe considerarse el diagnóstico de fibrosis pulmonar idiopática (FPI) en todos los siguientes supuestos, MENOS EN UNO. Señálelo:","o":["Sospecha clínica, radiológica y/o histológica de FPI tras excluir otras entidades definidas o EPID de causa conocida.","Sospecha clínica con patrón de neumonía intersticial usual (NIU) en TCAR.","Sospecha clínica con patrón histológico de NIU en la biopsia pulmonar.","Varón de 40 años, muy fumador, con nódulos centrolobulillares, vidrio deslustrado parcheado y engrosamiento de la pared de la vía aérea en el TCAR."],"c":"D","e":"Ese patrón radiológico (nódulos centrolobulillares, vidrio deslustrado parcheado y engrosamiento de la pared bronquial) en un fumador joven es más típico de bronquiolitis respiratoria asociada a enfermedad intersticial (RB-ILD) o de neumonitis por hipersensibilidad, no del patrón de neumonía intersticial usual característico de la FPI, que además es infrecuente en pacientes tan jóvenes."},{"q":"Con respecto al síndrome de apnea-hipopnea del sueño (SAHS), señale la respuesta FALSA:","o":["En España, aproximadamente el 3-6% de la población padece un SAHS sintomático.","Todos los pacientes roncadores tienen SAHS.","Un índice de apneas-hipopneas (IAH) \\>30, con o sin síntomas, aumenta el riesgo cardiovascular.","Una excesiva somnolencia diurna junto con un IAH \\>5, descartadas otras causas, confirma el diagnóstico de SAHS."],"c":"B","e":"El ronquido es extraordinariamente prevalente en la población general, y la gran mayoría de los roncadores NO tienen un síndrome de apnea-hipopnea del sueño clínicamente significativo; el ronquido es un síntoma frecuente pero inespecífico."},{"q":"Varón de 60 años con tos de un mes, disnea de esfuerzo y fiebre reciente. TC: consolidaciones subpleurales y vidrio esmerilado, con signo del atolón (halo invertido). ¿Cuál es el diagnóstico más probable?","o":["Fibrosis pulmonar idiopática.","Neumonía intersticial idiopática (inespecífica).","Sarcoidosis.","Neumonía organizada criptogenética."],"c":"D","e":"El signo del atolón o halo invertido (área central en vidrio deslustrado rodeada por un anillo de consolidación) es un hallazgo característico, aunque no exclusivo, de la neumonía organizada criptogenética, que además puede presentarse de forma subaguda con tos, disnea y fiebre como en este caso."},{"q":"A una mujer de 62 años diagnosticada de fibrosis pulmonar idiopática, ¿cuál de las siguientes es la única afirmación correcta que le puede decir?","o":["Es la EPID de causa desconocida más común, más frecuente en mujeres que en varones, en torno a los 60-70 años.","El tratamiento actual (antifibróticos e inmunodepresores) no ha demostrado mejorar la supervivencia con ninguno de ellos.","En el TAC se ve reticulación subpleural de predominio SUPERIOR con panal de abejas y bronquiectasias de tracción.","La progresión de la enfermedad es variable, con una supervivencia estimada del 50% a los 3-5 años."],"c":"D","e":"La mediana de supervivencia de la FPI tras el diagnóstico se sitúa clásicamente en torno a 3-5 años, con un curso clínico heterogéneo (estable, progresivo lento o con exacerbaciones agudas). Es, además, más frecuente en VARONES (no en mujeres); los inmunosupresores están contraindicados (se asociaron a peor pronóstico en el estudio PANTHER-IPF) y el patrón radiológico de NIU predomina en las BASES, no en los vértices."},{"q":"Señale la FALSA respecto a la neumonía intersticial inespecífica (NSIP):","o":["Se diagnostica generalmente en mujeres no fumadoras en torno a la 5ª década.","Histológicamente hay inflamación y fibrosis intersticial uniforme, sin panal de abejas.","La NSIP idiopática tiene mejor pronóstico, sobre todo en el patrón FIBROSANTE.","En ocasiones se asocia a enfermedades del tejido conectivo."],"c":"C","e":"Dentro de la NSIP, el patrón CELULAR (predominio inflamatorio) tiene mejor pronóstico que el patrón FIBROSANTE, que se comporta de forma más agresiva y con peor supervivencia, más próxima a la de la neumonía intersticial usual; la afirmación tal y como está formulada invierte esta relación."},{"q":"Ante una paciente en estudio por probable fibromialgia, ¿cuál de los siguientes procesos NO incluiría en el diagnóstico diferencial?","o":["Miopatías.","Apnea del sueño.","Hipertiroidismo.","Neuropatía periférica."],"c":"C","e":"El hipotiroidismo (no el hipertiroidismo) es una causa clásica de dolor musculoesquelético difuso y fatiga que debe incluirse en el diagnóstico diferencial de la fibromialgia; miopatías, apnea del sueño (que produce fatiga/dolor por mala calidad del sueño) y neuropatía periférica sí forman parte habitual de ese diagnóstico diferencial."},{"q":"¿Cuál de los siguientes trastornos causará un aumento de la capacidad funcional residual?","o":["Enfisema.","Miastenia grave.","Obesidad.","Fibrosis pulmonar."],"c":"A","e":"La pérdida de retracción elástica pulmonar y el atrapamiento aéreo característicos del enfisema aumentan el volumen residual y, con él, la capacidad funcional residual; la obesidad, la miastenia y la fibrosis pulmonar, en cambio, cursan con patrón restrictivo y reducción de los volúmenes pulmonares, incluida la CFR."},{"q":"Todas las siguientes son manifestaciones pulmonares del lupus eritematoso sistémico, EXCEPTO:","o":["Fibrosis pulmonar progresiva.","Hemorragia alveolar.","Derrame pleural.","Enfermedad vascular pulmonar (hipertensión pulmonar)."],"c":"A","e":"La fibrosis pulmonar progresiva grave no es una manifestación característica del LES (a diferencia de la esclerosis sistémica, donde sí lo es); el LES se asocia con mayor frecuencia a pleuritis/derrame pleural, hemorragia alveolar difusa e hipertensión pulmonar."},{"q":"La sarcoidosis es una enfermedad caracterizada por:","o":["Presencia de granulomas no caseificantes que afectan a múltiples órganos.","Alteraciones histológicas que obligan a descartar neumonitis por hipersensibilidad.","Presencia de cuerpos de Schaumann, asteroides y de Hamazaki-Wesenberg dentro de los macrófagos de los granulomas.","Todas las respuestas son correctas."],"c":"D","e":"La sarcoidosis se define histológicamente por granulomas no caseificantes que pueden afectar prácticamente a cualquier órgano; dentro de estos granulomas pueden verse inclusiones citoplasmáticas como los cuerpos de Schaumann, asteroides y de Hamazaki-Wesenberg (aunque no son exclusivos de la sarcoidosis), y su hallazgo obliga a descartar otras causas de granulomatosis, incluida la neumonitis por hipersensibilidad."},{"q":"La uveítis NO se suele observar en el curso de:","o":["La sarcoidosis.","La enfermedad de Behçet.","Las artritis por microcristales (gota, condrocalcinosis).","Las espondiloartropatías."],"c":"C","e":"La uveítis anterior es una manifestación extraarticular clásica de las espondiloartropatías, y también se asocia a sarcoidosis y enfermedad de Behçet; las artropatías por microcristales, en cambio, no cursan característicamente con uveítis."},{"q":"¿Cuál es uno de los principales síntomas de la apnea del sueño?","o":["Excesiva somnolencia durante el día.","Insomnio crónico.","Dificultad para conciliar el sueño por la noche.","Sueño muy ligero y fragmentado sin causa aparente."],"c":"A","e":"La excesiva somnolencia diurna, consecuencia de la fragmentación del sueño por los microdespertares asociados a las apneas/hipopneas repetidas, es el síntoma cardinal y más incapacitante del SAHS."},{"q":"¿Cuál de los siguientes trastornos del sueño se caracteriza por una sensación irresistible de dormir durante el día, acompañada de episodios de cataplejía?","o":["Insomnio.","Narcolepsia.","Apnea del sueño.","Parasomnias."],"c":"B","e":"La combinación de hipersomnia diurna irresistible y cataplejía (pérdida brusca del tono muscular desencadenada por emociones intensas) es característica de la narcolepsia tipo 1, relacionada con el déficit de hipocretina/orexina hipotalámica."},{"q":"Varón de 71 años con ronquidos nocturnos, IMC 31,5, ligera somnolencia diurna postprandial, sin otros síntomas relevantes. El índice de apnea-hipopnea (IAH) en polisomnografía fue de 18. ¿Cuál es la medida más adecuada?","o":["Medidas higiénico-dietéticas y control evolutivo.","CPAP (presión positiva continua en la vía aérea).","Ventilación mecánica no invasiva.","Oxigenoterapia nocturna."],"c":"B","e":"Un IAH ≥15 (SAHS moderado) acompañado de síntomas (aunque sean leves, como la somnolencia postprandial referida) es indicación de tratamiento con CPAP según las guías de las sociedades de neumología, siendo el tratamiento de elección del SAHS moderado-grave sintomático."},{"q":"¿Cuál de los siguientes síntomas NO es suficiente, por sí solo, para indicar una prueba de sueño con intención diagnóstica de SAHS?","o":["Apneas repetidas presenciadas durante el sueño.","Excesiva somnolencia diurna, hipersomnia o tendencia a dormirse involuntariamente en situaciones inapropiadas.","Roncopatía crónica aislada, sin otros síntomas.","Despertares recurrentes durante el sueño."],"c":"C","e":"El ronquido crónico aislado, sin apneas presenciadas, excesiva somnolencia diurna u otros síntomas/signos de sospecha, es extraordinariamente frecuente en la población general y no justifica por sí solo la realización de una prueba de sueño diagnóstica de SAHS."}]},"29":{"title":"Cáncer de pulmón.","questions":[{"q":"Señale la respuesta FALSA en relación con los nódulos pulmonares incidentales:","o":["La mayoría de los nódulos pulmonares incidentales son benignos.","Los granulomas infecciosos y los hamartomas son las causas más frecuentes de nódulos benignos.","Las causas más comunes de nódulos malignos son el cáncer de pulmón primario, las metástasis pulmonares y los tumores carcinoides.","Sugiere benignidad si el nódulo tiene bordes irregulares/espiculados o cavitación de pared gruesa."],"c":"D","e":"Justo lo contrario: los bordes irregulares o espiculados y la cavitación de pared gruesa son signos radiológicos que sugieren MALIGNIDAD; los nódulos benignos suelen tener bordes lisos, bien definidos, y si cavitan, presentan pared fina."},{"q":"Un varón de 47 años diagnosticado de cáncer de pulmón hace 6 meses acude por neutropenia febril (310 neutrófilos/mm³) sin foco aparente. A los 3 días está afebril y los cultivos son negativos. Señale lo correcto sobre la duración del tratamiento antibiótico:","o":["Debe recibir un total de 14 días de tratamiento antibiótico.","Debe recibir tratamiento hasta que los neutrófilos alcancen 1000/mm³.","Es suficiente con completar unos 5 días de tratamiento antibiótico.","Al ser un cáncer de pulmón con foco respiratorio probable, el tratamiento debe ser de 10 días."],"c":"C","e":"En la neutropenia febril de bajo riesgo, sin foco identificado, con cultivos negativos y buena evolución clínica (afebril y estable), las guías actuales permiten suspender el tratamiento antibiótico tras unos 5-7 días de defervescencia, sin necesidad de esperar la recuperación completa de la cifra de neutrófilos."},{"q":"Señale la FALSA acerca del adenocarcinoma de pulmón:","o":["El adenocarcinoma in situ es una lesión \\<3 cm con patrón lepídico puro.","El adenocarcinoma mínimamente invasivo tiene una supervivencia libre de enfermedad a 5 años cercana al 100% tras resección completa.","Los adenocarcinomas invasores con patrón micropapilar tienen mejor pronóstico que los de patrón acinar.","La proliferación atípica de neumocitos tipo II de hasta 0,5 cm se considera lesión preinvasiva."],"c":"C","e":"Es justo lo contrario: los patrones histológicos micropapilar y sólido son los de PEOR pronóstico entre los adenocarcinomas invasores, mientras que el patrón lepídico tiene el mejor pronóstico y el acinar/papilar uno intermedio."},{"q":"Varón de 65 años con adenocarcinoma de pulmón en quimioterapia, consulta por malestar y disnea. Tª 36ºC, TA 80/40 mmHg, FC 110 lpm, SatO2 85%; infiltrado basal derecho en la radiografía. Señale la correcta:","o":["El tratamiento empírico debe tener el espectro más limitado posible para evitar resistencias.","No se trata de una sepsis porque el paciente está afebril.","Hay que iniciar vasopresores de forma inmediata sin más medidas.","Hay que iniciar reanimación con 500 ml de cristaloides en 15 minutos."],"c":"D","e":"Este paciente presenta un shock séptico (hipotensión, taquicardia, hipoxemia con infiltrado pulmonar) a pesar de estar afebril; la ausencia de fiebre no descarta sepsis, especialmente en pacientes oncológicos/neutropénicos. El primer paso es la reanimación precoz con cristaloides (bolo rápido) antes de escalar a vasopresores, y el tratamiento empírico debe ser de amplio espectro dado el riesgo vital, no limitado."},{"q":"Sobre las neoplasias neuroendocrinas pulmonares, señale la FALSA:","o":["Suponen aproximadamente un 19% de todos los tumores broncopulmonares malignos primarios.","El más frecuente es el carcinoma neuroendocrino de células grandes (79%), seguido del carcinoma de células pequeñas (16%), y los carcinoides el 5% restante.","Los carcinoides típicos y atípicos comparten morfología neuroendocrina con patrón de crecimiento organoide.","En el carcinoma microcítico avanzado, la inmunoterapia se ha incorporado como primera línea junto a la quimioterapia."],"c":"B","e":"Los porcentajes están invertidos: dentro de las neoplasias neuroendocrinas pulmonares, el más frecuente con diferencia es el carcinoma microcítico (célula pequeña), seguido del carcinoma neuroendocrino de células grandes, quedando los tumores carcinoides típicos y atípicos como una minoría."},{"q":"Varón de 75 años recién diagnosticado de cáncer de pulmón, con sodio de 124 mEq/l. ¿Qué NO le puede decir a su paciente al respecto?","o":["Que puede tener hiponatremia por SIADH o por péptido natriurético auricular ectópico.","Que tardará entre 1 y 4 semanas en resolverse una vez iniciada la quimioterapia.","Que es probable que se necesiten fármacos como demeclociclina o tolvaptán mientras hace efecto la quimioterapia.","Que no es necesario medir de entrada los niveles de péptido natriurético auricular."],"c":"D","e":"En el estudio de la hiponatremia paraneoplásica del cáncer de pulmón (especialmente microcítico) es razonable medir el péptido natriurético auricular, ya que en ocasiones el mecanismo no es un SIADH clásico sino una secreción ectópica de este péptido, lo que puede modificar el enfoque terapéutico; afirmar que no es necesario medirlo de entrada es, por tanto, incorrecto."},{"q":"Un paciente con carcinoma de pulmón no microcítico avanzado recibe inmunoterapia. ¿Qué mecanismo de acción corresponde a los inhibidores de puntos de control inmunitario utilizados en este contexto?","o":["Inhibición de la angiogénesis.","Inhibición de la tirosina quinasa.","Bloqueo de la interacción PD-1/PD-L1.","Inhibición directa de la proliferación de las células tumorales."],"c":"C","e":"Los inhibidores de puntos de control (nivolumab, pembrolizumab, atezolizumab, etc.) bloquean la interacción entre el receptor PD-1 de los linfocitos T y su ligando PD-L1 (expresado por las células tumorales), restaurando la capacidad del sistema inmunitario para reconocer y destruir las células neoplásicas."},{"q":"Sobre el carcinoma pulmonar de células pequeñas, señale la INCORRECTA:","o":["Es más frecuente en varones mayores de 60 años y se relaciona con el tabaquismo.","El tumor primario suele detectarse como una masa hiliar de gran tamaño, con frecuentes metástasis al diagnóstico.","Con un tumor de 3 cm sin afectación ganglionar, podría considerarse la resección quirúrgica.","Si en la cirugía se consiguen márgenes libres (R0), no es necesario asociar quimioterapia."],"c":"D","e":"A diferencia del carcinoma no microcítico, en el carcinoma de células pequeñas se recomienda quimioterapia adyuvante sistemática incluso tras una resección R0 en los escasos casos seleccionados de enfermedad muy localizada, dado el altísimo potencial de diseminación sistémica precoz característico de esta estirpe tumoral."},{"q":"En relación con el tratamiento de una mujer no fumadora con carcinoma no microcítico, adenocarcinoma, estadio IV, ¿cuál de las siguientes afirmaciones es correcta?","o":["Es obligado determinar la mutación de EGFR.","Gefitinib de entrada es el tratamiento estándar sin determinación de EGFR.","Tiene un tratamiento estándar basado en camptotecinas.","No existe ningún factor predictivo en esta enfermedad."],"c":"A","e":"En una mujer no fumadora con adenocarcinoma pulmonar metastásico, la probabilidad de mutación activadora de EGFR es elevada, y su determinación es obligada antes de decidir el tratamiento, ya que condiciona el uso de inhibidores de tirosina-quinasa de EGFR como primera línea en caso de positividad."},{"q":"Las metástasis cerebrales son la causa más frecuente de hipertensión intracraneal; algunas tienen más predisposición a sangrar. ¿Cuál de estos tumores primarios tiene MENOR riesgo relativo de hemorragia cerebral secundaria a metástasis?","o":["Cáncer de pulmón.","Coriocarcinoma.","Cáncer de células renales.","Cáncer papilar de tiroides."],"c":"D","e":"El carcinoma papilar de tiroides tiene un riesgo hemorrágico intrínsecamente bajo comparado con los tumores clásicamente asociados a metástasis cerebrales hemorrágicas: coriocarcinoma, melanoma y carcinoma renal de células claras, muy vascularizados y con tendencia al sangrado."},{"q":"Indique el tumor que más frecuentemente causa metástasis cerebrales:","o":["Cáncer de pulmón.","Cáncer de páncreas.","Cáncer de estómago.","Cáncer de próstata."],"c":"A","e":"El cáncer de pulmón es, con diferencia, la causa más frecuente de metástasis cerebrales, seguido del cáncer de mama y el melanoma; el resto de tumores citados metastatizan al cerebro con mucha menor frecuencia."},{"q":"¿Cuál de las siguientes es causa de neumotórax espontáneo primario?","o":["Traumatismo torácico cerrado.","Rotura de bullas subpleurales (blebs).","Absceso pulmonar.","Carcinoma broncogénico."],"c":"B","e":"El neumotórax espontáneo primario ocurre típicamente en varones jóvenes, altos y delgados, por rotura de bullas o blebs subpleurales apicales, en ausencia de enfermedad pulmonar subyacente conocida; las otras opciones producen neumotórax secundario (a traumatismo o a enfermedad pulmonar de base)."},{"q":"¿Cuál de los siguientes gases puede ser factor de riesgo para el desarrollo de cáncer de pulmón?","o":["Oxígeno.","Radón.","Nitrógeno.","Dióxido de carbono."],"c":"B","e":"La exposición al radón (gas radiactivo natural que se acumula en interiores, especialmente sótanos) es la segunda causa de cáncer de pulmón tras el tabaco y la primera en no fumadores."},{"q":"¿Cuál de los siguientes carcinomas broncopulmonares clasificaría como T4 según la clasificación TNM?","o":["Tumor que invade la carina traqueal.","Tumor que invade la pared torácica en una zona concreta.","Tumor limitado al lóbulo superior derecho.","Nódulo pulmonar solitario de 3 cm de diámetro."],"c":"A","e":"La invasión de estructuras mediastínicas centrales como la carina traqueal, el corazón, los grandes vasos, el esófago o los cuerpos vertebrales define un T4 en la clasificación TNM del cáncer de pulmón; la invasión aislada de la pared torácica corresponde a T3, y un nódulo de 3 cm sin más afectación sería T2a."},{"q":"Todos los siguientes cribados, excepto uno, han demostrado ser efectivos en estudios epidemiológicos:","o":["Cribado del cáncer de mama en mujeres mayores de 50 años.","Cribado del cáncer de pulmón mediante radiografía de tórax simple.","Cribado de la hipertensión arterial.","Cribado del colesterol."],"c":"B","e":"El cribado del cáncer de pulmón con radiografía de tórax convencional NO ha demostrado reducir la mortalidad en los grandes ensayos clínicos y no se recomienda; el cribado que sí ha mostrado beneficio en población de alto riesgo (grandes fumadores) es el TC de baja dosis, una técnica distinta a la radiografía simple."},{"q":"¿Qué tipo de cáncer es más probable que esté relacionado con una predisposición genética hereditaria?","o":["Cáncer de pulmón.","Cáncer de mama.","Cáncer de colon.","Cáncer de páncreas."],"c":"B","e":"El cáncer de mama tiene una de las asociaciones genéticas hereditarias mejor caracterizadas y de mayor impacto clínico (mutaciones en BRCA1/BRCA2), con implicaciones directas en el cribado y manejo de las portadoras; el cáncer de pulmón, en cambio, está dominado abrumadoramente por factores ambientales (tabaco)."},{"q":"Los pacientes oncológicos pueden presentar síndrome de vena cava superior. ¿En cuál de las siguientes neoplasias es más frecuente esta complicación?","o":["Linfoma.","Cáncer de mama.","Cáncer de pulmón.","Metástasis ganglionares mediastínicas de otros orígenes."],"c":"C","e":"El cáncer de pulmón (sobre todo el carcinoma microcítico y el epidermoide de localización central) es la causa más frecuente de síndrome de vena cava superior maligno, responsable de aproximadamente el 75-85% de los casos de origen tumoral."},{"q":"En relación con el síndrome de vena cava superior, señale la respuesta FALSA:","o":["El cáncer de pulmón es responsable de aproximadamente el 85% de los casos.","Las causas benignas están aumentando actualmente con el uso creciente de dispositivos intravasculares.","Las manifestaciones más frecuentes son edema facial/cervical, disnea y tos.","Está contraindicada la colocación de un stent endovascular."],"c":"D","e":"La colocación de un stent endovascular no está contraindicada; al contrario, es una opción terapéutica eficaz y de alivio sintomático rápido en el síndrome de vena cava superior, tanto de causa maligna como benigna, especialmente cuando se precisa mejoría clínica urgente."}]},"30":{"title":"Aproximación al paciente con insuficiencia renal aguda. Insuficiencia renal crónica.","questions":[{"q":"Todas las siguientes, menos una, son indicaciones aceptadas de diálisis en la insuficiencia renal aguda. Señale la excepción:","o":["Hiperpotasemia \\>6,5 mEq/l con cambios en el ECG y resistente al tratamiento médico.","Anuria a pesar de tratamiento médico.","Creatinina elevada más del 50% de su valor basal, sin otros datos clínicos.","Acidosis metabólica grave resistente al tratamiento."],"c":"C","e":"Una elevación aislada de creatinina \\>50% del basal, sin sobrecarga de volumen refractaria, hiperpotasemia grave, acidosis grave o síntomas urémicos (pericarditis, encefalopatía), no constituye por sí sola indicación de diálisis urgente; las decisiones se basan en el contexto clínico global, no en un único valor analítico."},{"q":"La anuria completa al inicio de la evolución de la insuficiencia renal aguda es frecuente en todas las siguientes situaciones, MENOS EN UNA:","o":["Necrosis cortical renal.","Necrosis tubular aguda.","Oclusión bilateral de ambas arterias renales.","Obstrucción urinaria completa."],"c":"B","e":"La necrosis tubular aguda cursa típicamente con OLIGURIA (o incluso formas no oligúricas), no con anuria completa; la anuria absoluta desde el inicio es más propia de procesos obstructivos completos, oclusión arterial renal bilateral o necrosis cortical, que interrumpen por completo el flujo urinario."},{"q":"En pacientes con alteración renal aguda, las indicaciones aceptadas de diálisis incluyen todas, MENOS UNA:","o":["Sobrecarga volumétrica refractaria a diuréticos.","Hiperpotasemia refractaria a tratamiento médico.","Urea sérica superior a 200 mg/dl de forma aislada.","Pericarditis urémica."],"c":"C","e":"Una cifra aislada de urea, por elevada que sea, no constituye por sí sola indicación absoluta de diálisis si no se acompaña de síntomas urémicos francos (como la pericarditis) u otras indicaciones clásicas (sobrecarga refractaria, hiperpotasemia refractaria, acidosis grave)."},{"q":"En el manejo de la insuficiencia renal aguda, señale la respuesta correcta:","o":["La albúmina puede reducir los requerimientos de líquidos y la necesidad de hemodiálisis.","No deben administrarse soluciones que contengan bicarbonato.","Se recomienda suero salino normal 0,9% en pacientes hipovolémicos e hipoclorémicos, vigilando estrechamente el cloro sérico.","La oliguria aislada es indicación suficiente para administrar líquidos."],"c":"C","e":"El suero salino fisiológico es razonable en la reposición de la hipovolemia con hipocloremia, pero su uso masivo puede producir acidosis metabólica hiperclorémica, por lo que debe vigilarse el cloro sérico; la albúmina no ha demostrado de forma consistente reducir la necesidad de diálisis, el bicarbonato puede emplearse en casos seleccionados de acidosis grave, y la oliguria aislada no basta para indicar sueroterapia sin valorar el estado de volemia."},{"q":"En una insuficiencia renal aguda prerrenal, ¿cuál de las siguientes afirmaciones es CIERTA?","o":["Sodio en orina alto, creatinina urinaria elevada y osmolaridad urinaria alta.","Sodio en orina alto, creatinina urinaria baja y osmolaridad urinaria baja.","Sodio en orina bajo, creatinina urinaria elevada y osmolaridad urinaria alta.","Sodio en orina bajo, creatinina urinaria baja y osmolaridad urinaria baja."],"c":"C","e":"En el fracaso prerrenal, con la función tubular conservada, el riñón responde a la hipoperfusión reabsorbiendo ávidamente sodio y agua: esto se traduce en sodio urinario bajo (\\<20 mEq/l), orina concentrada (osmolaridad urinaria alta, densidad alta) y, por la reabsorción de agua, una creatinina urinaria relativamente elevada respecto a la plasmática (cociente Cr orina/plasma alto)."},{"q":"Sofía, 85 años: creatinina 1,2 mg/dl, FGe (CKD-EPI) 41 ml/min/1,73m², cociente albúmina/creatinina 3 mg/g, sin hematuria, ecografía renal normal. ¿Qué situación renal describe mejor esto?","o":["ERC estadio 3b A1.","ERC estadio 3a A2.","ERC estadio 4 A3.","ERC estadio 3a A1."],"c":"A","e":"Un FGe de 41 ml/min/1,73m² corresponde al estadio 3b (30-44 ml/min), y un cociente albúmina/creatinina de 3 mg/g está claramente en rango normal, es decir, categoría A1 (\\<30 mg/g); la combinación correcta según la clasificación KDIGO es, por tanto, ERC estadio 3b A1."},{"q":"Paciente de 35 años que, tras un viaje a Egipto, presenta diarrea acuosa profusa de 4 días. Analítica: Hb 18 g/dl, Hto 54%, creatinina 4,8 mg/dl, urea 260 mg/dl, Na 145, K 2,5, Cl 120, pH 7,2, HCO3 11; orina: creatinina 96 mg/dl, Na 18 mEq/l. Señale la correcta:","o":["La acidosis es metabólica, con anión gap normal, en relación probable con la diarrea.","La acidosis es metabólica con anión gap elevado, en relación probable con la diarrea.","La acidosis es metabólica con anión gap elevado, en relación probable con el fracaso renal agudo.","La hipopotasemia es solo secundaria a la acidosis metabólica."],"c":"A","e":"El anión gap calculado (Na - \\[Cl+HCO3\\] = 145-131=14) está en rango normal-límite, coherente con una acidosis metabólica hiperclorémica de anión gap normal por pérdida digestiva de bicarbonato, típica de la diarrea profusa; el sodio urinario bajo (18 mEq/l) confirma además el componente prerrenal por depleción de volumen asociado."},{"q":"Mujer de 32 años con calcio 11 mg/dl y PTH 45 pg/ml (rango normal 10-55). ¿Qué prueba pediría a continuación?","o":["25-OH vitamina D.","Cociente calcio/creatinina en orina de 24 horas.","Gammagrafía con Tc99-sestamibi.","PTHrP."],"c":"B","e":"Ante una hipercalcemia con PTH inadecuadamente normal-alta (no suprimida), antes de asumir un hiperparatiroidismo primario y solicitar pruebas de localización (gammagrafía), debe descartarse la hipercalcemia hipocalciúrica familiar mediante el cociente calcio/creatinina en orina de 24 horas, ya que esta entidad benigna no requiere tratamiento quirúrgico."},{"q":"Sobre la falta de respuesta al tratamiento con eritropoyetina (EPO) en la anemia por insuficiencia renal crónica, señale la afirmación FALSA:","o":["El estado de las reservas de hierro no influye en la respuesta.","Los pacientes con hemoglobinopatías (drepanocitosis, talasemia) no suelen responder normalmente a la EPO.","El hiperparatiroidismo grave es causa de falta de respuesta al tratamiento.","La coexistencia de infección crónica o neoplasia disminuye la respuesta al tratamiento."],"c":"A","e":"El déficit de hierro (funcional o absoluto) es, de hecho, la causa más frecuente de hiporrespuesta a la EPO, por lo que las reservas férricas deben evaluarse y corregirse siempre antes y durante el tratamiento; afirmar que no influyen en la respuesta es claramente incorrecto."},{"q":"Mujer de 70 años que 5 días después de iniciar tratamiento con piperacilina-tazobactam por una colecistitis desarrolla diarrea, fiebre y test de toxina de C. difficile positivo, con creatinina 1,9 mg/dl (previa 0,8) y 19.580 leucocitos. TA normal. Señale lo correcto:","o":["Fiebre, leucocitosis \\>15.000 y creatinina \\>50% del basal definen el caso como fulminante.","La edad no es un factor de riesgo de infección grave.","La paciente presenta factores de riesgo de recurrencia, por lo que debe considerarse fidaxomicina.","Deben administrarse metronidazol intravenoso y probióticos si no puede suspenderse el antibiótico pautado."],"c":"C","e":"La edad avanzada y la comorbilidad son factores de riesgo reconocidos de recurrencia de la infección por C. difficile, por lo que en este perfil de paciente debe considerarse fidaxomicina, que ha demostrado menores tasas de recurrencia que vancomicina/metronidazol; el cuadro descrito (sin hipotensión, sin íleo ni megacolon) cumple criterios de infección GRAVE, no «fulminante» (que exige shock, íleo o megacolon)."},{"q":"Gestante primípara de 36 años, semana 34, TA 160/90, ácido úrico 8 mg/dl, proteinuria en 24h de 500 mg, resto de analítica normal (preeclampsia leve/gestacional). ¿Qué tratamiento antihipertensivo pondría?","o":["Enalapril.","Alfametildopa.","Losartán.","Atenolol."],"c":"B","e":"La alfametildopa (junto con labetalol y nifedipino) es de los antihipertensivos de elección durante el embarazo por su perfil de seguridad establecido; los IECA (enalapril) y ARA-II (losartán) están formalmente contraindicados por su teratogenicidad renal fetal, y el atenolol se ha asociado a restricción del crecimiento intrauterino."},{"q":"Mujer de 72 años con fiebre, astenia, adenopatías laterocervicales y esplenomegalia. Analítica: Hb 8,5, VCM 98, plaquetas 50.000, leucocitos 1.800 (720 neutrófilos), creatinina 1,8, bilirrubina 4,2, PCR 190, ferritina 2.400, triglicéridos 850, fibrinógeno 0,8 g/l. ¿Qué hallazgo esperaría encontrar en el estudio?","o":["Datos de hepatopatía crónica evolucionada.","Anticuerpos antinucleares positivos a títulos altos.","Hemocultivos positivos.","Serología positiva para virus de Epstein-Barr."],"c":"D","e":"El cuadro descrito (citopenias, hiperferritinemia extrema, hipertrigliceridemia, hipofibrinogenemia, fiebre y esplenomegalia) es muy sugestivo de síndrome hemofagocítico/linfohistiocitosis hemofagocítica secundaria, cuya causa desencadenante más frecuente en adultos son las infecciones virales, siendo el virus de Epstein-Barr uno de los agentes más característicamente implicados."},{"q":"Varón de 72 años con HTA, DM e insuficiencia renal crónica (aclaramiento 50 ml/min), diagnosticado de enfermedad arterial periférica sintomática. Señale la actitud terapéutica CORRECTA:","o":["Se puede plantear tratamiento con rivaroxabán a dosis bajas junto con AAS.","Se puede plantear doble antiagregación (AAS y clopidogrel).","Se puede plantear tratamiento con ticagrelor.","Se puede plantear tratamiento con rivaroxabán a dosis bajas en monoterapia."],"c":"A","e":"La pauta «vascular dose» de rivaroxabán (2,5 mg/12h) asociada a AAS a dosis bajas, validada en el ensayo COMPASS, ha demostrado reducir eventos isquémicos en la enfermedad arterial periférica sintomática, siendo aplicable en pacientes con ERC leve-moderada como este, con la debida vigilancia del riesgo hemorrágico."},{"q":"Mujer de 82 años con bajo nivel de conciencia, Tª 34,2ºC, edema facial y en MMII, frialdad cutánea, sin ingurgitación yugular; Na 125, K 4,5, creatinina 1,1; ECG con bajo voltaje; Rx con derrame pleural derecho. ¿Qué exploración complementaria daría el diagnóstico?","o":["Determinación de NT-proBNP.","Determinación de TSH.","Determinación de procalcitonina.","Cociente proteínas/creatinina en orina."],"c":"B","e":"La combinación de hipotermia, bajo nivel de consciencia, edemas generalizados sin datos de insuficiencia cardiaca (sin ingurgitación yugular), hiponatremia y bajo voltaje en el ECG es muy sugestiva de hipotiroidismo grave/coma mixedematoso, por lo que la determinación de TSH es la prueba clave para el diagnóstico."},{"q":"Varón de 42 años ADVP, ingresado por bacteriemia por SARM en tratamiento con vancomicina, con creatinina en ascenso (1,5→2,8 mg/dl), C3 bajo, C4 normal, crioglobulinas negativas; orina con 50-100 hematíes/campo, proteinuria 1g/24h y cilindros hemáticos; ecografía renal normal. ¿Cuál es la causa más probable de la insuficiencia renal aguda?","o":["Necrosis tubular aguda por vancomicina.","Glomerulonefritis relacionada con la infección.","Nefritis intersticial alérgica.","Embolismos sépticos."],"c":"B","e":"El sedimento nefrítico activo (hematuria con cilindros hemáticos, proteinuria), el consumo de complemento C3 y el contexto de bacteriemia estafilocócica (endocarditis subyacente probable en un ADVP) son muy sugestivos de glomerulonefritis relacionada con la infección (mediada por inmunocomplejos), un mecanismo distinto de la simple nefrotoxicidad por vancomicina."},{"q":"Varón de 45 años con crisis tónico-clónicas, confuso, con esquizofrenia y depresión sin tratamiento reciente. Analítica: Na 118, K 3,4, osmolaridad sérica 252, osmolaridad urinaria 78, densidad urinaria 1002, sedimento normal. ¿Cuál es la causa más probable de sus alteraciones electrolíticas?","o":["Insuficiencia suprarrenal.","Polidipsia primaria.","Diabetes insípida.","Síndrome de secreción inadecuada de ADH."],"c":"B","e":"Una osmolaridad urinaria muy baja (78 mOsm/kg, densidad 1002) indica que el riñón SÍ está diluyendo la orina apropiadamente en respuesta a la hiponatremia, lo que descarta un SIADH (donde la orina estaría inapropiadamente concentrada); en un paciente psiquiátrico, este patrón es característico de la polidipsia psicógena primaria, con ingesta hídrica excesiva que sobrepasa la capacidad de dilución renal."},{"q":"Gestante de 11 semanas con LES activo (síndrome nefrótico, hematuria con cilindros, C3/C4 bajos, anti-dsDNA alto, anticoagulante lúpico positivo) que desea continuar el embarazo. ¿Cuál es la opción más adecuada?","o":["Aplazar la biopsia renal hasta después del parto por ser el embarazo una contraindicación.","Iniciar hidroxicloroquina, pulsos de glucocorticoides, tacrolimus, nifedipino y AAS 100 mg/día.","Iniciar hidroxicloroquina, pulsos de glucocorticoides, ciclofosfamida, nifedipino y HBPM.","Repetir los anticuerpos antifosfolípido antes de decidir iniciar AAS."],"c":"B","e":"La ciclofosfamida está formalmente contraindicada durante el embarazo por su teratogenicidad, por lo que debe sustituirse por inmunosupresores seguros en gestación (tacrolimus o azatioprina); la biopsia renal no está contraindicada durante el embarazo si el resultado va a modificar el manejo, y ante la positividad ya conocida de anticuerpos antifosfolípido no es necesario repetirlos antes de iniciar antiagregación."},{"q":"En la hipertensión arterial asociada a la insuficiencia renal crónica, ¿cuál es el factor patogenético más importante?","o":["Estenosis de las arterias renales.","Retención de sodio y agua.","Hiperaldosteronismo secundario.","Producción excesiva de renina."],"c":"B","e":"La expansión de volumen por retención de sodio y agua, consecuencia de la reducción del filtrado glomerular, es el mecanismo patogénico predominante y más importante de la hipertensión arterial asociada a la enfermedad renal crónica, aunque la activación del sistema renina-angiotensina también contribuye en muchos casos."},{"q":"Con respecto a la enfermedad cardiovascular en la insuficiencia renal crónica, ¿cuál de las siguientes es correcta?","o":["La ERC no se considera un factor de riesgo de enfermedad cardiovascular isquémica.","La hipertensión arterial solo empeora la evolución de la nefropatía diabética.","El uso de agentes eritropoyéticos exógenos puede aumentar la presión arterial y la necesidad de antihipertensivos.","La enfermedad cardiovascular no es causa frecuente de muerte en pacientes en diálisis."],"c":"C","e":"La corrección de la anemia renal con agentes eritropoyéticos (EPO, darbepoetina) se asocia de forma bien documentada a un aumento de la presión arterial en un subgrupo relevante de pacientes, que puede requerir intensificar el tratamiento antihipertensivo; la ERC es, además, un potente factor de riesgo cardiovascular independiente, y la enfermedad cardiovascular es la principal causa de muerte en pacientes en diálisis."},{"q":"Un paciente con insuficiencia renal crónica avanzada acude por hemorragia digestiva alta. ¿Cuál es la etiología más probable del sangrado?","o":["Úlcera duodenal.","Cáncer gástrico.","Cáncer duodenal.","Angiodisplasia."],"c":"D","e":"La uremia crónica altera la función plaquetaria y se asocia a una mayor prevalencia de angiodisplasias digestivas, que constituyen una causa característica y relativamente frecuente de hemorragia digestiva en pacientes con enfermedad renal crónica avanzada."},{"q":"Paciente de 45 años con secreción nasal purulenta, tos con expectoración hemoptoica y úlceras en encías de 5 meses de evolución; creatinina 2,3 mg/dl, c-ANCA positivos. ¿Qué tratamiento sería el más adecuado?","o":["Metilprednisolona endovenosa 1 mg/kg hasta mejoría clínica, en monoterapia.","Observación clínica sin tratamiento.","Ciclofosfamida y prednisona.","Azatioprina y prednisona."],"c":"C","e":"El cuadro (afectación ORL, hemoptisis, c-ANCA positivos y afectación renal) es compatible con granulomatosis con poliangeítis con afectación grave (renal y pulmonar), lo que constituye indicación de tratamiento de inducción con ciclofosfamida (o rituximab, alternativa equivalente) junto con glucocorticoides; la azatioprina se reserva para el mantenimiento de la remisión, no para la inducción en enfermedad grave."},{"q":"Varón de 59 años con nefropatía diabética, filtrado glomerular de 36 ml/min/1,73m² y cociente albúmina/creatinina de 350 mg/g. ¿Qué categoría de ERC presenta según KDIGO?","o":["Estadio 3b A2.","Estadio 4 A3.","Estadio 3b A3.","Estadio 4 A2."],"c":"C","e":"Un FGe de 36 ml/min corresponde al estadio 3b (30-44 ml/min/1,73m²), y una albuminuria de 350 mg/g corresponde a la categoría A3 (\\>300 mg/g, severamente aumentada); la combinación correcta es, por tanto, estadio 3b A3."},{"q":"¿Cuál de las siguientes manifestaciones clínicas NO es propia del cuadro urémico de la insuficiencia renal (aguda o crónica avanzada)?","o":["Pericarditis.","Asterixis.","Anemia.","Trombosis venosas."],"c":"D","e":"Pericarditis urémica, asterixis (encefalopatía urémica) y anemia (por déficit de eritropoyetina) son manifestaciones clásicas del síndrome urémico; la trombosis venosa no forma parte de este cuadro (de hecho, la uremia se asocia más a disfunción plaquetaria y te
