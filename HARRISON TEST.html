síndromes de compresión o de atrapamiento nervioso. La resolución de los síntomas de fascitis plantar se produce dentro de los 12 meses en más de 80% de los pacientes. El tratamiento inicial consiste en aplicación de hielo, calor, masajes y estiramientos. Las ortesis que proporcionan apoyo al arco medial pueden ser eficaces. Se puede administrar a los pacientes un tratamiento breve de NSAID cuando los beneficios superen los riesgos. Las inyecciones locales de glucocorticoides también han demostrado ser eficaces, pero pueden conllevar un mayor riesgo de rotura de la aponeurosis plantar. La fasciotomía plantar se reserva para aquellos pacientes que no han mejorado después de al menos seis a 12 meses de tratamiento conservador.","letters":["A","B","C","D","E"]}]},"40":{"title":"Lupus eritematoso sistémico. Síndrome antifosfolípidos.","questions":[{"q":"Todas las siguientes afirmaciones con respecto a los anticuerpos antifosfolípidos son ciertas EXCEPTO:","o":["Los anticuerpos antifosfolípidos por lo general se dirigen contra fosfolípidos con carga negativa, como cardiolipina, fosfocolina y fosfatidilserina.","Los pacientes que son positivos para anticoagulante lúpico tendrán un tiempo de tromboplastina parcial activado elevado in vitro.","Los pacientes con anticuerpos antifosfolípidos pueden dar un resultado positivo falso en las pruebas para sífilis.","La mayoría de los pacientes con lupus eritematoso sistémico y anticuerpos antifosfolípidos desarrollan manifestaciones clínicas del síndrome antifosfolípidos."],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 357) El síndrome antifosfolípidos (APS, antiphospholid syndrome) es una trombofilia adquirida mediada por autoanticuerpos caracterizada por trombosis arterial o venosa recurrente o por morbilidad en el embarazo (cuadro VIII--19). Los principales autoanticuerpos antifosfolípidos detectados en el suero de los pacientes están dirigidos contra proteínas plasmáticas transportadoras de fosfolípidos, o fosfolípidos (PL, phospholipids) como la protrombina y la β2-glucoproteína I (β2GPI). Los fosfolípidos son componentes de la membrana citoplasmática de todas las células vivas. Los anticuerpos se dirigen típicamente contra los fosfolípidos con carga negativa, que incluyen, entre otros, cardiolipina, fosfocolina y fosfatidilserina. La proteína plasmática β2GPI es una apolipoproteína plasmática de 43 kDa, que consiste en 326 aminoácidos dispuestos en cinco dominios (I a V). El dominio V forma una placa con carga positiva, adecuado para interactuar con fosfolípidos con carga negativa. En el plasma, la β2GPI tiene una conformación circular con el dominio V que se une a los epítopos de los linfocitos B que se encuentran en el dominio I. Otro grupo de anticuerpos denominado anticoagulante lúpico prolonga los tiempos de coagulación, incluido el tiempo de tromboplastina parcial activada in vitro, que no se corrigen mediante la adición de plasma normal. Los pacientes con síndrome antifosfolípidos suelen presentar anticuerpos que reconocen complejos de fosfolípidos de Treponema pallidum/colesterol, detectados mediante pruebas VDRL y que se identifican como pruebas serológicas positivas falsas para sífilis. La incidencia de síndrome antifosfolípidos se estima en unos 5 casos por cada 100 000 personas al año. Los anticuerpos antifosfolípidos se presentan en 1% a 5% de la población general. Su prevalencia se incrementa con la edad; sin embargo, es cuestionable si son capaces de inducir episodios trombóticos en personas de edad avanzada. Además, casi 30% de los pacientes con lupus eritematoso sistémico y otras enfermedades autoinmunitarias poseen estos anticuerpos, de los cuales solo 5% a 10% desarrollan síndrome antifosfolípidos. CUADRO VIII--19Clasificación y nomenclatura de los anticuerpos antifosfolípidos ----------------------------------------------------------------------- **Nombre** **Análisis para **Comentarios** detección** ----------------------- ----------------------- ----------------------- aCL ELISA utilizando como El aCL de pacientes con antígeno, un síndrome fosfolípido de CL con antifosfolípidos carga negativa reconoce la existencia de β2GPI en el suero humano y en el suero bovino, que se utiliza para bloquear los puntos de unión inespecíficos en la placa de ELISA. La cardiolipina estabiliza β2GPI a altas concentraciones en la superficie de poliestireno. Anticuerpos contra ELISA utilizando como Los anticuerpos β2GPI (anti-β2GPI) antígeno β2GPI reconocen la unión de purificada o β2GPI en ausencia de recombinante en cardiolipina a una ausencia de superficie de fosfolípidos poliestireno oxidado, donde se introducen átomos de oxígeno en los radicales C-O o C=O por radiación γ. LA aPTT Los anticuerpos reconocen β2GPI o protrombina y alargan la aPTT, lo que implica que interfieren con la generación de trombina a partir de protrombina. La prolongación de los tiempos de coagulación es un fenómeno in vitro y el LA induce trombosis in vivo. LA Tiempo de coagulación Los anticuerpos con caolín reconocen β2GPI o protrombina y alargan la aPTT, lo que implica que interfieren con la generación de trombina a partir de protrombina. La prolongación de los tiempos de coagulación es un fenómeno in vitro y el LA induce trombosis in vivo. LA Prueba de veneno de Los anticuerpos víbora de Russel reconocen β2GPI o diluido protrombina y alargan la aPTT, lo que implica que interfieren con la generación de trombina a partir de protrombina. La prolongación de los tiempos de coagulación es un fenómeno in vitro y el LA induce trombosis in vivo. ----------------------------------------------------------------------- Abreviaturas: β2GPI, β2 glucoproteína I; aCL: anticuerpos contra cardiolipina; LPA: síndrome antifosfolípido; aPTT: tiempo de tromboplastina parcial activado; APS: síndrome antifosfolípido; CL: cardiolipina; ELISA: enzimoinmunoanálisis de adsorción; LA: anticoagulante lúpico; PL: fosfolípidos.","letters":["A","B","C","D"]},{"q":"Una mujer de 84 años fue valorada por su médico familiar por cefalea intensa. Inició hace varias semanas y ha empeorado. No ha tenido aura visual, pero refiere que ha estado perdiendo la visión intermitentemente en el ojo izquierdo durante los últimos días. La paciente niega debilidad o parestesias, pero sí informó de dolor en la mandíbula al comer. Sus antecedentes patológicos de importancia incluyen arteriopatías coronarias que requirió un injerto de derivación 10 años antes, diabetes mellitus, hiperlipidemia y depresión leve. En el interrogatorio por aparatos y sistemas se detectó diaforesis y el dolor lumbar leve particularmente intenso por la mañana. ¿Cuál es el paso más adecuado a continuación?","o":["Ácido acetilsalicílico 975 mg por VO al día","Cuantificación de la tasa de eritrosedimentación","Inicio inmediato del tratamiento con glucocorticoides","Envío para toma de biopsia de arteria temporal","Envío para ecografía de la arteria temporal"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 363) El paciente tiene una presentación clásica de arteritis de células gigantes con polimialgia reumática asociada que incluye cefalea, claudicación mandibular y trastornos visuales. Su edad también hace que este diagnóstico sea muy probable. El diagnóstico se confirma mediante biopsia de la arteria temporal; sin embargo, en presencia de síntomas visuales, el inicio del tratamiento no debe retrasarse hasta la biopsia porque la biopsia puede ser positiva incluso después de aproximadamente 14 días de tratamiento con glucocorticoides. El retraso en el tratamiento corre el riesgo de pérdida visual irreversible. Además, una respuesta espectacular al tratamiento puede apoyar el diagnóstico. Aunque la tasa de eritrosedimentación está casi universalmente elevada, no es específica para el diagnóstico. La ecografía de la arteria temporal puede ser sugestiva pero no diagnóstica.","letters":["A","B","C","D","E"]},{"q":"Un médico recibe en el servicio de urgencias a un niño de tres años que llegó en ambulancia. Estaba comiendo cuando de repente comenzó con jadeo, tos y luego inició con indiferencia al medio. Sus padres están seguros de que presentó broncoaspiración. A su ingreso, su presión sanguínea se encontró baja y presenta esfuerzo respiratorio. Se auscultan sibilancias bilaterales. Se diagnosticó anafilaxia y se inició el tratamiento apropiado. ¿Cuál de las siguientes afirmaciones sobre la anafilaxis es verdadera?","o":["Los antecedentes de atopia son un factor de riesgo para la anafilaxis secundaria al tratamiento con penicilina.","La anafilaxis suele aparecer entre 1 y 2 h después de la exposición al antígeno.","Los glucocorticoides vía IV son eficaces para la anafilaxia aguda.","La edad avanzada se asocia con mejores resultados en la anafilaxis.","El hecho de no usar epinefrina en los primeros 20 min después del inicio de los síntomas es un factor de riesgo para muerte por anafilaxis."],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 353) No hay pruebas convincentes de que la edad, el sexo, la raza o la ubicación geográfica predisponga a un ser humano a la anafilaxis, excepto por la exposición a inmunógenos específicos. De acuerdo con la mayor parte de los estudios, la atopia no predispone a las personas a la anafilaxis causada por el tratamiento con penicilina o el veneno de un insecto, pero es un factor de riesgo para los alérgenos presentes en los alimentos o en el látex. Los factores de riesgo para malos resultados incluyen edad avanzada, uso de β-bloqueadores y la presencia de asma preexistente. Los individuos difieren en el tiempo de aparición de los síntomas y signos, pero la característica distintiva de la reacción anafiláctica es el inicio de algunas manifestaciones en cuestión de segundos a minutos después de la introducción del antígeno. El reconocimiento temprano de una reacción anafiláctica es obligado, porque la muerte puede ocurrir en término de minutos a horas después de la aparición del primer síntoma a causa de estado de choque. Los síntomas leves como prurito y urticaria pueden controlarse con la administración de 0.3 a 0.5 mL de epinefrina subcutánea o intramuscular al 1:1000 (1 mg/mL) con repetición de la dosis según sea necesario a intervalos de 5 a 20 min en casos de reacción grave. La incapacidad para utilizar epinefrina en los primeros 20 min después del inicio de los síntomas fue un factor de riesgo para malos resultados en estudios clínicos de anafilaxis alimentaria. Debe iniciarse la administración IV para proporcionar una vía de administración de 2.5 mL de epinefrina, diluida al 1:10 000 a intervalos de 5 a 10 min, expansores de volumen como solución salina isotónica y fármacos vasopresores como dopamina si ocurre hipotensión intratable. La reposición del volumen intravascular por fuga venular poscapilar puede requerir la administración de varios litros de solución salina. La epinefrina proporciona efectos α y β adrenérgicos, lo que ocasiona vasoconstricción, relajación del músculo liso bronquial y atenuación del incremento de la permeabilidad venular. Los fármacos auxiliares como el antihistamínico difenhidramina, 50 a 100 mg al día vía IM o IV y la aminofilina, 0.25 a 0.5 g por vía IV son apropiados para la urticaria y angioedema y para el broncoespasmo, respectivamente. Los glucocorticoides IV (0.5 a 1 mg/kg de metilprednisolona) no son eficaces para eventos agudos, pero pueden aliviar la recurrencia de broncoespasmo tardío, hipotensión o urticaria.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 55 años que se encuentra encarcelada tiene un área de induración que mide 15 mm, que apareció después de 72 h de una prueba cutánea con derivado proteínico purificado de tuberculina (PPD). ¿Qué tipo de reacción inmunitaria produce una prueba cutánea de PPD positiva para Mycobacterium tuberculosis?","o":["Reacción citotóxica por anticuerpos","Reacción de hipersensibilidad de tipo tardío","Reacción de hipersensibilidad de tipo inmediato","Formación de complejos inmunitarios"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 1 El sistema inmunitario en la salud y la enfermedad, cap. 349) Las reacciones inflamatorias iniciadas por leucocitos mononucleares y no por anticuerpos solos se han denominado reacciones de hipersensibilidad de tipo tardío. El término \"tardío\" se ha utilizado para comparar una respuesta celular que aparece entre 48 y 72 h después de la exposición al antígeno con una respuesta de hipersensibilidad inmediata, por lo general observada dentro de las 12 h posteriores a la exposición al antígeno e iniciada por la liberación del mediador basófilo o anticuerpos preformados. En pacientes previamente infectados con Mycobacterium tuberculosis, la colocación intradérmica de PPD de tuberculina como prueba cutánea da lugar a una zona de induración de la piel en 48 a 72 h, lo que refleja una reacción de hipersensibilidad de tipo tardía mediada por los leucocitos. La formación de complejos inmunitarios se refiere a la unión del antígeno, el complemento y el anticuerpo para eliminar el antígeno, pero también puede provocar daño hístico cuando el sistema reticuloendotelial no lo elimina y se deposita en tejidos como los vasos sanguíneos o los glomérulos, como puede ocurrir en algunos síndromes vasculíticos. Las reacciones citotóxicas a los anticuerpos se producen cuando los anticuerpos contra células o tejidos se unen al complemento y provocan lisis celular o lesión hística, como ocurre en las reacciones transfusionales.","letters":["A","B","C","D"]},{"q":"¿Cuál de las siguientes afecciones cardiovasculares puede ocurrir en la sarcoidosis como resultado de una infiltración granulomatosa?","o":["Aneurisma de la aorta abdominal","Arteriopatía coronaria","Disminución de la fracción de expulsión","Arritmia ventricular","C y D"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 367) La cardiopatía sarcoide, que suele presentarse como insuficiencia cardiaca congestiva o arritmias cardiacas, es el resultado de la infiltración del músculo cardiaco o del sistema de conducción por granulomas. La afectación granulomatosa difusa del músculo cardiaco puede provocar una disfunción cardiaca profunda con fracción de expulsión del ventrículo izquierdo \\< 10%. Incluso en esta situación, la fracción de expulsión puede mejorar con el tratamiento sistémico. Las arritmias también pueden ocurrir con infiltración difusa o con afección cardiaca en placas. Si se infiltra el nódulo auriculoventricular, puede producirse un bloqueo cardiaco, que se puede detectar por electrocardiografía. Las arritmias ventriculares y la muerte súbita por taquicardia ventricular son causas comunes de muerte. Las arritmias se detectan mejor mediante monitorización ambulatoria de 24 h y los estudios electrofisiológicos pueden ser normales. Otras pruebas de detección de enfermedad cardiaca incluyen electrocardiografía y ecocardiografía. La infiltración granulomatosa de los vasos sanguíneos, incluidas las arterias coronarias o la aorta, no es característica de la sarcoidosis.","letters":["A","B","C","D","E"]},{"q":"Se valora a un varón de 34 años que presentó pancreatitis inexplicable dos semanas antes. Los estudios de imagen del páncreas mostraron un agrandamiento pancreático difuso. Niega consumo de alcohol y los estudios de imagen no mostraron cálculos biliares. En la exploración física se observó notable agrandamiento de las glándulas lagrimales y de la glándula submandibular. En la figura VIII--73 se muestra la biopsia de la glándula submandibular. Las células que se muestran en la figura tienen una tinción muy positiva para IgG4, CD19 y CD138. ¿Cuál es el tratamiento adecuado?","o":["Talidomida y dexametasona","Inmunoglobulina contra citomegalovirus y ganciclovir","Quimioterapia sistémica","Prednisona","Anakinra"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 368) Este paciente presenta enfermedad relacionada con IgG4 (IgG4-RD). La IgG4-RD es una afección fibroinflamatoria caracterizada por una tendencia a formar lesiones tumefactas. Las manifestaciones clínicas de esta enfermedad son muy variables y siguen definiéndose. La afectación pancreática y retroperitoneal está bien descrita y puede presentarse como pancreatitis autoinmunitaria tipo 1, que se presenta como dolor abdominal leve, pérdida de peso e ictericia obstructiva aguda, simulando un adenocarcinoma de páncreas (incluida una tumoración pancreática). Las imágenes muestran agrandamiento pancreático difuso (denominado páncreas en forma de salchicha) o segmentario, con pérdida de la lobularidad normal; una tumoración a menudo plantea la sospecha de malignidad. Las características histopatológicas clave de la IgG4-RD son un infiltrado linfoplasmocitario denso que se organiza en un patrón helicoidal (parecido a un tejido de canasta), flebitis obliterativa e infiltrado eosinofílico de leve a moderado. El infiltrado inflamatorio está compuesto por una mezcla de linfocitos B y T. Los linfocitos B por lo general se organizan en centros germinales. Las tinciones de células plasmáticas para CD19, CD138 e IgG4 parecen irradiarse desde los centros germinales. La afectación de órganos vitales debe tratarse de forma intensiva, porque la IgG4-RD puede provocar disfunción orgánica grave. La enfermedad agresiva puede llevar rápidamente a hepatopatía terminal, deterioro permanente de la función pancreática, atrofia renal, disección aórtica o aneurismas y lesiones destructivas en los senos paranasales y de la nasofaringe. Los glucocorticoides son la primera línea de tratamiento. Los regímenes de tratamiento, extrapolados de la experiencia con el tratamiento de la pancreatitis autoinmunitaria, generalmente comienzan con 40 mg/día de prednisona, con dosis de 5 mg/día de prednisona que se van reduciendo hasta suspender o mantener en dos o tres meses. La respuesta clínica a los glucocorticoides suele ser rápida y sorprendente; sin embargo, los datos longitudinales indican que las exacerbaciones de la enfermedad se producen en más de 90% de los pacientes en un plazo de tres años. En algunos pacientes se han utilizado fármacos ahorradores de esteroides como azatioprina y micofenolato mofetilo; sin embargo, faltan pruebas de su eficacia.","letters":["A","B","C","D","E"]},{"q":"Una mujer estadounidense de raza negra de 45 años con lupus eritematoso sistémico (SLE, systemic lupus erythematosus) se presenta en el servicio de urgencias por cefalea y fatiga. Sus manifestaciones previas de SLE incluyeron artralgias, anemia hemolítica, erupción malar y úlceras bucales y tiene títulos altos de anticuerpos contra DNA bicatenario. Actualmente está tomando prednisona, 5 mg al día, e hidroxicloroquina, 200 mg al día. Su presión arterial es 190/110, frecuencia cardiaca de 98 latidos por minuto (lpm). Un análisis de orina muestra 25 eritrocitos por campo de alta resolución con proteinuria 2+. No se identifican cilindros eritrocíticos. Su nitrógeno ureico en sangre es de 88 mg/100 mL y la creatinina es de 2.6 mg/100 mL (valor inicial de 0.8 mg/100 mL). No ha tenido previamente nefropatía lúpica y no está tomando antiinflamatorios no esteroideos. La paciente niega enfermedad reciente, disminución del consumo de alimentos o diarrea. ¿Cuál es el siguiente paso en el tratamiento de esta paciente?","o":["Iniciar ciclofosfamida, 500 mg/m2 de superficie corporal vía IV y planificar repetir una vez al mes durante tres a seis meses","Iniciar hemodiálisis","Iniciar tratamiento con esteroides de dosis altas (metilprednisolona vía IV, 1 000 mg al día en tres dosis, seguida de prednisona oral, 1 mg/kg al día) y micofenolato mofetilo, 2 g diarios","Iniciar plasmaféresis","Interrumpir todo el tratamiento hasta que se realice una biopsia renal"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 356) Esta paciente presenta nefritis lúpica aguda con evidencia de hematuria, proteinuria y aumento agudo de la creatinina. Junto con la infección, la nefritis es la causa más frecuente de mortalidad en la primera década tras el diagnóstico del lupus eritematoso sistémico (SLE) y justifica un tratamiento inmunodepresor inmediato. Es importante valorar otras causas potencialmente reversibles de insuficiencia renal aguda, pero esta paciente no tiene enfermedad grave y no está tomando medicamentos que puedan causar insuficiencia renal. El análisis de orina muestra evidencia de nefritis activa con hematuria y proteinuria. Incluso en ausencia de cilindros eritrocíticos, no se debe suspender el tratamiento a la espera de los resultados de la biopsia en una persona con diagnóstico conocido de LES con presentación clínica y hallazgos compatibles en los exámenes de orina. Este paciente también tiene otros factores de riesgo conocidos para el desarrollo de nefritis lúpica, incluyendo títulos altos de anticuerpos contra dsDNA y los estadounidenses de raza negra. La base del tratamiento para cualquier manifestación potencialmente letal o que ponga en riesgo a los órganos en caso de LES son los glucocorticoides sistémicos en dosis altas. Se recomienda la adición de fármacos citotóxicos u otros inmunodepresores (ciclofosfamida, azatioprina, micofenolato mofetilo) para tratar las complicaciones graves del SLE, pero sus efectos se retrasan entre tres y seis semanas después del inicio del tratamiento, mientras que los efectos de los glucocorticoides comienzan en 24 h. Por lo tanto, estos fármacos por sí solos no deben utilizarse para tratar las manifestaciones graves agudas del SLE. La elección del fármaco citotóxico queda a criterio del médico tratante. Se ha demostrado que la ciclofosfamida en combinación con tratamiento con esteroides previene el desarrollo de nefropatía terminal mejor que los esteroides solos. Asimismo, el micofenolato también previene el desarrollo de nefropatía terminal en combinación con glucocorticoides y algunos estudios sugieren que los estadounidenses de raza negra tienen una respuesta mayor al micofenolato que a la ciclofosfamida. La plasmaféresis no está indicada en el tratamiento de la nefritis lúpica, pero es útil en casos de anemia hemolítica grave o púrpura trombocitopénica trombótica asociada al SLE. Por último, esta paciente no tiene indicación aguda de hemodiálisis y, con tratamiento, puede recuperar la función renal.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 58 años refiere dolor en el hombro derecho. Ella no recuerda ninguna lesión previa, pero señala que ha percibido rigidez progresiva en el hombro durante los últimos meses. Con anterioridad tuvo varios episodios de bursitis del hombro derecho que fueron tratados con éxito con fármacos antiinflamatorios no esteroideos e inyecciones de corticoesteroides. Entre los antecedentes patológicos de importancia refiere diabetes mellitus, por lo que toma metformina y glibenclamida. En la exploración física, el hombro derecho no está caliente ni enrojecido, pero es doloroso a la palpación. La amplitud de movimiento pasivo y activo está limitada en flexión, extensión y abducción. Una radiografía del hombro derecho muestra osteopenia sin evidencia de erosión articular ni osteofitos. ¿Cuál es el diagnóstico más probable?","o":["Capsulitis adhesiva","Necrosis avascular","Tendinitis bicipital","Artrosis","Desgarro del manguito de los rotadores"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 375) La capsulitis adhesiva u \"hombro congelado\", se caracteriza por dolor y restricción del movimiento del hombro. Por lo general, esto ocurre en ausencia de enfermedad intrínseca del hombro, incluida la osteoartrosis y la necrosis avascular. Sin embargo, es más frecuente en pacientes que han tenido bursitis o tendinitis, así como en pacientes con otras enfermedades sistémicas, como enfermedad pulmonar crónica, cardiopatía isquémica y diabetes mellitus. La causa no está clara, pero la capsulitis adhesiva parece desarrollarse en el contexto de una inmovilidad prolongada. La distrofia simpática refleja también puede ocurrir en el contexto de capsulitis adhesiva. Clínicamente, este trastorno se observa con mayor frecuencia en mujeres mayores de 50 años. El dolor y la rigidez se desarrollan en el transcurso de meses a años. En la exploración física, la articulación afectada es sensible a la palpación, con un rango de movimiento restringido. El método ideal para el diagnóstico es la artrografía con limitación en la cantidad del medio de contraste inyectable a menos de 15 mL. En la mayor parte de los pacientes, la capsulitis adhesiva cederá en forma espontánea al cabo de uno a tres años. Los fármacos antiinflamatorios no esteroideos, las inyecciones de glucocorticoides, la fisioterapia y la movilización temprana del brazo son medidas terapéuticas útiles.","letters":["A","B","C","D","E"]},{"q":"Un varón de 25 años ingresó en la unidad de cuidados intensivos (ICU, intensive care unit) con hipoxemia. El personal de cuidados intensivos informó que el paciente ha presentado hemoptisis de dos días de evolución, que se ha incrementado de intensidad. En los estudios de laboratorio se encontró elevación notable de creatinina. Al final se estableció el diagnóstico de síndrome de Goodpasture. ¿Cuál es el mecanismo inmunitario que causa daño a los órganos en el síndrome de Goodpasture?","o":["Citotoxicidad celular dependiente de anticuerpos","Autoanticuerpos que activan el complemento","Autoanticuerpos inactivadores","Autoanticuerpos estimulantes","Citotoxicidad celular mediada por linfocitos T"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 355) Los mecanismos de lesión hística en las enfermedades autoinmunitarias pueden dividirse en procesos mediados por anticuerpos y mediados por células (cuadro VIII--13). La patogenicidad de los autoanticuerpos puede estar mediada por varios mecanismos, como la opsonización de factores solubles o células, la activación de una cascada inflamatoria a través del sistema del complemento y la interferencia con la función fisiológica de células o de moléculas solubles. El síndrome de Goodpasture es una enfermedad caracterizada por hemorragia pulmonar y glomerulonefritis grave, que representa un ejemplo de la unión de anticuerpos que conduce a la activación local del complemento y acumulación y activación de los neutrófilos. El autoanticuerpo de esta enfermedad se une a la cadena α3 del colágeno tipo IV en la membrana basal. CUADRO VIII--13Mecanismos de daño hístico en la enfermedad autoinmunitaria ------------------------------------------------------------------------------------- **Efector** **Mecanismo** **Objetivo** **Enfermedad** ----------------- ------------------------------ ----------------- ------------------ Autoanticuerpo Bloqueo o inactivación Cadena α del Miastenia grave receptor nicotínico de acetilcolina Complejo de Síndrome fosfolípido-β2-glucoproteína I antifosfolípido Receptor de insulina Diabetes mellitus resistente a la insulina Factor intrínseco Anemia perniciosa Estimulación Receptor de TSH Enfermedad de (LATS) Graves Proteinasa-3 (ANCA) Granulomatosis con poliangitis Caderina epidérmica Pénfigo vulgar Desmogleína 3 Activación del complemento Cadena α3 del Síndrome de colágeno IV Goodpasture Formación de complejos DNA bicatenario Lupus eritematoso inmunitarios sistémico Inmunoglobulinas Artritis reumatoide Opsonización GpIIb:IIIa Púrpura plaquetaria trombocitopénica autoinmunitaria Antígenos Rh, antígeno I Anemia hemolítica autoinmunitaria Citotoxicidad celular Peroxidasa Tiroiditis de dependiente de anticuerpos tiroidea, Hashimoto tiroglobulina Linfocitos T Producción de citocinas Artritis reumatoide, esclerosis múltiple, diabetes mellitus tipo 1 Citotoxicidad celular Diabetes mellitus tipo 1 ------------------------------------------------------------------------------------- Abreviaturas: ANCA, anticuerpos contra el citoplasma de neutrófilos; LATS, estimulador tiroideo de acción prolongada; TSH, hormona estimulante de la tiroides.","letters":["A","B","C","D","E"]},{"q":"Se valoró a un varón de 47 años por padecimiento de un año de evolución con episodios recurrentes de hinchazón bilateral de los oídos. Tiene dolor en el oído durante esos eventos y la oreja derecha se ha tornado fláccida. Está sano y niega consumo de sustancias ilegales. Trabaja en una oficina y practica tenis. En la exploración física, la oreja izquierda tiene un color rojo rojizo y el pabellón auricular está doloroso e hinchado; el lóbulo de la oreja tiene hinchazón mínima pero no tiene eritema ni dolor a la palpación. ¿Cuál de las siguientes es la explicación más probable de este hallazgo?","o":["Síndrome de Behçet","Síndrome de Cogan","Hemoglobinopatía","Traumatismo recurrente","Policondritis recidivante"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 366) La policondritis recidivante se presenta con mayor frecuencia con hinchazón dolorosa recurrente del oído. Aunque puede ocurrir afección de otros sitios cartilaginosos, como la nariz y el árbol traqueobronquial, estos son menos frecuentes. Los episodios de afectación del oído pueden provocar flaccidez del pabellón auricular. Por lo general, el pabellón auricular se ve afectado mientras se respeta el lóbulo de la oreja porque no hay cartílago en éste. El síndrome de Cogan es un síndrome de vasculitis poco frecuente que implica hipoacusia, pero la inflamación del cartílago no es una característica. En este paciente, el traumatismo o irritación recurrentes son signos que deben tomarse en cuenta, pero los datos de la anamnesis no son sugestivos y sería menos probable que fuera bilateral y se acompañara de hallazgos inflamatorios y con un lóbulo de la oreja relativamente conservado.","letters":["A","B","C","D","E"]},{"q":"Todas las siguientes son características clave del sistema inmunitario innato EXCEPTO:","o":["Es una característica exclusiva de los animales vertebrados","Las células importantes incluyen macrófagos y linfocitos citolíticos naturales","Ausencia de reconocimiento de microorganismos o moléculas extrañas benignas","Reconocimiento por moléculas del hospedador codificadas en línea germinal","Reconocimiento de factores clave de virulencia de microorganismos, pero no reconocimiento de moléculas del propio individuo"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 1 El sistema inmunitario en la salud y la enfermedad, cap. 349) El sistema inmunitario innato es filogenéticamente la forma más antigua de sistema de defensa inmunológica, heredada de los invertebrados. Este sistema de defensa utiliza proteínas codificadas por la línea germinal para reconocer patrones moleculares asociados a patógenos. Las células del sistema inmunitario innato incluyen macrófagos, células dendríticas y linfocitos citolíticos naturales. Los componentes críticos del sistema inmunitario innato incluyen el reconocimiento de moléculas del hospedador codificadas en la línea germinativa y el reconocimiento de factores clave de virulencia del microorganismo, pero no el reconocimiento de moléculas del propio individuo y moléculas extrañas benignas o de microorganismos. La inmunidad adaptativa se encuentra solo en animales vertebrados y se basa en la generación de receptores de antígenos en los linfocitos T y B mediante reordenamientos génicos, de modo que los linfocitos T o B individuales expresan receptores de antígenos únicos en su superficie capaces de reconocer diversos antígenos ambientales.","letters":["A","B","C","D","E"]},{"q":"Un hombre de 55 años acudió al servicio de urgencias con pérdida de peso, fiebre, dolor testicular y lesiones cutáneas en las piernas de inicio reciente. En la exploración física, tiene dolor a la palpación del abdomen y lesiones eritematosas elevadas en las piernas que no palidecen con la compresión. Los datos de laboratorio muestran incremento en la tasa de eritrosedimentación y proteína C reactiva, así como un antígeno de superficie positivo para hepatitis B. Se sometió a biopsia cutánea quirúrgica. Es más probable que la biopsia muestre lo siguiente:","o":["Necrosis fibrinoide de arterias de pequeño y mediano calibre","Dermatitis de la interfaz","Vasculitis leucocitoclástica con depósito de IgA en el estudio de inmunofluorescencia","Granulomas no caseificantes","Paniculitis septal"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 363) Este paciente presenta poliarteritis nudosa relacionada con hepatitis B. Se ha descrito un síndrome similar con la infección por hepatitis C. Los signos y síntomas inespecíficos son la característica distintiva de la poliarteritis nudosa (cuadro VIII--49). La fiebre, pérdida de peso y malestar general están presentes en más de la mitad de los casos. Los pacientes suelen presentar síntomas vagos como debilidad, malestar general, cefalea, dolor abdominal y mialgias que pueden progresar rápidamente a una enfermedad fulminante. Los síntomas específicos relacionados con la afectación vascular dentro de un sistema orgánico determinado también pueden dominar el cuadro clínico de presentación, así como toda la evolución de la enfermedad. No existen pruebas serológicas diagnósticas para la poliarteritis nudosa. En más de 75% de los pacientes, el recuento leucocítico está elevado con predominio de neutrófilos. Se puede observar anemia por enfermedad crónica y casi siempre hay elevación de la tasa de eritrosedimentación. Otros hallazgos comunes en los resultados de laboratorio reflejan el órgano en particular involucrado. Puede haber hipergammaglobulinemia y todos los pacientes deben someterse a exámenes de detección de hepatitis B y C. La lesión vascular en la poliarteritis nudosa es una inflamación necrosante de las arterias musculares de pequeño y mediano calibre. Las lesiones son segmentarias y tienden a afectar bifurcaciones y ramificaciones de las arterias. Se pueden diseminar circunferencialmente para afectar las venas adyacentes. Sin embargo, la afectación de las vénulas no se observa en la poliarteritis nudosa y, si está presente, sugiere el diagnóstico de poliangitis microscópica. En las etapas agudas de la enfermedad, los neutrófilos polimorfonucleares se infiltran en todas las capas de la pared del vaso y en las áreas perivasculares, lo que provoca la proliferación de la íntima y la degeneración de la pared del vaso. Las células mononucleares se infiltran en la zona a medida que las lesiones progresan a los estadios subagudo y crónico. La necrosis fibrinoide de los vasos ocasiona compromiso de la luz, trombosis, infarto de los tejidos suministrados por el vaso afectado y, en algunos casos, hemorragia. La biopsia cutánea en las vasculitis por IgA muestra una confirmación de vasculitis leucocitoclástica con depósito de IgA y C3 por inmunofluorescencia. La dermatitis de interfaz se observa en el lupus eritematoso sistémico, la dermatomiositis y con ciertas infecciones. Los granulomas no caseificantes se observan en las biopsias cutáneas en casos de sarcoidosis. La paniculitis septal puede observarse en el eritema nudoso. CUADRO VIII--49Manifestaciones clínicas relacionadas con la afectación del sistema orgánico en la poliarteritis nudosa ----------------------------------------------------------------------- **Sistema orgánico** **Porcentaje de **Manifestaciones incidencia** clínicas** ----------------------- ----------------------- ----------------------- Renal 60 Insuficiencia renal, hipertensión Musculoesquelético 64 Artritis, artralgia, mialgias Sistema nervioso 51 Neuropatía periférica, periférico mononeuritis múltiple Tubo digestivo 44 Dolor abdominal, náuseas y vómitos, sangrado, infarto y perforación intestinal, colecistitis, infarto hepático, infarto pancreático Piel 43 Erupción cutánea, púrpura, nódulos, infartos cutáneos, livedo reticular, fenómeno de Raynaud Cardiaco 36 Insuficiencia cardiaca congestiva, infarto de miocardio, pericarditis Genitourinario 25 Dolor testicular, ovárico o epidídimo Sistema nervioso 23 Accidente central cerebrovascular, alteración del estado mental, convulsiones ----------------------------------------------------------------------- Datos con autorización de Cupps TR et al: The Vasculitides. Philadelphia: Saunders, 1981.","letters":["A","B","C","D","E"]},{"q":"Todos los siguientes factores predisponen para el lupus eritematoso sistémico EXCEPTO:","o":["Deficiencia del inhibidor de la esterasa C1","Género femenino","Alelos HLA-DR","Tabaquismo","Luz ultravioleta"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 356) El lupus eritematoso sistémico (SLE) es una enfermedad multigénica caracterizada por una respuesta inmunitaria anormal (fig. VIII--16). Los defectos monógenos raros confieren una razón de riesgo para el SLE (5--25), incluidas deficiencias homocigotas de componentes tempranos del complemento (C1q, r, s; C2; C4) y una mutación en TREX1 (que codifica una DNase) en el cromosoma X. La deficiencia del inhibidor de la C1-esterasa se asocia con angioedema hereditario en lugar de LES. Las moléculas de antígeno leucocítico humano (HLA) predisponentes y presentadoras de antígeno se encuentran con mayor frecuencia en múltiples grupos étnicos (HLA-DRB1 \\*0301 y \\*1501 y DR3), así como en múltiples genes en la región de 120 genes del complejo mayor de histocompatibilidad. El sexo femenino es permisivo para el SLE con evidencia de efectos hormonales, genes en el cromosoma X y diferencias epigenéticas entre géneros que desempeñan una función importante. Las hembras de muchas especies de mamíferos producen respuestas de anticuerpos más intensas que los machos. Las mujeres expuestas a anticonceptivos orales que contienen estrógenos o con reemplazo hormonal tienen un mayor riesgo de desarrollar SLE (razón de riesgo 1.2--2). Varios estímulos ambientales pueden influir en el SLE. La exposición a la luz UV provoca exacerbaciones del SLE en casi 70% de los pacientes, posiblemente al aumentar la apoptosis en las células de la piel o al alterar el DNA y las proteínas intracelulares para volverlas antigénicas. *\\[ FIGURA VIII--16 --- ver imagen en el documento original \\]* Abreviaturas: Ag: antígeno; C1q, sistema del complemento; C3, componente del complemento; SNC: sistema nervioso central; DC: células dendríticas; dz: enfermedad; VEB, virus de Epstein-Barr; HLA: antígeno leucocítico humano; IFN: interferón; inflam, inflamación; Rx, prescripción.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes afirmaciones sobre la osteoartrosis es verdadera?","o":["Durante el estudio diagnóstico de una presunta articulación osteoartrítica, se justifica la resonancia magnética para valorar cualquier otra causa.","La pérdida de cartílago provoca dolor por estimulación directa de los receptores del dolor en el propio cartílago articular.","La osteoartrosis es la segunda causa más frecuente de artritis, después de la artritis reumatoide.","El recuento de leucocitos en el líquido sinovial suele ser \\< 1 000 células/μL en la osteoartrosis.","La gravedad de los cambios radiográficos en la osteoartrosis se correlaciona bien con los síntomas."],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 371) El examen del líquido sinovial suele ser útil en la sospecha de osteoartrosis (OA), en especial si es posible una enfermedad inflamatoria. Si el recuento de leucocitos en el líquido sinovial es \\> 1 000/μL, es probable que se produzca artritis inflamatoria, gota o seudogota y los dos últimos también se identifican por la presencia de cristales. Como el cartílago carece de nervios, la pérdida de cartílago en una articulación no se acompaña de dolor. Por lo tanto, es probable que el dolor en la OA surja de estructuras externas al cartílago. Estructuras inervadas en la articulación incluyen la membrana sinovial, los ligamentos, la cápsula articular, los músculos y el hueso subcondral. La mayor parte de estos no se visualizan mediante rayos X y la gravedad de los cambios radiográficos en la osteoartrosis se correlaciona mal con la gravedad del dolor. La OA es el tipo más común de artritis. Su alta prevalencia, en especial en adultos mayores y la elevada tasa de incapacidad relacionada con la enfermedad la convierten en una de las principales causas de discapacidad en los adultos mayores. Aunque la resonancia magnética puede revelar el alcance de la patología en una articulación osteoartrósica, no está indicada como parte del estudio diagnóstico.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de los siguientes trastornos se asocia con la policondritis recurrente?","o":["Arteritis de células gigantes","Granulomatosis con poliangitis (antes conocida como enfermedad de Wegener)","Artritis reumatoide","Psoriasis","B y C"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 365) La policondritis recidivante es un trastorno poco frecuente de causa desconocida caracterizado por la inflamación del cartílago que afecta predominantemente a las orejas, la nariz y el árbol laringotraqueobronquial. Otras manifestaciones incluyen escleritis, hipoacusia neurosensitiva, poliartritis, anomalías cardiacas, lesiones cutáneas y glomerulonefritis. Casi 30% de los pacientes con policondritis recidivante presentarán otro trastorno reumatológico, siendo el más frecuente la vasculitis sistémica como granulomatosis con poliangitis, seguida de artritis reumatoide y lupus eritematoso sistémico (cuadro VIII--65). Los trastornos no reumáticos también se han asociado con policondritis recurrente. CUADRO VIII--65Trastornos asociados con policondritis recidivantea ----------------------------------------------------------------------- **Vasculitis sistémica** ----------------------------------------------------------------------- Artritis reumatoide Lupus eritematoso sistémico Colagenopatía superpuesta Espondiloartrítides Síndrome de Behçet Polimialgia reumática Cirrosis biliar primaria Fibrosis pulmonar Tiroiditis de Hashimoto Enfermedad de Graves Enfermedad de Crohn Colitis ulcerosa Síndrome mielodisplásico ----------------------------------------------------------------------- aLa vasculitis sistémica es la asociación más frecuente, seguida de la artritis reumatoide y lupus eritematoso sistémico. Modificado con autorización de Michet CJ et al: Relapsing polychondritis. Survival and predictive role of early disease manifestations. Ann Intern Med 104:74, 1986.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 28 años acudió al servicio de urgencias por padecimiento de un día de evolución con dolor e hinchazón en la pierna derecha que tiende a empeorar. La paciente condujo un automóvil durante 8 h dos días antes para realizar un viaje de senderismo y luego notó dolor leve en la pierna. Al principio pensó que se debía al esfuerzo, pero ha empeorado a lo largo del día. Sus antecedentes personales patológicos se relacionan con la dificultad para embarazarse, con el antecedente de dos abortos espontáneos. En la exploración física, sus signos vitales son normales al igual que la revisión cardiaca y pulmonar. Su pierna derecha está hinchada desde la mitad del muslo en sentido distal y hay dolor a la palpación. Los estudios Doppler demuestran una gran trombosis venosa profunda en las venas femoral e iliaca que se extiende hacia la pelvis. Los estudios de laboratorio al momento de la hospitalización previo al tratamiento muestran electrólitos normales, recuentos normales de leucocitos y plaquetas, tiempo normal de protrombina y tiempo de tromboplastina parcial activada tres veces por arriba del valor normal. Su prueba de embarazo fue negativa. El tratamiento con heparina de bajo peso molecular se inició en el servicio de urgencias. ¿Cuál de las siguientes opciones debe incluir el tratamiento subsiguiente?","o":["Rituximab 375 mg/m2 por semana durante cuatro semanas","Warfarina con objetivos de índice internacional normalizado (INR) de 2 a 3 durante tres meses","Warfarina con INR objetivo de 2 a 3 por 12 meses","Warfarina con INR objetivo de 2.5 a 3.5 de por vida","Warfarina con INR objetivo de 2.5 a 3.5 durante 12 meses seguida de ácido acetilsalicílico diario de por vida"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 357) Esta paciente tiene una presentación típica de síndrome antifosfolípidos (APS, antiphospholipid) con trombosis venosa profunda, antecedentes de aborto espontáneo, con alteración aislada del tiempo de tromboplastina parcial activada (aPTT) a causa del anticoagulante lúpico. Otras características clínicas del síndrome antifosfolípidos que afectan a la circulación arterial o venosa incluyen livedo reticular (24%), embolia pulmonar (14%), accidente cerebrovascular (20%), isquemia cerebral transitoria (10%), infarto del miocardio (10%), migraña (20%), preeclampsia (10%), trombocitopenia (30%) y anemia hemolítica autoinmunitaria (10%). Los criterios de laboratorio incluyen la demostración de anticoagulante lúpico (incremento de aPTT que no se corrige con la mezcla), junto con la presencia de anticuerpos contra cardiolipina, contra β-2 glucoproteína I o contra ambas en dos ocasiones con tres meses de diferencia. Tras el diagnóstico de un episodio trombótico debido a síndrome antifosfolípidos, los pacientes deben recibir warfarina de por vida con índice internacional normalizado (INR) ideal de 2.5 a 3.5, solo o en combinación con ácido acetilsalicílico diario. Durante el embarazo, las pacientes deben recibir heparina más ácido acetilsalicílico. Los pacientes que desarrollan trombosis recurrente mientras reciben anticoagulación eficaz pueden beneficiarse de una administración IV de gammaglobulina durante cinco días o de tratamiento con rituximab durante cuatro semanas. Se desconoce cuál es el tratamiento óptimo para los pacientes con síndrome antifosfolípidos sin un episodio trombótico; sin embargo, la administración diaria de ácido acetilsalicílico (80 mg) protege a los pacientes con lupus eritematoso sistémico y con anticuerpos antifosfolípidos de los episodios trombóticos. La warfarina durante tres meses con un INR ideal de dos a tres es el tratamiento recomendado para la trombosis venosa profunda (TVP) con un evento precipitante reversible conocido. La warfarina durante seis a 12 meses con cifras ideales de INR de 2 a 3 es el tratamiento recomendado para el primer episodio de trombosis venosa profunda idiopática.","letters":["A","B","C","D","E"]},{"q":"Un varón caucásico de 60 años con antecedentes de psoriasis acudió a la clínica para una cita de vigilancia. Ha recibido tratamiento con infliximab (un inhibidor del factor de necrosis tumoral) durante casi un año. Desde su última dosis de infliximab, ha experimentado dolor muscular y articular y erupción facial de inicio reciente. En la exploración física se observó una erupción malar eritematosa elevada, pero no hay sinovitis en ninguna articulación y en la exploración neurológica no se encontró debilidad. Los exámenes de laboratorio reportaron anticuerpos antinucleares positivos con títulos de 1:320. ¿Qué autoanticuerpo específico es más probable que esté presente?","o":["Anticuerpos contra β-2-glucoproteína","Anticuerpos contra proteínas cíclicas citrulinadas","Anticuerpos contra dsDNA","Anticuerpos contra histonas","Anticuerpos contra la peroxidasa tiroidea"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 356) El lupus farmacoinducido (DIL, drug-induced lupus) es un síndrome de anticuerpos antinucleares positivos (ANA) asociado con síntomas como fiebre, malestar general, artritis o artralgias/mialgias intensas, serositis, erupción cutánea o combinaciones de estas manifestaciones. La lista de sustancias que pueden inducir una enfermedad similar al lupus es larga. Entre los más frecuentes se encuentran los antiarrítmicos procainamida, disopiramida y propafenona; el antihipertensivo hidralazina; varios inhibidores de la enzima convertidora de angiotensina y β-bloqueadores; el antitiroideo propiltiouracilo; los antipsicóticos clorpromazina y litio; los anticonvulsivos carbamazepina y difenilhidantoinato; los antibióticos isonizida, minociclina y nitrofurantoína; el antirreumático sulfasalazina; el diurético hidroclorotiazida y los hipolipemiantes lovastatina y simvastatina. Los productos biológicos que pueden causar lupus farmacoinducido incluyen inhibidores de interferones y factor de necrosis tumoral. En el lupus farmacoinducido, los ANA suelen aparecer antes de los síntomas; sin embargo, muchos de los medicamentos mencionados anteriormente inducen ANA en pacientes que nunca presentan síntomas de lupus farmacoinducido. Es apropiado realizar la prueba de ANA ante el primer indicio de síntomas relevantes y utilizar los resultados de las pruebas para ayudar a decidir si se debe suspender el fármaco sospechoso. Los anticuerpos contra la glucoproteína β-2 se observan en el síndrome de anticuerpos antifosfolípido. Los anticuerpos contra péptidos cíclicos citrulinados son característicos de la artritis reumatoide y no suelen estar presentes en pacientes con psoriasis o artritis psoriásica. Los anticuerpos antiperoxidasa tiroidea se observan en la tiroiditis de Hashimoto. El síndrome aparece durante el tratamiento con ciertos fármacos y agentes biológicos, predomina la población caucásica, tiene menos predilección por las mujeres que el lupus eritematoso sistémico, rara vez afecta a los riñones o al cerebro, rara vez se asocia con anti-dsDNA, se asocia a menudo con anticuerpos contra las histonas y, por lo general, se resuelve durante varias semanas después de interrumpir la exposición al fármaco causal.","letters":["A","B","C","D","E"]},{"q":"Una mujer estadounidense de raza negra de 40 años acudió a la clínica con una erupción facial. Sus lesiones cutáneas han persistido por varios meses, se encuentra elevada y eritematosa (fig. VIII--68). También informa de tos seca de aparición reciente. La radiografía de tórax muestra linfadenopatía hiliar bilateral. ¿Qué tipo de erupción cutánea presenta?","o":["Acné vulgar","Lupus cutáneo agudo","Eritema nudoso","Erupción en heliotropo","Lupus pernio"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 367) La afectación cutánea se identifica finalmente en más de un tercio de los pacientes con sarcoidosis. Las lesiones cutáneas clásicas incluyen eritema nudoso, lesiones maculopapulares, hiperpigmentación e hipopigmentación, formación de queloides y nódulos subcutáneos. Un complejo específico de afectación del puente de la nariz, el área debajo de los ojos y las mejillas se denomina lupus pernio y es diagnóstico de una forma crónica de sarcoidosis. En cambio, el eritema nudoso es una erupción transitoria que puede observarse en asociación con adenopatía hiliar y uveítis (síndrome de Löfgren). El eritema nudoso es más frecuente en las mujeres y en ciertos grupos demográficos que incluye a los caucásicos y puertorriqueños. En Estados Unidos, las otras manifestaciones de la sarcoidosis cutánea, especialmente el lupus pernio, son más comunes en estadounidenses de raza negra que en caucásicos. Las lesiones maculopapulares de la sarcoidosis son la forma crónica más frecuente de la enfermedad. A menudo, el paciente y el médico los pasan por alto porque son crónicos e indoloros. Al inicio, estas lesiones suelen ser pápulas violáceas y suelen encontrarse induración. Las lesiones pueden ser confluentes e infiltrantes en grandes áreas de la piel. Con el tratamiento, el color y la induración tienden a desaparecer. Debido a que estas lesiones son causadas por granulomas sin caseificación, el diagnóstico de sarcoidosis se puede hacer fácilmente con biopsia de piel. El lupus cutáneo agudo puede afectar la cara pero no es nodular y a menudo tiene una distribución malar respetando la región nasolabial. El acné vulgar es más común en adolescentes y adultos jóvenes y, por lo general, incluye pústulas inflamatorias que no se ven aquí.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 32 años con diagnóstico de lupus eritematoso sistémico de larga evolución fue valorada por su reumatólogo para vigilancia programada. Se auscultó un nuevo soplo cardiaco y se solicitó un ecocardiograma. La paciente se siente bien y no tiene fiebre, pérdida de peso ni enfermedad cardiaca preexistente. Se demostró la presencia de una vegetación en la válvula mitral. ¿Cuál de las siguientes afirmaciones es verdadera?","o":["Es poco probable que los hemocultivos sean positivos.","Se ha demostrado que el tratamiento con glucocorticoides mejora esta afección.","Con frecuencia se presenta pericarditis concomitante.","La lesión tiene un riesgo bajo de embolia.","La paciente ha estado usando drogas inyectables a escondidas."],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 356) La paciente tiene endocarditis de Libman-Sacks asociada con lupus eritematoso sistémico (SLE). Esto produce endocarditis fibrinosa y puede provocar insuficiencia valvular, con mayor frecuencia mitral o aórtica o embolia. Por lo general no ocurre pericarditis concomitante, aunque esta es otra manifestación cardiaca frecuente del SLE. Aunque los glucocorticoides y los tratamientos antiinflamatorios no tienen ningún beneficio comprobado en esta afección, a menudo se usan junto con tratamiento de sostén. Como la endocarditis de Libman-Sacks es una endocarditis con cultivos negativos y no se cree que se deba a una infección microbiana, los hemocultivos no serán positivos.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes afirmaciones sobre la sarcoidosis pulmonar es verdadera?","o":["La afección pulmonar es la segunda manifestación más frecuente de la sarcoidosis, solo después de la afección cutánea.","La enfermedad obstructiva es una manifestación poco frecuente de la sarcoidosis pulmonar.","La hipertensión pulmonar nunca responde al tratamiento en pacientes con sarcoidosis.","Los infiltrados pulmonares en la sarcoidosis tienden a ser predominantemente un proceso del lóbulo superior.","La presencia de tos debe hacer que se investigue una causa diferente a la sarcoidosis pulmonar."],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 367) La afectación pulmonar ocurre en \\> 90% de los pacientes con sarcoidosis y es, con mucho, la manifestación más frecuente de la sarcoidosis. Los datos característicos en la CT incluyen engrosamiento peribronquial y cambios reticulonodulares, predominantemente subpleurales. El engrosamiento peribronquial observado en la CT parece explicar el alto rendimiento de los granulomas de las biopsias bronquiales realizadas para el diagnóstico. Por lo general, los infiltrados en la sarcoidosis son predominantemente un trastorno del lóbulo superior. Casi 50% de los pacientes con sarcoidosis presentan enfermedad obstructiva, lo que se refleja en una relación reducida entre el volumen espiratorio forzado en un s y la capacidad vital forzada. La tos es un síntoma común. La afectación de las vías respiratorias que causa diversos grados de obstrucción es la base de la tos en la mayor parte de los pacientes con sarcoidosis. Se ha notificado hipertensión arterial pulmonar en al menos 5% de los pacientes con sarcoidosis. Tanto la afectación vascular directa como la consecuencia de cambios fibróticos en el pulmón pueden provocar hipertensión arterial pulmonar. En pacientes con sarcoidosis con fibrosis terminal en espera de trasplante pulmonar, 70% de los pacientes presentará hipertensión arterial pulmonar. Esta incidencia es mucho mayor que la reportada para otras enfermedades pulmonares fibróticas. En pacientes menos avanzados, pero aún sintomáticos, se ha observado hipertensión arterial pulmonar en hasta en 50% de los casos. Dado que la hipertensión arterial pulmonar asociada a la sarcoidosis puede responder al tratamiento, se debe considerar en la valoración de pacientes con disnea persistente.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 25 años acudió a valoración por presentar úlceras bucales dolorosas. Ella describe estas lesiones como úlceras superficiales que duran una o dos semanas. Las úlceras han aparecido durante los últimos seis meses. Durante los últimos dos días, el paciente ha tenido eritema ocular doloroso. No ha tenido ulceraciones genitales, artritis, erupciones cutáneas ni fotosensibilidad. En la exploración física, la paciente parece tener buen desarrollo y sin insuficiencia respiratoria. Tiene una temperatura de 37.6 °C, frecuencia cardiaca de 86 lpm, presión arterial de 126/72 y frecuencia respiratoria de 16 respiraciones por minuto (rpm). La exploración bucal revela dos úlceras superficiales con una base amarillenta en la mucosa bucal. El examen oftalmológico es consistente con uveítis anterior. El examen cardiopulmonar es normal. No tiene artritis, pero en dirección medial en el muslo derecho se palpa un cordón en el trayecto de la vena safena. Los estudios de laboratorio revelan una tasa de eritrosedimentación de 68 s. El recuento de leucocitos es de 10 230/μL con un recuento diferencial de 68% de células polimorfonucleares, 28% de linfocitos y 4% de monocitos. Los anticuerpos antinucleares y los anticuerpos contra dsDNA son negativos y el C3 es de 89 mg/100 mL y el C4 de 24 mg/100 mL. ¿Cuál es el diagnóstico más probable?","o":["Síndrome de Behçet","Penfigoide ampolloso","Lupus eritematoso discoide","Síndrome de Sjögren","Lupus eritematoso sistémico"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 364) El síndrome de Behçet es un trastorno multisistémico de causa incierta que se caracteriza por ulceraciones orales y genitales y afectación ocular. Este trastorno afecta por igual a varones y mujeres y es más común en personas de ascendencia mediterránea, de Oriente Medio y del Lejano Oriente. Casi 50% de estas personas tiene autoanticuerpos circulantes contra la mucosa bucal humana. Las manifestaciones clínicas son muy variadas. La presencia de aftas recurrentes es esencial para el diagnóstico. La mayor parte de estos pacientes presentan principalmente ulceraciones bucales, aunque las ulceraciones genitales son más específicas para el diagnóstico. Por lo general, las úlceras son dolorosas, pueden ser superficiales o profundas y durar una o dos semanas. Se pueden presentar afección cutánea, como foliculitis, eritema nudoso y vasculitis. La afectación ocular es la complicación más temida porque puede progresar rápidamente hacia la ceguera. A menudo se presenta como panuveítis, iritis, oclusión de vasos retinianos o neuritis óptica. Este paciente también presenta trombosis venosa profunda, que está presente en 25% a 33% de estos pacientes. La afectación neurológica se produce hasta en 10% de los casos. Los datos de laboratorio son inespecíficos, con incremento de la tasa de eritrosedimentación y del recuento de leucocitos. El penfigoide ampolloso es una enfermedad ampollosa polimorfa autoinmunitaria subepidérmica que suele observarse en los adultos mayores. Las lesiones iniciales pueden consistir en placas urticariformes; la mayor parte de los pacientes presentan ampollas tensas en la piel de aspecto normal o eritematoso. Las lesiones suelen estar distribuidas por la parte inferior del abdomen, la ingle y la superficie flexora de las extremidades; en algunos pacientes se encuentran lesiones de la mucosa bucal. El lupus eritematoso discoide es la forma cutánea del lupus eritematoso sistémico y se caracteriza por placas atróficas y despigmentadas rodeadas de hiperpigmentación y eritema en asociación con cicatrices y alopecia.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 27 años ingresó a la ICU después de tres días de un parto de un producto a término. Se encontró que la paciente tenía hemiparesia derecha y la mano izquierda tenía un color violáceo. En la exploración física también se encontró livedo reticular. En los resultados de laboratorio se informó recuento leucocítico de 10.2/μL, hematocrito de 35% y recuento de plaquetas de 13 000/μL. Su nitrógeno ureico en sangre es de 36 mg/100 mL y su creatinina es de 2.3 mg/100 mL. Aunque el embarazo evolucionó sin incidentes, los tres embarazos anteriores terminaron en aborto. Un frotis de sangre periférica no muestra evidencia de esquistocitos. ¿Cuál de los siguientes estudios de laboratorio confirmará mejor la causa de sus manifestaciones clínicas?","o":["Panel de anticuerpos anticardiolipina","Anticuerpos antinucleares","Examen Doppler de las arterias del brazo izquierdo","Ecocardiografía","Resonancia magnética cerebral"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 357) La paciente presenta múltiples manifestaciones clínicas de trombosis arterial en la mano y el cerebro y probablemente tuvo insuficiencia placentaria en los tres embarazos anteriores, lo que hace probable el diagnóstico de síndrome de anticuerpos antifosfolípidos. Además, tiene evidencia de lesión renal aguda, lo que sugiere una enfermedad multisistémica. La trombocitopenia puede deberse a anemia hemolítica, pero la ausencia de esquistocitos hace que sea menos probable que tenga púrpura trombocitopénica trombótica. Aunque la resonancia magnética y la ecografía dúplex cerebral y de las extremidades puede confirmar la presencia de trombosis, estos estudios buscarán anticuerpos dirigidos contra cardiolipina y β-2 glucoproteína I. También pueden ser útiles pruebas adicionales para el anticoagulante lúpico determinado mediante análisis de coagulación como la prueba de veneno de víbora de Russel diluido, los resultados positivos falsos en la reagina plasmática rápida y el tiempo de tromboplastina parcial activada. Es probable que la prueba de anticuerpos antinucleares sea positiva dada la superposición que ocurre con frecuencia en el lupus eritematoso sistémico, pero es inespecífica.","letters":["A","B","C","D","E"]}]},"41":{"title":"Esclerodermia. Síndrome de Sjögren. Polimiositis/dermatomiositis. Enfermedad mixta del tejido conectivo y síndromes de solapamiento.","questions":[{"q":"¿Cuál de las siguientes afecciones es casi el doble de frecuente en pacientes con esclerosis sistémica cutánea difusa que en la esclerosis sistémica cutánea limitada?","o":["Afección esofágica","Hipertensión arterial pulmonar","Fibrosis pulmonar","Fenómeno de Raynaud","Afección cutánea"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 360) Prácticamente todos los órganos pueden verse afectados clínicamente por la esclerosis sistémica cutánea (SSc). La mayor parte de los pacientes con esclerosis sistémica se pueden clasificar con enfermedad cutánea limitada (lcSSc, limited cutaneous SSc) o enfermedad cutánea difusa (dcSSc, diffuse cutaneous SSc). Aunque es útil la estratificación de los pacientes con esclerosis sistémica en subgrupos de enfermedad cutánea difusa y limitada, la expresión de la enfermedad es mucho más compleja y existen varios endofenotipos distintos dentro de cada subconjunto. En general, la afectación del parénquima pulmonar es más frecuente en pacientes con dcSSc que en lcSSc.","letters":["A","B","C","D","E"]},{"q":"Todas las arterias siguientes se ven afectadas a menudo en la arteritis de Takayasu EXCEPTO:","o":["Aorta abdominal","Arterias cerebrales","Arteria carótida común","Arterias renales","Arteria subclavia"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 363) La arteritis de Takayasu es una enfermedad inflamatoria y estenótica de las arterias de mediano y gran calibre. Es una enfermedad poco frecuente con una tasa de incidencia anual estimada de 1.2 a 2.6 casos por millón. Es más frecuente en niñas adolescentes y mujeres jóvenes. La arteritis de Takayasu afecta a arterias de mediano y gran calibre, con una fuerte predilección por el arco aórtico y sus ramas; la arteria pulmonar también puede estar afectada (cuadro VIII--50). La afectación de las ramas principales de la aorta es mucho más marcada en su origen que en sentido distal. La enfermedad es una panarteritis con infiltrados inflamatorios de células mononucleares y ocasionalmente células gigantes. Hay una marcada proliferación y fibrosis de la íntima, cicatrización y vascularización de la media y rotura y degeneración de la lámina elástica. El estrechamiento de la luz se produce con o sin trombosis. Con frecuencia se afecta la vasa vasorum. Los cambios patológicos en varios órganos reflejan el compromiso del flujo sanguíneo a través de los vasos afectados. Las arterias cerebrales no se ven afectadas con frecuencia en la arteritis de Takayasu. CUADRO VIII--50Frecuencia de anomalías arteriográficas y posibles manifestaciones clínicas de afectación arterial en la arteritis de Takayasu ----------------------------------------------------------------------- **Arteria** **Porcentaje de **Manifestaciones anomalías clínicas potenciales** arteriográficas** ----------------------- ----------------------- ----------------------- Subclavia 93 Claudicación de brazos, fenómeno de Raynaud Carótida común 58 Cambios visuales, síncope, isquemia cerebral transitoria, accidente cerebrovascular Aorta abdominala 47 Dolor abdominal, náuseas, vómitos Renal 38 Hipertensión, insuficiencia renal Arco o raíz aórtica 35 Insuficiencia aórtica, insuficiencia cardiaca congestiva Vertebral 35 Cambios visuales, mareos Eje celiacoa 18 Dolor abdominal, náuseas, vómitos Mesentérica superiora 18 Dolor abdominal, náuseas, vómitos Iliaca 17 Claudicación de las extremidades inferiores Pulmonar 10--40 Dolor torácico atípico, disnea Coronarias \\< 10 Dolor torácico, infarto del miocardio ----------------------------------------------------------------------- aLas lesiones arteriográficas en estos lugares por lo general son asintomáticas, pero pueden causar estos síntomas. Datos de Kerr GS et al: Takayasu arteritis. Ann Intern Med 120:919, 1994.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 63 años fue valorada por lesiones cutáneas en los ojos y fatiga de un mes de evolución. La paciente informó disminución de la fuerza de brazos y piernas y fatiga constante, pero sin fiebre ni diaforesis. También se encontró coloración rojiza alrededor de los ojos. Tiene antecedente de hipotiroidismo sin otros antecedentes de importancia. En la exploración física, tiene erupción en heliotropo y debilidad muscular proximal. El diagnóstico de dermatomiositis se realiza tras la demostración de elevación de la creatina cinasa sérica y electromiogramas confirmatorios. ¿Cuál de los siguientes estudios debería realizarse en busca de enfermedades asociadas?","o":["Mamografía","Medición de anticuerpos antinucleares séricos","Examen de heces para detectar huevecillos y parásitos","Inmunoglobulinas estimulantes de tiroides","Títulos de anticuerpos contra varicela-zoster"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 365) La dermatomiositis se asocia con neoplasias malignas hasta en 15% de los casos; por lo tanto, está indicada la detección apropiada del cáncer para la edad cuando se realiza este diagnóstico. Sin embargo, no se recomiendan búsquedas exhaustivas de cáncer. La dermatomiositis puede asociarse ocasionalmente con esclerodermia y colagenopatías mixtas, pero con menor frecuencia con lupus eritematoso sistémico, artritis reumatoide o síndrome de Sjögren, que se asocian más estrechamente con la polimiositis o la miositis por cuerpos de inclusión (IBM, inclusion body myositis). Los virus pueden estar asociados con IBM y polimiositis, pero no se ha demostrado que estén relacionados con dermatomiositis. Los parásitos y bacterias como los cestodos y los nematodos se asocian con la polimiositis, pero no con otras formas de miopatía inflamatoria. Por último, no se sabe que las inmunoglobulinas estimulantes de la tiroides estén asociadas con dermatomiositis.","letters":["A","B","C","D","E"]},{"q":"Un médico se encuentra en consulta con una paciente a la que atiende desde hace mucho tiempo. Tiene antecedentes de arteriopatía coronaria, con un infarto de miocardio en la cara lateral hace un año. Desde entonces recibe simvastatina, ácido acetilsalicílico, metoprolol y lisinopril. Hace dos meses, empezó a notar dolor en el muslo y en el hombro. Un mes después de su aparición, aumentó el dolor muscular y notó debilidad. Su creatina cinasa (CK) se elevó a ocho veces el límite superior normal. Suspendió la simvastatina hace tres semanas. El día de la valoración informó que su dolor ha continuado y es peor que hace un mes. Su creatina cinasa es 12 veces el límite superior normal. ¿Cuál es la mejor prueba para establecer el diagnóstico?","o":["Anticuerpos contra la reductasa de 3-hidroxi-3-metilglutaril-coenzima A","Anticuerpos antinucleares","Anticuerpo Anti-Jo-1","Anticuerpos contra partículas de reconocimiento de señales","Concentraciones de aldolasa"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 365) La miopatía leve inducida por estatinas no es inflamatoria y, por lo general, se resuelve con la interrupción del tratamiento. Sin embargo, en casos poco comunes la debilidad muscular continúa progresando incluso después de retirar la estatina; en estos casos, se indica una biopsia muscular diagnóstica y se sugiere la búsqueda de anticuerpos contra la 3-hidroxi-3-metilglutaril coenzima A reductasa (HMGCR); si hay evidencia histológica de polimiositis o si hay miositis necrosante, se debe iniciar inmunoterapia. Los anticuerpos antinucleares pueden estar presentes, pero no son específicos en estos casos. Los anticuerpos anti-Jo-1 se asocian con los síndromes antisintetasa donde la miositis por lo general está acompañada de neumopatía intersticial y alteraciones cutáneas estereotipadas. Los anticuerpos contra las partículas de reconocimiento de señales no se asocian con miopatía inducida por estatinas.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 60 años con esclerodermia de larga evolución (fenómeno de Raynaud, enfermedad difusa de la piel y fibrosis pulmonar) acudió a la clínica con pérdida de peso de aparición reciente. También ha notado dolor hipogástrico creciente, distensión abdominal y diarrea. La paciente niega pirosis o disfagia. No ha tenido melena ni hematoquecia. ¿Cuál de los siguientes mecanismos relacionados con la esclerodermia podría estar contribuyendo a sus síntomas?","o":["Ectasia vascular del antro gástrico","Enfermedad por reflujo gastroesofágico","Alteraciones de la motilidad intestinal","Proliferación bacteriana excesiva en el intestino delgado","C y D"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 360) La afectación del tubo digestivo, que puede ocurrir a cualquier nivel, se produce en hasta 90% de los pacientes con esclerodermia, tanto limitada como difusa enfermedad cutánea (cuadro VIII--32). Todas las enfermedades gastrointestinales antes mencionadas pueden ocurrir en asociación con la esclerodermia, pero la alteración de la motilidad intestinal y la proliferación bacteriana en el intestino delgado son las afecciones que por lo general provocan diarrea, distensión abdominal y pérdida de peso. Los pacientes con enfermedad por reflujo gastroesofágico suelen presentar síntomas como pirosis, regurgitación y disfagia. También puede producirse ectasia vascular del antro gástrico (GAVE, gastric antral vascular ectasia). Estas lesiones subepiteliales, que reflejan la vasculopatía difusa de vasos de pequeño calibre de la esclerosis sistémica, se describen como \"estómago en sandía\" por su aspecto endoscópico. Los pacientes con GAVE presentan episodios recurrentes de hemorragia de tubo digestivo que dan lugar a anemia crónica inexplicable. CUADRO VIII--32Manifestaciones gastrointestinales prominentes de la esclerosis sistémica y su tratamiento ------------------------------------------------------------------------ **Sitio** **Manifestación **Tratamiento** principal** ----------------------- ----------------------- ------------------------ Orofaringe Disminución de la Cuidado periodontal abertura bucal Sequedad Saliva artificial de boca Periodontitis, Terapia de deglución gingivitis Terapia de deglución Esófago Reflujo Disfagia Modificaciones del Estenosis Metaplasia de estilo de vida Fármacos Barret procinéticos inhibidores de la bomba de protones Procedimientos endoscópicos Estómago Gastroparesia Ectasia Fármacos procinéticos vascular del antro Crioterapia láser gástrico (estómago en endoscópica sandía) Intestino delgado y Proliferación Laxantes procinéticos colon bacteriana Antibióticos Octreótido Diarrea/estreñimiento Apoyo nutricional Seudoobstrucción parenteral Neumatosis intestinal Malabsorción Seudodivertículos colónicos Anorrecto Insuficiencia del Biorretroalimentación, esfínter estimulación del nervio sacro, cirugía ------------------------------------------------------------------------","letters":["A","B","C","D","E"]},{"q":"Un paciente con síndrome de Sjögren primario diagnosticado hace seis años y tratado con reemplazo de lágrimas para el alivio sintomático reportó inflamación de la parótida durante los últimos tres meses. También ha notado agrandamiento de los ganglios linfáticos cervicales posteriores. El estudio muestra leucopenia y niveles bajos del complemento C4. ¿Cuál es el diagnóstico más probable?","o":["Amiloidosis","Pancreatitis crónica","Infección por VIH","Linfoma","Síndrome de Sjögren secundario"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 361) Es bien sabido que el linfoma se desarrolla específicamente en etapas avanzadas del síndrome de Sjögren. Las manifestaciones comunes de esta enfermedad maligna incluyen aumento de tamaño persistente de la glándula parótida, púrpura, leucopenia, crioglobulinemia y bajas concentraciones de complemento C4. La mayor parte los linfomas son extraganglionares, de linfocitos B marginales y de baja malignidad. Los linfomas de baja malignidad pueden detectarse incidentalmente durante una biopsia labial. La mortalidad es más elevada en los pacientes con síntomas B concurrentes (fiebre, diaforesis nocturna y pérdida de peso), ganglios linfáticos \\> 7 cm y grado histológico alto o intermedio.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes es la manifestación extraglandular más frecuente del síndrome de Sjögren primario?","o":["Artralgias/artritis","Linfoma","Neuropatía periférica","Fenómeno de Raynaud","Vasculitis"],"c":"A","e":"La respuesta es A. (Parte 12 Endocrinología y metabolismo, Sección 2 Medicina sexual y de género, cap. 390) Aunque el síndrome de Sjögren afecta con mayor frecuencia a los ojos y la boca, hay afectación de varios sitios extraglandulares comunes. La más frecuente es la artritis o artralgias que complican hasta 60% de los casos. El fenómeno de Raynaud es el segundo sitio extraglandular más frecuente. La afectación pulmonar y la vasculitis se encuentran en menos de 20% de los pacientes. El linfoma, aunque es una complicación preocupante y con alta morbilidad, es relativamente poco frecuente y afecta solo a 6% de los pacientes con síndrome de Sjögren.","letters":["A","B","C","D","E"]},{"q":"Todos los siguientes fármacos terapéuticos se utilizan en el tratamiento de la polimiositis EXCEPTO:","o":["Azatioprina","Micofenolato mofetilo","Prednisona","Rituximab","Secukinumab"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 365) La dermatomiositis, la polimiositis, el síndrome antisintetasa y la miopatía necrosante mediada por mecanismos inmunitarios (IMNM, immune-mediated necrotizing myopathy) suelen responder a la inmunoterapia (cuadro VIII--61). Las dosis altas de glucocorticoides (dosis inicial de prednisona 0.75 a 1 mg/kg/día) se consideran el tratamiento de primera línea. Existe incertidumbre con respecto a cuándo empezar a tomar los fármacos de segunda línea (p. ej., metotrexato, azatioprina, micofenolato, inmunoglobulinas o rituximab). El médico debe sopesar con el paciente el aumento del riesgo de inmunodepresión en comparación con los posibles beneficios (p. ej., mejora más rápida, efecto ahorrador de esteroides, evitar las enfermedades asociadas con el uso prolongado de glucocorticoides). Muchos comienzan un fármaco de segunda línea (por lo general, metotrexato) con glucocorticoides en pacientes con debilidad grave u otro compromiso de órganos (p. ej., miocarditis, neumopatía intersticial), aquellos con mayor riesgo de complicaciones de esteroides (p. ej., diabéticos, osteoporosis o mujeres posmenopáusicas) y pacientes con IMNM de quienes se sabe que tienen miositis de difícil tratamiento. En los pacientes tratados inicialmente con prednisona sola, se añade un fármaco de segunda línea a los pacientes que no mejoran significativamente después de dos a cuatro meses o a los que no se puede reducir a una dosis baja de prednisona. La mayoría de los pacientes con IMNM no responden a la prednisona sola
