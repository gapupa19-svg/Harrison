 esta misma población no diabética, por lo que extender esa afirmación a ambos fármacos es incorrecto."},{"q":"Una de las siguientes apolipoproteínas se sintetiza en el intestino y no en el hígado:","o":["ApoA-II.","ApoC-I.","ApoA-IV.","ApoA-V."],"c":"C","e":"La apolipoproteína A-IV se sintetiza principalmente en el intestino delgado (asociada a los quilomicrones tras la absorción de grasas), a diferencia de la mayoría de las apolipoproteínas, que se sintetizan predominantemente en el hígado."},{"q":"Varón de 32 años sano, sin factores de riesgo coronario clásicos, con antecedentes familiares (madre y abuelos maternos) de hipercolesterolemia. Exploración: xantomas tendinosos. LDL en ayuno de 387 mg/dl. ¿Cuál de las siguientes enfermedades genéticas tiene mayor probabilidad de afectar a este individuo?","o":["Deficiencia de apolipoproteína A-V.","Insuficiencia familiar de ApoB-100.","Deficiencia familiar de lipasa hepática.","Hipercolesterolemia familiar."],"c":"D","e":"La combinación de LDL muy elevado (\\>300 mg/dl) desde edades tempranas, xantomas tendinosos y una clara agregación familiar de hipercolesterolemia es el cuadro clásico de la hipercolesterolemia familiar (habitualmente por mutaciones del receptor de LDL), la dislipemia genética monogénica más frecuente y de mayor riesgo cardiovascular precoz."},{"q":"La OMS definió inicialmente el síndrome metabólico como una entidad caracterizada por obesidad central, hipertrigliceridemia, HDL bajo, hiperglucemia e hipertensión. ¿Cuál de las siguientes afirmaciones sobre su epidemiología es verdadera?","o":["Después de los 60 años, los varones tienen más probabilidad de desarrollar síndrome metabólico que las mujeres.","Entre los pacientes con diabetes mellitus, la presencia de síndrome metabólico confiere un mayor riesgo de desarrollar enfermedades cardiovasculares.","El IMC es el mejor factor pronóstico de resistencia a la insulina y diabetes en el síndrome metabólico.","La prevalencia de síndrome metabólico es independiente de la edad."],"c":"B","e":"En pacientes diabéticos, la coexistencia de síndrome metabólico (con sus componentes adicionales de dislipemia aterogénica, HTA y obesidad central) confiere un riesgo cardiovascular adicional al ya elevado de la diabetes por sí sola, siendo este exceso de riesgo un hallazgo consistente en los estudios epidemiológicos."},{"q":"Marque la causa más frecuente de dislipemia secundaria:","o":["Diabetes mellitus no controlada.","Consumo excesivo de alcohol.","Hipotiroidismo.","Síndrome nefrótico."],"c":"A","e":"La diabetes mellitus mal controlada, por la resistencia a la insulina y sus efectos sobre el metabolismo lipídico (aumento de VLDL, triglicéridos, y HDL bajo), es la causa más frecuente de dislipemia secundaria en la práctica clínica, por delante del hipotiroidismo, el síndrome nefrótico o el consumo excesivo de alcohol."},{"q":"Varón de 55 años sometido a bypass gastroyeyunal por obesidad mórbida hace año y medio, con episodios recurrentes de dolor en hipocondrio derecho en los últimos 6 meses, diagnosticado de colelitiasis. ¿Cuál es el mecanismo principal en el desarrollo de colelitiasis tras la cirugía bariátrica?","o":["Incremento en la secreción de ácido gástrico.","Aumento en la concentración de colesterol biliar asociado a la pérdida rápida de peso.","Alteraciones en la motilidad biliar como único mecanismo relevante.","Disminución en el tamaño de la vesícula biliar."],"c":"B","e":"La pérdida rápida y sustancial de peso tras la cirugía bariátrica moviliza grandes cantidades de colesterol desde los depósitos grasos hacia la bilis, aumentando su saturación y favoreciendo la formación de cálculos de colesterol, siendo este el mecanismo principal reconocido de la colelitiasis post-bariátrica, muy frecuente en el primer año-año y medio tras la cirugía."},{"q":"Mujer de 67 años con antecedentes de dislipemia, que acude por disuria y polaquiuria seguidas de fiebre, escalofríos y deterioro del estado general. Impresiona de gravedad: taquicárdica, taquipneica, TA 60/40 mmHg, Tª 39ºC. ¿Qué medida NO estaría incluida en el manejo INICIAL?","o":["Perfusión intravenosa de dobutamina.","Medición de lactato sérico.","Extracción de hemocultivos.","Administración de fluidos intravenosos."],"c":"A","e":"En el manejo inicial del shock séptico, el vasopresor de primera elección es la NOREPINEFRINA, reservándose la dobutamina para casos de disfunción miocárdica asociada tras haber optimizado la precarga con fluidoterapia; la dobutamina no forma parte de las medidas iniciales estándar (que sí incluyen lactato, hemocultivos y fluidoterapia precoz)."}]},"50":{"title":"Aproximación al paciente con síndrome convulsivo. Epilepsias.","questions":[{"q":"Señale la FALSA en relación con las meningitis víricas:","o":["Producen síndrome meníngeo sin signos de disfunción neurológica, con pleocitosis linfocitaria en LCR.","El agente etiológico más frecuente de la meningitis vírica es el virus varicela-zóster.","La meningitis de Mollaret es una forma benigna de meningitis linfocitaria recurrente cuyo agente más frecuente es el VHS-2.","Un deterioro progresivo del nivel de consciencia o crisis epiléptica indicarían meningoencefalitis."],"c":"B","e":"Los ENTEROVIRUS son, con diferencia, la causa más frecuente de meningitis vírica, no el virus varicela-zóster; el resto de afirmaciones sobre la clínica, la meningitis de Mollaret y los signos de alarma que sugieren afectación encefálica son correctas."},{"q":"Mujer de 50 años diagnosticada de un tumor cerebral que presenta una primera convulsión tónico-clónica generalizada de unos 30 segundos, autolimitada. ¿Cuál de las siguientes medidas le parece más indicada?","o":["Observación hospitalaria 24 horas y, si no recidiva, remitir a consultas de Neurología sin tratamiento antiepiléptico.","Iniciar tratamiento con antiepiléptico.","Solicitar un TAC urgente y tratar con antiepiléptico solo si presenta cambios respecto al previo.","Realizar EEG urgente y tratar solo si es anormal."],"c":"B","e":"Según la definición actual de epilepsia de la ILAE, una lesión estructural epileptógena ya conocida (como este tumor cerebral) que produce una primera crisis conlleva un riesgo de recurrencia muy elevado (\\>60% a 10 años), equivalente al de haber tenido dos crisis no provocadas, por lo que se recomienda iniciar tratamiento antiepiléptico tras esta primera crisis, sin necesidad de esperar a una recidiva."},{"q":"Señale la respuesta FALSA en relación con la actual clasificación de los tipos de crisis y epilepsia de la ILAE (2017):","o":["El tipo de crisis se clasifica según su manifestación inicial en focales, generalizadas y de inicio desconocido.","La clasificación ILAE 2017 reconoce seis categorías etiológicas de la epilepsia: genética, estructural, metabólica, inmune, infecciosa y desconocida.","Las crisis generalizadas pueden ser motoras y no motoras.","Las crisis focales solo son motoras."],"c":"D","e":"Las crisis focales pueden ser tanto motoras como NO motoras (sensitivas, autonómicas, cognitivas, emocionales), al igual que las generalizadas; afirmar que las focales «solo son motoras» es incorrecto."},{"q":"Señale la respuesta CORRECTA:","o":["Después de una primera crisis convulsiva siempre hay que iniciar tratamiento anticonvulsivo.","La actividad epileptiforme en el EEG no se considera factor de riesgo predictivo de recurrencia ante una primera crisis.","La evidencia de alteración estructural cerebral por neuroimagen se considera factor de riesgo predictivo de recurrencia ante una primera crisis.","La sintomatología neurológica focal previa o postcrítica no se considera factor de riesgo predictivo de recurrencia."],"c":"C","e":"La presencia de una lesión estructural cerebral demostrada por neuroimagen es uno de los principales factores de riesgo predictivo de recurrencia tras una primera crisis (junto con la actividad epileptiforme en el EEG y la focalidad neurológica pre o postcrítica), lo que justifica considerar tratamiento antiepiléptico precoz en estos casos, a diferencia de una primera crisis sin factores de riesgo, donde no siempre está indicado tratar de entrada."},{"q":"Se considera que la epilepsia está resuelta en las personas que (señale la VERDADERA):","o":["Permanecen libres de crisis en los últimos 10 años, sin tomar medicamentos anticonvulsivos en los últimos 5, o que, teniendo un síndrome epiléptico dependiente de la edad, ya superaron esa edad.","Sin tener ningún síndrome epiléptico y tomando anticonvulsivos, permanecen libres de crisis 3 años.","Sin tener ningún síndrome epiléptico y tomando anticonvulsivos, permanecen libres de crisis 2 años.","Sin tener ningún síndrome epiléptico y tomando anticonvulsivos, permanecen libres de crisis 1 año."],"c":"A","e":"La ILAE define la epilepsia como «resuelta» cuando el paciente lleva 10 años libre de crisis, de los cuales al menos los últimos 5 sin tomar medicación antiepiléptica, o bien cuando ha superado la edad característica de un síndrome epiléptico dependiente de la edad; el resto de opciones (permanecer libre de crisis TOMANDO medicación) no cumple esta definición, ya que implica que la epilepsia sigue activa bajo control farmacológico, no resuelta."},{"q":"Paciente procedente de Bolivia con cuadro de convulsiones generalizadas; TAC craneal con gran número de calcificaciones nodulares. ¿Cuál es el diagnóstico más probable?","o":["Toxoplasmosis cerebral.","Tuberculosis.","Neurocisticercosis.","Amebiasis diseminada."],"c":"C","e":"Las calcificaciones nodulares múltiples cerebrales en un paciente procedente de un área endémica de Latinoamérica, con crisis convulsivas, son muy características de la neurocisticercosis por Taenia solium, causa infecciosa más frecuente de epilepsia adquirida en zonas endémicas."},{"q":"En relación a los fármacos antiepilépticos, señale la INCORRECTA:","o":["Carbamazepina, gabapentina, fenitoína y primidona pueden producir descenso de los niveles de ácido fólico.","Fenobarbital, pregabalina, primidona y topiramato pueden producir descenso de los niveles de vitamina B12.","Fenitoína, carbamazepina y fenobarbital se asocian a mayor prevalencia de hiperlipidemia.","En caso de síndrome de DRESS por fenitoína, se recomienda cambiar a carbamazepina."],"c":"D","e":"Ante un síndrome de DRESS por fenitoína NO se recomienda cambiar a carbamazepina, ya que existe reactividad cruzada entre los antiepilépticos aromáticos (fenitoína, carbamazepina, fenobarbital, oxcarbazepina), debiendo evitarse todos ellos y optar por un fármaco de estructura no aromática (como levetiracetam o ácido valproico)."},{"q":"Mujer de 30 años traída a Urgencias inconsciente tras crisis convulsiva. Presenta taquicardia, hipotensión, midriasis y sequedad de mucosas. ECG con ensanchamiento del QRS y alteraciones del ST. Había iniciado amitriptilina 3 semanas antes por ánimo deprimido. ¿Cuál es el tratamiento inicial más adecuado?","o":["Control de vía aérea y ventilación, vía venosa y naloxona intravenosa.","Control de vía aérea y ventilación, vía venosa y bicarbonato sódico intravenoso.","Control de vía aérea y ventilación, vía venosa y flumazenilo intravenoso.","Control de vía aérea y ventilación, vía venosa y N-acetilcisteína intravenosa."],"c":"B","e":"El cuadro (síndrome anticolinérgico con QRS ensanchado y alteraciones del ST) es característico de intoxicación por antidepresivos tricíclicos (amitriptilina), cuya cardiotoxicidad se debe al bloqueo de canales de sodio cardíacos; el bicarbonato sódico intravenoso es el tratamiento específico de elección para contrarrestar este efecto, alcalinizando el pH y aumentando la fracción unida a proteínas del fármaco."},{"q":"Todo lo siguiente suele relacionarse con convulsiones de ausencia, EXCEPTO:","o":["Chupeteo de labios.","Confusión posictal.","Provocación con la hiperventilación.","Parpadeo rápido."],"c":"B","e":"Las ausencias típicas se caracterizan por una recuperación INMEDIATA y completa de la consciencia al finalizar la crisis, sin periodo confusional postcrítico, a diferencia de las crisis tónico-clónicas generalizadas; automatismos orales sutiles (chupeteo), parpadeo rápido y la provocación característica con la hiperventilación sí son rasgos típicos de las ausencias."},{"q":"En relación a la tetania, es cierto que:","o":["Clínicamente suele iniciarse como sensación de cefalea.","Cursa con alcalosis metabólica de forma característica.","La hiperventilación agrava la tetania.","Siempre acaba provocando convulsiones."],"c":"C","e":"La hiperventilación produce alcalosis respiratoria, que reduce la fracción de calcio iónico circulante y agrava la tetania (fenómeno que se aprovecha clínicamente en la maniobra de hiperventilación para desenmascarar una tetania latente); la tetania no siempre progresa a convulsiones ni cursa característicamente con alcalosis metabólica."},{"q":"Entre los fármacos opiáceos, ¿cuál evitaría en un paciente con historia de predisposición a presentar convulsiones?","o":["Tramadol.","Hidrocodona.","Fentanilo.","Morfina."],"c":"A","e":"El tramadol reduce el umbral convulsivo (por su acción sobre la recaptación de serotonina y noradrenalina, además de su efecto opioide), por lo que debe evitarse o usarse con precaución en pacientes con antecedentes de crisis comiciales, a diferencia de otros opioides puros como morfina, fentanilo o hidrocodona."},{"q":"Mujer de 45 años con episodio de convulsión tónico-clónica generalizada, presenciada, que cede tras 2 mg de lorazepam. Todas las siguientes son posibles causas de su convulsión, EXCEPTO:","o":["Abstinencia de alcohol.","Autoanticuerpos (encefalitis autoinmune).","Tumor cerebral.","Trastorno genético."],"c":"D","e":"Ante una primera crisis convulsiva en un adulto sin antecedentes conocidos, las causas agudas/subagudas a descartar de forma prioritaria son la abstinencia alcohólica, procesos estructurales (tumor cerebral) y causas autoinmunes (encefalitis por autoanticuerpos); un trastorno genético de base, aunque posible, es una causa mucho menos probable de debut convulsivo agudo en la edad adulta sin antecedentes previos."},{"q":"¿Cuál de los siguientes antiepilépticos se espera que produzca un menor número de interacciones farmacológicas?","o":["Fenitoína.","Ácido valproico.","Levetiracetam.","Carbamazepina."],"c":"C","e":"El levetiracetam se elimina en gran parte inalterado por vía renal, sin metabolismo hepático relevante a través del citocromo P450, lo que le confiere un perfil de interacciones farmacológicas muy bajo, a diferencia de fenitoína, ácido valproico y carbamazepina, con importantes interacciones enzimáticas hepáticas."},{"q":"¿Cuál de los siguientes síntomas NO es típico de la enfermedad de Huntington?","o":["Hipercinesias coreicas.","Disartria.","Trastornos neuropsicológicos.","Crisis epilépticas."],"c":"D","e":"Las crisis epilépticas no son una manifestación característica de la corea de Huntington del adulto (aunque pueden verse en la variante juvenil), a diferencia de la corea, la disartria y los trastornos neuropsicológicos/psiquiátricos, que constituyen el núcleo clínico clásico de la enfermedad."},{"q":"Varón de 56 años con glioblastoma multiforme en el lóbulo parietal derecho que presenta su primera convulsión tónico-clónica generalizada. ¿Cuáles son las medidas más indicadas?","o":["Iniciar tratamiento con etosuximida.","Iniciar tratamiento con lamotrigina (u otro antiepiléptico adecuado).","Observar en busca de convulsiones adicionales y tratar solo si surgen.","Realizar EEG y tratar solo si se identifica un foco epileptógeno."],"c":"B","e":"Al igual que en el caso de la lesión tumoral conocida, tras una primera crisis en un paciente con una lesión estructural epileptógena demostrada (glioblastoma), el riesgo de recurrencia es muy alto, por lo que está indicado iniciar tratamiento antiepiléptico de entrada; la etosuximida no es adecuada en crisis focales/tumorales (se reserva para ausencias generalizadas)."},{"q":"De los siguientes planteamientos en cuanto al cuadro inicial de sospecha de cáncer encefálico, ¿cuál es verdadero?","o":["Hay mayor probabilidad de que el glioma de baja malignidad se manifieste inicialmente por una convulsión reciente, que el glioma de alta malignidad.","Aproximadamente la mitad de todas las lesiones malignas encefálicas son metástasis y la otra mitad tumores primarios.","El estudio radiológico preferido ante sospecha de tumor intracraneal es la TC con contraste intravenoso.","La cefalea aparece en el cuadro inicial en más del 75% de los pacientes con tumores cerebrales."],"c":"A","e":"Los gliomas de bajo grado, de crecimiento lento, se manifiestan con mayor frecuencia como primera manifestación con una convulsión (por su localización cortical y su lenta irritabilidad neuronal), mientras que los de alto grado tienden a debutar más a menudo con déficits focales o síntomas de hipertensión intracraneal por su rápido crecimiento; además, las metástasis son considerablemente MÁS frecuentes que los tumores primarios como causa de lesión maligna encefálica, la RM (no la TC) es la prueba de imagen preferida, y la cefalea es el síntoma inicial en una minoría (no más del 75%) de los casos."},{"q":"Señale la afirmación INCORRECTA en relación al consumo de cocaína:","o":["En varones adictos a cocaína se ha observado ginecomastia e impotencia.","El uso de cocaína puede asociarse a convulsiones generalizadas y arritmias cardiacas.","Dentro de las complicaciones neurológicas del uso de cocaína se encuentra el ictus isquémico.","La hemorragia subaracnoidea o la hemorragia cerebral no constituyen una complicación del uso de cocaína."],"c":"D","e":"La cocaína, por su intenso efecto vasoconstrictor e hipertensivo agudo, es una causa reconocida tanto de ictus isquémico como de hemorragia subaracnoidea y hemorragia intracerebral, por lo que afirmar que estas últimas «no constituyen una complicación» es incorrecto."},{"q":"Respecto al lupus eritematoso sistémico, señale la respuesta FALSA:","o":["Los anticuerpos antinucleares están presentes en \\>98% de los casos durante el curso de la enfermedad.","La manifestación más frecuente del lupus difuso del SNC es la alteración cognitiva, principalmente de memoria y razonamiento.","Las convulsiones no se consideran una manifestación de lupus del sistema nervioso central.","La manifestación cardíaca más frecuente es la pericarditis."],"c":"C","e":"Las convulsiones sí se consideran una manifestación reconocida del lupus neuropsiquiátrico, incluida entre los síndromes neuropsiquiátricos clasificados por el ACR asociados al LES, junto con la disfunción cognitiva (la manifestación de SNC más frecuente) y otras manifestaciones neurológicas focales o difusas."}]},"51":{"title":"Enfermedad cerebrovascular.","questions":[{"q":"¿En cuál de los siguientes supuestos está indicado el cierre percutáneo de la orejuela izquierda en pacientes con fibrilación auricular para prevenir el ictus isquémico y la tromboembolia?","o":["Cuando existen contraindicaciones para el tratamiento anticoagulante a largo plazo.","Cuando el paciente se va a someter a un reemplazo valvular aórtico mediante TAVI.","Cuando existen recurrencias de ictus isquémico o embolias a pesar de recibir anticoagulación correcta.","Las respuestas «a» y «c» son correctas."],"c":"D","e":"El cierre percutáneo de la orejuela izquierda está indicado fundamentalmente en pacientes con contraindicación formal para la anticoagulación oral a largo plazo, y también se considera en pacientes que recurren con eventos tromboembólicos pese a una anticoagulación correctamente pautada; el implante de TAVI, por sí solo, no constituye indicación de cierre de orejuela."},{"q":"Con respecto a los accidentes cerebrovasculares arterioescleróticos de pequeño vaso (infarto lacunar), señale la CORRECTA:","o":["Son áreas necróticas que se sitúan en el territorio de arterias perforantes.","La HTA y la diabetes mellitus son las causas más frecuentes.","El síndrome de disartria-mano torpe es un tipo de síndrome lacunar clásico.","Todas son correctas."],"c":"D","e":"Los infartos lacunares son pequeñas áreas de necrosis en el territorio de las arterias perforantes profundas, causados fundamentalmente por lipohialinosis asociada a HTA y diabetes de larga evolución; el síndrome de disartria-mano torpe es, junto con el ictus motor puro, el sensitivo puro y el sensitivo-motor, uno de los síndromes lacunares clásicos descritos."},{"q":"Según el protocolo de Código Ictus, ¿cuáles son criterios para activar un Código Ictus?","o":["Pacientes con ictus agudo de menos de 12 horas de evolución.","Pacientes con déficit neurológico focal agudo, sin límite de edad.","Pacientes con hora de inicio de los síntomas desconocida o al despertar, sin demencia moderada-grave ni enfermedad terminal.","Las respuestas «b» y «c» son correctas."],"c":"D","e":"El Código Ictus se activa ante todo paciente con déficit neurológico focal agudo, sin límite de edad establecido, incluyendo los casos de hora de inicio desconocida o ictus del despertar, siempre que no exista demencia moderada-grave previa ni una enfermedad terminal que contraindique el tratamiento de reperfusión."},{"q":"Señale la respuesta FALSA en relación al tratamiento del ictus isquémico y el AIT:","o":["El beneficio del t-PA depende del tiempo; los pacientes elegibles deben recibirlo sin demora, incluso si se considera trombectomía mecánica.","Si está indicada la trombectomía mecánica, debe iniciarse lo antes posible incluso sin esperar la respuesta al t-PA intravenoso.","Se recomienda doble antiagregación (AAS+clopidogrel) durante 21 días en AIT de alto riesgo o ictus isquémico menor, sin fuente cardioembólica.","La administración de antiagregantes o anticoagulantes no está actualmente contraindicada en las primeras 24 horas tras el t-PA."],"c":"D","e":"Justo lo contrario: la administración de antiagregantes o anticoagulantes SÍ está contraindicada durante las primeras 24 horas tras la administración de t-PA, por el riesgo de transformación hemorrágica, debiendo esperar a repetir una prueba de neuroimagen que descarte hemorragia antes de iniciarlos."},{"q":"Señale la respuesta FALSA en relación con la valoración de riesgo de ictus en pacientes con fibrilación auricular:","o":["La escala CHA2DS2-VASc es la recomendada para evaluar el riesgo de ictus en FA, según las últimas guías europeas.","Se recomienda anticoagulación en varones con ≥2 puntos y en mujeres con ≥3 puntos.","En varones con 1 punto y mujeres con 2, la recomendación es IIa, considerando características y preferencias del paciente.","La edad avanzada no aumenta el riesgo de ictus en pacientes con fibrilación auricular."],"c":"D","e":"La edad avanzada es uno de los componentes principales de la propia escala CHA2DS2-VASc (puntuando de forma creciente a partir de los 65 años) y un factor de riesgo bien establecido de ictus en la FA, por lo que afirmar que «no aumenta el riesgo» es claramente incorrecto."},{"q":"Deberían recibir tratamiento endovascular los pacientes con ictus isquémico por oclusión de gran vaso que cumplan los siguientes criterios, MENOS UNO:","o":["Ictus isquémico que ha recibido t-PA iv dentro de las primeras 4,5 horas sin alcanzarse la recanalización.","Contraindicación al tratamiento fibrinolítico.","Puntuación en la escala NIHSS \\>6.","Enfermedad concomitante grave o con mal pronóstico vital a corto plazo."],"c":"D","e":"La presencia de una enfermedad concomitante grave con mal pronóstico vital a corto plazo es, precisamente, un criterio de EXCLUSIÓN para el tratamiento endovascular (por la escasa expectativa de beneficio neto), no un criterio que deba cumplirse para recibirlo, a diferencia del resto de opciones, que sí son criterios de inclusión habituales."},{"q":"Señale el único que NO es criterio de exclusión para el tratamiento fibrinolítico en el ictus isquémico agudo:","o":["Evidencia de hemorragia intracraneal en la TC o síntomas de hemorragia subaracnoidea, aunque la TC sea normal.","Glucosa sanguínea \\<50 mg/dl o \\>400 mg/dl antes del tratamiento fibrinolítico.","Edad mayor de 18 años.","Plaquetas por debajo de 100.000/mm³."],"c":"C","e":"Tener una edad superior a 18 años es un requisito de inclusión (no una contraindicación), ya que la fibrinolisis está aprobada para adultos; la hemorragia intracraneal, la glucemia extrema y la trombopenia significativa sí son criterios de exclusión reconocidos del tratamiento fibrinolítico."},{"q":"Señale la respuesta CORRECTA en relación con el tratamiento de los pacientes con hipertensión:","o":["Los IECA están recomendados en la hipertensión del embarazo.","En pacientes con un ictus previo se debe priorizar el tratamiento con betabloqueantes, antagonistas del calcio y diuréticos.","Los betabloqueantes se deben evitar en pacientes con HTA de predominio sistólico.","El betabloqueante es más efectivo que la espironolactona en pacientes con HTA resistente."],"c":"B","e":"En la prevención secundaria tras un ictus, se priorizan fármacos con buena evidencia en reducción de eventos cerebrovasculares (betabloqueantes, antagonistas del calcio, diuréticos, junto con IECA/ARA-II); los IECA están formalmente CONTRAINDICADOS en el embarazo por teratogenicidad, y la espironolactona ha demostrado ser MÁS eficaz que los betabloqueantes como cuarto fármaco en la HTA resistente (estudio PATHWAY-2)."},{"q":"Señale la respuesta CORRECTA en relación con la epidemiología y comorbilidades de los pacientes con fibrilación auricular:","o":["Los pacientes con FA tienen mayor riesgo de desarrollar deterioro cognitivo.","Los pacientes con FA tienen una mortalidad similar a la población general.","La causa más frecuente de muerte en pacientes con FA es el ictus.","El tromboembolismo venoso no tiene ninguna asociación con la fibrilación auricular."],"c":"A","e":"La fibrilación auricular se asocia a un mayor riesgo de deterioro cognitivo y demencia, tanto vascular (por microembolismos silentes) como de otros tipos, independientemente de que se produzcan o no ictus clínicamente manifiestos; la mortalidad en FA es superior a la de la población general, y aunque el ictus es una causa importante de muerte, la insuficiencia cardiaca y la muerte súbita cardiaca suelen ser causas más frecuentes en conjunto."},{"q":"Señale la respuesta FALSA en cuanto al tratamiento del ictus:","o":["No se ha demostrado beneficio de los anticoagulantes en el tratamiento primario de la isquemia cerebral aterotrombótica, con incremento del riesgo hemorrágico.","El ácido acetilsalicílico es el único antiagregante con eficacia probada para el tratamiento inmediato de la crisis isquémica en monoterapia clásica.","El estudio NINDS mostró un beneficio claro del rtPA IV en algunos pacientes con ictus agudo.","La combinación de clopidogrel y AAS no es efectiva en la prevención de un segundo ictus aterotrombótico."],"c":"D","e":"La doble antiagregación de corta duración con clopidogrel más AAS (típicamente 21 días) SÍ ha demostrado ser eficaz en la prevención de un segundo ictus en pacientes seleccionados con AIT de alto riesgo o ictus isquémico menor, según ensayos como CHANCE y POINT, por lo que afirmar que «no es efectiva» es incorrecto."},{"q":"No se incluye entre los síntomas lacunares clásicos:","o":["Hemianopsia homónima.","Ataxia-hemiparesia.","Ictus motor puro.","Ictus sensitivo puro."],"c":"A","e":"La hemianopsia homónima refleja afectación de la vía óptica retroquiasmática, propia de infartos corticales/territoriales de mayor tamaño, no de la afectación de pequeño vaso profundo característica de los infartos lacunares; ictus motor puro, sensitivo puro y ataxia-hemiparesia sí son síndromes lacunares clásicos bien descritos."},{"q":"Paciente con trastorno del lenguaje de inicio brusco, caracterizado por lenguaje espontáneo escaso (casi mutismo), dificultad para evocar palabras, muy leve alteración de la comprensión, repitiendo correctamente. ¿Cuál es la primera sospecha diagnóstica?","o":["Cuadro confusional agudo.","Accidente isquémico frontal profundo izquierdo.","Hemorragia subaracnoidea.","Infarto silviano derecho."],"c":"B","e":"Este patrón (lenguaje escaso, anomia, comprensión relativamente preservada, pero con REPETICIÓN conservada) es característico de una afasia transcortical motora, típica de lesiones frontales profundas izquierdas que respetan el área perisilviana clásica del lenguaje (área de Broca y fascículo arcuato), lo que explica la repetición intacta."},{"q":"Mujer de 70 años con TCE grave y hemorragia subaracnoidea secundaria que, el segundo día de ingreso, presenta disnea y dolor torácico; angioTC confirma tromboembolismo pulmonar. ¿Cuál es el tratamiento de elección?","o":["Heparina de bajo peso molecular.","Apixabán.","Acenocumarol.","Filtro de vena cava inferior."],"c":"A","e":"En un paciente con hemorragia intracraneal reciente y TEP concomitante, la anticoagulación con heparina de bajo peso molecular es preferible inicialmente frente a los anticoagulantes orales (de inicio de acción más lento pero también más difícil de revertir/monitorizar en un contexto de riesgo hemorrágico intracraneal), reservándose el filtro de cava para contraindicación absoluta a la anticoagulación."},{"q":"¿En cuál de estos casos activaría el Código Ictus?","o":["Paciente de 78 años con deterioro cognitivo severo que sufre disartria de 3 horas de evolución.","Paciente de 55 años con debilidad en hemicuerpo izquierdo y paresia facial inferior izquierda de 1 hora de evolución, con HTA y DM2.","Paciente de 80 años que vive solo, encontrado en el suelo con dificultad para la marcha y disartria, última vez visto asintomático 12 horas antes.","Paciente de 64 años con parestesias en miembro superior derecho y lenguaje incomprensible de 15 minutos, con recuperación completa y asintomático a la llegada."],"c":"B","e":"El paciente con déficit neurológico focal agudo claro (hemiparesia y paresia facial) dentro de la ventana terapéutica y sin contraindicaciones evidentes (demencia grave que limitaría el beneficio) es el candidato idóneo para activar el Código Ictus; el resto de casos presentan limitaciones (deterioro cognitivo severo que condiciona el pronóstico funcional, tiempo de evolución muy prolongado sin datos claros de última vez visto asintomático reciente, o resolución completa de los síntomas antes de la valoración, sugestiva de AIT ya resuelto sin urgencia de reperfusión inmediata)."},{"q":"Varón de 61 años, fumador e hipertenso, con pérdida súbita de fuerza y hormigueo en mano derecha de 15 minutos, con recuperación casi completa. ECG: ritmo sinusal a 93 lpm. Señale la respuesta FALSA:","o":["Una causa probable es una embolia arterioarterial por desprendimiento de una placa carotídea.","La ecografía-doppler de troncos supraaórticos es poco útil para el diagnóstico.","Es necesario realizar una TC craneal para evaluar la repercusión sobre el parénquima cerebral.","El tratamiento quirúrgico está indicado si las pruebas de imagen revelan una estenosis carotídea \\>70%."],"c":"B","e":"El eco-doppler de troncos supraaórticos es, al contrario de lo afirmado, MUY útil en el estudio etiológico de un AIT de posible origen carotídeo, al permitir detectar y cuantificar una estenosis carotídea significativa, hallazgo que condicionaría directamente el tratamiento (endarterectomía si \\>70%)."},{"q":"Mujer de 54 años con hipertensión y diabetes, en tratamiento con hidroclorotiazida y metformina, fumadora, TA 158/92, colesterol total 232 mg/dl, HDL 32, LDL 166, triglicéridos 168, HbA1c 7,5%. ¿Cuál es el consejo MENOS útil en la prevención primaria del ictus?","o":["Añadir AAS 81 mg diario como antiagregante.","Añadir atorvastatina 10 mg diario para disminuir el colesterol.","Añadir lisinopril 20 mg diario para bajar la TA hasta 130/80 mmHg.","Incrementar metformina y ajustar la dieta para lograr HbA1c \\<7%."],"c":"A","e":"El AAS en prevención PRIMARIA (sin enfermedad cardiovascular establecida) no ha demostrado un beneficio neto claro en la reducción de ictus en la población general, dado que el riesgo hemorrágico contrarresta el modesto beneficio isquémico; en cambio, el control de la HTA, la dislipemia (estatina) y un adecuado control glucémico sí son medidas con beneficio bien establecido en la prevención primaria del ictus en pacientes de riesgo como esta paciente."},{"q":"En relación al tratamiento antitrombótico en la fibrilación auricular, señale lo INCORRECTO:","o":["El tratamiento antiagregante solo (monoterapia o AAS+clopidogrel) no está recomendado para la prevención del ictus en la FA.","La indicación de tromboprofilaxis no depende del patrón clínico de la FA (paroxística, persistente o permanente).","Con antivitamina K, se recomienda un INR 2-3, con un tiempo en rango terapéutico individual \\>70%.","El riesgo hemorrágico estimado debe, por sí solo, guiar las decisiones sobre la prescripción de anticoagulación."],"c":"D","e":"El riesgo hemorrágico estimado (p. ej. mediante escalas como HAS-BLED) debe valorarse siempre en conjunto con el riesgo trombótico (CHA2DS2-VASc) para individualizar la decisión, identificando y corrigiendo factores de riesgo hemorrágico modificables, pero NUNCA debe usarse de forma aislada para contraindicar por sí solo la anticoagulación en un paciente con indicación clara."},{"q":"Señale la afirmación INCORRECTA en relación a las valvulopatías:","o":["La insuficiencia tricuspídea funcional o secundaria sigue siendo una entidad infratratada, de mal pronóstico.","En un paciente con contraindicación formal para anticoagulación oral con antivitamina K no se debería utilizar una prótesis mecánica.","La primera opción para el tratamiento de la disfunción bioprotésica es la cirugía.","Tras cirugía cardiaca de cualquier tipo, el cierre de la orejuela izquierda no disminuye la aparición de ACV o embolias sistémicas."],"c":"D","e":"El ensayo LAAOS III demostró que el cierre quirúrgico concomitante de la orejuela izquierda durante otra cirugía cardiaca SÍ reduce la incidencia de ictus/embolia sistémica en pacientes con FA, por lo que afirmar que «no disminuye» esta aparición es incorrecto."},{"q":"¿Cuál de las siguientes situaciones NO es una indicación de los anticoagulantes orales de acción directa?","o":["Portador de prótesis valvular aórtica mecánica.","Tratamiento del tromboembolismo pulmonar.","Profilaxis de la trombosis venosa en el postoperatorio de prótesis de rodilla.","Prevención de ictus en fibrilación auricular no valvular."],"c":"A","e":"Los anticoagulantes orales de acción directa están formalmente contraindicados en portadores de prótesis valvulares mecánicas (únicamente validados con antagonistas de la vitamina K en este contexto, tras el ensayo RE-ALIGN que mostró peores resultados con dabigatrán), mientras que sí tienen indicación establecida en TEP, profilaxis tromboembólica postquirúrgica ortopédica y prevención de ictus en FA no valvular."},{"q":"Respecto a la determinación del dímero D en la embolia pulmonar, señale la respuesta FALSA:","o":["Su concentración está elevada en presencia de trombosis aguda, por activación simultánea de coagulación y fibrinólisis.","Su valor predictivo negativo es alto.","Su valor predictivo positivo es bajo.","Su sensibilidad es baja y su especificidad es elevada."],"c":"D","e":"El dímero D tiene, en realidad, una sensibilidad ALTA (útil para excluir TEP cuando es negativo, de ahí su alto VPN) y una especificidad BAJA (se eleva en múltiples situaciones no trombóticas: infección, cirugía, embarazo, cáncer, edad avanzada), justo la relación inversa a la que propone esta opción."}]},"52":{"title":"Enfermedad de Parkinson y otras discinesias.","questions":[{"q":"Es FALSO con respecto al tratamiento del delirium en el paciente en situación paliativa:","o":["Quetiapina está contraindicada en pacientes con parkinsonismo.","Levomepromazina es muy sedante, de acción rápida, aunque de corta duración.","Las benzodiacepinas pueden aumentar el riesgo de confusión.","El haloperidol es menos efectivo que los neurolépticos atípicos."],"c":"D","e":"El haloperidol es considerado, en general, igual de eficaz que los antipsicóticos atípicos para el control del delirium (y de hecho un fármaco de referencia clásica en este contexto), por lo que afirmar que es «menos efectivo» no es correcto; la quetiapina, por su menor bloqueo dopaminérgico, sí es preferible sobre el haloperidol en pacientes con parkinsonismo."},{"q":"Paciente con enfermedad de Parkinson, en tratamiento estable con levodopa, que empieza a presentar alucinaciones visuales bien estructuradas con cierta irritabilidad. ¿Cuál es el medicamento más adecuado para tratar las alucinaciones?","o":["Quetiapina.","Haloperidol.","Risperidona.","Lorazepam."],"c":"A","e":"La quetiapina, por su bajo potencial de bloqueo dopaminérgico D2, es el antipsicótico de elección en pacientes con enfermedad de Parkinson que desarrollan psicosis/alucinaciones, ya que minimiza el riesgo de empeorar el parkinsonismo motor, a diferencia de los antipsicóticos típicos (haloperidol) o de otros atípicos con mayor bloqueo D2 (risperidona)."},{"q":"Señale la respuesta FALSA sobre los trastornos del movimiento inducidos por fármacos:","o":["Son muy infrecuentes en nuestro medio.","La principal medicación que induce el parkinsonismo farmacológico son los fármacos antidopaminérgicos.","El parkinsonismo farmacológico se considera un efecto adverso dosis-dependiente.","El parkinsonismo farmacológico es más frecuente con los neurolépticos típicos."],"c":"A","e":"Los trastornos del movimiento inducidos por fármacos (especialmente el parkinsonismo por antidopaminérgicos: antipsicóticos, algunos antieméticos como metoclopramida) son, contrariamente a lo afirmado, relativamente FRECUENTES en la práctica clínica, sobre todo en pacientes ancianos polimedicados."},{"q":"Varón de 70 años con temblor en reposo y dificultad para abrocharse botones y atarse cordones. Exploración con rigidez en rueda dentada. Señale la correcta:","o":["El tratamiento de elección es levodopa-carbidopa a dosis altas desde el inicio.","El temblor es el síntoma que experimentará un beneficio rápido incluso con dosis bajas de levodopa.","Los efectos secundarios más graves de la levodopa incluyen confusión, alucinaciones, delirios, agitación, psicosis e hipotensión ortostática.","Si no hay respuesta clínica, se recomienda suspender bruscamente la levodopa."],"c":"C","e":"Los efectos adversos neuropsiquiátricos (confusión, alucinaciones, psicosis) y disautonómicos (hipotensión ortostática) de la levodopa son los más graves y limitantes, especialmente en pacientes ancianos; el tratamiento se inicia habitualmente a dosis bajas y se ajusta progresivamente (no a dosis altas desde el inicio), el temblor suele ser el síntoma que MENOS responde a la levodopa (mejor a bradicinesia y rigidez), y la suspensión brusca está contraindicada por el riesgo de síndrome neuroléptico maligno-like."},{"q":"En relación a la enfermedad de Parkinson señale la correcta:","o":["El temblor es el síntoma más frecuente y típicamente es de acción.","La inestabilidad postural con caídas suele aparecer en fases precoces de la enfermedad.","La hipotensión ortostática es muy común, incluso relativamente temprano en el curso de la enfermedad.","La bradicinesia afecta a miembros inferiores pero típicamente no a miembros superiores."],"c":"C","e":"La disautonomía, incluida la hipotensión ortostática, es una manifestación no motora frecuente y puede aparecer ya en fases relativamente tempranas de la enfermedad de Parkinson; el temblor característico es de REPOSO (no de acción), la inestabilidad postural con caídas es típica de fases AVANZADAS (no precoces, y su aparición precoz debe hacer sospechar un parkinsonismo atípico), y la bradicinesia afecta tanto a miembros superiores como inferiores."},{"q":"¿Cuáles son las manifestaciones no motoras adicionales de la enfermedad de Parkinson?","o":["Trastornos autónomos, alteraciones sensoriales y deterioro cognitivo.","Trastornos autónomos, alteraciones sensoriales y discapacidad visual.","Trastornos autónomos, alteraciones auditivas y deterioro cognitivo.","Trastornos autónomos, alteraciones sensoriales y deterioro olfativo."],"c":"A","e":"Los trastornos autónomos (disautonomía), las alteraciones sensoriales (dolor, parestesias) y el deterioro cognitivo son manifestaciones no motoras clásicas y clínicamente relevantes de la enfermedad de Parkinson, junto con el deterioro olfativo (hiposmia, un pródromo característico), los trastornos del sueño y los síntomas neuropsiquiátricos."},{"q":"¿Cuál de las siguientes opciones sobre la enfermedad de Parkinson es VERDADERA?","o":["El tabaquismo se ha asociado con menor riesgo de desarrollar la enfermedad.","La edad avanzada al momento de la presentación tiene mayor probabilidad de relacionarse con una predisposición genética.","La enfermedad de Parkinson se ha identificado como un trastorno monogénico relacionado con mutaciones en la α-sinucleína en la mayoría de los casos.","La característica patológica distintiva es la presencia de ovillos neurofibrilares y proteína tau en la sustancia negra."],"c":"A","e":"De forma epidemiológicamente consistente (aunque paradójica), el tabaquismo se ha asociado a un MENOR riesgo de desarrollar enfermedad de Parkinson; la mayoría de los casos son esporádicos (no monogénicos), las formas genéticas (mutaciones de α-sinucleína, LRRK2, entre otras) son más frecuentes en el inicio a edad TEMPRANA (no avanzada), y la característica patológica distintiva son los cuerpos de Lewy (agregados de α-sinucleína), no los ovillos neurofibrilares de tau (propios del Alzheimer)."},{"q":"¿Cuáles son las características clínicas de la enfermedad de Parkinson?","o":["Temblor en movimiento, bradicinesia, hipercinesia y discinesia.","Temblor en reposo, rigidez, bradicinesia y alteraciones de la marcha.","Temblor en reposo, ataxia, corea y distonía.","Temblor en movimiento, ataxia, corea y distonía."],"c":"B","e":"La tétrada clásica de la enfermedad de Parkinson es temblor de reposo, rigidez, bradicinesia y alteraciones de la marcha/inestabilidad postural, constituyendo el síndrome parkinsoniano característico."},{"q":"¿Cuál de las siguientes opciones es un ejemplo frecuente de amiloidosis localizada en el sistema nervioso central?","o":["Enfermedad de Parkinson.","Enfermedad de Huntington.","Enfermedad de Alzheimer.","Enfermedad de Creutzfeldt-Jakob."],"c":"C","e":"La enfermedad de Alzheimer es el ejemplo clásico de amiloidosis localizada en el SNC, por el depósito local de proteína beta-amiloide en forma de placas seniles dentro del propio tejido cerebral, sin relación con el depósito sistémico de proteínas amiloides circulantes."},{"q":"Varón de 77 años con alucinaciones visuales y auditivas intensas e ideas delirantes paranoides en los últimos 6 meses, con déficits cognitivos progresivos (memoria, cálculo, orientación) en el último año, con importantes fluctuaciones día a día. Temblor en reposo de la extremidad superior derecha y leve rigidez en rueda dentada. Marcha a pasos cortos con disminución del balanceo de brazos. ¿Qué síndrome clínico es más compatible?","o":["Enfermedad de Parkinson.","Demencia de Creutzfeldt-Jakob.","Demencia con cuerpos de Lewy.","Demencia vascular."],"c":"C","e":"La combinación de alucinaciones visuales bien estructuradas, fluctuación cognitiva marcada, deterioro cognitivo progresivo y parkinsonismo concurrente (no precedido por años de enfermedad de Parkinson establecida) es la tríada clásica de la demencia con cuerpos de Lewy."},{"q":"En relación con la demencia con cuerpos de Lewy, indique la opción FALSA:","o":["Son frecuentes las fluctuaciones cognitivas y atencionales.","El parkinsonismo se incluye entre los criterios diagnósticos.","Los síntomas psicóticos son frecuentes, predominando las alucinaciones visuales.","Los neurolépticos deben utilizarse en la mayoría de pacientes para controlar los trastornos conductuales."],"c":"D","e":"Los pacientes con demencia con cuerpos de Lewy presentan una hipersensibilidad característica a los neurolépticos, que pueden producir reacciones extrapiramidales graves e incluso un cuadro similar al síndrome neuroléptico maligno, por lo que su uso debe evitarse o reservarse con máxima precaución, no utilizarse «en la mayoría de pacientes»."},{"q":"¿Cómo se denomina el trastorno del movimiento caracterizado por la contracción simultánea de músculos agonistas y antagonistas, que induce cambios de postura y movimientos anormales?","o":["Mioclonías.","Distonía.","Corea.","Acatisia."],"c":"B","e":"La distonía se define precisamente por la contracción simultánea y sostenida de músculos agonistas y antagonistas, generando posturas anormales y movimientos repetitivos de torsión, a diferencia de las mioclonías (contracciones breves y súbitas), la corea (movimientos irregulares, fluidos, impredecibles) o la acatisia (inquietud motora subjetiva)."},{"q":"¿Cuál de las siguientes entidades NO suele cursar con distonía?","o":["Síndrome de Gilles de la Tourette.","Tratamiento crónico con neurolépticos.","Enfermedad de Wilson.","Corea de Huntington."],"c":"A","e":"El síndrome de Gilles de la Tourette se caracteriza fundamentalmente por tics motores y vocales, no por distonía; el tratamiento crónico con neurolépticos (discinesia tardía distónica), la enfermedad de Wilson y la corea de Huntington sí pueden cursar con manifestaciones distónicas."},{"q":"El temblor esencial se caracteriza por:","o":["Ser un temblor postural.","Aumentar con los movimientos y con el reposo por igual.","Asociarse en ocasiones a clínica parkinsoniana.","Asociarse en ocasiones con clínica cerebelosa."],"c":"A","e":"El temblor esencial es característicamente un temblor POSTURAL (que aparece al mantener una postura contra la gravedad, como los brazos extendidos) y de acción, que típicamente mejora con el reposo y con el alcohol, a diferencia del temblor parkinsoniano, que es de reposo."},{"q":"Ante un paciente con parkinsonismo, deterioro mental y episodios confusionales, el diagnóstico más probable es:","o":["Enfermedad de Pick.","Enfermedad de Alzheimer.","Enfermedad de Creutzfeldt-Jakob.","Enfermedad de cuerpos de Lewy difusos."],"c":"D","e":"La tríada de parkinsonismo, deterioro cognitivo y episodios confusionales fluctuantes es característica de la enfermedad/demencia con cuerpos de Lewy difusos, entidad en la que estos tres elementos coexisten de forma temprana, a diferencia del Alzheimer o la enfermedad de Pick, donde el parkinsonismo no es un rasgo central."},{"q":"Indique la proposición correcta en relación con la enfermedad de Parkinson:","o":["Los fármacos colinérgicos mejoran la clínica.","El temblor es resultado de la contracción simultánea de agonistas y antagonistas.","El temblor es de tipo intencional.","Existe una reducción de dopamina en el estriado y la sustancia negra."],"c":"D","e":"La fisiopatología central de la enfermedad de Parkinson es la degeneración de las neuronas dopaminérgicas de la sustancia negra pars compacta, con la consiguiente reducción de dopamina en el estriado; los fármacos colinérgicos EMPEORAN la clínica (existe un desequilibrio dopamina-acetilcolina, de ahí la utilidad de los anticolinérgicos, no de los colinérgicos), y el temblor parkinsoniano es de reposo, no intencional (que es propio de la afectación cerebelosa)."},{"q":"En un paciente con un síndrome parkinsoniano de dos años de evolución, ¿cuál de las siguientes manifestaciones le haría dudar de un diagnóstico de enfermedad de Parkinson idiopática?","o":["Disartria grave.","Ausencia de temblor.","Presencia de un trastorno de conducta del sueño REM.","Estreñimiento."],"c":"A","e":"Una disartria grave y precoz es un signo de alarma («red flag») que sugiere un parkinsonismo atípico (parálisis supranuclear progresiva, atrofia multisistémica) en lugar de la enfermedad de Parkinson idiopática, donde la disartria suele ser leve y tardía; la ausencia de temblor, el trastorno de conducta del sueño REM (pródromo típico) y el estreñimiento (manifestación no motora frecuente) son compatibles con la EP idiopática."},{"q":"¿Cuál es el tumor cerebral que con más frecuencia produce parkinsonismo?","o":["Meningioma.","Metástasis.","Glioblastoma multiforme.","Oligodendroglioma."],"c":"A","e":"El meningioma, especialmente cuando se localiza en la convexidad frontal o parasagital comprimiendo los ganglios basales o sus vías, es el tumor cerebral que con mayor frecuencia se ha asociado clásicamente a la aparición de un síndrome parkinsoniano secundario."},{"q":"En una enfermedad genética neurológica, el fenómeno de anticipación (aparición más precoz y grave en la siguiente generación) ocurre por expansión de trinucleótidos. ¿En cuál de estas enfermedades es posible esperar este fenómeno?","o":["Atrofia muscular espinal.","Distrofia muscular de Duchenne.","Enfermedad de Parkinson.","Distrofia miotónica de Steinert."],"c":"D","e":"La distrofia miotónica de Steinert es una enfermedad por expansión de un trinucleótido (CTG) en el gen DMPK, que presenta el fenómeno de anticipación genética (mayor número de repeticiones y clínica más grave y precoz en generaciones sucesivas), a diferencia de la atrofia muscular espinal, la distrofia de Duchenne (deleción génica, no repetición de trinucleótidos) o la enfermedad de Parkinson (mayoritariamente esporádica)."}]},"53":{"title":"Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras demencias.","questions":[{"q":"Indique la FALSA con respecto a las demencias:","o":["La demencia por cuerpos de Lewy se caracteriza por deterioro cognitivo, alucinaciones, síndrome hipocinético e hipersensibilidad a neurolépticos.","El tratamiento inicial de la enfermedad de Alzheimer se debe hacer con inhibidores de la colinesterasa.","En la demencia por cuerpos de Lewy el deterioro cognitivo es tardío.","En la enfermedad por priones de Creutzfeldt-Jakob es rápidamente progresiva y para su diagnóstico de confirmación se necesita una biopsia cerebral."],"c":"C","e":"En la demencia con cuerpos de Lewy el deterioro cognitivo es característicamente TEMPRANO, apareciendo de forma concurrente o precediendo al parkinsonismo (criterio clave que la distingue de la demencia asociada a la enfermedad de Parkinson, donde el deterioro cognitivo es tardío tras años de parkinsonismo establecido)."},{"q":"Señale la respuesta FALSA en relación a la demencia vascular multiinfarto:","o":["Se produce por la acumulación de infartos múltiples corticales en territorios de arterias cerebrales de calibre mediano-grande.","El cuadro cognitivo depende de las áreas cerebrales afectadas.","No suele tener un inicio agudo ni una evolución escalonada.","Hay síntomas conductuales y neuropsicológicos relacionados con la localización del infarto (depresión en frontales, alucinaciones en parietooccipitales, etc.)."],"c":"C","e":"La demencia vascular multiinfarto se caracteriza precisamente por un inicio AGUDO o subagudo (coincidiendo con cada evento vascular) y una evolución ESCALONADA (deterioro «en peldaños» con cada nuevo infarto), a diferencia del curso insidioso y continuo típico de la enfermedad de Alzheimer."},{"q":"Señale la respuesta FALSA con respecto a la enfermedad de Alzheimer:","o":["Los síntomas neuropsiquiátricos en la enfermedad de Alzheimer son poco comunes.","Los inhibidores de la colinesterasa no producen una mejoría clínicamente significativa en los síntomas neuropsiquiátricos.","Estos medicamentos tienen una modesta mejora en la cognición.","Los inhibidores de la colinesterasa se consideran terapias sintomáticas, no neuroprotectoras."],"c":"A","e":"Los síntomas neuropsiquiátricos (apatía, depresión, ansiedad, agitación, psicosis) son, en realidad, MUY comunes a lo largo de la evolución de la enfermedad de Alzheimer, apareciendo en la mayoría de los pacientes en algún momento de la enfermedad, no siendo infrecuentes como sugiere la afirmación."},{"q":"En relación al tratamiento de la enfermedad de Alzheimer (EA), señale la INCORRECTA:","o":["Los inhibidores de la acetilcolinesterasa (donepezilo, galantamina, rivastigmina) están indicados en la EA leve-moderada.","Tanto los IACE como la memantina han demostrado mejoría modesta en cognición, actividades de vida diaria y síntomas psicológicos y conductuales.","La memantina puede favorecer bradicardias, bloqueos auriculoventriculares y síncopes, por lo que se recomienda ECG en pacientes de riesgo.","En demencia avanzada hay que valorar la deprescripción de IACE y memantina cuando ya no ofrezcan beneficio."],"c":"C","e":"El riesgo de bradicardia, bloqueo auriculoventricular y síncope se asocia a los INHIBIDORES DE LA COLINESTERASA (por su efecto colinérgico vagotónico sobre el nodo sinusal/AV), no a la memantina, que actúa por antagonismo del receptor NMDA sin ese perfil de cardiotoxicidad."},{"q":"La incontinencia urinaria en ancianos puede tratarse con antimuscarínicos. Entre sus efectos adversos más frecuentes se encuentran todos los siguientes, EXCEPTO:","o":["Deterioro cognitivo.","Estreñimiento.","Xerostomía.","Efecto paradójico potenciador de la incontinencia."],"c":"D","e":"Los antimuscarínicos, por su efecto anticolinérgico, producen típicamente RETENCIÓN urinaria (no empeoramiento de la incontinencia), junto con deterioro cognitivo (especialmente relevante en ancianos, por su capacidad de atravesar la barrera hematoencefálica), estreñimiento y sequedad de boca (xerostomía)."},{"q":"¿Cuál es el papel de la tomografía por emisión de positrones (PET) en el diagnóstico de la enfermedad de Alzheimer?","o":["Permite detectar alteraciones vasculares características de la enfermedad de Alzheimer.","Los estudios funcionales con PET-FDG revelan un patrón de hipometabolismo característico.","Las imágenes por PET detectan cambios estructurales patognomónicos de la enfermedad.","La PET no es útil en el diagnóstico de la enfermedad de Alzheimer."],"c":"B","e":"La PET con fluorodesoxiglucosa (FDG-PET) es una herramienta funcional útil que revela un patrón característico de hipometabolismo témporo-parietal en la enfermedad de Alzheimer, aportando valor diagnóstico diferencial complementario a la neuroimagen estructural, sin ser en sí misma una prueba de detección de alteraciones vasculares ni de cambios estructurales."},{"q":"Además de la pérdida progresiva de memoria, ¿cuál de los siguientes datos clínicos es de utilidad para sugerir el diagnóstico de enfermedad de Alzheimer?","o":["Inicio de los síntomas antes de los 40 años de edad.","Accesos de alteración de la conciencia (fluctuaciones agudas).","Menor independencia en las actividades cotidianas.","Ausencia de un antecedente familiar de trastorno similar."],"c":"C","e":"El declive progresivo de la independencia funcional en las actividades de la vida diaria, en paralelo al deterioro cognitivo, es un criterio clínico central para el diagnóstico de demencia (incluida la enfermedad de Alzheimer), que la distingue del deterioro cognitivo leve (donde la funcionalidad se mantiene preservada); un inicio muy precoz (\\<40 años) y las fluctuaciones agudas de consciencia son, en cambio, datos atípicos que orientan hacia otras causas."},{"q":"La enfermedad de Gerstmann-Sträussler-Scheinker se caracteriza por:","o":["Demencia con mioclonías rápidamente progresiva.","Estar causada por priones.","Encontrarse en el diagnóstico diferencial de las ataxias progresivas esporádicas.","Transmitirse por herencia autosómica recesiva."],"c":"D","e":"A diferencia de otras enfermedades priónicas hereditarias, el síndrome de Gerstmann-Sträussler-Scheinker se transmite con un patrón autosómico DOMINANTE (no recesivo), asociado a mutaciones del gen PRNP; sí está causada por priones, cursa con ataxia progresiva de curso más lento que la demencia con mioclonías rápidamente progresiva característica de la enfermedad de Creutzfeldt-Jakob clásica, y forma parte del diagnóstico diferencial de las ataxias progresivas esporádicas del adulto."},{"q":"¿Qué neurotransmisor está implicado en el mecanismo de acción de los fármacos aprobados para el tratamiento sintomático de la enfermedad de Alzheimer?","o":["Noradrenalina.","Ácido glutámico.","Dopamina.","Acetilcolina."],"c":"D","e":"Los inhibidores de la colinesterasa (donepezilo, galantamina, rivastigmina) actúan aumentando la disponibilidad de acetilcolina en la sinapsis, neurotransmisor cuya deficiencia (por degeneración de las neuronas colinérgicas del núcleo basal de Meynert) contribuye a los síntomas cognitivos de la enfermedad de Alzheimer; la memantina, en cambio, actúa sobre el sistema glutamatérgico (antagonista NMDA)."},{"q":"Mujer de 75 años traída por su familia por depresión y fallos de memoria de meses de evolución, con anosognosia parcial. ¿En qué orden se presentan generalmente los siguientes síntomas en la progresión de la enfermedad de Alzheimer?","o":["Cambios de humor, síntomas conductuales, déficit cognitivo.","Síntomas conductuales, síntomas motores, declive de la independencia funcional.","Cambios de humor, déficit cognitivo, declive de la independencia funcional.","Síntomas conductuales, cambios de humor, síntomas motores."],"c":"C","e":"La secuencia típica de progresión de la enfermedad de Alzheimer comienza con cambios sutiles del estado de ánimo (frecuentemente síntomas depresivos precoces), seguidos por un déficit cognitivo progresivo (memoria, funciones ejecutivas) y, finalmente, un declive de la independencia funcional en las actividades de la vida diaria a medida que avanza la enfermedad."},{"q":"Varón de 62 años con cambios de personalidad, desinhibición conductual (comentarios sexuales inapropiados, irritabilidad, pérdida de normas sociales) y deterioro de memoria progresivo, con un accidente de tráfico reciente. MMSE 20/30. Exploración motora, sensitiva y cerebelosa normal. ¿Cuál es el diagnóstico más probable?","o":["Enfermedad de Alzheimer.","Demencia con cuerpos de Lewy.","Demencia frontotemporal (variante conductual).","Demencia vascular."],"c":"C","e":"El predominio de cambios precoces y marcados de personalidad, desinhibición social y conductual (con relativa preservación motora y sin alucinaciones o parkinsonismo prominentes), por delante del deterioro amnésico puro, es característico de la variante conductual de la demencia frontotemporal, que suele debutar a edades más jóvenes que el Alzheimer típico."},{"q":"Para diferenciar un cuadro delirante (delirium) de la enfermedad de Alzheimer, se pueden utilizar los siguientes criterios, EXCEPTO uno:","o":["Comienzo sintomático brusco.","Nivel de conciencia fluctuante.","Trastornos de atención.","Trastornos de memoria."],"c":"D","e":"Los trastornos de memoria están presentes tanto en el delirium como en la demencia, por lo que no son útiles para diferenciarlos; el inicio brusco, la fluctuación del nivel de consciencia y el marcado trastorno de la atención sí son características distintivas del delirium frente al curso insidioso de la enfermedad de Alzheimer."},{"q":"Entre las complicaciones neurológicas de la pelagra NO se encuentra:","o":["Demencia.","Paraparesia espástica.","Neuropatía periférica.","Hemiparesia."],"c":"D","e":"La pelagra (déficit de niacina) produce afectación neurológica simétrica y difusa (demencia, paraparesia espástica, neuropatía periférica), pero no un déficit focal lateralizado como la hemiparesia, que no forma parte del espectro clínico característico de esta carencia vitamínica."},{"q":"Hombre de 60 años con demencia rápidamente progresiva, rigidez, ataxia y mioclonías que persisten durante el sueño, con descargas de alto voltaje en el EEG. ¿Qué alteración podremos encontrar en el LCR?","o":["Hipoglucorraquia.","Bandas oligoclonales positivas.","Aumento del índice de IgG.","Proteína 14-3-3 positiva."],"c":"D","e":"El cuadro clínico (demencia rápidamente progresiva, mioclonías, ataxia, complejos periódicos en el EEG) es característico de la enfermedad de Creutzfeldt-Jakob; la determinación de proteína 14-3-3 en LCR es un marcador de apoyo diagnóstico ampliamente utilizado en esta entidad."},{"q":"¿Cuál de las siguientes condiciones puede contribuir al desarrollo de estreñimiento crónico?","o":["Hipertiroidismo.","Alzheimer avanzado.","Enfermedad de Whipple.","Disautonomía diabética."],"c":"B","e":"La enfermedad de Alzheimer avanzada se asocia a estreñimiento crónico por la combinación de inmovilidad, disminución de la ingesta hídrica y de fibra, y disfunción autonómica asociada a la neurodegeneración; el hipertiroidismo, por el contrario, se asocia clásicamente a hipermotilidad intestinal y diarrea, no a estreñimiento."},{"q":"Respecto a la enfermedad de Alzheimer, es FALSO que:","o":["Donepezilo y memantina están aprobados actualmente para su tratamiento.","El objetivo principal se centra en mejorar los trastornos conductuales y neurológicos asociados.","La depresión leve a moderada es común en las primeras etapas de la enfermedad.","Los inhibidores selectivos de la recaptación de serotonina (ISRS) están contraindicados."],"c":"D","e":"Los ISRS NO están contraindicados en la enfermedad de Alzheimer; de hecho, se utilizan con frecuencia para tratar la depresión y algunos síntomas conductuales asociados a la enfermedad, siendo generalmente bien tolerados en esta población."},{"q":"Varón de 65 años remitido por alteraciones de memoria desde hace un año (no recordar nombres de nuevos conocidos), sin cambios en su capacidad para las tareas diarias ni datos de depresión. Exploración neurológica normal. MMSE 24/30, con fallos en orientación y memoria reciente. Respecto a su sospecha diagnóstica, señale la respuesta FALSA:","o":["La causa subyacente más probable es un deterioro cognitivo leve.","El paciente tiene mayor riesgo de desarrollar demencia que la población general.","Es imprescindible realizar pruebas de imagen y de laboratorio para CONFIRMAR el diagnóstico.","Para el diagnóstico de demencia grave, los déficits deben interferir con la actividad diaria del paciente."],"c":"C","e":"El diagnóstico de deterioro cognitivo leve es fundamentalmente clínico (déficit cognitivo objetivable con preservación funcional); las pruebas de imagen y laboratorio se solicitan para DESCARTAR causas secundarias o tratables del deterioro cognitivo, no son imprescindibles para «confirmar» el diagnóstico de DCL en sí mismo."}]},"54":{"title":"Síndrome neuroléptico maligno. Hipertermia maligna.","questions":[{"q":"Señale la respuesta FALSA sobre el síndrome neuroléptico maligno (SNM):","o":["Es una emergencia neurológica potencialmente mortal que se debe sospechar ante dos de las cuatro características cardinales: alteración de consciencia, rigidez, fiebre o disautonomía, en contexto de uso de neurolépticos o abstinencia de dopamina.","La asociación con el uso de estos fármacos es idiosincrásica, no un fenómeno dependiente de la dosis, aunque las dosis más altas son un factor de riesgo.","Se debe considerar la terapia electroconvulsiva en pacientes que no responden a la terapia médica y en los que persiste catatonia residual.","Los pacientes que han presentado un SNM y vuelven a tomar agentes neurolépticos no tienen riesgo de recurrencia del síndrome."],"c":"D","e":"Los pacientes que han sufrido un episodio de síndrome neuroléptico maligno SÍ tienen un riesgo significativo de recurrencia si vuelven a exponerse a agentes neurolépticos, por lo que su reintroducción (cuando sea imprescindible) debe hacerse con extrema precaución, a dosis bajas, con fármacos de menor riesgo y bajo estrecha vigilancia."},{"q":"Señalar la respuesta FALSA sobre la hipertermia maligna:","o":["Los individuos susceptibles tienen anomalías en el receptor del músculo esquelético que permiten acumulación excesiva de calcio intracelular en respuesta a agentes desencadenantes.","Los signos iniciales pueden aparecer poco después de la inducción con agentes desencadenantes (volátiles y/o succinilcolina), durante el mantenimiento anestésico, o incluso a los pocos minutos de cesar el agente.","No está indicado administrar dantroleno antes de la anestesia en pacientes susceptibles a hipertermia maligna.","En la hipertermia maligna no hace falta suspender los medicamentos desencadenantes."],"c":"D","e":"Ante la sospecha o confirmación de un episodio de hipertermia maligna, es fundamental suspender INMEDIATAMENTE todos los agentes anestésicos desencadenantes (volátiles, succinilcolina), como primera medida terapéutica urgente junto con la administración de dantroleno, por lo que afirmar que «no hace falta suspenderlos» es claramente incorrecto y potencialmente letal."},{"q":"Señalar los agentes que se pueden administrar de manera segura a pacientes con susceptibilidad a hipertermia maligna:","o":["Anestésicos y sedantes intravenosos (p. ej. propofol).","Halotano.","Enflurano.","Succinilcolina."],"c":"A","e":"Los anestésicos y sedantes intravenosos (como el propofol) no son agentes desencadenantes de hipertermia maligna y pueden utilizarse con seguridad en pacientes susceptibles, a diferencia de los anestésicos halogenados volátiles (halotano, enflurano y otros) y de la succinilcolina, que son los desencadenantes clásicos que deben evitarse por completo."},{"q":"¿Cuál de las siguientes afirmaciones es CORRECTA respecto a la hipertermia maligna?","o":["Es un síndrome hipermetabólico desencadenado tras la exposición a neurolépticos.","Ocurre en pacientes genéticamente susceptibles.","La enfermedad es relativamente frecuente y tiene buen pronóstico.","El fracaso renal es excepcional."],"c":"B","e":"La hipertermia maligna es un trastorno farmacogenético (mutaciones del receptor de rianodina del músculo esquelético, entre otras) que ocurre en individuos genéticamente predispuestos expuestos a determinados anestésicos (no a neurolépticos, que es lo que desencadena el síndrome neuroléptico maligno, entidad distinta); es una enfermedad poco frecuente que, sin tratamiento precoz con dantroleno, puede ser rápidamente mortal, y el fracaso renal agudo por rabdomiólisis es una complicación reconocida, no excepcional."}]},"55":{"title":"Estudio del paciente con anemia. Anemia ferropénica y otras anemias hipoproliferativas. Anemias megaloblásticas. Anemias hemolíticas.","questions":[{"q":"Varón con bypass entérico por obesidad mórbida que presenta diarrea crónica, con déficit de vitamina B12 pero niveles elevados de ácido fólico. ¿Qué entidad consideraría más probable?","o":["Enfermedad celíaca.","Intolerancia a la lactosa.","Sobrecrecimiento bacteriano intestinal.","Anemia perniciosa."],"c":"C","e":"En el sobrecrecimiento bacteriano de intestino delgado (favorecido por asas ciegas tras cirugía bariátrica), las bacterias colónicas consumen la vitamina B12 disponible pero sintetizan folato, generando el patrón característico de B12 baja con folato normal o elevado."},{"q":"Mujer de 35 años con astenia de 4 semanas, palidez y fragilidad ungueal, con menstruaciones abundantes. Hemoglobina 8,6 g/dl, VCM 75 fl. ¿Qué alteración esperaría encontrar en la analítica solicitada?","o":["Reticulocitos corregidos superiores al 3%.","Hepcidina aumentada.","Ferritina ligeramente aumentada.","Índice de saturación de la transferrina disminuido."],"c":"D","e":"En la anemia ferropénica, el índice de saturación de la transferrina está DISMINUIDO (menor hierro circulante disponible para saturar la transferrina); la ferritina está DISMINUIDA (no aumentada, es el marcador de depósitos de hierro), la hepcidina está DISMINUIDA (para favorecer la absorción intestinal de hierro) y la respuesta reticulocitaria es inadecuada/baja en la ferropenia, no elevada como en las anemias regenerativas."},{"q":"Señale la respuesta CORRECTA en relación con las anemias megaloblásticas:","o":["Los niveles de homocisteína y ácido metilmalónico están elevados tanto en el déficit de B12 como en el de ácido fólico.","Hasta un 20% de la vitamina B12 ingerida se absorbe en el tubo digestivo mediante difusión pasiva.","La determinación de anticuerpos frente a factor intrínseco es una prueba poco sensible pero muy específica para el diagnóstico de anemia perniciosa.","Los alimentos que contienen mayor cantidad de vitamina B12 son de origen vegetal."],"c":"C","e":"Los anticuerpos anti-factor intrínseco tienen una especificidad muy alta pero una sensibilidad limitada (presentes solo en una parte de los pacientes con anemia perniciosa), por lo que un resultado negativo no la descarta. El ácido metilmalónico solo se eleva en el déficit de B12 (no en el de folato, ya que interviene específicamente en una vía metabólica dependiente de B12), y la vitamina B12 se encuentra en alimentos de origen ANIMAL, no vegetal."},{"q":"Varón de 72 años con componente monoclonal IgG lambda de 1,5 g/dl. Aspirado de médula ósea con 8% de células plasmáticas. Sin anemia, insuficiencia renal ni lesiones líticas. ¿Cuál es la respuesta CORRECTA?","o":["Se trata de una GMSI IgG lambda y realizaría únicamente seguimiento periódico cada 6 meses-1 año.","Se trata de un mieloma múltiple asintomático e iniciaría tratamiento por el elevado riesgo de progresión.","Probablemente se trate de una amiloidosis primaria, dado el componente lambda, el 8% de células plasmáticas y la HTA, e iniciaría tratamiento.","Podría tratarse de un plasmocitoma solitario y se trataría con radioterapia."],"c":"A","e":"Al no cumplir criterios CRAB (sin anemia, insuficiencia renal ni lesiones líticas) ni criterios de mieloma asintomático de alto riesgo, y con un componente M \\<3 g/dl y \\<10% de células plasmáticas en médula, el diagnóstico es de gammapatía monoclonal de significado incierto (GMSI), que se maneja con seguimiento periódico sin tratamiento activo."},{"q":"Mujer de 70 años con astenia, febrícula y claudicación de miembros superiores de 2 meses. VSG 90 mm/h, anemia normocítica, y en eco-doppler axilar se observa el «signo del halo». ¿En qué entidad pensaría primero?","o":["Artritis reumatoide.","Polimiositis.","Arteritis de células gigantes.","Polimialgia reumática."],"c":"C","e":"El signo del halo en la ecografía de arterias temporales/axilares (engrosamiento hipoecoico de la pared arterial por inflamación) es un hallazgo característico de la arteritis de células gigantes, que además explica la claudicación de miembros superiores por afectación de arterias subclavias/axilares y el síndrome inflamatorio (VSG muy elevada, anemia normocítica de trastorno crónico)."},{"q":"Una de las siguientes entidades clínicas NO es causa de anemia ferropénica:","o":["Pancreatitis crónica.","Enfermedad celíaca.","Gastritis autoinmune.","Infección por Helicobacter pylori."],"c":"A","e":"La pancreatitis crónica no es una causa reconocida de anemia ferropénica; la enfermedad celíaca (malabsorción duodenal), la gastritis autoinmune (aunque más clásicamente asociada a déficit de B12, también puede alterar la absorción de hierro) y la infección por H. pylori (competencia por el hierro, gastritis crónica) sí son causas descritas de ferropenia."},{"q":"Para el abordaje diagnóstico de una anemia normocítica, indique el parámetro analítico inicial más importante:","o":["Frotis de sangre periférica.","Índice reticulocitario.","Test de Coombs.","Ferritina plasmática."],"c":"B","e":"El índice reticulocitario corregido es el parámetro clave inicial en el estudio de cualquier anemia, ya que clasifica el cuadro en regenerativo (respuesta medular adecuada, sugestivo de pérdida/destrucción periférica) o arregenerativo (fallo de producción medular), orientando el resto del estudio diagnóstico."},{"q":"Mujer de 48 años con anemia ferropénica, epistaxis de repetición y telangiectasias en mucosa oral y tracto gastrointestinal, sin antecedentes familiares. El estudio genético muestra una mutación del gen ENG. Respecto a esta entidad (telangiectasia hemorrágica hereditaria), todas son correctas EXCEPTO una:","o":["La herencia es autosómica dominante.","Se recomienda antibioterapia profiláctica en manipulaciones dentales.","Es esperable una mayor prevalencia de migraña.","Por su alto riesgo de sangrado, la anticoagulación está contraindicada de forma absoluta."],"c":"D","e":"La anticoagulación NO está contraindicada de forma absoluta en la telangiectasia hemorrágica hereditaria (síndrome de Rendu-Osler-Weber); cuando existe una indicación clara (p. ej. fibrilación auricular), debe individualizarse el riesgo-beneficio y extremar la vigilancia, pero no se excluye por sistema. El resto de afirmaciones (herencia autosómica dominante, profilaxis antibiótica dental por riesgo de shunts pulmonares y embolismo séptico, mayor prevalencia de migraña) son correctas."},{"q":"Respecto a la esferocitosis hereditaria, señale la respuesta correcta:","o":["Los hematíes presentan cuerpos de Heinz.","Tiene tendencia a presentar volúmenes corpusculares altos.","La herencia es dominante ligada al cromosoma X.","La proteína alterada es la espectrina."],"c":"D","e":"La esferocitosis hereditaria se debe a defectos en proteínas del citoesqueleto de la membrana eritrocitaria, siendo la espectrina la más frecuentemente implicada; se hereda de forma autosómica dominante en la mayoría de los casos (no ligada a X), y el VCM suele ser normal o discretamente reducido (no elevado), con aumento de la CHCM."},{"q":"Varón de 60 años con pérdida de peso, fatiga y dolor óseo difuso. Anemia normocítica y fosfatasa alcalina elevada. TC con múltiples lesiones óseas sugestivas de metástasis; la biopsia confirma carcinoma metastásico sin poder identificar el tumor primario. ¿Cuál sería la mejor estrategia inicial?","o":["Realizar PET-TC para intentar localizar el tumor primario.","Comenzar quimioterapia empírica sin más estudios.","Asegurarse de que en la biopsia se hayan realizado estudios inmunohistoquímicos para identificar el origen tumoral.","Realizar una RM para evaluar lesiones óseas y tejidos blandos adyacentes."],"c":"C","e":"Antes de solicitar pruebas de imagen adicionales o iniciar tratamiento empírico, el paso más rentable y eficiente en un carcinoma de origen desconocido es maximizar la información del tejido ya disponible mediante estudios inmunohistoquímicos (y moleculares si procede) dirigidos a identificar el linaje/origen tumoral más probable, lo que orienta de forma coste-efectiva el tratamiento y estudios de imagen posteriores."},{"q":"Varón de 35 años, trabajador de una fábrica de reciclaje de baterías, con astenia, dolor abdominal difuso y estreñimiento recurrente. Línea azulada en el borde de las encías y debilidad en extremidades. Anemia normocítica con punteado basófilo en eritrocitos. ¿Cuál es el agente tóxico más probable?","o":["Intoxicación por arsénico.","Intoxicación por mercurio.","Intoxicación por plomo.","Intoxicación por cadmio."],"c":"C","e":"La combinación de exposición ocupacional a baterías (fuente clásica de plomo), la línea de Burton (ribete azulado gingival), el dolor abdominal («cólico saturnino»), la debilidad (neuropatía motora) y la anemia con punteado basófilo en el frotis es el cuadro característico del saturnismo (intoxicación crónica por plomo)."},{"q":"Mujer de 35 años con colitis ulcerosa reciente, fiebre, distensión abdominal dolorosa, diarrea con múltiples deposiciones y deshidratación. Leucocitosis intensa y anemia. ¿Qué prueba diagnóstica realizaría en primer lugar?","o":["Colonoscopia.","Radiografía simple de abdomen.","ANCA-PR3 urgentes.","Ecografía abdominal."],"c":"B","e":"Ante la sospecha de un brote grave con posible megacolon tóxico, la radiografía simple de abdomen es la prueba inicial (rápida y sin riesgo) para valorar dilatación colónica; la colonoscopia completa está contraindicada en esta fase aguda grave por el riesgo de perforación."},{"q":"En una paciente hospitalizada con síndrome hemolítico urémico con indicación de inicio inmediato de eculizumab, ¿cuál sería la actitud más apropiada?","o":["Administrar la vacuna meningocócica tetravalente conjugada ACYW y la vacuna frente al serogrupo B tan pronto como sea posible.","Iniciar profilaxis antibiótica con penicilina oral.","Retrasar el inicio de eculizumab hasta dos semanas después de la vacunación frente a meningococo.","Las respuestas «a» y «b» son ciertas."],"c":"D","e":"El eculizumab (inhibidor del complemento terminal) aumenta considerablemente el riesgo de infección meningocócica invasiva, por lo que se recomienda vacunación frente a meningococo (tetravalente ACYW y serogrupo B) lo antes posible, junto con profilaxis antibiótica hasta que la respuesta vacunal sea completa, sin retrasar el inicio del fármaco en una situación urgente que lo requiere."},{"q":"Varón de 17 años con dolor intenso en ambas caderas, brazos, y dolor generalizado, con episodios similares previos. Bilirrubina total 1,5 mg/dl, anemia microcítica y frotis con eritrocitos alargados y semilunares. ¿Cuál es el mecanismo más probable?","o":["Una mutación somática que altera el corte y empalme (splicing) del ARN mensajero del gen de la globina.","Déficit de pirimidina 5\\' nucleotidasa.","Mutación del gen de la beta-globina que cambia el sexto aminoácido de ácido glutámico a valina.","Deleción de uno de los cuatro loci de la alfa-globina."],"c":"C","e":"El cuadro (crisis vasooclusivas dolorosas recurrentes, hemólisis con hiperbilirrubinemia y hematíes falciformes en el frotis) es característico de la anemia de células falciformes (drepanocitosis), causada por la mutación puntual del gen de la beta-globina que sustituye ácido glutámico por valina en la posición 6, dando lugar a la hemoglobina S."},{"q":"¿Cuál de las siguientes afirmaciones sobre las anemias ferropénicas es FALSA?","o":["Se caracteriza por fallo de la síntesis de hemoglobina.","Es la anemia más frecuente mundialmente.","La ferritina suele estar baja.","El receptor soluble de transferrina (RST) está bajo."],"c":"D","e":"El receptor soluble de transferrina está ELEVADO (no bajo) en la anemia ferropénica, reflejando el aumento compensador de la expresión de receptores de transferrina en los precursores eritroides ante la deficiencia de hierro; este parámetro es especialmente útil para distinguir la ferropenia de la anemia de trastorno crónico, donde el RST suele ser normal."},{"q":"En relación con las anemias hemolíticas, ¿cuál de ellas se debe a un defecto ADQUIRIDO?","o":["Hemoglobinuria paroxística nocturna.","Eliptocitosis hereditaria.","Déficit de piruvato quinasa.","Déficit de glucosa-6-fosfato deshidrogenasa."],"c":"A","e":"La hemoglobinuria paroxística nocturna es una enfermedad clonal ADQUIRIDA, causada por una mutación somática del gen PIGA en una célula madre hematopoyética, a diferencia de la eliptocitosis, el déficit de piruvato quinasa y el déficit de G6PD, que son trastornos hereditarios."},{"q":"En relación con la indicación de la eritropoyetina recombinante humana (rHu-EPO), señale la afirmación FALSA:","o":["Su aplicación más frecuente es en pacientes con anemia secundaria a insuficiencia renal.","La eritropoyetina es una alternativa a la transfusión sanguínea en TODOS los procesos de cirugía ortopédica que precisen sangre.","Se emplea en pacientes con autotransfusión con predepósito para facilitar la recuperación de la hemoglobina.","Está aprobada en pacientes con neoplasias sólidas y procesos linfoproliferativos con anemia sintomática secundaria a la enfermedad de base."],"c":"B","e":"La EPO no es una alternativa sistemática a la transfusión en todos los procesos de cirugía ortopédica, sino que su uso se reserva a situaciones seleccionadas (anemia preoperatoria, alto riesgo transfusional), individualizando caso por caso; el resto de indicaciones (IRC, autotransfusión con predepósito, anemia por neoplasia/quimioterapia) sí están bien establecidas."},{"q":"¿Cuál de los siguientes datos NO es propio del síndrome hemolítico?","o":["Esplenomegalia.","Hiperbilirrubinemia.","Incremento de la LDH sérica.","Adenopatías."],"c":"D","e":"Las adenopatías no forman parte del patrón característico del síndrome hemolítico, que se define por esplenomegalia (aumento de destrucción/secuestro eritrocitario), hiperbilirrubinemia indirecta y elevación de LDH (marcadores de hemólisis)."},{"q":"Varón dado d
