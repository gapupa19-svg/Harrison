e alta tras SCASEST con aspirina, clopidogrel, atenolol y atorvastatina. A los 15 días desarrolla trastorno confusional agudo y púrpura en miembros inferiores. Analítica: anemia macrocítica, trombocitopenia severa, LDH elevada e hiperbilirrubinemia indirecta, con TP y TTPA normales. ¿Cuál es el proceso más probable?","o":["Trombocitopenia autoinmune por anticuerpos inducidos por heparina.","Trombocitopenia severa diferida por la administración de abciximab al ingreso.","Púrpura trombótica trombocitopénica (PTT) asociada al tratamiento con clopidogrel.","El estudio de médula ósea es imprescindible para el diagnóstico."],"c":"C","e":"La combinación de trombocitopenia grave, anemia hemolítica microangiopática (LDH elevada, bilirrubina indirecta) y clínica neurológica (confusión), con coagulación normal, en un paciente que inició clopidogrel recientemente, es característica de la púrpura trombótica trombocitopénica asociada a este fármaco, una asociación bien descrita y potencialmente fatal si no se trata precozmente con plasmaféresis."},{"q":"¿Cuál de las siguientes deficiencias vitamínicas puede causar un nistagmo que bate hacia arriba?","o":["Déficit de folato.","Déficit de tiamina.","Déficit de magnesio.","Déficit de piridoxina."],"c":"B","e":"El déficit de tiamina (vitamina B1), causante de la encefalopatía de Wernicke, puede producir un nistagmo vertical de batida hacia arriba, junto con la tríada clásica de confusión, ataxia y oftalmoplejía."},{"q":"La coexistencia de gastritis atrófica y anemia macrocítica por malabsorción de vitamina B12 debida a falta de secreción de factor intrínseco se denomina:","o":["Gastritis anemizante.","Síndrome de malabsorción de B12.","Anemia sideropénica.","Anemia perniciosa."],"c":"D","e":"La anemia perniciosa es la anemia megaloblástica causada por gastritis atrófica autoinmune con destrucción de células parietales, pérdida de secreción de factor intrínseco y consiguiente malabsorción de vitamina B12 en el íleon terminal."},{"q":"Mujer de 45 años valorada por equimosis fáciles, epistaxis y aumento del sangrado menstrual. Hemoglobina 10,1 g/dl, leucocitos 8.000/µl con diferencial normal, plaquetas 10.000/µl, TP y TTPA normales, serología de lupus negativa. Frotis normal salvo la marcada disminución de plaquetas. ¿Cuál es la causa más probable de la trombocitopenia?","o":["Púrpura trombocitopénica trombótica-síndrome hemolítico urémico.","Enfermedad de von Willebrand tipo IIB.","Trombocitopenia autoinmune (PTI).","Síndrome de Bernard-Soulier."],"c":"C","e":"Una trombocitopenia aislada y grave, con el resto de series hematológicas normales, coagulación normal y frotis sin otras alteraciones (sin esquistocitos, que descartarían PTT/SHU) es el cuadro característico de la trombocitopenia inmune primaria (PTI)."},{"q":"La tríada de trombosis venosa portal, hemólisis y pancitopenia sugiere, ¿cuál de los siguientes diagnósticos?","o":["Leucemia promielocítica aguda.","Síndrome hemolítico urémico.","Hemoglobinuria paroxística nocturna.","Leptospirosis."],"c":"C","e":"La hemoglobinuria paroxística nocturna se caracteriza por hemólisis intravascular crónica, citopenias (por el frecuente solapamiento con aplasia medular) y un marcado estado de hipercoagulabilidad con predilección por trombosis venosas atípicas, especialmente en el territorio esplácnico (portal, hepática), lo que explica esta tríada característica."},{"q":"¿Cuál de las siguientes NO es una causa de anemia en la insuficiencia cardiaca?","o":["Déficit de hierro.","Hemodilución.","Tratamiento con betabloqueantes.","Estado inflamatorio."],"c":"C","e":"El tratamiento con betabloqueantes no es una causa reconocida de anemia en la insuficiencia cardiaca; el déficit de hierro (absoluto o funcional), la hemodilución por expansión de volumen y el estado inflamatorio crónico sí son mecanismos bien establecidos de la anemia asociada a la IC."},{"q":"¿Cuál es el dato analítico que se observa en la mayoría de los pacientes afectados de poliarteritis nudosa?","o":["VSG normal.","Anemia microcítica.","Plaquetopenia.","Leucocitosis neutrófila sin eosinofilia."],"c":"D","e":"La poliarteritis nodosa cursa característicamente con un síndrome inflamatorio sistémico con leucocitosis de predominio neutrofílico y SIN eosinofilia significativa (a diferencia de la granulomatosis eosinofílica con poliangeítis, donde la eosinofilia es un dato cardinal), junto con anemia de trastorno crónico (normocítica, no microcítica) y VSG elevada."},{"q":"¿Qué dato analítico es el más típico en la vasculitis de Churg-Strauss (granulomatosis eosinofílica con poliangeítis)?","o":["Plaquetopenia.","Anemia normocítica.","Eosinofilia.","Leucocitosis."],"c":"C","e":"La eosinofilia periférica marcada es el dato analítico distintivo y prácticamente constante de la granulomatosis eosinofílica con poliangeítis, formando parte de sus criterios diagnósticos junto con el asma y la afectación de pequeño-mediano vaso."},{"q":"Mujer de 35 años en tratamiento con anticonceptivos, que acude a Urgencias con síndrome febril y parestesias en hemicuerpo izquierdo. Hb 7,5 g/dl, plaquetas 7.000/µl, leucocitos normales, LDH 1.200 UI/l, reticulocitos 10%, haptoglobina indetectable, test de Coombs directo negativo, frotis con esquistocitos. Coagulación normal. ¿Cuál es el diagnóstico más probable?","o":["Anemia hemolítica autoinmune.","Púrpura trombótica trombocitopénica.","Síndrome de Evans.","Trombocitopenia inmune idiopática."],"c":"B","e":"La péntada clásica de anemia hemolítica microangiopática (esquistocitos, LDH elevada, haptoglobina indetectable), trombocitopenia grave, fiebre, síntomas neurológicos y Coombs directo NEGATIVO (que descarta el mecanismo autoinmune) es característica de la púrpura trombótica trombocitopénica, una emergencia hematológica que requiere plasmaféresis urgente."},{"q":"¿Cuál de los siguientes es el síntoma más frecuente de la anemia?","o":["Cambio de humor.","Irritabilidad.","Palpitaciones.","Astenia progresiva."],"c":"D","e":"La astenia (fatiga, cansancio progresivo) es el síntoma más frecuente y característico de la anemia, reflejo directo de la menor capacidad de transporte de oxígeno a los tejidos."},{"q":"El síndrome antifosfolípido se define por la tríada:","o":["Leucopenia, trombosis y abortos de repetición.","Anemia hemolítica, hemorragias y abortos de repetición.","Trombosis, abortos de repetición y trombocitopenia.","Pancitopenia, fenómenos hemorrágicos e insuficiencia renal."],"c":"C","e":"El síndrome antifosfolípido se caracteriza clínicamente por la combinación de trombosis (arterial y/o venosa), morbilidad obstétrica (abortos de repetición u otras complicaciones gestacionales) y, con frecuencia, trombocitopenia, en presencia de anticuerpos antifosfolípido persistentemente positivos."},{"q":"Mujer de 28 años referida para valoración de anemia descubierta en un cribado para un seguro de vida. Sana, sin fármacos salvo un multivitamínico con hierro, fatiga con el ejercicio en los últimos 6-9 meses. Menstruación regular. Fuma 20 cigarrillos/día. Leucocitos 4.000/µl, plaquetas 235.000/µl, Hb 8 g/dl, VCM 105. Función renal y hepática normales. ¿Cuál es el mejor estudio para confirmar el diagnóstico?","o":["Biopsia de médula ósea.","Nivel de homocisteína sérica.","Niveles séricos de hierro y transferrina.","Nivel sérico de vitamina B12."],"c":"D","e":"Ante una anemia con macrocitosis marcada (VCM 105) sin otra causa evidente en una paciente relativamente joven, la determinación de vitamina B12 sérica es el estudio inicial más directo para confirmar una causa megaloblástica, que es la sospecha diagnóstica prioritaria ante este grado de macrocitosis."},{"q":"Las siguientes variables típicamente aumentan en una persona con anemia hemolítica, EXCEPTO:","o":["Aspartato aminotransferasa (AST).","Haptoglobina.","LDH.","Reticulocitos."],"c":"B","e":"La haptoglobina DISMINUYE (no aumenta) en la hemólisis, al consumirse rápidamente uniéndose a la hemoglobina libre liberada de los hematíes destruidos; AST, LDH y reticulocitos, en cambio, se elevan característicamente en los procesos hemolíticos."},{"q":"Una de las siguientes enfermedades puede causar anemia hemolítica por anticuerpos fríos:","o":["COVID-19.","Dengue.","Coagulación intravascular diseminada.","Neumonía por Mycoplasma pneumoniae."],"c":"D","e":"La infección por Mycoplasma pneumoniae es una causa clásica de anemia hemolítica autoinmune por anticuerpos fríos (crioaglutininas de tipo IgM anti-I), que puede aparecer durante o poco después de la neumonía atípica."},{"q":"¿Cuál de los siguientes apartados es FALSO en relación a la anemia perniciosa?","o":["Se produce por un déficit de factor intrínseco.","Con frecuencia aparecen alteraciones neurológicas.","En el hemograma encontramos anemia severa con VCM elevado y reticulocitos altos.","El tratamiento consiste en la administración de vitamina B12 intramuscular."],"c":"C","e":"En la anemia perniciosa, como en toda anemia megaloblástica, la eritropoyesis es INEFICAZ, por lo que los reticulocitos están BAJOS o inadecuadamente normales para el grado de anemia, no elevados; el resto de afirmaciones (déficit de factor intrínseco, afectación neurológica por degeneración combinada subaguda, tratamiento con B12 intramuscular) son correctas."},{"q":"Los siguientes procesos pueden cursar con anemia microangiopática, EXCEPTO:","o":["Hipertensión maligna.","Angioplastia coronaria.","Prótesis valvulares mecánicas.","Púrpura trombótica trombocitopénica."],"c":"B","e":"La angioplastia coronaria no es causa reconocida de anemia hemolítica microangiopática; la hipertensión maligna (daño endotelial microvascular), las prótesis valvulares mecánicas (hemólisis mecánica por turbulencia) y la PTT (microtrombos plaquetarios difusos) sí son causas clásicas de este tipo de anemia."},{"q":"En relación a los datos de laboratorio y al tratamiento de la anemia posthemorrágica aguda, señale la proposición VERDADERA:","o":["Desde el primer momento, la Hb y el hematocrito descienden en relación directa con la cuantía de la hemorragia.","Puede observarse la presencia de eritroblastos en sangre periférica.","La perfusión de grandes cantidades de expansores del plasma puede producir trastornos del funcionalismo de los neutrófilos, con aumento del riesgo de infecciones.","Si la médula ósea es normal, se producirá un aumento de los reticulocitos, con pico máximo a las 48 horas de la hemorragia."],"c":"B","e":"En la anemia posthemorrágica aguda con médula ósea normal, la respuesta reticulocitaria puede ser intensa e incluir la liberación de formas inmaduras (eritroblastos) a la sangre periférica; la Hb y el hematocrito NO descienden de forma inmediata proporcional a la pérdida (se requiere tiempo para la hemodilución compensadora), y el pico reticulocitario máximo se alcanza en torno al 5º-7º día, no a las 48 horas."},{"q":"¿Cuál de las siguientes complicaciones NO es propia de la leucemia linfática crónica?","o":["Anemia hemolítica autoinmune.","Hipogammaglobulinemia.","Infiltración en el sistema nervioso central.","Neumonía neumocócica."],"c":"C","e":"La infiltración del sistema nervioso central no es una complicación característica de la leucemia linfática crónica (a diferencia de otras neoplasias linfoides más agresivas); la anemia hemolítica autoinmune, la hipogammaglobulinemia (con el consiguiente riesgo de infecciones bacterianas encapsuladas, como la neumonía neumocócica) sí son complicaciones bien reconocidas de esta enfermedad."},{"q":"Respecto a la anemia hemolítica autoinmune adquirida, es CIERTO que:","o":["La trombopenia es frecuente en el adulto de forma aislada sin otra causa.","Son formas de hemólisis exclusivamente extracorpusculares.","Cuando se asocia a lupus eritematoso sistémico, suele ser por anticuerpos calientes.","Las formas asociadas a fármacos son siempre mediadas por anticuerpos fríos."],"c":"C","e":"La anemia hemolítica autoinmune asociada al LES está mediada característicamente por anticuerpos calientes (IgG), el patrón más frecuente en este contexto; las formas farmacológicas pueden estar mediadas tanto por mecanismos calientes como fríos según el fármaco implicado, no exclusivamente por anticuerpos fríos."}]},"56":{"title":"Gammapatías monoclonales. Trastornos de las células plasmáticas. Amiloidosis.","questions":[{"q":"¿Cuál de los siguientes NO es una manifestación clínica característica del mieloma múltiple?","o":["Dolores óseos.","Adenopatías.","Insuficiencia renal.","Hipercalcemia."],"c":"B","e":"Las adenopatías no forman parte de las manifestaciones clásicas del mieloma múltiple (proceso fundamentalmente medular, no ganglionar); el dolor óseo, la insuficiencia renal y la hipercalcemia constituyen, junto con la anemia, la tríada/tétrada CRAB que define la enfermedad sintomática."},{"q":"Varón de 72 años con componente monoclonal IgG lambda de 1,5 g/dl. Aspirado de médula ósea con 8% de células plasmáticas. Sin anemia, insuficiencia renal ni lesiones líticas. ¿Cuál es la respuesta CORRECTA?","o":["Se trata de una GMSI IgG lambda y realizaría únicamente seguimiento periódico cada 6 meses-1 año.","Se trata de un mieloma múltiple asintomático e iniciaría tratamiento por el elevado riesgo de progresión.","Probablemente se trate de una amiloidosis primaria, e iniciaría tratamiento.","Podría tratarse de un plasmocitoma solitario y se trataría con radioterapia."],"c":"A","e":"Con componente M \\<3 g/dl, \\<10% de células plasmáticas en médula y sin criterios CRAB ni biomarcadores de malignidad, el diagnóstico es de GMSI, que se maneja con seguimiento periódico sin tratamiento activo, a diferencia del mieloma asintomático (que sí requiere ciertos criterios de alto riesgo para plantear tratamiento) o el plasmocitoma solitario (lesión única, sin infiltración medular difusa)."},{"q":"En los pacientes con gammapatía monoclonal de significado incierto (GMSI), se estratifica el riesgo a partir de los siguientes parámetros, MENOS UNO:","o":["Nivel de componente M superior a 1,5 g/dl.","Que el componente M no sea IgG.","Hemoglobina inferior a 12 g/dl.","Proporción de cadenas ligeras libres séricas kappa/lambda menor de 0,26 o superior a 1,65."],"c":"C","e":"El modelo de estratificación de riesgo de progresión de la GMSI (modelo de la Clínica Mayo) se basa en tres factores: nivel de componente M \\>1,5 g/dl, isotipo no IgG y cociente de cadenas ligeras libres anormal; la cifra de hemoglobina no forma parte de este modelo de estratificación específico (aunque la anemia sí es relevante para diferenciar de mieloma sintomático mediante criterios CRAB)."},{"q":"Señale la respuesta FALSA en relación con la amiloidosis cardiaca:","o":["La miocardiopatía amiloide es causada por la infiltración cardiaca por proteínas amiloidogénicas.","En la amiloidosis AA (secundaria) la afectación cardiaca se da con más frecuencia que en la amiloidosis AL.","Los hallazgos ecocardiográficos incluyen aumento del grosor de las paredes ventriculares, válvulas y tabique interauricular.","La RM cardiaca es útil para apoyar el diagnóstico, y la gammagrafía con pirofosfatos/Tc-DPD es sensible para diagnosticar la amiloidosis TTR cardiaca."],"c":"B","e":"La afectación cardiaca es, en realidad, MENOS frecuente en la amiloidosis AA (secundaria a procesos inflamatorios crónicos, que afecta predominantemente al riñón) que en la amiloidosis AL, donde el corazón es uno de los órganos diana más característicos y determinantes del pronóstico."},{"q":"¿Cuál es el mecanismo de acción del vutrisirán, un nuevo tratamiento para la amiloidosis ATTR?","o":["Inhibición de la síntesis de proteínas amiloidogénicas de forma inespecífica.","Reducción de la producción de transtiretina mediante ARN interferente.","Aumento de la excreción renal de amiloide.","Estabilización de la estructura de transtiretina."],"c":"B","e":"El vutrisirán es un fármaco basado en ARN de interferencia (siRNA) que silencia la expresión hepática del gen de la transtiretina, reduciendo su producción y, con ello, la disponibilidad de proteína disponible para formar depósitos amiloides; se diferencia así del tafamidis, que actúa por un mecanismo distinto (estabilización del tetrámero de transtiretina)."},{"q":"En el manejo de pacientes con amiloidosis ATTR, ¿cuál de los siguientes factores se considera un indicador de mal pronóstico?","o":["Presencia de neuropatía.","Elevación de los niveles de NT-proBNP.","Infiltración hepática.","Edad menor de 50 años."],"c":"B","e":"La elevación de NT-proBNP, marcador de disfunción/sobrecarga cardiaca, es un indicador de mal pronóstico bien establecido en la amiloidosis ATTR (y en la amiloidosis cardiaca en general), formando parte de los sistemas de estadificación pronóstica de la enfermedad."},{"q":"¿Cuál de los siguientes hallazgos ecocardiográficos es más característico de los pacientes con amiloidosis cardiaca?","o":["Patrón de «apical sparing» (preservación apical) en la deformación longitudinal global (strain).","Dilatación de la aurícula izquierda como hallazgo aislado y específico.","Calcificación valvular como hallazgo distintivo.","Hipertrofia asimétrica del ventrículo izquierdo como en la miocardiopatía hipertrófica."],"c":"A","e":"El patrón de «apical sparing» (strain longitudinal relativamente preservado en el ápex, con reducción marcada en los segmentos basales) en el estudio de deformación miocárdica (strain) es un hallazgo ecocardiográfico característico y de alto valor diagnóstico en la amiloidosis cardiaca, que la distingue de otras causas de hipertrofia ventricular."},{"q":"¿Qué tipo de amiloidosis tiene peor pronóstico?","o":["AL (amiloidosis primaria, de cadenas ligeras).","AF (amiloidosis familiar).","ASS (amiloidosis sistémica senil/ATTR salvaje).","AA (amiloidosis secundaria)."],"c":"A","e":"La amiloidosis AL (por depósito de cadenas ligeras monoclonales) tiene, sin tratamiento, el peor pronóstico de todos los tipos de amiloidosis sistémica, con una mediana de supervivencia históricamente muy corta en las formas con afectación cardiaca avanzada, aunque ha mejorado considerablemente con las terapias dirigidas a la célula plasmática clonal."},{"q":"Indique qué entidad NO produce una insuficiencia cardiaca de alto gasto:","o":["Fístula arteriovenosa.","Tirotoxicosis.","Amiloidosis.","Beriberi."],"c":"C","e":"La amiloidosis cardiaca produce una insuficiencia cardiaca de BAJO gasto, por infiltración restrictiva del miocardio que limita el llenado ventricular, a diferencia de la fístula arteriovenosa, la tirotoxicosis y el beriberi, que son causas clásicas de insuficiencia cardiaca de ALTO gasto por reducción de las resistencias vasculares periféricas o estados hipermetabólicos."},{"q":"El desarrollo de una erupción con edema y matiz violáceo en los párpados (eritema heliotropo) es un signo característico de:","o":["Dermatomiositis.","Síndrome de Bazex.","Amiloidosis sistémica.","Crioglobulinemia mixta esencial."],"c":"A","e":"El eritema heliotropo (coloración violácea periorbitaria con edema) es un signo cutáneo característico y prácticamente patognomónico de la dermatomiositis, junto con las pápulas de Gottron; en la amiloidosis sistémica el signo cutáneo periorbitario característico es la púrpura («ojos de mapache»), no el eritema heliotropo."},{"q":"En relación a la amiloidosis cardiaca, señale lo INCORRECTO:","o":["Más del 95% de las amiloidosis cardiacas están causadas por amiloidosis de cadenas ligeras (AL) o por transtirretina (ATTR).","La ausencia de pico monoclonal en suero no permite excluir el diagnóstico de amiloidosis AL.","Se recomienda realizar test genético a todos los pacientes con amiloidosis ATTR.","La captación grado 2 en una gammagrafía con tecnecio permite, por sí sola y sin más estudios, diagnosticar amiloidosis por TTR."],"c":"D","e":"Una captación cardiaca grado 2 en la gammagrafía con pirofosfatos/Tc-DPD es altamente sugestiva de amiloidosis TTR, pero antes de establecer el diagnóstico definitivo debe descartarse siempre una gammapatía monoclonal subyacente (mediante inmunofijación en suero/orina y cadenas ligeras libres), ya que un resultado falso positivo puede ocurrir en la amiloidosis AL; por tanto, la captación grado 2 aislada, sin descartar componente monoclonal, no permite diagnosticar por sí sola la amiloidosis TTR."},{"q":"Señale lo INCORRECTO en relación a la amiloidosis cardiaca:","o":["Su prevalencia en pacientes con insuficiencia cardiaca y FE preservada ha alcanzado el 20% en algunas series.","Puede aparecer en pacientes con FE reducida, aunque con menor frecuencia que en FE preservada.","Se asocia a la presencia de estenosis aórtica.","La aparición de insuficiencia cardiaca es un evento precoz en la historia natural de la amiloidosis cardiaca."],"c":"D","e":"La insuficiencia cardiaca clínicamente manifiesta es, en realidad, un evento TARDÍO en la historia natural de la amiloidosis cardiaca, que suele tener una fase preclínica prolongada con infiltración progresiva antes de la aparición de síntomas; el resto de afirmaciones (elevada prevalencia en IC-FEp, posibilidad de FE reducida, asociación con estenosis aórtica) son correctas."},{"q":"Señale cuál de las siguientes NO constituye un signo de alerta de amiloidosis cardiaca:","o":["Troponina persistentemente elevada.","Elevación persistente de péptidos natriuréticos.","Pared ventricular con grosor de 11 mm o más, de forma aislada y sin otros datos.","Todas las anteriores son signos de alarma de amiloidosis cardiaca."],"c":"C","e":"Un engrosamiento parietal de 11 mm de forma aislada, sin otros datos de sospecha (troponina o péptidos natriuréticos persistentemente elevados de forma desproporcionada, patrón de strain característico, disautonomía, síndrome del túnel carpiano bilateral, etc.), es un hallazgo inespecífico que por sí solo no constituye un signo de alarma suficiente, ya que puede deberse simplemente a hipertrofia por HTA u otras causas comunes."},{"q":"¿Cuál de los siguientes cuadros renales se detecta con más frecuencia en pacientes con amiloidosis?","o":["Síndrome nefrítico.","Síndrome nefrótico.","Tubulopatía aislada.","Infartos renales por infiltración microvascular."],"c":"B","e":"La afectación renal de la amiloidosis (tanto AL como AA) se manifiesta característicamente como un síndrome nefrótico, por depósito de sustancia amiloide en el glomérulo con proteinuria masiva, hipoalbuminemia e hiperlipemia secundarias."},{"q":"La afección renal más frecuente en el mieloma múltiple es:","o":["Amiloidosis renal.","Hipercalcemia.","Nefropatía por cilindros mielomatosos (riñón de mieloma).","Nefropatía por depósito de cadenas ligeras."],"c":"C","e":"La nefropatía por cilindros de cadenas ligeras (riñón de mieloma), causada por la precipitación tubular de cadenas ligeras libres filtradas en exceso, es la causa más frecuente de insuficiencia renal en el mieloma múltiple, por delante de la amiloidosis AL y la enfermedad por depósito de cadenas ligeras."},{"q":"Varón afroamericano de 65 años con sospecha de insuficiencia cardiaca por amiloidosis familiar según ecocardiografía. Antecedente familiar de insuficiencia cardiaca no sistólica en padre y hermano, fallecidos poco después de los 60 años. ¿Cuál de los siguientes planteamientos es verdadero?","o":["El trasplante de médula ósea tiene capacidad curativa.","La insuficiencia cardiaca con disminución de la función sistólica es más típica que la insuficiencia con función sistólica conservada.","La forma más común comprende una mutación en el gen de la transtiretina.","Sin intervención, la mediana de supervivencia es inferior a 2 años."],"c":"C","e":"En la población afroamericana, la forma hereditaria de amiloidosis por transtirretina (ATTRv, con la variante V122I especialmente prevalente en este grupo) es la causa más común de esta presentación familiar; la amiloidosis cardiaca produce típicamente insuficiencia cardiaca con función sistólica CONSERVADA (patrón restrictivo), no reducida, y el trasplante de médula ósea no tiene papel en la amiloidosis ATTR."},{"q":"En un paciente con amiloidosis sistémica es CIERTO que:","o":["La biopsia de grasa abdominal es diagnóstica en menos del 40% de los pacientes.","El órgano que se afecta con más frecuencia es el corazón, en el 70-80% de los casos.","La principal causa de muerte es la afectación renal.","La afectación renal se manifiesta generalmente con proteinuria en rango nefrótico, asociada a hipoalbuminemia, hipercolesterolemia e hipertrigliceridemia secundarias."],"c":"D","e":"La afectación renal amiloide se manifiesta típicamente como un síndrome nefrótico completo (proteinuria masiva con hipoalbuminemia e hiperlipemia secundaria); la biopsia de grasa abdominal tiene, de hecho, una rentabilidad diagnóstica bastante superior al 40% descrito, y aunque el corazón se afecta con frecuencia, la principal causa de muerte en la amiloidosis sistémica suele ser la afectación CARDIACA (arritmias, insuficiencia cardiaca), no la renal."}]},"57":{"title":"Alteraciones de la hemostasia. Tratamiento anticoagulante y fibrinolítico. Tratamiento transfusional.","questions":[{"q":"Según la guía CHEST, en pacientes con trombosis venosa profunda (TVP) DISTAL aislada de la pierna:","o":["No es necesario anticoagular si no hay progresión ecográfica del trombo mediante ecografías seriadas durante dos semanas.","Se prefiere anticoagular de entrada en pacientes poco sintomáticos, sobre las ecografías seriadas.","En caso de anticoagular, se debe hacer con una pauta más larga que para la TVP proximal.","La vena poplítea suele estar implicada en la TVP distal."],"c":"A","e":"En la TVP distal aislada de bajo riesgo (sin síntomas graves, sin factores de riesgo de extensión), la guía CHEST permite una estrategia de vigilancia con ecografías seriadas durante 2 semanas en lugar de anticoagulación inmediata, iniciando el tratamiento solo si se documenta progresión del trombo; la vena poplítea, por definición, corresponde al territorio PROXIMAL, no distal."},{"q":"Paciente en tratamiento con acenocumarol por fibrilación auricular permanente, de 81 años, hipertenso y diabético, con función renal y hepática normales. Presenta controles de INR muy erráticos, con tiempo en rango terapéutico bajo. ¿Cuál es una buena opción terapéutica?","o":["Cambiar a AAS.","Cambiar a heparina de bajo peso molecular.","Cambiar a un anticoagulante de acción directa.","Suspender la anticoagulación."],"c":"C","e":"Ante un mal control crónico del INR con antivitamina K (bajo tiempo en rango terapéutico), la recomendación es cambiar a un anticoagulante de acción directa, que no precisa monitorización rutinaria y ofrece un perfil de eficacia/seguridad al menos comparable; el AAS no es una alternativa adecuada para la prevención de ictus en FA con indicación de anticoagulación, y no hay motivo para suspender la anticoagulación en un paciente que la sigue necesitando."},{"q":"Señale la respuesta FALSA en relación con el tratamiento de la enfermedad tromboembólica venosa:","o":["El tratamiento trombolítico está indicado en pacientes con shock secundario a embolismo pulmonar masivo, si no hay contraindicaciones.","El tratamiento del embolismo pulmonar con heparina parenteral se solapa con el inicio de un antagonista de vitamina K durante un mínimo de 4-5 días.","La duración del tratamiento anticoagulante debe cubrir al menos 3 meses.","Los anticoagulantes orales de acción directa están contraindicados en el tratamiento de la enfermedad tromboembólica venosa."],"c":"D","e":"Los anticoagulantes orales de acción directa (dabigatrán, rivaroxabán, edoxabán, apixabán) NO están contraindicados en el tratamiento de la ETV; de hecho, son en la actualidad tratamiento de primera línea en la mayoría de los pacientes, por su comodidad y perfil de seguridad favorable frente a los antagonistas de la vitamina K."},{"q":"En la transfusión de concentrado de hematíes en pacientes con hemorragia digestiva, indique la respuesta INCORRECTA:","o":["En hemorragia masiva y shock se recomienda administrar concentrado de hematíes y cristaloides conjuntamente.","En pacientes estables se recomienda transfundir con niveles de hemoglobina inferiores a 8 g/dl.","En pacientes estables con patología cardiovascular o respiratoria se recomienda transfundir con niveles de hemoglobina menores de 9 g/dl.","Los valores iniciales de hemoglobina pueden no reflejar adecuadamente la intensidad de la pérdida hemática."],"c":"B","e":"La estrategia transfusional restrictiva actualmente recomendada fija el umbral en Hb \\<7 g/dl en pacientes estables sin comorbilidad cardiovascular significativa, no \\<8 g/dl; en cardiópatas o pacientes con patología respiratoria se admite un umbral algo más alto (en torno a 8-9 g/dl)."},{"q":"En la hemorragia asociada al uso de inhibidores del factor Xa, ¿cuál de estas afirmaciones es FALSA?","o":["La dosis de andexanet depende del tiempo transcurrido desde la última dosis de anticoagulante.","La diálisis es de utilidad para eliminar el inhibidor del factor Xa.","Está indicada la administración de ácido tranexámico.","El uso de andexanet lleva consigo riesgo de trombosis."],"c":"B","e":"Los inhibidores del factor Xa (rivaroxabán, apixabán, edoxabán) tienen una alta unión a proteínas plasmáticas, por lo que la diálisis NO es útil para eliminarlos de la circulación, a diferencia de dabigatrán (inhibidor directo de la trombina, con baja unión a proteínas), que sí es dializable."},{"q":"Mujer de 35 años con IMC 40, en tratamiento con anticonceptivos orales, con cefalea intensa de nueva aparición que empeora con Valsalva, y vómitos. TAC basal normal. Ante la sospecha de trombosis venosa cerebral, señale la correcta:","o":["Un nivel elevado de dímero D respalda el diagnóstico.","Un dímero D normal excluye el diagnóstico.","La punción lumbar está contraindicada.","La presencia de un infarto hemorrágico contraindica el tratamiento anticoagulante."],"c":"A","e":"Un dímero D elevado apoya la sospecha de trombosis venosa cerebral en un contexto clínico compatible (mujer obesa, en tratamiento con anticonceptivos, cefalea con características de hipertensión intracraneal); sin embargo, el dímero D puede ser NORMAL hasta en un porcentaje relevante de trombosis venosas cerebrales confirmadas, por lo que un resultado normal NO la excluye. La punción lumbar no está contraindicada de entrada, y la anticoagulación sigue siendo el tratamiento de elección de la trombosis venosa cerebral incluso en presencia de infarto hemorrágico asociado."},{"q":"Varón de 63 años con historia de epigastralgia severa de larga evolución que presenta fibrilación auricular. ¿Cuál de estos anticoagulantes tiene mayor probabilidad de ser mal tolerado?","o":["Dabigatrán.","Rivaroxabán.","Edoxabán.","Apixabán."],"c":"A","e":"El dabigatrán se asocia con mayor frecuencia a dispepsia y molestias gastrointestinales altas como efecto adverso característico, por lo que en un paciente con antecedente de epigastralgia importante sería el anticoagulante con mayor probabilidad de mala tolerancia digestiva entre las opciones."},{"q":"Paciente de 85 años traído por debilidad generalizada, gingivorragia y artralgias en rodillas. Delgadez extrema, petequias y equimosis cutáneas. Dieta con escaso consumo de frutas y verduras. Leucocitos, plaquetas y tiempo de protrombina normales. ¿Qué déficit vitamínico es más probable?","o":["Deficiencia de tiamina.","Deficiencia de vitamina C.","Deficiencia de vitamina A.","Deficiencia de vitamina K."],"c":"B","e":"El escorbuto (déficit de vitamina C) produce fragilidad capilar con gingivorragia, petequias, equimosis y artralgias/hemartros por defecto en la síntesis de colágeno, típicamente con parámetros de coagulación estándar NORMALES, en el contexto de una dieta pobre en frutas y verduras."},{"q":"Paciente de 54 años con cirrosis por VHC Child C, que presenta una trombosis venosa profunda proximal en miembro inferior izquierdo. ¿Qué anticoagulante le indicaría?","o":["Acenocumarol.","Dabigatrán.","Apixabán.","Rivaroxabán."],"c":"A","e":"En la cirrosis hepática avanzada (Child C), los anticoagulantes de acción directa carecen de datos de seguridad y eficacia bien establecidos, por lo que el antagonista de la vitamina K monitorizado sigue siendo la opción más segura y validada en este contexto."},{"q":"En relación al tratamiento anticoagulante inicial de un paciente con embolismo pulmonar agudo, ¿cuál de las siguientes afirmaciones NO es correcta?","o":["Si el paciente va a ser tratado con edoxabán, no necesitará tratamiento previo con heparina de bajo peso molecular.","Si va a ser tratado con antivitamina K, el inicio debe solaparse con heparina de bajo peso molecular un mínimo de 5 días y hasta INR terapéutico durante 24 horas.","Si el paciente va a ser tratado inicialmente con apixabán, será necesario administrar doble dosis durante una semana y después continuar con la dosis habitual.","Si el paciente va a ser tratado con dabigatrán, deberá recibir tratamiento previo con heparina de bajo peso molecular durante un mínimo de 5 días."],"c":"A","e":"El edoxabán, al igual que el dabigatrán, requiere un periodo inicial de anticoagulación parenteral (heparina de bajo peso molecular) de al menos 5 días antes de iniciar el fármaco oral, a diferencia de rivaroxabán y apixabán, que se administran de entrada con una fase inicial de dosis más alta sin necesidad de heparina previa."},{"q":"En el estudio de hemostasia de un paciente se observa prolongación del tiempo de protrombina, del TTPA y del tiempo de trombina. Tras añadir plasma fresco (prueba de mezclas), no se corrige ninguno de estos tiempos. ¿Cuál es la posibilidad más probable?","o":["Deficiencia de factores de la fase de contacto.","Hemofilia.","Coagulación intravascular diseminada.","Presencia de inhibidores."],"c":"D","e":"La falta de corrección de los tiempos alargados tras añadir plasma normal indica la presencia de un INHIBIDOR (anticuerpo que neutraliza uno o varios factores), a diferencia de un simple déficit factorial (hemofilia, deficiencia de fase de contacto), que sí corregiría con la prueba de mezclas."},{"q":"Anciano de 75 años con TVP de pantorrilla izquierda que se extiende a la región poplítea, tras un viaje de 10 horas en coche. Fumador de larga evolución. Exploración normal, heces negativas para sangre oculta. Hemograma y coagulación normales. ¿Qué debe incluirse en la evaluación de este paciente?","o":["Exploración física completa y radiografía de tórax posteroanterior y lateral.","Exploración física completa, Rx de tórax y RM de tórax y abdomen de forma sistemática.","Exploración física completa, Rx de tórax y endoscopia digestiva baja sistemática.","Exploración física completa y determinación sistemática del antígeno carcinoembrionario."],"c":"A","e":"La evidencia actual no respalda un cribado exhaustivo y sistemático de neoplasia oculta en pacientes con TVP no provocada, ya que no ha demostrado mejorar la supervivencia; se recomienda un cribado básico (anamnesis, exploración física completa, analítica general y una radiografía de tórax), reservando estudios más dirigidos ante datos clínicos de sospecha."},{"q":"En la fibrilación auricular (FA), señale la respuesta INCORRECTA:","o":["El riesgo de ictus embolígeno es similar en la FA paroxística que en la FA crónica.","La anticoagulación crónica en la FA «aislada» está indicada preferentemente en pacientes jóvenes (\\<60 años) sin factores de riesgo.","La amiodarona es más efectiva en prevenir recaídas y mantener el ritmo sinusal que los fármacos de clase IA y IC.","En el tratamiento crónico, la digoxina habitualmente es insuficiente para el control de la frecuencia durante el ejercicio."],"c":"B","e":"En la FA «aislada» de pacientes jóvenes sin cardiopatía estructural ni otros factores de riesgo, el riesgo tromboembólico es bajo, por lo que la anticoagulación crónica NO está indicada preferentemente en este grupo; el riesgo de ictus es similar entre las distintas formas clínicas de FA para un mismo perfil de riesgo."},{"q":"¿Cuál de los siguientes estudios de la coagulación se encontraría alterado en un paciente con sospecha de trastorno hemorrágico hereditario por deficiencia del factor VII?","o":["Tiempo de tromboplastina parcial activado.","Tiempo de trombina.","Tiempo de protrombina.","Determinación de factor von Willebrand."],"c":"C","e":"El factor VII forma parte de la vía EXTRÍNSECA de la coagulación, que es la que evalúa el tiempo de protrombina (TP/INR); su déficit no altera el TTPA (vía intrínseca) ni el tiempo de trombina (vía común)."},{"q":"Hombre de 60 años con leucocitos 10.000/µl con desviación izquierda, Hb 11 g/dl y plaquetas 1.870.000/µl con importante anisotrombia. Esplenomegalia moderada. Reordenamiento del gen BCR/ABL positivo, sin mutación de JAK2. ¿Cuál es el diagnóstico correcto?","o":["Trombocitemia esencial.","Leucemia mieloide crónica.","Mielofibrosis en fase prefibrótica.","Leucemia aguda megacarioblástica."],"c":"B","e":"La presencia del reordenamiento BCR/ABL (cromosoma Filadelfia) es el marcador diagnóstico definitorio de la leucemia mieloide crónica, que puede presentarse con trombocitosis marcada además de la leucocitosis con desviación izquierda y esplenomegalia; la ausencia de mutación de JAK2 y la positividad de BCR/ABL descartan las neoplasias mieloproliferativas JAK2-dependientes."},{"q":"Varón de 75 años con prótesis valvular mecánica mitral, anticoagulado con acenocumarol, que presenta un INR de 9 en un control rutinario, sin síntomas de sangrado. ¿Cuál es la actitud más correcta?","o":["Suspender el acenocumarol y administrar 10 mg de vitamina K intravenosa lenta, repitiendo cada 12 horas si es necesario.","Suspender el acenocumarol y remitir a un centro hospitalario para vigilar la aparición de sangrado.","Suspender temporalmente el acenocumarol y reanudar la anticoagulación cuando se alcance el rango terapéutico, recalculando la dosis.","Iniciar concentrado de complejo protrombínico o plasma fresco congelado según el peso."],"c":"C","e":"En un INR muy elevado sin sangrado activo, la actitud recomendada es suspender temporalmente el fármaco y reanudar la anticoagulación con dosis ajustada una vez el INR retorne al rango terapéutico, evitando medidas más agresivas reservadas para el sangrado activo o el riesgo hemorrágico inminente."},{"q":"Varón de 19 años, asintomático, con trombopenia (plaquetas 43x10⁹/l) hallada en analítica preoperatoria, con hemoglobina y leucocitos normales. ¿Qué actuación debe realizarse en primer lugar?","o":["Iniciar tratamiento con prednisona oral.","Realizar biopsia de médula ósea para valorar el origen central o periférico de la trombopenia.","Realizar un examen morfológico del frotis sanguíneo para descartar agregados plaquetarios inducidos por el anticoagulante.","Transfundir un concentrado de plaquetas para evitar un problema hemorrágico."],"c":"C","e":"Ante una trombocitopenia aislada, asintomática y detectada de forma incidental, el primer paso obligado es descartar una pseudotrombocitopenia por agregación plaquetaria inducida por el anticoagulante EDTA del tubo de extracción, mediante el examen del frotis de sangre periférica, antes de plantear estudios invasivos o tratamientos innecesarios."},{"q":"Mujer de 45 años sin antecedentes que consulta por disnea de 4 días. Taquicardia rítmica sin soplos, auscultación pulmonar normal. Gasometría: pO2 70 mmHg, pCO2 32 mmHg. Hemograma, función renal y hepática normales. TP 90%, TTPA con ratio de 2 respecto al control (N\\<1,2). ¿Cuál es el diagnóstico más probable?","o":["Síndrome antifosfolípido.","Factor V de Leiden.","Hemofilia.","Pericarditis aguda."],"c":"A","e":"Un TTPA alargado en el contexto clínico de manifestaciones trombóticas (aquí, sospecha de tromboembolismo pulmonar por la disnea con hipoxemia e hipocapnia) es característico de la presencia de anticoagulante lúpico, un anticuerpo antifosfolípido que paradójicamente prolonga los tiempos de coagulación in vitro mientras predispone a trombosis in vivo, propio del síndrome antifosfolípido."},{"q":"En un episodio agudo de púrpura trombocitopénica idiopática con número muy bajo de plaquetas y riesgo grave de sangrado, el tratamiento de elección para elevar lo más rápidamente posible el número de plaquetas es:","o":["Gammaglobulina intravenosa.","Corticosteroides a altas dosis por vía intravenosa.","Inmunosupresores.","Esplenectomía."],"c":"A","e":"La inmunoglobulina intravenosa a altas dosis produce una elevación más rápida del recuento plaquetario que los corticoides, por lo que es el tratamiento de elección cuando se necesita un aumento urgente de plaquetas ante un riesgo hemorrágico grave, reservándose la esplenectomía y los inmunosupresores para el manejo a más largo plazo de formas refractarias."},{"q":"¿Cuál de los siguientes emparejamientos entre fármaco anticoagulante y mecanismo de acción es INCORRECTO?","o":["Heparina - cofactor de la antitrombina III.","Dabigatrán - inhibe la trombina.","Rivaroxabán - inhibe el factor Xa.","Warfarina - inhibe la absorción de la vitamina K."],"c":"D","e":"La warfarina (y el acenocumarol) no inhiben la absorción intestinal de vitamina K, sino la enzima vitamina K epóxido reductasa hepática, bloqueando así el reciclaje/activación de la vitamina K necesaria para la síntesis funcional de los factores de coagulación dependientes de ella."},{"q":"¿Cuál de las siguientes situaciones NO es una indicación de los anticoagulantes orales de acción directa?","o":["Portador de prótesis valvular aórtica mecánica.","Tratamiento del tromboembolismo pulmonar.","Profilaxis de la trombosis venosa en el postoperatorio de prótesis de rodilla.","Prevención de ictus en fibrilación auricular no valvular."],"c":"A","e":"Los anticoagulantes orales de acción directa están formalmente contraindicados en portadores de prótesis valvulares mecánicas, mientras que sí tienen indicación establecida en TEP, profilaxis tromboembólica postquirúrgica ortopédica y prevención de ictus en FA no valvular."},{"q":"En relación al tratamiento anticoagulante en los ensayos clínicos de tromboembolismo venoso asociado a cáncer, señale la respuesta VERDADERA:","o":["Edoxabán mostró mayor incidencia de hemorragias mayores que dalteparina.","Dabigatrán se asoció a mayor incidencia de hemorragias mayores que dalteparina.","Apixabán tuvo mayor incidencia de hemorragias no mayores clínicamente relevantes que dalteparina.","Rivaroxabán se asoció con una incidencia similar de recidivas tromboembólicas venosas que dalteparina."],"c":"D","e":"En los ensayos que compararon anticoagulantes orales de acción directa con dalteparina (HBPM) en el tromboembolismo venoso asociado a cáncer, rivaroxabán mostró tasas de recurrencia trombótica similares a las de dalteparina, sin diferencias significativas en eficacia global."},{"q":"Todos los medicamentos utilizados en el tratamiento inmediato del infarto de miocardio con elevación del ST concuerdan con su mecanismo de acción, EXCEPTO:","o":["Abciximab - inhibición del receptor de la glucoproteína IIb/IIIa.","Antagonistas beta-adrenérgicos - disminución del consumo de oxígeno miocárdico.","Clopidogrel - inhibición del receptor de ADP plaquetario.","Nitroglicerina - disminución de la poscarga cardiaca."],"c":"D","e":"La nitroglicerina actúa fundamentalmente reduciendo la PRECARGA (por venodilatación, con disminución del retorno venoso), no principalmente la poscarga; el resto de emparejamientos son correctos."},{"q":"Varón de 67 años con antecedente de disfunción eréctil en tratamiento con tadalafilo, que acude por dolor torácico con elevación de troponina y descenso del ST en cara inferolateral. ¿Cuál de los siguientes fármacos NO le parece adecuado?","o":["Clopidogrel.","Heparina.","Metoprolol.","Nitroglicerina sublingual."],"c":"D","e":"La nitroglicerina está formalmente contraindicada en pacientes que han tomado inhibidores de la fosfodiesterasa-5 (como el tadalafilo) recientemente, por el riesgo de hipotensión grave y potencialmente mortal debido a la vasodilatación sinérgica de ambos fármacos; el resto del tratamiento antitrombótico estándar del SCA es adecuado."},{"q":"En pacientes con fibrilación auricular y SCASEST, señale la afirmación INCORRECTA según las últimas guías europeas:","o":["Se recomienda tratamiento triple una semana y después tratamiento doble (antiagregación con clopidogrel + anticoagulación con ACOD) durante un año.","Se recomienda utilizar anticoagulantes de acción directa frente a antivitamina K.","Transcurrido un año del intervencionismo coronario, se recomienda continuar con solo un anticoagulante y suspender la antiagregación.","En alto riesgo de sangrado se considera acortar el tratamiento doble a tres meses, y en alto riesgo isquémico el triple se prolongaría 3 meses."],"c":"D","e":"Las guías recomiendan, en caso de alto riesgo isquémico, prolongar el tratamiento TRIPLE hasta un mes (no tres), individualizando después a doble terapia; la formulación de esta opción confunde los plazos recomendados, siendo la incorrecta entre las cuatro."},{"q":"Mujer sana de 22 años con parto vaginal eutócico a término. Un día después presenta alteraciones visuales y cefalea intensa; dos horas más tarde no responde, con hipotensión intensa (TA 68/28), FC 148 lpm. Glucemia 49 mg/dl. ¿Cuál de los siguientes fármacos es más probable que revierta la hipotensión?","o":["Transfusión de hematíes.","Hidrocortisona.","Piperacilina/tazobactam.","Tiroxina (T4)."],"c":"B","e":"El cuadro (hemorragia posparto con hipotensión que evoluciona a shock, hipoglucemia y alteración de consciencia) es sugestivo de necrosis hipofisaria posparto (síndrome de Sheehan) con insuficiencia suprarrenal aguda secundaria; la hidrocortisona es el tratamiento que puede revertir la hipotensión refractaria propia de la crisis suprarrenal."},{"q":"Paciente con politraumatismo grave, rotura esplénica intervenida y múltiples transfusiones, que desarrolla insuficiencia respiratoria aguda postoperatoria refractaria a oxigenoterapia. ¿Cuál es la causa principal a plantear?","o":["Hemorragia grave.","Depresión respiratoria por fármacos anestésicos.","Síndrome de distrés respiratorio agudo.","Broncoespasmo grave."],"c":"C","e":"El contexto de politraumatismo, transfusión masiva e insuficiencia respiratoria hipoxémica refractaria a oxígeno en el postoperatorio inmediato es muy característico del SDRA, por lesión pulmonar aguda secundaria al trauma, la transfusión masiva (TRALI/TACO) o la respuesta inflamatoria sistémica."},{"q":"¿Qué estudio serológico solicitará a una paciente con lupus eritematoso sistémico que presenta trombocitopenia y fenómenos trombóticos?","o":["Anticuerpos anti-Sm.","Anticuerpos anti-Ro y anti-La.","Anticuerpos antifosfolípido.","Estudio de la cinética plaquetaria."],"c":"C","e":"La combinación de trombocitopenia y fenómenos trombóticos en una paciente con LES obliga a descartar un síndrome antifosfolípido secundario asociado, mediante la determinación de anticuerpos antifosfolípido (anticoagulante lúpico, anticardiolipina, anti-beta2-glicoproteína I), que explicarían ambas manifestaciones."},{"q":"Con respecto al síndrome de TRALI (lesión pulmonar aguda relacionada con la transfusión), indique la respuesta FALSA:","o":["Se debe a anticuerpos antineutrófilos presentes en el producto hemoderivado.","Se manifiesta con disnea súbita, hipoxemia e infiltrados pulmonares durante la transfusión o en las 6 horas siguientes.","Debe distinguirse de la sobrecarga volumétrica asociada a la transfusión.","El tratamiento consiste en la administración de corticoides."],"c":"D","e":"El TRALI se maneja fundamentalmente con medidas de SOPORTE respiratorio y suspensión inmediata de la transfusión; los corticoides no han demostrado un beneficio establecido y no constituyen el tratamiento específico del cuadro."},{"q":"¿En cuál de los siguientes supuestos está indicado el cierre percutáneo de la orejuela izquierda en pacientes con fibrilación auricular para prevenir el ictus isquémico y la tromboembolia?","o":["Cuando existen contraindicaciones para el tratamiento anticoagulante a largo plazo.","Cuando el paciente se va a someter a un reemplazo valvular aórtico mediante TAVI.","Cuando existen recurrencias de ictus isquémico o embolias a pesar de recibir anticoagulación correcta.","Las respuestas «a» y «c» son correctas."],"c":"D","e":"El cierre percutáneo de la orejuela izquierda está indicado fundamentalmente en pacientes con contraindicación formal para la anticoagulación oral a largo plazo, y también se considera en pacientes que recurren con eventos tromboembólicos pese a una anticoagulación correctamente pautada; el implante de TAVI, por sí solo, no constituye indicación de cierre de orejuela."}]},"990":{"title":"Miscelánea reumatológica e inmunológica (banco Harrison)","questions":[{"q":"Se valoró a una mujer de 60 años con obesidad y artrosis bilateral de rodilla. Ella refiere dolor la mayor parte de los días y dolor limitante al menos dos días a la semana. Ha intentado modificar la actividad (caminar menos) sin éxito. Todos los siguientes tratamientos han demostrado ser eficaces para los síntomas de la osteoartrosis en este paciente EXCEPTO:","o":["Paracetamol","Inyecciones intraarticulares de glucocorticoides","Glucosamina-condroitina","Naproxeno","Artroplastia total"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 371) Las guías recientes recomiendan no usar glucosamina o condroitina para la osteoartrosis (OA). Grandes estudios clínicos con apoyo público no han demostrado que, en comparación con el placebo, estos compuestos alivien el dolor en personas con enfermedad. Las inyecciones de glucocorticoides son eficaces en la osteoartrosis, pero la respuesta es variable, ya que algunos pacientes tienen poco alivio del dolor, mientras que otros experimentan alivio del dolor que dura varios meses. Las inyecciones de glucocorticoides son útiles para que los pacientes superen los brotes agudos de dolor y pueden estar indicadas si el paciente presenta osteoartrosis con enfermedad por depósito de cristales, en especial los cristales de dihidrato de pirofosfato cálcico. El paracetamol es el analgésico inicial preferido para los pacientes con osteoartrosis en rodillas, caderas o manos. Para algunos pacientes, es adecuado para controlar los síntomas, en cuyo caso se pueden evitar más fármacos tóxicos como los fármacos antiinflamatorios no esteroideos (NSAID). Se pueden usar dosis de hasta 1 g cada 8 h. Los NSAID son los fármacos más utilizados en el tratamiento del dolor de la osteoartrosis. Se pueden administrar por vía tópica u oral. En los estudios clínicos, se encontró que los NSAID por VO produjeron mejora del dolor cercana a 30% mayor que las dosis altas de paracetamol. Por último, cuando en el paciente con osteoartrosis de rodilla o cadera han fallado las modalidades del tratamiento médico y permanece con dolor, con limitaciones de la función física que comprometen la calidad de vida, el paciente debe ser referido para una artroplastia total de rodilla o cadera. Se trata de operaciones muy eficaces que alivian el dolor y mejoran la función en la mayor parte de los pacientes, aunque las tasas de éxito son más altas para el reemplazo de cadera que para la rodilla.","letters":["A","B","C","D","E"]},{"q":"Un estudiante universitario de 19 años acudió a la clínica universitaria refiriendo lesiones cutáneas en la axila que producen dolor espontáneo y a la palpación (fig. VIII--7). Informó que ha tenido episodios similares a lo largo de su vida por los que recibe antibióticos. Tiene una copia impresa de los resultados de los exámenes de laboratorio de su último episodio en los que se reportó un cultivo positivo para Serratia marcescens. Todas las siguientes afirmaciones sobre este paciente y su probable diagnóstico son ciertas EXCEPTO:","o":["El trasplante de células madre humanas es curativo.","Las infecciones por microorganismos negativos a la catalasa son típicas.","El uso profiláctico de trimetoprim/sulfametoxazol es eficaz para reducir el riesgo de infecciones bacterianas.","La enfermedad es causada por la producción defectuosa de moléculas reactivas de oxígeno en los fagolisosomas.","Lo más probable es que la enfermedad se transmita por un patrón de herencia recesiva ligada al cromosoma X."],"c":"B","e":"La respuesta es B. (Parte 12 Endocrinología y metabolismo, Sección 2 Endocrinología, cap. 381) Este paciente tiene foliculitis axilar, una infección de los folículos pilosos. Con base en sus antecedentes, incluidas las infecciones recurrentes con un microorganismo catalasa positivo, Serratia marcescens, lo más probable es que tenga enfermedad granulomatosa crónica (CGD, chronic granulomatous disease). Los CGD se caracterizan por la alteración de la destrucción fagocítica de microorganismos por neutrófilos y macrófagos. Casi 70% de los casos están asociados a trastornos hereditarios recesivos ligados al cromosoma X en comparación con la herencia autosómica recesiva en el 30% restante de los casos. Las CGD causan abscesos bacterianos y micóticos profundos en los tejidos en órganos ricos en macrófagos como la piel, ganglios linfáticos, hígado y pulmones. Las infecciones cutáneas recurrentes, como la foliculitis, son frecuentes y pueden provocar un diagnóstico precoz de la CGD. Los agentes infecciosos suelen ser bacterias catalasa positivas (como Staphylococcus aureus y Staphylococcus marcescens), pero también incluyen Burkholderia cepacia, micobacterias patógenas (en ciertas regiones del mundo) y hongos (principalmente mohos filamentosos, como Aspergillus). La CGD es causada por la producción defectuosa de moléculas reactivas de oxígeno (ROS, reactive oxygen species) en la membrana del fagolisosoma tras la fagocitosis de microorganismos. El diagnóstico de la CGD se basa en análisis de producción de moléculas reactivas de oxígeno en neutrófilos y monocitos, como los análisis de fluorescencia de dihidrorrodamina o nitroazul de tetrazolio. La CGD es una enfermedad granulomatosa con granulomas ricos en macrófagos en el hígado, bazo y otros órganos. Se trata de granulomas estériles que causan enfermedad obstructiva (vejiga, píloro, etc.) o inflamación (colitis, neumopatía restrictiva). El tratamiento de las infecciones bacterianas generalmente se basa en el tratamiento combinado con antibióticos que pueden penetrar en las células. El tratamiento de las infecciones micóticas requiere un uso intensivo y prolongado de antimicóticos. Las lesiones inflamatorias/granulomatosas suelen ser sensibles a los esteroides; sin embargo, los glucocorticoides a menudo contribuyen a la propagación de infecciones. El tratamiento de la CGD se basa principalmente en la prevención de infecciones. Se ha demostrado inequívocamente que el uso profiláctico de trimetoprim/sulfametoxazol es bien tolerado y muy eficaz para reducir el riesgo de infección bacteriana. La administración diaria de derivados azólicos (en especial itraconazol) también reduce la frecuencia de complicaciones micóticas. El trasplante de células madre humanas es un método curativo establecido para las CGD; sin embargo, la relación riesgo-beneficio debe valorarse cuidadosamente en forma individual. También se están valorando los métodos de genoterapia.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 32 años fue atendida en la clínica por dolor en la rodilla izquierda. Le gusta correr largas distancia y actualmente está entrenando para un maratón. Corre un promedio de 45 a 60 km por semana. Actualmente experimenta un dolor en la cara lateral de la rodilla izquierda. Hay una sensación urente que también continúa por la cara lateral del muslo. La paciente negó haber sufrido lesiones en su rodilla, y no ha percibido aumento de la temperatura o hinchazón. Por lo demás, está sana y no toma otras sustancias, excepto productos herbolarios. La exploración física de la rodilla revela dolor puntual a la palpación sobre el cóndilo femoral externo que empeora con la flexión de la rodilla. Se le pidió a la paciente que se acueste sobre su lado derecho con la rodilla recta y la cadera flexionada a 90 grados. Su pierna izquierda se extiende por la cadera y se coloca lentamente en aducción detrás de la extremidad inferior; con esta maniobra se reprodujo el dolor de rodilla izquierda del paciente. Se pueden recomendar todos los siguientes tratamientos para esta paciente EXCEPTO:","o":["Revisión del calzado deportivo de la paciente para garantizar un ajuste adecuado","Inyección de glucocorticoides para no interferir con la preparación continua del paciente para el próximo maratón","Ibuprofeno 600 a 800 mg cada 6 h según sea necesario para el dolor","Envío a fisioterapia","Referencia para liberación quirúrgica si fracasa el tratamiento conservador"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 375) Este paciente presenta inflamación de la banda iliotibial. La banda iliotibial es tejido conjuntivo grueso que se extiende a lo largo de la parte externa del muslo desde el hueso iliaco hasta el peroné. Cuando esta banda se inflama o se tensa, el dolor ocurre con mayor frecuencia cuando la banda pasa por encima del cóndilo femoral externo de la rodilla, lo que provoca un dolor urente o dolor en esta zona que puede irradiarse hacia la parte externa del muslo. Esta lesión por uso excesivo se observa con mayor frecuencia en corredores y puede ser causada por zapatos mal ajustados, correr en superficies irregulares y correr excesivamente. También es más común en personas con una alineación de la rodilla en varo (piernas arqueadas). El tratamiento del síndrome de la banda iliotibial incluye reposo, fármacos antiinflamatorios no esteroideos, fisioterapia y tratamiento de factores de riesgo como zapatos mal ajustados o superficies irregulares para correr. La inyección de glucocorticoides en el cóndilo femoral externo puede aliviar el dolor, pero debe evitarse correr estrictamente durante las dos semanas siguientes a la inyección. En casos resistentes al tratamiento, puede ser beneficiosa la liberación quirúrgica de la banda iliotibial.","letters":["A","B","C","D","E"]},{"q":"Una inmigrante de 19 años, originaria de Etiopía acude a consulta con su médico familiar. En ese momento se refiere asintomática. Entre sus antecedentes de importancia se encuentra hospitalización reciente por fibrilación auricular de aparición reciente. Cuando era niña en Etiopía, desarrolló una enfermedad que le causó movimiento incontrolado de las extremidades y la lengua que duró aproximadamente un mes. También ha tenido tres episodios de artritis migratoria de articulaciones grandes durante su adolescencia que se resolvieron con fármacos. Actualmente toma metoprolol y warfarina y no tiene alergias a medicamentos conocidos. La exploración física revela latidos cardiacos irregularmente irregulares con presión arterial normal. Su punto choque de punta es más prominente en la línea mesoclavicular y es de intensidad normal. En el vértice cardiaco se ausculta un retumbo diastólico temprano y un soplo holosistólico 3/6. También se escucha un soplo diastólico temprano suave en el tercer espacio intercostal izquierdo. La paciente fue referida con un cardiólogo para que valorara el reemplazo valvular y la realización de ecocardiografía. ¿Qué otra intervención se podría considerar en ese momento?","o":["Ácido acetilsalicílico diario","Doxiciclina diaria","Corticosteroides en dosis bajas","Inyecciones mensuales de penicilina G","Inyecciones de penicilina G según sea necesario para la faringodinia"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 359) Este paciente tiene antecedentes que sugieren episodios recurrentes de fiebre reumática aguda con evidencia en la exploración física de insuficiencia mitral, estenosis mitral e insuficiencia aórtica. Esto y la presencia de fibrilación auricular sugieren cardiopatía reumática grave. Los factores de riesgo de esta afección incluyen la pobreza y el hacinamiento. Como resultado, la fiebre reumática aguda es considerablemente más común en países en vías de desarrollo. El ácido acetilsalicílico diario es el tratamiento de elección para la artritis migratoria de las articulaciones grandes y la fiebre, que son manifestaciones comunes de la fiebre reumática aguda. Los médicos a veces usan esteroides durante episodios agudos de carditis para disminuir la inflamación, aunque esta sigue siendo una práctica controvertida y no es de utilidad en episodios de fiebre reumática aguda. La profilaxis secundaria con penicilina diaria por VO o, de preferencia con inyecciones IM mensuales se considera el mejor método para evitar nuevos episodios de fiebre reumática aguda y por lo tanto, para prevenir un mayor daño valvular. La profilaxis primaria con penicilina según sea necesario es igualmente eficaz para prevenir nuevos episodios de carditis. Sin embargo, la mayor parte de los episodios de faringodina son demasiado leves para que los pacientes se los mencionen al médico. Por lo tanto, la profilaxis secundaria se considera preferible en pacientes que ya tienen enfermedad valvular grave. La doxiciclina no es un fármaco de primera línea para el estreptococo del grupo A, el patógeno que incita a la fiebre reumática aguda.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 35 años originaria del estado de Virginia se presentó en la clínica con estornudos, rinorrea y prurito nasal, que recurre cada año desde que era adolescente, que suele iniciar a partir de marzo y aumenta durante abril y mayo. Con base en la anamnesis, tiene un riesgo elevado de tener todas las siguientes afecciones adicionales EXCEPTO:","o":["Asma","Sinusitis crónica bilateral","Alergias alimentarias","Psoriasis","Urticaria"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 352) Esta paciente tiene antecedentes compatibles con rinitis alérgica. La rinorrea episódica, los estornudos, la obstrucción nasal con epífora y el prurito de la conjuntiva, mucosa nasal y orofaringe son las características distintivas de la rinitis alérgica. La rinitis alérgica se presenta generalmente en personas con atopia, a menudo en asociación con dermatitis atópica, alergia alimentaria, urticaria o asma. Hasta 50% de los pacientes con rinitis alérgica manifiesta asma, mientras que entre 70% y 80% de las personas con asma y 80% de las personas con sinusitis crónica bilateral experimentan rinitis alérgica. El sexo femenino, la exposición a partículas contaminantes en el aire y el tabaquismo materno aumentan el riesgo de desarrollar rinitis alérgica a lo largo de la vida. La psoriasis es una enfermedad cutánea autoinmunitaria que no se asocia con antecedentes de atopias o rinitis alérgica.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes afecciones es la causa más frecuente de enfermedad neuropática de las articulaciones (artropatía de Charcot)?","o":["Amiloidosis","Indiferencia congénita al dolor","Diabetes mellitus","Siringomielia","Tabes dorsal"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 374) La enfermedad neuropática articular (artropatía de Charcot) es una artritis destructiva progresiva asociada con pérdida de la sensibilidad al dolor, la propiocepción o ambas. Se ven afectados los reflejos musculares normales que modulan el movimiento articular. Sin estos mecanismos de protección, las articulaciones se someten a traumatismos repetidos, lo que produce daños progresivos en los cartílagos y los huesos. En la actualidad, la diabetes mellitus es la causa más frecuente de enfermedad neuropática articular (cuadro VIII--87). Diversos trastornos están asociados con la artritis neuropática, como tabes dorsal, lepra, frambesía, siringomielia, mielomeningocele, indiferencia congénita al dolor, atrofia de los músculos peroneos (enfermedad de Charcot-Marie-Tooth) y amiloidosis. Se ha notificado una artritis parecida a una enfermedad articular neuropática en pacientes que han recibido inyecciones de glucocorticoides intraarticulares, pero esta es una complicación poco frecuente y no se ha observado en una serie de pacientes con artrosis de rodilla que recibieron inyecciones de glucocorticoides intraarticulares cada tres meses durante dos años. La distribución de la afectación articular depende del trastorno neurológico subyacente. En la tabes dorsal, las rodillas, las caderas y los tobillos son los más afectados; en la siringomielia, la articulación glenohumeral, el codo y la muñeca; y en la diabetes mellitus, las articulaciones del tarso y tarsometatarsianas. CUADRO VIII--87Trastornos relacionados con enfermedad articular neuropática ----------------------------------------------------------------------- **Diabetes mellitus** **Amiloidosis** ----------------------------------- ----------------------------------- Tabes dorsal Lepra Mielomeningocele Indiferencia congénita al dolor Siringomielia Atrofia de los músculos peroneos -----------------------------------------------------------------------","letters":["A","B","C","D","E"]},{"q":"Un varón de 27 años fue valorado en el consultorio de su médico familiar por artritis dolorosa que involucra la rodilla derecha asociada con hinchazón bilateral difusa de los dedos. Por lo demás está sano, pero recuerda un episodio de enfermedad diarreica intensa hace casi tres a cuatro semanas, que se resolvió espontáneamente. Trabaja como supervisor de una guardería y mencionó que muchos de los niños tenían una enfermedad diarreica similar. No toma medicamentos e informó que consume marihuana con poca frecuencia. En el interrogatorio por aparatos y sistemas refiere disuria. La exploración física muestra artritis inflamatoria de la rodilla derecha, dactilitis y la exploración genitourinaria normal. Se le diagnosticó artritis reactiva. ¿Cuál de los siguientes fue el agente causal más probable de la diarrea?","o":["Campylobacter jejuni","Clostridium difficile","Escherichia coli","Helicobacter pylori","Shigella flexneri"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 362) La artritis reactiva se refiere a una artritis aguda no purulenta que se produce después de una infección en otra parte del cuerpo. La artritis reactiva, que a menudo se presenta con artritis inflamatoria de las articulaciones inferiores que ocurre entre una y cuatro semanas después de un episodio diarreico, también puede incluir uveítis o conjuntivitis, dactilitis, lesiones urogenitales y lesiones mucocutáneas características como queratodermia blenorrágica. Los microorganismos más comunes asociados con artritis reactiva son bacterias del género Shigella, aunque se han descrito Yersinia, Chlamydia y, en menor medida, Salmonella y Campylobacter. Aunque es más común en niños que residen en países en vías de desarrollo, se producen más de 400 000 casos anuales de infecciones por Shigella sp. en Estados Unidos. Estas infecciones se presentan más a menudo en niños de cuatro a 11 años de edad. La mayor parte de los casos en Estados Unidos se deben a Shigella sonnei, siendo S. flexneri la segunda causa más frecuente.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes articulaciones con frecuencia no presenta osteoartrosis?","o":["Columna cervical","Articulación interfalángica distal","Cadera","Articulación interfalángica proximal","Muñeca"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 371) La osteoartrosis (OA) afecta a ciertas articulaciones, pero respeta otras. Con frecuencia, las articulaciones afectadas incluyen la columna cervical y lumbosacra, la cadera, rodilla y la primera articulación metatarsofalángica (fig. VIII--78). En las manos, las articulaciones interfalángicas distal y proximal y la base del pulgar a menudo se ven afectadas. Por lo general no se afecta la muñeca, el codo y el tobillo. Las articulaciones humanas fueron diseñadas, en un sentido evolutivo, para los simios, animales que todavía caminaban sobre cuatro extremidades. Por lo tanto, los seres humanos desarrollan osteoartrosis en articulaciones mal diseñadas para tareas humanas como la sujeción con pinza (OA en la base del pulgar) y caminar erguido (OA en rodillas y caderas). Algunas articulaciones, como los tobillos, pueden estar preservadas porque su cartílago articular puede ser especialmente resistente a las tensiones de carga. *\\[ FIGURA VIII--78 --- ver imagen en el documento original \\]*","letters":["A","B","C","D","E"]},{"q":"En Estados Unidos, ¿qué porcentaje de pacientes mayores de 60 años tienen osteoartrosis sintomática de la rodilla?","o":["1%","5%","12%","30%","43%"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 371) La osteoartrosis (OA) es el tipo más común de artritis. Su alta prevalencia, en especial en los adultos mayores y su impacto negativo en la función física la convierten en una de las principales causas de incapacidad en adultos mayores. Debido al envejecimiento de las personas que viven en el hemisferio occidental y a que está aumentando la prevalencia de obesidad, un factor de riesgo importante, la presencia de osteoartrosis va en aumento. La osteoartrosis sintomática de la rodilla (dolor en la mayor parte de los días del mes reciente más evidencia radiológica de osteoartrosis en la rodilla) se presenta en casi 12% de las personas ≥ 60 años en Estados Unidos y 6% de todos los adultos ≥ 30 años. La osteoartrosis sintomática de cadera es casi 30% más frecuente que la enfermedad en la rodilla. Aunque la osteoartrosis radiográfica de la mano y la aparición de agrandamiento óseo en las articulaciones afectadas de la mano son extremadamente frecuentes en las personas mayores, la mayor parte de los casos no suelen ser sintomáticos. Aun así, la osteoartrosis sintomática de la mano se presenta en casi 10% de las personas de edad avanzada y a menudo produce una limitación mensurable de la función.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de los siguientes datos es la presentación clínica más frecuente en la fiebre reumática aguda?","o":["Carditis","Corea","Eritema marginado","Poliartritis","Nódulos subcutáneos"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 359) La fiebre reumática aguda es ocasionada casi universalmente por la enfermedad por estreptococos del grupo A, aunque casi todas las enfermedades estreptocócicas pueden precipitar fiebre reumática. Aunque las infecciones cutáneas pueden asociarse con fiebre reumática, la presentación más frecuente es con el antecedente de faringitis. Hay un periodo de latencia de casi tres semanas desde un episodio de faringodinia hasta la presentación de fiebre reumática aguda. Las manifestaciones más frecuentes son fiebre y poliartritis; esta última se presenta en 60% a 75% de los casos. La carditis también puede estar presente, aunque con menor frecuencia (50% a 60% de los casos). La corea y la carditis de lenta evolución pueden tener una presentación subaguda. La corea se presenta en 2% a 30% de los individuos afectados, mientras que el eritema marginado y los nódulos subcutáneos son poco frecuentes. Casi 60% de los pacientes con fiebre reumática aguda evolucionan a cardiopatía reumática con potencial afectación del endocardio, el pericardio y el miocardio. Todos los pacientes con fiebre reumática aguda deben recibir antibióticos suficientes para tratar la infección por estreptococo del grupo A.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes afirmaciones describe mejor la función de las proteínas codificadas por los genes del complejo mayor de histocompatibilidad en seres humanos I y II?","o":["Activación del sistema del complemento","Unión a receptores de superficie celular en granulocitos y macrófagos para iniciar la fagocitosis","Unión inespecífica del antígeno para su presentación a los linfocitos T","Unión a antígenos específicos en respuesta a la actividad de los linfocitos B para promover la neutralización y la precipitación"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 1 El sistema inmunitario en la salud y la enfermedad, cap. 360) Los genes del complejo mayor de histocompatibilidad (MHC) humano están localizados en una región de cuatro megabases en el cromosoma 6. La función principal de los genes del complejo mayor de histocompatibilidad es producir proteínas que son importantes para desarrollar la especificidad inmunológica a través de su participación en el antígeno de unión para su presentación a los linfocitos T. Este proceso es inespecífico y la capacidad de una molécula de antígeno leucocítico humano para unirse a una proteína en particular depende del ajuste molecular entre la secuencia de aminoácidos de una proteína en particular y el dominio correspondiente de la molécula de MHC. Una vez que se ha unido una oleada, el complejo peptídico MHC se une al receptor de linfocitos T, tras lo cual los linfocitos T deben determinar si se debe generar una respuesta inmunitaria. Si un antígeno es similar a una proteína endógena, el antígeno potencial se reconocerá como un autopéptido y se continuará la tolerancia al antígeno. Los complejos MHC I y II han estado implicados en el desarrollo de muchas enfermedades autoinmunitarias, que se producen cuando los linfocitos T no reconocen un péptido como un autopéptido y se permite que se desarrolle una respuesta inmunitaria. Los genes MHC I y II también desempeñan una función importante en la compatibilidad de los tejidos para el trasplante y son importantes para generar rechazo mediado por el sistema inmunitario. Las otras opciones enumeradas como respuestas se refieren a las funciones de las inmunoglobulinas. La región variable de la inmunoglobulina es una respuesta específica de los linfocitos B a un antígeno para promover la neutralización del antígeno mediante la aglutinación y precipitación. La región constante de la inmunoglobulina es capaz de activar el sistema inmunitario de forma inespecífica a través de la activación de los componentes y promover la fagocitosis por neutrófilos y macrófagos.","letters":["A","B","C","D"]},{"q":"La mayor parte de las manifestaciones de la fiebre reumática aguda se presentan aproximadamente tres semanas después de una infección por estreptococo del grupo A. ¿Qué manifestación puede presentarse varios meses después de la infección desencadenante?","o":["Corea","Eritema marginado","Fiebre","Poliartritis","Nódulos subcutáneos"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 359) Hay un periodo de latencia de casi tres semanas (una a cinco semanas) entre la infección estreptocócica del grupo A y la aparición de las características clínicas de la fiebre reumática aguda. Las excepciones son la corea y la carditis de lenta evolución, que puede continuarse con periodos latentes prolongados que duran hasta seis meses. Aunque muchos pacientes informan de un episodio previo de faringodinia, una infección previa por estreptococo del grupo A suele ser subclínica; en estos casos, solo se puede confirmar mediante pruebas de anticuerpos estreptocócicos. Las características clínicas más frecuentes son la poliartritis (que se presenta en 60% a 75% de los casos) y la carditis (50% a 60%). La prevalencia de la corea en la fiebre reumática aguda varía sustancialmente entre las poblaciones, oscilando entre \\< 2% y 30%. El eritema marginado y los nódulos subcutáneos son poco frecuentes y se encuentran en \\< 5% de los casos.","letters":["A","B","C","D","E"]}]}}</script>
