hemocromatosis. El líquido sinovial no es inflamatorio. En casi 50% de los pacientes hay evidencia de enfermedad por depósito de pirofosfato cálcico y algunos pacientes experimentan episodios de seudogota aguda al final de la evolución de la enfermedad (cap. 365). El tratamiento de la hemocromatosis es la flebotomía de repetición. Por desgracia, este tratamiento tiene poco efecto sobre la artritis establecida, que, junto con la condrocalcinosis, puede progresar. El tratamiento de la artritis basado en síntomas consiste en la administración de paracetamol y antiinflamatorios no esteroideos (NSAID), según se tolere. Los ataques agudos de seudogota se tratan con dosis altas de un NSAID o con un ciclo terapéutico corto de glucocorticoides. La artroplastia total de cadera o rodilla ha tenido éxito en la enfermedad avanzada.","letters":["A","B","C","D","E"]},{"q":"Se está planificando iniciar tratamiento con alopurinol en una mujer de 55 años por el diagnóstico de artritis gotosa. ¿Cuál de las siguientes afirmaciones describe mejor una estrategia de dosificación adecuada para el alopurinol?","o":["El alopurinol y la azatioprina se usan con frecuencia en combinación para el tratamiento de la gota.","La dosis de alopurinol debe ajustarse según la función hepática.","La dosis de alopurinol debe ajustarse para alcanzar concentraciones séricas de ácido úrico \\< 6 mg/100 mL.","Debe evitarse el alopurinol cuando los pacientes estén tomando colquicina.","La intoxicación con alopurinol es más frecuente en pacientes que expresan el antígeno leucocítico humano B27."],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 372) El alopurinol es un inhibidor de la xantina oxidasa, con mucho, el fármaco hipouricémico más utilizado y que es el mejor fármaco para reducir el urato sérico en individuos con sobreproducción, formadores de cálculos de urato y pacientes con nefropatía. Se puede administrar en una sola dosis matutina, por lo general 100 mg al inicio y con aumento hasta 800 mg si es necesario. En pacientes con enfermedad renal crónica, la dosis inicial de alopurinol debe ser más baja y ajustarse en función de la concentración sérica de creatinina; por ejemplo, con depuración de creatinina de 10 mL/min, se suelen utilizar 100 mg cada tercer día. Las dosis se pueden aumentar gradualmente hasta alcanzar la concentración ideal de urato \\< 6 mg/100 mL. La toxicidad del alopurinol se ha reconocido cada vez más en pacientes que usan diuréticos tiazídicos, en pacientes alérgicos a la penicilina y ampicilina y en asiáticos que expresan HLA-B\\*5801. La colquicina se utiliza a menudo con alopurinol en el tratamiento de la gota. No se deben prescribir de forma conjunta alopurinol y azatioprina porque la azatioprina puede aumentar considerablemente las concentraciones sanguíneas de alopurinol y provocar toxicidad.","letters":["A","B","C","D","E"]},{"q":"El Sr. Hinsley es un varón de 72 años con antecedente de hipertensión tratada con hidroclorotiazida. Hoy presentó dolor agudo e insoportable en la rodilla. En la exploración física, su rodilla está caliente, levemente eritematosa, hinchada y dolorosa al tacto o con el movimiento pasivo. En la figura VIII-82A se muestra el examen microscópico del líquido articular. ¿Cuál de las siguientes es la alteración metabólica más probable del Sr. Hinsley?","o":["Infección articular bacteriana aguda","Anticuerpos contra antígenos antinucleares","Degeneración del cartílago hialino","Aumento de la producción de pirofosfato inorgánico","Producción excesiva de ácido úrico"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 372) La micrografía ilustra cristales de urato monosódico extracelulares e intracelulares con cristales en forma de aguja y bastón (fig. VIII-82B). Estos cristales son muestra de birrefringencia fuertemente negativa bajo la microscopia de luz polarizada compensada. Esto es gota. La mayor parte de los pacientes con gota producen cantidades excesivas de ácido úrico. La degeneración del cartílago hialino es típica de la osteoartrosis, que suele tener un aspirado sinovial sin grandes alteraciones. Los anticuerpos contra los anticuerpos antinucleares que son típicos del lupus son poco frecuentes en un varón de edad avanzada y no se asocian con líquido cristalino. La infección articular bacteriana tendría un líquido sinovial purulento con predominio de neutrófilos. El aumento de la producción de pirofosfato inorgánico es una causa de la enfermedad por depósito de pirofosfato cálcico (CPPD; seudogota), otra artropatía por cristales. A continuación, se muestran los cristales de CPPD. *\\[ FIGURA VIII--82B --- ver imagen en el documento original \\]* Los cristales intracelulares y extracelulares de pirofosfato cálcico (CPP), como se observan en una nueva preparación de líquido sinovial, ilustran cristales rectangulares, en forma de varilla y romboides, débilmente positivos o no birrefringentes (microscopia con luz polarizada compensada; aumento × 400).","letters":["A","B","C","D","E"]}]},"44":{"title":"Fibromialgia. Síndrome de fatiga crónica.","questions":[]},"45":{"title":"Enfermedades de la glándula tiroides.","questions":[{"q":"Respecto a la tiroiditis subaguda, señale la respuesta CORRECTA:","o":["Su origen es autoinmune.","El tratamiento consiste en antibióticos y drenaje quirúrgico.","Tras un periodo de hipertiroidismo y una fase de hipotiroidismo, la mayoría de los pacientes permanecerán eutiroideos en varias semanas.","Deja un hipotiroidismo residual en el 70% de los casos."],"c":"C","e":"La tiroiditis subaguda de De Quervain (probablemente de origen viral/postinfeccioso, no autoinmune) sigue una evolución trifásica característica ---hipertiroidismo por liberación pasiva de hormona, seguido de una fase de hipotiroidismo transitorio y, finalmente, normalización de la función tiroidea en la mayoría de los pacientes en semanas---; el tratamiento es sintomático (AINE o corticoides), no antibiótico ni quirúrgico, y el hipotiroidismo residual permanente es infrecuente (no en el 70% de los casos)."},{"q":"Mujer de 52 años que, al bañarse en verano, nota un bulto en la zona anterior del cuello; asintomática. Se confirma masa firme de 2 cm, lisa, que asciende con la deglución, sin adenopatías palpables. ¿Qué actitud tomaría inicialmente?","o":["Determinación de tiroglobulina en sangre.","Determinación de anticuerpos antitiroideos circulantes.","Ecografía tiroidea y punción-aspiración con aguja fina.","Determinación de T3 libre."],"c":"C","e":"Ante un nódulo tiroideo palpable, la primera actuación es la ecografía tiroidea (que caracteriza el nódulo y determina el riesgo de malignidad según su patrón) seguida, si procede según el tamaño y las características ecográficas, de una punción-aspiración con aguja fina para estudio citológico; la determinación aislada de tiroglobulina o anticuerpos no es la primera prueba en el estudio inicial de un nódulo."},{"q":"Marque cuál de las siguientes entidades NO es causa de hipertiroidismo con HIPERcaptación de radioyodo en la glándula tiroidea:","o":["Enfermedad de Graves.","Tiroiditis subaguda de De Quervain.","Adenoma hipofisario productor de TSH.","Adenoma tóxico."],"c":"B","e":"La tiroiditis subaguda cursa con hipertiroidismo por liberación pasiva de hormona preformada desde folículos dañados, sin aumento de la síntesis, por lo que la captación de radioyodo está característicamente DISMINUIDA (no aumentada); la enfermedad de Graves, el adenoma hipofisario productor de TSH y el adenoma tóxico sí cursan con hipercaptación, al reflejar una síntesis hormonal glandular incrementada."},{"q":"Señale cuál NO es un efecto secundario típico de los fármacos antitiroideos (tionamidas):","o":["Agranulocitosis.","Toxicidad hepática.","Enfermedad intersticial pulmonar.","Vasculitis ANCA positiva."],"c":"C","e":"La enfermedad intersticial pulmonar no es un efecto adverso característico descrito para las tionamidas (metimazol, propiltiouracilo); en cambio, la agranulocitosis, la hepatotoxicidad (más frecuente con propiltiouracilo) y la vasculitis ANCA positiva (también asociada sobre todo a propiltiouracilo) sí son efectos adversos reconocidos y potencialmente graves."},{"q":"Indique cuál es el mecanismo más frecuente de producción de hipercalcemia tumoral:","o":["Secreción tumoral de la proteína relacionada con la hormona paratiroidea (PTHrP).","Metástasis osteolíticas.","Producción tumoral de calcitriol.","Secreción tumoral ectópica de PTH auténtica."],"c":"A","e":"La hipercalcemia humoral maligna por secreción tumoral de PTHrP (proteína relacionada con la PTH, que actúa sobre el receptor de PTH mimetizando sus efectos óseos y renales) es el mecanismo más frecuente de hipercalcemia asociada a neoplasia, por delante de las metástasis osteolíticas directas; la secreción ectópica de PTH auténtica es excepcionalmente rara."},{"q":"En las condiciones patológicas encontradas en las series quirúrgicas de hiperparatiroidismo primario, señale la respuesta correcta:","o":["Adenomas paratiroideos simples en aproximadamente el 80-85% de los casos.","Hiperplasia glandular múltiple en el 30% de los casos.","Carcinoma paratiroideo en el 10% de los casos.","Adenoma doble en el 2-5% de los casos."],"c":"D","e":"En las grandes series quirúrgicas de hiperparatiroidismo primario, el adenoma único representa la gran mayoría de los casos (en torno al 80-85%), la hiperplasia de las cuatro glándulas en torno al 10-15%, el adenoma doble es infrecuente (2-5%) y el carcinoma paratiroideo es excepcional (\\<1%)."},{"q":"¿Qué entidad, de las siguientes, NO es causa de obesidad secundaria?","o":["Síndrome de Cushing.","Diabetes mellitus tipo 2.","Síndrome de ovario poliquístico.","Hipotiroidismo."],"c":"B","e":"La diabetes mellitus tipo 2 es, en la mayoría de los casos, una CONSECUENCIA de la obesidad (por la resistencia a la insulina asociada), no una causa reconocida de obesidad secundaria; el síndrome de Cushing, el síndrome de ovario poliquístico y el hipotiroidismo sí son causas endocrinas clásicas de obesidad secundaria."},{"q":"Mujer de 80 años con enlentecimiento del pensamiento, falta de concentración y disminución de la memoria a corto plazo en los últimos 6 meses. Analítica: T4 baja, TSH elevada. Señale la correcta en este contexto:","o":["La reposición de hormona tiroidea produce una recuperación completa del estado cognitivo en todos los casos.","La recuperación cognitiva es inmediata, normalmente en el primer mes de tratamiento.","Debe valorarse el riesgo/beneficio del tratamiento, individualizando en pacientes que no parezcan tener un claro beneficio clínico.","La disfunción cognitiva es infrecuente, presente en menos del 10% de los casos de hipotiroidismo."],"c":"C","e":"En pacientes ancianos con deterioro cognitivo e hipotiroidismo, la recuperación cognitiva con el tratamiento sustitutivo no está garantizada (puede ser parcial, tardía o ausente, especialmente si el deterioro cognitivo ya está establecido por otras causas concomitantes), por lo que debe individualizarse la decisión terapéutica valorando el balance riesgo/beneficio, en lugar de asumir una recuperación completa e inmediata."},{"q":"Paciente con calcio de 11 mg/dl, albúmina 3,9 g/l, fósforo 3,2 mg/dl, PTH 40 pg/ml y calciuria de 90 mg/día. ¿Cuál es la opción diagnóstica más probable?","o":["Hiperparatiroidismo primario.","Hipercalcemia hipocalciúrica familiar.","Tumor productor de PTHrP.","Intoxicación por vitamina D."],"c":"B","e":"La combinación de hipercalcemia con PTH inadecuadamente normal-alta (no suprimida) y una calciuria BAJA (\\<100 mg/día, cociente calcio/creatinina en orina \\<0,01) es muy característica de la hipercalcemia hipocalciúrica familiar, una entidad benigna causada por mutaciones inactivantes del receptor sensor de calcio, que no requiere paratiroidectomía a diferencia del hiperparatiroidismo primario (donde la calciuria suele estar normal o elevada)."},{"q":"Mujer de 35 años intervenida de adenoma paratiroideo hace años, diagnosticada recientemente de un prolactinoma. ¿Cómo lo interpreta?","o":["Sospecha de neoplasia endocrina múltiple tipo 1.","Sospecha de neoplasia endocrina múltiple tipo 2A.","Sospecha de neoplasia endocrina múltiple tipo 2B.","Sospecha de complejo de Carney."],"c":"A","e":"La combinación de hiperparatiroidismo primario (adenoma paratiroideo) y un tumor hipofisario (prolactinoma) es muy sugestiva del síndrome MEN1 (junto con los tumores neuroendocrinos pancreáticos, la tríada clásica de esta entidad); el MEN2 se caracteriza por carcinoma medular de tiroides y feocromocitoma, no por prolactinomas."},{"q":"Varón de 77 años con astenia y pérdida de peso, exploración normal. Analítica: T4 libre 0,08 ng/dl con TSH 4 µU/ml. ¿Cuál de las siguientes afirmaciones le parece correcta?","o":["Se trata de un hipotiroidismo primario.","Los datos son compatibles con una tiroiditis.","La sospecha es de patología hipofisaria (hipotiroidismo central).","Debe iniciarse tratamiento con hormona tiroidea de inmediato por estar sintomático."],"c":"C","e":"Una T4 libre muy baja con una TSH que no está elevada (normal o incluso baja) es inapropiada para el grado de hipotiroidismo periférico, lo que sugiere un fallo en el eje hipotálamo-hipofisario (hipotiroidismo central/secundario) en lugar de un hipotiroidismo primario (que cursaría con TSH muy elevada); esto obliga a estudiar la función hipofisaria global antes de iniciar tratamiento sustitutivo."},{"q":"Mujer de 82 años con bajo nivel de conciencia, TA 130/60, Tª 34,2ºC, SatO2 95%, edema facial y en miembros inferiores, frialdad cutánea, sin ingurgitación yugular. Hb 10,5 g/dl, VCM 102 fl, Na 125 mEq/l, K 4,5 mEq/l, creatinina 1,1 mg/dl. ECG: ritmo sinusal a 55 lpm con bajo voltaje. Rx: derrame pleural derecho. ¿Qué exploración daría el diagnóstico?","o":["Determinación de NT-proBNP.","Determinación de TSH.","Determinación de procalcitonina.","Cociente proteínas/creatinina en orina."],"c":"B","e":"La combinación de hipotermia, bajo nivel de consciencia, bradicardia relativa, macrocitosis, hiponatremia, edemas sin datos de insuficiencia cardiaca (sin ingurgitación yugular) y bajo voltaje electrocardiográfico es muy sugestiva de hipotiroidismo grave/coma mixedematoso, por lo que la TSH es la determinación clave para el diagnóstico."},{"q":"Señale, de entre las siguientes, la causa más frecuente de hipotiroidismo en países en vías de desarrollo:","o":["Deficiencia de yodo.","Enfermedad autoinmunitaria.","Yatrogénica.","Administración de fármacos."],"c":"A","e":"El déficit de yodo en la dieta sigue siendo la causa más frecuente de hipotiroidismo a nivel mundial, especialmente en regiones sin programas de yodación de la sal; en países desarrollados con adecuada ingesta de yodo, la causa más frecuente es la tiroiditis autoinmune (Hashimoto)."},{"q":"¿Cuál es la manifestación clínica más frecuente de la neoplasia endocrina múltiple tipo 1 (MEN1)?","o":["Tumor carcinoide.","Gastrinoma.","Feocromocitoma.","Hiperparatiroidismo primario."],"c":"D","e":"El hiperparatiroidismo primario (por hiperplasia de las cuatro glándulas) es la manifestación más frecuente y habitualmente la primera en aparecer en el síndrome MEN1, presente en la práctica totalidad de los pacientes a lo largo de su evolución, por delante de los tumores neuroendocrinos pancreáticos (gastrinoma, entre otros) y los tumores hipofisarios."},{"q":"Mujer de 88 años con gran bocio multinodular de más de 30 años de evolución, sin crecimiento reciente ni disfagia/estridor, con hipertiroidismo por T3 (T4 libre normal, T3 libre elevada, TSH suprimida), HTA controlada y EPOC en tratamiento inhalado. ¿Cuál es la actitud terapéutica más indicada?","o":["No tratar, ya que la T4 libre es normal.","Hemitiroidectomía más istmectomía.","Iniciar L-tiroxina sódica.","Tratamiento con yodo radioactivo."],"c":"D","e":"En una anciana con bocio multinodular tóxico de larga evolución, alto riesgo quirúrgico (EPOC) y arritmia asociada al hipertiroidismo, el yodo radioactivo es el tratamiento de elección, al evitar los riesgos de la cirugía en una paciente frágil; el hipertiroidismo bioquímico (TSH suprimida, T3 elevada) sí requiere tratamiento activo, y la levotiroxina estaría contraindicada al tratarse de un hipertiroidismo, no de un hipotiroidismo."},{"q":"¿Cuál es la causa más frecuente de hiperprolactinemia?","o":["El hipotiroidismo primario.","La ingesta de fármacos.","El adenoma hipofisario productor de prolactina.","La sección del tallo hipofisario."],"c":"B","e":"Considerando el conjunto de la población, la causa más frecuente de hiperprolactinemia es la inducida por fármacos (antipsicóticos, antieméticos como metoclopramida, algunos antidepresivos), por delante del prolactinoma hipofisario, que aunque es la causa tumoral más frecuente, es menos prevalente en conjunto que la causa farmacológica."},{"q":"Las siguientes son causas potenciales de LDL elevado, EXCEPTO:","o":["Cirrosis hepática.","Hipotiroidismo.","Síndrome nefrótico.","Diuréticos tiazídicos."],"c":"A","e":"En la cirrosis avanzada el fallo de síntesis hepática condiciona típicamente una DISMINUCIÓN del colesterol total y LDL, no una elevación, a diferencia del hipotiroidismo, el síndrome nefrótico o los diuréticos tiazídicos, que sí elevan el LDL."},{"q":"Varón de 72 años institucionalizado, con EPOC grave y oxígeno domiciliario, hemiparesia derecha secuelar, IMC 18,5 kg/m². Se sospecha déficit de vitamina D. ¿Cuál es la mejor prueba para determinarlo?","o":["1,25-dihidroxivitamina D.","25-hidroxivitamina D.","Hormona paratiroidea.","Concentraciones séricas de calcio ionizado y total."],"c":"B","e":"La 25-hidroxivitamina D es el metabolito que refleja las reservas corporales de vitamina D (mayor vida media, no regulado agudamente), por lo que es la determinación de elección para diagnosticar déficit de vitamina D; la 1,25-dihidroxivitamina D (forma activa, de vida media corta y regulación estrecha) no refleja fielmente el estado de depósitos."},{"q":"Mujer sometida a tiroidectomía total por carcinoma folicular de tiroides que, 6 horas después, refiere hormigueo perioral y parestesias en dedos, con calambres al tomar la tensión arterial (signo de Trousseau positivo, con espasmo de la comisura labial a la percusión del arco cigomático ---signo de Chvostek---). QT de 575 ms en el ECG. ¿Cuál es el siguiente paso?","o":["Administración de benzatropina.","Administración de gluconato de calcio.","Administración de sulfato de magnesio.","Medición de calcio, magnesio, fosfato y potasio."],"c":"B","e":"El cuadro clínico (parestesias periorales y acrales, Chvostek y Trousseau positivos, QT prolongado) es característico de hipocalcemia aguda sintomática tras tiroidectomía total (por lesión o hipofunción transitoria de las glándulas paratiroides adyacentes), que requiere tratamiento inmediato con calcio intravenoso (gluconato cálcico) dada la clínica florida y el riesgo de arritmia por QT prolongado."},{"q":"Las siguientes pruebas están indicadas en la evaluación de la osteoporosis de una paciente perimenopáusica, EXCEPTO:","o":["Niveles de FSH y LH.","Calcio sérico.","TSH.","Niveles de 25-hidroxivitamina D."],"c":"A","e":"Aunque el estado hormonal (menopausia) es relevante en la anamnesis, la determinación de FSH/LH no forma parte del estudio analítico básico de despistaje de causas secundarias de osteoporosis, que sí incluye calcio, TSH (descartar hipertiroidismo) y vitamina D, entre otros parámetros."},{"q":"El derrame pericárdico crónico masivo:","o":["Suele ser de etiología tuberculosa.","Puede deberse a hipotiroidismo, etiología que habrá que descartar de forma sistemática.","Nunca se asocia a taponamiento cardiaco.","La pericardiocentesis no está indicada en ningún caso."],"c":"B","e":"El hipotiroidismo grave es una causa reconocida y clásica de derrame pericárdico crónico, a menudo masivo pero de instauración lenta (por lo que puede no producir taponamiento pese a su gran volumen), lo que obliga a descartar sistemáticamente la función tiroidea ante un derrame pericárdico masivo de causa no aclarada."},{"q":"La primera manifestación clínica del hiperparatiroidismo primario en adultos jóvenes suele ser:","o":["Litiasis renal.","Hipertensión arterial.","Úlcera péptica.","Fracturas óseas."],"c":"A","e":"En los adultos jóvenes, la nefrolitiasis de repetición por hipercalciuria es la manifestación clínica de presentación más frecuente del hiperparatiroidismo primario, por delante de las manifestaciones óseas (que predominan en formas más evolucionadas o en pacientes de mayor edad)."},{"q":"Mujer de 35 años con debilidad muscular y diplopía de un mes de evolución. En la radiografía de tórax se aprecia una masa retroesternal de unos 5 cm. Esta masa corresponde más probablemente a:","o":["Un teratoma mediastínico.","Un timoma.","Un bocio con crecimiento retroesternal.","Un adenoma paratiroideo."],"c":"B","e":"La combinación de debilidad muscular y diplopía (sugestivas de miastenia gravis) con una masa mediastínica es muy característica del timoma, tumor asociado a la miastenia gravis con notable frecuencia (hasta un 10-15% de los pacientes con miastenia tienen timoma, y viceversa)."},{"q":"Señalar la respuesta correcta en relación con el carcinoma papilar de tiroides:","o":["Se asocia a hipertiroidismo.","Se asocia a mutaciones/reordenamientos del protooncogén RET (entre otras alteraciones como BRAF).","Es de mal pronóstico en general.","Metastatiza principalmente por vía hematógena."],"c":"B","e":"El carcinoma papilar de tiroides se asocia a diversas alteraciones moleculares, entre ellas reordenamientos del gen RET (RET/PTC) y mutaciones de BRAF; no se asocia a hipertiroidismo, tiene en general un pronóstico excelente (supervivencia a largo plazo muy elevada), y su diseminación característica es por vía LINFÁTICA (ganglios cervicales), no hematógena."},{"q":"¿Cuál de las siguientes afirmaciones NO se cumple para el carcinoma medular de tiroides?","o":["Representa entre un 3-12% de los tumores tiroideos.","La forma esporádica representa el 60-70% de los casos.","Se asocia con la exposición a radiación.","Con tumores \\>2 cm hay afectación ganglionar en el 60% de los casos."],"c":"C","e":"A diferencia del carcinoma papilar de tiroides (claramente asociado a exposición previa a radiación ionizante), el carcinoma medular no se relaciona con antecedente de radiación; su origen está en las células C parafoliculares (no del epitelio folicular) y se asocia, en sus formas hereditarias, a mutaciones germinales del protooncogén RET (síndromes MEN2)."},{"q":"Las metástasis cerebrales son la causa más frecuente de hipertensión intracraneal. ¿Cuál de estos tumores primarios tiene MENOR riesgo relativo de provocar hemorragia cerebral secundaria a metástasis?","o":["Cáncer de pulmón.","Coriocarcinoma.","Cáncer de células renales.","Cáncer papilar de tiroides."],"c":"D","e":"El carcinoma papilar de tiroides tiene un riesgo hemorrágico intrínsecamente bajo comparado con los tumores clásicamente asociados a metástasis cerebrales hemorrágicas y muy vascularizadas: coriocarcinoma, melanoma y carcinoma renal de células claras."},{"q":"En todos los siguientes procesos, EXCEPTO uno, hay sobrecrecimiento bacteriano intestinal. Señálelo:","o":["Estenosis intestinales múltiples por bridas.","Fístula gastrointestinal.","Hipertiroidismo con diarrea motora.","Divertículos múltiples en intestino delgado."],"c":"C","e":"La diarrea del hipertiroidismo se debe a un tránsito intestinal ACELERADO (mecanismo motor), no a sobrecrecimiento bacteriano; en cambio, cualquier situación de estasis intestinal (bridas, fístulas, divertículos) predispone al sobrecrecimiento bacteriano por enlentecimiento del tránsito y formación de asas ciegas."}]},"46":{"title":"Enfermedades de las glándulas suprarrenales.","questions":[{"q":"Con respecto a la insuficiencia suprarrenal crónica primaria (enfermedad de Addison), señale la FALSA:","o":["Los procesos más frecuentes que la causan son los autoinmunitarios y la tuberculosis.","Es característico encontrar astenia, hipotensión arterial, hiperpigmentación cutánea, hipernatremia e hipopotasemia.","La determinación de ACTH y cortisol a primera hora de la mañana permite el diagnóstico en la mayoría de los pacientes.","El tratamiento debe iniciarse con hidrocortisona."],"c":"B","e":"El patrón característico de la enfermedad de Addison es justo el contrario: HIPOnatremia (no hipernatremia) e HIPERpotasemia, por el déficit combinado de cortisol y aldosterona; el resto de afirmaciones (etiología autoinmune/TB, utilidad del cortisol/ACTH matutinos, inicio con hidrocortisona) son correctas."},{"q":"Señale cuál de las siguientes entidades NO es causa de síndrome de pseudo-Cushing:","o":["Alcoholismo crónico.","Diabetes mal controlada.","Hipertiroidismo.","Depresión grave."],"c":"C","e":"El hipertiroidismo no es una causa clásica de pseudo-Cushing (estados que simulan clínica o bioquímicamente un hipercortisolismo sin ser un verdadero síndrome de Cushing); el alcoholismo crónico, la diabetes mal controlada y la depresión grave sí son causas reconocidas de pseudo-Cushing."},{"q":"Indique qué entidad clínica de las siguientes se manifiesta con hiponatremia:","o":["Enfermedad de Addison.","Síndrome de Sheehan.","Ingesta crónica y elevada de cerveza.","Todas son ciertas."],"c":"D","e":"Las tres entidades pueden cursar con hiponatremia por mecanismos distintos: la enfermedad de Addison por déficit combinado de cortisol y aldosterona, el síndrome de Sheehan por hipocortisolismo secundario, y la potomanía de cerveza por baja ingesta de solutos junto con sobrecarga hídrica."},{"q":"Marque cuál es el hallazgo de laboratorio más frecuente en la insuficiencia suprarrenal:","o":["Hiperpotasemia.","Hipoglucemia.","Hiponatremia.","Anemia."],"c":"C","e":"La hiponatremia es la alteración analítica más frecuente en la insuficiencia suprarrenal (tanto primaria como secundaria), por delante de la hiperpotasemia (que solo aparece en la insuficiencia suprarrenal primaria por el déficit de aldosterona) y de la hipoglucemia."},{"q":"La extirpación quirúrgica es el tratamiento de elección para el feocromocitoma. La cirugía suele retrasarse hasta controlar la hipertensión mediante alfabloqueantes y ¿cuál de los siguientes fármacos?","o":["Un IECA.","Un betabloqueante.","Un bloqueante del calcio.","Un diurético."],"c":"B","e":"El betabloqueante se añade tras el alfabloqueo (nunca antes, para evitar una crisis hipertensiva por bloqueo beta sin oposición alfa) con el fin de controlar la taquicardia refleja y las arritmias asociadas al exceso de catecolaminas circulantes, como preparación preoperatoria estándar del feocromocitoma."},{"q":"Para confirmar si la insuficiencia suprarrenal secundaria es resultado de un tumor hipofisario o de una atrofia hipofisaria, ¿cuál es el paso diagnóstico más adecuado?","o":["Prueba de estimulación de ACTH.","Prueba de imagen hipofisaria (RM/TC craneal).","Electroencefalograma.","Medición de cortisol sérico basal."],"c":"B","e":"Una vez establecido el diagnóstico bioquímico de insuficiencia suprarrenal secundaria (déficit de ACTH), la prueba de imagen hipofisaria (idealmente RM) es el paso siguiente para determinar la causa estructural: un tumor hipofisario, silla turca vacía u otra lesión ocupante frente a una atrofia sin lesión visible."},{"q":"Señale la respuesta cierta en cuanto al síndrome de Cushing:","o":["Se trata de una enfermedad frecuente.","El exceso de ACTH, en la mayoría de los casos, es ocasionado por un microadenoma hipofisario (enfermedad de Cushing).","Los síntomas y signos clásicos incluyen hipoglucemia, hipotensión, pérdida de peso y eosinofilia.","El ketoconazol no ha demostrado ser eficaz, por lo que no se recomienda su uso."],"c":"B","e":"La enfermedad de Cushing (microadenoma hipofisario secretor de ACTH) es la causa más frecuente de Cushing dependiente de ACTH y de síndrome de Cushing endógeno en general; se trata de una enfermedad poco frecuente (no común), cursa con hiperglucemia, hipertensión, ganancia ponderal y eosinopenia (no lo contrario), y el ketoconazol sí es un fármaco eficaz y utilizado para el control del hipercortisolismo mientras se decide el tratamiento definitivo."},{"q":"Señale la respuesta FALSA en la insuficiencia suprarrenal:","o":["La hiponatremia es una característica bioquímica identificada con elevada frecuencia.","La insuficiencia suprarrenal aguda puede imitar un abdomen agudo, con dolor abdominal, náuseas, vómitos y fiebre.","La prueba corta de cosintropina (ACTH) es segura y fiable, con buen valor predictivo.","Es imprescindible comenzar tratamiento con DHEA en todos los casos, junto con hidrocortisona."],"c":"D","e":"El tratamiento sustitutivo con DHEA es opcional e individualizado, no un componente obligatorio del tratamiento estándar de la insuficiencia suprarrenal en todos los pacientes; el resto de afirmaciones (hiponatremia frecuente, presentación como abdomen agudo, fiabilidad de la prueba corta de ACTH) son correctas."},{"q":"¿Cuál de los siguientes síndromes se relaciona con el desarrollo de feocromocitoma?","o":["Neoplasia endocrina múltiple tipo 1.","Neoplasia endocrina múltiple tipo 2.","Síndrome de Turner.","Síndrome de Marfan."],"c":"B","e":"El feocromocitoma forma parte de la tríada clásica del síndrome MEN2 (junto con el carcinoma medular de tiroides y el hiperparatiroidismo en el MEN2A), a diferencia del MEN1, que no incluye feocromocitoma entre sus componentes habituales."},{"q":"La insuficiencia suprarrenal por atrofia idiopática (autoinmune):","o":["En nuestro país representa la segunda causa más frecuente de enfermedad de Addison, tras la tuberculosis.","Aparece cuando existe una destrucción mayor del 50% de la glándula.","Pueden existir anticuerpos contra el enzima 21-hidroxilasa.","El hallazgo de calcificaciones suprarrenales apoya este diagnóstico."],"c":"C","e":"Los anticuerpos frente a la 21-hidroxilasa son un marcador serológico característico de la insuficiencia suprarrenal autoinmune (causa hoy más frecuente que la tuberculosis en países desarrollados); las calcificaciones suprarrenales, en cambio, orientan más hacia causas infecciosas (tuberculosis) o hemorrágicas, no hacia la etiología autoinmune."},{"q":"Los sistemas enzimáticos responsables de la metabolización de fármacos abundan en el hígado, pero también se encuentran en las estructuras que se citan, EXCEPTO en:","o":["Riñón.","Glándulas suprarrenales.","Piel.","Pared intestinal."],"c":"C","e":"Riñón, glándulas suprarrenales y pared intestinal poseen actividad relevante de enzimas metabolizadoras de fármacos (incluido citocromo P450), a diferencia de la piel, que no constituye un sitio significativo de metabolismo farmacológico sistémico."},{"q":"¿Cuál de las siguientes manifestaciones NO se incluye dentro de las afecciones renales de la diabetes mellitus?","o":["Glomerulosclerosis nodular.","Uropatía obstructiva neurógena.","Necrosis papilar.","Hiperaldosteronismo hiperreninémico."],"c":"D","e":"La diabetes se asocia clásicamente a un estado de HIPOrreninismo con HIPOaldosteronismo (acidosis tubular renal tipo IV), justo lo contrario del hiperaldosteronismo hiperreninémico; glomerulosclerosis nodular, uropatía obstructiva por neuropatía autonómica y necrosis papilar sí son afecciones renales reconocidas de la diabetes."},{"q":"¿Cuál es la causa más común del síndrome de Cushing endógeno?","o":["Adenoma hipofisario productor de ACTH (enfermedad de Cushing).","Adenoma corticosuprarrenal.","Carcinoma corticosuprarrenal.","Secreción ectópica de ACTH."],"c":"A","e":"El adenoma hipofisario productor de ACTH (enfermedad de Cushing) es la causa más frecuente de síndrome de Cushing endógeno, por delante de las causas suprarrenales primarias (adenoma, carcinoma) y de la secreción ectópica de ACTH por tumores no hipofisarios."},{"q":"Las siguientes afirmaciones sobre las masas suprarrenales asintomáticas (incidentalomas) son verdaderas, EXCEPTO:","o":["Se debe realizar un TC sin contraste y evaluar la radiodensidad, estableciendo como punto de corte 10 UH.","La punción-aspiración con aguja fina puede distinguir los tumores suprarrenales primarios benignos de los malignos.","En pacientes con antecedentes de cáncer, la probabilidad de que una masa suprarrenal sea una metástasis es cercana al 50%.","La mayor parte de los incidentalomas suprarrenales no es secretora."],"c":"B","e":"La citología obtenida por PAAF no permite distinguir de forma fiable un tumor suprarrenal primario benigno de uno maligno (adenoma vs carcinoma corticosuprarrenal), por lo que la PAAF de una masa suprarrenal se reserva casi exclusivamente para descartar metástasis (tras haber excluido previamente un feocromocitoma, para evitar precipitar una crisis catecolaminérgica)."},{"q":"Señale la afirmación INCORRECTA ante el hallazgo de un incidentaloma suprarrenal:","o":["Se debe descartar en todo paciente que se trate de un feocromocitoma.","Se debe descartar hiperaldosteronismo en caso de hipertensión arterial.","Se debe descartar la producción de cortisol en exceso mediante un test de supresión nocturna con 1 mg de dexametasona.","La biopsia tiene alta rentabilidad para distinguir tumores adrenales benignos de malignos."],"c":"D","e":"Al igual que la PAAF, la biopsia de una masa suprarrenal tiene una rentabilidad limitada para diferenciar benignidad de malignidad, por lo que no se recomienda de rutina con ese fin; el estudio funcional (descartar feocromocitoma, hiperaldosteronismo si hay HTA, y exceso de cortisol con supresión nocturna con dexametasona) sí es obligado en todo incidentaloma."},{"q":"Ante un incidentaloma suprarrenal de 3,5 cm con estudio funcional negativo y densidad en TAC \\>10 UH, ¿cuál es la actitud a seguir?","o":["Repetir el estudio funcional en 12 meses únicamente.","Seguimiento anual mediante TC suprarrenal.","Suprarrenalectomía unilateral de entrada.","Ninguna evaluación adicional."],"c":"B","e":"Un incidentaloma no funcionante, con densidad radiológica \\>10 UH (que no permite descartar por completo un adenoma pobre en lípidos u otra lesión) y de tamaño relevante (3,5 cm), justifica un seguimiento radiológico (habitualmente anual) para vigilar cambios en tamaño o características que sugieran malignidad, además de reevaluación funcional periódica."},{"q":"Paciente de 65 años con hipotiroidismo primario que, a los pocos días de iniciar levotiroxina 150 µg/día, presenta hipotensión arterial con náuseas, vómitos, hiponatremia e hiperpotasemia. ¿Qué cree que puede haber sucedido?","o":["Coma mixedematoso.","Shock anafiláctico.","Secreción inadecuada de ADH secundaria al tratamiento.","Insuficiencia suprarrenal desenmascarada/precipitada por el tratamiento con levotiroxina."],"c":"D","e":"La levotiroxina acelera el aclaramiento del cortisol; en un paciente con insuficiencia suprarrenal subclínica no diagnosticada, iniciar levotiroxina sin cobertura glucocorticoidea previa puede precipitar una crisis addisoniana, con hipotensión, hiponatremia e hiperpotasemia, por lo que siempre debe descartarse y tratarse una posible insuficiencia suprarrenal concomitante antes de iniciar hormona tiroidea."},{"q":"Varón de 35 años, con tiroidectomía parcial hace un año por carcinoma tiroideo medular, recientemente diagnosticado de feocromocitoma y sometido a adrenalectomía unilateral. Se observa que la anatomía patológica de la cirugía tiroidea del año anterior mostraba también extracción de una glándula paratiroides con un tumor paratiroideo. ¿Qué se le debe decir al paciente?","o":["Que el cribado familiar y genético no es útil, porque las mutaciones que provocan estos cánceres no están relacionadas y surgen de forma espontánea.","Que es posible que padezca un síndrome de neoplasias endocrinas múltiples tipo 1.","Que es probable que tenga un síndrome de neoplasias endocrinas múltiples tipo 2.","Que la tiroidectomía parcial fue un tratamiento adecuado para esta condición."],"c":"C","e":"La combinación de carcinoma medular de tiroides, feocromocitoma y un tumor paratiroideo es la tríada característica del síndrome MEN2A, lo que obliga a un estudio genético (mutaciones de RET) y a un cribado familiar en los parientes de primer grado; además, el carcinoma medular en el contexto de un síndrome hereditario requiere tiroidectomía TOTAL (no parcial), dado el riesgo de afectación bilateral/multifocal."},{"q":"Señale cuál de las siguientes NO constituye una complicación reconocida del consumo de alcohol:","o":["Miopatía alcohólica.","Cetosis alcohólica.","Nefropatía alcohólica.","Pseudocushing alcohólico."],"c":"C","e":"La «nefropatía alcohólica» no es una entidad clínica bien definida ni reconocida como complicación directa del alcohol, a diferencia de la miopatía alcohólica, la cetosis alcohólica y el pseudocushing alcohólico, que sí son complicaciones descritas del consumo crónico de alcohol."},{"q":"Respecto al estudio de extensión del cáncer broncopulmonar, ¿cuál de las siguientes afirmaciones es FALSA?","o":["La búsqueda de metástasis intracraneales mediante TAC está justificada en pacientes con adenocarcinoma o carcinoma indiferenciado.","La gammagrafía ósea está indicada en presencia de sintomatología sospechosa o elevación de la fosfatasa alcalina.","El derrame pleural con citología negativa requiere toracoscopia para confirmar o descartar afectación pleural.","El abdomen superior (hígado y glándulas suprarrenales) solo debe explorarse en caso de existir sintomatología sospechosa."],"c":"D","e":"Dada la elevada frecuencia de metástasis suprarrenales y hepáticas en el cáncer de pulmón (las suprarrenales son una localización metastásica particularmente frecuente y a menudo asintomática), la exploración del abdomen superior (TC/ecografía) forma parte del estudio de extensión sistemático, no debiendo reservarse únicamente para pacientes sintomáticos."}]},"47":{"title":"Diabetes mellitus. Síndrome metabólico.","questions":[{"q":"¿Cuál de los siguientes se considera un paciente de muy alto riesgo cardiovascular?","o":["Paciente con diabetes mellitus tipo 2 y enfermedad cardiovascular establecida.","Paciente con diabetes y filtrado glomerular entre 45 y 59 ml/min/1,73 m² con cociente albúmina/creatinina en orina entre 30 y 300 mg/g.","Paciente con enfermedad microvascular en tres localizaciones distintas (microalbuminuria + retinopatía + neuropatía).","Todas las opciones son correctas."],"c":"D","e":"Las guías actuales de riesgo cardiovascular en diabetes (ESC/EASD) consideran de muy alto riesgo a los pacientes con DM y enfermedad cardiovascular establecida, a los que presentan daño de órgano diana relevante (ERC moderada con albuminuria significativa) y a los que tienen afectación microvascular en tres o más localizaciones, por lo que las tres situaciones descritas cumplen criterios de muy alto riesgo."},{"q":"Estudiante de medicina que refiere pérdida de peso pese a comer más de lo habitual, poliuria y polidipsia. Acude a Urgencias con aspecto de gravedad, TA 100/60, respiración profunda y rápida (28 rpm), sequedad de mucosas, sin fiebre. Glucemia 520 mg/dl, Na 131 mEq/l, K normal, pH 7,09, bicarbonato 8 mEq/l, cetonuria +++. ¿Qué respuesta le parece más CORRECTA?","o":["Debut de diabetes tipo 2 con disnea probablemente por neumonía o tromboembolismo, dada su vida sedentaria.","Es una cetoacidosis diabética; tratar con insulina endovenosa, sueroterapia con reposición de potasio, medidas generales y buscar la causa precipitante.","Debut de diabetes tipo 1 con cetoacidosis; tratar primero con bicarbonato y, tras corregir la acidosis, añadir insulina endovenosa.","Tratar con insulina rápida subcutánea, sueroterapia y pedirle que beba líquidos en abundancia."],"c":"B","e":"El cuadro clínico (poliuria, polidipsia, pérdida de peso, respiración de Kussmaul, hiperglucemia franca, acidosis metabólica grave y cetonuria intensa) es el debut clásico de una cetoacidosis diabética; el tratamiento estándar combina insulina intravenosa, sueroterapia con reposición de potasio (una vez conocida su cifra y con diuresis conservada) y medidas generales, con búsqueda activa del factor desencadenante, sin necesidad sistemática de bicarbonato salvo acidosis extrema."},{"q":"Según la última actualización de la SEMI para el tratamiento de la diabetes mellitus tipo 2, indique la CORRECTA:","o":["En pacientes con insuficiencia cardiaca, tanto con fracción de eyección preservada como reducida, se debe priorizar el uso de empagliflozina o dapagliflozina.","En pacientes con muy alto riesgo cardiovascular, se debe priorizar el uso de insulina basal-bolo.","En mayores de 75 años con fragilidad, se debe priorizar el uso de insulina ultralenta.","En la insuficiencia renal crónica, los iSGLT2 se deben iniciar independientemente del FGe, ya que son nefroprotectores."],"c":"A","e":"Los inhibidores del SGLT2 con evidencia específica en insuficiencia cardiaca (empagliflozina, dapagliflozina) han demostrado beneficio tanto en IC con fracción de eyección reducida como preservada, por lo que se priorizan en este perfil de paciente diabético; en el resto de opciones, la insulina no es de primera elección en muy alto riesgo CV (se priorizan arGLP1/iSGLT2), la fragilidad exige individualizar y simplificar (no necesariamente insulina ultralenta), y los iSGLT2 sí tienen un límite de FGe por debajo del cual no se recomienda iniciarlos."},{"q":"Señale qué fármaco o grupo de fármacos antidiabéticos es neutral en cuanto a ganancia o pérdida ponderal en el tratamiento de la diabetes mellitus tipo 2:","o":["Metformina.","Insulina.","Inhibidores del cotransportador de sodio-glucosa tipo 2 (iSGLT2).","Análogos del péptido-1 similar al glucagón (arGLP-1)."],"c":"A","e":"La metformina se considera un fármaco neutro respecto al peso (efecto discretamente favorable o neutro), a diferencia de la insulina (que favorece la ganancia ponderal), los iSGLT2 (que producen pérdida de peso moderada por glucosuria) y los arGLP-1 (que producen pérdida de peso significativa por su efecto sobre el apetito y el vaciamiento gástrico)."},{"q":"Señale cuál de los siguientes fármacos puede utilizarse en el tratamiento de la diabetes mellitus tipo 2 con enfermedad renal avanzada (aclaramiento inferior a 30 ml/min):","o":["Metformina.","Repaglinida.","Empagliflozina.","Lixisenatida."],"c":"C","e":"Algunos iSGLT2 (empagliflozina, entre otros) mantienen indicación de uso en fases avanzadas de la enfermedad renal crónica según ficha técnica y evidencia reciente, mientras que la metformina está contraindicada por el riesgo de acidosis láctica con FG \\<30, y los agonistas GLP-1 y secretagogos como la repaglinida requieren precaución o ajuste específico en esta situación."},{"q":"Marque cuál de los siguientes fármacos o grupo de fármacos antidiabéticos disminuye de modo más importante la hemoglobina glicada en el tratamiento de la diabetes mellitus tipo 2:","o":["Metformina.","Insulina.","Análogos del péptido-1 similar al glucagón.","Inhibidores del cotransportador de sodio-glucosa tipo 2."],"c":"B","e":"La insulina, al carecer de techo terapéutico (puede ajustarse la dosis de forma prácticamente ilimitada según necesidad), es el fármaco con mayor potencia hipoglucemiante y capacidad de reducción de la HbA1c entre los tratamientos disponibles para la diabetes tipo 2."},{"q":"En relación a la definición de síndrome metabólico, señale cuál de los siguientes parámetros NO se incluye dentro de los criterios diagnósticos:","o":["Colesterol LDL.","Colesterol HDL.","Perímetro de la cintura.","Presión arterial."],"c":"A","e":"Los criterios diagnósticos clásicos de síndrome metabólico incluyen obesidad central (perímetro de cintura), hipertrigliceridemia, colesterol HDL bajo, hipertensión arterial e hiperglucemia; el colesterol LDL no forma parte de estos criterios diagnósticos."},{"q":"Varón de 70 años con FA permanente en tratamiento con bisoprolol, amlodipino, insulina glargina, metformina, AAS, acenocumarol, paracetamol y vitamina B12. En relación con la revisión farmacológica, señale lo correcto:","o":["No se trata de un paciente con polifarmacia ya que toma menos de 10 fármacos.","La prescripción de vitamina B12 puede ser una prescripción en cascada, relacionada con un efecto secundario de la metformina.","La asociación de acenocumarol más AAS es en este caso una prescripción adecuada.","Replantear la indicación de un iSGLT2 no es una opción, ya que el objetivo es disminuir el número de fármacos."],"c":"B","e":"La metformina puede reducir la absorción de vitamina B12 a largo plazo, produciendo un déficit que, si no se reconoce como efecto adverso del fármaco, puede tratarse añadiendo B12 sin cuestionar la causa (prescripción en cascada); la combinación de anticoagulante oral más antiagregante sin indicación clara añade riesgo hemorrágico sin claro beneficio adicional en la mayoría de los casos, por lo que la opción C no es, en general, adecuada."},{"q":"Varón poliúrico, con polaquiuria, enuresis y sed persistente, 75 kg de peso, diuresis basal de 4 l/día con osmolaridad de 250 mOsm/l; vasopresina plasmática basal 0,8 pg/ml (normal 1-5 pg/ml). RM hipofisaria normal. ¿Cuál de las siguientes le parece correcta?","o":["Diabetes insípida nefrogénica.","Polidipsia primaria.","Diabetes insípida hipofisaria (central).","Diabetes mellitus."],"c":"C","e":"Una vasopresina plasmática inapropiadamente baja para el grado de poliuria/hiperosmolalidad relativa indica un defecto de SECRECIÓN de vasopresina (diabetes insípida central), no de resistencia renal a su acción (en cuyo caso la vasopresina estaría normal o elevada compensatoriamente); la RM hipofisaria normal no descarta una causa central sutil (idiopática o por lesión no visible)."},{"q":"Mujer de 63 años con diabetes mellitus tipo 2 de 7 años de evolución, en tratamiento con metformina, HbA1c 7,6% e IMC 41,3 kg/m². Para el tratamiento de la obesidad en esta paciente, ¿cuál es la mejor opción?","o":["Pioglitazona.","Empagliflozina.","Semaglutida.","Alogliptina."],"c":"C","e":"En una paciente con diabetes tipo 2 y obesidad grave, los agonistas del receptor de GLP-1 como la semaglutida ofrecen el mayor beneficio combinado sobre el control glucémico y la pérdida de peso significativa, siendo de elección frente a fármacos neutros (gliptinas) o de menor impacto ponderal (iSGLT2) e incluso frente a la pioglitazona, que favorece la ganancia de peso."},{"q":"Trabajadora sanitaria de 25 años con episodios recurrentes de hipoglucemia (glucosa capilar 40-55 mg/dl) en el trabajo, confirmados con glucemia plasmática de 50 mg/dl durante un episodio, con mejoría tras ingesta de zumo. Solo toma anticonceptivos orales. ¿Qué prueba tiene mayor probabilidad de demostrar la causa subyacente?","o":["Medición de IGF-1.","Medición de insulina y glucosa en ayuno.","Medición de insulina, glucosa y péptido C en ayuno.","Medición de insulina, glucosa y péptido C DURANTE un episodio sintomático."],"c":"D","e":"Dado el acceso laboral a insulina (trabajadora sanitaria) y que los episodios solo ocurren en el trabajo, existe sospecha de hipoglucemia facticia por administración exógena de insulina; la determinación simultánea de insulina, glucosa y péptido C DURANTE un episodio sintomático espontáneo es la prueba clave, ya que en la administración exógena de insulina el péptido C estará suprimido (a diferencia del insulinoma, donde ambos estarían elevados de forma concordante)."},{"q":"Todos los siguientes son factores que se han asociado a gravedad y peor pronóstico de la COVID-19, EXCEPTO:","o":["IMC \\>30.","Diabetes mellitus.","Inmunodepresión.","Niveles de linfocitos elevados."],"c":"D","e":"Es precisamente la LINFOPENIA (no la linfocitosis) el hallazgo analítico clásicamente asociado a mayor gravedad y peor pronóstico en la COVID-19, junto con la obesidad, la diabetes y la inmunodepresión, que sí son factores de riesgo reconocidos de evolución grave."},{"q":"Varón de 54 años con diabetes mellitus tipo 2 y miocardiopatía no isquémica con FEVI del 30% y síntomas congestivos, que en revisión presenta fibrilación auricular de nuevo diagnóstico confirmada por ECG. Sin antecedente hemorrágico, función renal y hepática normales. Vive en zona rural con difícil acceso a controles analíticos. ¿Cuál es el mejor tratamiento siguiente?","o":["Cardioversión eléctrica urgente.","Iniciar tratamiento con dronedarona.","Iniciar tratamiento con apixabán.","Iniciar tratamiento con warfarina."],"c":"C","e":"Los anticoagulantes de acción directa como el apixabán no requieren monitorización rutinaria de laboratorio (a diferencia de la warfarina/acenocumarol, que precisa controles frecuentes de INR), lo que los hace especialmente adecuados en un paciente con difícil acceso a controles analíticos; además, están contraindicados en la dronedarona en pacientes con insuficiencia cardiaca sintomática con FEVI reducida, y no existe indicación de cardioversión eléctrica urgente sin inestabilidad hemodinámica."},{"q":"Mujer de 21 años con diabetes tipo 1 que suspendió la insulina el día previo, con náuseas, vómitos, letargo y deshidratación. TA 80/40, FC 112. Na 126 mEq/l, K 4,3 mEq/l, urea 76 mg/dl, creatinina 2,2 mg/dl, bicarbonato 10 mEq/l, cloro 88 mEq/l, glucosa 720 mg/dl. Todas las siguientes son medidas terapéuticas apropiadas, EXCEPTO:","o":["Solución salina hipertónica al 3%.","Gasometría arterial.","Insulina intravenosa.","Potasio intravenoso."],"c":"A","e":"La solución salina hipertónica al 3% NO está indicada en el tratamiento estándar de la cetoacidosis diabética; el manejo se basa en suero salino isotónico inicial, insulina intravenosa, reposición de potasio guiada por sus niveles y monitorización gasométrica, no en soluciones hipertónicas de sodio."},{"q":"Los secretagogos de insulina de acción rápida (repaglinida, nateglinida), de acción más rápida que las sulfonilureas, pueden ser especialmente eficaces para:","o":["Evitar la hipoglucemia nocturna.","Promover la pérdida de peso en pacientes obesos.","Reducir la hiperglucemia postprandial.","Mejorar la sensibilidad a la insulina."],"c":"C","e":"Por su inicio de acción rápido y su corta duración, los secretagogos de acción rápida son especialmente útiles para controlar los picos de glucemia postprandial cuando se administran justo antes de las comidas, a diferencia de las sulfonilureas, de acción más prolongada."},{"q":"En relación con los hipoglucemiantes orales, es cierto que:","o":["La acarbosa aumenta la secreción de insulina.","Las tiazolidindionas bloquean la alfa-glucosidasa intestinal.","La metformina reduce la producción hepática de glucosa.","No pueden asociarse a la administración de insulina."],"c":"C","e":"El mecanismo de acción principal de la metformina es la reducción de la gluconeogénesis hepática (disminución de la producción hepática de glucosa), junto con una mejora de la sensibilidad periférica a la insulina; la acarbosa (no las tiazolidindionas) es la que inhibe la alfa-glucosidasa intestinal, y sí puede asociarse a insulina."},{"q":"Un paciente con coma hiperglucémico hiperosmolar no cetósico:","o":["Suele presentar respiración de Kussmaul.","Implica la necesidad de tratamiento posterior con insulina de forma indefinida al resolverse el cuadro.","Tiene un elevado riesgo de mortalidad.","Para su diagnóstico es necesaria una osmolaridad eficaz superior a 280 mOsm/l únicamente."],"c":"C","e":"El estado hiperosmolar hiperglucémico se asocia a una mortalidad más elevada que la cetoacidosis diabética, especialmente en ancianos con comorbilidad; la respiración de Kussmaul es propia de la acidosis metabólica de la cetoacidosis (no característica de este cuadro, sin acidosis significativa), no siempre requiere insulina de mantenimiento indefinida tras su resolución (depende del tipo de diabetes subyacente), y el diagnóstico exige una osmolaridad EFECTIVA típicamente superior a 320 mOsm/l, no 280."},{"q":"Todo lo siguiente se asocia con un alto riesgo de ictus en pacientes con fibrilación auricular, EXCEPTO:","o":["Diabetes mellitus.","Hipercolesterolemia.","Insuficiencia cardiaca congestiva.","Hipertensión arterial."],"c":"B","e":"La hipercolesterolemia no forma parte de las escalas de estratificación de riesgo tromboembólico en fibrilación auricular (como CHA2DS2-VASc), a diferencia de la diabetes mellitus, la insuficiencia cardiaca y la hipertensión arterial, que sí son factores de riesgo reconocidos e incluidos en dichas escalas."},{"q":"Paciente de 72 años con DM2, deterioro progresivo del nivel de conciencia, fiebre y deshidratación. Glucemia 900 mg/dl, sodio 160 mEq/l, potasio 3,7 mEq/l, cetonuria negativa. El objetivo del tratamiento es:","o":["Rehidratar al paciente para corregir la hipovolemia y la hiperosmolalidad.","Normalizar la glucemia, evitando la administración de insulina si el paciente no es insulinodependiente.","El factor desencadenante no es importante en la situación aguda.","No es necesario corregir las alteraciones electrolíticas, que se corregirán con la rehidratación."],"c":"A","e":"En el estado hiperosmolar hiperglucémico (glucemia muy elevada, hipernatremia, sin cetonuria significativa), el pilar fundamental e inicial del tratamiento es la rehidratación cuidadosa para corregir la hipovolemia y la hiperosmolalidad, junto con insulina (independientemente del tipo de diabetes) y la búsqueda activa y corrección del factor precipitante (con frecuencia una infección, como sugiere la fiebre)."},{"q":"Varón que acude a Urgencias con dolor retroesternal opresivo de 30 minutos, irradiado al maxilar inferior, con diaforesis profusa y disnea. TA 115/90, FC 95 lpm. ¿Qué prueba diagnóstica constituye la forma más rápida de modificar la farmacoterapia del paciente?","o":["ECG de 12 derivaciones.","Angiografía/angio-TC coronaria.","Ecocardiograma.","Nivel sérico de troponina T."],"c":"A","e":"Ante la sospecha de síndrome coronario agudo, el ECG de 12 derivaciones es la prueba más rápida y accesible, y su resultado (elevación del ST u otros cambios) condiciona de forma inmediata la estrategia terapéutica (reperfusión urgente o no), sin necesidad de esperar a la troponina u otras pruebas más lentas."},{"q":"¿En cuál de los siguientes casos es más probable que el tratamiento con corticoesteroides por una nefritis intersticial comprobada por biopsia repercuta en la recuperación renal a largo plazo?","o":["Mujer de 37 años con sarcoidosis.","Varón de 48 años con nefritis intersticial lentamente progresiva de 2 meses de evolución, con fibrosis en la biopsia.","Varón de 54 años con diabetes mellitus e infección reciente por Salmonella.","Varón de 63 años con nefritis intersticial alérgica tras el uso de cefalosporinas."],"c":"A","e":"La nefritis intersticial granulomatosa asociada a sarcoidosis responde de forma característica y favorable al tratamiento con corticoides, a diferencia de la nefritis intersticial ya fibrosada y crónica (con menor capacidad de reversión), o de causas donde el manejo prioritario es distinto (tratamiento antibiótico en infección activa, o simple retirada del fármaco causante en la nefritis alérgica, donde los corticoides tienen un papel más limitado y controvertido)."},{"q":"¿Cuál de las siguientes opciones sobre el cuidado hospitalario de pacientes diabéticos es verdadera?","o":["La anestesia general induce sensibilización a la insulina e incrementa el riesgo de hipoglucemia.","Un mayor grado de hiperglucemia durante la hospitalización no se ha vinculado con mayor incidencia de infecciones.","En ensayos clínicos, el control estricto de la glucemia (objetivo 81-108 mg/dl) es mejor que el control moderado (objetivo 140 mg/dl).","El inicio de nutrición parenteral total se relaciona con mayores requerimientos de insulina."],"c":"D","e":"El aporte calórico concentrado de la nutrición parenteral total (con alto contenido en glucosa) incrementa de forma característica las necesidades de insulina; la anestesia general suele inducir RESISTENCIA a la insulina (no sensibilización) con mayor riesgo de hiperglucemia, la hiperglucemia hospitalaria SÍ se asocia a mayor riesgo de infecciones, y los grandes ensayos (como NICE-SUGAR) mostraron que el control glucémico MUY estricto se asocia a más hipoglucemias graves sin mejorar (e incluso empeorando) el pronóstico frente a un control moderado."},{"q":"En relación al tratamiento de la diabetes mellitus tipo 2, señale lo INCORRECTO:","o":["Se recomienda priorizar el uso de arGLP-1 sobre la insulina cuando sea posible.","En pacientes con diabetes y ERC con albuminuria tratados con dosis máximas toleradas de IECA o ARA-II, se recomienda añadir finerenona para mejorar los resultados cardiovasculares y reducir la progresión de la ERC.","En pacientes con ERC se recomienda el uso de iSGLT2 con un FGe \\>15 ml/min de forma indiscriminada, sin más matices.","En pacientes con DM y enfermedad cardiovascular previa se debe añadir una estatina de alta intensidad para lograr una reducción del LDL-c de más del 50%."],"c":"C","e":"El umbral de FGe para iniciar iSGLT2 varía según el fármaco concreto y la ficha técnica (habitualmente no se recomienda su INICIO por debajo de determinados umbrales, en torno a 20-25 ml/min según el principio activo), por lo que fijar un límite único de «FGe \\>15» de forma indiscriminada y sin matices no es correcto."},{"q":"Respecto al tratamiento de la diabetes mellitus, señale la afirmación INCORRECTA según las recomendaciones de la Sociedad Española de Medicina Interna:","o":["Se recomienda plantear tratamiento combinado de inicio.","Se debe priorizar arGLP-1 y/o iSGLT2 independientemente del objetivo de HbA1c y del uso de metformina, si hay riesgo cardiovascular alto o muy alto.","En mayores de 75 años, el tratamiento debe considerarse con independencia de la presencia de fragilidad.","En caso de sobrepeso u obesidad, tiene especial relevancia utilizar fármacos asociados a reducción de peso, como semaglutida o tirzepatida."],"c":"C","e":"En pacientes mayores de 75 años, la fragilidad es un factor determinante que SÍ debe tenerse en cuenta para individualizar los objetivos de control y la selección terapéutica (simplificando el tratamiento y evitando la hipoglucemia en pacientes frágiles), no debiendo tratarse «con independencia» de esta condición."},{"q":"Varón de 40 años cuya esposa ha notado engrosamiento de los rasgos faciales en los últimos años. Refiere disminución de la libido y astenia. Exploración: prominencia frontal y manos agrandadas. RM: masa hipofisaria. ¿Qué prueba solicitaría para confirmar la causa?","o":["Cortisol libre en orina de 24 horas.","ACTH.","Hormona del crecimiento (GH) aislada.","Factor de crecimiento similar a la insulina tipo 1 (IGF-1)."],"c":"D","e":"El IGF-1, que refleja de forma estable la secreción integrada de GH a lo largo del día (a diferencia de la GH aislada, de secreción pulsátil y poco fiable en una determinación única), es la prueba de cribado bioquímico de elección ante la sospecha clínica de acromegalia (engrosamiento facial, acromegalia acral, masa hipofisaria)."},{"q":"De los siguientes factores de riesgo vascular, ¿cuál se relaciona específicamente con la trombosis venosa?","o":["Diabetes mellitus.","Traumatismos quirúrgicos.","Hipertrigliceridemia.","Hipertensión arterial."],"c":"B","e":"Los traumatismos y la cirugía son factores de riesgo clásicos de trombosis venosa (por inmovilización, daño endotelial y activación de la coagulación), a diferencia de la diabetes, la hipertensión arterial o la hipertrigliceridemia, que son factores de riesgo fundamentalmente de enfermedad arterial (aterosclerótica), no venosa."},{"q":"Respecto a la cetoacidosis diabética, es CIERTO que:","o":["Los síntomas tardan semanas en presentarse.","Suele cursar con diarrea, bradicardia, hipertensión arterial y fiebre.","Es más frecuente en pacientes con diabetes mellitus tipo 2 no diagnosticada.","Se caracteriza por hiperglucemia (\\>250 mg/dl), cetosis y acidosis metabólica (bicarbonato sérico \\<15-18 mmol/l)."],"c":"D","e":"La cetoacidosis diabética se define bioquímicamente por la tríada de hiperglucemia (habitualmente \\>250 mg/dl), cetosis (cetonemia/cetonuria positiva) y acidosis metabólica con bicarbonato descendido; su instauración es habitualmente rápida (horas-pocos días, no semanas), cursa típicamente con taquicardia e hipotensión (no bradicardia/hipertensión), y es más característica del debut o descompensación de la diabetes tipo 1 (aunque también puede verse en tipo 2 en determinadas circunstancias)."},{"q":"Varón de 47 años con HTA, obesidad y vida sedentaria. TA 148/92, IMC 32, cintura 94 cm. Glucemia 98 mg/dl, colesterol total 220 mg/dl con LDL 103, HDL 28, triglicéridos 178 mg/dl. Es cierto que:","o":["Tiene síndrome metabólico, pues cumple 3 de 5 criterios: HTA, elevación de triglicéridos e IMC \\>30.","Tiene síndrome metabólico, pues cumple 3 de 5 criterios: elevación de triglicéridos, HDL bajo e IMC \\>30.","El diagnóstico de síndrome metabólico precisa de más de una evaluación en un plazo de 3-6 meses.","Las principales características del síndrome metabólico son obesidad central, hipertrigliceridemia, HDL bajo, hiperglucemia e hipertensión arterial."],"c":"D","e":"Los cinco componentes clásicos del síndrome metabólico son la obesidad central (perímetro de cintura), la hipertrigliceridemia, el colesterol HDL bajo, la hiperglucemia/resistencia a la insulina y la hipertensión arterial; el diagnóstico se establece con una única evaluación que cumpla al menos tres de estos cinco criterios, sin necesidad de confirmación diferida en el tiempo."}]},"48":{"title":"Alteraciones de las glándulas paratiroides y del metabolismo del calcio. Hipocalcemia e hipercalcemia. Osteoporosis.","questions":[{"q":"La asociación de alteraciones metabólicas más característica en la insuficiencia renal crónica en estadios avanzados es:","o":["Hiperpotasemia, hipofosforemia, hipercalcemia y acidosis metabólica.","Hipopotasemia, hipofosforemia, hipocalcemia y acidosis metabólica.","Hiperpotasemia, hiperfosforemia, hipocalcemia y acidosis metabólica.","Hiperpotasemia, hiperfosforemia, hipocalcemia y alcalosis metabólica."],"c":"C","e":"En la ERC avanzada, la reducción del filtrado glomerular condiciona retención de potasio y fósforo (hiperpotasemia, hiperfosforemia), junto con hipocalcemia (por déficit de vitamina D activa y quelación por el fósforo elevado) y acidosis metabólica, el patrón clásico de la uremia crónica que da lugar al hiperparatiroidismo secundario."},{"q":"Paciente de 32 años con calcio de 11 mg/dl (normal \\<10,5) y PTH de 45 pg/ml (normal 10-55). ¿Cuál es la siguiente prueba que pediría?","o":["25-OH vitamina D.","Cociente calcio/creatinina en orina de 24 horas.","Gammagrafía con Tc99-sestamibi.","PTHrP."],"c":"B","e":"Ante una hipercalcemia con PTH inadecuadamente normal-alta (no suprimida), antes de asumir un hiperparatiroidismo primario y solicitar pruebas de localización, debe descartarse la hipercalcemia hipocalciúrica familiar mediante el cociente calcio/creatinina en orina de 24 horas, entidad benigna que no requiere cirugía."},{"q":"Mujer de 80 años, con HTA, DM2, hipercolesterolemia y obesidad, ingresada tras fractura de cadera derecha, intervenida con buena evolución. Al alta, ¿qué tratamiento recomendaría para la osteoporosis?","o":["Risedronato.","Teriparatida.","Raloxifeno.","Únicamente calcio y vitamina D."],"c":"B","e":"En una osteoporosis grave con una fractura mayor reciente (cadera), sobre todo en pacientes de edad avanzada y alto riesgo de nueva fractura, el tratamiento anabólico con teriparatida (que estimula la formación ósea, a diferencia de los antirresortivos) constituye una opción preferente, especialmente indicada en fracturas de alto riesgo; el raloxifeno no está indicado en este contexto (no reduce el riesgo de fractura de cadera) y el calcio/vitamina D en monoterapia es insuficiente tras una fractura mayor."},{"q":"¿Cuál de las siguientes NO es una manifestación clínica característica del mieloma múltiple?","o":["Dolores óseos.","Adenopatías.","Insuficiencia renal.","Hipercalcemia."],"c":"B","e":"Las adenopatías no forman parte de las manifestaciones clásicas del mieloma múltiple (proceso fundamentalmente medular, no ganglionar), a diferencia del dolor óseo (por lesiones osteolíticas), la insuficiencia renal (por cilindros de cadenas ligeras, hipercalcemia, entre otras causas) y la hipercalcemia (por resorción ósea mediada por citocinas), que sí son características de la enfermedad (tríada CRAB: hipercalcemia, insuficiencia renal, anemia, lesiones óseas)."},{"q":"Marque la determinación analítica más valorable para determinar la etiología de una hipocalcemia:","o":["Magnesio sérico.","Metabolitos de vitamina D.","Concentración sérica de PTH.","Fosfato sérico."],"c":"C","e":"La determinación de PTH es la prueba fundamental que orienta el diagnóstico diferencial etiológico de la hipocalcemia, permitiendo distinguir entre causas con PTH baja/inapropiadamente normal (hipoparatiroidismo) y causas con PTH elevada apropiadamente (resistencia periférica, déficit de vitamina D, hipomagnesemia grave que inhibe la secreción de PTH)."},{"q":"Varón de 75 años, fumador, con carcinoma de próstata sin enfermedad metastásica en tratamiento con antiandrógenos, con densidad mineral ósea con T-score -2,5. Además de calcio y vitamina D, ¿qué tratamiento propone?","o":["Únicamente un programa de ejercicio físico estructurado.","Alendronato.","Denosumab.","Teriparatida."],"c":"C","e":"El denosumab ha demostrado eficacia específica en la prevención de la pérdida ósea inducida por la deprivación androgénica en el cáncer de próstata, siendo una opción de tratamiento bien establecida en este contexto clínico concreto de osteoporosis secundaria a terapia hormonal."},{"q":"En la enfermedad de Gaucher es cierto que:","o":["Se asocia con mieloma precoz.","La esplenomegalia es excepcional.","Cursa con osteoporosis.","La tubulopatía renal es frecuente."],"c":"C","e":"La enfermedad de Gaucher (déficit de glucocerebrosidasa, con acumulación de esfingolípidos en macrófagos) cursa característicamente con esplenomegalia MASIVA (no excepcional), afectación ósea con osteoporosis y crisis óseas (por infiltración de la médula ósea), y no se relaciona típicamente con tubulopatía renal ni con mieloma precoz."},{"q":"Mujer de 70 años previamente tratada con alendronato, con fracturas osteoporóticas sintomáticas recientes en columna dorsal, DMO T-score -3, con calcio, vitamina D y PTH normales. ¿Cuál le parece la opción de tratamiento más adecuada?","o":["Volver a tratamiento con bifosfonatos por vía intravenosa.","Iniciar tratamiento con denosumab.","Iniciar tratamiento con teriparatida.","Iniciar tratamiento combinado de teriparatida y bifosfonatos."],"c":"C","e":"Ante fracturas osteoporóticas incidentes a pesar de tratamiento antirresortivo previo (fracaso terapéutico), el cambio a un fármaco anabólico como la teriparatida es la estrategia recomendada, ya que estimula activamente la formación ósea en lugar de solo frenar la resorción, siendo especialmente útil en osteoporosis grave con fracturas recientes."},{"q":"Entre los factores de riesgo de fracturas por osteoporosis, NO se encuentra:","o":["Edad avanzada.","Tabaquismo.","Género masculino.","Alcoholismo."],"c":"C","e":"El sexo FEMENINO (no el masculino) es un factor de riesgo reconocido de fractura osteoporótica, por la menor masa ósea pico y la pérdida acelerada tras la menopausia; edad avanzada, tabaquismo y consumo excesivo de alcohol sí son factores de riesgo bien establecidos en ambos sexos."},{"q":"En cuanto a la osteoporosis por glucocorticoides, señale la opción FALSA:","o":["La pérdida de masa ósea producida por los corticoides se puede evitar, y también es posible reducir de manera significativa el riesgo de fracturas.","Alendronato no ha demostrado eficacia en la reducción del riesgo de fracturas en este contexto.","La teriparatida está aprobada para su uso en la osteoporosis inducida por glucocorticoides.","Todos los pacientes que toman glucocorticoides de forma prolongada deberían recibir dosis adecuadas de calcio y vitamina D."],"c":"B","e":"El alendronato (y otros bifosfonatos) sí ha demostrado eficacia en la prevención de la pérdida ósea y la reducción del riesgo de fracturas asociadas al uso prolongado de glucocorticoides, siendo un tratamiento de primera línea reconocido en esta indicación."},{"q":"¿Cuál de los siguientes trastornos es característico de la presentación de la osteomalacia del adulto?","o":["Arqueamiento de la tibia como hallazgo predominante.","Hipocalcemia como hallazgo constante.","Pseudofracturas (líneas de Looser-Milkman).","Hiperfosfatemia."],"c":"C","e":"Las pseudofracturas o líneas de Looser-Milkman (bandas radiotransparentes perpendiculares a la cortical ósea) constituyen el hallazgo radiológico característico y prácticamente patognomónico de la osteomalacia del adulto; la hipocalcemia no siempre está presente (puede haber mecanismos compensadores) y lo típico es la HIPOfosfatemia, no la hiperfosfatemia."},{"q":"Mujer de 72 años con osteoporosis grave que consulta por disnea, no fumadora, sin exposición a factores de riesgo relevantes. Exploración: cifoescoliosis grave. Cabe esperar las siguientes anormalidades pulmonares, EXCEPTO:","o":["Neumopatía restrictiva.","Alteraciones en la relación ventilación/perfusión con hipoxemia.","Hipertensión pulmonar.","Neumopatía obstructiva."],"c":"D","e":"La cifoescoliosis grave produce una deformidad de la caja torácica que limita la expansión pulmonar, generando un patrón RESTRICTIVO (con las consiguientes alteraciones V/Q, hipoxemia crónica e hipertensión pulmonar secundaria), pero no un patrón obstructivo, que no es una consecuencia esperable de esta deformidad de la pared torácica."},{"q":"¿Cuál de las siguientes afirmaciones es correcta en relación a la epidemiología de la osteoporosis y las fracturas óseas?","o":["Después de los 70 años, la incidencia de fracturas de cadera aumenta un 25% cada 5 años.","La frecuencia de fracturas del radio distal aumenta antes de los 50 años y alcanza su valor máximo hacia los 60, con un incremento posterior más modesto asociado al envejecimiento.","La mayoría de las mujeres de 60 a 70 años cumplen criterios diagnósticos de osteoporosis.","El riesgo de fractura de cadera es igual entre mujeres de raza blanca y de raza negra."],"c":"B","e":"Las fracturas de radio distal (de Colles), a diferencia de las de cadera, tienen un patrón epidemiológico particular: su incidencia aumenta ya antes de los 50 años y alcanza un pico hacia los 60, con un incremento posterior mucho más discreto que el de las fracturas de cadera, cuya incidencia se dispara de forma mucho más marcada en edades avanzadas."},{"q":"¿Cuál de los siguientes fármacos para el tratamiento de la osteoporosis NO causa osteonecrosis mandibular ni fractura atípica de fémur como efecto adverso?","o":["Zoledronato.","Denosumab.","Alendronato.","Teriparatida."],"c":"D","e":"La osteonecrosis mandibular y la fractura atípica de fémur son efectos adversos característicos de los fármacos ANTIRRESORTIVOS potentes (bifosfonatos y denosumab), relacionados con la supresión excesiva del remodelado óseo; la teriparatida, al ser un fármaco ANABÓLICO (estimula la formación ósea en lugar de inhibir la resorción), no se ha asociado a estos efectos adversos."},{"q":"Mujer de 79 años que ingresa por fractura osteoporótica de cadera. Respecto a la prevención secundaria de fracturas por fragilidad, señale la respuesta INCORRECTA:","o":["La baja adherencia al tratamiento se asocia a un incremento del riesgo de fractura.","Los marcadores de remodelado óseo pueden ser útiles para monitorizar de forma precoz la respuesta al tratamiento.","La vitamina D en monoterapia es eficaz en la reducción de dichas fracturas en personas mayores no institucionalizadas.","El aumento de calcio dietético o la toma aislada de suplementos de calcio no protegen frente a la aparición de fracturas."],"c":"C","e":"La vitamina D en MONOTERAPIA (sin calcio ni tratamiento antirresortivo/anabólico asociado) no ha demostrado ser eficaz para reducir el riesgo de fracturas en personas mayores no institucionalizadas; su beneficio se ha demostrado sobre todo asociada a calcio, especialmente en personas institucionalizadas con déficit franco."},{"q":"¿Cuál de estas formas clínicas NO se observa en la encefalopatía por hipocalcemia?","o":["Tetania.","Convulsiones.","Delirio.","Paraparesia."],"c":"D","e":"La paraparesia no es una manifestación característica de la hipocalcemia aguda; la encefalopatía hipocalcémica cursa típicamente con hiperexcitabilidad neuromuscular (tetania), crisis comiciales y alteraciones del nivel de consciencia (delirio, confusión), pero no con déficit motor de tipo paraparesia."},{"q":"La afección renal más frecuente en el mieloma múltiple es:","o":["Amiloidosis renal.","Hipercalcemia.","Nefropatía por cilindros mielomatosos (riñón de mieloma).","Nefropatía por depósito de cadenas ligeras."],"c":"C","e":"La nefropatía por cilindros de cadenas ligeras (riñón de mieloma), causada por la precipitación tubular de cadenas ligeras libres filtradas en exceso, es la causa más frecuente de insuficiencia renal en el mieloma múltiple, por delante de la amiloidosis AL y la enfermedad por depósito de cadenas ligeras."},{"q":"Una mujer de 18 años, con antecedentes familiares de neoplasia endocrina múltiple tipo 1 (padre y dos tías), resulta portadora del gen MEN1 tras estudio genético. ¿Cuál de las siguientes condiciones se presenta primero, y con mayor frecuencia, en los portadores de esta mutación?","o":["Amenorrea.","Hipercalcemia (por hiperparatiroidismo primario).","Hipoglucemia.","Úlcera péptica."],"c":"B","e":"El hiperparatiroidismo primario, con la consiguiente hipercalcemia, es la manifestación más precoz y de mayor penetrancia en los portadores de mutaciones del gen MEN1, apareciendo antes y con mayor frecuencia que las manifestaciones pancreáticas (hipoglucemia por insulinoma, úlcera péptica por gastrinoma) o hipofisarias."},{"q":"La condrocalcinosis se puede asociar a todas EXCEPTO a una de las siguientes entidades:","o":["Hipofosfatasia.","Hipomagnesemia.","Hiperparatiroidismo.","Hipogonadismo."],"c":"D","e":"El hipogonadismo no es una causa metabólica reconocida de condrocalcinosis (depósito de pirofosfato cálcico dihidratado), a diferencia de la hipofosfatasia, la hipomagnesemia y el hiperparatiroidismo, que sí se han asociado clásicamente a esta entidad."}]},"49":{"title":"Alteraciones del metabolismo de las lipoproteínas.","questions":[{"q":"¿Es un criterio START, según la 3ª versión española de los criterios STOPP/START?","o":["Tratamiento con betabloqueantes en pacientes mayores con fibrilación auricular crónica y mal control de la frecuencia.","Tratamiento con digoxina como fármaco de primera línea para el control de la frecuencia cardiaca a largo plazo, en pacientes mayores con fibrilación auricular.","Tratamiento con iSGLT2 en la insuficiencia cardiaca sintomática, exclusivamente en pacientes mayores diabéticos.","Tratamiento con estatinas en pacientes mayores con fragilidad grave y antecedente bien documentado de enfermedad vascular coronaria, cerebral o periférica."],"c":"D","e":"Los criterios START (Screening Tool to Alert doctors to Right Treatment) señalan tratamientos que deberían INICIARSE si no están prescritos y están indicados; las estatinas en prevención secundaria bien documentada, incluso en pacientes con fragilidad, siguen aportando beneficio y constituyen un criterio START reconocido, mientras que las otras opciones describen prácticas poco recomendadas (digoxina como primera línea, iSGLT2 restringido solo a diabéticos en IC) o criterios STOPP en lugar de START."},{"q":"Varón de 56 años dislipémico e hipertenso, con infarto de miocardio hace tres años, en tratamiento con atorvastatina 80 mg y colesterol LDL de 63 mg/dl. ¿Cuál de las siguientes opciones sobre la modificación del tratamiento es más adecuada?","o":["Mantener el mismo tratamiento, ya que está en objetivo y no ha tenido nuevos eventos.","Reducir la dosis de estatina, dado que mantiene estabilidad tras tres años.","Añadir ezetimiba, ya que este paciente no se encuentra en el objetivo terapéutico.","Añadir gemfibrozilo 900 mg diarios, por su efecto sinérgico para conseguir el objetivo."],"c":"C","e":"En prevención secundaria de muy alto riesgo cardiovascular, el objetivo actual de LDL-c es \\<55 mg/dl (y una reducción ≥50% respecto al basal); una cifra de 63 mg/dl, aunque cercana, no alcanza estrictamente ese objetivo, por lo que está indicado intensificar el tratamiento hipolipemiante añadiendo ezetimiba antes de plantear reducir la estatina o combinar con un fibrato (que no está indicado para este fin y añade riesgo de miopatía en combinación con estatinas)."},{"q":"Según el protocolo de uso de anticuerpos monoclonales anti-PCSK9, todas las siguientes son indicaciones del tratamiento, MENOS UNA. Señálela:","o":["Paciente con enfermedad cardiovascular establecida, con LDL-c no controlado con dosis máximas toleradas de estatinas de alta potencia y otras opciones, durante al menos 6 meses.","Paciente con hipercolesterolemia familiar no controlada tras tratamiento con dosis máxima tolerada de estatina de alta potencia y otras opciones.","Cualquiera de los pacientes anteriores que sean intolerantes a estatinas o en los que estas estén contraindicadas.","Paciente sin enfermedad cardiovascular establecida, con LDL-c no controlado, intolerante a estatinas por efectos musculoesqueléticos."],"c":"D","e":"Un paciente sin enfermedad cardiovascular establecida ni el diagnóstico específico de hipercolesterolemia familiar, cuya única característica sea la intolerancia a estatinas, no cumple por sí solo los criterios habituales de indicación de los anticuerpos anti-PCSK9, que se reservan para pacientes de alto/muy alto riesgo con enfermedad cardiovascular establecida o hipercolesterolemia familiar no controlada."},{"q":"Un paciente con antecedentes de SCASEST reciente presenta LDL colesterol de 184 mg/dl, elevación moderada de transaminasas, esteatosis hepática ecográfica y fibrosis F3 en el fibroscan a los 24 años. ¿Cuál de los siguientes diagnósticos es el más probable?","o":["Enfermedad de Krabbe.","Déficit de lipasa ácida lisosomal.","Enfermedad de Gaucher.","Déficit de esfingomielinasa ácida."],"c":"B","e":"El déficit de lipasa ácida lisosomal es una enfermedad de depósito lisosomal que produce dislipemia grave (LDL muy elevado) junto con esteatohepatitis progresiva y fibrosis hepática a edades tempranas, con alto riesgo cardiovascular precoz, un cuadro que encaja con este paciente joven con SCA e hígado graso avanzado."},{"q":"Respecto al tratamiento farmacológico en pacientes obesos, ¿cuál es la respuesta INCORRECTA?","o":["El tratamiento farmacológico está indicado en pacientes con IMC\\>30, o con sobrepeso (IMC 27-29,9) y comorbilidad asociada.","El uso de semaglutida 2,4 mg subcutánea semanal se asocia a mayores pérdidas de peso globales que el uso de liraglutida 3 mg subcutánea diaria.","Se consideran fármacos de primera línea los agonistas de GLP-1 (semaglutida, liraglutida) y el agonista dual GLP-1/GIP tirzepatida.","Se ha demostrado que tanto semaglutida 2,4 mg semanal como liraglutida 3 mg diaria reducen de forma significativa el riesgo de eventos cardiovasculares en adultos no diabéticos con enfermedad cardiovascular establecida."],"c":"D","e":"Únicamente semaglutida 2,4 mg (ensayo SELECT) ha demostrado reducir de forma significativa los eventos cardiovasculares en adultos con sobrepeso/obesidad y enfermedad cardiovascular establecida sin diabetes; no existe evidencia equivalente de ensayos de resultados cardiovasculares para liraglutida 3 mg (dosis de obesidad) en
