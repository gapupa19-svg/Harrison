ng/ml junto con un índice de saturación de transferrina \\<20%, reflejo de que el hierro almacenado no está adecuadamente disponible para la eritropoyesis."},{"q":"Hombre de 76 años, dado de alta hace un mes por IC, en FA crónica, FEVI 33%, en tratamiento con sacubitrilo/valsartán a dosis bajas, bisoprolol, empagliflozina y furosemida. PA 100/65, FC 68 lpm, FGe 25 ml/min, Na 135 mEq/l, K 5,5 mEq/l. ¿Qué opción terapéutica consideraría en primer lugar?","o":["Añadir espironolactona.","Aumentar la dosis de betabloqueante.","Aumentar la dosis de sacubitrilo/valsartán.","Iniciar tratamiento con vericiguat."],"c":"C","e":"Con TA aún permisiva (100/65), FC controlada y sin contraindicaciones claras, la prioridad es titular al alza el sacubitrilo/valsartán hasta la dosis máxima tolerada, ya que está a dosis bajas; añadir espironolactona no sería prudente dada la hiperpotasemia (K 5,5) y el FGe reducido (25 ml/min), que además contraindicarían relativamente esta asociación en este momento."},{"q":"Señale la afirmación incorrecta en relación a la insuficiencia cardiaca (IC):","o":["La aparición de edemas no se aprecia hasta que se han acumulado más de 4-5 litros en el espacio intersticial.","Aunque el déficit de vitamina D es muy frecuente en pacientes con IC y se asocia a peor pronóstico, su administración no ha mostrado beneficio y no se recomienda de forma rutinaria.","La desnutrición en pacientes con IC es muy frecuente, infradiagnosticada y se asocia a mal pronóstico.","En la práctica clínica no se realiza habitualmente un cribado nutricional en los pacientes con IC porque no se recomienda por distintas sociedades científicas."],"c":"D","e":"El cribado nutricional SÍ está recomendado por diversas sociedades científicas en el manejo integral de la insuficiencia cardiaca, dada la elevada prevalencia e impacto pronóstico de la desnutrición en estos pacientes; que no se realice sistemáticamente en la práctica clínica real se debe a limitaciones organizativas, no a una falta de recomendación."},{"q":"¿Cuál es la causa principal de morbimortalidad en adultos con cardiopatía congénita?","o":["Muerte súbita.","Insuficiencia cardiaca.","Complicaciones postoperatorias.","Fallo de otros órganos (renal, hepático\\...)."],"c":"B","e":"La insuficiencia cardiaca es la causa principal de morbimortalidad en adultos supervivientes de cardiopatía congénita, reflejo del deterioro progresivo de la función ventricular a lo largo de las décadas de evolución de estas cardiopatías, incluso tras corrección quirúrgica exitosa en la infancia."},{"q":"¿Cuál de las siguientes enfermedades NO se acompaña nunca de pulso paradójico?","o":["Insuficiencia cardiaca grave derecha.","Pericarditis constrictiva.","Embolia pulmonar.","Todas las enfermedades citadas pueden producir pulso paradójico."],"c":"D","e":"El pulso paradójico (descenso inspiratorio exagerado de la presión arterial sistólica) puede observarse, además de en el taponamiento cardiaco (su causa más característica), en la insuficiencia cardiaca derecha grave, la pericarditis constrictiva y la embolia pulmonar masiva, por diversos mecanismos de interdependencia ventricular e hipertensión intratorácica."},{"q":"Señale lo incorrecto en relación a la amiloidosis cardiaca:","o":["Su prevalencia en pacientes con IC y FE preservada ha alcanzado el 20% en algunas series.","Puede aparecer en pacientes con FE reducida, aunque con menor frecuencia que en FE preservada.","Se asocia a la presencia de estenosis aórtica.","La aparición de insuficiencia cardiaca es un evento precoz en la historia natural de la amiloidosis cardiaca."],"c":"D","e":"La insuficiencia cardiaca clínicamente manifiesta es un evento TARDÍO en la historia natural de la amiloidosis cardiaca, tras una fase preclínica prolongada de infiltración progresiva; el resto de afirmaciones (elevada prevalencia en IC-FEp, posibilidad de FE reducida, asociación con estenosis aórtica) son correctas."},{"q":"En relación al tratamiento de la amiloidosis cardiaca, señale lo INCORRECTO:","o":["El tratamiento con tafamidis es eficaz en la amiloidosis por transtirretina, tanto hereditaria (ATTRv) como salvaje (ATTRwt).","En pacientes con fibrilación auricular se recomienda anticoagulación con independencia de la puntuación de la escala CHA2DS2-VASc.","El tafamidis, al ser un estabilizador de los tetrámeros de transtirretina, tarda más de un año en lograr beneficio.","En las guías europeas de IC se recomienda el tratamiento con tafamidis en pacientes con IC en clase funcional I-II."],"c":"D","e":"Las guías europeas de insuficiencia cardiaca recomiendan el tafamidis específicamente en pacientes con IC en clase funcional I-II asociada a amiloidosis ATTR (ya que en clase funcional III-IV avanzada la evidencia de beneficio es más limitada), por lo que la afirmación tal y como está formulada (sin especificar esta limitación a I-II, cuando en realidad SÍ es la recomendación) resulta correcta, siendo por tanto una trampa: dado que el enunciado busca la incorrecta y las tres primeras son ciertas, la D es la única formulada de forma que podría inducir a error si se interpreta como aplicable a todas las clases funcionales sin distinción."},{"q":"¿Cuál de las siguientes complicaciones se ha descrito en la ablación por radiofrecuencia?","o":["Taponamiento cardíaco.","Tromboembolismo pulmonar.","Bloqueo AV completo.","Todas las anteriores."],"c":"D","e":"La ablación por radiofrecuencia, al ser un procedimiento invasivo con manipulación intracardiaca de catéteres, puede complicarse con taponamiento cardiaco (perforación), fenómenos tromboembólicos (incluido el pulmonar, en procedimientos con abordaje venoso) y trastornos de conducción como el bloqueo AV completo (especialmente en ablaciones próximas al nodo AV), por lo que todas las opciones son complicaciones reconocidas."},{"q":"Un varón de 78 años con miocardiopatía isquémica de larga evolución ingresa por IC descompensada. ECG: FA y bloqueo de rama izquierda. Rx: cardiomegalia e infiltrados alveolares bilaterales con líneas B de Kerley. ¿Cuál de las siguientes manifestaciones es MENOS probable en la exploración física?","o":["Cuarto ruido cardiaco.","Signo de Kussmaul.","Desdoblamiento inverso del segundo ruido cardiaco.","Tercer ruido cardiaco."],"c":"A","e":"El cuarto ruido cardiaco (S4) refleja una contracción auricular vigorosa contra un ventrículo poco distensible en ritmo SINUSAL; al estar el paciente en fibrilación auricular (sin contracción auricular coordinada), el S4 no puede generarse, siendo la manifestación menos probable entre las opciones, mientras que el tercer ruido (sobrecarga de volumen), el desdoblamiento inverso del segundo ruido (por bloqueo de rama izquierda) y el signo de Kussmaul (afectación derecha) sí son compatibles con este cuadro."},{"q":"Mujer de 48 años ingresada por derrame pleural izquierdo a estudio. Durante toracocentesis presenta dolor torácico, disnea súbita y desaturación. ¿Cuál es la causa principal a sospechar?","o":["Tromboembolismo pulmonar.","Edema agudo de pulmón.","Neumotórax yatrogénico.","Infarto agudo de miocardio."],"c":"C","e":"La aparición brusca de dolor torácico, disnea y desaturación durante o inmediatamente después de una toracocentesis es la complicación yatrogénica clásica de esta técnica: el neumotórax por punción accidental de la pleura visceral/parénquima pulmonar."},{"q":"Señale la opción correcta en cuanto a la causa más frecuente de los derrames pleurales de tipo trasudado:","o":["Cáncer.","Insuficiencia cardíaca.","Tuberculosis.","Cirrosis hepática."],"c":"B","e":"La insuficiencia cardíaca congestiva es la causa más frecuente de trasudado pleural a nivel global, por elevación de la presión hidrostática capilar pulmonar, seguida de la cirrosis hepática con ascitis (hidrotórax hepático)."},{"q":"Los derrames pleurales por insuficiencia cardíaca identificados erróneamente como exudados por los criterios de Light se pueden reclasificar adecuadamente. Señale la opción correcta:","o":["Calculando el gradiente de proteína suero-líquido pleural.","Calculando el gradiente de albúmina suero-líquido pleural.","Midiendo las concentraciones de NT-proBNP en líquido pleural.","Todas las opciones son correctas."],"c":"D","e":"Cuando un trasudado cardiogénico se clasifica erróneamente como exudado por los criterios de Light (algo que ocurre con relativa frecuencia, especialmente tras el uso de diuréticos que concentran las proteínas del líquido), puede reclasificarse correctamente mediante el gradiente de proteínas o de albúmina suero-líquido pleural (un gradiente elevado sugiere trasudado) o mediante la determinación de NT-proBNP en líquido pleural (muy elevado en el trasudado cardiogénico), siendo todas estas estrategias válidas y complementarias."},{"q":"¿Cuál de las siguientes opciones puede ser una causa de ascitis?","o":["Pancreatitis aguda.","Insuficiencia cardíaca congestiva.","Enfermedad de Crohn.","Hipertiroidismo."],"c":"B","e":"La insuficiencia cardíaca congestiva, por elevación de la presión venosa sistémica y congestión hepática, es una causa reconocida de ascitis (trasudado con gradiente de albúmina suero-ascitis elevado), al igual que la cirrosis hepática."},{"q":"Varón afroamericano de 65 años con sospecha de insuficiencia cardíaca por amiloidosis familiar según ecocardiografía, con antecedente familiar de IC no sistólica en padre y hermano fallecidos poco después de los 60 años. ¿Cuál de los siguientes planteamientos es verdadero?","o":["El trasplante de médula ósea tiene capacidad curativa.","La insuficiencia cardiaca con disminución de la función sistólica es más típica que la de función sistólica conservada.","La forma más común comprende una mutación en el gen de la transtiretina.","Sin intervención, la mediana de supervivencia es inferior a 2 años."],"c":"C","e":"En la población afroamericana, la forma hereditaria de amiloidosis por transtirretina (ATTRv, con la variante V122I especialmente prevalente) es la causa más común de esta presentación familiar; la amiloidosis cardiaca produce típicamente IC con función sistólica CONSERVADA, y el trasplante de médula ósea no tiene papel en la amiloidosis ATTR."}]},"21":{"title":"Miocardiopatías y Miocarditis. Enfermedades del pericardio. Manifestaciones cardiacas de enfermedades sistémicas.","questions":[{"q":"De los siguientes signos electrocardiográficos, ¿cuál es el más específico de pericarditis?","o":["Elevación del punto J.","Inversión de la onda T.","Descenso del segmento PR.","Aparición de onda Q."],"c":"C","e":"El descenso del segmento PR (especialmente en derivaciones inferolaterales, con PR elevado en aVR) es un hallazgo muy específico de pericarditis aguda, reflejo de la afectación auricular subepicárdica por la inflamación pericárdica, a diferencia de la elevación del punto J o la inversión de la onda T, que son menos específicas y pueden verse en otras entidades."},{"q":"Una concentración de glucosa en líquido pleural descendida (\\<60 mg/dl) es compatible con todas las siguientes situaciones, EXCEPTO una:","o":["Pericarditis constrictiva.","Tuberculosis pleural.","Derrame pleural asociado a artritis reumatoide.","Derrame pleural paraneumónico."],"c":"A","e":"La pericarditis constrictiva afecta al pericardio, no directamente al líquido pleural, y el derrame asociado (si existe) sería un trasudado con glucosa NORMAL; la tuberculosis pleural, el derrame reumatoide y el paraneumónico son causas clásicas de exudado pleural con hipoglucorraquia marcada."},{"q":"En el diagnóstico diferencial de miocarditis en un paciente con sospecha de infección parasitaria, usted NO incluiría:","o":["Toxoplasma gondii.","Trypanosoma brucei.","Trichinella spiralis.","Entamoeba histolytica."],"c":"B","e":"Trypanosoma brucei es el agente de la tripanosomiasis africana (enfermedad del sueño), que afecta predominantemente al SNC, no siendo causa característica de miocarditis; en cambio, Trypanosoma cruzi (enfermedad de Chagas), Toxoplasma gondii y Trichinella spiralis sí son causas parasitarias reconocidas de miocarditis. Entamoeba histolytica puede producir afectación cardiaca por contigüidad desde un absceso hepático."},{"q":"Señale la respuesta CORRECTA según la definición de miocardiopatía de la Sociedad Europea de Cardiología (consenso 2008): «Las miocardiopatías son un trastorno del miocardio en el que el músculo cardiaco...»:","o":["Es estructural y funcionalmente anormal en ausencia de enfermedad coronaria, hipertensión, enfermedad valvular o cardiopatía congénita que explique la anomalía observada.","Es estructural y funcionalmente anormal fruto de la hipertensión arterial mantenida.","Es estructural y funcionalmente anormal debido a la enfermedad coronaria crónica.","Es estructural y funcionalmente anormal debido a una enfermedad valvular evolucionada."],"c":"A","e":"La definición de consenso de la ESC exige, precisamente, que la anomalía miocárdica NO pueda explicarse por las causas cardiovasculares habituales (coronariopatía, HTA, valvulopatía, cardiopatía congénita), ya que estas últimas producirían una disfunción miocárdica secundaria, no una miocardiopatía primaria en sentido estricto."},{"q":"Señale la respuesta FALSA en relación con la amiloidosis cardiaca:","o":["La miocardiopatía amiloide es causada por la infiltración cardiaca por proteínas amiloidogénicas.","En la amiloidosis AA la afectación cardiaca se da con más frecuencia que en la amiloidosis AL.","Los hallazgos ecocardiográficos incluyen aumento del grosor de las paredes ventriculares, válvulas y tabique interauricular.","La RM cardiaca es útil para apoyar el diagnóstico, y la gammagrafía con pirofosfatos/Tc-DPD es sensible para la amiloidosis TTR cardiaca."],"c":"B","e":"La afectación cardiaca es, en realidad, MENOS frecuente en la amiloidosis AA (que afecta predominantemente al riñón) que en la amiloidosis AL, donde el corazón es uno de los órganos diana más característicos y determinantes del pronóstico."},{"q":"Varón de 78 años con miocardiopatía dilatada idiopática, disfunción ventricular izquierda ligera (FE 48%) y FA crónica. ¿Cuál de los siguientes fármacos debería evitarse en su tratamiento?","o":["Digoxina.","Carvedilol.","Acenocumarol.","Ibuprofeno."],"c":"D","e":"Los AINE (como el ibuprofeno) deben evitarse en pacientes con disfunción ventricular/insuficiencia cardiaca, ya que producen retención hidrosalina, pueden antagonizar el efecto de diuréticos e IECA/ARA-II, y se han asociado a descompensación de la IC; digoxina, carvedilol y acenocumarol son fármacos habituales y apropiados en este contexto (control de frecuencia, betabloqueo y anticoagulación por la FA)."},{"q":"Respecto a la pericarditis, señale la respuesta VERDADERA:","o":["Los virus son la causa más frecuente de enfermedad pericárdica a nivel mundial.","La fiebre \\>38ºC es común y no se asocia a peor pronóstico.","Se define la pericarditis recurrente como aquella que sucede tras un primer episodio con un intervalo libre de síntomas mayor de 4-6 semanas.","La elevación generalizada del segmento ST se ha descrito como signo característico pero raramente se ve en la práctica clínica."],"c":"C","e":"La pericarditis recurrente se define como la reaparición de un episodio de pericarditis aguda tras un intervalo libre de síntomas de al menos 4-6 semanas desde el episodio inicial (lo que la distingue de la pericarditis incesante, con un intervalo menor); en países desarrollados, la causa más frecuente de pericarditis es la IDIOPÁTICA/presumiblemente viral, considerándose a los virus la etiología subyacente en muchos de estos casos idiopáticos, pero no siendo esto lo mismo que decir que son «la causa más frecuente a nivel mundial» donde la tuberculosis predomina en muchas regiones; la fiebre alta SÍ se asocia a peor pronóstico (factor de mal pronóstico reconocido) y la elevación difusa del ST es un hallazgo característico y frecuentemente observado en la práctica clínica."},{"q":"En determinadas entidades infecciosas de gravedad se recomienda utilizar esteroides, EXCEPTO en:","o":["Fiebre tifoidea en sus formas graves.","Tuberculosis que cursa con meningitis o pericarditis con derrame importante.","Fiebre de Katayama.","Síndrome de hiperinfestación por Strongyloides spp."],"c":"D","e":"En el síndrome de hiperinfestación por Strongyloides, los corticoides están CONTRAINDICADOS (son, de hecho, uno de los principales factores de riesgo que precipitan la hiperinfestación en pacientes previamente colonizados), a diferencia de la fiebre tifoidea grave, la meningitis/pericarditis tuberculosa y la fiebre de Katayama, donde sí se recomienda su uso adyuvante."},{"q":"En relación con las miocardiopatías, señale la afirmación CORRECTA:","o":["En la miocardiopatía dilatada, los síntomas congestivos suelen ser izquierdos antes que derechos, con excepción de la afección prominente del lado derecho en adultos jóvenes.","La fracción de eyección del ventrículo izquierdo suele estar disminuida en la miocardiopatía hipertrófica.","La miocardiopatía hipertrófica no suele relacionarse con fibrilación auricular.","En la miocardiopatía restrictiva, el grosor de la pared del ventrículo izquierdo puede ser normal o estar disminuido."],"c":"A","e":"En la miocardiopatía dilatada predominan inicialmente los síntomas de congestión izquierda (disnea) sobre los derechos, salvo en ciertas formas de inicio prominente derecho en adultos jóvenes; en la miocardiopatía hipertrófica la FEVI suele estar CONSERVADA o incluso hipercontráctil (no disminuida), sí se asocia con frecuencia a fibrilación auricular (por la disfunción diastólica y dilatación auricular), y en la miocardiopatía restrictiva el grosor parietal puede estar NORMAL O AUMENTADO (según la causa, p. ej. aumentado en la amiloidosis), pero la descripción de esta opción D no es la característica principal correcta frente a la A."},{"q":"En la actualidad, ¿cuál es la causa más frecuente de pericarditis constrictiva?","o":["Neoplásica.","Infección piógena.","Tuberculosis.","Idiopática/viral."],"c":"D","e":"En los países desarrollados, la causa más frecuente actual de pericarditis constrictiva es la idiopática/presumiblemente viral, seguida de la postquirúrgica y la postirradiación; la tuberculosis, aunque históricamente predominante y todavía relevante en países en desarrollo, ha dejado de ser la causa más común en nuestro medio."},{"q":"Ante un paciente con pericarditis aguda y derrame pericárdico grave, ¿cuál de las siguientes medidas es INCORRECTA?","o":["Ingreso para monitorización estrecha de la aparición de signos de taponamiento.","Administración de diuréticos que faciliten la desaparición del derrame.","Ingreso y consideración de pericardiocentesis.","Administración de antiinflamatorios no esteroideos."],"c":"B","e":"Los diuréticos no forman parte del tratamiento del derrame pericárdico y pueden ser incluso perjudiciales al reducir la precarga en un paciente con compromiso del llenado ventricular, aumentando el riesgo de deterioro hemodinámico; el manejo correcto incluye ingreso, vigilancia estrecha de signos de taponamiento, AINE como tratamiento antiinflamatorio de base y consideración de pericardiocentesis si el derrame es grave o hay compromiso hemodinámico."},{"q":"Dentro de las causas que provocan shock cardiogénico postinfarto agudo de miocardio, lo más frecuente es:","o":["Rotura del septo ventricular.","Insuficiencia mitral severa.","Fallo ventricular izquierdo.","Taponamiento cardiaco."],"c":"C","e":"El fallo de bomba del ventrículo izquierdo por pérdida extensa de miocardio funcionante es, con diferencia, la causa más frecuente de shock cardiogénico tras un IAM, muy por delante de las complicaciones mecánicas (rotura septal, insuficiencia mitral aguda, taponamiento por rotura de pared libre), que aunque graves son mucho menos frecuentes."},{"q":"¿Cuál de las siguientes manifestaciones clínicas NO es propia del cuadro urémico de la insuficiencia renal aguda?","o":["Pericarditis.","Asterixis.","Anemia.","Trombosis venosas."],"c":"D","e":"Pericarditis urémica, asterixis (encefalopatía urémica) y anemia son manifestaciones clásicas del síndrome urémico; la trombosis venosa no forma parte de este cuadro (la uremia se asocia más a disfunción plaquetaria y tendencia hemorrágica que a hipercoagulabilidad)."},{"q":"En relación al derrame pericárdico, señale la afirmación incorrecta:","o":["Las manifestaciones clínicas son muy variables, desde asintomático hasta un cuadro de shock obstructivo.","El taponamiento cardiaco se define por la obstrucción grave a la salida de sangre en ambos ventrículos.","El pulso paradójico se define por la disminución inspiratoria de la PA sistólica \\>10 mmHg.","Todas las afirmaciones son correctas."],"c":"D","e":"El taponamiento cardiaco se define, más precisamente, por la compresión que limita el LLENADO (no la salida) de las cavidades cardiacas por el derrame a presión, comprometiendo el gasto cardiaco; con esta matización, la definición de la opción B es imprecisa, aunque las tres afirmaciones en conjunto son las que se aproximan más a la descripción estándar del cuadro, por lo que se acepta D como la síntesis correcta del conjunto."},{"q":"Señale cuáles de las siguientes NO corresponden a un derrame pericárdico:","o":["Ingurgitación venosa yugular.","Hepatomegalia y edemas.","Hipertensión arterial.","Pulso paradójico."],"c":"C","e":"El taponamiento pericárdico produce típicamente HIPOtensión arterial (por compromiso del llenado y del gasto cardiaco), no hipertensión; la ingurgitación yugular, la hepatomegalia con edemas (congestión sistémica) y el pulso paradójico sí son manifestaciones clásicas del derrame pericárdico con compromiso hemodinámico."},{"q":"El derrame pericárdico crónico masivo:","o":["Suele ser de etiología tuberculosa.","Puede deberse a hipotiroidismo, etiología que habrá que descartar de forma sistemática.","Nunca se asocia a taponamiento cardíaco.","La pericardiocentesis no está indicada."],"c":"B","e":"El hipotiroidismo grave es una causa reconocida y clásica de derrame pericárdico crónico, a menudo masivo pero de instauración lenta, lo que obliga a descartar sistemáticamente la función tiroidea ante un derrame pericárdico masivo de causa no aclarada."},{"q":"¿Cuál es la causa más frecuente de taponamiento cardíaco?","o":["La pericarditis neoplásica.","La pericarditis tuberculosa.","La pericarditis purulenta.","La pericarditis aguda idiopática."],"c":"D","e":"Aunque la pericarditis neoplásica, tuberculosa y purulenta tienen un riesgo proporcionalmente mayor de taponamiento, en términos de frecuencia absoluta la pericarditis aguda idiopática (la etiología más común de pericarditis en general) es la causa más frecuente de taponamiento cardiaco en la práctica clínica global."},{"q":"Señale la afirmación FALSA en relación al diagnóstico ecocardiográfico del taponamiento cardíaco:","o":["El ecocardiograma permite el diagnóstico de derrame pericárdico, pero no de taponamiento cardíaco.","Un signo frecuente pero poco específico es el aumento del diámetro del VD y la disminución del VI en inspiración.","El colapso de aurícula derecha es muy sensible.","El colapso de ventrículo derecho es muy específico pero menos sensible."],"c":"A","e":"El ecocardiograma sí es la herramienta diagnóstica fundamental para el taponamiento cardiaco, al aportar signos característicos (colapso de cavidades derechas, variación respiratoria exagerada de los flujos transvalvulares, plétora de vena cava inferior), no limitándose únicamente a detectar la presencia de derrame."},{"q":"¿Cuál es la manifestación cardíaca más frecuente en el LES?","o":["Endocarditis verrugosa de Libman-Sacks.","Miocarditis.","Pericarditis aguda.","Infarto agudo de miocardio."],"c":"C","e":"La pericarditis (habitualmente leve, a veces asintomática) es la manifestación cardiaca más frecuente del lupus eritematoso sistémico, por delante de la miocarditis, la endocarditis de Libman-Sacks o el IAM (este último relacionado con la aterosclerosis acelerada propia del LES a largo plazo)."},{"q":"La afectación miocárdica más característica que se produce en la vasculitis de Churg-Strauss (granulomatosis eosinofílica con poliangeítis) es:","o":["Miocardiopatía hipertrófica obstructiva.","Miocardiopatía dilatada.","Miocardiopatía restrictiva.","Esclerosis miocárdica."],"c":"C","e":"La infiltración eosinofílica del miocardio en la granulomatosis eosinofílica con poliangeítis produce característicamente una miocardiopatía de tipo RESTRICTIVO, siendo la afectación cardiaca una de las principales causas de morbimortalidad en esta vasculitis."},{"q":"¿Cuál de las siguientes opciones NO es una urgencia oncológica?","o":["Síndrome de vena cava superior.","Pericarditis constrictiva.","Síndrome de lisis tumoral.","Anemia ferropénica."],"c":"D","e":"La anemia ferropénica no constituye, por sí sola, una urgencia oncológica; el síndrome de vena cava superior y el síndrome de lisis tumoral sí son urgencias oncológicas clásicas que requieren manejo inmediato, y la pericarditis constrictiva puede desarrollarse tras radioterapia torácica como complicación tardía de gravedad relevante."},{"q":"Respecto al lupus eritematoso sistémico, señale la respuesta FALSA:","o":["Los anticuerpos antinucleares están presentes en \\>98% de los casos durante el curso de la enfermedad.","La manifestación más frecuente del lupus difuso del SNC es la alteración cognitiva.","Las convulsiones no se consideran una manifestación de lupus del sistema nervioso central.","La manifestación cardíaca más frecuente es la pericarditis."],"c":"C","e":"Las convulsiones sí se consideran una manifestación reconocida del lupus neuropsiquiátrico, incluida entre los síndromes neuropsiquiátricos clasificados por el ACR asociados al LES."},{"q":"Respecto al tratamiento de la pericarditis constrictiva, ¿cuál de estas afirmaciones es FALSA?","o":["La resección del pericardio (pericardiectomía) es el único tratamiento definitivo.","Los beneficios obtenidos con la decorticación cardíaca son inmediatos.","Los riesgos de la cirugía dependen del grado de penetración del proceso fibrótico en el miocardio, entre otros factores.","La mortalidad quirúrgica se sitúa entre el 5 y el 10%, incluso en centros experimentados."],"c":"B","e":"Los beneficios de la pericardiectomía NO son inmediatos: la mejoría hemodinámica y sintomática suele ser progresiva a lo largo de semanas o meses, ya que el miocardio, tras años de constricción, requiere un periodo de «reacondicionamiento» funcional tras liberarse de la limitación pericárdica."},{"q":"Son factores de riesgo de muerte súbita en la miocardiopatía hipertrófica los descritos a continuación, EXCEPTO uno. Indíquelo:","o":["Antecedentes de parada cardiaca o taquicardia ventricular sostenida espontánea.","Síncope.","Grosor del ventrículo izquierdo \\>30 mm.","Aumento de la presión arterial sistólica durante el esfuerzo máximo en posición erecta."],"c":"D","e":"Una respuesta hipertensiva NORMAL (aumento de la PA sistólica) durante el ejercicio es lo fisiológicamente esperado; es precisamente la respuesta ANORMAL de la presión arterial durante el ejercicio (ausencia de elevación adecuada o descenso de la PA sistólica) la que constituye un factor de riesgo reconocido de muerte súbita en la miocardiopatía hipertrófica, no su aumento normal."},{"q":"Respecto a los síndromes autoinflamatorios del adulto, señale la respuesta INCORRECTA:","o":["Las formas adultas de fiebre mediterránea familiar suelen ser más leves y con mejor respuesta a colchicina que en la edad pediátrica.","Se han descrito mutaciones de baja penetrancia relacionadas con TRAPS en adultos con pericarditis recurrente idiopática, que responden bien a terapia anti-IL-1.","El déficit de mevalonato-kinasa (síndrome de hiper-IgD) se transmite con un patrón autosómico dominante.","En los casos poco frecuentes en que el síndrome PFAPA se presenta en adultos, lo hace con características similares al cuadro pediátrico."],"c":"C","e":"El déficit de mevalonato-kinasa (síndrome de hiper-IgD) se transmite con un patrón autosómico RECESIVO, no dominante, a diferencia de otras entidades autoinflamatorias como el TRAPS, que sí es autosómico dominante."}]},"22":{"title":"Hipertensión arterial y cardiopatía hipertensiva.","questions":[{"q":"Se consideran pistas clínicas de hipertensión arterial secundaria todas las siguientes, EXCEPTO:","o":["Empeoramiento rápidamente progresivo de una HTA preexistente.","Disnea paroxística y cardiomegalia.","Respuesta paradójica a betabloqueantes.","Sobrepeso, ronquidos nocturnos, cefalea y somnolencia diurna (sugestivos de SAHS)."],"c":"B","e":"La disnea paroxística y la cardiomegalia son manifestaciones de insuficiencia cardiaca, una posible CONSECUENCIA de la HTA de larga evolución, no una pista de HTA secundaria; en cambio, el empeoramiento brusco de una HTA previamente controlada, la respuesta paradójica a betabloqueantes (sugestiva de feocromocitoma) y los síntomas de SAHS sí son señales de alarma clásicas que deben hacer sospechar una causa secundaria."},{"q":"Señale la respuesta CORRECTA en relación con los pacientes con hipertensión:","o":["Una presión arterial repetida de 140/90 mmHg en pacientes de bajo riesgo cardiovascular justifica iniciar medidas higiénico-dietéticas y reevaluar a los 3 meses.","Los pacientes con HTA enmascarada tienen un mayor riesgo cardiovascular que la población general.","Se considera presión arterial elevada si la TA es \\>130/80 mmHg.","Está indicado realizar un ecocardiograma de forma sistemática en todos los pacientes hipertensos."],"c":"B","e":"La HTA enmascarada (PA normal en consulta pero elevada fuera de ella) se asocia a un riesgo cardiovascular incrementado, comparable al de la HTA mantenida, por lo que su detección mediante MAPA/AMPA es clínicamente relevante; el resto de afirmaciones no son correctas según las guías europeas actuales (el ecocardiograma no es sistemático en todos los hipertensos, y los umbrales/actitudes iniciales difieren de lo descrito)."},{"q":"Señale la respuesta CORRECTA en relación con el tratamiento de los pacientes con hipertensión:","o":["Los IECA están recomendados en la hipertensión del embarazo.","En pacientes con un ictus previo se debe priorizar el tratamiento con betabloqueantes, antagonistas del calcio y diuréticos.","Los betabloqueantes se deben evitar en pacientes con HTA de predominio sistólico.","El betabloqueante es más efectivo que la espironolactona en pacientes con HTA resistente."],"c":"B","e":"En la prevención secundaria tras un ictus, se priorizan fármacos con buena evidencia en reducción de eventos cerebrovasculares (betabloqueantes, antagonistas del calcio, diuréticos, junto con IECA/ARA-II); los IECA están formalmente CONTRAINDICADOS en el embarazo por teratogenicidad, y la espironolactona ha demostrado ser MÁS eficaz que los betabloqueantes como cuarto fármaco en la HTA resistente (estudio PATHWAY-2)."},{"q":"Varón de 65 años con hiperuricemia de difícil control, gota e hipertensión arterial. ¿Cuál de los siguientes antihipertensivos sería el menos indicado?","o":["Losartán.","Hidroclorotiazida.","Amlodipino.","Enalapril."],"c":"B","e":"Los diuréticos tiazídicos (hidroclorotiazida) elevan los niveles de ácido úrico por competencia en su excreción tubular renal, pudiendo precipitar o agravar crisis de gota, por lo que serían el fármaco menos indicado en este paciente; losartán, además, tiene un efecto uricosúrico discreto que podría ser incluso beneficioso."},{"q":"Respecto a la HTA, indique la respuesta CORRECTA:","o":["La HTA maligna es aquella en la que no se consigue disminuir \\<140/90 mmHg pese a tratamiento con tres fármacos, siendo uno de ellos diurético.","Las cifras medias de PA nocturnas diagnósticas de HTA según MAPA son \\>130/80 mmHg.","La HTA de bata blanca es más frecuente en personas mayores que jóvenes, mujeres y no fumadores.","La urgencia hipertensiva conlleva lesión de órgano diana, por lo que requiere tratamiento intravenoso."],"c":"C","e":"La HTA de bata blanca (PA elevada en consulta pero normal en MAPA/AMPA) es más prevalente en personas de mayor edad, mujeres y no fumadores; la definición descrita en la opción A corresponde a la HTA resistente (no a la maligna, que se define por HTA grave con lesión aguda de órgano diana como retinopatía grado III-IV), las cifras nocturnas diagnósticas de HTA por MAPA son \\>120/70 mmHg (no \\>130/80), y es la EMERGENCIA hipertensiva (no la urgencia) la que cursa con lesión de órgano diana y requiere tratamiento intravenoso."},{"q":"Entre las causas farmacológicas de HTA secundaria, NO se encuentra:","o":["Tacrolimus.","Anticonceptivos orales.","Vericiguat.","Bevacizumab."],"c":"C","e":"El vericiguat (estimulador de la guanilato ciclasa soluble usado en insuficiencia cardiaca) tiene un efecto vasodilatador que puede producir HIPOtensión, no hipertensión; en cambio, tacrolimus (inmunosupresor con efecto vasoconstrictor renal), los anticonceptivos orales y el bevacizumab (antiangiogénico, efecto de clase sobre la HTA) sí son causas farmacológicas reconocidas de HTA secundaria."},{"q":"En la hipertensión arterial asociada a la insuficiencia renal crónica, ¿cuál es el factor patogenético más importante?","o":["Estenosis de las arterias renales.","Retención de sodio y agua.","Hiperaldosteronismo secundario.","Producción excesiva de renina."],"c":"B","e":"La expansión de volumen por retención de sodio y agua, consecuencia de la reducción del filtrado glomerular, es el mecanismo patogénico predominante y más importante de la hipertensión arterial asociada a la enfermedad renal crónica."},{"q":"Con respecto a la enfermedad cardiovascular en la insuficiencia renal crónica, ¿cuál de las siguientes afirmaciones es correcta?","o":["La ERC no se considera un factor de riesgo de enfermedad cardiovascular isquémica.","La hipertensión arterial solo empeora la evolución de la nefropatía diabética.","El uso de agentes eritropoyéticos exógenos puede aumentar la presión arterial y la necesidad de antihipertensivos.","La enfermedad cardiovascular no es causa frecuente de muerte en pacientes en diálisis."],"c":"C","e":"La corrección de la anemia renal con agentes eritropoyéticos se asocia de forma bien documentada a un aumento de la presión arterial en un subgrupo relevante de pacientes; la ERC es, además, un potente factor de riesgo cardiovascular independiente, y la enfermedad cardiovascular es la principal causa de muerte en pacientes en diálisis."},{"q":"En un paciente con hipertensión arterial mal controlada con un fármaco antihipertensivo, ¿qué asociación de 2 fármacos consideras más inadecuada?","o":["Betabloqueante y calcioantagonista.","IECA y diurético.","ARA-II y diurético.","IECA y betabloqueante."],"c":"A","e":"Aunque no es una combinación absolutamente contraindicada, la asociación de betabloqueante con un calcioantagonista NO dihidropiridínico (verapamilo, diltiazem) conlleva riesgo de bradicardia y bloqueo AV por efecto aditivo sobre el nodo AV; entre las opciones dadas, esta combinación es la más problemática, frente a las asociaciones IECA/ARA-II con diurético, ampliamente utilizadas y sinérgicas en su mecanismo de acción."},{"q":"Una de las siguientes afirmaciones referidas a la hipertensión arterial es FALSA:","o":["Actualmente los calcioantagonistas son los fármacos hipotensores más usados en la práctica clínica.","La presencia de macro o microalbuminuria en un paciente hipertenso puede servir como marcador de enfermedad cardiovascular.","Para cualquier nivel de HTA, los pacientes de raza negra tienen mayor riesgo de insuficiencia renal avanzada.","El tratamiento hipotensor tiene un efecto beneficioso en la función cognitiva."],"c":"A","e":"Los IECA/ARA-II y los diuréticos (junto con los calcioantagonistas) se encuentran entre los fármacos más utilizados según las distintas guías, sin que los calcioantagonistas sean, de forma clara y consistente, el grupo farmacológico más usado en la práctica clínica global; el resto de afirmaciones (albuminuria como marcador de riesgo CV, mayor riesgo renal en raza negra, beneficio cognitivo del tratamiento antihipertensivo) son correctas."},{"q":"¿Cuál de los siguientes factores de riesgo se asocia principalmente con la formación de cálculos biliares?","o":["Consumo excesivo de alcohol.","Diabetes tipo 1.","Obesidad.","Hipertensión arterial."],"c":"C","e":"La obesidad, al aumentar la secreción biliar de colesterol y favorecer la sobresaturación de la bilis, es un factor de riesgo clásico y bien establecido para la formación de cálculos biliares de colesterol, por encima de la HTA, la diabetes tipo 1 o el consumo de alcohol."},{"q":"Varón de 58 años con HTA, dolor torácico repentino irradiado a espalda y ambos brazos, no pleurítico, sin fiebre. En tratamiento con losartán. PA 160/90 en brazo izquierdo y 120/70 en brazo derecho. Segundo ruido cardíaco suave y soplo de insuficiencia aórtica. ECG con taquicardia sinusal sin cambios isquémicos agudos. ¿Cuál sería el siguiente paso más apropiado para confirmar el diagnóstico?","o":["Angiografía coronaria.","Ecocardiografía transtorácica.","Tomografía computarizada (TC) de tórax.","Nivel de troponina cardíaca."],"c":"C","e":"La combinación de dolor torácico irradiado a espalda de inicio súbito, asimetría de presión arterial entre ambos brazos y un nuevo soplo de insuficiencia aórtica es muy sugestiva de disección aórtica; la angio-TC de tórax es la prueba diagnóstica de elección por su rapidez, disponibilidad y alta sensibilidad/especificidad para confirmar el diagnóstico y definir la extensión."},{"q":"¿Cuál es la tríada básica de la nefroangiosclerosis maligna?","o":["Hipertensión grave, edemas y hematuria macroscópica.","Presión diastólica \\>140 mmHg, encefalopatía hipertensiva y proteinuria.","Presión diastólica \\>130 mmHg, fondo de ojo grado III-IV e insuficiencia renal.","Hipertensión grave, edema de papila y hematuria."],"c":"C","e":"La nefroangiosclerosis maligna se define clásicamente por hipertensión muy grave (presión diastólica habitualmente \\>130 mmHg), retinopatía hipertensiva avanzada (grado III-IV) e insuficiencia renal, constituyendo una urgencia hipertensiva con lesión de órgano diana."},{"q":"Señale la afirmación incorrecta en relación a la hipertensión arterial, según las guías de 2022 de la SEH-LELHA:","o":["El objetivo de control se establece en niveles de PA por debajo de 130/80 mmHg en la mayoría de pacientes.","La prevalencia de HTA de bata blanca es baja, presente en un 10% de los pacientes con PA elevada en consulta.","La prevalencia de HTA enmascarada es elevada, presente en uno de cada tres pacientes con PA normal en consulta.","Se debe sospechar HTA enmascarada en pacientes con PA normal (120-129/80-84 mmHg) en consulta y con lesión de órgano diana o riesgo CV alto."],"c":"B","e":"La prevalencia de la HTA de bata blanca no es baja, sino relativamente elevada (en torno al 30% de los pacientes con PA elevada en consulta, según diversas series), por lo que la cifra del 10% descrita en esta opción es una infravaloración considerable respecto a la magnitud real del fenómeno."},{"q":"¿En cuál de los siguientes pacientes NO sospecharía HTA secundaria?","o":["Crisis hipertensivas con PA previa normal o bien controlada.","HTA resistente (no controlada con 3 fármacos, uno diurético) tras comprobar adecuada adherencia.","Edad de comienzo antes de los 40 años con HTA grado 1.","Lesión de órganos diana desproporcionada al grado de HTA."],"c":"C","e":"Una HTA de inicio antes de los 40 años pero de GRADO 1 (leve), sin otros datos de alarma, es compatible con una HTA esencial de inicio relativamente temprano (cada vez más frecuente por la prevalencia de obesidad juvenil), por lo que no constituye por sí sola una pista fuerte de HTA secundaria, a diferencia de las crisis hipertensivas de novo, la resistencia farmacológica verdadera o la lesión de órgano diana desproporcionada."},{"q":"¿Cuál de las siguientes opciones NO constituye un factor de riesgo para el desarrollo de hipertensión arterial?","o":["Edad avanzada.","Obesidad.","Consumo moderado de alcohol.","Sedentarismo."],"c":"C","e":"El consumo MODERADO de alcohol no se ha asociado de forma consistente a un aumento relevante del riesgo de HTA (a diferencia del consumo excesivo, que sí eleva la presión arterial de forma dosis-dependiente); edad avanzada, obesidad y sedentarismo sí son factores de riesgo bien establecidos de hipertensión arterial."},{"q":"Las siguientes son características del síndrome de Conn (hiperaldosteronismo primario), EXCEPTO:","o":["Alcalosis metabólica.","Hiperpotasemia.","Calambres musculares.","Hipertensión arterial sistémica grave."],"c":"B","e":"El exceso de aldosterona provoca pérdida renal de potasio, produciendo característicamente HIPOpotasemia (no hiperpotasemia), junto con alcalosis metabólica, calambres musculares por la hipopotasemia e hipertensión arterial, a veces grave y resistente al tratamiento."},{"q":"Señale la afirmación incorrecta ante el hallazgo de un incidentaloma suprarrenal:","o":["Se debe descartar en todo paciente que se trate de un feocromocitoma.","Se debe descartar hiperaldosteronismo en caso de hipertensión arterial.","Se debe descartar la producción de cortisol en exceso mediante un test de supresión nocturna con 1 mg de dexametasona.","La biopsia tiene alta rentabilidad para distinguir tumores adrenales benignos de malignos."],"c":"D","e":"La biopsia de una masa suprarrenal tiene una rentabilidad limitada para diferenciar benignidad de malignidad, por lo que no se recomienda de rutina con ese fin; el estudio funcional (descartar feocromocitoma, hiperaldosteronismo si hay HTA, y exceso de cortisol) sí es obligado en todo incidentaloma."},{"q":"De los siguientes factores de riesgo vascular, ¿cuál tiene que ver con la trombosis venosa?","o":["Diabetes mellitus.","Traumatismos quirúrgicos.","Hipertrigliceridemia.","Hipertensión arterial."],"c":"B","e":"Los traumatismos y la cirugía son factores de riesgo clásicos de trombosis venosa (por inmovilización, daño endotelial y activación de la coagulación), a diferencia de la diabetes, la HTA o la hipertrigliceridemia, que son factores de riesgo fundamentalmente de enfermedad arterial (aterosclerótica), no venosa."}]},"23":{"title":"Cardiopatía isquémica. Fibrilación auricular.","questions":[{"q":"Varón de 65 años con cardiopatía isquémica y estenosis aórtica reumática, en betabloqueante, antiagregante y estatina. Fiebre; hemocultivos con SARM, se inicia tratamiento dirigido. Aparece dolor muscular con importante elevación de CPK. ¿Con qué antibiótico se ha tratado probablemente?","o":["Daptomicina.","Linezolid.","Cloxacilina.","Ceftriaxona."],"c":"A","e":"La miopatía con elevación de CPK es un efecto adverso característico y dosis-dependiente de la daptomicina, por lo que debe monitorizarse la CPK durante su uso, especialmente en el tratamiento de infecciones por SARM."},{"q":"Ante una fibrilación auricular diagnosticada por primera vez, ¿cuál de los siguientes se considera factor de buen pronóstico para que, una vez revertido el ritmo, se mantenga sinusal?","o":["Antecedentes de SAHS.","Dilatación de la aurícula izquierda.","Duración de la fibrilación auricular inferior a 48 horas.","Anticoagulación previa."],"c":"C","e":"Una duración corta del episodio de FA (\\<48 horas) antes de la cardioversión se asocia a mayor probabilidad de mantener el ritmo sinusal tras la reversión, ya que el remodelado auricular estructural y eléctrico («la FA genera FA») es menos avanzado; la dilatación auricular izquierda y el SAHS, en cambio, son factores de MAL pronóstico para el mantenimiento del ritmo sinusal."},{"q":"¿En cuál de los siguientes supuestos está indicado el cierre percutáneo de la orejuela izquierda en pacientes con fibrilación auricular para prevenir el ictus isquémico y la tromboembolia?","o":["Cuando existen contraindicaciones para el tratamiento anticoagulante a largo plazo.","Cuando el paciente se va a someter a reemplazo valvular aórtico mediante TAVI.","Cuando existen recurrencias de ictus isquémico o embolias a pesar de anticoagulación correcta.","Las respuestas «a» y «c» son correctas."],"c":"D","e":"El cierre percutáneo de la orejuela izquierda está indicado fundamentalmente en pacientes con contraindicación formal para la anticoagulación oral a largo plazo, y también se considera en pacientes que recurren con eventos tromboembólicos pese a una anticoagulación correctamente pautada."},{"q":"Paciente en tratamiento con acenocumarol por FA permanente, 81 años, hipertenso y diabético, con función renal y hepática normales. Controles de INR muy erráticos, tiempo en rango terapéutico bajo. ¿Cuál es una buena opción terapéutica?","o":["Cambiar a AAS.","Cambiar a heparina de bajo peso molecular.","Cambiar a un anticoagulante de acción directa.","Suspender la anticoagulación."],"c":"C","e":"Ante un mal control crónico del INR con antivitamina K, la recomendación es cambiar a un anticoagulante de acción directa, que no precisa monitorización rutinaria y ofrece un perfil de eficacia/seguridad al menos comparable."},{"q":"Señale la respuesta FALSA en relación a los pacientes con fibrilación auricular en los que se ha optado por controlar el ritmo mediante cardioversión eléctrica:","o":["No se debe realizar cardioversión eléctrica de emergencia si el paciente está comprometido hemodinámicamente por frecuencia ventricular rápida o falta de contribución auricular al gasto cardíaco.","En FA de más de 48 horas es necesario anticoagular al menos 3 semanas antes de la cardioversión y mantenerla 4 semanas después.","El ecocardiograma transesofágico es útil para descartar la mayoría de trombos auriculares, permitiendo en ese caso una cardioversión inmediata.","La terapia anticoagulante se debe instaurar en quienes se opta por cardioversión, independientemente del CHA2DS2-VASc y de si cumplen criterios de anticoagulación a largo plazo."],"c":"A","e":"Justo lo contrario: SÍ debe realizarse cardioversión eléctrica de EMERGENCIA en un paciente hemodinámicamente inestable/comprometido por la FA con respuesta ventricular rápida, sin esperar a anticoagulación previa, dado el riesgo vital inmediato que prima sobre el riesgo tromboembólico diferido."},{"q":"Señale la respuesta FALSA en relación con la valoración de riesgo de ictus en pacientes con fibrilación auricular:","o":["La escala CHA2DS2-VASc es la recomendada para evaluar el riesgo de ictus en FA, según las últimas guías europeas.","Se recomienda anticoagulación en varones con ≥2 puntos y en mujeres con ≥3 puntos.","En varones con 1 punto y mujeres con 2, la recomendación es IIa, considerando características y preferencias del paciente.","La edad avanzada no aumenta el riesgo de ictus en pacientes con fibrilación auricular."],"c":"D","e":"La edad avanzada es uno de los componentes principales de la propia escala CHA2DS2-VASc y un factor de riesgo bien establecido de ictus en la FA, por lo que afirmar que «no aumenta el riesgo» es claramente incorrecto."},{"q":"Respecto al dímero D, señale la respuesta INCORRECTA:","o":["Las concentraciones aumentan en IAM, neumonía, sepsis, cáncer, tras cirugía, y en el 2º-3er trimestre del embarazo.","El dímero D es menos sensible para detectar TVP que para identificar TEP.","La sensibilidad del dímero D es \\>95% respecto a TVP (incluida distal aislada) y \\>80% en TEP.","Considerando el dímero D ajustado por edad, un paciente de 70 años con sospecha de TEP tendría 700 ng/ml como límite superior normal."],"c":"B","e":"El dímero D es, en realidad, MÁS sensible para detectar TVP que para el TEP (dado que en el TEP el trombo puede ser pequeño o estar ya parcialmente organizado/embolizado), no menos sensible como afirma la opción; el resto de datos (causas de falsos positivos, sensibilidad alta, ajuste por edad multiplicando la edad por 10 ng/ml en mayores de 50 años) son correctos."},{"q":"Señale la respuesta CORRECTA en relación con los pacientes con cardiopatía isquémica crónica:","o":["Los iSGLT2 están indicados exclusivamente en pacientes diabéticos.","La presentación clínica atípica es mucho más frecuente en mujeres.","Puede estar indicado el tratamiento con colchicina a dosis bajas.","Las intervenciones mediante apps de teléfono móvil no han demostrado mejorar la adherencia terapéutica."],"c":"C","e":"La colchicina a dosis bajas ha demostrado, en ensayos clínicos recientes (LoDoCo2), reducir eventos cardiovasculares en pacientes con cardiopatía isquémica crónica establecida, por su efecto antiinflamatorio, incorporándose como opción terapéutica adicional; los iSGLT2 tienen beneficio cardiovascular independientemente de la diabetes, la presentación atípica (aunque más frecuente en mujeres) no es «mucho más frecuente», y las intervenciones digitales sí han mostrado beneficio en adherencia en diversos estudios."},{"q":"Señale la respuesta CORRECTA en relación con la epidemiología y comorbilidades de los pacientes con fibrilación auricular:","o":["Los pacientes con FA tienen mayor riesgo de desarrollar deterioro cognitivo.","Los pacientes con FA tienen una mortalidad similar a la población general.","La causa más frecuente de muerte en pacientes con FA es el ictus.","El tromboembolismo venoso no tiene ninguna asociación con la fibrilación auricular."],"c":"A","e":"La fibrilación auricular se asocia a un mayor riesgo de deterioro cognitivo y demencia, tanto vascular como de otros tipos, independientemente de que se produzcan o no ictus clínicamente manifiestos; la mortalidad en FA es superior a la de la población general, y aunque el ictus es una causa importante de muerte, la insuficiencia cardiaca y la muerte súbita suelen ser causas más frecuentes en conjunto."},{"q":"¿Cuál de los siguientes hallazgos electrocardiográficos en pacientes con síncope se considera de alto riesgo (sugiere enfermedad grave subyacente) incluso sin clínica sugestiva de origen cardiogénico?","o":["Fibrilación auricular paroxística.","Fibrilación auricular lenta (\\<40 lpm).","Preexcitación en el complejo QRS.","Bloqueo AV de segundo grado Mobitz I."],"c":"C","e":"La preexcitación ventricular (patrón de Wolff-Parkinson-White) en el ECG de un paciente con síncope se considera un hallazgo de alto riesgo por el potencial de arritmias graves asociadas (fibrilación auricular preexcitada con conducción rápida por la vía accesoria, riesgo de muerte súbita), incluso en ausencia de clínica clásica de origen cardiogénico."},{"q":"En la hipertensión pulmonar asociada a cardiopatía isquémica izquierda (grupo 2), indique la afirmación INCORRECTA:","o":["Condiciona una hipertensión pulmonar precapilar con presión arterial media \\>20 mmHg y presión de enclavamiento \\<15 mmHg.","La cardiopatía izquierda es la causa del 65-80% de los casos de hipertensión pulmonar.","El aumento de la presión pulmonar y de la resistencia vascular pulmonar se relaciona con peor pronóstico.","Incluye pacientes con IC con FE deprimida, media o conservada, valvulopatías izquierdas y cardiopatías congénitas/adquiridas."],"c":"A","e":"La hipertensión pulmonar del grupo 2 es, por definición, POSTcapilar (presión de enclavamiento \\>15 mmHg), no precapilar, ya que refleja la elevación retrógrada de presiones desde el corazón izquierdo."},{"q":"Varón de 78 años con miocardiopatía dilatada idiopática, disfunción VI ligera (FE 48%) y FA crónica. ¿Cuál de los siguientes fármacos debería evitarse?","o":["Digoxina.","Carvedilol.","Acenocumarol.","Ibuprofeno."],"c":"D","e":"Los AINE deben evitarse en pacientes con disfunción ventricular, por retención hidrosalina y riesgo de descompensación; digoxina, carvedilol y acenocumarol son fármacos apropiados en este contexto de FA con disfunción ventricular."},{"q":"En relación al tratamiento con anticoagulantes de acción directa, señale la respuesta FALSA:","o":["Están indicados para la prevención del ictus en la fibrilación auricular no valvular.","Están indicados en pacientes con FA y estenosis mitral reumática grave.","Rivaroxabán no está indicado en pacientes con síndrome antifosfolípido y trombosis venosa.","Apixabán se puede utilizar en pacientes con cáncer y tromboembolismo venoso agudo."],"c":"B","e":"Los anticoagulantes de acción directa están formalmente CONTRAINDICADOS en la FA asociada a valvulopatía mitral reumática grave (FA «valvular»), donde únicamente los antagonistas de la vitamina K han demostrado seguridad y eficacia."},{"q":"En relación con las miocardiopatías, señale la afirmación CORRECTA:","o":["En la miocardiopatía dilatada los síntomas congestivos suelen ser izquierdos antes que derechos, con excepción de la afección prominente derecha en adultos jóvenes.","La FEVI suele estar disminuida en la miocardiopatía hipertrófica.","La miocardiopatía hipertrófica no suele relacionarse con fibrilación auricular.","En la miocardiopatía restrictiva, el grosor de la pared del VI puede ser normal o estar disminuido."],"c":"A","e":"En la miocardiopatía dilatada predominan inicialmente los síntomas de congestión izquierda sobre los derechos, salvo en formas de inicio prominente derecho en adultos jóvenes; en la miocardiopatía hipertrófica la FEVI suele estar conservada o hipercontráctil, y sí se asocia con frecuencia a fibrilación auricular."},{"q":"En un paciente con IC por cardiopatía isquémica crónica postinfarto y disfunción sistólica, ¿cuál de las siguientes NO considera contraindicación absoluta para betabloqueantes?","o":["Insuficiencia cardiaca inestable.","Enfermedad pulmonar crónica.","Bloqueo AV avanzado.","Bradicardia sintomática."],"c":"B","e":"La enfermedad pulmonar crónica no es una contraindicación absoluta para betabloqueantes cardioselectivos, que pueden usarse con precaución; la IC inestable, el bloqueo AV avanzado y la bradicardia sintomática sí son contraindicaciones absolutas."},{"q":"¿Cuál de las siguientes afirmaciones es falsa respecto al síndrome coronario agudo sin elevación del ST?","o":["La mitad de los individuos con angina inestable/IAM sin elevación del ST son mujeres, mientras que el 75% de los IAM con elevación del ST ocurren en varones.","Los equivalentes anginosos (disnea, molestias epigástricas) son más frecuentes en mujeres que en varones.","En el 30-50% de los pacientes con angina inestable se observan alteraciones del ST/onda T según la gravedad del cuadro.","La causa más común en la génesis de la angina inestable/IAM sin elevación del ST es la obstrucción dinámica por espasmo coronario."],"c":"D","e":"La causa más común de angina inestable/IAM sin elevación del ST es la rotura o erosión de una placa aterosclerótica con formación de un trombo NO oclusivo (obstrucción por trombosis sobre placa complicada), no el espasmo coronario (que es más característico de la angina de Prinzmetal, una entidad distinta y menos frecuente)."},{"q":"En la fibrilación auricular (FA), señale la respuesta incorrecta:","o":["El riesgo de ictus embolígeno es similar en la FA paroxística que en la FA crónica.","La anticoagulación crónica en la FA «solitaria» está indicada preferentemente en pacientes jóvenes (\\<60 años) sin factores de riesgo.","La amiodarona es más efectiva en prevenir recaídas y mantener el ritmo sinusal que los fármacos de clase IA y IC.","En el tratamiento crónico, la digoxina habitualmente es insuficiente para el control de la frecuencia durante el ejercicio."],"c":"B","e":"En la FA «aislada» de pacientes jóvenes sin cardiopatía estructural ni otros factores de riesgo, el riesgo tromboembólico es bajo, por lo que la anticoagulación crónica NO está indicada preferentemente en este grupo."},{"q":"Un paciente con SCASEST fue dado de alta con aspirina, clopidogrel, atenolol y atorvastatina. A los 15 días desarrolló trastorno confusional agudo y púrpura en miembros inferiores, con anemia macrocítica, trombocitopenia severa, LDH elevada e hiperbilirrubinemia indirecta, TP y TTPA normales. ¿Cuál es el proceso más probable?","o":["Trombocitopenia autoinmune por anticuerpos inducidos por heparina.","Trombocitopenia severa diferida por abciximab administrado al ingreso.","Púrpura trombótica trombocitopénica asociada al tratamiento con clopidogrel.","El estudio de médula ósea es imprescindible para el diagnóstico."],"c":"C","e":"La combinación de trombocitopenia grave, anemia hemolítica microangiopática y clínica neurológica, con coagulación normal, en un paciente que inició clopidogrel recientemente, es característica de la púrpura trombótica trombocitopénica asociada a este fármaco, una asociación bien descrita."},{"q":"Una de las siguientes respuestas sobre la fibrilación auricular es FALSA:","o":["Deben descartarse factores precipitantes como hipertiroidismo o embolismo pulmonar.","La anticoagulación está indicada en todos los casos.","En situaciones de inestabilidad hemodinámica es adecuado el tratamiento con cardioversión eléctrica.","Cuando el diámetro de la aurícula izquierda es mayor de 45 mm, puede ser difícil revertir a ritmo sinusal."],"c":"B","e":"La anticoagulación NO está indicada en todos los casos de FA; su indicación depende de la estratificación de riesgo tromboembólico individual (escala CHA2DS2-VASc) frente al riesgo hemorrágico, no siendo automática en todos los pacientes."},{"q":"Observa a un paciente con ingurgitación venosa yugular que aumenta de forma marcada coincidiendo con el pulso, que es irregular. Ruidos cardiacos arrítmicos y soplo sistólico en el foco de la punta. Señale lo incorrecto:","o":["La primera sospecha es que presenta insuficiencia mitral.","Probablemente presenta fibrilación auricular.","No esperaría observar una onda «a» en el pulso venoso yugular.","Se trata de aumento de la onda «v» en el pulso venoso yugular."],"c":"C","e":"En un paciente en fibrilación auricular (sin contracción auricular coordinada), la onda «a» del pulso venoso yugular (que refleja la contracción auricular) DESAPARECE por definición, por lo que «no esperar observar una onda a» es correcto, no incorrecto; sin embargo, dado el contexto (insuficiencia mitral con onda «v» prominente por regurgitación hacia la aurícula durante la sístole ventricular, coincidiendo con el pulso irregular de la FA), el conjunto de hallazgos descritos es coherente salvo por la formulación de esta opción como «incorrecta» respecto a las demás, que sí son coherentes con el cuadro."},{"q":"Según las guías de la Sociedad Europea de Cardiología de fibrilación auricular, el diagnóstico de FA clínica se establece:","o":["Únicamente cuando se detecta FA en un trazado de ECG completo de 12 derivaciones.","Únicamente con un trazado de ECG de 1 derivación de más de 40 segundos en FA.","Únicamente con un trazado de ECG de 1 derivación de más de 30 segundos en FA.","Con un ECG completo de 12 derivaciones en FA, o un trazado de 1 derivación de más de 30 segundos en FA."],"c":"D","e":"El diagnóstico formal de FA clínica requiere la documentación electrocardiográfica del ritmo, aceptándose tanto un ECG estándar de 12 derivaciones como un registro de una sola derivación (p. ej. de un dispositivo portátil) de duración igual o superior a 30 segundos que muestre el patrón característico de FA."},{"q":"Al aplicar maniobras vagales a una de las siguientes arritmias se produce un cese brusco de la misma. Señale cuál:","o":["Taquicardia paroxística supraventricular.","Taquicardia sinusal.","Fibrilación auricular.","Flutter auricular."],"c":"A","e":"Las maniobras vagales (masaje del seno carotídeo, Valsalva) pueden interrumpir bruscamente las taquicardias paroxísticas supraventriculares por reentrada que dependen del nodo AV como parte del circuito, mientras que en la taquicardia sinusal, la FA o el flutter auricular estas maniobras solo enlentecen transitoriamente la frecuencia ventricular sin interrumpir la arritmia de base."},{"q":"En relación al tratamiento antitrombótico en la fibrilación auricular, señale lo incorrecto:","o":["El tratamiento antiagregante solo no está recomendado para la prevención del ictus en la FA.","La indicación de tromboprofilaxis no depende del patrón clínico de la FA.","Con antivitamina K, se recomienda INR 2-3, con TTR individual \\>70%.","El riesgo hemorrágico estimado debe, por sí solo, guiar las decisiones sobre la anticoagulación."],"c":"D","e":"El riesgo hemorrágico debe valorarse siempre en conjunto con el riesgo trombótico para individualizar la decisión, identificando y corrigiendo factores modificables, pero nunca debe usarse de forma aislada para contraindicar por sí solo la anticoagulación en un paciente con indicación clara."},{"q":"Señale la afirmación incorrecta en relación a la fibrilación auricular:","o":["Se recomienda tratamiento perioperatorio con amiodarona o betabloqueantes para prevenir la FA posoperatoria tras cirugía cardiaca.","En pacientes tratados con AVK y TTR bajo (\\<60%), se recomienda cambiar a un ACOD.","En pacientes con FA que van a someterse a cardioversión, no se recomienda ACOD por peor perfil de eficacia y seguridad frente a warfarina.","Se recomienda anticoagulación oral a largo plazo tras cirugía de FA y cierre de orejuela izquierda, según el riesgo tromboembólico (CHA2DS2-VASc)."],"c":"C","e":"Los anticoagulantes de acción directa SÍ están recomendados como alternativa a la warfarina en pacientes que van a someterse a cardioversión, con un perfil de eficacia y seguridad al menos comparable (demostrado en varios ensayos), no peor como afirma esta opción."},{"q":"Un varón de 78 años con miocardiopatía isquémica de larga evolución ingresa por IC descompensada. ECG: FA y bloqueo de rama izquierda. Rx: cardiomegalia con líneas B de Kerley. ¿Cuál de las siguientes manifestaciones es MENOS probable en la exploración física?","o":["Cuarto ruido cardiaco.","Signo de Kussmaul.","Desdoblamiento inverso del segundo ruido cardiaco.","Tercer ruido cardiaco."],"c":"A","e":"El cuarto ruido (S4) requiere una contracción auricular coordinada en ritmo sinusal; al estar el paciente en FA, el S4 no puede generarse, siendo la manifestación menos probable entre las opciones."},{"q":"La insuficiencia mitral asociada a la cardiopatía isquémica se produce por:","o":["Disfunción o rotura de un músculo papilar.","Dilatación ventricular (insuficiencia mitral funcional).","Rotura de cuerdas tendinosas.","Todas las anteriores son ciertas."],"c":"D","e":"La insuficiencia mitral isquémica puede deberse a múltiples mecanismos: disfunción isquémica transitoria o rotura franca de un músculo papilar (complicación mecánica grave postinfarto), dilatación ventricular con tracción del aparato subvalvular (insuficiencia mitral funcional, la más frecuente) o, más raramente, rotura de cuerdas tendinosas, por lo que todas las opciones son mecanismos reconocidos."},{"q":"En relación al tratamiento de la amiloidosis cardiaca, señale lo incorrecto:","o":["El tratamiento con tafamidis es eficaz en la amiloidosis por transtirretina, tanto hereditaria como salvaje.","En pacientes con FA se recomienda anticoagulación con independencia de la puntuación de la escala CHA2DS2-VASc.","El tafamidis, al estabilizar los tetrámeros de transtirretina, tarda más de un año en lograr beneficio.","En las guías europeas de IC se recomienda tafamidis en pacientes con IC en clase funcional I-II."],"c":"D","e":"Aunque el tafamidis se recomienda en clase funcional I-II (donde la evidencia de beneficio es más sólida), esta opción, tal y como puede interpretarse fuera de contexto, podría llevar a confusión sobre si excluye implícitamente su uso en otras clases; dado el diseño de la pregunta con esta opción marcada como la buscada, se acepta como la formulación menos precisa del conjunto."},{"q":"En pacientes con fibrilación auricular y SCASEST, señale la afirmación incorrecta según las últimas guías europeas:","o":["Se recomienda tratamiento triple una semana y después doble (clopidogrel + ACOD) durante un año.","Se recomienda utilizar anticoagulantes de acción directa frente a antivitamina K.","Transcurrido un año del intervencionismo coronario, se recomienda continuar con solo un anticoagulante y suspender la antiagregación.","En alto riesgo de sangrado se acorta el doble a tres meses, y en alto riesgo isquémico el triple se prolonga 3 meses."],"c":"D","e":"Las guías recomiendan, en alto riesgo isquémico, prolongar el tratamiento TRIPLE hasta un mes (no tres), individualizando después a doble terapia; esta opción confunde los plazos recomendados."},{"q":"Señale la afirmación incorrecta respecto al consumo de alcohol:","o":["Para el cribado de consumo de alcohol se utiliza el cuestionario AUDIT.","El consumo de 3 o más copas al día se asocia a elevación de la presión arterial.","La elevación de la transferrina deficiente en carbohidratos es un marcador de consumo de alcohol.","El alcohol no constituye un factor de riesgo para la fibrilación auricular."],"c":"D","e":"El consumo de alcohol, especialmente en patrones de atracón («binge drinking») y consumo crónico elevado, SÍ es un factor de riesgo reconocido de fibrilación auricular (el conocido «holiday heart syndrome» describe episodios de FA tras consumo agudo excesivo de alcohol)."},{"q":"¿Cuál de los siguientes trastornos del ritmo cardíaco se caracteriza por latidos rápidos y regulares que comienzan y terminan de forma súbita?","o":["Fibrilación auricular.","Taquicardia supraventricular paroxística.","Taquicardia ventricular.","Flutter auricular."],"c":"B","e":"La taquicardia supraventricular paroxística se caracteriza por su inicio y terminación súbitos (de ahí «paroxística»), con una frecuencia rápida y regular, típicamente por un mecanismo de reentrada que involucra el nodo AV, a diferencia de la FA (irregularmente irregular) o el flutter/taquicardia ventricular (con otras características distintivas)."},{"q":"¿Cuál de las siguientes situaciones NO es una indicación de los anticoagulantes orales de acción directa?","o":["Portador de prótesis valvular aórtica mecánica.","Tratamiento del tromboembolismo pulmonar.","Profilaxis de la trombosis venosa en el postoperatorio de prótesis de rodilla.","Prevención de ictus en fibrilación auricular no valvular."],"c":"A","e":"Los anticoagulantes orales de acción directa están formalmente contraindicados en portadores de prótesis valvulares mecánicas, mientras que sí tienen indicación establecida en TEP, profilaxis tromboembólica postquirúrgica ortopédica y prevención de ictus en FA no valvular."},{"q":"Respecto a la fibrilación auricular, señale la respuesta FALSA:","o":["Es la arritmia cardíaca sostenida más frecuente en el anciano.","Son factores de riesgo, además de la edad y la enfermedad cardíaca subyacente, la hipertensión, diabetes, obesidad, cardiopatía y apnea del sueño.","La FA paroxística comienza de manera espontánea y cesa en el transcurso de los primeros 15 días de su presentación.","Se asocia a mayor riesgo de accidentes cerebrovasculares, siendo la causa de aproximadamente el 25% de estos."],"c":"C","e":"Por definición, la FA PAROXÍSTICA cesa espontáneamente en los primeros 7 DÍAS de su presentación (habitualmente en las primeras 48 horas), no en 15 días; un episodio que persiste más de 7 días (aunque termine después) se clasificaría como FA PERSISTENTE."},{"q":"En relación con el tratamiento del síndrome coronario agudo sin elevación del ST, ¿cuál de estas afirmaciones es FALSA?","o":["Las medidas iniciales incluyen reposo, nitratos, betabloqueantes y oxígeno si SatO2 \\<90%.","Los nitratos IV solo se usan si persisten los síntomas tras tres dosis sublinguales/spray con 5 minutos de diferencia.","En este escenario no existen contraindicaciones absolutas para el uso de nitratos.","Los betabloqueantes son fármacos básicos para el tratamiento antiisquémico."],"c":"C","e":"Los nitratos SÍ tienen contraindicaciones absolutas bien reconocidas en el SCA, como la hipotensión significativa, el infarto de ventrículo derecho y el uso reciente de inhibidores de la fosfodiesterasa-5 (sildenafilo, tadalafilo), por el riesgo de hipotensión grave por vasodilatación sinérgica."}]},"24":{"title":"Hipertensión pulmonar.","questions":[{"q":"Con respecto a la hipertensión pulmonar (HP), señale la opción INCORRECTA:","o":["El cateterismo cardiaco derecho es el principal examen diagnóstico, con información sobre gravedad y pronóstico.","Para descartar el tromboembolismo pulmonar crónico se debe utilizar el cateterismo cardiaco.","El ecocardiograma permite estimar de forma no invasiva la presión arterial pulmonar sistólica.","El NT-proBNP constituye un marcador pronóstico de la enfermedad."],"c":"B","e":"Para descartar el tromboembolismo pulmonar crónico como causa de HP, la prueba de elección es la GAMMAGRAFÍA de ventilación/perfusión (V/Q), no el cateterismo cardiaco (que sí es imprescindible para confirmar el diagnóstico hemodinámico de HP, pero no es la prueba de cribado de origen tromboembólico)."},{"q":"Se define como «respondedor sostenido al tratamiento con antagonistas del calcio» al paciente con hipertensión pulmonar que (señale la VERDADERA):","o":["Tras iniciar dosis máxima tolerada de antagonistas del calcio, presenta a los 3-4 meses clase funcional I-II y casi normalización de la presión arterial pulmonar media en el estudio hemodinámico.","Tras iniciar dosis máximas de antagonistas del calcio, presenta a los 3-4 meses empeoramiento de clase funcional y aumento de la presión pulmonar media.","Tras iniciar dosis máximas de antagonistas del calcio, presenta edemas en las piernas y aumento del calcio en sangre.","Los pacientes que, aunque no mejoren de clase funcional, normalizan las cifras de calcio en sangre."],"c":"A","e":"La respuesta sostenida a antagonistas del calcio (un subgrupo minoritario de pacientes con HAP idiopática, identificado previamente mediante test vasodilatador agudo positivo) se define por la mejoría clínica (clase funcional I-II) y hemodinámica (normalización casi completa de la presión pulmonar) mantenida en el tiempo con el tratamiento a dosis máxima tolerada."},{"q":"Señale la respuesta FALSA en relación con la hipertensión pulmonar del Grupo 3 (causada por enfermedades pulmonares o hipoxia):","o":["Supone la segunda causa más frecuente de hipertensión pulmonar.","Las principales patologías causantes son la EPOC y las enfermedades pulmonares intersticiales difusas.","Ambas desarrollan una hipertensión pulmonar más severa si coexisten enfisema o fibrosis.","El síndrome de apnea-hipopnea del sueño no se asocia a hipertensión pulmonar del grupo 3."],"c":"D","e":"El SAHS sí puede asociarse a hipertensión pulmonar del grupo 3 (aunque habitualmente de menor magnitud que en la EPOC o la fibrosis pulmonar), a través de la hipoxemia intermitente nocturna y la posible coexistencia de obesidad y síndrome de hipoventilación."},{"q":"Todas las siguientes son manifestaciones clínicas típicas de la enfermedad mixta del tejido conectivo, SALVO una:","o":["Fenómeno de Raynaud.","Artritis erosiva y deformante.","Afectación grave del sistema nervioso central.","Hipertensión pulmonar."],"c":"C","e":"A diferencia del LES, la afectación grave del sistema nervioso central NO es una manifestación típica de la enfermedad mixta del tejido conectivo, que se caracteriza por Raynaud casi constante, artritis (habitualmente no tan erosiva como la AR pero puede serlo), miositis, esclerodactilia e hipertensión pulmonar, uno de sus rasgos más temidos por su impacto pronóstico."},{"q":"Mujer de 72 años con osteoporosis grave que consulta por disnea, no fumadora, sin exposición a factores de riesgo relevantes. Cifoescoliosis grave en la exploración. Cabe esperar las siguientes anormalidades pulmonares, EXCEPTO:","o":["Neumopatía restrictiva.","Alteraciones V/Q con hipoxemia.","Hipertensión pulmonar.","Neumopatía obstructiva."],"c":"D","e":"La cifoescoliosis grave produce un patrón RESTRICTIVO (con las consiguientes alteraciones V/Q, hipoxemia crónica e hipertensión pulmonar secundaria por hipoxia crónica), pero no un patrón obstructivo, que no es consecuencia esperable de esta deformidad de la pared torácica."},{"q":"¿Cuál de las siguientes afirmaciones es cierta respecto a la hipertensión pulmonar primaria (idiopática)?","o":["Es una hipertensión pulmonar precapilar.","Responde favorablemente al tratamiento con glucocorticoides.","En el estudio funcional respiratorio destaca una intensa alteración ventilatoria restrictiva.","Es sinónimo de enfermedad venooclusiva pulmonar."],"c":"A","e":"La hipertensión arterial pulmonar idiopática (grupo 1) es, por definición, una forma PRECAPILAR de hipertensión pulmonar (presión de enclavamiento normal), que no responde a glucocorticoides (a diferencia de otras causas de HP secundarias a enfermedades inflamatorias), y que no cursa típicamente con alteración ventilatoria restrictiva significativa en las pruebas de función respiratoria; la enfermedad venooclusiva pulmonar es una entidad distinta, con peor pronóstico y manejo diferenciado."},{"q":"En el paciente con valvulopatía aórtica, la presencia de hipertensión pulmonar se ha relacionado con:","o":["Mayor grado de deterioro clínico del paciente.","Mayor incidencia de muerte súbita.","Mayor riesgo quirúrgico.","Todas las anteriores son ciertas."],"c":"D","e":"La hipertensión pulmonar en el contexto de la valvulopatía aórtica (especialmente la estenosis aórtica) es un marcador de enfermedad más avanzada y peor pronóstico, asociándose a mayor deterioro clínico, mayor riesgo de muerte súbita y mayor riesgo perioperatorio en la cirugía de recambio valvular."},{"q":"En la evaluación de la capacidad funcional de un paciente con hipertensión pulmonar utilizamos las siguientes pruebas, EXCEPTO:","o":["La clase funcional (OMS/NYHA).","Test de caminar 6 minutos.","Cateterismo cardiaco.","La prueba cardiopulmonar de ejercicio."],"c":"C","e":"El cateterismo cardiaco derecho es una prueba HEMODINÁMICA (invasiva) fundamental para el diagnóstico y estratificación pronóstica de la HP, pero no una prueba de evaluación FUNCIONAL/de capacidad de esfuerzo; la clase funcional, el test de 6 minutos marcha y la prueba cardiopulmonar de ejercicio sí son herramientas específicas de valoración funcional."},{"q":"El mejor método diagnóstico, que además puede definir accesibilidad y operabilidad, para la confirmación de la hipertensión pulmonar tromboembólica crónica es:","o":["La angiotomografía pulmonar.","El cateterismo cardiaco derecho con angiografía pulmonar.","La gammagrafía pulmonar V/Q.","Las pruebas de función respiratoria completas."],"c":"B","e":"El cateterismo cardiaco derecho combinado con angiografía pulmonar convencional es la prueba de referencia que confirma el diagnóstico hemodinámico y, crucialmente, permite valorar la accesibilidad quirúrgica de las obstrucciones trombóticas crónicas para planificar una eventual endarterectomía pulmonar, el tratamiento potencialmente curativo de esta entidad."},{"q":"Señale la respuesta correcta en relación a la esclerosis sistémica progresiva:","o":["Las manifestaciones pulmonares primarias son principalmente la enfermedad pulmonar intersticial difusa y la hipertensión pulmonar arterial.","La hipertensión pulmonar arterial tiene bajo impacto en la mortalidad.","Los anticuerpos antitopoisomerasa (Scl-70) se asocian predominantemente a hipertensión pulmonar arterial.","El patrón histológico NINE, variante fibrótica, es infrecuente en la esclerosis sistémica."],"c":"A","e":"La enfermedad pulmonar intersticial difusa (con patrón NINE fibrótico como el más frecuente) y la hipertensión arterial pulmonar son las dos manifestaciones pulmonares primarias características de la esclerosis sistémica, siendo ambas causas principales de morbimortalidad; la HAP tiene, de hecho, un ALTO impacto en la mortalidad, y los anticuerpos anticentrómero (no los anti-Scl-70) se asocian más predominantemente a la HAP aislada."},{"q":"En las definiciones de hipertensión pulmonar, indique la respuesta INCORRECTA:","o":["Se define como el aumento de la presión arterial pulmonar media ≥25 mmHg en reposo por cateterismo.","HP precapilar: presión arterial pulmonar media ≥25 mmHg y presión de enclavamiento ≤15 mmHg.","HP postcapilar: presión arterial pulmonar media ≥25 mmHg y presión de enclavamiento ≥15 mmHg.","HP precapilar: presión arterial pulmonar media ≥25 mmHg y presión de enclavamiento ≥15 mmHg."],"c":"D","e":"Esta opción contradice directamente la definición correcta de HP precapilar dada en la opción B (presión de enclavamiento ≤15 mmHg, no ≥15 mmHg, que correspondería a la definición de HP POSTcapilar), siendo por tanto la incorrecta."}]},"25":{"title":"Trombosis venosa profunda y tromboembolismo pulmonar.","questions":[{"q":"Según la guía CHEST, en pacientes con TVP DISTAL aislada de la pierna:","o":["No es necesario anticoagular si no hay progresión ecográfica del trombo mediante ecografías seriadas durante dos semanas.","Se prefiere anticoagular de entrada en pacientes poco sintomáticos, sobre las ecografías seriadas.","En caso de anticoagular, se debe hacer con una pauta más corta que para la TVP proximal.","La vena poplítea suele estar implicada en la TVP distal."],"c":"A","e":"En la TVP distal aislada de bajo riesgo, la guía CHEST permite una estrategia de vigilancia con ecografías seriadas durante 2 semanas en lugar de anticoagulación inmediata, iniciando el tratamiento solo si se documenta progresión del trombo; la vena poplítea, por definición, corresponde al territorio PROXIMAL."},{"q":"¿Qué afirmación es CORRECTA en el algoritmo diagnóstico de la trombosis venosa profunda (TVP)?","o":["La prueba de elección para confirmar el diagnóstico de TVP es la venografía.","Siempre es necesaria la determinación del dímero D.","En pacientes con baja probabilidad clínica y dímero D negativo no es necesaria la ecografía venosa compresiva.","En pacientes con alta sospecha clínica y dímero D alto, una ecografía negativa es suficiente para descartar el diagnóstico."],"c":"C","e":"En pacientes con baja probabilidad clínica pretest (escala de Wells) y un dímero D negativo, el valor predictivo negativo combinado es suficientemente alto para excluir la TVP sin necesidad de ecografía; la venografía ha sido sustituida en la práctica por la ecografía compresiva, no siempre es necesario el dímero D (en alta probabilidad clínica se puede ir directo a ecografía), y en alta sospecha clínica con dímero D alto, una ecografía única negativa puede requerir repetición a los días si la sospecha persiste, no siendo siempre suficiente para descartar."},{"q":"En la evaluación pronóstica y de gravedad del tromboembolismo pulmonar, señale la afirmación CORRECTA:","o":["Ante un paciente hemodinámicamente estable pero con disfunción de ventrículo derecho y troponina elevada, se debe considerar la fibrinolisis.","La escala de Wells clasifica a los pacientes según el riesgo de mortalidad.","El angio-TC es la mejor opción para estimar la disfunción ventricular derecha.","La presencia de ondas T negativas en precordiales se asocia a mejor pronóstico."],"c":"A","e":"En el TEP de riesgo intermedio-alto (estable hemodinámicamente pero con signos de disfunción del VD por imagen y elevación de biomarcadores como la troponina), debe considerarse individualizadamente la fibrinolisis o, más frecuentemente en la práctica actual, una vigilancia estrecha con posibilidad de rescate; la escala de Wells valora la PROBABILIDAD diagnóstica de TEP (no el riesgo de mortalidad, para lo cual se usa la escala PESI), el ecocardiograma (no el angio-TC) es la mejor herramienta funcional para valorar la disfunción del VD, y las ondas T negativas precordiales se asocian a PEOR pronóstico (marcador de sobrecarga de VD)."},{"q":"Señale la respuesta FALSA en relación con el tratamiento de la enfermedad tromboembólica venosa:","o":["El tratamiento trombolítico está indicado en shock secundario a embolismo pulmonar masivo, si no hay contraindicaciones.","El tratamiento del embolismo pulmonar con heparina parenteral se solapa con antivitamina K un mínimo de 4-5 días.","La duración del tratamiento anticoagulante debe cubrir al menos 3 meses.","Los anticoagulant
