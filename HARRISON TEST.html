 o incluso prednisona más un fármaco de segunda línea en combinación. Muchos requieren triple tratamiento con prednisona, metotrexato e IVIg y, si esto falla, rituximab. Informes recientes indican que la miopatía anti-HMGCR puede responder a la monoterapia con IVIg y a la fecha se está organizando un gran estudio clínico multicéntrico para valorar este método. Secukinumab es un inhibidor de la interleucina-17A utilizado para la psoriasis y la artritis psoriásica, no para la polimiositis. CUADRO VIII--61Inmunoterapias para miopatías inflamatorias ------------------------------------------------------------------------------------------- **Tratamiento** **Vía de **Dosis** **Efectos **Vigilancia** administración** secundarios** ----------------- ------------------ --------------- -------------------- ----------------- Prednisona VO 0.75 a 1.5 mg Hipertensión, Peso, presión kg/día como aumento de peso y arterial, glucosa dosis inicial retención de sérica/potasio, líquidos, formación de hiperglucemia, cataratas hipopotasemia, cataratas, irritación gástrica, osteoporosis, infección, necrosis femoral aséptica Metilprednisona IV 1 g en 100 Arritmia, rubor, Frecuencia mL/solución disgeusia, ansiedad, cardiaca, presión salina insomnio, aumento de arterial, glucosa isotónica peso, retención de sérica/ potasio durante 1 a 2 líquidos, h, diariamente hiperglucemia, o en días hipopotasemia, alternos infección durante 3 a 6 dosis Azatioprina VO 2 a 3 Enfermedad Biometría mg/kg/día; seudogripal, hemática, enzimas dosis única hepatotoxicidad, hepáticas matutina pancreatitis, leucopenia, macrocitosis, neoplasia, infección, teratogenicidad Metotrexato VO 7.5 a 20 mg Hepatotoxicidad, Enzimas semanales, fibrosis pulmonar, hepáticas, dosis única o infección, biometría divididas; neoplasia, hemática dosificación un infertilidad, día a la semana leucopenia, alopecia, irritación gástrica, estomatitis, teratogenicidad Por vía subcutánea 20 a 50 mg Igual que la dosis Igual que la semanales; VO nosa; m2, superficie corporal; VO, por vía oral. Tomado y modificado con autorización de Amato AA et al: Neuromuscular Disorders, 2nd ed. New York: McGraw Hill, 2016.","letters":["A","B","C","D","E"]},{"q":"Un paciente diagnosticado de esclerodermia con afectación cutánea difusa presenta hipertensión maligna, oliguria, edema, anemia hemolítica e insuficiencia renal. Se establece el diagnóstico de crisis renal por esclerodermia. ¿Cuál de los siguientes tratamientos es el recomendado?","o":["Captopril","Carvedilol","Clonidina","Diltiazem","Nitroprusiato"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 360) El pronóstico para los pacientes con nefropatía por esclerodermia es malo. En pacientes con crisis renal por esclerodermia, el tratamiento inmediato con un inhibidor de la enzima convertidora de la angiotensina (ACE, angiotensin converting enzyme) puede revertir la insuficiencia renal aguda. En estudios recientes, el inicio del tratamiento con inhibidores de la ACE dio lugar a que 61% de los pacientes presentaran algún grado de recuperación renal y no necesita diálisis crónica. La tasa de supervivencia se estima en 80% a 85% a los ocho años. Entre los pacientes que necesitaron diálisis, cuando fueron tratados con inhibidores de la ACE, más de 50% pudieron interrumpir la diálisis después de tres a 18 meses. Por lo tanto, los inhibidores de la ACE deben utilizarse incluso si el paciente necesita apoyo para diálisis.","letters":["A","B","C","D","E"]},{"q":"Un varón de 58 años acude a la clínica para una visita de seguimiento programada. Señala que ha estado dejando caer las cosas con más frecuencia y está teniendo problemas para levantarse desde la posición sentada. También ha notado trastornos de la deglución y tener que tragar varias veces para deglutir. En la exploración física tiene una fuerza de 4/5 en la extensión de la rodilla, fuerza 3/5 en los flexores de los dedos y atrofia en la cara medial de muslos y antebrazos. En los exámenes de laboratorio, su creatina cinasa es dos veces el límite superior normal. Se decidió tomar una biopsia muscular. ¿Qué hallazgo es probable que se observe en la biopsia muscular mediante microscopia óptica?","o":["Fibras musculares necróticas y con regeneración multifocal con escasa de inflamación","Atrofia muscular perifascicular","Infiltrado perivascular de células inflamatorias sin inflamación del endomisio","Vacuolas e inclusiones con reborde","Atrofia de las fibras musculares tipo 2"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 365) Es probable que este paciente tenga miositis por cuerpos de inclusión (IBM, inclusión dosis myositis). La miositis por cuerpos de inclusión suele manifestarse en pacientes \\> 50 años y es ligeramente más común en varones que en mujeres. Se asocia con debilidad progresiva lenta y atrofia muscular que tiene predilección por la afectación temprana de los flexores de la muñeca y de los dedos en los antebrazos y en el cuádriceps en las piernas (fig. VIII--60). Las concentraciones de creatina cinasa pueden ser normales o estar ligeramente elevados (normalmente \\< 10 veces lo normal). La biopsia muscular muestra infiltrados inflamatorios endomisiales compuestos predominantemente de linfocitos T CD8+ y macrófagos que rodean e invaden fibras musculares no necróticas, expresión del complejo 1 de histocompatibilidad mayor en el sarcolema, fibras con vacuolas con borde, fibras negativas para citocromo oxidasa e inclusiones en microscopia óptica o electrónica. Las inclusiones contienen proteínas mal plegadas en la hoja β (amiloide), pero son difíciles de apreciar con la tinción rutinaria con rojo Congo (se observan en cortes por congelamiento pero no con cortes en parafina). En la dermatomiositis, se aprecia la atrofia perifolicular e inflamación perivascular. En la miopatía necrosante mediada por el sistema inmunitario se observan fibras musculares con necrosis multifocal y fibras musculares en regeneración. En la miopatía crónica relacionada con glucocorticoides, en la biopsia se observa atrofia de las fibras musculares tipo 2. *\\[ FIGURA VIII--60 --- ver imagen en el documento original \\]* A. Manifestaciones musculares de la miositis por cuerpos de inclusión (A-C). La debilidad en la flexión de los dedos puede ser (A) sutil y multifocal (flechas negras), (B) moderada o (C) grave. Obsérvese que incluso con la parálisis completa de los flexores profundos y superficiales de los dedos, la flexión de la articulación metacarpofalángica (flechas) a menudo se mantiene por conservación de la función de los músculos lumbricales. (D) Atrofia de la cara palmar del antebrazo (flechas). (E) Atrofia de muslos mediales por pérdida del vasto interno (flechas). (F) Miositis temprana por cuerpos de inclusión (IBM), con conservación relativa del vasto interno, en comparación con (G) IBM avanzada con marcado reemplazo fibroso del vasto interno (flechas). B. Estudio histopatológico de la miositis por cuerpos de inclusión. (A) Fibras musculares dispersas con vacuolas con borde y fibras poco frecuentes con inclusiones eosinofílicas (flecha), tinción con hematoxilina y eosina. (B) La tinción de citocromo oxidasa demuestra un mayor número de tinciones pálidas o fibras musculares negativas a la citocromo oxidasa. (C) Las inclusiones citoplasmáticas tienen una tinción positiva con p62 dentro de una fibra muscular (flecha gruesa). (D) La microscopia electrónica revela inclusiones tubulofilamentosas de 15 a 21 nm en el núcleo de un miocito.","letters":["A","B","C","D","E"]},{"q":"Se valoró a una mujer de 64 años por debilidad. Desde hace varias semanas ha presentado dificultad para cepillarse los dientes y para peinarse. También ha notado una erupción en la cara. En la exploración física se detectó una erupción en heliotropo y debilidad muscular proximal. La creatina cinasa sérica está elevada y se le diagnosticó dermatomiositis. Después de ser valorada por un reumatólogo, se descubre que tiene anticuerpos anti-Jo-1. ¿Cuál de los siguientes hallazgos adicionales también es probable que tenga?","o":["Espondilitis anquilosante","Enfermedad intestinal inflamatoria","Neumopatía intersticial","Cirrosis biliar primaria","Psoriasis"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 365) Hasta en 20% de los pacientes con miopatías inflamatorias se encuentran varios autoanticuerpos contra antígenos nucleares y antígenos citoplasmáticos. Los anticuerpos contra los antígenos citoplasmáticos están dirigidos contra las ribonucleoproteínas implicadas en la síntesis de proteínas (antisintetasas) o transporte traduccional (partículas contra el reconocimiento de señal). Los anticuerpos dirigidos contra la RNA sintetasa de transferencia histidil, denominado anti-Jo-1, representa el 75% de todas las antisintetasas y es clínicamente útil porque hasta el 80% de los pacientes con este autoanticuerpo tendrán neumopatía intersticial. Los pacientes con anti-Jo-1 también pueden presentar el fenómeno de Raynaud, artritis no erosiva y las moléculas principales del complejo de histocompatibilidad DR3 y DRw52. La neumopatía intersticial asociada con anti-Jo-1 suele ser rápidamente progresiva y letal, incluso si se trata agresivamente con ciclofosfamida u otros inmunodepresores.","letters":["A","B","C","D","E"]},{"q":"Un varón de 22 años con antecedentes de consumo de drogas inyectables se presentó en la clínica con sensación de sequedad de la boca. Niega sequedad ocular, fotosensibilidad o sensación de cuerpo extraño en el ojo. También ha experimentado pérdida de peso y diaforesis nocturna. En la exploración física se encontró hinchazón bilateral de la glándula parótida y disminución de la secreción salival, pero no hay erupciones cutáneas, hinchazón articular ni otros hallazgos. Los exámenes de laboratorio fueron negativas para anticuerpos antinucleares, anticuerpos Ro/SS-A y anticuerpos La/SS-B. La radiografía de tórax no muestra infiltrados ni linfadenopatías. ¿Cuál es el diagnóstico más probable?","o":["Infección por VIH","Enfermedad relacionada con IgG4","Síndrome de Sjögren primario","Artritis reumatoide con síndrome de Sjögren secundario","Sarcoidosis"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 361) El diagnóstico diferencial para el agrandamiento de la glándula parótida es amplio e incluye infecciones, trastornos endocrinos, trastornos metabólicos y otros trastornos inflamatorios. La infección por VIH puede causar síndrome de mucosas secas y agrandamiento de la parótida, especialmente en varones jóvenes, como se describe en este caso. El síndrome de Sjögren primario es más frecuente en las mujeres y los pacientes suelen tener anticuerpos Ro/SS-A, anticuerpos La/SS-B, o ambos (cuadro VIII-36A y B). La paciente no presenta síntomas oculares, lo que sería atípico para el síndrome de Sjögren primario; tampoco tiene molestias articulares que indiquen artritis reumatoide. La artritis reumatoide, al igual que el síndrome de Sjögren primario, es más frecuente en mujeres de edad madura. La sarcoidosis puede afectar a pacientes de diferentes edades y de ambos sexos, pero nada en el caso sugiere que haya afectación de otros órganos, como afectación pulmonar, cutánea o articular. El síndrome IgG4 se presenta típicamente en hombres de edad madura a ancianos y puede afectar a una amplia gama de órganos (cap. 361). CUADRO VIII--36ASubgrupos de esclerosis sistémica (SSc): Características de la esclerosis sistémica cutánea limitada frente a la enfermedad cutánea difusa ----------------------------------------------------------------------- **Manifestaciones **SSc cutánea **SSc cutánea difusa** características** limitada** ----------------------- ----------------------- ----------------------- Afección cutánea Inicio lento; limitado Inicio rápido; difuso: a los dedos, distal a dedos, extremidades, los codos, cara; cara, tronco; progresión lenta progresión rápida Fenómeno de Raynaud Antecede a la El inicio coincide con afectación de la piel, la afectación de la algunas veces por años; piel; la isquemia puede estar asociada crítica es menos con isquemia crítica en frecuente los dedos Musculoesquelético Artralgia leve Artralgia grave, síndrome del túnel del carpo, roces tendinosos; contracturas de articulaciones pequeñas y grandes Neumopatía intersticial Lentamente progresivo, Con frecuencia, inicio por lo general leve temprano y progresión, puede ser grave Hipertensión arterial Con frecuencia, tardía, A menudo ocurre en pulmonar puede presentarse como asociación con complicación aislada neumopatía intersticial Crisis renal por Muy poco frecuente Ocurre en 15% de los esclerodermia casos; el inicio puede ser fulminante; generalmente precoz (\\< 4 años desde el inicio de la enfermedad) Calcinosis cutánea Frecuente, prominente Menos frecuente, leve Autoanticuerpos Anticuerpos contra Anticuerpos contra característicos centrómeros topoisomerasa I (Scl-70), anticuerpos contra polimerasa III de RNA ----------------------------------------------------------------------- CUADRO VIII--36BEsclerosis sistémica mayor: autoanticuerpos específicos y principales características asociadas ----------------------------------------------------------------------- **Antígeno objetivo** **Subgrupo de SSc** **Asociación clínica característica prominente** ----------------------- ----------------------- ----------------------- Topoisomerasa I de DNA dcSSc Roces tendinosos, (Scl-70) Patrón moteado úlceras digitales isquémicas, esclerodermia, afectación cutánea extensa, ILD precoz, afectación cardiaca, crisis renal por esclerodermia Proteínas de los lcSSc Úlceras digitales centrómeros Patrón con isquémicas, calcinosis moteado aislado cutánea, hipertensión (centrómero) arterial pulmonar aislada; crisis renal poco frecuente RNA polimerasa III dcSSc Enfermedad rápidamente Patrón moteado progresiva, roces tendinosos, contracturas articulares, GAVE, crisis renal, cánceres concomitantes; úlceras digitales con poca frecuencia Patrón nucleolar U3-RNP dc/lcSSc PAH, ILD, crisis renal (fibrilarina) esclerodérmica, afectación del tubo digestivo, miositis Th/T0 Patrón nucleolar lcSSc PAH, ILD Patrón nucleolar PM/Scl lcSSc Calcinosis cutánea, ILD, superposición de miositis Ku Patrón moteado Superposición LES, solapamiento de miositis U1-RNP. Patrón moteado MCTD HAP, artritis inflamatoria, superposición de miositis U11/U12 RNP Patrón dc/lcSSc ILD moteado ----------------------------------------------------------------------- Abreviatura: dcSSc, esclerosis sistémica cutánea difusa; GAVE, ectasia vascular del antro gástrico; GI, gastrointestinal; ILD, neumopatía intersticial; lcSSc, esclerosis sistémica cutánea limitada; MCTD, colagenopatía mixta; PAH, hipertensión arterial pulmonar; SLE, lupus eritematoso sistémico.","letters":["A","B","C","D","E"]},{"q":"Todas las siguientes afecciones son manifestaciones de la enfermedad relacionada con IgG4 EXCEPTO:","o":["Pancreatitis autoinmunitaria","Glomerulonefritis semilunar","Aortitis linfoplasmocítica","Seudotumor orbitario","Sialadenitis"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 368) La enfermedad relacionada con IgG4 (IgG4-RD) por lo general se manifiesta de forma subaguda, e incluso en el contexto de enfermedad multiorgánica, la mayor parte de los pacientes no presenta fiebre ni elevaciones drásticas en las concentraciones de proteína C reactiva (cuadro VIII--72). Sin embargo, algunos pacientes experimentan una pérdida de peso sustancial durante periodos de meses. La enfermedad clínicamente aparente puede evolucionar a lo largo de meses, años o incluso décadas antes de que las manifestaciones dentro de un órgano determinado sean lo suficientemente graves como para que el paciente solicite atención médica. La pancreatitis autoinmunitaria tipo 1 es característica de la enfermedad relacionada con IgG4. Los pacientes con pancreatitis autoinmunitaria tipo 1 pueden tener su principal foco de enfermedad en el páncreas; sin embargo, las valoraciones exhaustivas mediante anamnesis, exploración física, análisis de sangre e imágenes transversales pueden demostrar agrandamiento de la glándula lagrimal, sialadenitis, linfadenopatía, diversos hallazgos pulmonares, nefritis tubulointersticial, enfermedad hepatobiliar, aortitis, fibrosis retroperitoneal u otro compromiso de órganos. Dos características comunes de la enfermedad relacionada con IgG4 son enfermedades alérgicas y la tendencia a formar lesiones voluminosas que imitan enfermedades malignas, como el seudotumor orbitario. En los riñones, se ha informado nefritis tubulointersticial y rara vez glomerulonefritis membranosa, pero no glomerulonefritis semilunar. CUADRO VIII--72Manifestaciones orgánicas de la enfermedad relacionada con IgG4 ----------------------------------------------------------------------- **Órgano** **Manifestaciones clínicas principales** ----------------------------------- ----------------------------------- Órbitas y tejidos periorbitarios Inflamación indolora del párpado o del tejido periocular; seudotumor orbitario; dacrioadenitis; dacriocistitis; miositis orbitaria y lesiones masivas que se extienden hacia la fosa pterigopalatina e infiltran a lo largo del nervio trigémino Oídos, nariz y senos paranasales Fenómenos alérgicos (pólipos nasales, asma, rinitis alérgica, eosinofilia periférica); obstrucción nasal, rinorrea, anosmia, sinusitis crónica; lesiones osteolíticas ocasionales Glándulas salivales Agrandamiento de las glándulas submandibulares, parótidas o ambas (afectación bilateral aislada de la glándula submandibular más frecuente); algunas veces están comprometidas las glándulas salivales menores Meninges Cefalea, radiculopatía, parálisis de los pares craneales u otros síntomas resultantes de la compresión de la médula espinal; tendencia a formar lesiones masivas; la resonancia magnética muestra un marcado engrosamiento y reforzamiento de la duramadre Hipotálamo e hipófisis Síndromes clínicos resultantes de la afectación del hipotálamo y la hipófisis, por ejemplo, deficiencia de hormonas adenohipofisarias, diabetes insípida central o ambas; las imágenes revelan un tallo hipofisario engrosado o formación de una tumoración, hinchazón de la hipófisis o formación de tumoración dentro de la hipófisis Ganglios linfáticos Linfadenopatía generalizada o enfermedad localizada adyacente a un órgano afectado específico; los ganglios linfáticos afectados miden por lo general de 1 a 2 cm de diámetro y no son dolorosos a la palpación Glándula tiroides Tiroiditis de Riedel; variante fibrosa de la tiroiditis de Hashimoto Pulmones Sin datos en los estudios de imágenes pulmonares; tos, hemoptisis, disnea, derrame pleural o síntomas torácicos; relacionados con afectación pulmonar parenquimatosa, enfermedad pleural o ambas; cuatro síndromes pulmonares clínicos principales: seudotumor inflamatorio, tumoración paravertebral que se extiende a menudo sobre varias vértebras, enfermedad de las vías respiratorias centrales, neumonía intersticial difusa o localizada; las lesiones pleurales presentan engrosamiento nodular grave de la pleura visceral o parietal con inflamación esclerosante difusa, en ocasiones asociada con derrame pleural Aorta Sin datos en los estudios radiológicos; hallazgo durante una cirugía aórtica programada; disección aórtica; los síndromes clínico-patológicos descritos incluyen aortitis linfoplasmocítica de aorta torácica o abdominal, disección aórtica, periaortitis y periarteritis y aneurisma inflamatorio de la aorta abdominal Retroperitoneo Dolor lumbar, dolor hipogástrico, edema de las extremidades inferiores, hidronefrosis por afectación ureteral, estudios radiológicos sin datos; el aspecto radiológico clásico es la inflamación periaórtica que se extiende en dirección caudal hasta comprometer los vasos iliacos Riñones Nefritis tubulointersticial; glomerulonefritis membranosa en una pequeña proporción de pacientes; lesiones tumorales asintomáticas, en los estudios de imagen se detectan lesiones, por lo general múltiples y bilaterales; la afección renal tiene una asociación fuerte con hipocomplementemia. Páncreas Pancreatitis autoinmunitaria tipo 1, que se manifiesta como dolor abdominal leve; pérdida de peso; ictericia aguda obstructiva, que simula un adenocarcinoma del páncreas (incluida una tumoración pancreática); entre 20% y 50% de los pacientes presentan intolerancia aguda a la glucosa; las imágenes muestran agrandamiento pancreático difuso (denominada \"páncreas con forma de salchicha\") o segmentario, con pérdida de la lobularidad normal; una tumoración a menudo plantea la sospecha de malignidad Hígado y vías biliares Ictericia obstructiva asociada con autoinmunidad en la mayor parte de los casos; pérdida de peso; esteatorrea; dolor abdominal; y diabetes mellitus de aparición reciente; cuadro clínico similar a colangitis esclerosante primaria y colangiocarcinoma Otros órganos implicados Vesícula biliar, hígado (tumoraciones), mama (seudotumor), próstata (prostatismo), pericardio (pericarditis constrictiva), mesenterio (mesenteritis esclerosante), mediastino (mediastinitis fibrosante), piel (pápulas eritematosas o de color carne), nervios periféricos (inflamación perineural) -----------------------------------------------------------------------","letters":["A","B","C","D","E"]},{"q":"Un varón de 60 años solicitó valoración por rubor intermitente, diarrea, cefalea y erupción cutánea de varios meses de evolución. Ha notado que sus síntomas de diarrea y rubor tienden a empeorar si toma ibuprofeno para el tratamiento de la cefalea. En la exploración física, tiene bazo palpable y linfadenopatía cervical. La triptasa sérica está elevada, en 35 ng/mL. Sus lesiones cutáneas se muestran en la figura VIII--12. Se realizó una biopsia cutánea diagnóstica. ¿Qué hallazgos histológicos es más probable que se encuentren en la biopsia de piel?","o":["Dermatitis de la interfaz","Infiltrados densos multifocales de mastocitos","Infiltrado dérmico neutrofílico","Granulomas no caseificantes","Espongiosis en la epidermis"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 354) Este paciente presenta mastocitosis, que se define por la acumulación de mastocitos provenientes de expansión clonal en tejidos como la piel, la médula ósea, el hígado, el bazo y el intestino. La expansión de los mastocitos generalmente se reconoce en la piel, en la médula ósea o en ambos. La mastocitosis puede limitarse a la piel (mastocitosis cutánea) o ser sistémica. La mastocitosis sistémica (SM, systemic mastocytosis) se refiere a la afectación de un sitio(s) no cutáneo(s). Las manifestaciones clínicas del SM se deben a la liberación de sustancias bioactivas que actúan en sitios locales y distantes, a la ocupación hística por la masa de mastocitos y a la respuesta hística a dicha masa. Las manifestaciones inducidas farmacológicamente incluyen rubor intermitente, taquicardia y colapso vascular, dolor gástrico, cólicos en hipogastrio y diarrea. La fibrosis periportal relacionada con la infiltración de mastocitos y el incremento de eosinófilos pueden provocar hipertensión portal y ascitis. En algunos pacientes, las picaduras de himenópteros pueden inducir una anafilaxis con colapso vascular rápido y potencialmente letal. Estos pacientes suelen tener evidencia de IgE específica para el veneno. Los trastornos neuropsiquiátricos son clínicamente más evidentes y se manifiestan con deterioro de la memoria reciente, disminución de la capacidad de atención y cefalea \"migrañosa\". Los pacientes pueden experimentar una exacerbación de un signo o síntoma clínico específico de forma variable con la ingestión de alcohol, los cambios de temperatura, el estrés, el uso de opioides que interactúan con los mastocitos o la ingestión de fármacos antiinflamatorios no esteroideos. La mastocitosis se presenta a cualquier edad y tiene una ligera preponderancia en varones. La mastocitosis cutánea se diagnostica mediante la observación de las lesiones características de la mastocitosis cutánea maculopapular o mastocitoma(s). Se puede obtener una biopsia cutánea para confirmar el diagnóstico. Aunque el diagnóstico de SM se sospecha generalmente con base en la historia clínica y los datos de la exploración física y puede respaldarse mediante procedimientos de laboratorio (como la elevación de la triptasa sérica en este caso), solo se puede establecer mediante diagnóstico histológico. Se observa un infiltrado dérmico neutrofílico en el síndrome de Sweet y otras dermatosis neutrofílicas. Los granulomas no caseificantes pueden observarse en el sarcoide cutáneo. Se observa una dermatitis de interfaz en diversas afecciones, como lupus cutáneo, dermatomiositis y algunas infecciones. Los cambios espongióticos en la epidermis son característicos de la dermatitis eccematosa.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 57 años con depresión y migraña crónica informó de padecimiento de varios años de evolución con sequedad de boca y ojos secos. Su queja principal es que ya no puede comer sus galletas favoritas, pero también informa fotosensibilidad y ardor en los ojos. No tiene otros síntomas asociados. La exploración física muestra mucosa oral seca, eritematosa y pegajosa. Es probable que todas las pruebas siguientes sean positivas en esta paciente EXCEPTO:","o":["Anticuerpos La/SS-B","Anticuerpos Ro/SS-A","Prueba de Schirmer I","Anticuerpos Scl-70","Sialometría"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 361) El paciente presentaba síntomas clásicos del síndrome de Sjögren primario, como sequedad de boca y ojos. Esta afección puede ser primaria, como en este caso o secundaria en asociación con otra enfermedad del tejido conjuntivo como esclerodermia o artritis reumatoide. Se pueden demostrar muchos autoanticuerpos en el suero de pacientes con síndrome de Sjögren, incluidos anticuerpos contra Ro/SS-A o La/SS-B. La sialometría demostrará una disminución de la producción de saliva y la resonancia magnética o la sialografía por resonancia magnética de las glándulas salivales principales también puede mostrar anomalías. La prueba de Schirmer I demuestra la afectación ocular con disminución de la producción de lágrimas. El anticuerpo Scl-70 se asocia a esclerodermia y no debe ser positivo en el síndrome primario de Sjögren.","letters":["A","B","C","D","E"]},{"q":"Los pacientes con esclerodermia tienen un mayor riesgo de presentar todas las siguientes complicaciones en el aparato cardiovascular EXCEPTO:","o":["Aneurisma de la aorta abdominal","Bloqueo cardiaco por fibrosis del sistema de conducción","Disfunción del ventrículo izquierdo","Hipertensión arterial pulmonar","Fenómeno de Raynaud"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 360) El fenómeno de Raynaud, la complicación extracutánea más frecuente de la esclerosis sistémica (SSc, systemic sclerosis), se caracteriza por episodios de vasoconstricción reversible en los dedos de las manos y los pies, que a veces también afectan la punta de la nariz y los lóbulos de las orejas. El fenómeno de Raynaud en la esclerodermia puede asociarse con úlceras digitales isquémicas y pérdida de los dedos. Aunque es a menudo asintomática, la afectación cardiaca variable en la esclerosis sistémica se detecta en 10% a 50% de los pacientes sometidos a detección con herramientas diagnósticas sensibles. La afectación cardiaca clínica, más frecuente en la esclerosis sistémica cutánea difusa que en la esclerosis sistémica cutánea limitada, puede ser primaria o secundaria a hipertensión arterial pulmonar (PAH, pulmonary arterial hypertension), neumopatía intersticial o compromiso renal y se asocia con malos resultados. El endocardio, miocardio y pericardio pueden verse afectados por separado o juntos. La afectación pericárdica se manifiesta como pericarditis, derrames pericárdicos, pericarditis constrictiva y, en raras ocasiones, taponamiento cardiaco. La fibrosis del sistema de conducción ocurre con frecuencia y puede ser asintomática o manifestarse por bloqueo cardiaco. La afectación microvascular, el vasoespasmo recurrente y la lesión por isquemia-reperfusión contribuyen a la fibrosis miocárdica en placas, lo que produce una disfunción ventricular izquierda sistólica o diastólica asintomática que puede progresar a insuficiencia cardiaca manifiesta. Puede producirse miocarditis aguda o subaguda que conduce a disfunción ventricular izquierda y el diagnóstico requiere resonancia magnética cardiaca o biopsia endomiocárdica. Si bien la ecocardiografía convencional tiene baja sensibilidad para detectar la afectación cardiaca preclínica en la esclerosis sistémica, las nuevas modalidades, como la ecocardiografía Doppler hística, la resonancia magnética cardiaca y las gammagrafías (CT por emisión de fotón único) revelan una alta prevalencia de perfusión o función miocárdica anormal. Las concentraciones séricas del extremo amino terminal del propéptido natriurético encefálico, una hormona ventricular elevada en la SSc-PAH, también pueden tener utilidad como marcadores de compromiso cardiaco primario. No se han notificado casos de aumento de los aneurismas aórticos en pacientes con esclerodermia.","letters":["A","B","C","D","E"]}]},"42":{"title":"Síndromes vasculíticos. Enfermedad relacionada con IgG4. Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios.","questions":[{"q":"Todas las siguientes afecciones se asocian con síndrome de Behçet EXCEPTO:","o":["Artritis","Trombosis venosa profunda","Foliculitis","Úlceras genitales","Escleritis"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 364) El síndrome de Behçet es un trastorno multisistémico que se presenta con ulceraciones orales y genitales recurrentes, así como afectación ocular, cutánea y articular. El diagnóstico es clínico y se basa en criterios diagnósticos acordados internacionalmente. Las ulceraciones orales recurrentes son una condición indispensable para el diagnóstico del síndrome de Behçet. Las úlceras por lo general son dolorosas, superficiales o profundas con una base necrótica amarillenta central, aparecen solas o agrupadas y pueden localizarse en cualquier parte de la cavidad bucal. Las úlceras genitales son menos frecuentes, pero más específicas, son dolorosas, no afectan el glande ni la uretra y producen cicatrices escrotales y vulvares. Se observa afectación cutánea en 80% de los pacientes e incluye foliculitis, eritema nudoso, erupciones cutáneas similares al acné y, con poca frecuencia, vasculitis, síndrome de Sweet y piodermia gangrenoso. La reactividad inflamatoria cutánea inespecífica al rasguño o a la inyección intradérmica de solución salina (prueba de patergia) es una manifestación específica. La artritis o artralgias no deformantes se observan en 50% de los pacientes y afectan principalmente a las rodillas y tobillos. También se pueden observar entesopatía, necrosis avascular, mialgias y miositis. La trombosis venosa periférica superficial o profunda se observa en 30% de los pacientes. La embolia pulmonar es una complicación poco frecuente. La afectación ocular con cicatrización y panuveítis bilateral es la complicación más temida, ya que en ocasiones progresa rápidamente hasta convertirse en ceguera. La uveítis se presenta en 10% a 15% de los pacientes, principalmente en varones. Por lo general, está presente al inicio, pero también puede desarrollarse en los primeros años. Además de la iritis, en algunos pacientes se observan raramente uveítis posterior, oclusiones de vasos retinianos y neuritis óptica. La escleritis, una complicación de la artritis reumatoide, no se ha descrito con frecuencia asociada al síndrome de Behçet.","letters":["A","B","C","D","E"]},{"q":"En un hombre de 29 años con dolor abdominal episódico y edema ocasional inducido por el estrés en los labios, la lengua y la laringe, ¿cuál de las siguientes proteínas probablemente se encuentre con concentraciones absolutas o funcionales bajas?","o":["Inhibidor de la esterasa C1","C5A (cascada del complemento)","Ciclooxigenasa","IgE","Receptor de linfocitos T, cadena α"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 1 El sistema inmunitario en la salud y la enfermedad, cap. 349) La actividad del complemento, que resulta de la interacción secuencial de un gran número de proteínas plasmáticas y de membrana celular, desempeña una función importante en la respuesta inflamatoria. La vía clásica de activación del complemento se debe a una interacción entre antígenos y anticuerpos. El primer componente del complemento (C1, un complejo compuesto por tres proteínas) se une a los complejos inmunitarios con activación mediada por C1q. La C1 activa inicia el desdoblamiento y la activación concomitante de los componentes C4 y C2. El C1 activado es desdoblado por un inhibidor de la proteasa plasmática denominado inhibidor de la esterasa C1. Esta molécula también regula el factor de coagulación XI y la calicreína. Los pacientes con deficiencia del inhibidor de la esterasa C1 pueden desarrollar angioedema, que a veces puede provocar la muerte por asfixia. Los ataques pueden ser precipitados por estrés o traumatismo. Además de concentraciones antigénicas o funcionales bajas del inhibidor de la esterasa C1, los pacientes con esta afección autosómica dominante pueden tener concentraciones normales de C1 y C3, pero niveles bajos de C4 y C2. El tratamiento con danazol produce un aumento sorprendente de las concentraciones de este importante inhibidor y alivia los síntomas en muchos pacientes. Se ha descrito una forma adquirida de angioedema causada por una deficiencia del inhibidor de la esterasa C1 en pacientes con enfermedad autoinmunitaria o maligna.","letters":["A","B","C","D","E"]},{"q":"Un varón de 45 años originario de Arkansas tiene antecedente de hipertensión con tratamiento con lisinopril y cáncer colorrectal acude a la clínica para revisión después de una visita reciente a la sala de urgencias. Informó que en fecha reciente se le diagnosticó un episodio de anafilaxis. Acudió a la sala de urgencias con edema laríngeo y urticaria difusa y recibió tratamiento con epinefrina. En la anamnesis se amplió la información sobre su diagnóstico reciente de cáncer colorrectal por el que recibió varias dosis de cetuximab. También refirió disnea y tos de dos semanas de evolución antes del episodio de anafilaxis. Se solicitó CT de tórax con medio de contraste intravenoso, se le diagnosticó neumonía y se le trató con ceftriaxona. Inmediatamente antes de su episodio de anafilaxis, cenó un bistec por el cumpleaños de su esposa. ¿Cuál es el antígeno para los anticuerpos IgE que probablemente causó la reacción anafiláctica?","o":["Alfa-1, 3-galactosa (alfa-gal)","Ceftriaxona","Medio de contraste yodado","Lisinopril"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 353) La anafilaxis es una reacción alérgica sistémica potencialmente letal que afecta a uno o más sistemas orgánicos que por lo general ocurre en segundos o minutos después de la exposición al desencadenante anafiláctico, en la mayor parte de los casos fármacos, alimentos o picaduras de himenópteros. El paciente estuvo expuesto a medio de contraste yodado y ceftriaxona dos semanas antes del incidente sin repetir la exposición, lo que indica que estos fármacos no eran la causa de la anafilaxis. Los fármacos biológicos recombinantes pueden inducir la formación de IgE contra las proteínas o contra estructuras glucosiladas que actúan como inmunógenos. En fecha más reciente se reportaron brotes epidémicos de anafilaxis a anticuerpos contra EGFR, en asociación con incremento en los títulos de IgE sérica contra alfa-1, 3-galactosa, un oligosacárido que se encuentra en mamíferos, no en primates. El cetuximab es un derivado de células murinas que expresan una transferasa que marca la porción Fab\\' de la cadena pesada de cetuximab con alfa-1, 3-galactosa. Los pacientes con antecedente de múltiples picaduras por garrapatas Amblyomma americanum a menudo se encuentran en las Carolinas, Arkansas y Tennessee y tienen más propensión a tener anticuerpos IgE contra alfa-1, 3-galactosa en comparación con pacientes de grupo testigo que viven fuera de esos estados. Dichos individuos que pueden presentar sensibilización a alfa-1, 3-galactosa pueden desarrollar episodios de anafilaxis tardía a la carne de res, de cordero y de puerco. Los antibióticos y los medios de contraste yodado son causas potenciales de anafilaxis, pero dado que el paciente recibió tratamiento con cetuximab, la región geográfica donde se indica y el evento desencadenante de consumir carne de res, es más probable la anafilaxis inducida por alfa-1, 3-galactosa. El lisinopril puede causar angioedema a través de disminución del catabolismo de la bradicinina, un mecanismo patógeno diferente a la anafilaxis.","letters":["A","B","C","D"]},{"q":"¿Cuál de los siguientes fármacos se pueden usar para tratar varios síndromes febriles periódicos genéticos, como el síndrome de Muckle-Wells, la hiperinmunoglobulinemia D con síndrome de fiebre periódica y síndrome periódico asociado con el receptor del factor de necrosis tumoral?","o":["Adalimumab","Canakinumab","Colquicina","Lisinopril","Rituximab"],"c":"B","e":"La respuesta es B. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 369) El síndrome de Muckle-Wells (MWS, Muckle-Wells syndrome), la hiperinmunoglobulinemia D con síndrome febril periódico (HIDS) y el síndrome periódico relacionado con los receptores de factor de necrosis tumoral (TRAPS, TNF-receptor-associated periodic syndrome) son trastornos hereditarios que conducen a una activación excesiva de inflamosomas y a un aumento de la señalización de interleucina (IL)-1. Por lo tanto, en estos síndromes es útil el canakinumab, un inhibidor de IL--1. El etanercept, un inhibidor del TNF, aminora los ataques de TRAPS, pero la experiencia a largo plazo con este fármaco ha sido menos favorable. La inhibición de IL--1 ha sido beneficiosa en un gran porcentaje de los pacientes en los que se ha utilizado y recientemente canakinumab recibió la aprobación de la U.S. Food and Drug Administration para el tratamiento de TRAPS. Deben evitarse los anticuerpos monoclonales contra TNF como el adalimumab, ya que pueden exacerbar los ataques de TRAPS. El rituximab, que se dirige al antígeno CD20 en los linfocitos B, no es útil en estos trastornos de la inmunidad innata. La colquicina funciona bien en otro síndrome febril periódico, la fiebre mediterránea familiar, pero no es el fármaco preferido para MWS, HIDS o TRAPS. Lisinopril es un inhibidor de la enzima convertidora de la angiotensina y no es útil para tratar la inflamación de estos trastornos.","letters":["A","B","C","D","E"]},{"q":"Se valora a un varón de 46 años que, hace seis meses, acudió al hospital de forma aguda con hemoptisis, infiltrados pulmonares nodulares difusos y glomerulonefritis. El estudio reveló un estudio serológico positivo para anticuerpos contra citoplasma de neutrófilos (ANCA, antineutrophil cytoplasmic antibodies) y finalmente se le diagnosticó granulomatosis con poliangitis. El tratamiento se inició con dosis altas de glucocorticoides y ciclofosfamida diaria con excelente respuesta clínica. Está listo hoy para que el paciente haga la transición del tratamiento de inducción con ciclofosfamida al tratamiento de mantenimiento con azatioprina. ¿Qué análisis de sangre debe hacerse antes de comenzar el tratamiento con azatioprina?","o":["Títulos de ANCA","Crioglobulinas","Genotipificación del CYP3A4","Concentraciones de la enzima glucosa-6-fosfato deshidrogenasa","Actividad enzimática de tiopurina metiltransferasa"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 363) Antes de iniciar el tratamiento con azatioprina, debe analizarse la tiopurina metiltransferasa, una enzima que participa en el metabolismo de la azatioprina, porque concentraciones inadecuadas pueden provocar citopenia grave. Los títulos de anticuerpos contra el citoplasma de neutrófilos (ANCA) puede inducir a error y no debe utilizarse para valorar la actividad de la enfermedad. Muchos pacientes que logran la remisión siguen teniendo títulos elevados durante años. Los resultados de un amplio estudio prospectivo revelaron que los aumentos de ANCA no se asociaron con recaídas y que solo 43% de los pacientes presentaron recidiva en el plazo de un año tras un aumento de los niveles de ANCA. Por lo tanto, un aumento del ANCA por sí solo no es un presagio de una recaída inmediata de la enfermedad y no debe conducir a la reinstauración ni al aumento del tratamiento inmunodepresor.","letters":["A","B","C","D","E"]},{"q":"¿Cuál de las siguientes opciones es necesaria para el diagnóstico del síndrome de Behçet?","o":["Vasculitis de vasos de grueso calibre","Prueba de patergia","Úlceras orales recurrentes","Úlceras genitales recurrentes","Uveítis"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 364) El síndrome de Behçet se diagnostica con base en sus manifestaciones clínicas. Para el diagnóstico se requiere ulceración oral recurrente. Las úlceras pueden ser únicas o múltiples, son superficiales con una base necrótica amarillenta y son dolorosas. Por lo general, son pequeñas, de menos de 10 mm de diámetro. Además, el diagnóstico del síndrome de Behçet requiere dos de los siguientes datos: ulceración genital recurrente, lesiones oculares, lesiones cutáneas y prueba de patergia. La reactividad inflamatoria cutánea inespecífica a cualquier rasguño o inyección intradérmica de solución salina (prueba de patergia) es común y específica.","letters":["A","B","C","D","E"]},{"q":"¿En cuál de los siguientes síndromes vasculíticos es de mayor utilidad la biopsia pulmonar para el diagnóstico?","o":["Vasculitis crioglobulinémica","Vasculitis cutánea","Granulomatosis con poliangitis (Wegener)","Vasculitis por IgA (Henoch-Schönlein)","Poliarteritis nudosa"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 363) La granulomatosis con poliangitis (de Wegener) es una vasculitis de vasos pequeños que afecta al pulmón en \\> 80% de los casos. Casi 30% de los pacientes con anomalías radiográficas pueden cursar asintomáticos. Por lo general, también afecta las vías respiratorias altas y el riñón. Las biopsias quirúrgicas del parénquima pulmonar radiográficamente anormal tienen un rendimiento diagnóstico cercano a 90% en pacientes con granulomatosis con poliangitis (de Wegener). La biopsia también puede diferenciar la vasculitis de una infección o una neoplasia maligna. La utilidad de la biopsia transbronquial broncoscópica es sustancialmente inferior al de la biopsia quirúrgica. La vasculitis crioglobulinémica y la vasculitis por IgA (Henoch-Schönlein) son vasculitis de vasos pequeños que por lo general afectan la piel y los riñones. La poliarteritis nudosa es una vasculitis de vasos de mediano calibre que normalmente afecta a los vasos mesentéricos. La vasculitis cutánea representa la característica vasculítica más común y puede observarse en un amplio espectro de situaciones, como infecciones, fármacos, neoplasias malignas y enfermedades del tejido conjuntivo.","letters":["A","B","C","D","E"]},{"q":"Todo lo siguiente ha estado implicado en la patogenia propuesta de la sarcoidosis EXCEPTO:","o":["Exposición al moho","Susceptibilidad genética","Respuesta inmunitaria a las proteínas micobacterianas","Infección por Propionibacterium acnes","Expansión maligna de los linfocitos T cooperadores"],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 367) A pesar de las múltiples investigaciones, se desconoce la causa de la sarcoidosis. Actualmente, la causa más probable es un agente ambiental infeccioso o no infeccioso que desencadena una respuesta inflamatoria en un hospedador genéticamente susceptible. Entre los posibles agentes infecciosos, estudios cuidadosos han mostrado una incidencia mucho mayor de Propionibacterium acnes en los ganglios linfáticos de los pacientes con sarcoidosis en comparación con el grupo testigo. Un modelo en animales ha demostrado que P. acnes puede inducir una respuesta granulomatosa en ratones similar a la sarcoidosis. Otros han demostrado la presencia de una proteína micobacteriana (peroxidasa de catalasa de Mycobacterium tuberculosis) en los granulomas de algunos pacientes con sarcoidosis. Esta proteína es muy resistente a la degradación y puede representar el antígeno persistente en la sarcoidosis. Otro laboratorio ha documentado la respuesta inmunitaria a esta y otras proteínas micobacterianas. Tales estudios sugieren que una micobacteria similar a M. tuberculosis podría ser la causa de la sarcoidosis. El mecanismo de exposición/infección con tales microorganismos ha sido el foco de otros estudios. La exposición ambiental a insecticidas y moho se ha asociado con un mayor riesgo para la enfermedad. Además, los trabajadores sanitarios parecen tener un mayor riesgo. Además, se ha producido sarcoidosis en un órgano de donante después del trasplante a un paciente con sarcoidosis. Algunos autores han sugerido que la sarcoidosis no se debe a un solo agente, sino que representa una respuesta particular del hospedador a múltiples fármacos. Algunos estudios han podido correlacionar las exposiciones ambientales con los marcadores genéticos. Estos estudios han apoyado la hipótesis de que un huésped genéticamente susceptible es un factor clave de la enfermedad. Aunque los linfocitos T colaboradores pueden estar aumentados, especialmente en el pulmón de los pacientes con sarcoidosis, no se trata de una expansión monoclonal o maligna de las células.","letters":["A","B","C","D","E"]},{"q":"En la exploración física de un varón de 42 años se observó el hallazgo que se muestra en la figura VIII--88. Todas las enfermedades mencionadas a continuación se asocian con este hallazgo EXCEPTO:","o":["Enfermedad pulmonar obstructiva crónica","Cardiopatía congénita cianótica","Fibrosis quística","Carcinoma hepatocelular","Hipertiroidismo"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 374) El hallazgo que se muestra en la figura VIII--88 es característico del hipocratismo digital. El hipocratismo digital se produce en las partes distales de los dedos y se caracteriza por el ensanchamiento de las yemas de los dedos, la convexidad del contorno de la uña y la pérdida del ángulo normal de 15 grados entre la porción proximal de la uña y la cutícula. Clínicamente, a veces puede ser difícil determinar si hay hipocratismo digital. El método para el diagnóstico del hipocratismo digital es medir el diámetro del dedo en la base de la uña y en la punta de los 10 dedos. Para cada dedo, se determina una relación entre la base de la uña y la punta del dedo. Si la suma de los 10 dedos es mayor que 1, entonces se confirma el diagnóstico de hipocratismo digital. Un método más sencillo es hacer que un individuo una las superficies dorsales de la porción distal del segundo al quinto dedos de las manos. En un individuo sano, debe haber un espacio en forma de diamante entre los dedos. Cuando un individuo tiene hipocratismo digital, este espacio desaparece. El hipocratismo digital ocurre con mayor frecuencia en la enfermedad pulmonar avanzada, en especial en bronquiectasias, fibrosis quística y neumopatías intersticiales como la sarcoidosis o la fibrosis pulmonar idiopática. El hipocratismo digital se describió originalmente en personas con empiema y puede ocurrir en infecciones pulmonares crónicas, como abscesos pulmonares, tuberculosis o infecciones micóticas. Las lesiones vasculares pulmonares y el cáncer de pulmón también se asocian con hipocratismo digital. Sin embargo, la enfermedad pulmonar obstructiva crónica no causa hipocratismo digital. Las causas de hipocratismo digital no se limitan únicamente a los pulmones. El hipocratismo digital puede ser una afección familiar benigna y también se asocia con diversos trastornos, como cardiopatía congénita cianótica; endocarditis bacteriana subaguda; enfermedad de Crohn; colitis ulcerosa; enfermedad celíaca y cáncer de esófago, hígado, intestino delgado y colon. En el hipertiroidismo no tratado, el hipocratismo digital puede ocurrir en asociación con periostitis en una afección llamada acropaquía tiroidea. Aunque se han descrito numerosas asociaciones clínicas durante muchos siglos, aún se desconoce la causa del hipocratismo digital.","letters":["A","B","C","D","E"]},{"q":"Se valora a un varón caucásico de 55 años con antecedentes de sarcoidosis. Se le acabó la prednisona hace dos meses y, a excepción de un poco de estreñimiento, se siente bien. Un panel metabólico reveló calcio de 12.2 mg/100 mL (normal hasta 10.5 mg/100 mL). Se sabe que la sarcoidosis se puede asociar con hipercalcemia. ¿Cuál de los siguientes es el mecanismo correcto para la hipercalcemia asociada con sarcoidosis?","o":["Afección granulomatosa directa del esqueleto axial que provoca la liberación de calcio de los huesos","Estimulación directa con aumento de la absorción intestinal de calcio","Aumento de la producción de hormonas paratiroideas","Aumento de la producción de 1, 25-dihidroxivitamina D","Aumento de la producción de 25-hidroxivitamina D"],"c":"D","e":"La respuesta es D. (Parte 12 Endocrinología y metabolismo, Sección 2 Medicina sexual y de género, cap. 397) La hipercalcemia, la hipercalciuria o ambas se producen en casi 10% de los pacientes con sarcoidosis. Es más común en caucásicos que en estadounidenses de raza negra y en varones. El mecanismo del metabolismo anormal del calcio es el aumento de la producción de 1, 25-dihidroxivitamina D por el propio granuloma. La 1, 25-dihidroxivitamina D provoca una mayor absorción intestinal de calcio, lo que provoca hipercalcemia con supresión de las concentraciones de hormona paratiroidea. El aumento de la vitamina D exógena por la dieta o la exposición a la luz solar puede agravar este problema. El calcio sérico debe determinarse como parte de la valoración inicial de todos los pacientes con sarcoidosis y una medición repetida puede ser útil durante los meses de verano con una mayor exposición solar.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 19 años acude a consulta por fiebre recurrente. Reporta varios años de evolución con fiebre, que ocurre en promedio cada dos a tres meses. Estos episodios son impredecibles, aunque ella piensa que pueden ocurrir en momentos de estrés psicológico. Cada episodio febril dura de dos a tres días. También tiene episodios recurrentes de dolor abdominal. Los hemocultivos repetidos han sido negativos, incluso durante los episodios febriles agudos. Del mismo modo, las tomografías computarizadas de abdomen no han mostrado una causa evidente para el dolor. Durante un episodio, se le realizó una laparotomía exploradora, que mostró adherencias peritoneales y exudado peritoneal neutrofílico estéril. También mencionó que cuando hace ejercicio, desarrolla intensos dolores musculares que duran días. Una búsqueda serológica extensa de autoanticuerpos arrojó resultados negativos, incluidos los anticuerpos antinucleares. ¿cuál de los siguientes fármacos reduciría las crisis y ayudaría a prevenir el desarrollo de amiloidosis sistémica?","o":["Colquicina","Ciclosporina","Prednisona","Rituximab","Vancomicina"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 369) El tratamiento preferido para la FMF es la colquicina diaria por VO, que disminuye la frecuencia e intensidad de las crisis e impide el desarrollo de amiloidosis en los pacientes con apego terapéutico. La dosificación intermitente al inicio de los ataques no es tan eficaz como la profilaxis diaria y no tiene utilidad comprobada para prevenir la amiloidosis. La dosis habitual de colquicina en adultos es de 1.2 a 1.8 mg por día, lo que provoca una reducción sustancial de los síntomas en casi 65% de los pacientes y mejora en \\> 90%. Los niños pueden necesitar dosis más bajas, aunque no proporcionales con el peso corporal.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 19 años acude a consulta por fiebre recurrente. Reporta varios años de evolución con fiebre, que ocurre en promedio cada dos a tres meses. Estos episodios son impredecibles, aunque ella piensa que pueden ocurrir en momentos de estrés psicológico. Cada episodio febril dura de dos a tres días. También tiene episodios recurrentes de dolor abdominal. Los hemocultivos repetidos han sido negativos, incluso durante los episodios febriles agudos. Del mismo modo, las tomografías computarizadas de abdomen no han mostrado una causa evidente para el dolor. Durante un episodio, se le realizó una laparotomía exploradora, que mostró adherencias peritoneales y exudado peritoneal neutrofílico estéril. También mencionó que cuando hace ejercicio, desarrolla intensos dolores musculares que duran días. Una búsqueda serológica extensa de autoanticuerpos arrojó resultados negativos, incluidos los anticuerpos antinucleares. ¿Cuál de los siguientes diagnósticos es el más probable?","o":["Fiebre mediterránea familiar","Linfoma","Fiebre recurrente","Endocarditis bacteriana subaguda","Lupus eritematoso sistémico"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 369) La fiebre mediterránea familiar (FMF) es el prototipo de un grupo de enfermedades hereditarias que se caracterizan por episodios recurrentes de fiebre con inflamación serosa, sinovial o cutánea. El gen FMF codifica una pirina (o marenostrina), una proteína de 781 aminoácidos, de casi 95 kDa, que se expresa en granulocitos, eosinófilos, monocitos, células dendríticas y fibroblastos sinoviales y peritoneales. Los episodios típicos de FMF suelen durar de 24 a 72 horas y los ataques artríticos tienden a durar un poco más. En algunos pacientes, los episodios ocurren con gran regularidad, pero más a menudo la frecuencia de las crisis varía con el tiempo, desde una vez cada pocos días a remisiones que duran varios años Las crisis por lo general son impredecibles, aunque algunos pacientes los relacionan con el esfuerzo físico, el estrés emocional o la menstruación; el embarazo puede estar asociado con la remisión. Si se cuantifica, la fiebre casi siempre está presente durante las crisis de FMF. Se puede observar hiperpirexia grave e incluso convulsiones febriles en lactantes y la fiebre a veces es la única manifestación de la FMF en los niños pequeños. Más de 90% de los pacientes con FMF experimenta crisis abdominales en algún momento. Los episodios varían en gravedad desde dolor sordo y continuo y distensión con dolor leve a la palpación hasta dolor intenso y generalizado con ausencia de ruidos intestinales, rigidez, dolor de rebote y niveles hidroaéreos en las radiografías en posición erecta. La tomografía computarizada puede mostrar una pequeña cantidad de líquido en la cavidad abdominal. Si estos pacientes se someten a laparotomía exploradora, se presenta un exudado peritoneal estéril rico en neutrófilos, en ocasiones con adherencias formadas en episodios previos. La ascitis es poco frecuente. La mialgia inducida por el ejercicio (no febril) es frecuente en la FMF y un pequeño porcentaje de pacientes presenta una mialgia febril prolongada que puede durar varias semanas.","letters":["A","B","C","D","E"]},{"q":"Se valora a un varón de 54 años por vasculitis cutánea y nefropatía periférica. Debido a la falla renal concomitante, se realizó biopsia renal que reportó glomerulonefritis. Se encontraron crioglobulinas en sangre periférica. ¿Cuál de los siguientes estudios de laboratorio debe enviarse para determinar la causa?","o":["Antígeno de superficie de la hepatitis B","Anticuerpos contra el citoplasma de neutrófilos","Reacción en cadena de la polimerasa para hepatitis C","Anticuerpos contra VIH","Factor reumatoide"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 363) Las manifestaciones más frecuentes de la vasculitis crioglobulinémica son la vasculitis cutánea, la artritis, la neuropatía periférica y la glomerulonefritis. La demostración de crioprecipitados circulantes es un componente crítico del diagnóstico y, a menudo, también se pueden encontrar factor reumatoide. Dado que la infección por hepatitis C está presente en la gran mayoría de los pacientes con vasculitis crioglobulinémica, se debe investigar la infección en todos los pacientes con este síndrome clínico.","letters":["A","B","C","D","E"]},{"q":"Todas las siguientes afirmaciones sobre los trastornos de inmunodeficiencia primaria son ciertas EXCEPTO:","o":["Las infecciones de las vías respiratorias altas o bajas sugieren una respuesta de anticuerpos defectuosa.","La mayor parte se diagnostican por la presencia de infecciones recurrentes o inusualmente graves.","Las infecciones recurrentes por Candida sp. sugieren deterioro de la respuesta inmunitaria mediada por linfocitos T.","Suelen ser enfermedades genéticas con patrón de herencia mendeliana.","Si bien puede participar la mayor parte de los aspectos del sistema inmunitario, la inmunidad innata no se ve afectada por estos trastornos."],"c":"E","e":"La respuesta es E. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 1 El sistema inmunitario en la salud y la enfermedad, cap. 351 y cap. 349) Cientos de productos génicos se han identificado como efectores o mediadores del sistema inmunitario. Cuando la expresión o función de alguno de estos productos se altera genéticamente (siempre que la función no sea redundante), se produce una inmunodeficiencia primaria (PID, primary immunodeficiency). Las PID son enfermedades genéticas con patrón de herencia principalmente mendeliano. Se han descrito más de 250 afecciones y se han identificado mutaciones nocivas en casi 210 genes (cuadro VIII--6). La prevalencia global de las DPI se ha estimado en varios países en cinco por cada 100 000 individuos; sin embargo, dada la dificultad para diagnosticar estas enfermedades raras y complejas, esta cifra es probablemente una subestimación. Las PID pueden incluir todos los aspectos posibles de las respuestas inmunitarias, desde innatas hasta adaptativas, diferenciación, función efectora y regulación celulares. En aras de claridad, las PID deben clasificarse según 1) la rama del sistema inmunitario defectuoso y 2) el mecanismo del defecto (cuando se conoce). Las consecuencias de las PID varían ampliamente en función de las moléculas defectuosas. Este concepto se traduce en múltiples niveles de vulnerabilidad a la infección por microorganismos patógenos y oportunistas, que van desde extremadamente amplios (como en la inmunodeficiencia combinada grave) hasta limitados a un solo microorganismo (como la susceptibilidad mendeliana a la enfermedad micobacteriana). La ubicación de los sitios de infección y los microorganismos causales implicados ayudarán a los médicos a llegar a diagnósticos adecuados. Las PID también pueden dar lugar a respuestas inmunopatológicas como alergia (como en el síndrome de Wiskott-Aldrich), linfoproliferación y autoinmunidad. Se puede observar una combinación de infecciones recurrentes, inflamación y autoinmunidad en varias PID, lo que crea desafíos terapéuticos evidentes. El síntoma más frecuente que lleva al diagnóstico de una PID es la presencia de infecciones recurrentes o inusualmente graves. Las infecciones de vías respiratorias (bronquios, senos paranasales) sugieren principalmente una respuesta defectuosa de anticuerpos. En general, las infecciones bacterianas invasoras pueden ser el resultado de deficiencias del complemento, defectos de señalización de las respuestas inmunitarias innatas, asplenia o respuestas defectuosas de anticuerpos. Las infecciones virales, las infecciones recurrentes por Candida y las infecciones oportunistas suelen sugerir una alteración de la inmunidad de los linfocitos T. Las infecciones cutáneas y los abscesos profundos reflejan principalmente defectos inmunitarios innatos (como la enfermedad granulomatosa crónica); sin embargo, también pueden aparecer en el síndrome de hiperIgE autosómico dominante. Por último, algunos PID aumentan el riesgo de cáncer, en particular, pero no exclusivamente, los cánceres linfocíticos (p. ej., linfoma). CUADRO VIII--6Clasificación de las enfermedades con inmunodeficiencia primaria ----------------------------------------------------------------------- **Deficiencias del sistema inmunitario innato** ----------------------------------- ----------------------------------- Células fagocíticas: - Deterioro de la producción: neutropenia congénita grave - Asplenia - Alteración de la adhesión: deficiencia de adhesión leucocítica - Deterioro de la destrucción: enfermedad granulomatosa crónica Receptores de inmunidad innata y transducción de señales: - Defectos en la señalización de los receptores tipo Toll - Susceptibilidad mendeliana a la enfermedad micobacteriana Deficiencias del complemento: - Vías clásica, alternativa y de lectina - Fase lítica Deficiencias del sistema inmunitario adaptativo Linfocitos T: - Deterioro del Inmunodeficiencia combinada grave: desarrollo - Deterioro de la Síndrome de DiGeorge supervivencia, migración y de la Inmunodeficiencias combinadas función Síndrome hiperIgE (autosómico dominante) Deficiencia de DOCK8 Deficiencia del ligando CD40, Síndrome de Wiskott-Aldrich Ataxia-telangiectasia y otras deficiencias en la reparación del DNA Linfocitos B: - Deterioro del Agammaglobulinemia XL y AR Síndrome desarrollo - Alteración de la de hiperIgM Inmunodeficiencia función variable común Deficiencia de IgA Defectos en la regulación Inmunidad innata Inmunidad Síndromes autoinflamatorios (fuera adaptativa del ámbito de este capítulo) Colitis grave Linfohistiocitosis hemofagocítica Síndrome linfoproliferativo autoinmunitario Autoinmunidad y enfermedades inflamatorias (IPEX, APECED) ----------------------------------------------------------------------- Abreviaturas: APECED: displasia ectodérmica, candidiosis, poliendocrinopatía autoinmunitaria; AR: autosómica recesiva; IPEX: síndrome de inmunodesregulación-poliendocrinopatía-enteropatía ligada al cromosoma X; XL, ligado al cromosoma X.","letters":["A","B","C","D","E"]},{"q":"Un varón de 18 años ingresó al hospital con dolor torácico subesternal opresivo, de inicio súbito 30 min antes. Reporta el dolor que irradia al cuello y al brazo derecho. Por lo demás, había estado sano. A la fecha toca la trompeta en su banda de música de secundaria, pero no participa regularmente en actividades aeróbicas. En la exploración física se encuentra diaforético y taquipnéico. Su presión arterial es de 100/48 y la frecuencia cardiaca es de 110 lpm. En la exploración del área cardiaca se encontró un ritmo regular, pero con taquicardia. Se ausculta un soplo holosistólico 2/6, que se percibe mejor en el vértice cardiaco y que se irradia hacia la axila. En los campos pulmonares se auscultan estertores bilaterales basales. El electrocardiograma muestra elevación del segmento ST de 4 mm de en las derivaciones precordiales. En la anamnesis detallada, el paciente informó que había sido hospitalizado por algún problema cardiaco cuando tenía dos años. Su madre, que lo acompaña, informó que recibió ácido acetilsalicílico y gammaglobulina como tratamiento. Desde entonces, ha requerido vigilancia intermitente con ecocardiografía. ¿Cuál es la causa más probable del síndrome coronario agudo de este paciente?","o":["Disección de la raíz aórtica y del orificio coronario izquierdo","Presencia de un puente miocárdico sobre la coronaria descendente anterior izquierda","Trombosis de un aneurisma de la arteria coronaria","Vasoespasmo tras ingestión de cocaína","Vasculitis que afecta a la arteria coronaria descendente anterior izquierda"],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 363) La causa más probable del síndrome coronario agudo en este paciente es la trombosis de un aneurisma de la arteria coronaria en un individuo con antecedentes de enfermedad de Kawasaki. La enfermedad de Kawasaki es una enfermedad multisistémica aguda que se presenta principalmente en niños menores de cinco años. Las manifestaciones clínicas en la infancia son linfadenitis cervical no supurativa; descamación de las yemas de los dedos; eritema de la cavidad bucal, labios y palmas de las manos. Casi 25% de los casos se asocian a aneurismas de las arterias coronarias que se presentan al final de la enfermedad en la etapa de convalecencia. El tratamiento precoz (en los siete a 10 días de su aparición) con inmunoglobulina vía IV y dosis altas de ácido acetilsalicílico disminuye el riesgo de desarrollar aneurismas coronarios a casi 5%. Aunque se desarrollen aneurismas de las arterias coronarias, es poco probable que la mayor parte de los casos cedan en el transcurso del primer año si el tamaño es de \\< 6 mm. Es poco probable que los aneurismas \\> 8 mm cedan espontáneamente. Las complicaciones de los aneurismas coronarios persistentes incluyen rotura, trombosis y recanalización y estenosis en el sitio de salida. La disección de la raíz aórtica y del orificio coronario es una causa frecuente de muerte en el síndrome de Marfan y también se puede observar con la aortitis por arteritis de Takayasu. En este paciente, no hay antecedentes de hipertensión, isquemia de las extremidades o síntomas sistémicos que sugieran vasculitis activa. Además, no hay otros síntomas isquémicos que serían de esperarse en la arteritis de Takayasu. El puente miocárdico que recubre una arteria coronaria se observa con frecuencia en la autopsia, pero es una causa inusual de isquemia. Se debe considerar la posibilidad del consumo de cocaína como causa de isquemia miocárdica en un individuo joven, pero dados los antecedentes, en este caso es una causa menos probable de isquemia.","letters":["A","B","C","D","E"]},{"q":"Una mujer de 28 años solicitó la valoración de su médico familiar por episodios recurrentes de urticaria y afirma que es \"alérgica al frío\". La paciente informó que durante más de 10 años ha desarrollado áreas de urticaria cuando se expone a temperaturas bajas, por lo general con afección de brazos y piernas. Nunca ha solicitado valoración y afirma que, en los últimos años, la aparición de la urticaria se ha vuelto más frecuente. Aparte de la exposición al frío, no puede identificar otros desencadenantes para el desarrollo de la urticaria. No tiene antecedentes de asma ni atopia. Niega intolerancia a los alimentos. Solo toma píldoras anticonceptivas, que ha tomado durante cinco años. Vive en una casa unifamiliar que fue construida hace dos años. En la exploración física se observa un habón lineal después de ser estimulada a lo largo de su antebrazo con un depresor lingual. Al colocar su mano en agua fría, su mano presentó eritema e hinchazón. Además, hay varias áreas con una reacción de habón y eritema en el brazo por encima del área de exposición al frío. ¿Cuál es el siguiente paso en el tratamiento de esta paciente?","o":["Valorar la presencia de anticuerpos contra tiroglobulina y antimicrosómicos","Verificación de las concentraciones de inhibidores de C1","Interrumpir la administración de píldoras anticonceptivas","Ofrecer tratamiento con cetirizina, 10 mg al día","Ofrecer tratamiento con ciproheptadina, 8 mg al día"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 352) Este paciente presenta síntomas de urticaria por frío, una reacción urticariforme dependiente de IgE por exposición al frío. Tras la exposición al frío, las lesiones urticariformes aparecen en las zonas expuestas y suelen durar \\< 2 h. La revisión histológica de la lesión urticariforme demostraría la desgranulación de los mastocitos con edema de los tejidos dérmicos y subcutáneos. En la exposición experimental al frío, como un baño de agua helada, puede demostrarse aumento de las concentraciones de histamina en la sangre venosa si se cuantifican en la extremidad expuesta a un ambiente frío, mientras que las concentraciones de histamina serían normales en una extremidad no expuesta. La aparición de un habón lineal tras la estimulación cutánea firme indica dermatografismo. Esta afección se puede observar en el 1% a 4% de la población y, a menudo, se encuentra en personas con urticaria por frío. En general, la urticaria por frío es un proceso localizado sin consecuencias adversas. Sin embargo, puede ocurrir colapso vascular si el individuo se sumerge en agua fría. Muchos individuos solicitan tratamiento porque se sienten avergonzados por su enfermedad o porque presentan síntomas por urticaria recurrente y prurito. El tratamiento con antagonistas de los receptores de histamina H1 no suele ser adecuado para el control de los síntomas. Puede añadirse al tratamiento ciproheptadina o hidroxizina si es inadecuado el tratamiento con antihistamínicos antagonistas de H1. En este paciente algún factor desencadenante evidente para la aparición de urticaria: la exposición al frío. Por lo tanto, no es necesaria ninguna valoración adicional. En la valoración y tratamiento de la urticaria crónica, es importante la identificación y eliminación de factores precipitantes. Posibles factores causales incluyen alimentos, pólenes, mohos y fármacos. En este caso, la urticaria apareció antes del consumo de anticonceptivos orales; por lo tanto, es poco probable que la interrupción de estos fármacos sea de utilidad. La cuantificación de los anticuerpos antitiroglobulina y antimicrosómicos puede ser de utilidad en individuos con urticaria crónica en los cuales no se identifica otra causa. La deficiencia de C1 o la presencia de inhibidores de C1 se presenta como angioedema recurrente más que como urticaria.","letters":["A","B","C","D","E"]},{"q":"Un varón de 40 años acude al servicio de urgencias por padecimiento de dos días de evolución con hemoptisis de bajo volumen. Informó que ha estado tosiendo de dos a cinco cucharadas de sangre al día; tiene dolor torácico leve, febrícula y pérdida de peso. Además, ha tenido casi un año con síntomas graves de las vías respiratorias altas, incluyendo epistaxis frecuente y secreción purulenta tratada con varios ciclos de antibióticos. Aparte de la hiperlipidemia leve, por lo demás está sano. Los únicos fármacos que recibe son ácido acetilsalicílico y lovastatina. En la exploración física se encontró deformidad del puente de la nariz en silla de montar. Sus signos vitales son normales y sus campos pulmonares están limpios. Una tomografía computarizada del tórax muestra varios nódulos con cavitación de 1 a 2 cm y el análisis de orina muestra la presencia de eritrocitos. ¿Cuál de las siguientes pruebas ofrece el mayor rendimiento diagnóstico para hacer el diagnóstico adecuado?","o":["Biopsia cutánea profunda","Biopsia renal percutánea","Angiografía pulmonar","Biopsia pulmonar quirúrgica","Biopsia de las vías respiratorias altas"],"c":"D","e":"La respuesta es D. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 2 Enfermedades mediadas por el sistema inmunitario, cap. 363) El paciente presenta síntomas clásicos de granulomatosis con poliangitis. La edad media al momento del diagnóstico es de 40 años y hay un predominio en varones. Los síntomas de las vías respiratorias altas por lo general son anteriores a los hallazgos pulmonares o renales e incluso pueden presentarse con perforación septal. El diagnóstico se realiza mediante la demostración de vasculitis granulomatosa necrosante en la biopsia. El tejido pulmonar ofrece los mejores resultados para el diagnóstico. La biopsia de las vías respiratorias altas suele mostrar la inflamación granulomatosa, pero con poca frecuencia muestra vasculitis. La biopsia renal puede mostrar la presencia de glomerulonefritis pauciinmunitaria.","letters":["A","B","C","D","E"]}]},"43":{"title":"Gota y otras artropatías por microcristales.","questions":[{"q":"Una mujer de 75 años acude a la clínica con la rodilla derecha hinchada. Niega fiebre, diaforesis nocturna u otros síntomas generales. No tiene dolor ni hinchazón en los dedos de los pies o en los tobillos. Niega haber tenido un episodio similar. Tiene antecedentes de osteoartrosis y se sometió a una artroplastia total de cadera izquierda hace cinco años. En la exploración física, su rodilla derecha está caliente con un derrame de tamaño moderado y dolorosa a la palpación. Los exámenes de laboratorio muestran una concentración de ácido úrico de 5.2 mg/100 mL (normal). Una radiografía de la rodilla muestra una imagen radiodensa lineal en el espacio articular compatible con condrocalcinosis. ¿Cuál es el diagnóstico más probable?","o":["Artritis por pirofosfato cálcico (seudogota)","Gota","Artritis reumatoide","Artritis séptica"],"c":"A","e":"La respuesta es A. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 372) La artropatía por depósito de pirofosfato cálcico (CPPD, calcium pyrophosphate deposition disease) puede ser asintomática, aguda, subaguda o crónica o puede causar sinovitis aguda superpuesta a las articulaciones con compromiso crónico. McCarty et al., denominaron seudogota a la artritis aguda por depósito de pirofosfato cálcico, por su sorprendente similitud con la gota. La rodilla es la articulación afectada con mayor frecuencia en la artropatía por CPPD. Otros sitios incluyen la muñeca, hombro, tobillo, codo y manos. Puede verse afectada la articulación temporomandibular. La evidencia clínica y radiográfica indica que el depósito de CPPD es poliarticular en al menos 65% de los pacientes. Si las radiografías o la ecografía revelan depósitos radiodensos puntiformes o lineales dentro del menisco de la articulación fibrocartilaginosa o del cartílago hialino articular (condrocalcinosis), la probabilidad diagnóstica de enfermedad de la CPPD aumenta aún más. El diagnóstico definitivo requiere la demostración de los típicos cristales romboides o en forma de bastón (por lo general con birrefringencia débil o no birrefringentes con luz polarizada) en el líquido sinovial o en el tejido articular. En ausencia de derrame articular o indicaciones para obtener una biopsia sinovial, la condrocalcinosis hace sospechar artropatía por depósito de pirofosfato cálcico. En pacientes con monoartritis inflamatoria por cristales como CPPD, se debe considerar la gota, así como la artritis séptica. Este paciente no presentaba otras características sugestivas de artritis séptica. Su edad, sexo y la condrocalcinosis hacen que la pseudogota sea más probable que la gota. La artritis reumatoide suele ser una poliartritis y se presenta comúnmente en la tercera a la quinta década de vida.","letters":["A","B","C","D"]},{"q":"Un hombre de 52 años acudió con su médico familiar por dolor de inicio reciente en los nudillos de los dedos índice y medio de ambas manos. En la exploración física, la segunda y tercera articulaciones metacarpofalángicas (MCP) de ambas manos están hinchadas y dolorosas a la palpación. El resto de la exploración física es normal. Entre sus antecedentes resalta hiperlipidemia controlada con atorvastatina. Los resultados de laboratorio reportaron ferritina elevada y tras la demostración de una mutación del gen HFE, se le diagnosticó hemocromatosis. ¿Cuál de las siguientes afirmaciones sobre sus anomalías articulares es verdadera?","o":["La segunda y tercera articulaciones metacarpofalángicas también suelen estar afectadas en la osteoartrosis.","Es poco probable que la artropatía esté relacionada con la hemocromatosis.","La artropatía puede progresar con la flebotomía.","La artropatía ocurre en menos de 20% de los pacientes con hemocromatosis.","Es probable que las radiografías muestren erosiones en las articulaciones metacarpofalángicas."],"c":"C","e":"La respuesta es C. (Parte 11 Trastornos mediados por mecanismos inmunitarios, inflamatorios y reumatológicos, Sección 3 Trastornos de las articulaciones y tejidos adyacentes, cap. 374) Los síntomas de la hemocromatosis suelen comenzar entre los 40 y los 60 años, pero pueden aparecer antes. La artropatía, que ocurre en 20% a 40% de los pacientes, suele comenzar después de los 50 años y puede ser la primera característica clínica de la hemocromatosis. La artropatía es un trastorno similar a la osteoartrosis que afecta a las articulaciones pequeñas de las manos y, más tarde a las articulaciones más grandes, como rodillas, tobillos, hombros y caderas. La segunda y tercera articulaciones metacarpofalángicas de ambas manos suelen ser las primeras y más prominentes articulaciones afectadas; este cuadro clínico puede proporcionar un indicio importante sobre la posibilidad de hemocromatosis porque estas articulaciones no se ven afectadas predominantemente por la osteoartrosis corriente. Los pacientes experimentan rigidez matutina y dolor con uso de las articulaciones afectadas. Las articulaciones afectadas están agrandadas y ligeramente dolorosas a la palpación. Las radiografías muestran estrechamiento del espacio articular, esclerosis subcondral, quistes subcondrales y proliferación yuxtaarticular del hueso. Los osteofitos \"en pico de loro\" se observan hasta en 20% de los pacientes; aunque se consideran un rasgo característico de la hemocromatosis, también pueden presentarse en la osteoartrosis y no son específicas de la enfermedad. Las erosiones óseas son típicas de la artritis reumatoide, no de la
